<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JLPT N3 單字・文法</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#c0392b; --accent2:#8e44ad;
  --paper:#fbf7f0; --card:#ffffff; --ink:#2b2320; --sub:#6f635b;
  --line:#e7ddcf; --chip:#f1e9dc; --ok:#1e8449; --shadow:0 2px 8px rgba(80,50,30,.08);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  line-height:1.6; -webkit-text-size-adjust:100%;
}
.jp{font-family:"Noto Serif JP","Hiragino Mincho ProN",serif;}
header.top{
  position:sticky; top:0; z-index:30; background:rgba(251,247,240,.96);
  backdrop-filter:blur(6px); border-bottom:1px solid var(--line);
}
.top-in{max-width:1080px;margin:0 auto;padding:12px 16px 0}
.top h1{font-size:1.15rem;margin:0 0 2px;font-weight:700}
.top p{margin:0;color:var(--sub);font-size:.82rem}
.head-row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.head-title{min-width:0}
.head-tools{display:flex;gap:8px;align-items:center;flex:0 0 auto}
.tabs{display:flex;gap:6px;margin-top:10px;flex-wrap:nowrap}
.tab{
  appearance:none;border:1px solid var(--line);background:var(--card);color:var(--sub);
  padding:7px 12px;border-radius:10px 10px 0 0;font-size:1.02rem;font-weight:600;cursor:pointer;
  border-bottom:none;transition:.15s;white-space:nowrap;flex:0 0 auto;
}
.tab.active{color:#fff;background:var(--accent);border-color:var(--accent)}
.toolbar{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search{width:auto;max-width:70vw;display:inline-flex;align-items:center;gap:8px;background:var(--card);
  border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.search input{border:none;outline:none;background:none;font-size:.95rem;color:var(--ink);
  field-sizing:content;width:auto;min-width:2em;max-width:60vw}
.btn-stop{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--sub);
  padding:8px 14px;border-radius:10px;font-weight:600;cursor:pointer}
.btn-stop:hover{border-color:var(--accent);color:var(--accent)}
.chipnav{max-width:1080px;margin:0 auto;padding:0 16px 6px;display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.chipnav a{white-space:nowrap;text-decoration:none;font-size:.8rem;color:var(--sub);
  background:var(--chip);border:1px solid var(--line);padding:5px 11px;border-radius:999px}
.chipnav a:hover{color:var(--accent);border-color:var(--accent)}
main{max-width:1080px;margin:0 auto;padding:8px 16px 80px}
.cat{margin:26px 0 8px;scroll-margin-top:150px}
.cat-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  border-bottom:2px solid var(--accent);padding-bottom:8px;margin-bottom:14px}
.cat-h h2{font-size:1.15rem;margin:0;font-weight:700}
.cat-h .cnt{color:var(--sub);font-size:.8rem;font-weight:500}
.play-all{appearance:none;cursor:pointer;margin-left:auto;border:1px solid var(--accent);
  color:var(--accent);background:transparent;border-radius:999px;padding:6px 14px;font-weight:600;font-size:.85rem;
  display:inline-flex;align-items:center;gap:6px;transition:.15s}
.play-all:hover{background:var(--accent);color:#fff}
.play-all.playing{background:var(--accent);color:#fff}
.play-all.playing .ico::before{content:"■"}
.play-all .ico::before{content:"▶"}
.play-zhja{border-color:var(--accent2);color:var(--accent2)}
.play-zhja:hover{background:var(--accent2);color:#fff}
.play-zhja.playing{background:var(--accent2);color:#fff}
.subhead{font-size:.9rem;font-weight:700;color:var(--accent2);margin:16px 0 8px;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;scroll-margin-top:150px}
.subhead::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;
  box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.card-top{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.word{font-size:1.5rem;font-weight:700;line-height:1.2;cursor:pointer;border:none;background:none;
  color:var(--ink);padding:0;font-family:"Noto Serif JP",serif;text-align:left}
.word:hover{color:var(--accent)}
.idx-badge{color:var(--sub);font-size:.85rem;font-weight:600;margin-right:4px}
.word::after{content:"🔊";font-size:.7rem;margin-left:5px;opacity:.4;vertical-align:middle}
.word:hover::after{opacity:.9}
.word.playing{color:var(--accent);text-decoration:underline}
.kana{color:var(--sub);font-size:.9rem}
.romaji{color:#b7a99a;font-size:.76rem;font-style:italic}
.mean{color:var(--ink);font-size:.92rem}
.mean b{color:var(--accent);font-weight:600}
.ex{margin-top:2px;padding:9px 11px;background:var(--paper);border-radius:10px;border:1px solid var(--line)}
.ex-line{display:flex;align-items:flex-start;gap:8px}
.ex-ja{flex:1;font-family:"Noto Serif JP",serif;font-size:1.02rem;font-weight:600}
.ex-kana{color:var(--sub);font-size:.82rem;margin-top:2px}
.ex-zh{color:var(--sub);font-size:.85rem;margin-top:1px}
.say{appearance:none;flex:none;cursor:pointer;width:30px;height:30px;border-radius:50%;
  border:1px solid var(--accent);color:var(--accent);background:#fff;font-size:.8rem;line-height:1;
  display:inline-flex;align-items:center;justify-content:center;transition:.15s}
.say:hover{background:var(--accent);color:#fff}
.say.playing{background:var(--accent);color:#fff;animation:pulse 1s infinite}
.say::before{content:"▶"}
.say.playing::before{content:"■"}
@keyframes pulse{50%{opacity:.55}}
/* ch3 */
.k-onkun{display:flex;gap:14px;flex-wrap:wrap;font-size:.86rem;color:var(--sub)}
.k-onkun b{color:var(--ink);font-weight:600;margin-right:3px}
.k-rei{font-family:"Noto Serif JP",serif;font-size:.95rem;color:var(--ink)}
.k-rei-line{font-size:.84rem;color:var(--sub);font-family:"Noto Serif JP",serif}
.rei-lbl{display:inline-block;font-family:"Noto Sans TC",sans-serif;font-size:.7rem;
  color:var(--accent2);border:1px solid var(--accent2);border-radius:5px;padding:0 5px;margin-right:6px;vertical-align:middle}
/* 形容詞反義配對 */
.ant{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:6px;padding-top:8px;border-top:1px dashed var(--line)}
.ant-mark{font-size:.7rem;color:var(--accent2);border:1px solid var(--accent2);border-radius:5px;padding:0 6px;font-family:"Noto Sans TC",sans-serif}
.ant .word{font-size:1.2rem}
.ex-ant .ex-ja{font-weight:600}
.ex-ant{border-style:dashed}
/* 五十音卡 */
.kana-card .word{font-size:2.3rem}
.kana-card .card-top{align-items:center}
/* 五十音例句卡（50 tab） */
.k50-row2{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.k50-zh{color:var(--ink);font-size:.92rem}
.hidden{display:none !important}
.empty-note{color:var(--sub);text-align:center;padding:30px}
footer{max-width:1080px;margin:0 auto;padding:16px;color:var(--sub);font-size:.78rem;border-top:1px solid var(--line)}
@media (max-width:640px){
  /* 標題與搜尋維持同一列，搜尋靠右、不換行 */
  .head-row{align-items:center;gap:10px}
  .search input{min-width:0;max-width:52vw}
}
@media (max-width:520px){
  .word{font-size:1.35rem}
  .grid{grid-template-columns:1fr}
  .top h1{font-size:1.02rem}
  .tabs{gap:5px}
  .tab{padding:6px 9px;font-size:.95rem}
}
@media (prefers-reduced-motion:reduce){.say.playing{animation:none}}

/* 文法卡 */
.gram-card .word{font-size:1.25rem}
.g-conn{display:flex;gap:8px;flex-wrap:wrap;font-size:.84rem;color:var(--sub);align-items:baseline}
.g-conn b{color:var(--ink);font-weight:600}

/* 回到最上面 */
.fab{
  position:fixed;right:22px;bottom:24px;z-index:60;
  width:46px;height:46px;border:none;border-radius:50%;cursor:pointer;
  background:linear-gradient(120deg,var(--accent),var(--accent2));color:#fff;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 18px rgba(0,0,0,.22);
  opacity:0;visibility:hidden;transform:translateY(10px);
  transition:opacity .25s,transform .25s,visibility .25s,box-shadow .15s;
}
.fab.show{opacity:1;visibility:visible;transform:translateY(0);}
.fab:hover{box-shadow:0 8px 22px rgba(0,0,0,.3);}
.fab:active{transform:scale(.92);}
.fab:focus-visible{outline:2px solid #fff;outline-offset:2px;}
.fab svg{width:20px;height:20px;fill:currentColor;}
@media(max-width:640px){.fab{right:14px;bottom:16px;width:42px;height:42px;}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="head-row">
      <div class="head-title"><h1>JLPT N3 單字・文法</h1></div>
      <div class="head-tools">
        <label class="search"><span aria-hidden="true">🔍</span>
          <input id="q" type="search" placeholder="搜尋…" autocomplete="off"></label>
      </div>
    </div>
    <div class="tabs">
      <button class="tab active" data-ch="vocab">單字</button>
      <button class="tab" data-ch="grammar">文法</button>
    </div>
  </div>
  <nav class="chipnav" id="chipnav"></nav>
</header>
<main id="main"></main>
<footer>
  <p id="voiceNote"></p>
  <p>發音使用瀏覽器語音合成（Web Speech API，ja-JP）。若無日文語音，請於作業系統或瀏覽器安裝日語語音包；行動裝置需點擊後才會發聲。</p>
</footer>
<script>

動詞辞書形／ない形＋ようにする", "m": "設法…；儘量做到", "ex": "これからは毎日運動するようにします。", "exk": "これからはまいにちうんどうするようにします。", "exm": "今後我會儘量每天運動。"}, {"p": "〜ようにしている", "c": "動詞辞書形／ない形＋ようにしている", "m": "一直努力做到…（習慣）", "ex": "甘い物は食べないようにしている。", "exk": "あまいものはたべないようにしている。", "exm": "我一直盡量不吃甜食。"}, {"p": "〜ようになる", "c": "動詞辞書形／可能形＋ようになる", "m": "（變得）會…了；開始…", "ex": "練習して、泳げるようになった。", "exk": "れんしゅうして、およげるようになった。", "exm": "練習之後變得會游泳了。"}, {"p": "〜なくなる", "c": "動詞ない形＋なくなる", "m": "變得不…了", "ex": "最近、外食しなくなった。", "exk": "さいきん、がいしょくしなくなった。", "exm": "最近變得不外食了。"}, {"p": "〜ことにする", "c": "動詞辞書形／ない形＋ことにする", "m": "決定…（自己的意志）", "ex": "来月から禁煙することにした。", "exk": "らいげつからきんえんすることにした。", "exm": "決定從下個月開始戒菸。"}, {"p": "〜ことにしている", "c": "動詞辞書形／ない形＋ことにしている", "m": "習慣…（自己決定並堅持）", "ex": "毎朝六時に起きることにしている。", "exk": "まいあさろくじにおきることにしている。", "exm": "我習慣每天早上六點起床。"}, {"p": "〜ことになる", "c": "動詞辞書形／ない形＋ことになる", "m": "（非個人意志）決定…", "ex": "四月から大阪に転勤することになった。", "exk": "しがつからおおさかにてんきんすることになった。", "exm": "被安排四月起調到大阪。"}, {"p": "〜ことになっている", "c": "動詞辞書形／ない形＋ことになっている", "m": "規定…；預定…", "ex": "校内では日本語を話すことになっている。", "exk": "こうないではにほんごをはなすことになっている。", "exm": "校內規定要說日語。"}, {"p": "〜つもりだ", "c": "動詞辞書形／ない形＋つもりだ", "m": "打算…", "ex": "夏休みに国へ帰るつもりだ。", "exk": "なつやすみにくにへかえるつもりだ。", "exm": "打算暑假回國。"}, {"p": "〜つもりはない", "c": "動詞辞書形＋つもりはない", "m": "沒有…的打算", "ex": "彼を許すつもりはない。", "exk": "かれをゆるすつもりはない。", "exm": "我沒有原諒他的打算。"}, {"p": "〜予定だ", "c": "名詞の／動詞辞書形＋予定だ", "m": "預定…", "ex": "会議は三時から始まる予定だ。", "exk": "かいぎはさんじからはじまるよていだ。", "exm": "會議預定三點開始。"}, {"p": "〜ようと思う", "c": "動詞意向形＋(よ)うと思う", "m": "想要…（打算）", "ex": "来年、留学しようと思っている。", "exk": "らいねん、りゅうがくしようとおもっている。", "exm": "我打算明年留學。"}, {"p": "〜ようとする", "c": "動詞意向形＋(よ)うとする", "m": "正打算…；試圖…", "ex": "出かけようとしたとき、電話が鳴った。", "exk": "でかけようとしたとき、でんわがなった。", "exm": "正要出門時電話響了。"}, {"p": "〜べきだ", "c": "動詞辞書形＋べきだ", "m": "應該…", "ex": "約束は守るべきだ。", "exk": "やくそくはまもるべきだ。", "exm": "應該遵守約定。"}, {"p": "〜べきではない", "c": "動詞辞書形＋べきではない", "m": "不該…", "ex": "人の悪口を言うべきではない。", "exk": "ひとのわるぐちをいうべきではない。", "exm": "不該說別人的壞話。"}]}]}, {"title": "N3文法 2 ｜ 條件・假定", "groups": [{"sub": "", "items": [{"p": "〜ば", "c": "動詞ば形／い形ければ／な形なら", "m": "如果…就（一般條件）", "ex": "ボタンを押せば、ドアが開く。", "exk": "ぼたんをおせば、どあがひらく。", "exm": "按下按鈕門就會開。"}, {"p": "〜たら", "c": "動詞た形／い形かった／な形・名詞だった＋ら", "m": "如果…；…之後", "ex": "駅に着いたら、電話してください。", "exk": "えきについたら、でんわしてください。", "exm": "到車站後請打電話給我。"}, {"p": "〜なら", "c": "名詞／動詞辞書形＋なら", "m": "如果是…的話（前提）", "ex": "京都へ行くなら、電車が便利だ。", "exk": "きょうとへいくなら、でんしゃがべんりだ。", "exm": "如果要去京都，電車很方便。"}, {"p": "〜と（条件）", "c": "動詞辞書形／ない形＋と", "m": "一…就（必然）", "ex": "春になると、桜が咲く。", "exk": "はるになると、さくらがさく。", "exm": "一到春天櫻花就會開。"}, {"p": "〜ば〜ほど", "c": "動詞ば形＋辞書形＋ほど", "m": "越…越…", "ex": "考えれば考えるほど、分からなくなる。", "exk": "かんがえればかんがえるほど、わからなくなる。", "exm": "越想越不懂。"}, {"p": "〜さえ〜ば", "c": "名詞＋さえ＋動詞ば形", "m": "只要…就…", "ex": "薬さえ飲めば、すぐ治る。", "exk": "くすりさえのめば、すぐなおる。", "exm": "只要吃藥馬上就會好。"}, {"p": "〜としたら／とすれば", "c": "名詞だ／普通形＋としたら／とすれば", "m": "假如…的話", "ex": "宝くじが当たったとしたら、何を買う？", "exk": "たからくじがあたったとしたら、なにをかう？", "exm": "假如中了樂透，你會買什麼？"}, {"p": "〜たとえ〜ても", "c": "たとえ＋動詞て形／い形くて＋も", "m": "即使…也", "ex": "たとえ雨が降っても、試合は行う。", "exk": "たとえあめがふっても、しあいはおこなう。", "exm": "即使下雨也照常比賽。"}, {"p": "〜としても", "c": "名詞だ／普通形＋としても", "m": "即使…也", "ex": "本当だとしても、信じられない。", "exk": "ほんとうだとしても、しんじられない。", "exm": "即使是真的也難以相信。"}, {"p": "〜ないと（いけない）", "c": "動詞ない形＋と(いけない／だめだ)", "m": "不…不行；必須…", "ex": "もう行かないと。", "exk": "もういかないと。", "exm": "我得走了。"}, {"p": "〜ばよかった", "c": "動詞ば形＋よかった", "m": "早知道就…（後悔）", "ex": "傘を持ってくればよかった。", "exk": "かさをもってくればよかった。", "exm": "早知道就帶傘來了。"}, {"p": "〜ばいい", "c": "動詞ば形＋いい", "m": "只要…就好；該…就", "ex": "分からなければ、先生に聞けばいい。", "exk": "わからなければ、せんせいにきけばいい。", "exm": "不懂的話問老師就好。"}, {"p": "〜たら（発見）", "c": "動詞た形＋ら〜た", "m": "…之後（發現意外情況）", "ex": "部屋に入ったら、誰もいなかった。", "exk": "へやにはいったら、だれもいなかった。", "exm": "進房間一看，一個人也沒有。"}, {"p": "〜たって", "c": "動詞た形／い形くた＋って", "m": "即使…也（口語）", "ex": "今から急いだって、間に合わない。", "exk": "いまからいそいだって、まにあわない。", "exm": "現在就算趕也來不及。"}]}]}, {"title": "N3文法 3 ｜ 原因・理由・目的", "groups": [{"sub": "", "items": [{"p": "〜ので", "c": "普通形（な形な／名詞な）＋ので", "m": "因為…（客觀）", "ex": "用事があるので、お先に失礼します。", "exk": "ようじがあるので、おさきにしつれいします。", "exm": "因為有事，我先告辭了。"}, {"p": "〜ものだから", "c": "普通形＋ものだから", "m": "因為…（辯解）", "ex": "道が込んでいたものだから、遅れました。", "exk": "みちがこんでいたものだから、おくれました。", "exm": "因為路上塞車所以遲到了。"}, {"p": "〜ため（に）", "c": "名詞の／動詞辞書・た形＋ため(に)", "m": "因為…（原因）", "ex": "事故のため、電車が遅れた。", "exk": "じこのため、でんしゃがおくれた。", "exm": "由於事故，電車誤點了。"}, {"p": "〜おかげで", "c": "名詞の／普通形＋おかげで", "m": "多虧…（好結果）", "ex": "先生のおかげで、合格できた。", "exk": "せんせいのおかげで、ごうかくできた。", "exm": "多虧老師，我才能考上。"}, {"p": "〜せいで", "c": "名詞の／普通形＋せいで", "m": "都怪…（壞結果）", "ex": "彼のせいで、計画が失敗した。", "exk": "かれのせいで、けいかくがしっぱいした。", "exm": "都怪他，計畫失敗了。"}, {"p": "〜せいか", "c": "名詞の／普通形＋せいか", "m": "也許是因為…", "ex": "年のせいか、疲れやすい。", "exk": "としのせいか、つかれやすい。", "exm": "也許是上了年紀，容易疲倦。"}, {"p": "〜ことだから", "c": "名詞の＋ことだから", "m": "因為是…（所以想必）", "ex": "まじめな彼のことだから、きっと来る。", "exk": "まじめなかれのことだから、きっとくる。", "exm": "因為是認真的他，一定會來。"}, {"p": "〜によって（原因）", "c": "名詞＋によって", "m": "由於…（原因）", "ex": "地震によって、多くの家が壊れた。", "exk": "じしんによって、おおくのいえがこわれた。", "exm": "由於地震，許多房屋倒塌了。"}, {"p": "〜ように（目的）", "c": "動詞辞書形／可能形／ない形＋ように", "m": "為了…（無意志/能力）", "ex": "よく見えるように、前に座った。", "exk": "よくみえるように、まえにすわった。", "exm": "為了看得清楚，坐到了前面。"}, {"p": "〜ために（目的）", "c": "名詞の／動詞辞書形＋ために", "m": "為了…（意志目的）", "ex": "留学するために、お金をためている。", "exk": "りゅうがくするために、おかねをためている。", "exm": "為了留學正在存錢。"}, {"p": "〜のに（用途）", "c": "動詞辞書形＋のに", "m": "用來…（用途）", "ex": "この道具は缶を開けるのに使う。", "exk": "このどうぐはかんをあけるのにつかう。", "exm": "這工具是用來開罐頭的。"}, {"p": "〜には（目的）", "c": "動詞辞書形＋には", "m": "要…（就需要）", "ex": "日本語を上達させるには、練習が必要だ。", "exk": "にほんごをじょうたつさせるには、れんしゅうがひつようだ。", "exm": "要讓日語進步，就需要練習。"}, {"p": "〜ことから", "c": "普通形＋ことから", "m": "由於…（緣由、根據）", "ex": "窓が割れていることから、泥棒が入ったと分かった。", "exk": "まどがわれていることから、どろぼうがはいったとわかった。", "exm": "從窗戶破了看出有小偷闖入。"}, {"p": "〜わけだ", "c": "普通形＋わけだ", "m": "難怪…；也就是說", "ex": "一年も住んでいたのか。日本語が上手なわけだ。", "exk": "いちねんもすんでいたのか。にほんごがじょうずなわけだ。", "exm": "原來住了一年啊，難怪日語這麼好。"}, {"p": "〜もの／もん", "c": "文＋もの／もん", "m": "因為…嘛（辯解，口語）", "ex": "だって、知らなかったんだもの。", "exk": "だって、しらなかったんだもの。", "exm": "因為我不知道嘛。"}]}]}, {"title": "N3文法 4 ｜ 逆接・對比", "groups": [{"sub": "", "items": [{"p": "〜のに", "c": "普通形（な形な／名詞な）＋のに", "m": "明明…卻", "ex": "約束したのに、来なかった。", "exk": "やくそくしたのに、こなかった。", "exm": "明明約好了卻沒來。"}, {"p": "〜くせに", "c": "名詞の／普通形＋くせに", "m": "明明…卻（不滿、責備）", "ex": "知っているくせに、教えてくれない。", "exk": "しっているくせに、おしえてくれない。", "exm": "明明知道卻不告訴我。"}, {"p": "〜ながら（も）", "c": "動詞ます形／い形／な形／名詞＋ながら(も)", "m": "雖然…卻", "ex": "貧しいながらも、幸せに暮らしている。", "exk": "まずしいながらも、しあわせにくらしている。", "exm": "雖然貧窮卻過得幸福。"}, {"p": "〜わりに（は）", "c": "名詞の／普通形＋わりに(は)", "m": "與…不相稱；雖然…卻", "ex": "値段のわりに、おいしい。", "exk": "ねだんのわりに、おいしい。", "exm": "以這價格來說算好吃。"}, {"p": "〜一方（で）", "c": "普通形＋一方(で)", "m": "一方面…另一方面；然而", "ex": "物価は上がる一方で、給料は増えない。", "exk": "ぶっかはあがるいっぽうで、きゅうりょうはふえない。", "exm": "物價不斷上漲，薪水卻不增加。"}, {"p": "〜に対して（對比）", "c": "名詞（な）／普通形（な形な）＋のに対して", "m": "相對於…", "ex": "兄が静かなのに対して、弟は活発だ。", "exk": "あにがしずかなのにたいして、おとうとはかっぱつだ。", "exm": "相對於哥哥的安靜，弟弟很活潑。"}, {"p": "〜反面", "c": "普通形（な形な／名詞である）＋反面", "m": "…的另一面；相反地", "ex": "この仕事は大変な反面、やりがいがある。", "exk": "このしごとはたいへんなはんめん、やりがいがある。", "exm": "這份工作辛苦的另一面是很有成就感。"}, {"p": "〜ところが", "c": "文。ところが＋文", "m": "然而（接續詞）", "ex": "薬を飲んだ。ところが、熱は下がらなかった。", "exk": "くすりをのんだ。ところが、ねつはさがらなかった。", "exm": "吃了藥，然而燒卻沒退。"}, {"p": "〜それでも", "c": "文。それでも＋文", "m": "儘管如此", "ex": "何度も注意された。それでも、彼は続けた。", "exk": "なんどもちゅういされた。それでも、かれはつづけた。", "exm": "被提醒了好幾次，儘管如此他還是繼續。"}, {"p": "〜かわりに", "c": "名詞の／動詞辞書・た形＋かわりに", "m": "代替…；相對地", "ex": "肉のかわりに、豆腐を使う。", "exk": "にくのかわりに、とうふをつかう。", "exm": "用豆腐代替肉。"}, {"p": "〜どころか", "c": "名詞／普通形＋どころか", "m": "別說…反而", "ex": "お礼どころか、文句を言われた。", "exk": "おれいどころか、もんくをいわれた。", "exm": "別說道謝，反而被抱怨了。"}, {"p": "〜わけではない", "c": "普通形＋わけではない", "m": "並不是…", "ex": "彼が嫌いなわけではない。", "exk": "かれがきらいなわけではない。", "exm": "我並不是討厭他。"}, {"p": "〜ことは〜が", "c": "同一語＋ことは＋同一語＋が", "m": "…是…但（保留）", "ex": "行くことは行くが、あまり気が進まない。", "exk": "いくことはいくが、あまりきがすすまない。", "exm": "去是會去，但不太想去。"}, {"p": "〜からといって", "c": "普通形＋からといって", "m": "不能因為…就", "ex": "安いからといって、買いすぎてはいけない。", "exk": "やすいからといって、かいすぎてはいけない。", "exm": "不能因為便宜就買太多。"}]}]}, {"title": "N3文法 5 ｜ 樣態・推量・傳聞", "groups": [{"sub": "", "items": [{"p": "〜そうだ（樣態）", "c": "動詞ます形／い形・な形語幹＋そうだ", "m": "看起來…；快要…", "ex": "空が暗くて、雨が降りそうだ。", "exk": "そらがくらくて、あめがふりそうだ。", "exm": "天色暗，看起來要下雨了。"}, {"p": "〜そうだ（傳聞）", "c": "普通形＋そうだ", "m": "聽說…", "ex": "天気予報によると、明日は雪だそうだ。", "exk": "てんきよほうによると、あしたはゆきだそうだ。", "exm": "據天氣預報說，明天會下雪。"}, {"p": "〜ようだ", "c": "名詞の／普通形＋ようだ", "m": "好像…（依據判斷）", "ex": "熱がある。風邪をひいたようだ。", "exk": "ねつがある。かぜをひいたようだ。", "exm": "有點發燒，好像感冒了。"}, {"p": "〜みたいだ", "c": "名詞／普通形＋みたい(だ)", "m": "好像…（口語）", "ex": "玄関に誰かいるみたいだ。", "exk": "げんかんにだれかいるみたいだ。", "exm": "玄關好像有人。"}, {"p": "〜らしい（推量・傳聞）", "c": "名詞／普通形＋らしい", "m": "好像…；聽說", "ex": "彼は来月結婚するらしい。", "exk": "かれはらいげつけっこんするらしい。", "exm": "聽說他下個月要結婚。"}, {"p": "〜らしい（典型）", "c": "名詞＋らしい", "m": "有…的樣子；像樣的", "ex": "今日は春らしい暖かさだ。", "exk": "きょうははるらしいあたたかさだ。", "exm": "今天有著春天般的溫暖。"}, {"p": "〜はずだ", "c": "普通形（な形な／名詞の）＋はずだ", "m": "應該…（推斷）", "ex": "彼はもう着いているはずだ。", "exk": "かれはもうついているはずだ。", "exm": "他應該已經到了。"}, {"p": "〜はずがない", "c": "普通形＋はずがない", "m": "不可能…", "ex": "そんなことがあるはずがない。", "exk": "そんなことがあるはずがない。", "exm": "不可能有那種事。"}, {"p": "〜はずだった", "c": "普通形＋はずだった", "m": "本應…（卻沒有）", "ex": "今日届くはずだったのに、まだ来ない。", "exk": "きょうとどくはずだったのに、まだこない。", "exm": "本應今天送到卻還沒來。"}, {"p": "〜にちがいない", "c": "普通形＋にちがいない", "m": "一定…（確信）", "ex": "この字は彼が書いたにちがいない。", "exk": "このじはかれがかいたにちがいない。", "exm": "這字一定是他寫的。"}, {"p": "〜かもしれない", "c": "普通形＋かもしれない", "m": "也許…", "ex": "約束を忘れているかもしれない。", "exk": "やくそくをわすれているかもしれない。", "exm": "他也許忘了約定。"}, {"p": "〜のではないか", "c": "普通形＋のではないか", "m": "是不是…（委婉推測）", "ex": "彼は反対するのではないか。", "exk": "かれははんたいするのではないか。", "exm": "他是不是會反對呢。"}, {"p": "〜わけがない", "c": "普通形＋わけがない", "m": "不可能…", "ex": "あれだけ練習したのだから、負けるわけがない。", "exk": "あれだけれんしゅうしたのだから、まけるわけがない。", "exm": "練習了那麼多，不可能會輸。"}, {"p": "〜のようだ（比喩）", "c": "名詞＋のようだ", "m": "宛如…（比喻）", "ex": "彼女はまるで天使のようだ。", "exk": "かのじょはまるでてんしのようだ。", "exm": "她宛如天使一般。"}, {"p": "〜そうにない", "c": "動詞ます形＋そうにない／そうもない", "m": "看起來不會…", "ex": "今日中に終わりそうにない。", "exk": "きょうじゅうにおわりそうにない。", "exm": "今天之內看來做不完。"}, {"p": "〜とか", "c": "普通形＋とか", "m": "聽說…（不確定傳聞）", "ex": "彼はもう帰ったとか。", "exk": "かれはもうかえったとか。", "exm": "聽說他好像已經回去了。"}]}]}, {"title": "N3文法 6 ｜ 授受・使役・受身・願望", "groups": [{"sub": "", "items": [{"p": "〜てあげる", "c": "動詞て形＋あげる", "m": "（為別人）做…", "ex": "友達に道を教えてあげた。", "exk": "ともだちにみちをおしえてあげた。", "exm": "我告訴了朋友怎麼走。"}, {"p": "〜てくれる", "c": "動詞て形＋くれる", "m": "（別人為我）做…", "ex": "兄が宿題を手伝ってくれた。", "exk": "あにがしゅくだいをてつだってくれた。", "exm": "哥哥幫我做了作業。"}, {"p": "〜てもらう", "c": "動詞て形＋もらう", "m": "請（別人）做…", "ex": "先生に作文を直してもらった。", "exk": "せんせいにさくぶんをなおしてもらった。", "exm": "我請老師幫我改了作文。"}, {"p": "〜てさしあげる", "c": "動詞て形＋さしあげる", "m": "（謙讓）為您做…", "ex": "お客様を駅まで案内してさしあげた。", "exk": "おきゃくさまをえきまであんないしてさしあげた。", "exm": "我為客人帶路到車站。"}, {"p": "〜てくださる", "c": "動詞て形＋くださる", "m": "（尊敬）為我做…", "ex": "先生が推薦状を書いてくださった。", "exk": "せんせいがすいせんじょうをかいてくださった。", "exm": "老師為我寫了推薦信。"}, {"p": "〜ていただく", "c": "動詞て形＋いただく", "m": "（謙讓）請您做…", "ex": "部長に説明していただいた。", "exk": "ぶちょうにせつめいしていただいた。", "exm": "我請部長為我說明。"}, {"p": "〜てほしい", "c": "動詞て形＋ほしい", "m": "希望（某人）做…", "ex": "もっと本を読んでほしい。", "exk": "もっとほんをよんでほしい。", "exm": "希望你多讀點書。"}, {"p": "〜てもらいたい", "c": "動詞て形＋もらいたい", "m": "想請…做", "ex": "少し静かにしてもらいたい。", "exk": "すこししずかにしてもらいたい。", "exm": "希望你安靜一點。"}, {"p": "〜（さ）せる", "c": "動詞使役形", "m": "讓／使…做（使役）", "ex": "先生は学生に本を読ませた。", "exk": "せんせいはがくせいにほんをよませた。", "exm": "老師讓學生讀書。"}, {"p": "〜（さ）せてください", "c": "動詞使役て形＋ください", "m": "請讓我…", "ex": "少し休ませてください。", "exk": "すこしやすませてください。", "exm": "請讓我休息一下。"}, {"p": "〜（ら）れる（受身）", "c": "動詞受身形", "m": "被…（受身）", "ex": "電車で足を踏まれた。", "exk": "でんしゃであしをふまれた。", "exm": "在電車上被踩了腳。"}, {"p": "〜（さ）せられる", "c": "動詞使役受身形", "m": "被迫…（使役受身）", "ex": "先輩にお酒を飲ませられた。", "exk": "せんぱいにおさけをのませられた。", "exm": "被前輩逼著喝酒。"}, {"p": "〜（ら）れる（尊敬）", "c": "動詞受身形", "m": "（尊敬）…", "ex": "社長はもう帰られました。", "exk": "しゃちょうはもうかえられました。", "exm": "社長已經回去了。"}, {"p": "〜（ら）れる（可能）", "c": "動詞可能形", "m": "能夠…（可能）", "ex": "刺身が食べられるようになった。", "exk": "さしみがたべられるようになった。", "exm": "變得敢吃生魚片了。"}, {"p": "〜てやる", "c": "動詞て形＋やる", "m": "（為晚輩／動植物）做…", "ex": "犬を散歩に連れて行ってやる。", "exk": "いぬをさんぽにつれていってやる。", "exm": "帶狗去散步。"}]}]}, {"title": "N3文法 7 ｜ 補助動詞・動作的局面", "groups": [{"sub": "", "items": [{"p": "〜ておく", "c": "動詞て形＋おく", "m": "事先做好；放置", "ex": "客が来る前に、部屋を掃除しておく。", "exk": "きゃくがくるまえに、へやをそうじしておく。", "exm": "客人來之前先打掃好房間。"}, {"p": "〜てしまう", "c": "動詞て形＋しまう", "m": "做完；不小心（遺憾）", "ex": "大切な書類を忘れてしまった。", "exk": "たいせつなしょるいをわすれてしまった。", "exm": "不小心忘了重要文件。"}, {"p": "〜ちゃう／じゃう", "c": "動詞て形＋ちゃう（〜でしまう→じゃう）", "m": "「〜てしまう」的口語", "ex": "ケーキを全部食べちゃった。", "exk": "けーきをぜんぶたべちゃった。", "exm": "把蛋糕全吃光了。"}, {"p": "〜ていく", "c": "動詞て形＋いく", "m": "（由近到遠）…去；持續", "ex": "これから寒くなっていく。", "exk": "これからさむくなっていく。", "exm": "接下來會漸漸變冷。"}, {"p": "〜てくる", "c": "動詞て形＋くる", "m": "（由遠到近）…來；漸漸", "ex": "最近、日本語が分かってきた。", "exk": "さいきん、にほんごがわかってきた。", "exm": "最近漸漸聽懂日語了。"}, {"p": "〜てみる", "c": "動詞て形＋みる", "m": "試著…", "ex": "新しくできた店に行ってみた。", "exk": "あたらしくできたみせにいってみた。", "exm": "我去了新開的店看看。"}, {"p": "〜てある", "c": "他動詞て形＋ある", "m": "（有意）…著（狀態）", "ex": "壁に地図がはってある。", "exk": "かべにちずがはってある。", "exm": "牆上貼著地圖。"}, {"p": "〜はじめる", "c": "動詞ます形＋始める", "m": "開始…", "ex": "桜が咲き始めた。", "exk": "さくらがさきはじめた。", "exm": "櫻花開始開了。"}, {"p": "〜だす", "c": "動詞ます形＋出す", "m": "（突然）…起來", "ex": "赤ちゃんが急に泣き出した。", "exk": "あかちゃんがきゅうになきだした。", "exm": "嬰兒突然哭了起來。"}, {"p": "〜おわる", "c": "動詞ます形＋終わる", "m": "…完", "ex": "やっと本を読み終わった。", "exk": "やっとほんをよみおわった。", "exm": "終於把書讀完了。"}, {"p": "〜つづける", "c": "動詞ます形＋続ける", "m": "持續…", "ex": "三時間歩き続けた。", "exk": "さんじかんあるきつづけた。", "exm": "連續走了三個小時。"}, {"p": "〜かける", "c": "動詞ます形＋かける", "m": "…到一半", "ex": "何か言いかけて、やめた。", "exk": "なにかいいかけて、やめた。", "exm": "話說到一半就打住了。"}, {"p": "〜なおす", "c": "動詞ます形＋直す", "m": "重新…", "ex": "作文を書き直した。", "exk": "さくぶんをかきなおした。", "exm": "重寫了作文。"}, {"p": "〜あう", "c": "動詞ます形＋合う", "m": "互相…", "ex": "困ったときは助け合う。", "exk": "こまったときはたすけあう。", "exm": "困難時互相幫助。"}, {"p": "〜きる", "c": "動詞ます形＋切る", "m": "完全…；…到底", "ex": "マラソンを最後まで走りきった。", "exk": "まらそんをさいごまではしりきった。", "exm": "跑完了整場馬拉松。"}]}]}, {"title": "N3文法 8 ｜ 傾向・程度・難易・樣子", "groups": [{"sub": "", "items": [{"p": "〜すぎる", "c": "動詞ます形／い形・な形語幹＋すぎる", "m": "太過…", "ex": "昨日は食べすぎてお腹が痛い。", "exk": "きのうはたべすぎておなかがいたい。", "exm": "昨天吃太多肚子痛。"}, {"p": "〜やすい", "c": "動詞ます形＋やすい", "m": "容易…", "ex": "この本は字が大きくて読みやすい。", "exk": "このほんはじがおおきくてよみやすい。", "exm": "這本書字大很好讀。"}, {"p": "〜にくい", "c": "動詞ます形＋にくい", "m": "難以…", "ex": "この薬は苦くて飲みにくい。", "exk": "このくすりはにがくてのみにくい。", "exm": "這藥很苦難以下嚥。"}, {"p": "〜がる", "c": "い形・な形語幹＋がる／がっている", "m": "（第三人稱）覺得…", "ex": "子供が犬を怖がっている。", "exk": "こどもがいぬをこわがっている。", "exm": "小孩害怕狗。"}, {"p": "〜たがる", "c": "動詞ます形＋たがる", "m": "（第三人稱）想要…", "ex": "子供は外で遊びたがる。", "exk": "こどもはそとであそびたがる。", "exm": "小孩想在外面玩。"}, {"p": "〜がち", "c": "名詞／動詞ます形＋がち", "m": "容易…；往往（負面）", "ex": "冬は風邪をひきがちだ。", "exk": "ふゆはかぜをひきがちだ。", "exm": "冬天容易感冒。"}, {"p": "〜っぽい", "c": "名詞／動詞ます形／い形語幹＋っぽい", "m": "帶有…感；容易…", "ex": "彼は忘れっぽくて困る。", "exk": "かれはわすれっぽくてこまる。", "exm": "他很健忘真傷腦筋。"}, {"p": "〜げ（だ）", "c": "い形・な形語幹＋げ", "m": "顯得…的樣子", "ex": "彼女は寂しげに笑った。", "exk": "かのじょはさびしげにわらった。", "exm": "她寂寞地笑了。"}, {"p": "〜ぎみ", "c": "名詞／動詞ます形＋気味", "m": "有點…（傾向）", "ex": "最近、少し疲れ気味だ。", "exk": "さいきん、すこしつかれぎみだ。", "exm": "最近有點疲累。"}, {"p": "〜だらけ", "c": "名詞＋だらけ", "m": "滿是…", "ex": "子供の作文は間違いだらけだ。", "exk": "こどものさくぶんはまちがいだらけだ。", "exm": "孩子的作文滿是錯誤。"}, {"p": "〜向き", "c": "名詞＋向き", "m": "適合…；朝向", "ex": "この本は初心者向きだ。", "exk": "このほんはしょしんしゃむきだ。", "exm": "這本書適合初學者。"}, {"p": "〜向け", "c": "名詞＋向け", "m": "面向…（對象）", "ex": "これは子供向けの番組だ。", "exk": "これはこどもむけのばんぐみだ。", "exm": "這是給兒童看的節目。"}, {"p": "〜ようがない", "c": "動詞ます形＋ようがない", "m": "無法…；沒辦法", "ex": "連絡先が分からないので、知らせようがない。", "exk": "れんらくさきがわからないので、しらせようがない。", "exm": "不知道聯絡方式，無從通知。"}, {"p": "〜わけにはいかない", "c": "動詞辞書形／ない形＋わけにはいかない", "m": "不能…（情理上）", "ex": "約束したから、行かないわけにはいかない。", "exk": "やくそくしたから、いかないわけにはいかない。", "exm": "因為答應了，不去不行。"}]}]}, {"title": "N3文法 9 ｜ 引用・疑問・關聯・觀點", "groups": [{"sub": "", "items": [{"p": "〜という", "c": "名詞＋という＋名詞", "m": "叫做…；所謂", "ex": "田中という人から電話があった。", "exk": "たなかというひとからでんわがあった。", "exm": "有個叫田中的人打電話來。"}, {"p": "〜ということだ", "c": "普通形＋ということだ", "m": "據說…；也就是說", "ex": "会議は延期になったということだ。", "exk": "かいぎはえんきになったということだ。", "exm": "據說會議延期了。"}, {"p": "〜というのは", "c": "名詞＋というのは〜ことだ", "m": "所謂…是指", "ex": "「多忙」というのは、とても忙しいという意味だ。", "exk": "「たぼう」というのは、とてもいそがしいといういみだ。", "exm": "所謂「多忙」就是非常忙的意思。"}, {"p": "〜かどうか", "c": "普通形（な形・名詞は語幹）＋かどうか", "m": "是否…", "ex": "彼が来るかどうか分からない。", "exk": "かれがくるかどうかわからない。", "exm": "不知道他來不來。"}, {"p": "〜疑問詞＋か", "c": "疑問詞＋普通形＋か", "m": "…（間接疑問）", "ex": "何が起きたか誰も知らない。", "exk": "なにがおきたかだれもしらない。", "exm": "沒人知道發生了什麼事。"}, {"p": "〜について", "c": "名詞＋について", "m": "關於…", "ex": "日本の文化について調べる。", "exk": "にほんのぶんかについてしらべる。", "exm": "調查關於日本文化的事。"}, {"p": "〜に対して（對象）", "c": "名詞＋に対して", "m": "對於…（對象）", "ex": "学生の質問に対して丁寧に答える。", "exk": "がくせいのしつもんにたいしてていねいにこたえる。", "exm": "對學生的提問仔細回答。"}, {"p": "〜にとって", "c": "名詞＋にとって", "m": "對…來說", "ex": "私にとって家族が一番大切だ。", "exk": "わたしにとってかぞくがいちばんたいせつだ。", "exm": "對我來說家人最重要。"}, {"p": "〜として", "c": "名詞＋として", "m": "作為…", "ex": "彼は医者として働いている。", "exk": "かれはいしゃとしてはたらいている。", "exm": "他以醫生的身分工作。"}, {"p": "〜によって（手段・依據）", "c": "名詞＋によって", "m": "依…；根據…", "ex": "国によって習慣が違う。", "exk": "くにによってしゅうかんがちがう。", "exm": "因國家不同習慣也不同。"}, {"p": "〜によると", "c": "名詞＋によると／によれば", "m": "根據…（傳聞來源）", "ex": "ニュースによると、大きな地震があったそうだ。", "exk": "にゅーすによると、おおきなじしんがあったそうだ。", "exm": "據新聞報導，發生了大地震。"}, {"p": "〜に関して", "c": "名詞＋に関して", "m": "有關…（書面）", "ex": "その事件に関して調査が進んでいる。", "exk": "そのじけんにかんしてちょうさがすすんでいる。", "exm": "有關那起事件的調查正在進行。"}, {"p": "〜とは限らない", "c": "普通形＋とは限らない", "m": "未必…", "ex": "高いものがいいとは限らない。", "exk": "たかいものがいいとはかぎらない。", "exm": "貴的東西未必好。"}, {"p": "〜のは〜だ", "c": "文＋のは＋名詞／文＋だ", "m": "是…（強調）", "ex": "私が会いたいのは彼だ。", "exk": "わたしがあいたいのはかれだ。", "exm": "我想見的人是他。"}, {"p": "〜ように（伝える）", "c": "動詞辞書形／ない形＋ように＋言う／伝える", "m": "轉達命令：叫…（做）", "ex": "先生は静かにするように言った。", "exk": "せんせいはしずかにするようにいった。", "exm": "老師叫大家安靜。"}, {"p": "〜って（引用）", "c": "文＋って", "m": "據說／說是…（口語引用）", "ex": "田中さんは来ないって。", "exk": "たなかさんはこないって。", "exm": "田中說他不來。"}]}]}, {"title": "N3文法 10 ｜ 時間・階段・結果・並列", "groups": [{"sub": "", "items": [{"p": "〜ところだ", "c": "動詞辞書形＋ところだ", "m": "正要…", "ex": "これから出かけるところだ。", "exk": "これからでかけるところだ。", "exm": "正要出門。"}, {"p": "〜ているところだ", "c": "動詞て形＋いるところだ", "m": "正在…（進行中）", "ex": "今、食事をしているところだ。", "exk": "いま、しょくじをしているところだ。", "exm": "正在吃飯。"}, {"p": "〜たところだ", "c": "動詞た形＋ところだ", "m": "剛…完", "ex": "たった今、駅に着いたところだ。", "exk": "たったいま、えきについたところだ。", "exm": "剛剛才到車站。"}, {"p": "〜たところ", "c": "動詞た形＋ところ", "m": "…之後（結果發現）", "ex": "先生に相談したところ、問題が解決した。", "exk": "せんせいにそうだんしたところ、もんだいがかいけつした。", "exm": "找老師商量後，問題解決了。"}, {"p": "〜たばかり", "c": "動詞た形＋ばかり", "m": "剛…不久", "ex": "日本に来たばかりで、言葉が分からない。", "exk": "にほんにきたばかりで、ことばがわからない。", "exm": "剛來日本不久，語言不通。"}, {"p": "〜ばかり（限定）", "c": "名詞／動詞て形＋ばかり", "m": "淨是…；光…", "ex": "弟はゲームばかりしている。", "exk": "おとうとはげーむばかりしている。", "exm": "弟弟老是在打電動。"}, {"p": "〜たびに", "c": "名詞の／動詞辞書形＋たびに", "m": "每當…就", "ex": "この写真を見るたびに、母を思い出す。", "exk": "このしゃしんをみるたびに、ははをおもいだす。", "exm": "每次看到這張照片就想起母親。"}, {"p": "〜うちに", "c": "名詞の／動詞辞書・ない・ている＋うちに", "m": "趁…；在…期間", "ex": "熱いうちに、召し上がってください。", "exk": "あついうちに、めしあがってください。", "exm": "請趁熱享用。"}, {"p": "〜間に", "c": "名詞の／動詞ている＋間に", "m": "在…期間（某時點）", "ex": "留守の間に、泥棒が入った。", "exk": "るすのあいだに、どろぼうがはいった。", "exm": "不在家時小偷闖了進來。"}, {"p": "〜間", "c": "名詞の／動詞ている＋間", "m": "在…期間（持續）", "ex": "夏休みの間、ずっと働いていた。", "exk": "なつやすみのあいだ、ずっとはたらいていた。", "exm": "整個暑假一直在打工。"}, {"p": "〜とおり（に）", "c": "名詞の／動詞辞書・た形＋とおり(に)", "m": "按照…", "ex": "説明書のとおりに組み立てる。", "exk": "せつめいしょのとおりにくみたてる。", "exm": "按照說明書組裝。"}, {"p": "〜まま", "c": "名詞の／動詞た形・ない形／指示詞＋まま", "m": "保持…狀態", "ex": "窓を開けたまま、寝てしまった。", "exk": "まどをあけたまま、ねてしまった。", "exm": "開著窗就睡著了。"}, {"p": "〜ながら（同時）", "c": "動詞ます形＋ながら", "m": "一邊…一邊", "ex": "音楽を聞きながら勉強する。", "exk": "おんがくをききながらべんきょうする。", "exm": "一邊聽音樂一邊讀書。"}, {"p": "〜たり〜たり", "c": "動詞た形＋り＋動詞た形＋り＋する", "m": "又…又…；列舉", "ex": "日曜日は本を読んだり、散歩したりする。", "exk": "にちようびはほんをよんだり、さんぽしたりする。", "exm": "星期天會讀讀書、散散步。"}, {"p": "〜し", "c": "普通形＋し", "m": "又…又…（列舉理由）", "ex": "この店は安いし、おいしい。", "exk": "このみせはやすいし、おいしい。", "exm": "這家店又便宜又好吃。"}, {"p": "〜たとたん（に）", "c": "動詞た形＋とたん(に)", "m": "剛一…就（意外）", "ex": "立ち上がったとたん、めまいがした。", "exk": "たちあがったとたん、めまいがした。", "exm": "一站起來就頭暈。"}]}]}]};

let current = 'vocab';

function meanHTML(m){ return esc(m).replace(/（([^）]*)）/g,'<span style="color:var(--sub);font-size:.85em">（$1）</span>'); }

function cardVOCAB(it, idx){
  const romaji = it.r ? `<span class="romaji">${esc(it.r)}</span>` : '';
  const numBadge = idx ? `<span class="idx-badge">${idx}.</span>` : '';
  return `<div class="card" data-s="${esc((it.w+it.k+it.r+it.m+it.ex).toLowerCase())}" data-mean="${esc(it.m)}">
    <div class="card-top">
      ${numBadge}<button class="word jp" data-text="${esc(it.k||it.w)}" title="點擊發音">${esc(it.w)}</button>
      <span class="kana jp">${esc(it.k)}</span>${romaji}
    </div>
    <div class="mean">${meanHTML(it.m)}</div>
    <div class="ex">
      <div class="ex-line">
        <div class="ex-ja jp">${esc(it.ex)}</div>
        <button class="say ex" data-text="${esc(it.ex)}" title="播放例句"></button>
      </div>
      <div class="ex-kana jp">${esc(it.exk)}</div>
      <div class="ex-zh">${esc(it.exm)}</div>
    </div>
  </div>`;
}

function cardGRAMMAR(it, idx){
  const numBadge = idx ? `<span class="idx-badge">${idx}.</span>` : '';
  return `<div class="card gram-card" data-s="${esc((it.p+it.c+it.m+it.ex).toLowerCase())}" data-mean="${esc(it.m)}">
    <div class="card-top">
      ${numBadge}<button class="word jp" data-text="${esc(it.ex)}" title="點擊發音（例句）">${esc(it.p)}</button>
    </div>
    <div class="g-conn"><b>接続</b><span>${esc(it.c)}</span></div>
    <div class="mean">${meanHTML(it.m)}</div>
    <div class="ex">
      <div class="ex-line">
        <div class="ex-ja jp">${esc(it.ex)}</div>
        <button class="say ex" data-text="${esc(it.ex)}" title="播放例句"></button>
      </div>
      <div class="ex-kana jp">${esc(it.exk)}</div>
      <div class="ex-zh">${esc(it.exm)}</div>
    </div>
  </div>`;
}

const RENDER = { vocab:cardVOCAB, grammar:cardGRAMMAR };
function render(ch){
  current = ch;
  const cats = DATA[ch] || [];
  const cardFn = RENDER[ch] || cardVOCAB;
  const multiCat = cats.length > 1;
  let html = '', chips = '';
  cats.forEach((c,ci)=>{
    const id = ch+'-'+ci;
    const groups = c.groups || [{sub:null, items:(c.items||[])}];
    const count = groups.reduce((n,g)=>n+g.items.length,0);
    if(multiCat){
      const short = c.title.replace(/（[^）]*）/,'');
      chips += `<a href="#${id}">${esc(short)}</a>`;
    }
    const playBtns = ch === 'grammar'
      ? `<button class="play-all"><span class="ico"></span> 全部播放例句（中→日）</button>
        <button class="play-all play-ja"><span class="ico"></span> 全部播放例句（日）</button>`
      : `<button class="play-all"><span class="ico"></span> 全部播放例句（中→日）</button>
        <button class="play-all play-zhja"><span class="ico"></span> 播放中日</button>`;
    html += `<section class="cat" id="${id}">
      <div class="cat-h">
        <h2 class="jp">${esc(c.title)}</h2>
        <span class="cnt">${count} 項</span>
        ${playBtns}
      </div>`;
    let idxCounter = 0;
    groups.forEach((g,gi)=>{
      const gid = id+'-g'+gi;
      const gridId = gid+'-grid';
      if(g.sub){
        html += `<div class="subhead" id="${gid}">${esc(g.sub)}</div>`;
        if(!multiCat) chips += `<a href="#${gid}">${esc(g.sub)}</a>`;
      }
      html += `<div class="grid" id="${gridId}">` + g.items.map(it=>cardFn(it, ++idxCounter)).join('') + '</div>';
    });
    html += '</section>';
  });
  main.innerHTML = html;
  chipnav.innerHTML = chips;
  chipnav.style.display = chips ? '' : 'none';
  applyFilter(document.getElementById('q').value);
}

/* tabs */
document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    stopAll();
    render(t.dataset.ch);
    window.scrollTo({top:0});
  });
});

/* search filter */
const q = document.getElementById('q');
function applyFilter(v){
  v = (v||'').trim().toLowerCase();
  document.querySelectorAll('#main .card').forEach(card=>{
    card.classList.toggle('hidden', v && !card.dataset.s.includes(v));
  });
  document.querySelectorAll('#main .cat').forEach(sec=>{
    const any = sec.querySelector('.card:not(.hidden)');
    sec.classList.toggle('hidden', !any);
  });
}
q.addEventListener('input', e=>applyFilter(e.target.value));

/* ---------------- speech ---------------- */
const supported = 'speechSynthesis' in window;
let jaVoice = null;
let zhVoice = null;
function pickVoice(){
  const vs = speechSynthesis.getVoices();
  jaVoice = vs.find(v=>/ja(-|_)?/i.test(v.lang)) || vs.find(v=>/japanese/i.test(v.name)) || null;
  zhVoice = vs.find(v=>/zh-TW|zh_TW|Hant/i.test(v.lang+v.name)) || vs.find(v=>/zh(-|_)?/i.test(v.lang)) || null;
  const note = document.getElementById('voiceNote');
  if(!supported){ note.textContent='⚠ 此瀏覽器不支援語音合成，發音按鈕已停用。'; }
  else if(jaVoice){ note.textContent='🔊 目前日語語音：'+jaVoice.name; }
  else { note.textContent='🔊 語音已就緒（未偵測到專用日語語音，將使用預設語音）。'; }
}
if(supported){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }

let runId = 0;
function stopAll(){
  runId++;
  if(supported) speechSynthesis.cancel();
  document.querySelectorAll('.say.playing, .word.playing, .play-all.playing').forEach(b=>b.classList.remove('playing'));
}
function makeUtter(text, lang){
  lang = lang || 'ja-JP';
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang; u.rate = 0.9;
  if(lang.startsWith('ja')){
    if(!jaVoice) pickVoice();
    if(jaVoice) u.voice = jaVoice;
  } else if(lang.startsWith('zh')){
    if(zhVoice) u.voice = zhVoice;
  }
  return u;
}
function speakOne(btn){
  const text = btn.dataset.text||'';
  stopAll();
  if(!text || !supported) return;
  const my = runId;
  btn.classList.add('playing');
  const u = makeUtter(text);
  u.onend = u.onerror = ()=>{ if(my===runId) btn.classList.remove('playing'); };
  speechSynthesis.speak(u);
}
const SEQUENCE_GAP_MS = 800;
function speakSequence(btn, items){
  const was = btn.classList.contains('playing');
  stopAll();
  if(was || !supported || !items.length) return;
  const my = runId;
  btn.classList.add('playing');
  let i=0;
  (function next(){
    if(my!==runId) return;
    if(i>=items.length){ btn.classList.remove('playing'); return; }
    const {text,lang} = items[i++];
    const u = makeUtter(text, lang);
    u.onend = ()=>{ if(my===runId) setTimeout(next, SEQUENCE_GAP_MS); };
    u.onerror = ()=>{ if(my===runId) btn.classList.remove('playing'); };
    speechSynthesis.speak(u);
  })();
}
function collectExamplesZhJa(container){
  const items = [];
  container.querySelectorAll('.card:not(.hidden)').forEach(card=>{
    const zh = card.querySelector('.ex-zh')?.textContent;
    const ja = card.querySelector('.say.ex')?.dataset.text;
    if(zh) items.push({text:zh, lang:'zh-TW'});
    if(ja) items.push({text:ja, lang:'ja-JP'});
  });
  return items;
}
function collectExamplesJa(container){
  return [...container.querySelectorAll('.card:not(.hidden) .say.ex')]
    .map(b=>b.dataset.text).filter(Boolean).map(text=>({text, lang:'ja-JP'}));
}
function collectWordMeanJaZh(container){
  const items = [];
  container.querySelectorAll('.card:not(.hidden)').forEach(card=>{
    const mean = card.dataset.mean;
    const word = card.querySelector('.word')?.dataset.text;
    if(word) items.push({text:word, lang:'ja-JP'});
    if(mean) items.push({text:mean, lang:'zh-TW'});
  });
  return items;
}
function speakSection(btn){ speakSequence(btn, collectExamplesZhJa(btn.closest('.cat'))); }
function speakSectionJa(btn){ speakSequence(btn, collectExamplesJa(btn.closest('.cat'))); }
function speakZhJa(btn){ speakSequence(btn, collectWordMeanJaZh(btn.closest('.cat'))); }
document.addEventListener('click', e=>{
  const pja = e.target.closest('.play-ja');
  if(pja){ speakSectionJa(pja); return; }
  const pz = e.target.closest('.play-zhja');
  if(pz){ speakZhJa(pz); return; }
  const pa = e.target.closest('.play-all');
  if(pa){ speakSection(pa); return; }
  const s = e.target.closest('.say, .word');
  if(s){ speakOne(s); return; }
});

/* init */
render('vocab');


</script>

<button class="fab" id="toTop" aria-label="回到最上面" title="回到最上面">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4l-8 8h5v8h6v-8h5z"/></svg>
</button>
<script>
(function(){
  var b=document.getElementById('toTop');
  var boxes=[];
  function top(){
    var y=window.scrollY||document.documentElement.scrollTop||0;
    boxes.forEach(function(el){ if(el.scrollTop>y) y=el.scrollTop; });
    return y;
  }
  function sync(){ b.classList.toggle('show', top()>320); }
  window.addEventListener('scroll',sync,{passive:true});
  boxes.forEach(function(el){ el.addEventListener('scroll',sync,{passive:true}); });
  sync();
  b.addEventListener('click',function(){
    var smooth=!window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var opt=smooth?{top:0,behavior:'smooth'}:{top:0};
    window.scrollTo(opt);
    boxes.forEach(function(el){ el.scrollTo ? el.scrollTo(opt) : el.scrollTop=0; });
  });
})();
</script>
