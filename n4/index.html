<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JLPT N4 單字・文法</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#c0392b; --accent2:#8e44ad;
  --paper:#fbf7f0; --card:#ffffff; --ink:#2b2320; --sub:#6f635b;
  --line:#e7ddcf; --chip:#f1e9dc; --ok:#1e8449; --shadow:0 2px 8px rgba(80,50,30,.08);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  line-height:1.6; -webkit-text-size-adjust:100%;
}
.jp{font-family:"Noto Serif JP","Hiragino Mincho ProN",serif;}
header.top{
  position:sticky; top:0; z-index:30; background:rgba(251,247,240,.96);
  backdrop-filter:blur(6px); border-bottom:1px solid var(--line);
}
.top-in{max-width:1080px;margin:0 auto;padding:12px 16px 0}
.top h1{font-size:1.15rem;margin:0 0 2px;font-weight:700}
.top p{margin:0;color:var(--sub);font-size:.82rem}
.head-row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.head-title{min-width:0}
.head-tools{display:flex;gap:8px;align-items:center;flex:0 0 auto}
.tabs{display:flex;gap:6px;margin-top:10px;flex-wrap:nowrap}
.tab{
  appearance:none;border:1px solid var(--line);background:var(--card);color:var(--sub);
  padding:7px 12px;border-radius:10px 10px 0 0;font-size:1.02rem;font-weight:600;cursor:pointer;
  border-bottom:none;transition:.15s;white-space:nowrap;flex:0 0 auto;
}
.tab.active{color:#fff;background:var(--accent);border-color:var(--accent)}
.toolbar{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search{width:auto;max-width:70vw;display:inline-flex;align-items:center;gap:8px;background:var(--card);
  border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.search input{border:none;outline:none;background:none;font-size:.95rem;color:var(--ink);
  field-sizing:content;width:auto;min-width:2em;max-width:60vw}
.btn-stop{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--sub);
  padding:8px 14px;border-radius:10px;font-weight:600;cursor:pointer}
.btn-stop:hover{border-color:var(--accent);color:var(--accent)}
.chipnav{max-width:1080px;margin:0 auto;padding:0 16px 6px;display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.chipnav a{white-space:nowrap;text-decoration:none;font-size:.8rem;color:var(--sub);
  background:var(--chip);border:1px solid var(--line);padding:5px 11px;border-radius:999px}
.chipnav a:hover{color:var(--accent);border-color:var(--accent)}
main{max-width:1080px;margin:0 auto;padding:8px 16px 80px}
.cat{margin:26px 0 8px;scroll-margin-top:150px}
.cat-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  border-bottom:2px solid var(--accent);padding-bottom:8px;margin-bottom:14px}
.cat-h h2{font-size:1.15rem;margin:0;font-weight:700}
.cat-h .cnt{color:var(--sub);font-size:.8rem;font-weight:500}
.play-all{appearance:none;cursor:pointer;margin-left:auto;border:1px solid var(--accent);
  color:var(--accent);background:transparent;border-radius:999px;padding:6px 14px;font-weight:600;font-size:.85rem;
  display:inline-flex;align-items:center;gap:6px;transition:.15s}
.play-all:hover{background:var(--accent);color:#fff}
.play-all.playing{background:var(--accent);color:#fff}
.play-all.playing .ico::before{content:"■"}
.play-all .ico::before{content:"▶"}
.play-zhja{border-color:var(--accent2);color:var(--accent2)}
.play-zhja:hover{background:var(--accent2);color:#fff}
.play-zhja.playing{background:var(--accent2);color:#fff}
.subhead{font-size:.9rem;font-weight:700;color:var(--accent2);margin:16px 0 8px;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;scroll-margin-top:150px}
.subhead::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;
  box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.card-top{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.word{font-size:1.5rem;font-weight:700;line-height:1.2;cursor:pointer;border:none;background:none;
  color:var(--ink);padding:0;font-family:"Noto Serif JP",serif;text-align:left}
.word:hover{color:var(--accent)}
.idx-badge{color:var(--sub);font-size:.85rem;font-weight:600;margin-right:4px}
.word::after{content:"🔊";font-size:.7rem;margin-left:5px;opacity:.4;vertical-align:middle}
.word:hover::after{opacity:.9}
.word.playing{color:var(--accent);text-decoration:underline}
.kana{color:var(--sub);font-size:.9rem}
.romaji{color:#b7a99a;font-size:.76rem;font-style:italic}
.mean{color:var(--ink);font-size:.92rem}
.mean b{color:var(--accent);font-weight:600}
.ex{margin-top:2px;padding:9px 11px;background:var(--paper);border-radius:10px;border:1px solid var(--line)}
.ex-line{display:flex;align-items:flex-start;gap:8px}
.ex-ja{flex:1;font-family:"Noto Serif JP",serif;font-size:1.02rem;font-weight:600}
.ex-kana{color:var(--sub);font-size:.82rem;margin-top:2px}
.ex-zh{color:var(--sub);font-size:.85rem;margin-top:1px}
.say{appearance:none;flex:none;cursor:pointer;width:30px;height:30px;border-radius:50%;
  border:1px solid var(--accent);color:var(--accent);background:#fff;font-size:.8rem;line-height:1;
  display:inline-flex;align-items:center;justify-content:center;transition:.15s}
.say:hover{background:var(--accent);color:#fff}
.say.playing{background:var(--accent);color:#fff;animation:pulse 1s infinite}
.say::before{content:"▶"}
.say.playing::before{content:"■"}
@keyframes pulse{50%{opacity:.55}}
/* ch3 */
.k-onkun{display:flex;gap:14px;flex-wrap:wrap;font-size:.86rem;color:var(--sub)}
.k-onkun b{color:var(--ink);font-weight:600;margin-right:3px}
.k-rei{font-family:"Noto Serif JP",serif;font-size:.95rem;color:var(--ink)}
.k-rei-line{font-size:.84rem;color:var(--sub);font-family:"Noto Serif JP",serif}
.rei-lbl{display:inline-block;font-family:"Noto Sans TC",sans-serif;font-size:.7rem;
  color:var(--accent2);border:1px solid var(--accent2);border-radius:5px;padding:0 5px;margin-right:6px;vertical-align:middle}
/* 形容詞反義配對 */
.ant{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:6px;padding-top:8px;border-top:1px dashed var(--line)}
.ant-mark{font-size:.7rem;color:var(--accent2);border:1px solid var(--accent2);border-radius:5px;padding:0 6px;font-family:"Noto Sans TC",sans-serif}
.ant .word{font-size:1.2rem}
.ex-ant .ex-ja{font-weight:600}
.ex-ant{border-style:dashed}
/* 五十音卡 */
.kana-card .word{font-size:2.3rem}
.kana-card .card-top{align-items:center}
/* 五十音例句卡（50 tab） */
.k50-row2{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.k50-zh{color:var(--ink);font-size:.92rem}
.hidden{display:none !important}
.empty-note{color:var(--sub);text-align:center;padding:30px}
footer{max-width:1080px;margin:0 auto;padding:16px;color:var(--sub);font-size:.78rem;border-top:1px solid var(--line)}
@media (max-width:640px){
  /* 標題與搜尋維持同一列，搜尋靠右、不換行 */
  .head-row{align-items:center;gap:10px}
  .search input{min-width:0;max-width:52vw}
}
@media (max-width:520px){
  .word{font-size:1.35rem}
  .grid{grid-template-columns:1fr}
  .top h1{font-size:1.02rem}
  .tabs{gap:5px}
  .tab{padding:6px 9px;font-size:.95rem}
}
@media (prefers-reduced-motion:reduce){.say.playing{animation:none}}

/* 文法卡 */
.gram-card .word{font-size:1.25rem}
.g-conn{display:flex;gap:8px;flex-wrap:wrap;font-size:.84rem;color:var(--sub);align-items:baseline}
.g-conn b{color:var(--ink);font-weight:600}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="head-row">
      <div class="head-title"><h1>JLPT N4 單字・文法</h1></div>
      <div class="head-tools">
        <label class="search"><span aria-hidden="true">🔍</span>
          <input id="q" type="search" placeholder="搜尋…" autocomplete="off"></label>
      </div>
    </div>
    <div class="tabs">
      <button class="tab active" data-ch="vocab">單字</button>
      <button class="tab" data-ch="grammar">文法</button>

  </div>
  <nav class="chipnav" id="chipnav"></nav>
</header>
<main id="main"></main>
<footer>
  <p id="voiceNote"></p>

</footer>

const DATA = {"vocab": [{"title": "N4單字 1 ｜ 名詞・生活", "groups": [{"sub": "", "items": [{"w": "生活", "k": "せいかつ", "r": "seikatsu", "m": "生活", "ex": "日本での生活に慣れました。", "exk": "にほんでのせいかつになれました。", "exm": "已經習慣在日本的生活了。"}, {"w": "会場", "k": "かいじょう", "r": "kaijou", "m": "會場", "ex": "会場はとても広いです。", "exk": "かいじょうはとてもひろいです。", "exm": "會場非常寬敞。"}, {"w": "受付", "k": "うけつけ", "r": "uketsuke", "m": "櫃檯、受理處", "ex": "受付で名前を書きます。", "exk": "うけつけでなまえをかきます。", "exm": "在櫃檯寫名字。"}, {"w": "荷物", "k": "にもつ", "r": "nimotsu", "m": "行李、貨物", "ex": "荷物が重いです。", "exk": "にもつがおもいです。", "exm": "行李很重。"}, {"w": "財布", "k": "さいふ", "r": "saifu", "m": "錢包", "ex": "財布を家に忘れました。", "exk": "さいふをいえにわすれました。", "exm": "把錢包忘在家裡了。"}, {"w": "鍵", "k": "かぎ", "r": "kagi", "m": "鑰匙", "ex": "部屋の鍵をなくしました。", "exk": "へやのかぎをなくしました。", "exm": "把房間的鑰匙弄丟了。"}, {"w": "道具", "k": "どうぐ", "r": "dougu", "m": "工具", "ex": "掃除の道具を買いました。", "exk": "そうじのどうぐをかいました。", "exm": "買了打掃的工具。"}, {"w": "品物", "k": "しなもの", "r": "shinamono", "m": "物品、商品", "ex": "この店は品物が多いです。", "exk": "このみせはしなものがおおいです。", "exm": "這家店商品很多。"}, {"w": "値段", "k": "ねだん", "r": "nedan", "m": "價格", "ex": "この服の値段は高いです。", "exk": "このふくのねだんはたかいです。", "exm": "這件衣服的價格很高。"}, {"w": "料金", "k": "りょうきん", "r": "ryoukin", "m": "費用", "ex": "電車の料金を調べます。", "exk": "でんしゃのりょうきんをしらべます。", "exm": "查電車的費用。"}, {"w": "案内", "k": "あんない", "r": "annai", "m": "導覽、引路", "ex": "駅まで案内します。", "exk": "えきまであんないします。", "exm": "帶你到車站。"}, {"w": "予約", "k": "よやく", "r": "yoyaku", "m": "預約", "ex": "レストランを予約しました。", "exk": "れすとらんをよやくしました。", "exm": "預約了餐廳。"}, {"w": "約束", "k": "やくそく", "r": "yakusoku", "m": "約定", "ex": "友達と約束があります。", "exk": "ともだちとやくそくがあります。", "exm": "和朋友有約。"}, {"w": "用意", "k": "ようい", "r": "youi", "m": "準備", "ex": "食事の用意をします。", "exk": "しょくじのよういをします。", "exm": "準備餐點。"}, {"w": "準備", "k": "じゅんび", "r": "junbi", "m": "準備", "ex": "旅行の準備をしています。", "exk": "りょこうのじゅんびをしています。", "exm": "正在做旅行的準備。"}, {"w": "説明", "k": "せつめい", "r": "setsumei", "m": "說明", "ex": "使い方を説明します。", "exk": "つかいかたをせつめいします。", "exm": "說明使用方法。"}, {"w": "連絡", "k": "れんらく", "r": "re い", "k": "おいわい", "r": "oiwai", "m": "祝賀、賀禮", "ex": "友達の合格をお祝いします。", "exk": "ともだちのごうかくをおいわいします。", "exm": "祝賀朋友考上。"}, {"w": "お見舞い", "k": "おみまい", "r": "omimai", "m": "探病", "ex": "入院した友達のお見舞いに行きます。", "exk": "にゅういんしたともだちのおみまいにいきます。", "exm": "去探望住院的朋友。"}, {"w": "お土産", "k": "おみやげ", "r": "omiyage", "m": "伴手禮", "ex": "旅行のお土産を買います。", "exk": "りょこうのおみやげをかいます。", "exm": "買旅行的伴手禮。"}, {"w": "遠慮", "k": "えんりょ", "r": "enryo", "m": "客氣、顧慮", "ex": "遠慮しないで食べてください。", "exk": "えんりょしないでたべてください。", "exm": "請別客氣，儘管吃。"}, {"w": "我慢", "k": "がまん", "r": "gaman", "m": "忍耐", "ex": "痛みを我慢します。", "exk": "いたみをがまんします。", "exm": "忍耐疼痛。"}, {"w": "賛成", "k": "さんせい", "r": "sansei", "m": "贊成", "ex": "その意見に賛成です。", "exk": "そのいけんにさんせいです。", "exm": "贊成那個意見。"}, {"w": "反対", "k": "はんたい", "r": "hantai", "m": "反對", "ex": "私はこの計画に反対です。", "exk": "わたしはこのけいかくにはんたいです。", "exm": "我反對這個計畫。"}, {"w": "返事", "k": "へんじ", "r": "henji", "m": "回覆、回答", "ex": "早めに返事をください。", "exk": "はやめにへんじをください。", "exm": "請早點回覆。"}, {"w": "質問", "k": "しつもん", "r": "shitsumon", "m": "問題、提問", "ex": "先生に質問します。", "exk": "せんせいにしつもんします。", "exm": "向老師提問。"}, {"w": "挨拶回り", "k": "あいさつまわり", "r": "aisatsumawari", "m": "拜訪致意", "ex": "新年の挨拶回りをします。", "exk": "しんねんのあいさつまわりをします。", "exm": "做新年的拜年。"}, {"w": "お願い", "k": "おねがい", "r": "onegai", "m": "請求、拜託", "ex": "一つお願いがあります。", "exk": "ひとつおねがいがあります。", "exm": "有一件事想拜託。"}, {"w": "約束を守る", "k": "やくそくをまもる", "r": "yakusokuwomamoru", "m": "守約", "ex": "彼はいつも約束を守ります。", "exk": "かれはいつもやくそくをまもります。", "exm": "他總是守約。"}, {"w": "気をつける", "k": "きをつける", "r": "kiwotsukeru", "m": "小心、注意", "ex": "車に気をつけてください。", "exk": "くるまにきをつけてください。", "exm": "請小心車子。"}, {"w": "役に立つ", "k": "やくにたつ", "r": "yakunitatsu", "m": "有用、有幫助", "ex": "この辞書は役に立ちます。", "exk": "このじしょはやくにたちます。", "exm": "這本字典很有用。"}, {"w": "気に入る", "k": "きにいる", "r": "kiniiru", "m": "喜歡、中意", "ex": "このかばんが気に入りました。", "exk": "このかばんがきにいりました。", "exm": "很中意這個包包。"}, {"w": "気にする", "k": "きにする", "r": "kinisuru", "m": "在意、介意", "ex": "小さいことを気にしないで。", "exk": "ちいさいことをきにしないで。", "exm": "別在意小事。"}, {"w": "世話をする", "k": "せわをする", "r": "sewawosuru", "m": "照顧", "ex": "犬の世話をします。", "exk": "いぬのせわをします。", "exm": "照顧狗。"}, {"w": "楽しみにする", "k": "たのしみにする", "r": "tanoshiminisuru", "m": "期待", "ex": "再会を楽しみにしています。", "exk": "さいかいをたのしみにしています。", "exm": "期待再會。"}, {"w": "びっくりする", "k": "びっくりする", "r": "bikkurisuru", "m": "嚇一跳", "ex": "大きな音にびっくりしました。", "exk": "おおきなおとにびっくりしました。", "exm": "被巨大的聲音嚇了一跳。"}, {"w": "がっかりする", "k": "がっかりする", "r": "gakkarisuru", "m": "失望", "ex": "試合に負けてがっかりしました。", "exk": "しあいにまけてがっかりしました。", "exm": "輸了比賽很失望。"}, {"w": "遠慮する", "k": "えんりょする", "r": "enryosuru", "m": "客氣、謝絕", "ex": "今日は遠慮しておきます。", "exk": "きょうはえんりょしておきます。", "exm": "今天就先謝絕了。"}, {"w": "お邪魔します", "k": "おじゃまします", "r": "ojamashimasu", "m": "打擾了（進門時）", "ex": "お邪魔しますと言って入ります。", "exk": "おじゃましますといってはいります。", "exm": "說聲打擾了才進門。"}, {"w": "お世話になる", "k": "おせわになる", "r": "osewaninaru", "m": "承蒙關照", "ex": "先生には大変お世話になりました。", "exk": "せんせいにはたいへんおせわになりました。", "exm": "非常承蒙老師關照。"}, {"w": "お疲れ様", "k": "おつかれさま", "r": "otsukaresama", "m": "辛苦了", "ex": "仕事の後にお疲れ様と言います。", "exk": "しごとのあとにおつかれさまといいます。", "exm": "工作後說聲辛苦了。"}, {"w": "久しぶり", "k": "ひさしぶり", "r": "hisashiburi", "m": "好久不見", "ex": "久しぶりに友達に会いました。", "exk": "ひさしぶりにともだちにあいました。", "exm": "久違地見到了朋友。"}, {"w": "なるほど", "k": "なるほど", "r": "naruhodo", "m": "原來如此", "ex": "なるほど、よく分かりました。", "exk": "なるほど、よくわかりました。", "exm": "原來如此，我懂了。"}, {"w": "しかたがない", "k": "しかたがない", "r": "shikataganai", "m": "沒辦法", "ex": "雨だからしかたがないです。", "exk": "あめだからしかたがないです。", "exm": "因為下雨所以沒辦法。"}, {"w": "かまわない", "k": "かまわない", "r": "kamawanai", "m": "不介意、無所謂", "ex": "少し遅れてもかまいません。", "exk": "すこしおくれてもかまいません。", "exm": "稍微晚一點也沒關係。"}, {"w": "だめ", "k": "だめ", "r": "dame", "m": "不行、不可以", "ex": "ここで写真を撮ってはだめです。", "exk": "ここでしゃしんをとってはだめです。", "exm": "這裡不可以拍照。"}, {"w": "遅刻", "k": "ちこく", "r": "chikoku", "m": "遲到", "ex": "電車が遅れて遅刻しました。", "exk": "でんしゃがおくれてちこくしました。", "exm": "電車誤點所以遲到了。"}, {"w": "欠席", "k": "けっせき", "r": "kesseki", "m": "缺席", "ex": "病気で授業を欠席しました。", "exk": "びょうきでじゅぎょうをけっせきしました。", "exm": "因為生病缺課了。"}, {"w": "出席", "k": "しゅっせき", "r": "shusseki", "m": "出席", "ex": "会議に出席します。", "exk": "かいぎにしゅっせきします。", "exm": "出席會議。"}, {"w": "注意", "k": "ちゅうい", "r": "chuui", "m": "注意、警告", "ex": "先生に注意されました。", "exk": "せんせいにちゅういされました。", "exm": "被老師警告了。"}, {"w": "我慢強い", "k": "がまんづよい", "r": "gamanduyoi", "m": "有耐性的", "ex": "彼はとても我慢強いです。", "exk": "かれはとてもがまんづよいです。", "exm": "他非常有耐性。"}, {"w": "落ち着く", "k": "おちつく", "r": "ochitsuku", "m": "冷靜、安定", "ex": "深呼吸して落ち着きます。", "exk": "しんこきゅうしておちつきます。", "exm": "深呼吸讓自己冷靜。"}, {"w": "楽しむ", "k": "たのしむ", "r": "tanoshimu", "m": "享受", "ex": "休みを楽しみます。", "exk": "やすみをたのしみます。", "exm": "享受假期。"}]}]}], "grammar": [{"title": "N4文法 1 ｜ て形の補助動詞（狀態・準備・完了）", "groups": [{"sub": "", "items": [{"p": "〜ている", "c": "動詞て形＋いる", "m": "正在…；…著（動作進行或狀態）", "ex": "今、本を読んでいる。", "exk": "いま、ほんをよんでいる。", "exm": "現在正在看書。"}, {"p": "〜てある", "c": "他動詞て形＋ある", "m": "（有意做好而）…著（狀態留存）", "ex": "壁に地図が貼ってある。", "exk": "かべにちずがはってある。", "exm": "牆上貼著地圖。"}, {"p": "〜ておく", "c": "動詞て形＋おく", "m": "預先…；先…（做好準備）", "ex": "旅行の前に切符を買っておく。", "exk": "りょこうのまえにきっぷをかっておく。", "exm": "旅行前先買好票。"}, {"p": "〜てしまう", "c": "動詞て形＋しまう", "m": "…完了；不小心…（帶遺憾）", "ex": "宿題はもう終わってしまった。", "exk": "しゅくだいはもうおわってしまった。", "exm": "作業已經做完了。"}, {"p": "〜てみる", "c": "動詞て形＋みる", "m": "試著…看看", "ex": "この服を着てみてもいいですか。", "exk": "このふくをきてみてもいいですか。", "exm": "可以試穿這件衣服嗎？"}, {"p": "〜ていく", "c": "動詞て形＋いく", "m": "…下去；…去（漸漸／離開）", "ex": "これから寒くなっていく。", "exk": "これからさむくなっていく。", "exm": "今後會漸漸變冷。"}, {"p": "〜てくる", "c": "動詞て形＋くる", "m": "…起來；…來（漸漸／朝這邊）", "ex": "雨が降ってきた。", "exk": "あめがふってきた。", "exm": "下起雨來了。"}, {"p": "〜てから", "c": "動詞て形＋から", "m": "…之後（再）", "ex": "手を洗ってから食べなさい。", "exk": "てをあらってからたべなさい。", "exm": "洗手之後再吃。"}, {"p": "〜たところだ", "c": "動詞た形＋ところだ", "m": "剛剛…（動作剛結束）", "ex": "今、駅に着いたところだ。", "exk": "いま、えきについたところだ。", "exm": "現在剛到車站。"}, {"p": "〜ているところだ", "c": "動詞て形＋いるところだ", "m": "正在…的時候（動作進行中）", "ex": "今、料理を作っているところだ。", "exk": "いま、りょうりをつくっているところだ。", "exm": "現在正在做菜。"}, {"p": "〜るところだ", "c": "動詞辞書形＋ところだ", "m": "正要…（動作即將開始）", "ex": "これから出かけるところだ。", "exk": "これからでかけるところだ。", "exm": "正要出門。"}, {"p": "〜たばかりだ", "c": "動詞た形＋ばかりだ", "m": "剛…不久", "ex": "日本に来たばかりで、まだ慣れない。", "exk": "にほんにきたばかりで、まだなれない。", "exm": "剛來日本不久，還不習慣。"}, {"p": "〜まま", "c": "動詞た形／ない形／名詞の＋まま", "m": "保持…狀態（不變）", "ex": "窓を開けたまま寝てしまった。", "exk": "まどをあけたままねてしまった。", "exm": "開著窗就睡著了。"}]}]}, {"title": "N4文法 2 ｜ 授受・依頼・希望", "groups": [{"sub": "", "items": [{"p": "あげる", "c": "（人は人に物を）あげる", "m": "給（我方給他人）", "ex": "私は友達にプレゼントをあげた。", "exk": "わたしはともだちにぷれぜんとをあげた。", "exm": "我送了朋友禮物。"}, {"p": "くれる", "c": "（人は私に物を）くれる", "m": "給（他人給我方）", "ex": "母が私にセーターをくれた。", "exk": "ははがわたしにせーたーをくれた。", "exm": "媽媽給了我毛衣。"}, {"p": "もらう", "c": "（人は人に物を）もらう", "m": "得到；收到", "ex": "私は先生に本をもらった。", "exk": "わたしはせんせいにほんをもらった。", "exm": "我從老師那裡得到了書。"}, {"p": "〜てあげる", "c": "動詞て形＋あげる", "m": "（為別人）做…（施惠）", "ex": "友達に道を教えてあげた。", "exk": "ともだちにみちをおしえてあげた。", "exm": "我告訴了朋友怎麼走。"}, {"p": "〜てくれる", "c": "動詞て形＋くれる", "m": "（別人為我）做…（受惠）", "ex": "兄が宿題を手伝ってくれた。", "exk": "あにがしゅくだいをてつだってくれた。", "exm": "哥哥幫我做了作業。"}, {"p": "〜てもらう", "c": "動詞て形＋もらう", "m": "請（別人為我）做…；承蒙…做…", "ex": "友達に写真を撮ってもらった。", "exk": "ともだちにしゃしんをとってもらった。", "exm": "我請朋友幫我拍了照。"}, {"p": "〜てくださる", "c": "動詞て形＋くださる", "m": "（尊敬）為我做…（受惠）", "ex": "先生が推薦状を書いてくださった。", "exk": "せんせいがすいせんじょうをかいてくださった。", "exm": "老師為我寫了推薦信。"}, {"p": "〜ていただく", "c": "動詞て形＋いただく", "m": "（謙讓）承蒙（為我）做…", "ex": "部長に説明していただいた。", "exk": "ぶちょうにせつめいしていただいた。", "exm": "承蒙部長為我說明。"}, {"p": "〜てほしい", "c": "動詞て形＋ほしい", "m": "希望（別人）…；想要對方做…", "ex": "もっと早く来てほしい。", "exk": "もっとはやくきてほしい。", "exm": "希望你早點來。"}, {"p": "〜てもらえますか", "c": "動詞て形＋もらえますか／もらえませんか", "m": "能請你…嗎（請求）", "ex": "ちょっと手伝ってもらえますか。", "exk": "ちょっとてつだってもらえますか。", "exm": "能請你幫個忙嗎？"}, {"p": "〜てくださいませんか", "c": "動詞て形＋くださいませんか", "m": "能否請您…（鄭重請求）", "ex": "もう一度言ってくださいませんか。", "exk": "もういちどいってくださいませんか。", "exm": "能否請您再說一次？"}, {"p": "〜たがる", "c": "動詞ます形＋たがる", "m": "（第三人稱）想要…（表現於外）", "ex": "弟は新しいゲームを買いたがっている。", "exk": "おとうとはあたらしいげーむをかいたがっている。", "exm": "弟弟想買新遊戲。"}]}]}, {"title": "N4文法 3 ｜ 許可・禁止・義務・忠告", "groups": [{"sub": "", "items": [{"p": "〜てもいい", "c": "動詞て形＋もいい", "m": "可以…（許可）", "ex": "ここに座ってもいいですか。", "exk": "ここにすわってもいいですか。", "exm": "可以坐這裡嗎？"}, {"p": "〜てはいけない", "c": "動詞て形＋はいけない", "m": "不可以…（禁止）", "ex": "ここで写真を撮ってはいけない。", "exk": "ここでしゃしんをとってはいけない。", "exm": "這裡不可以拍照。"}, {"p": "〜なくてもいい", "c": "動詞ない形（なくて）＋もいい", "m": "不…也可以；不必…", "ex": "明日は来なくてもいい。", "exk": "あしたはこなくてもいい。", "exm": "明天不來也可以。"}, {"p": "〜なければならない", "c": "動詞ない形（なければ）＋ならない", "m": "必須…；非…不可", "ex": "明日までにレポートを出さなければならない。", "exk": "あしたまでにれぽーとをださなければならない。", "exm": "明天之前必須交報告。"}, {"p": "〜なきゃ", "c": "動詞ない形＋なきゃ（いけない）", "m": "得…（口語，必須）", "ex": "もう行かなきゃ。", "exk": "もういかなきゃ。", "exm": "我得走了。"}, {"p": "〜ないといけない", "c": "動詞ない形＋といけない", "m": "得…；必須…（否則不行）", "ex": "薬を飲まないといけない。", "exk": "くすりをのまないといけない。", "exm": "得吃藥才行。"}, {"p": "〜たほうがいい", "c": "動詞た形＋ほうがいい", "m": "最好…（建議）", "ex": "早く寝たほうがいい。", "exk": "はやくねたほうがいい。", "exm": "最好早點睡。"}, {"p": "〜ないほうがいい", "c": "動詞ない形＋ほうがいい", "m": "最好不要…（建議）", "ex": "無理をしないほうがいい。", "exk": "むりをしないほうがいい。", "exm": "最好不要勉強。"}, {"p": "〜なさい", "c": "動詞ます形＋なさい", "m": "給我…（命令，長輩對晚輩）", "ex": "早く起きなさい。", "exk": "はやくおきなさい。", "exm": "快點起床。"}, {"p": "〜ないでください", "c": "動詞ない形＋でください", "m": "請不要…", "ex": "ここで騒がないでください。", "exk": "ここでさわがないでください。", "exm": "請不要在這裡吵鬧。"}, {"p": "〜ずに", "c": "動詞ない形（語幹）＋ずに", "m": "不…（就）；沒有…（做另一動作）", "ex": "朝ご飯を食べずに出かけた。", "exk": "あさごはんをたべずにでかけた。", "exm": "沒吃早餐就出門了。"}, {"p": "〜ないで", "c": "動詞ない形＋で", "m": "不…（就做另一動作，附帶）", "ex": "電気を消さないで寝た。", "exk": "でんきをけさないでねた。", "exm": "沒關燈就睡了。"}, {"p": "〜なくて", "c": "動詞ない形（なくて）／い形容詞＋なくて", "m": "因為不…（原因）", "ex": "バスが来なくて、遅刻した。", "exk": "ばすがこなくて、ちこくした。", "exm": "因為公車不來，遲到了。"}]}]}, {"title": "N4文法 4 ｜ 意志・予定・目的・變化", "groups": [{"sub": "", "items": [{"p": "〜(よ)うと思う", "c": "動詞意向形＋と思う", "m": "打算…；想要…", "ex": "今年は日本へ行こうと思う。", "exk": "ことしはにほんへいこうとおもう。", "exm": "今年打算去日本。"}, {"p": "〜(よ)うとする", "c": "動詞意向形＋とする", "m": "正想要…；試圖…", "ex": "出かけようとしたとき、電話が鳴った。", "exk": "でかけようとしたとき、でんわがなった。", "exm": "正要出門時電話響了。"}, {"p": "〜つもりだ", "c": "動詞辞書形／ない形＋つもりだ", "m": "打算…；準備…", "ex": "週末は家で休むつもりだ。", "exk": "しゅうまつはいえでやすむつもりだ。", "exm": "週末打算在家休息。"}, {"p": "〜予定だ", "c": "動詞辞書形／名詞の＋予定だ", "m": "預定…（已定計畫）", "ex": "来月出張する予定だ。", "exk": "らいげつしゅっちょうするよていだ。", "exm": "預定下個月出差。"}, {"p": "〜ことにする", "c": "動詞辞書形／ない形＋ことにする", "m": "決定…（自己的決定）", "ex": "毎朝走ることにした。", "exk": "まいあさはしることにした。", "exm": "決定每天早上跑步。"}, {"p": "〜ことにしている", "c": "動詞辞書形／ない形＋ことにしている", "m": "（習慣）都會…；堅持…", "ex": "毎日日記を書くことにしている。", "exk": "まいにちにっきをかくことにしている。", "exm": "我每天都會寫日記。"}, {"p": "〜ことになる", "c": "動詞辞書形／ない形＋ことになる", "m": "（非自己決定）決定…；結果變成…", "ex": "来月から大阪で働くことになった。", "exk": "らいげつからおおさかではたらくことになった。", "exm": "決定下個月起在大阪工作。"}, {"p": "〜ことになっている", "c": "動詞辞書形／ない形＋ことになっている", "m": "（規定）…；按規定要…", "ex": "会議は九時に始まることになっている。", "exk": "かいぎはくじにはじまることになっている。", "exm": "會議規定九點開始。"}, {"p": "〜ために", "c": "動詞辞書形／名詞の＋ために", "m": "為了…（目的）", "ex": "留学するためにお金をためている。", "exk": "りゅうがくするためにおかねをためている。", "exm": "為了留學在存錢。"}, {"p": "〜ように", "c": "動詞辞書形／ない形＋ように", "m": "為了…（能夠，多接無意志動詞）", "ex": "忘れないようにメモする。", "exk": "わすれないようにめもする。", "exm": "為了不忘記而做筆記。"}, {"p": "〜ように言う", "c": "動詞辞書形／ない形＋ように言う", "m": "叫（某人）做…（間接指示）", "ex": "医者に酒をやめるように言われた。", "exk": "いしゃにさけをやめるようにいわれた。", "exm": "被醫生叫我戒酒。"}, {"p": "〜ようにする", "c": "動詞辞書形／ない形＋ようにする", "m": "盡量…；設法做到…", "ex": "毎日野菜を食べるようにしている。", "exk": "まいにちやさいをたべるようにしている。", "exm": "我盡量每天吃蔬菜。"}, {"p": "〜ようになる", "c": "動詞辞書形／可能形＋ようになる", "m": "變得會…；變得能…（能力變化）", "ex": "日本語が話せるようになった。", "exk": "にほんごがはなせるようになった。", "exm": "變得會說日語了。"}]}]}, {"title": "N4文法 5 ｜ 條件・假定", "groups": [{"sub": "", "items": [{"p": "〜ば", "c": "動詞・形容詞ば形", "m": "如果…就（假定條件）", "ex": "天気がよければ、出かけよう。", "exk": "てんきがよければ、でかけよう。", "exm": "天氣好的話就出門吧。"}, {"p": "〜ば〜ほど", "c": "動詞ば形＋辞書形＋ほど", "m": "越…越…", "ex": "練習すればするほど上手になる。", "exk": "れんしゅうすればするほどじょうずになる。", "exm": "越練習越厲害。"}, {"p": "〜たら", "c": "動詞・形容詞た形＋ら", "m": "如果…；…之後", "ex": "家に帰ったら、電話します。", "exk": "いえにかえったら、でんわします。", "exm": "回到家後就打電話。"}, {"p": "〜と", "c": "動詞・形容詞辞書形＋と", "m": "一…就…（必然、自然結果）", "ex": "このボタンを押すと、切符が出る。", "exk": "このぼたんをおすと、きっぷがでる。", "exm": "一按這個按鈕，票就會出來。"}, {"p": "〜なら", "c": "名詞／動詞辞書形＋なら", "m": "如果是…的話（承接對方話題）", "ex": "日本へ行くなら、京都がいい。", "exk": "にほんへいくなら、きょうとがいい。", "exm": "如果要去日本，京都不錯。"}, {"p": "〜ても", "c": "動詞て形／形容詞＋も", "m": "即使…也", "ex": "雨が降っても、試合をする。", "exk": "あめがふっても、しあいをする。", "exm": "即使下雨也照樣比賽。"}, {"p": "疑問詞＋ても", "c": "疑問詞＋動詞て形＋も", "m": "無論…都", "ex": "いくら食べても太らない。", "exk": "いくらたべてもふとらない。", "exm": "再怎麼吃也不會胖。"}, {"p": "〜たらどうですか", "c": "動詞た形＋らどうですか", "m": "…怎麼樣？（建議）", "ex": "医者に相談したらどうですか。", "exk": "いしゃにそうだんしたらどうですか。", "exm": "去找醫生商量如何？"}]}]}, {"title": "N4文法 6 ｜ 原因・理由・逆接・並列", "groups": [{"sub": "", "items": [{"p": "〜ので", "c": "動詞・形容詞普通形／名詞な＋ので", "m": "因為…（客觀理由）", "ex": "頭が痛いので、早く帰ります。", "exk": "あたまがいたいので、はやくかえります。", "exm": "因為頭痛，要早點回去。"}, {"p": "〜から", "c": "動詞・形容詞普通形／です・ます＋から", "m": "因為…（主觀理由）", "ex": "危ないから、触らないで。", "exk": "あぶないから、さわらないで。", "exm": "因為危險，別碰。"}, {"p": "〜し", "c": "動詞・形容詞普通形＋し", "m": "又…又…；既…（列舉理由）", "ex": "この店は安いし、おいしい。", "exk": "このみせはやすいし、おいしい。", "exm": "這家店又便宜又好吃。"}, {"p": "〜ため（原因）", "c": "動詞普通形／名詞の＋ため(に)", "m": "由於…（原因，較正式）", "ex": "事故のため、電車が遅れた。", "exk": "じこのため、でんしゃがおくれた。", "exm": "由於事故，電車誤點了。"}, {"p": "〜おかげで", "c": "動詞・形容詞普通形／名詞の＋おかげで", "m": "多虧…；托…的福（正面）", "ex": "先生のおかげで合格できた。", "exk": "せんせいのおかげでごうかくできた。", "exm": "多虧老師才能考上。"}, {"p": "〜せいで", "c": "動詞・形容詞普通形／名詞の＋せいで", "m": "都怪…；由於…（負面）", "ex": "台風のせいで旅行が中止になった。", "exk": "たいふうのせいでりょこうがちゅうしになった。", "exm": "都怪颱風，旅行取消了。"}, {"p": "〜のに", "c": "動詞・形容詞普通形／名詞な＋のに", "m": "明明…卻…；雖然…卻", "ex": "薬を飲んだのに、まだ痛い。", "exk": "くすりをのんだのに、まだいたい。", "exm": "明明吃了藥卻還是痛。"}, {"p": "〜けれど(も)", "c": "動詞・形容詞普通形／です・ます＋けれど(も)／が", "m": "雖然…但是", "ex": "このカメラは高いけれど、いい。", "exk": "このかめらはたかいけれど、いい。", "exm": "這台相機雖然貴但很好。"}, {"p": "〜たり〜たり", "c": "動詞た形＋り＋動詞た形＋り＋する", "m": "又…又…；時而…時而…", "ex": "日曜日は本を読んだり、音楽を聞いたりする。", "exk": "にちようびはほんをよんだり、おんがくをきいたりする。", "exm": "星期天又看書又聽音樂。"}, {"p": "〜ながら", "c": "動詞ます形＋ながら", "m": "一邊…一邊…（同時進行）", "ex": "音楽を聞きながら勉強する。", "exk": "おんがくをききながらべんきょうする。", "exm": "一邊聽音樂一邊讀書。"}]}]}, {"title": "N4文法 7 ｜ 推量・樣態・傳聞・比況", "groups": [{"sub": "", "items": [{"p": "〜だろう／でしょう", "c": "動詞・形容詞普通形／名詞＋だろう／でしょう", "m": "…吧（推測）", "ex": "明日は晴れるでしょう。", "exk": "あしたははれるでしょう。", "exm": "明天應該會放晴吧。"}, {"p": "〜かもしれない", "c": "動詞・形容詞普通形／名詞＋かもしれない", "m": "也許…；可能…", "ex": "午後は雨が降るかもしれない。", "exk": "ごごはあめがふるかもしれない。", "exm": "下午也許會下雨。"}, {"p": "〜と思う", "c": "動詞・形容詞普通形／名詞だ＋と思う", "m": "我覺得…；我認為…", "ex": "彼は来ないと思う。", "exk": "かれはこないとおもう。", "exm": "我覺得他不會來。"}, {"p": "〜はずだ", "c": "動詞・形容詞普通形／名詞の＋はずだ", "m": "應該…（有根據的推斷）", "ex": "彼はもう着いているはずだ。", "exk": "かれはもうついているはずだ。", "exm": "他應該已經到了。"}, {"p": "〜はずがない", "c": "動詞・形容詞普通形／名詞の＋はずがない", "m": "不可能…；照理不會…", "ex": "彼がそんなことを言うはずがない。", "exk": "かれがそんなことをいうはずがない。", "exm": "他不可能說那種話。"}, {"p": "〜にちがいない", "c": "動詞・形容詞普通形／名詞＋にちがいない", "m": "一定…；肯定…（強烈推測）", "ex": "あの人は先生にちがいない。", "exk": "あのひとはせんせいにちがいない。", "exm": "那個人一定是老師。"}, {"p": "〜そうだ（樣態）", "c": "動詞ます形／形容詞語幹＋そうだ", "m": "看起來…；快要…（外觀樣子）", "ex": "このケーキはおいしそうだ。", "exk": "このけーきはおいしそうだ。", "exm": "這蛋糕看起來很好吃。"}, {"p": "〜そうだ（傳聞）", "c": "動詞・形容詞普通形／名詞だ＋そうだ", "m": "聽說…；據說…", "ex": "天気予報によると、明日は雪だそうだ。", "exk": "てんきよほうによると、あしたはゆきだそうだ。", "exm": "據天氣預報說明天會下雪。"}, {"p": "〜ようだ", "c": "動詞・形容詞普通形／名詞の＋ようだ", "m": "好像…（根據觀察判斷）", "ex": "誰かいるようだ。", "exk": "だれかいるようだ。", "exm": "好像有人在。"}, {"p": "〜みたいだ", "c": "動詞・形容詞普通形／名詞＋みたいだ", "m": "好像…（口語，同ようだ）", "ex": "彼は風邪をひいたみたいだ。", "exk": "かれはかぜをひいたみたいだ。", "exm": "他好像感冒了。"}, {"p": "〜らしい", "c": "動詞・形容詞普通形／名詞＋らしい", "m": "聽說…；似乎…（依外部消息）", "ex": "彼はもう国へ帰ったらしい。", "exk": "かれはもうくにへかえったらしい。", "exm": "聽說他已經回國了。"}, {"p": "〜って", "c": "名詞／文＋って", "m": "聽說…；所謂…（口語傳聞）", "ex": "田中さん、来週結婚するって。", "exk": "たなかさん、らいしゅうけっこんするって。", "exm": "聽說田中先生下週要結婚。"}]}]}, {"title": "N4文法 8 ｜ 程度・傾向・複合動詞", "groups": [{"sub": "", "items": [{"p": "〜すぎる", "c": "動詞ます形／形容詞語幹＋すぎる", "m": "太…；過度…", "ex": "ゆうべは食べすぎた。", "exk": "ゆうべはたべすぎた。", "exm": "昨晚吃太多了。"}, {"p": "〜やすい", "c": "動詞ます形＋やすい", "m": "容易…；好…", "ex": "このペンは書きやすい。", "exk": "このぺんはかきやすい。", "exm": "這支筆很好寫。"}, {"p": "〜にくい", "c": "動詞ます形＋にくい", "m": "難以…；不好…", "ex": "この字は読みにくい。", "exk": "このじはよみにくい。", "exm": "這個字很難讀。"}, {"p": "〜がる", "c": "形容詞語幹＋がる", "m": "（第三人稱）覺得…；表現出…", "ex": "子供が犬を怖がっている。", "exk": "こどもがいぬをこわがっている。", "exm": "孩子怕狗。"}, {"p": "〜はじめる", "c": "動詞ます形＋はじめる", "m": "開始…（起）", "ex": "桜が咲きはじめた。", "exk": "さくらがさきはじめた。", "exm": "櫻花開始開了。"}, {"p": "〜だす", " /* ---------------- render ---------------- */
const main = document.getElementById('main');
const chipnav = document.getElementById('chipnav');
const esc = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
let current = 'vocab';

function meanHTML(m){ return esc(m).replace(/（([^）]*)）/g,'<span style="color:var(--sub);font-size:.85em">（$1）</span>'); }

function cardVOCAB(it, idx){
  const romaji = it.r ? `<span class="romaji">${esc(it.r)}</span>` : '';
  const numBadge = idx ? `<span class="idx-badge">${idx}.</span>` : '';
  return `<div class="card" data-s="${esc((it.w+it.k+it.r+it.m+it.ex).toLowerCase())}" data-mean="${esc(it.m)}">
    <div class="card-top">
      ${numBadge}<button class="word jp" data-text="${esc(it.k||it.w)}" title="點擊發音">${esc(it.w)}</button>
      <span class="kana jp">${esc(it.k)}</span>${romaji}
    </div>
    <div class="mean">${meanHTML(it.m)}</div>
    <div class="ex">
      <div class="ex-line">
        <div class="ex-ja jp">${esc(it.ex)}</div>
        <button class="say ex" data-text="${esc(it.ex)}" title="播放例句"></button>
      </div>
      <div class="ex-kana jp">${esc(it.exk)}</div>
      <div class="ex-zh">${esc(it.exm)}</div>
    </div>
  </div>`;
}

function cardGRAMMAR(it, idx){
  const numBadge = idx ? `<span class="idx-badge">${idx}.</span>` : '';
  return `<div class="card gram-card" data-s="${esc((it.p+it.c+it.m+it.ex).toLowerCase())}" data-mean="${esc(it.m)}">
    <div class="card-top">
      ${numBadge}<button class="word jp" data-text="${esc(it.ex)}" title="點擊發音（例句）">${esc(it.p)}</button>
    </div>
    <div class="g-conn"><b>接続</b><span>${esc(it.c)}</span></div>
    <div class="mean">${meanHTML(it.m)}</div>
    <div class="ex">
      <div class="ex-line">
        <div class="ex-ja jp">${esc(it.ex)}</div>
        <button class="say ex" data-text="${esc(it.ex)}" title="播放例句"></button>
      </div>
      <div class="ex-kana jp">${esc(it.exk)}</div>
      <div class="ex-zh">${esc(it.exm)}</div>
    </div>
  </div>`;
}

const RENDER = { vocab:cardVOCAB, grammar:cardGRAMMAR };
function render(ch){
  current = ch;
  const cats = DATA[ch] || [];
  const cardFn = RENDER[ch] || cardVOCAB;
  const multiCat = cats.length > 1;
  let html = '', chips = '';
  cats.forEach((c,ci)=>{
    const id = ch+'-'+ci;
    const groups = c.groups || [{sub:null, items:(c.items||[])}];
    const count = groups.reduce((n,g)=>n+g.items.length,0);
    if(multiCat){
      const short = c.title.replace(/（[^）]*）/,'');
      chips += `<a href="#${id}">${esc(short)}</a>`;
    }
    const playBtns = ch === 'grammar'
      ? `<button class="play-all"><span class="ico"></span> 全部播放例句（中→日）</button>
        <button class="play-all play-ja"><span class="ico"></span> 全部播放例句（日）</button>`
      : `<button class="play-all"><span class="ico"></span> 全部播放例句（中→日）</button>
        <button class="play-all play-zhja"><span class="ico"></span> 播放中日</button>`;
    html += `<section class="cat" id="${id}">
      <div class="cat-h">
        <h2 class="jp">${esc(c.title)}</h2>
        <span class="cnt">${count} 項</span>
        ${playBtns}
      </div>`;
    let idxCounter = 0;
    groups.forEach((g,gi)=>{
      const gid = id+'-g'+gi;
      const gridId = gid+'-grid';
      if(g.sub){
        html += `<div class="subhead" id="${gid}">${esc(g.sub)}</div>`;
        if(!multiCat) chips += `<a href="#${gid}">${esc(g.sub)}</a>`;
      }
      html += `<div class="grid" id="${gridId}">` + g.items.map(it=>cardFn(it, ++idxCounter)).join('') + '</div>';
    });
    html += '</section>';
  });
  main.innerHTML = html;
  chipnav.innerHTML = chips;
  chipnav.style.display = chips ? '' : 'none';
  applyFilter(document.getElementById('q').value);
}

/* tabs */
document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    stopAll();
    render(t.dataset.ch);
    window.scrollTo({top:0});
  });
});

/* search filter */
const q = document.getElementById('q');
function applyFilter(v){
  v = (v||'').trim().toLowerCase();
  document.querySelectorAll('#main .card').forEach(card=>{
    card.classList.toggle('hidden', v && !card.dataset.s.includes(v));
  });
  document.querySelectorAll('#main .cat').forEach(sec=>{
    const any = sec.querySelector('.card:not(.hidden)');
    sec.classList.toggle('hidden', !any);
  });
}
q.addEventListener('input', e=>applyFilter(e.target.value));

/* ---------------- speech ---------------- */
const supported = 'speechSynthesis' in window;
let jaVoice = null;
let zhVoice = null;
function pickVoice(){
  const vs = speechSynthesis.getVoices();
  jaVoice = vs.find(v=>/ja(-|_)?/i.test(v.lang)) || vs.find(v=>/japanese/i.test(v.name)) || null;
  zhVoice = vs.find(v=>/zh-TW|zh_TW|Hant/i.test(v.lang+v.name)) || vs.find(v=>/zh(-|_)?/i.test(v.lang)) || null;
  const note = document.getElementById('voiceNote');
  if(!supported){ note.textContent='⚠ 此瀏覽器不支援語音合成，發音按鈕已停用。'; }
  else if(jaVoice){ note.textContent='🔊 目前日語語音：'+jaVoice.name; }
  else { note.textContent='🔊 語音已就緒（未偵測到專用日語語音，將使用預設語音）。'; }
}
if(supported){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }

let runId = 0;
function stopAll(){
  runId++;
  if(supported) speechSynthesis.cancel();
  document.querySelectorAll('.say.playing, .word.playing, .play-all.playing').forEach(b=>b.classList.remove('playing'));
}
function makeUtter(text, lang){
  lang = lang || 'ja-JP';
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang; u.rate = 0.9;
  if(lang.startsWith('ja')){
    if(!jaVoice) pickVoice();
    if(jaVoice) u.voice = jaVoice;
  } else if(lang.startsWith('zh')){
    if(zhVoice) u.voice = zhVoice;
  }
  return u;
}
function speakOne(btn){
  const text = btn.dataset.text||'';
  stopAll();
  if(!text || !supported) return;
  const my = runId;
  btn.classList.add('playing');
  const u = makeUtter(text);
  u.onend = u.onerror = ()=>{ if(my===runId) btn.classList.remove('playing'); };
  speechSynthesis.speak(u);
}
const SEQUENCE_GAP_MS = 800;
function speakSequence(btn, items){
  const was = btn.classList.contains('playing');
  stopAll();
  if(was || !supported || !items.length) return;
  const my = runId;
  btn.classList.add('playing');
  let i=0;
  (function next(){
    if(my!==runId) return;
    if(i>=items.length){ btn.classList.remove('playing'); return; }
    const {text,lang} = items[i++];
    const u = makeUtter(text, lang);
    u.onend = ()=>{ if(my===runId) setTimeout(next, SEQUENCE_GAP_MS); };
    u.onerror = ()=>{ if(my===runId) btn.classList.remove('playing'); };
    speechSynthesis.speak(u);
  })();
}
function collectExamplesZhJa(container){
  const items = [];
  container.querySelectorAll('.card:not(.hidden)').forEach(card=>{
    const zh = card.querySelector('.ex-zh')?.textContent;
    const ja = card.querySelector('.say.ex')?.dataset.text;
    if(zh) items.push({text:zh, lang:'zh-TW'});
    if(ja) items.push({text:ja, lang:'ja-JP'});
  });
  return items;
}
function collectExamplesJa(container){
  return [...container.querySelectorAll('.card:not(.hidden) .say.ex')]
    .map(b=>b.dataset.text).filter(Boolean).map(text=>({text, lang:'ja-JP'}));
}
function collectWordMeanJaZh(container){
  const items = [];
  container.querySelectorAll('.card:not(.hidden)').forEach(card=>{
    const mean = card.dataset.mean;
    const word = card.querySelector('.word')?.dataset.text;
    if(word) items.push({text:word, lang:'ja-JP'});
    if(mean) items.push({text:mean, lang:'zh-TW'});
  });
  return items;
}
function speakSection(btn){ speakSequence(btn, collectExamplesZhJa(btn.closest('.cat'))); }
function speakSectionJa(btn){ speakSequence(btn, collectExamplesJa(btn.closest('.cat'))); }
function speakZhJa(btn){ speakSequence(btn, collectWordMeanJaZh(btn.closest('.cat'))); }
document.addEventListener('click', e=>{
  const pja = e.target.closest('.play-ja');
  if(pja){ speakSectionJa(pja); return; }
  const pz = e.target.closest('.play-zhja');
  if(pz){ speakZhJa(pz); return; }
  const pa = e.target.closest('.play-all');
  if(pa){ speakSection(pa); return; }
  const s = e.target.closest('.say, .word');
  if(s){ speakOne(s); return; }
});

/* init */
render('vocab');


</script>
