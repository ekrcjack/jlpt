<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JLPT N2 單字・文法</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#c0392b; --accent2:#8e44ad;
  --paper:#fbf7f0; --card:#ffffff; --ink:#2b2320; --sub:#6f635b;
  --line:#e7ddcf; --chip:#f1e9dc; --ok:#1e8449; --shadow:0 2px 8px rgba(80,50,30,.08);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  line-height:1.6; -webkit-text-size-adjust:100%;
}
.jp{font-family:"Noto Serif JP","Hiragino Mincho ProN",serif;}
header.top{
  position:sticky; top:0; z-index:30; background:rgba(251,247,240,.96);
  backdrop-filter:blur(6px); border-bottom:1px solid var(--line);
}
.top-in{max-width:1080px;margin:0 auto;padding:12px 16px 0}
.top h1{font-size:1.15rem;margin:0 0 2px;font-weight:700}
.top p{margin:0;color:var(--sub);font-size:.82rem}
.head-row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.head-title{min-width:0}
.head-tools{display:flex;gap:8px;align-items:center;flex:0 0 auto}
.tabs{display:flex;gap:6px;margin-top:10px;flex-wrap:nowrap}
.tab{
  appearance:none;border:1px solid var(--line);background:var(--card);color:var(--sub);
  padding:7px 12px;border-radius:10px 10px 0 0;font-size:1.02rem;font-weight:600;cursor:pointer;
  border-bottom:none;transition:.15s;white-space:nowrap;flex:0 0 auto;
}
.tab.active{color:#fff;background:var(--accent);border-color:var(--accent)}
.toolbar{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search{width:auto;max-width:70vw;display:inline-flex;align-items:center;gap:8px;background:var(--card);
  border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.search input{border:none;outline:none;background:none;font-size:.95rem;color:var(--ink);
  field-sizing:content;width:auto;min-width:2em;max-width:60vw}
.btn-stop{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--sub);
  padding:8px 14px;border-radius:10px;font-weight:600;cursor:pointer}
.btn-stop:hover{border-color:var(--accent);color:var(--accent)}
.chipnav{max-width:1080px;margin:0 auto;padding:0 16px 6px;display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.chipnav a{white-space:nowrap;text-decoration:none;font-size:.8rem;color:var(--sub);
  background:var(--chip);border:1px solid var(--line);padding:5px 11px;border-radius:999px}
.chipnav a:hover{color:var(--accent);border-color:var(--accent)}
main{max-width:1080px;margin:0 auto;padding:8px 16px 80px}
.cat{margin:26px 0 8px;scroll-margin-top:150px}
.cat-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  border-bottom:2px solid var(--accent);padding-bottom:8px;margin-bottom:14px}
.cat-h h2{font-size:1.15rem;margin:0;font-weight:700}
.cat-h .cnt{color:var(--sub);font-size:.8rem;font-weight:500}
.play-all{appearance:none;cursor:pointer;margin-left:auto;border:1px solid var(--accent);
  color:var(--accent);background:transparent;border-radius:999px;padding:6px 14px;font-weight:600;font-size:.85rem;
  display:inline-flex;align-items:center;gap:6px;transition:.15s}
.play-all:hover{background:var(--accent);color:#fff}
.play-all.playing{background:var(--accent);color:#fff}
.play-all.playing .ico::before{content:"■"}
.play-all .ico::before{content:"▶"}
.play-zhja{border-color:var(--accent2);color:var(--accent2)}
.play-zhja:hover{background:var(--accent2);color:#fff}
.play-zhja.playing{background:var(--accent2);color:#fff}
.subhead{font-size:.9rem;font-weight:700;color:var(--accent2);margin:16px 0 8px;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;scroll-margin-top:150px}
.subhead::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;
  box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.card-top{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.word{font-size:1.5rem;font-weight:700;line-height:1.2;cursor:pointer;border:none;background:none;
  color:var(--ink);padding:0;font-family:"Noto Serif JP",serif;text-align:left}
.word:hover{color:var(--accent)}
.idx-badge{color:var(--sub);font-size:.85rem;font-weight:600;margin-right:4px}
.word::after{content:"🔊";font-size:.7rem;margin-left:5px;opacity:.4;vertical-align:middle}
.word:hover::after{opacity:.9}
.word.playing{color:var(--accent);text-decoration:underline}
.kana{color:var(--sub);font-size:.9rem}
.romaji{color:#b7a99a;font-size:.76rem;font-style:italic}
.mean{color:var(--ink);font-size:.92rem}
.mean b{color:var(--accent);font-weight:600}
.ex{margin-top:2px;padding:9px 11px;background:var(--paper);border-radius:10px;border:1px solid var(--line)}
.ex-line{display:flex;align-items:flex-start;gap:8px}
.ex-ja{flex:1;font-family:"Noto Serif JP",serif;font-size:1.02rem;font-weight:600}
.ex-kana{color:var(--sub);font-size:.82rem;margin-top:2px}
.ex-zh{color:var(--sub);font-size:.85rem;margin-top:1px}
.say{appearance:none;flex:none;cursor:pointer;width:30px;height:30px;border-radius:50%;
  border:1px solid var(--accent);color:var(--accent);background:#fff;font-size:.8rem;line-height:1;
  display:inline-flex;align-items:center;justify-content:center;transition:.15s}
.say:hover{background:var(--accent);color:#fff}
.say.playing{background:var(--accent);color:#fff;animation:pulse 1s infinite}
.say::before{content:"▶"}
.say.playing::before{content:"■"}
@keyframes pulse{50%{opacity:.55}}
/* ch3 */
.k-onkun{display:flex;gap:14px;flex-wrap:wrap;font-size:.86rem;color:var(--sub)}
.k-onkun b{color:var(--ink);font-weight:600;margin-right:3px}
.k-rei{font-family:"Noto Serif JP",serif;font-size:.95rem;color:var(--ink)}
.k-rei-line{font-size:.84rem;color:var(--sub);font-family:"Noto Serif JP",serif}
.rei-lbl{display:inline-block;font-family:"Noto Sans TC",sans-serif;font-size:.7rem;
  color:var(--accent2);border:1px solid var(--accent2);border-radius:5px;padding:0 5px;margin-right:6px;vertical-align:middle}
/* 形容詞反義配對 */
.ant{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:6px;padding-top:8px;border-top:1px dashed var(--line)}
.ant-mark{font-size:.7rem;color:var(--accent2);border:1px solid var(--accent2);border-radius:5px;padding:0 6px;font-family:"Noto Sans TC",sans-serif}
.ant .word{font-size:1.2rem}
.ex-ant .ex-ja{font-weight:600}
.ex-ant{border-style:dashed}
/* 五十音卡 */
.kana-card .word{font-size:2.3rem}
.kana-card .card-top{align-items:center}
/* 五十音例句卡（50 tab） */
.k50-row2{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.k50-zh{color:var(--ink);font-size:.92rem}
.hidden{display:none !important}
.empty-note{color:var(--sub);text-align:center;padding:30px}
footer{max-width:1080px;margin:0 auto;padding:16px;color:var(--sub);font-size:.78rem;border-top:1px solid var(--line)}
@media (max-width:640px){
  /* 標題與搜尋維持同一列，搜尋靠右、不換行 */
  .head-row{align-items:center;gap:10px}
  .search input{min-width:0;max-width:52vw}
}
@media (max-width:520px){
  .word{font-size:1.35rem}
  .grid{grid-template-columns:1fr}
  .top h1{font-size:1.02rem}
  .tabs{gap:5px}
  .tab{padding:6px 9px;font-size:.95rem}
}
@media (prefers-reduced-motion:reduce){.say.playing{animation:none}}

/* 文法卡 */
.gram-card .word{font-size:1.25rem}
.g-conn{display:flex;gap:8px;flex-wrap:wrap;font-size:.84rem;color:var(--sub);align-items:baseline}
.g-conn b{color:var(--ink);font-weight:600}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="head-row">
      <div class="head-title"><h1>JLPT N2 單字・文法</h1></div>
      <div class="head-tools">
        <label class="search"><span aria-hidden="true">🔍</span>
          <input id="q" type="search" placeholder="搜尋…" autocomplete="off"></label>
      </div>
    </div>
    <div class="tabs">
      <button class="tab active" data-ch="vocab">單字</button>
      <button class="tab" data-ch="grammar">文法</button>

  <nav class="chipnav" id="chipnav"></nav>
</header>
<main id="main"></main>
<footer>

</footer>

ンがきにいる。", "exm": "喜歡這個設計。"}, {"w": "手を貸す", "k": "てをかす", "r": "te wo kasu", "m": "幫忙", "ex": "引っ越しに手を貸す。", "exk": "ひっこしにてをかす。", "exm": "幫忙搬家。"}, {"w": "目を通す", "k": "めをとおす", "r": "me wo toosu", "m": "瀏覽", "ex": "書類に目を通す。", "exk": "しょるいにめをとおす。", "exm": "瀏覽文件。"}, {"w": "気が付く", "k": "きがつく", "r": "ki ga tsuku", "m": "察覺", "ex": "間違いに気が付く。", "exk": "まちがいにきがつく。", "exm": "察覺到錯誤。"}, {"w": "世話になる", "k": "せわになる", "r": "sewa ni naru", "m": "承蒙照顧", "ex": "先生に世話になる。", "exk": "せんせいにせわになる。", "exm": "承蒙老師照顧。"}, {"w": "役に立つ", "k": "やくにたつ", "r": "yaku ni tatsu", "m": "有幫助", "ex": "この辞書は役に立つ。", "exk": "このじしょはやくにたつ。", "exm": "這本辭典很有用。"}, {"w": "気が合う", "k": "きがあう", "r": "ki ga au", "m": "合得來", "ex": "彼とは気が合う。", "exk": "かれとはきがあう。", "exm": "跟他很合得來。"}, {"w": "腹が立つ", "k": "はらがたつ", "r": "hara ga tatsu", "m": "生氣", "ex": "態度に腹が立つ。", "exk": "たいどにはらがたつ。", "exm": "對那態度感到生氣。"}, {"w": "口を出す", "k": "くちをだす", "r": "kuchi wo dasu", "m": "插嘴、干涉", "ex": "人の話に口を出す。", "exk": "ひとのはなしにくちをだす。", "exm": "插嘴別人的談話。"}, {"w": "手が空く", "k": "てがあく", "r": "te ga aku", "m": "有空", "ex": "手が空いたら手伝う。", "exk": "てがあいたらてつだう。", "exm": "有空的話就幫忙。"}, {"w": "気を配る", "k": "きをくばる", "r": "ki wo kubaru", "m": "留心、關照", "ex": "周囲に気を配る。", "exk": "しゅういにきをくばる。", "exm": "留意周遭。"}, {"w": "息を呑む", "k": "いきをのむ", "r": "iki wo nomu", "m": "屏息、驚愕", "ex": "美しさに息を呑む。", "exk": "うつくしさにいきをのむ。", "exm": "為之美屏息。"}, {"w": "骨が折れる", "k": "ほねがおれる", "r": "hone ga oreru", "m": "費力、費事", "ex": "骨が折れる作業だ。", "exk": "ほねがおれるさぎょうだ。", "exm": "費力的工作。"}, {"w": "顔を出す", "k": "かおをだす", "r": "kao wo dasu", "m": "露面、出席", "ex": "会合に顔を出す。", "exk": "かいごうにかおをだす。", "exm": "在聚會上露個面。"}, {"w": "気が重い", "k": "きがおもい", "r": "ki ga omoi", "m": "心情沉重", "ex": "明日の会議は気が重い。", "exk": "あしたのかいぎはきがおもい。", "exm": "明天的會議讓人心情沉重。"}, {"w": "目が離せない", "k": "めがはなせない", "r": "me ga hanasenai", "m": "無法移開視線、需密切關注", "ex": "子供から目が離せない。", "exk": "こどもからめがはなせない。", "exm": "無法讓孩子離開視線。"}, {"w": "話にならない", "k": "はなしにならない", "r": "hanashi ni naranai", "m": "不成話、談不上", "ex": "この案では話にならない。", "exk": "このあんでははなしにならない。", "exm": "這個方案根本不像話。"}, {"w": "手間がかかる", "k": "てまがかかる", "r": "tema ga kakaru", "m": "費工夫", "ex": "手間がかかる料理だ。", "exk": "てまがかかるりょうりだ。", "exm": "費工夫的料理。"}, {"w": "気が短い", "k": "きがみじかい", "r": "ki ga mijikai", "m": "性急", "ex": "彼は気が短い。", "exk": "かれはきがみじかい。", "exm": "他很性急。"}]}]}], "grammar": [{"title": "N2文法 1 ｜ 時間・場合", "groups": [{"sub": "", "items": [{"p": "〜際に／に際して", "c": "名詞の／動詞辞書形・た形＋際(に)／に際して", "m": "在…之際；當…的時候（鄭重）", "ex": "お帰りの際に、電気を消してください。", "exk": "おかえりのさいに、でんきをけしてください。", "exm": "回去的時候請關燈。"}, {"p": "〜にあたって", "c": "名詞／動詞辞書形＋にあたって／にあたり", "m": "在…之際（面臨重要事情，積極）", "ex": "新生活を始めるにあたって、必要な物をそろえた。", "exk": "しんせいかつをはじめるにあたって、ひつようなものをそろえた。", "exm": "在展開新生活之際，備齊了必要的東西。"}, {"p": "〜において／における", "c": "名詞＋において／における＋名詞", "m": "在…（場所、時間、方面）", "ex": "会議は第一会議室において行われる。", "exk": "かいぎはだいいちかいぎしつにおいておこなわれる。", "exm": "會議在第一會議室舉行。"}, {"p": "〜最中に", "c": "名詞の／動詞ている＋最中に", "m": "正當…的時候（動作進行中被打斷）", "ex": "食事の最中に、電話がかかってきた。", "exk": "しょくじのさいちゅうに、でんわがかかってきた。", "exm": "正在吃飯的時候，來了電話。"}, {"p": "〜うちに", "c": "名詞の／動詞辞書形・ている／い形／な形な＋うちに", "m": "趁著…的時候；在…期間", "ex": "熱いうちに召し上がってください。", "exk": "あついうちにめしあがってください。", "exm": "請趁熱享用。"}, {"p": "〜かける／かけの", "c": "動詞ます形＋かける／かけだ／かけの", "m": "做到一半；正要…", "ex": "飲みかけのコーヒーが机に置いてある。", "exk": "のみかけのこーひーがつくえにおいてある。", "exm": "喝到一半的咖啡放在桌上。"}, {"p": "〜たとたん(に)", "c": "動詞た形＋とたん(に)", "m": "剛一…就（意外、瞬間）", "ex": "家を出たとたんに、雨が降り出した。", "exk": "いえをでたとたんに、あめがふりだした。", "exm": "剛一出門就下起雨來。"}, {"p": "〜てはじめて", "c": "動詞て形＋はじめて", "m": "…之後才（第一次體會）", "ex": "病気になってはじめて、健康のありがたさが分かった。", "exk": "びょうきになってはじめて、けんこうのありがたさがわかった。", "exm": "生病之後才體會到健康的可貴。"}, {"p": "〜次第", "c": "動詞ます形／名詞（する動詞語幹）＋次第", "m": "一…就立刻（鄭重）", "ex": "会場に着き次第、ご連絡します。", "exk": "かいじょうにつきしだい、ごれんらくします。", "exm": "一到達會場就立刻與您聯絡。"}, {"p": "〜か〜ないかのうちに", "c": "動詞辞書形／た形＋か＋ない形＋かのうちに", "m": "剛一…就（幾乎同時）", "ex": "ベルが鳴るか鳴らないかのうちに、彼は駆け出した。", "exk": "べるがなるかならないかのうちに、かれはかけだした。", "exm": "鈴聲剛響他就衝了出去。"}, {"p": "〜たびに", "c": "名詞の／動詞辞書形＋たびに", "m": "每當…就；每次…", "ex": "この曲を聞くたびに、学生時代を思い出す。", "exk": "このきょくをきくたびに、がくせいじだいをおもいだす。", "exm": "每次聽這首歌就想起學生時代。"}, {"p": "〜にわたって", "c": "名詞＋にわたって／にわたる", "m": "歷經…；長達…（範圍、期間廣）", "ex": "工事は三年にわたって続けられた。", "exk": "こうじはさんねんにわたってつづけられた。", "exm": "工程持續了長達三年。"}, {"p": "〜ところに／ところへ", "c": "動詞辞書形／ている／た形＋ところに／ところへ", "m": "正當…的時候（此時發生）", "ex": "出かけようとしたところへ、客が来た。", "exk": "でかけようとしたところへ、きゃくがきた。", "exm": "正要出門時客人來了。"}, {"p": "〜て以来", "c": "動詞て形＋以来", "m": "自從…以來（一直）", "ex": "卒業して以来、彼には会っていない。", "exk": "そつぎょうしていらい、かれにはあっていない。", "exm": "自從畢業以來就沒見過他。"}, {"p": "〜をきっかけに／を契機に", "c": "名詞／動詞た形の＋をきっかけに／を契機に", "m": "以…為契機、開端", "ex": "留学をきっかけに、料理を始めた。", "exk": "りゅうがくをきっかけに、りょうりをはじめた。", "exm": "以留學為契機開始下廚。"}, {"p": "〜ないうちに", "c": "動詞ない形＋うちに", "m": "趁還沒…之前", "ex": "暗くならないうちに帰りましょう。", "exk": "くらくならないうちにかえりましょう。", "exm": "趁天還沒黑之前回家吧。"}]}]}, {"title": "N2文法 2 ｜ 原因・理由", "groups": [{"sub": "", "items": [{"p": "〜おかげで", "c": "名詞の／動詞・形容詞＋おかげで", "m": "多虧…；托…的福（正面）", "ex": "先生のおかげで、試験に合格できた。", "exk": "せんせいのおかげで、しけんにごうかくできた。", "exm": "多虧老師，我通過了考試。"}, {"p": "〜せいで／せいか", "c": "名詞の／動詞・形容詞＋せいで／せいか", "m": "都怪…；因為…（負面）", "ex": "寝坊したせいで、電車に乗り遅れた。", "exk": "ねぼうしたせいで、でんしゃにのりおくれた。", "exm": "都怪睡過頭，沒趕上電車。"}, {"p": "〜ものだから", "c": "動詞・形容詞＋ものだから", "m": "因為…（辯解、強調原因）", "ex": "道が込んでいたものだから、遅れてしまった。", "exk": "みちがこんでいたものだから、おくれてしまった。", "exm": "因為路上塞車，所以遲到了。"}, {"p": "〜もので", "c": "動詞・形容詞＋もので", "m": "因為…（委婉說明理由）", "ex": "慣れないもので、時間がかかってしまいます。", "exk": "なれないもので、じかんがかかってしまいます。", "exm": "因為還不熟練，會比較花時間。"}, {"p": "〜ばかりに", "c": "動詞・形容詞／名詞である＋ばかりに", "m": "就因為…（導致不好結果）", "ex": "一言多く言ったばかりに、喧嘩になった。", "exk": "ひとことおおくいったばかりに、けんかになった。", "exm": "就因為多說了一句，結果吵了起來。"}, {"p": "〜あまり(に)", "c": "名詞の／動詞辞書形・た形＋あまり", "m": "由於過度…（導致）", "ex": "緊張のあまり、言葉が出なかった。", "exk": "きんちょうのあまり、ことばがでなかった。", "exm": "由於太緊張，說不出話來。"}, {"p": "〜につき", "c": "名詞＋につき", "m": "由於…（公告、書面）", "ex": "工事中につき、通行止めです。", "exk": "こうじちゅうにつき、つうこうどめです。", "exm": "由於施工中，禁止通行。"}, {"p": "〜ことから", "c": "動詞・形容詞／名詞である＋ことから", "m": "由於…；從…（來由、判斷根據）", "ex": "煙が出ていることから、火事だと分かった。", "exk": "けむりがでていることから、かじだとわかった。", "exm": "從冒出煙來判斷發生了火災。"}, {"p": "〜からこそ", "c": "動詞・形容詞／名詞だ＋からこそ", "m": "正因為…才", "ex": "努力したからこそ、成功できたのだ。", "exk": "どりょくしたからこそ、せいこうできたのだ。", "exm": "正因為努力了才能成功。"}, {"p": "〜以上(は)", "c": "動詞辞書形・た形／名詞である＋以上(は)", "m": "既然…就（理應）", "ex": "約束した以上は、守るべきだ。", "exk": "やくそくしたいじょうは、まもるべきだ。", "exm": "既然約好了就該遵守。"}, {"p": "〜からには", "c": "動詞辞書形・た形＋からには", "m": "既然…就（決心）", "ex": "やると決めたからには、最後までやる。", "exk": "やるときめたからには、さいごまでやる。", "exm": "既然決定要做，就會做到最後。"}, {"p": "〜ことだから", "c": "名詞の＋ことだから", "m": "因為是…（所以想必如此）", "ex": "彼女のことだから、時間どおりに来るだろう。", "exk": "かのじょのことだから、じかんどおりにくるだろう。", "exm": "因為是她，想必會準時來。"}, {"p": "〜につけ", "c": "動詞辞書形＋につけ", "m": "每當…就（自然引發某種情感）", "ex": "この写真を見るにつけ、故郷が恋しくなる。", "exk": "このしゃしんをみるにつけ、こきょうがこいしくなる。", "exm": "每當看到這張照片就想念故鄉。"}, {"p": "〜ことだし", "c": "動詞・形容詞／名詞な・である＋ことだし", "m": "既然…（列舉理由之一，那就）", "ex": "天気もいいことだし、出かけよう。", "exk": "てんきもいいことだし、でかけよう。", "exm": "天氣也好，出門吧。"}]}]}, {"title": "N2文法 3 ｜ 逆接・對比", "groups": [{"sub": "", "items": [{"p": "〜くせに", "c": "動詞・形容詞／名詞の＋くせに", "m": "明明…卻（帶責備、輕蔑）", "ex": "知っているくせに、教えてくれない。", "exk": "しっているくせに、おしえてくれない。", "exm": "明明知道卻不告訴我。"}, {"p": "〜わりに(は)", "c": "動詞・形容詞／名詞の＋わりに(は)", "m": "雖然…但相對而言（不符比例）", "ex": "この店は値段のわりにおいしい。", "exk": "このみせはねだんのわりにおいしい。", "exm": "這家店相對於價格算好吃。"}, {"p": "〜反面／半面", "c": "動詞・形容詞／名詞である＋反面", "m": "另一方面；相反地（一體兩面）", "ex": "都会は便利な反面、物価が高い。", "exk": "とかいはべんりなはんめん、ぶっかがたかい。", "exm": "都市方便，另一方面物價卻高。"}, {"p": "〜一方(で)", "c": "動詞・形容詞／名詞である＋一方(で)", "m": "一方面…另一方面（並列、對比）", "ex": "収入が増える一方で、支出も増えた。", "exk": "しゅうにゅうがふえるいっぽうで、ししゅつもふえた。", "exm": "收入增加的同時，支出也增加了。"}, {"p": "〜どころか", "c": "動詞・形容詞／名詞＋どころか", "m": "別說…了（反而、程度更甚）", "ex": "貯金どころか、借金だらけだ。", "exk": "ちょきんどころか、しゃっきんだらけだ。", "exm": "別說存款了，全是欠債。"}, {"p": "〜にもかかわらず", "c": "動詞・形容詞／名詞（である）＋にもかかわらず", "m": "儘管…卻（出乎意料）", "ex": "努力したにもかかわらず、失敗した。", "exk": "どりょくしたにもかかわらず、しっぱいした。", "exm": "儘管努力了卻還是失敗。"}, {"p": "〜にしては", "c": "名詞／動詞普通形＋にしては", "m": "就…而言算是（與預期不符）", "ex": "初心者にしては、上手に描けている。", "exk": "しょしんしゃにしては、じょうずにかけている。", "exm": "就初學者而言畫得算好。"}, {"p": "〜に反して", "c": "名詞＋に反して／に反する", "m": "與…相反；違反", "ex": "予想に反して、試合は簡単に終わった。", "exk": "よそうにはんして、しあいはかんたんにおわった。", "exm": "與預料相反，比賽輕易地結束了。"}, {"p": "〜に対して", "c": "名詞＋に対して", "m": "對於…；相對於…（對象、對比）", "ex": "兄がおとなしいのに対して、弟は活発だ。", "exk": "あにがおとなしいのにたいして、おとうとはかっぱつだ。", "exm": "相對於哥哥文靜，弟弟很活潑。"}, {"p": "〜としても", "c": "動詞・形容詞／名詞だ＋としても", "m": "即使…也", "ex": "たとえ失敗したとしても、後悔はしない。", "exk": "たとえしっぱいしたとしても、こうかいはしない。", "exm": "即使失敗也不後悔。"}, {"p": "〜ながら(も)", "c": "動詞ます形／形容詞／名詞＋ながら(も)", "m": "雖然…卻", "ex": "悪いと知りながらも、やめられない。", "exk": "わるいとしりながらも、やめられない。", "exm": "雖然知道不對卻戒不掉。"}, {"p": "〜くらいなら", "c": "動詞辞書形＋くらいなら", "m": "與其…不如（寧可）", "ex": "途中でやめるくらいなら、最初からやらない方がいい。", "exk": "とちゅうでやめるくらいなら、さいしょからやらないほうがいい。", "exm": "與其中途放棄，不如一開始就別做。"}, {"p": "〜に比べて", "c": "名詞＋に比べて／に比べ", "m": "與…相比", "ex": "去年に比べて、今年は雨が多い。", "exk": "きょねんにくらべて、ことしはあめがおおい。", "exm": "與去年相比，今年雨水多。"}, {"p": "〜からといって", "c": "動詞・形容詞／名詞だ＋からといって", "m": "不能因為…就", "ex": "高いからといって、いいとは限らない。", "exk": "たかいからといって、いいとはかぎらない。", "exm": "不能因為貴就一定好。"}]}]}, {"title": "N2文法 4 ｜ 目的・附加・列舉", "groups": [{"sub": "", "items": [{"p": "〜をこめて", "c": "名詞＋をこめて", "m": "傾注…（感情）", "ex": "心をこめて、手紙を書いた。", "exk": "こころをこめて、てがみをかいた。", "exm": "用心地寫了信。"}, {"p": "〜をもとに(して)", "c": "名詞＋をもとに(して)", "m": "以…為依據、素材", "ex": "この映画は実話をもとに作られた。", "exk": "このえいがはじつわをもとにつくられた。", "exm": "這部電影是根據真實故事製作的。"}, {"p": "〜を中心に(して)", "c": "名詞＋を中心に(して)", "m": "以…為中心", "ex": "若者を中心に、この歌が流行している。", "exk": "わかものをちゅうしんに、このうたがりゅうこうしている。", "exm": "以年輕人為中心，這首歌很流行。"}, {"p": "〜をはじめ(として)", "c": "名詞＋をはじめ(として)", "m": "以…為首；…等等", "ex": "校長をはじめ、多くの先生が出席した。", "exk": "こうちょうをはじめ、おおくのせんせいがしゅっせきした。", "exm": "以校長為首，許多老師出席了。"}, {"p": "〜をめぐって", "c": "名詞＋をめぐって／をめぐる", "m": "圍繞…（爭論、對立）", "ex": "遺産をめぐって、兄弟が争っている。", "exk": "いさんをめぐって、きょうだいがあらそっている。", "exm": "圍繞遺產，兄弟正在爭執。"}, {"p": "〜に加えて", "c": "名詞＋に加えて", "m": "加上…；不僅…還", "ex": "風に加えて、雨まで降ってきた。", "exk": "かぜにくわえて、あめまでふってきた。", "exm": "颳風不說，還下起了雨。"}, {"p": "〜上に", "c": "動詞・形容詞／名詞である＋上に", "m": "而且…；再加上", "ex": "この部屋は狭い上に、暗い。", "exk": "このへやはせまいうえに、くらい。", "exm": "這房間又窄又暗。"}, {"p": "〜はもちろん", "c": "名詞＋はもちろん", "m": "…自不用說，連…也", "ex": "漢字はもちろん、ひらがなも書けない。", "exk": "かんじはもちろん、ひらがなもかけない。", "exm": "別說漢字，連平假名都不會寫。"}, {"p": "〜やら〜やら", "c": "名詞／動詞・形容詞＋やら（重複）", "m": "…啦…啦（列舉，繁雜）", "ex": "引っ越しで、片付けやら手続きやらで忙しい。", "exk": "ひっこしで、かたづけやらてつづきやらでいそがしい。", "exm": "因為搬家，收拾啦手續啦忙得不可開交。"}, {"p": "〜も〜ば〜も", "c": "名詞＋も＋動詞・形容詞ば形＋名詞＋も", "m": "既…又…（並列）", "ex": "彼は頭もよければ、性格もいい。", "exk": "かれはあたまもよければ、せいかくもいい。", "exm": "他既聰明，性格又好。"}, {"p": "〜ついでに", "c": "名詞の／動詞辞書形・た形＋ついでに", "m": "順便…", "ex": "買い物のついでに、郵便局に寄った。", "exk": "かいもののついでに、ゆうびんきょくによった。", "exm": "買東西順便去了郵局。"}, {"p": "〜ぬきで／ぬきに", "c": "名詞＋ぬきで／ぬきに", "m": "省去…；不加…", "ex": "朝食ぬきで、会社に行った。", "exk": "ちょうしょくぬきで、かいしゃにいった。", "exm": "沒吃早餐就去公司了。"}, {"p": "〜とともに", "c": "名詞／動詞辞書形＋とともに", "m": "與…一起；隨著…", "ex": "年をとるとともに、体力が衰える。", "exk": "としをとるとともに、たいりょくがおとろえる。", "exm": "隨著年紀增長，體力衰退。"}, {"p": "〜に応じて", "c": "名詞＋に応じて／に応じた", "m": "因應…；根據…", "ex": "収入に応じて、税金を払う。", "exk": "しゅうにゅうにおうじて、ぜいきんをはらう。", "exm": "依收入繳納稅金。"}, {"p": "〜に基づいて", "c": "名詞＋に基づいて／に基づく", "m": "基於…；根據…", "ex": "事実に基づいて、記事を書く。", "exk": "じじつにもとづいて、きじをかく。", "exm": "根據事實撰寫報導。"}]}]}, {"title": "N2文法 5 ｜ 樣態・程度", "groups": [{"sub": "", "items": [{"p": "〜だらけ", "c": "名詞＋だらけ", "m": "滿是…（多為負面）", "ex": "子供の服は泥だらけだ。", "exk": "こどものふくはどろだらけだ。", "exm": "孩子的衣服滿是泥巴。"}, {"p": "〜ぎみ", "c": "名詞／動詞ます形＋ぎみ", "m": "有點…的傾向", "ex": "最近、少し疲れ気味だ。", "exk": "さいきん、すこしつかれぎみだ。", "exm": "最近有點疲倦。"}, {"p": "〜っぽい", "c": "名詞／動詞ます形／形容詞語幹＋っぽい", "m": "帶有…感覺；容易…", "ex": "彼は最近、怒りっぽくなった。", "exk": "かれはさいきん、おこりっぽくなった。", "exm": "他最近變得容易生氣。"}, {"p": "〜かのようだ", "c": "動詞・形容詞普通形＋かのようだ", "m": "彷彿…一樣", "ex": "彼はまるで何も知らないかのように話す。", "exk": "かれはまるでなにもしらないかのようにはなす。", "exm": "他說得彷彿什麼都不知道一樣。"}, {"p": "〜ほど", "c": "動詞辞書形／名詞＋ほど", "m": "到…的程度", "ex": "歩けないほど疲れた。", "exk": "あるけないほどつかれた。", "exm": "累到走不動。"}, {"p": "〜くらい／ぐらい", "c": "動詞・形容詞／名詞＋くらい", "m": "…的程度（輕微或誇張）", "ex": "涙が出るくらい笑った。", "exk": "なみだがでるくらいわらった。", "exm": "笑到流眼淚。"}, {"p": "〜きる／きれない", "c": "動詞ます形＋きる／きれない", "m": "完全…完；…不完", "ex": "この量は一人では食べきれない。", "exk": "このりょうはひとりではたべきれない。", "exm": "這份量一個人吃不完。"}, {"p": "〜てしょうがない", "c": "動詞て形／形容詞＋てしょうがない", "m": "…得不得了（無法控制）", "ex": "お腹が空いてしょうがない。", "exk": "おなかがすいてしょうがない。", "exm": "肚子餓得不得了。"}, {"p": "〜てたまらない", "c": "動詞て形／形容詞＋てたまらない", "m": "…得受不了（強烈感受）", "ex": "国の家族に会いたくてたまらない。", "exk": "くにのかぞくにあいたくてたまらない。", "exm": "想見家鄉的家人想得受不了。"}, {"p": "〜ものがある", "c": "動詞辞書形／形容詞＋ものがある", "m": "確實有…之處；令人感到", "ex": "彼の演技には、心を打つものがある。", "exk": "かれのえんぎには、こころをうつものがある。", "exm": "他的演技確實有打動人心之處。"}, {"p": "〜ば〜ほど", "c": "動詞・形容詞ば形＋同語辞書形＋ほど", "m": "越…越…", "ex": "考えれば考えるほど、分からなくなる。", "exk": "かんがえればかんがえるほど、わからなくなる。", "exm": "越想越搞不懂。"}, {"p": "〜向きだ", "c": "名詞＋向き(だ)", "m": "適合…；朝向…", "ex": "この本は初心者向きだ。", "exk": "このほんはしょしんしゃむきだ。", "exm": "這本書適合初學者。"}, {"p": "〜向けだ", "c": "名詞＋向け(だ)", "m": "專為…（對象）", "ex": "これは子供向けの番組だ。", "exk": "これはこどもむけのばんぐみだ。", "exm": "這是專為兒童製作的節目。"}, {"p": "〜ふりをする", "c": "動詞・形容詞／名詞の＋ふりをする", "m": "假裝…", "ex": "彼は聞こえないふりをした。", "exk": "かれはきこえないふりをした。", "exm": "他假裝沒聽見。"}, {"p": "〜とおりに／どおりに", "c": "動詞辞書形・た形／名詞の＋とおりに（名詞＋どおりに）", "m": "按照…；正如…", "ex": "説明書のとおりに組み立てた。", "exk": "せつめいしょのとおりにくみたてた。", "exm": "按照說明書組裝了。"}]}]}, {"title": "N2文法 6 ｜ 判斷・推量", "groups": [{"sub": "", "items": [{"p": "〜に違いない", "c": "動詞・形容詞／名詞＋に違いない", "m": "一定是…（強烈推測）", "ex": "あの様子では、彼は知っていたに違いない。", "exk": "あのようすでは、かれはしっていたにちがいない。", "exm": "看那樣子，他一定早就知道了。"}, {"p": "〜に相違ない", "c": "動詞・形容詞／名詞＋に相違ない", "m": "必定是…（書面、鄭重）", "ex": "これは本人の筆跡に相違ない。", "exk": "これはほんにんのひっせきにそういない。", "exm": "這必定是本人的筆跡。"}, {"p": "〜に決まっている", "c": "動詞・形容詞／名詞＋に決まっている", "m": "肯定是…；必然（口語斷定）", "ex": "そんな話、嘘に決まっている。", "exk": "そんなはなし、うそにきまっている。", "exm": "那種話肯定是騙人的。"}, {"p": "〜恐れがある", "c": "動詞辞書形／名詞の＋恐れがある", "m": "有…的危險、可能（不好的事）", "ex": "台風が上陸する恐れがある。", "exk": "たいふうがじょうりくするおそれがある。", "exm": "颱風有登陸的可能。"}, {"p": "〜わけだ", "c": "動詞・形容詞／名詞な・である＋わけだ", "m": "難怪…；也就是說（合理推論）", "ex": "道理で寒いわけだ、雪が降っている。", "exk": "どうりでさむいわけだ、ゆきがふっている。", "exm": "難怪這麼冷，原來在下雪。"}, {"p": "〜わけがない", "c": "動詞・形容詞／名詞な・である＋わけがない", "m": "不可能…；絕不會", "ex": "こんな簡単な問題、間違えるわけがない。", "exk": "こんなかんたんなもんだい、まちがえるわけがない。", "exm": "這麼簡單的題目不可能答錯。"}, {"p": "〜わけではない", "c": "動詞・形容詞／名詞な・である＋わけではない", "m": "並不是…（部分否定）", "ex": "嫌いなわけではないが、あまり食べない。", "exk": "きらいなわけではないが、あまりたべない。", "exm": "並不是討厭，只是不太吃。"}, {"p": "〜わけにはいかない", "c": "動詞辞書形／ない形＋わけにはいかない", "m": "不能…（情理上）", "ex": "大事な会議だから、休むわけにはいかない。", "exk": "だいじなかいぎだから、やすむわけにはいかない。", "exm": "因為是重要會議，不能請假。"}, {"p": "〜べきだ／べきではない", "c": "動詞辞書形＋べきだ／べきではない", "m": "應該…／不該…", "ex": "約束は守るべきだ。", "exk": "やくそくはまもるべきだ。", "exm": "承諾就應該遵守。"}, {"p": "〜ざるを得ない", "c": "動詞ない形（語幹）＋ざるを得ない", "m": "不得不…（無奈）", "ex": "上司の命令だから、従わざるを得ない。", "exk": "じょうしのめいれいだから、したがわざるをえない。", "exm": "因為是上司的命令，不得不服從。"}, {"p": "〜よりほか(は)ない", "c": "動詞辞書形＋よりほか(は)ない／よりしかたがない", "m": "只能…；除此之外別無他法", "ex": "終電がないので、歩いて帰るよりほかない。", "exk": "しゅうでんがないので、あるいてかえるよりほかない。", "exm": "沒有末班車，只能走路回家。"}, {"p": "〜にほかならない", "c": "名詞＋にほかならない", "m": "正是…；不外乎（斷定）", "ex": "成功は努力の結果にほかならない。", "exk": "せいこうはどりょくのけっかにほかならない。", "exm": "成功正是努力的結果。"}, {"p": "〜かねない", "c": "動詞ます形＋かねない", "m": "有可能…（不好的結果）", "ex": "そんな無理をすると、体を壊しかねない。", "exk": "そんなむりをすると、からだをこわしかねない。", "exm": "那樣勉強有可能會搞壞身體。"}, {"p": "〜ものだ", "c": "動詞辞書形・ない形／形容詞＋ものだ", "m": "本來就…；理應如此（道理、感嘆）", "ex": "年を取れば、体力は衰えるものだ。", "exk": "としをとれば、たいりょくはおとろえるものだ。", "exm": "上了年紀，體力本來就會衰退。"}, {"p": "〜に過ぎない", "c": "動詞・形容詞／名詞＋に過ぎない", "m": "只不過是…", "ex": "それは言い訳に過ぎない。", "exk": "それはいいわけにすぎない。", "exm": "那只不過是藉口。"}]}]}, {"title": "N2文法 7 ｜ 傳聞・引用・關聯", "groups": [{"sub": "", "items": [{"p": "〜によると／によれば", "c": "名詞＋によると／によれば", "m": "根據…（消息來源）", "ex": "天気予報によると、明日は晴れるそうだ。", "exk": "てんきよほうによると、あしたははれるそうだ。", "exm": "根據氣象預報，明天會放晴。"}, {"p": "〜ということだ", "c": "動詞・形容詞／名詞だ＋ということだ", "m": "據說…（傳聞）", "ex": "部長は来週出張するということだ。", "exk": "ぶちょうはらいしゅうしゅっちょうするということだ。", "exm": "據說部長下週要出差。"}, {"p": "〜とか", "c": "動詞・形容詞／名詞＋とか", "m": "聽說…（不確定的傳聞）", "ex": "彼はもう引っ越したとか。", "exk": "かれはもうひっこしたとか。", "exm": "聽說他已經搬走了。"}, {"p": "〜って", "c": "文＋って", "m": "…（引用、據說，口語）", "ex": "明日は休みだって。", "exk": "あしたはやすみだって。", "exm": "聽說明天放假。"}, {"p": "〜について", "c": "名詞＋について", "m": "關於…", "ex": "日本の文化について研究している。", "exk": "にほんのぶんかについてけんきゅうしている。", "exm": "正在研究關於日本的文化。"}, {"p": "〜に関して", "c": "名詞＋に関して／に関する", "m": "有關…（書面）", "ex": "事件に関して、詳しく調べる。", "exk": "じけんにかんして、くわしくしらべる。", "exm": "就案件詳加調查。"}, {"p": "〜にとって", "c": "名詞＋にとって", "m": "對…來說", "ex": "この写真は私にとって宝物だ。", "exk": "このしゃしんはわたしにとってたからものだ。", "exm": "這張照片對我來說是寶物。"}, {"p": "〜として(は)", "c": "名詞＋として(は)", "m": "作為…；以…身分、立場", "ex": "医者として、忠告します。", "exk": "いしゃとして、ちゅうこくします。", "exm": "作為醫生，我要提出忠告。"}, {"p": "〜という", "c": "名詞＋という＋名詞", "m": "叫做…；所謂…（命名、內容）", "ex": "田中という人から電話があった。", "exk": "たなかというひとからでんわがあった。", "exm": "有位叫田中的人來電。"}, {"p": "〜と言えば", "c": "名詞＋と言えば", "m": "說到…（聯想、提起話題）", "ex": "京都と言えば、お寺が有名だ。", "exk": "きょうとといえば、おてらがゆうめいだ。", "exm": "說到京都，寺廟很有名。"}, {"p": "〜からいうと／からいえば", "c": "名詞＋からいうと／からいえば", "m": "從…來說（觀點、立場）", "ex": "経験からいうと、この方法が一番だ。", "exk": "けいけんからいうと、このほうほうがいちばんだ。", "exm": "從經驗來說，這個方法最好。"}, {"p": "〜にかけては", "c": "名詞＋にかけては", "m": "在…方面（很擅長）", "ex": "料理にかけては、彼女の右に出る者はいない。", "exk": "りょうりにかけては、かのじょのみぎにでるものはいない。", "exm": "在做菜方面，沒人比得上她。"}, {"p": "〜からして", "c": "名詞＋からして", "m": "光從…來看（就）", "ex": "その態度からして、反省していないようだ。", "exk": "そのたいどからして、はんせいしていないようだ。", "exm": "光看那態度，似乎沒有反省。"}, {"p": "〜からすると／からすれば", "c": "名詞＋からすると／からすれば", "m": "從…來判斷", "ex": "話し方からすると、彼は関西の出身だろう。", "exk": "はなしかたからすると、かれはかんさいのしゅっしんだろう。", "exm": "從說話方式判斷，他應該是關西人。"}, {"p": "〜っけ", "c": "動詞・形容詞普通形／名詞だ＋っけ", "m": "…來著？（回想、確認）", "ex": "あの人の名前は何だっけ。", "exk": "あのひとのなまえはなんだっけ。", "exm": "那個人叫什麼名字來著？"}]}]}, {"title": "N2文法 8 ｜ 變化・傾向", "groups": [{"sub": "", "items": [{"p": "〜つつある", "c": "動詞ます形＋つつある", "m": "正在逐漸…（持續變化）", "ex": "景気は回復しつつある。", "exk": "けいきはかいふくしつつある。", "exm": "景氣正在逐漸恢復。"}, {"p": "〜一方だ", "c": "動詞辞書形＋一方だ", "m": "不斷地…（單一方向變化）", "ex": "物価は上がる一方だ。", "exk": "ぶっかはあがるいっぽうだ。", "exm": "物價不斷上漲。"}, {"p": "〜ばかりだ", "c": "動詞辞書形＋ばかりだ", "m": "一味地…（越來越，多負面）", "ex": "病状は悪くなるばかりだ。", "exk": "びょうじょうはわるくなるばかりだ。", "exm": "病情一味惡化。"}, {"p": "〜につれて", "c": "名詞／動詞辞書形＋につれて", "m": "隨著…（同時變化）", "ex": "時間がたつにつれて、痛みが和らいだ。", "exk": "じかんがたつにつれて、いたみがやわらいだ。", "exm": "隨著時間過去，疼痛緩和了。"}, {"p": "〜にしたがって", "c": "名詞／動詞辞書形＋にしたがって", "m": "隨著…；依照…", "ex": "上に行くにしたがって、気温が下がる。", "exk": "うえにいくにしたがって、きおんがさがる。", "exm": "越往上，氣溫越低。"}, {"p": "〜にともなって", "c": "名詞／動詞辞書形＋にともなって", "m": "伴隨…（連帶變化）", "ex": "人口の増加にともなって、住宅が不足している。", "exk": "じんこうのぞうかにともなって、じゅうたくがふそくしている。", "exm": "隨著人口增加，住宅不足。"}, {"p": "〜がち", "c": "名詞／動詞ます形＋がち", "m": "容易…；往往…（負面傾向）", "ex": "冬は風邪をひきがちだ。", "exk": "ふゆはかぜをひきがちだ。", "exm": "冬天容易感冒。"}, {"p": "〜かねる", "c": "動詞ます形＋かねる", "m": "難以…；無法…（婉拒）", "ex": "その件については、お答えいたしかねます。", "exk": "そのけんについては、おこたえいたしかねます。", "exm": "關於那件事，恕難回答。"}, {"p": "〜得る／得ない", "c": "動詞ます形＋得る（うる／える）／得ない", "m": "可能…／不可能…", "ex": "それは十分あり得る話だ。", "exk": "それはじゅうぶんありうるはなしだ。", "exm": "那是完全可能發生的事。"}, {"p": "〜込む", "c": "動詞ます形＋込む", "m": "深入…；徹底…（複合動詞）", "ex": "彼は何かを考え込んでいる。", "exk": "かれはなにかをかんがえこんでいる。", "exm": "他正在沉思著什麼。"}, {"p": "〜ことになっている", "c": "動詞辞書形・ない形＋ことになっている", "m": "規定…；按慣例…", "ex": "学校では日本語を話すことになっている。", "exk": "がっこうではにほんごをはなすことになっている。", "exm": "學校規定要說日語。"}, {"p": "〜ことにしている", "c": "動詞辞書形・ない形＋ことにしている", "m": "習慣…；決定（並保持）", "ex": "毎朝ジョギングすることにしている。", "exk": "まいあさじょぎんぐすることにしている。", "exm": "我習慣每天早上慢跑。"}, {"p": "〜ことになる", "c": "動詞辞書形・ない形＋ことになる", "m": "結果變成…；決定（非己意）", "ex": "来月、大阪へ転勤することになった。", "exk": "らいげつ、おおさかへてんきんすることになった。", "exm": "下個月要調職到大阪了。"}, {"p": "〜がたい", "c": "動詞ます形＋がたい", "m": "難以…（心理上）", "ex": "彼の話は信じがたい。", "exk": "かれのはなしはしんじがたい。", "exm": "他的話難以置信。"}]}]}, {"title": "N2文法 9 ｜ 條件・假定", "groups": [{"sub": "", "items": [{"p": "〜さえ〜ば", "c": "名詞＋さえ＋動詞・形容詞ば形", "m": "只要…就", "ex": "あなたさえいれば、他に何もいらない。", "exk": "あなたさえいれば、ほかになにもいらない。", "exm": "只要有你，其他什麼都不需要。"}, {"p": "〜としたら／とすれば／とすると", "c": "動詞・形容詞／名詞だ＋としたら", "m": "假如…的話", "ex": "宝くじが当たったとしたら、何を買う。", "exk": "たからくじがあたったとしたら、なにをかう。", "exm": "假如中了彩券，你要買什麼。"}, {"p": "〜ものなら", "c": "動詞可能形＋ものなら", "m": "如果能…的話（多為難以實現）", "ex": "帰れるものなら、今すぐ故郷に帰りたい。", "exk": "かえれるものなら、いますぐこきょうにかえりたい。", "exm": "如果能回去，真想現在立刻回故鄉。"}, {"p": "〜かぎり(は)", "c": "動詞辞書形・ている／形容詞／名詞である＋かぎり(は)", "m": "只要…就（在…的範圍內）", "ex": "体が健康なかぎり、働き続けたい。", "exk": "からだがけんこうなかぎり、はたらきつづけたい。", "exm": "只要身體健康，就想繼續工作。"}, {"p": "〜ないかぎり", "c": "動詞ない形＋かぎり", "m": "只要不…就（除非）", "ex": "謝らないかぎり、許さない。", "exk": "あやまらないかぎり、ゆるさない。", "exm": "只要不道歉就不原諒。"}, {"p": "〜ようでは", "c": "動詞・形容詞普通形＋ようでは", "m": "如果…這樣的話（就不行）", "ex": "こんな失敗をするようでは、まだまだだ。", "exk": "こんなしっぱいをするようでは、まだまだだ。", "exm": "要是犯 /* ---------------- render ---------------- */
const main = document.getElementById('main');
const chipnav = document.getElementById('chipnav');
const esc = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
let current = 'vocab';

function meanHTML(m){ return esc(m).replace(/（([^）]*)）/g,'<span style="color:var(--sub);font-size:.85em">（$1）</span>'); }

function cardVOCAB(it, idx){
  const romaji = it.r ? `<span class="romaji">${esc(it.r)}</span>` : '';
  const numBadge = idx ? `<span class="idx-badge">${idx}.</span>` : '';
  return `<div class="card" data-s="${esc((it.w+it.k+it.r+it.m+it.ex).toLowerCase())}" data-mean="${esc(it.m)}">
    <div class="card-top">
      ${numBadge}<button class="word jp" data-text="${esc(it.k||it.w)}" title="點擊發音">${esc(it.w)}</button>
      <span class="kana jp">${esc(it.k)}</span>${romaji}
    </div>
    <div class="mean">${meanHTML(it.m)}</div>
    <div class="ex">
      <div class="ex-line">
        <div class="ex-ja jp">${esc(it.ex)}</div>
        <button class="say ex" data-text="${esc(it.ex)}" title="播放例句"></button>
      </div>
      <div class="ex-kana jp">${esc(it.exk)}</div>
      <div class="ex-zh">${esc(it.exm)}</div>
    </div>
  </div>`;
}

function cardGRAMMAR(it, idx){
  const numBadge = idx ? `<span class="idx-badge">${idx}.</span>` : '';
  return `<div class="card gram-card" data-s="${esc((it.p+it.c+it.m+it.ex).toLowerCase())}" data-mean="${esc(it.m)}">
    <div class="card-top">
      ${numBadge}<button class="word jp" data-text="${esc(it.ex)}" title="點擊發音（例句）">${esc(it.p)}</button>
    </div>
    <div class="g-conn"><b>接続</b><span>${esc(it.c)}</span></div>
    <div class="mean">${meanHTML(it.m)}</div>
    <div class="ex">
      <div class="ex-line">
        <div class="ex-ja jp">${esc(it.ex)}</div>
        <button class="say ex" data-text="${esc(it.ex)}" title="播放例句"></button>
      </div>
      <div class="ex-kana jp">${esc(it.exk)}</div>
      <div class="ex-zh">${esc(it.exm)}</div>
    </div>
  </div>`;
}

const RENDER = { vocab:cardVOCAB, grammar:cardGRAMMAR };
function render(ch){
  current = ch;
  const cats = DATA[ch] || [];
  const cardFn = RENDER[ch] || cardVOCAB;
  const multiCat = cats.length > 1;
  let html = '', chips = '';
  cats.forEach((c,ci)=>{
    const id = ch+'-'+ci;
    const groups = c.groups || [{sub:null, items:(c.items||[])}];
    const count = groups.reduce((n,g)=>n+g.items.length,0);
    if(multiCat){
      const short = c.title.replace(/（[^）]*）/,'');
      chips += `<a href="#${id}">${esc(short)}</a>`;
    }
    const playBtns = ch === 'grammar'
      ? `<button class="play-all"><span class="ico"></span> 全部播放例句（中→日）</button>
        <button class="play-all play-ja"><span class="ico"></span> 全部播放例句（日）</button>`
      : `<button class="play-all"><span class="ico"></span> 全部播放例句（中→日）</button>
        <button class="play-all play-zhja"><span class="ico"></span> 播放中日</button>`;
    html += `<section class="cat" id="${id}">
      <div class="cat-h">
        <h2 class="jp">${esc(c.title)}</h2>
        <span class="cnt">${count} 項</span>
        ${playBtns}
      </div>`;
    let idxCounter = 0;
    groups.forEach((g,gi)=>{
      const gid = id+'-g'+gi;
      const gridId = gid+'-grid';
      if(g.sub){
        html += `<div class="subhead" id="${gid}">${esc(g.sub)}</div>`;
        if(!multiCat) chips += `<a href="#${gid}">${esc(g.sub)}</a>`;
      }
      html += `<div class="grid" id="${gridId}">` + g.items.map(it=>cardFn(it, ++idxCounter)).join('') + '</div>';
    });
    html += '</section>';
  });
  main.innerHTML = html;
  chipnav.innerHTML = chips;
  chipnav.style.display = chips ? '' : 'none';
  applyFilter(document.getElementById('q').value);
}

/* tabs */
document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    stopAll();
    render(t.dataset.ch);
    window.scrollTo({top:0});
  });
});

/* search filter */
const q = document.getElementById('q');
function applyFilter(v){
  v = (v||'').trim().toLowerCase();
  document.querySelectorAll('#main .card').forEach(card=>{
    card.classList.toggle('hidden', v && !card.dataset.s.includes(v));
  });
  document.querySelectorAll('#main .cat').forEach(sec=>{
    const any = sec.querySelector('.card:not(.hidden)');
    sec.classList.toggle('hidden', !any);
  });
}
q.addEventListener('input', e=>applyFilter(e.target.value));

const supported = 'speechSynthesis' in window;
let jaVoice = null;
let zhVoice = null;
function pickVoice(){
  const vs = speechSynthesis.getVoices();
  jaVoice = vs.find(v=>/ja(-|_)?/i.test(v.lang)) || vs.find(v=>/japanese/i.test(v.name)) || null;
  zhVoice = vs.find(v=>/zh-TW|zh_TW|Hant/i.test(v.lang+v.name)) || vs.find(v=>/zh(-|_)?/i.test(v.lang)) || null;
  const note = document.getElementById('voiceNote');
  if(!supported){ note.textContent='⚠ 此瀏覽器不支援語音合成，發音按鈕已停用。'; }
  else if(jaVoice){ note.textContent='🔊 目前日語語音：'+jaVoice.name; }
  else { note.textContent='🔊 語音已就緒（未偵測到專用日語語音，將使用預設語音）。'; }
}
if(supported){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }

let runId = 0;
function stopAll(){
  runId++;
  if(supported) speechSynthesis.cancel();
  document.querySelectorAll('.say.playing, .word.playing, .play-all.playing').forEach(b=>b.classList.remove('playing'));
}
function makeUtter(text, lang){
  lang = lang || 'ja-JP';
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang; u.rate = 0.9;
  if(lang.startsWith('ja')){
    if(!jaVoice) pickVoice();
    if(jaVoice) u.voice = jaVoice;
  } else if(lang.startsWith('zh')){
    if(zhVoice) u.voice = zhVoice;
  }
  return u;
}
function speakOne(btn){
  const text = btn.dataset.text||'';
  stopAll();
  if(!text || !supported) return;
  const my = runId;
  btn.classList.add('playing');
  const u = makeUtter(text);
  u.onend = u.onerror = ()=>{ if(my===runId) btn.classList.remove('playing'); };
  speechSynthesis.speak(u);
}
const SEQUENCE_GAP_MS = 800;
function speakSequence(btn, items){
  const was = btn.classList.contains('playing');
  stopAll();
  if(was || !supported || !items.length) return;
  const my = runId;
  btn.classList.add('playing');
  let i=0;
  (function next(){
    if(my!==runId) return;
    if(i>=items.length){ btn.classList.remove('playing'); return; }
    const {text,lang} = items[i++];
    const u = makeUtter(text, lang);
    u.onend = ()=>{ if(my===runId) setTimeout(next, SEQUENCE_GAP_MS); };
    u.onerror = ()=>{ if(my===runId) btn.classList.remove('playing'); };
    speechSynthesis.speak(u);
  })();
}
function collectExamplesZhJa(container){
  const items = [];
  container.querySelectorAll('.card:not(.hidden)').forEach(card=>{
    const zh = card.querySelector('.ex-zh')?.textContent;
    const ja = card.querySelector('.say.ex')?.dataset.text;
    if(zh) items.push({text:zh, lang:'zh-TW'});
    if(ja) items.push({text:ja, lang:'ja-JP'});
  });
  return items;
}
function collectExamplesJa(container){
  return [...container.querySelectorAll('.card:not(.hidden) .say.ex')]
    .map(b=>b.dataset.text).filter(Boolean).map(text=>({text, lang:'ja-JP'}));
}
function collectWordMeanJaZh(container){
  const items = [];
  container.querySelectorAll('.card:not(.hidden)').forEach(card=>{
    const mean = card.dataset.mean;
    const word = card.querySelector('.word')?.dataset.text;
    if(word) items.push({text:word, lang:'ja-JP'});
    if(mean) items.push({text:mean, lang:'zh-TW'});
  });
  return items;
}
function speakSection(btn){ speakSequence(btn, collectExamplesZhJa(btn.closest('.cat'))); }
function speakSectionJa(btn){ speakSequence(btn, collectExamplesJa(btn.closest('.cat'))); }
function speakZhJa(btn){ speakSequence(btn, collectWordMeanJaZh(btn.closest('.cat'))); }
document.addEventListener('click', e=>{
  const pja = e.target.closest('.play-ja');
  if(pja){ speakSectionJa(pja); return; }
  const pz = e.target.closest('.play-zhja');
  if(pz){ speakZhJa(pz); return; }
  const pa = e.target.closest('.play-all');
  if(pa){ speakSection(pa); return; }
  const s = e.target.closest('.say, .word');
  if(s){ speakOne(s); return; }
});

/* init */
render('vocab');


</script>
