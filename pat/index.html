<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>日文句型帳N5・N4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --sumi:#14171c;
  --ai:#1f3a63;
  --ai-deep:#101d33;
  --ai-soft:#e6eaf2;
  --shu:#c2402c;
  --washi:#f1f0eb;
  --card:#fffefb;
  --rule:#d8d5cb;
  --muted:#6e7278;
  --mincho:"Zen Old Mincho","Noto Serif JP",serif;
  --gothic:"Noto Sans TC","Hiragino Sans",system-ui,sans-serif;
  --mono:ui-monospace,"SFMono-Regular",Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;scroll-padding-top:150px}
body{margin:0;background:var(--washi);color:var(--sumi);font-family:var(--gothic);line-height:1.7;
  font-size:16px;-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}

/* ── 表紙 ── */
.cover{background:var(--ai-deep);color:#f4f2ec;padding:36px 20px 28px;position:relative;overflow:hidden}
.cover::after{content:"";position:absolute;inset:0;
  background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);
  background-size:26px 26px;pointer-events:none}
.cover-inner{position:relative;z-index:1;max-width:880px;margin:0 auto}
.seal{display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;
  border:2px solid var(--shu);color:#fff;background:var(--shu);border-radius:3px;
  font-family:var(--mincho);font-size:24px;font-weight:700;line-height:1;letter-spacing:0}
h1{font-family:var(--mincho);font-weight:900;font-size:clamp(30px,8vw,44px);margin:14px 0 6px;letter-spacing:.06em}
.sub{color:#a9b6cc;font-size:13.5px;letter-spacing:.08em;margin:0}
.count{margin-top:16px;display:flex;gap:22px;font-family:var(--mono);font-size:12px;color:#8fa0bb;letter-spacing:.1em}
.count b{display:block;font-family:var(--mincho);font-size:26px;color:#fff;font-weight:700;letter-spacing:0}

/* ── 工具列 ── */
.bar{position:sticky;top:0;z-index:20;background:rgba(241,240,235,.96);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--rule);padding:10px 14px 8px}
.bar-inner{max-width:880px;margin:0 auto}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--rule);
  border-radius:2px;padding:8px 12px}
.search input{border:0;outline:0;flex:1;font:inherit;font-size:15px;background:transparent;color:var(--sumi);min-width:0}
.search span{color:var(--muted);font-size:14px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:9px 0 3px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--rule);background:transparent;color:var(--ai);
  font-family:var(--gothic);font-size:13px;padding:5px 13px;border-radius:2px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ai);color:#fff;border-color:var(--ai)}
.levels{display:flex;gap:0;margin:9px 0 0;border:1px solid var(--ai);border-radius:2px;overflow:hidden;width:fit-content}
.lv{border:0;background:transparent;color:var(--ai);font-family:var(--mono);font-size:12px;letter-spacing:.1em;
  padding:6px 18px;cursor:pointer;border-right:1px solid var(--ai)}
.lv:last-child{border-right:0}
.lv[aria-pressed="true"]{background:var(--ai);color:#fff}
.tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;padding:2px 7px;border-radius:2px;
  vertical-align:middle;font-weight:400}
.tag.n5{background:var(--ai-soft);color:var(--ai)}
.tag.n4{background:#f7e3df;color:var(--shu)}
.opts{display:flex;flex-wrap:wrap;gap:14px;align-items:center;padding-top:6px;font-size:12.5px;color:var(--muted)}
.opts label{display:inline-flex;align-items:center;gap:5px;cursor:pointer}
.opts input[type=checkbox]{accent-color:var(--ai);width:15px;height:15px}
.opts select{font:inherit;font-size:12.5px;border:1px solid var(--rule);background:var(--card);
  padding:2px 4px;border-radius:2px;color:var(--sumi)}
:focus-visible{outline:2px solid var(--shu);outline-offset:2px}

/* ── 內容 ── */
main{max-width:880px;margin:0 auto;padding:18px 14px 90px}
.group-label{font-family:var(--mincho);font-size:15px;color:var(--ai);letter-spacing:.3em;
  border-bottom:1px solid var(--rule);padding:22px 0 6px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:2px;margin-bottom:14px;
  box-shadow:0 1px 0 rgba(20,23,28,.04)}
.card-head{padding:16px 16px 12px;border-bottom:1px dashed var(--rule)}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase}
.pat{font-family:var(--mincho);font-size:26px;font-weight:700;margin:2px 0 10px;line-height:1.35;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.form{font-family:var(--mono);font-size:12px;color:var(--ai);background:var(--ai-soft);
  border-left:3px solid var(--ai);padding:7px 10px;line-height:1.65;word-break:break-word}
.note{font-size:14.5px;color:#3d4148;margin:11px 0 0}
.ex-list{padding:6px 0 10px}
.ex{display:flex;gap:11px;align-items:flex-start;padding:11px 16px;border-bottom:1px solid #f0eee7}
.ex:last-child{border-bottom:0}
.ex-body{flex:1;min-width:0}
.kana{font-family:var(--mincho);font-size:11.5px;color:var(--muted);letter-spacing:.04em;
  margin-bottom:1px;word-break:break-all}
.jp{font-family:var(--mincho);font-size:20px;line-height:1.9;word-break:break-all;
  background-image:repeating-linear-gradient(90deg,rgba(31,58,99,.07) 0 1px,transparent 1px 30px);
  background-position:0 100%;background-size:100% 100%}
.zh{font-size:13.5px;color:var(--muted);margin-top:2px}
.hide-kana .kana,.hide-zh .zh{display:none}
.play{flex:0 0 auto;width:34px;height:34px;margin-top:6px;border:0;border-radius:50%;
  background:var(--shu);color:#fff;font-family:var(--mincho);font-size:15px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:transform .12s,opacity .12s}
.play:hover{opacity:.85}
.play:active{transform:scale(.9)}
.play.on{animation:pulse .9s ease-in-out infinite}
.allbtn{margin-top:11px;font:inherit;font-size:12px;letter-spacing:.06em;padding:6px 13px;
  border:1px solid var(--ai);background:transparent;color:var(--ai);cursor:pointer;border-radius:2px;
  transition:background .15s,color .15s}
.allbtn:hover{background:var(--ai-soft)}
.allbtn.on{background:var(--shu);border-color:var(--shu);color:#fff}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(194,64,44,.18)}}
.empty{text-align:center;color:var(--muted);padding:60px 20px;font-size:14px}
.tip{background:#fff8e8;border:1px solid #e8d9a8;color:#6b5a25;font-size:13px;
  padding:10px 12px;border-radius:2px;margin-bottom:16px;display:none}
footer{max-width:880px;margin:0 auto;padding:0 14px 40px;color:var(--muted);font-size:12px;line-height:1.9}

/* 回到最上面 */
.fab{
  position:fixed;right:22px;bottom:24px;z-index:60;
  width:46px;height:46px;border:none;border-radius:50%;cursor:pointer;
  background:linear-gradient(135deg,var(--ai),var(--ai-deep));color:#fff;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 18px rgba(0,0,0,.22);
  opacity:0;visibility:hidden;transform:translateY(10px);
  transition:opacity .25s,transform .25s,visibility .25s,box-shadow .15s;
}
.fab.show{opacity:1;visibility:visible;transform:translateY(0);}
.fab:hover{box-shadow:0 8px 22px rgba(0,0,0,.3);}
.fab:active{transform:scale(.92);}
.fab:focus-visible{outline:2px solid #fff;outline-offset:2px;}
.fab svg{width:20px;height:20px;fill:currentColor;}
@media(max-width:640px){.fab{right:14px;bottom:16px;width:42px;height:42px;}}
</style>
</head>
<body>

<header class="cover">
  <div class="cover-inner">
    <div class="seal">文</div>
    <h1>日本語文型帳</h1>
    <p class="sub">JLPT N5・N4 句型・用法・例文　｜　點紅印聽發音</p>
    <div class="count">
      <div>句型<b id="cP">0</b></div>
      <div>例文<b id="cE">0</b></div>
      <div>N5<b id="c5">0</b></div>
      <div>N4<b id="c4">0</b></div>
    </div>
  </div>
</header>

<div class="bar">
  <div class="bar-inner">
    <div class="search">
      <span>検索</span>
      <input id="q" type="search" placeholder="搜尋句型、日文或中文，例如：たら、被動、應該" autocomplete="off">
    </div>
    <div class="levels" id="levels">
      <button class="lv" data-lv="全部" aria-pressed="true">全部</button>
      <button class="lv" data-lv="N5" aria-pressed="false">N5</button>
      <button class="lv" data-lv="N4" aria-pressed="false">N4</button>
    </div>
    <div class="chips" id="chips"></div>
    <div class="opts">
      <label><input type="checkbox" id="tKana" checked> 顯示假名</label>
      <label><input type="checkbox" id="tZh" checked> 顯示中譯</label>
      <label>語速
        <select id="rate">
          <option value="0.6">慢</option>
          <option value="0.8" selected>稍慢</option>
          <option value="1">正常</option>
        </select>
      </label>
    </div>
  </div>
</div>

<main>
  <div class="tip" id="tip"></div>
  <div id="list"></div>
  <div class="empty" id="empty" style="display:none">沒有符合的句型，換個關鍵字試試。</div>
</main>

<footer>
  例句皆為 N5 程度常用句。發音使用瀏覽器內建語音合成，Android 需安裝日文語音包，iOS 於「設定 → 輔助使用 → 朗讀內容」下載日文語音後效果最佳。
</footer>

<script>
/* ===== 資料 ===== */
const PATTERNS = [
/* ── 助詞 ── */
{l:"N5",c:"助詞",t:"〜は",f:"名詞 ＋ は ＋ 述語",d:"提示句子的「主題」，讀作 wa。作用是「關於這件事，我要說…」。常與が對比：は提示已知的話題，が提示新資訊。",ex:[
{j:"私は台湾人です。",k:"わたしはたいわんじんです。",z:"我是台灣人。"},
{j:"これは私の傘ではありません。",k:"これはわたしのかさではありません。",z:"這不是我的傘。"},
{j:"今日はとても暑いですね。",k:"きょうはとてもあついですね。",z:"今天真熱啊。"}]},

{l:"N5",c:"助詞",t:"〜が",f:"名詞 ＋ が ＋ 述語",d:"標示動作或狀態的主體，多用於「新資訊」、自然現象、存在句，以及好惡・能力・希望的對象（好き・上手・できる・ほしい 前面用が）。",ex:[
{j:"雨が降っています。",k:"あめがふっています。",z:"正在下雨。"},
{j:"私は日本語が好きです。",k:"わたしはにほんごがすきです。",z:"我喜歡日文。"},
{j:"あそこに白い猫がいます。",k:"あそこにしろいねこがいます。",z:"那裡有一隻白貓。"}]},

{l:"N5",c:"助詞",t:"〜を",f:"名詞 ＋ を ＋ 他動詞",d:"標示動作的受詞（吃什麼、看什麼）。另有兩個特殊用法：通過的場所（公園を散歩する）與離開的地點（家を出る）。",ex:[
{j:"毎朝パンを食べます。",k:"まいあさパンをたべます。",z:"每天早上吃麵包。"},
{j:"公園を散歩しました。",k:"こうえんをさんぽしました。",z:"在公園散了步。"},
{j:"七時に家を出ます。",k:"しちじにいえをでます。",z:"七點離開家。"}]},

{l:"N5",c:"助詞",t:"〜に",f:"時間／地點／對象 ＋ に",d:"三大用法：①具體時間點（七時に）②存在的地點（〜にあります／います）③動作的對象或到達點（友達に、東京に着く）。星期、月份可加に；今日・明日・毎日不加。",ex:[
{j:"七時に起きます。",k:"しちじにおきます。",z:"七點起床。"},
{j:"机の上に本があります。",k:"つくえのうえにほんがあります。",z:"桌上有書。"},
{j:"友達に電話をかけました。",k:"ともだちにでんわをかけました。",z:"打了電話給朋友。"}]},

{l:"N5",c:"助詞",t:"〜で",f:"場所／方法／材料 ＋ で",d:"①動作發生的場所（図書館で勉強する）②手段、工具、交通方式（バスで）③材料（木で作る）。注意：「に」是靜態存在，「で」是動態動作。",ex:[
{j:"図書館で勉強します。",k:"としょかんでべんきょうします。",z:"在圖書館唸書。"},
{j:"バスで学校へ行きます。",k:"バスでがっこうへいきます。",z:"搭公車去學校。"},
{j:"日本語で話しましょう。",k:"にほんごではなしましょう。",z:"用日文說吧。"}]},

{l:"N5",c:"助詞",t:"〜へ",f:"場所 ＋ へ ＋ 移動動詞",d:"表示移動的方向，讀作 e。與に相比，へ強調「朝那個方向」，に強調「到達點」，多數情況可互換。",ex:[
{j:"来週、日本へ行きます。",k:"らいしゅう、にほんへいきます。",z:"下週要去日本。"},
{j:"何時に家へ帰りますか。",k:"なんじにいえへかえりますか。",z:"幾點回家呢？"},
{j:"どこへも行きませんでした。",k:"どこへもいきませんでした。",z:"哪裡都沒去。"}]},

{l:"N5",c:"助詞",t:"〜と",f:"名詞 ＋ と ＋ 名詞／人 ＋ と",d:"①完全列舉兩個以上名詞「和」②一起做動作的對象「跟…」③引用內容（〜と言います）。",ex:[
{j:"パンと牛乳を買いました。",k:"パンとぎゅうにゅうをかいました。",z:"買了麵包和牛奶。"},
{j:"友達と映画を見ます。",k:"ともだちとえいがをみます。",z:"和朋友看電影。"},
{j:"彼は「行きます」と言いました。",k:"かれは「いきます」といいました。",z:"他說「我要去」。"}]},

{l:"N5",c:"助詞",t:"〜から〜まで",f:"起點 ＋ から ＋ 終點 ＋ まで",d:"表示時間或空間的範圍，「從…到…」。から也可單獨表示起點或原因；まで表示界線，までに則是「在…之前完成」。",ex:[
{j:"九時から五時まで働きます。",k:"くじからごじまではたらきます。",z:"從九點工作到五點。"},
{j:"家から駅まで歩きます。",k:"いえからえきまであるきます。",z:"從家走到車站。"},
{j:"五時までに来てください。",k:"ごじまでにきてください。",z:"請在五點前來。"}]},

{l:"N5",c:"助詞",t:"〜も",f:"名詞 ＋ も（取代 は／が／を）",d:"表示「也」。接在疑問詞後＋否定則是「全都不…」（何も、誰も、どこへも）。",ex:[
{j:"私も学生です。",k:"わたしもがくせいです。",z:"我也是學生。"},
{j:"コーヒーもお願いします。",k:"コーヒーもおねがいします。",z:"也麻煩給我咖啡。"},
{j:"今朝は何も食べませんでした。",k:"けさはなにもたべませんでした。",z:"今天早上什麼都沒吃。"}]},

{l:"N5",c:"助詞",t:"〜の",f:"名詞 ＋ の ＋ 名詞",d:"連接兩個名詞，表示所有、所屬、性質。後面的名詞若已知，可省略成準體助詞（私のです＝我的）。",ex:[
{j:"これは私の本です。",k:"これはわたしのほんです。",z:"這是我的書。"},
{j:"彼は日本語の先生です。",k:"かれはにほんごのせんせいです。",z:"他是日文老師。"},
{j:"その傘は誰のですか。",k:"そのかさはだれのですか。",z:"那把傘是誰的？"}]},

{l:"N5",c:"助詞",t:"〜や〜など",f:"名詞 ＋ や ＋ 名詞 ＋ など",d:"部分列舉，「…啦…之類的」，暗示還有其他沒說出來的東西。と是全部列舉，や是舉例。",ex:[
{j:"机の上に本やペンなどがあります。",k:"つくえのうえにほんやペンなどがあります。",z:"桌上有書和筆等等。"},
{j:"京都や大阪へ行きました。",k:"きょうとやおおさかへいきました。",z:"去了京都、大阪之類的地方。"},
{j:"りんごやバナナが好きです。",k:"りんごやバナナがすきです。",z:"喜歡蘋果、香蕉這些。"}]},

{l:"N5",c:"助詞",t:"〜か",f:"句子 ＋ か／名詞 ＋ か ＋ 名詞",d:"①句尾表疑問②連接兩個名詞表選擇「或者」。口語中疑問的か常省略，改用升調。",ex:[
{j:"田中さんは学生ですか。",k:"たなかさんはがくせいですか。",z:"田中先生是學生嗎？"},
{j:"コーヒーか紅茶を飲みます。",k:"コーヒーかこうちゃをのみます。",z:"喝咖啡或紅茶。"},
{j:"明日は雨が降りますか。",k:"あしたはあめがふりますか。",z:"明天會下雨嗎？"}]},

{l:"N5",c:"助詞",t:"〜ね／〜よ",f:"句子 ＋ ね／よ",d:"終助詞。ね＝尋求同意、確認（你也這麼覺得吧）；よ＝告知對方不知道的事、提醒。用錯會顯得失禮，よ勿對上位者過度使用。",ex:[
{j:"いい天気ですね。",k:"いいてんきですね。",z:"天氣真好呢。"},
{j:"この店、おいしいですよ。",k:"このみせ、おいしいですよ。",z:"這家店很好吃喔。"},
{j:"明日は休みですね。",k:"あしたはやすみですね。",z:"明天放假對吧。"}]},

/* ── 名詞句 ── */
{l:"N5",c:"名詞句",t:"〜です／〜ではありません",f:"名詞 ＋ です／ではありません",d:"名詞句的現在肯定與否定。口語否定常說「じゃありません」「じゃないです」，書面用「ではありません」。",ex:[
{j:"私は会社員です。",k:"わたしはかいしゃいんです。",z:"我是上班族。"},
{j:"彼は先生ではありません。",k:"かれはせんせいではありません。",z:"他不是老師。"},
{j:"ここは駅じゃないです。",k:"ここはえきじゃないです。",z:"這裡不是車站。"}]},

{l:"N5",c:"名詞句",t:"〜でした／〜ではありませんでした",f:"名詞 ＋ でした／ではありませんでした",d:"名詞句的過去式。注意名詞與な形容詞的變化方式完全相同。",ex:[
{j:"昨日は休みでした。",k:"きのうはやすみでした。",z:"昨天是假日。"},
{j:"去年は学生でした。",k:"きょねんはがくせいでした。",z:"去年是學生。"},
{j:"あの人は医者ではありませんでした。",k:"あのひとはいしゃではありませんでした。",z:"那個人以前不是醫生。"}]},

{l:"N5",c:"名詞句",t:"〜になります",f:"名詞／な形容詞 ＋ に ＋ なります",d:"表示變化的結果「變成…」。い形容詞要改成「〜くなります」。表示自然或非自主的變化。",ex:[
{j:"来月、二十歳になります。",k:"らいげつ、はたちになります。",z:"下個月就二十歲了。"},
{j:"もう春になりました。",k:"もうはるになりました。",z:"已經變成春天了。"},
{j:"医者になりたいです。",k:"いしゃになりたいです。",z:"想成為醫生。"}]},

/* ── 形容詞 ── */
{l:"N5",c:"形容詞",t:"い形容詞（現在）",f:"い形 ＋ です／〜い→〜くないです",d:"字尾是い的形容詞。否定把い改成くない。例外：いい→よくない（不是いくない）。",ex:[
{j:"この本は面白いです。",k:"このほんはおもしろいです。",z:"這本書很有趣。"},
{j:"今日は寒くないです。",k:"きょうはさむくないです。",z:"今天不冷。"},
{j:"天気はあまりよくないです。",k:"てんきはあまりよくないです。",z:"天氣不太好。"}]},

{l:"N5",c:"形容詞",t:"い形容詞（過去）",f:"〜い→〜かったです／〜くなかったです",d:"い形容詞的過去式不加でした，而是把い改成かった。「面白いでした」是常見錯誤。",ex:[
{j:"映画はとても面白かったです。",k:"えいがはとてもおもしろかったです。",z:"電影非常有趣。"},
{j:"テストは難しくなかったです。",k:"テストはむずかしくなかったです。",z:"考試不難。"},
{j:"昨日は忙しかったです。",k:"きのうはいそがしかったです。",z:"昨天很忙。"}]},

{l:"N5",c:"形容詞",t:"な形容詞",f:"な形 ＋ です／では（じゃ）ありません／でした",d:"字尾不是い（或雖是い但屬例外，如きれい・有名）的形容詞，變化方式和名詞相同。修飾名詞時要加な。",ex:[
{j:"彼はとても親切です。",k:"かれはとてもしんせつです。",z:"他非常親切。"},
{j:"ここは静かじゃありません。",k:"ここはしずかじゃありません。",z:"這裡不安靜。"},
{j:"昔、町はにぎやかでした。",k:"むかし、まちはにぎやかでした。",z:"以前這個城鎮很熱鬧。"}]},

{l:"N5",c:"形容詞",t:"形容詞 ＋ 名詞",f:"い形 ＋ 名詞／な形 ＋ な ＋ 名詞",d:"形容詞直接修飾名詞。い形不變化，な形一定要加な。這是初學最容易漏掉的一個字。",ex:[
{j:"新しい車を買いました。",k:"あたらしいくるまをかいました。",z:"買了新車。"},
{j:"きれいな花ですね。",k:"きれいなはなですね。",z:"好漂亮的花啊。"},
{j:"静かな部屋がほしいです。",k:"しずかなへやがほしいです。",z:"想要安靜的房間。"}]},

{l:"N5",c:"形容詞",t:"〜くて／〜で（並列）",f:"い形〜い→〜くて／な形・名詞 ＋ で",d:"連接兩個以上的形容詞。前後的評價要同方向（都是褒或都是貶），若相反要用「〜が」。",ex:[
{j:"この部屋は広くて明るいです。",k:"このへやはひろくてあかるいです。",z:"這房間又寬敞又明亮。"},
{j:"彼は親切で優しい人です。",k:"かれはしんせつでやさしいひとです。",z:"他是個親切又溫柔的人。"},
{j:"安くておいしい店を知っています。",k:"やすくておいしいみせをしっています。",z:"我知道一家又便宜又好吃的店。"}]},

{l:"N5",c:"形容詞",t:"〜くなる／〜になる",f:"い形〜い→〜くなる／な形・名詞 ＋ になる",d:"表示狀態的變化。加上「〜てきました」可表示變化正在進行（寒くなってきました）。",ex:[
{j:"急に寒くなりました。",k:"きゅうにさむくなりました。",z:"突然變冷了。"},
{j:"日本語が上手になりたいです。",k:"にほんごがじょうずになりたいです。",z:"想讓日文變得更好。"},
{j:"町がきれいになりました。",k:"まちがきれいになりました。",z:"城鎮變乾淨了。"}]},

/* ── 動詞 ── */
{l:"N5",c:"動詞",t:"〜ます／〜ません",f:"動詞ます形（現在・未來・習慣）",d:"敬體的現在式，表示習慣或未來的動作，不表示「正在做」。否定是ません。",ex:[
{j:"毎朝六時に起きます。",k:"まいあさろくじにおきます。",z:"每天早上六點起床。"},
{j:"明日、映画を見ます。",k:"あした、えいがをみます。",z:"明天要看電影。"},
{j:"私はお酒を飲みません。",k:"わたしはおさけをのみません。",z:"我不喝酒。"}]},

{l:"N5",c:"動詞",t:"〜ました／〜ませんでした",f:"動詞 ＋ ました／ませんでした",d:"敬體的過去肯定與否定。時間詞（昨日・先週・去年）常一起出現。",ex:[
{j:"昨日、三時間勉強しました。",k:"きのう、さんじかんべんきょうしました。",z:"昨天唸了三小時的書。"},
{j:"朝ご飯を食べませんでした。",k:"あさごはんをたべませんでした。",z:"沒有吃早餐。"},
{j:"先週、京都へ行きました。",k:"せんしゅう、きょうとへいきました。",z:"上週去了京都。"}]},

{l:"N5",c:"動詞",t:"て形（接續形）",f:"I類：き→いて・ぎ→いで・み/び/に→んで・り/ち/い→って・し→して／II類：る→て／III類：来て・して",d:"日文的萬用連接形，用來連接動作、造出許多句型。「行く→行って」是唯一的例外動詞。",ex:[
{j:"朝起きて、顔を洗います。",k:"あさおきて、かおをあらいます。",z:"早上起床，然後洗臉。"},
{j:"駅へ行って、電車に乗ります。",k:"えきへいって、でんしゃにのります。",z:"去車站，然後搭電車。"},
{j:"本を読んで、寝ます。",k:"ほんをよんで、ねます。",z:"看書，然後睡覺。"}]},

{l:"N5",c:"動詞",t:"〜てください",f:"動詞て形 ＋ ください",d:"客氣的請求或指示「請…」。對上位者更禮貌的說法是「〜ていただけませんか」。",ex:[
{j:"ちょっと待ってください。",k:"ちょっとまってください。",z:"請稍等一下。"},
{j:"ここに名前を書いてください。",k:"ここになまえをかいてください。",z:"請在這裡寫名字。"},
{j:"もう一度言ってください。",k:"もういちどいってください。",z:"請再說一次。"}]},

{l:"N5",c:"動詞",t:"〜ています",f:"動詞て形 ＋ います",d:"三種意思：①動作正在進行②狀態的持續（結婚しています）③習慣性的行為（毎日走っています）。知る只能用「知っています」。",ex:[
{j:"今、雨が降っています。",k:"いま、あめがふっています。",z:"現在正在下雨。"},
{j:"兄は銀行で働いています。",k:"あにはぎんこうではたらいています。",z:"哥哥在銀行工作。"},
{j:"田中さんを知っていますか。",k:"たなかさんをしっていますか。",z:"你認識田中先生嗎？"}]},

{l:"N5",c:"動詞",t:"〜てもいいです",f:"動詞て形 ＋ もいいです（か）",d:"表示許可「可以…」。用疑問形是請求許可，回答不行時說「すみません、ちょっと…」比較委婉。",ex:[
{j:"ここに座ってもいいですか。",k:"ここにすわってもいいですか。",z:"可以坐這裡嗎？"},
{j:"写真を撮ってもいいです。",k:"しゃしんをとってもいいです。",z:"可以拍照。"},
{j:"もう帰ってもいいですか。",k:"もうかえってもいいですか。",z:"我可以回去了嗎？"}]},

{l:"N5",c:"動詞",t:"〜てはいけません",f:"動詞て形 ＋ はいけません",d:"強烈的禁止「不可以…」，多用於規則、告示。口語縮約成「〜ちゃいけません」。",ex:[
{j:"ここでたばこを吸ってはいけません。",k:"ここでたばこをすってはいけません。",z:"這裡不可以抽菸。"},
{j:"教室で食べてはいけません。",k:"きょうしつでたべてはいけません。",z:"教室裡不可以吃東西。"},
{j:"中に入ってはいけません。",k:"なかにはいってはいけません。",z:"不可以進去裡面。"}]},

{l:"N5",c:"動詞",t:"〜てから",f:"動詞て形 ＋ から",d:"明確表示「做完A之後才做B」，強調先後順序。也可表示「自從…以來」。",ex:[
{j:"宿題をしてから、遊びます。",k:"しゅくだいをしてから、あそびます。",z:"做完功課再玩。"},
{j:"手を洗ってから食べましょう。",k:"てをあらってからたべましょう。",z:"洗完手再吃吧。"},
{j:"日本へ来てから三年になります。",k:"にほんへきてからさんねんになります。",z:"來日本已經三年了。"}]},

{l:"N5",c:"動詞",t:"〜ないでください",f:"動詞ない形 ＋ でください",d:"客氣的否定請求「請不要…」。ない形：I類把う段改成あ段＋ない（う→わ），II類る→ない，III類来ない・しない。",ex:[
{j:"写真を撮らないでください。",k:"しゃしんをとらないでください。",z:"請不要拍照。"},
{j:"心配しないでください。",k:"しんぱいしないでください。",z:"請不要擔心。"},
{j:"ここに車を止めないでください。",k:"ここにくるまをとめないでください。",z:"請不要在這裡停車。"}]},

{l:"N5",c:"動詞",t:"〜なければなりません",f:"動詞ない形（去い）＋ ければなりません",d:"表示義務「必須…」。口語常說「〜なきゃ」「〜ないといけません」。",ex:[
{j:"明日は早く起きなければなりません。",k:"あしたははやくおきなければなりません。",z:"明天必須早起。"},
{j:"毎日薬を飲まなければなりません。",k:"まいにちくすりをのまなければなりません。",z:"每天都得吃藥。"},
{j:"金曜日までに出さなければなりません。",k:"きんようびまでにださなければなりません。",z:"必須在星期五前交出去。"}]},

{l:"N5",c:"動詞",t:"〜なくてもいいです",f:"動詞ない形（去い）＋ くてもいいです",d:"表示不必要「不…也可以」。與「〜なければなりません」正好相反。",ex:[
{j:"明日は来なくてもいいです。",k:"あしたはこなくてもいいです。",z:"明天不來也沒關係。"},
{j:"靴を脱がなくてもいいです。",k:"くつをぬがなくてもいいです。",z:"不用脫鞋也可以。"},
{j:"急がなくてもいいですよ。",k:"いそがなくてもいいですよ。",z:"不用急喔。"}]},

{l:"N5",c:"動詞",t:"〜たいです",f:"動詞ます形（去ます）＋ たいです",d:"表示第一人稱的願望。受詞助詞を可換成が。變化同い形容詞（たくない・たかった）。描述他人願望要用「〜たがっています」。",ex:[
{j:"いつか日本へ行きたいです。",k:"いつかにほんへいきたいです。",z:"總有一天想去日本。"},
{j:"冷たい水が飲みたいです。",k:"つめたいみずがのみたいです。",z:"想喝冰水。"},
{j:"今日は何も食べたくないです。",k:"きょうはなにもたべたくないです。",z:"今天什麼都不想吃。"}]},

{l:"N5",c:"動詞",t:"〜たことがあります",f:"動詞た形 ＋ ことがあります",d:"表示過去的經驗「曾經…過」。不能用於剛剛發生的事（×さっき食べたことがあります）。",ex:[
{j:"富士山に登ったことがあります。",k:"ふじさんにのぼったことがあります。",z:"我爬過富士山。"},
{j:"寿司を食べたことがありますか。",k:"すしをたべたことがありますか。",z:"你吃過壽司嗎？"},
{j:"一度も行ったことがありません。",k:"いちどもいったことがありません。",z:"一次都沒去過。"}]},

{l:"N5",c:"動詞",t:"〜たり〜たりします",f:"動詞た形 ＋ り、動詞た形 ＋ り ＋ します",d:"從多項動作中舉例，「又是…又是…」，不強調順序。最後一定要以「します」結尾並隨時態變化。",ex:[
{j:"日曜日は本を読んだり、音楽を聞いたりします。",k:"にちようびはほんをよんだり、おんがくをきいたりします。",z:"星期天會看看書、聽聽音樂。"},
{j:"掃除したり、洗濯したりしました。",k:"そうじしたり、せんたくしたりしました。",z:"又是打掃又是洗衣服。"},
{j:"泣いたり笑ったりしていました。",k:"ないたりわらったりしていました。",z:"一下哭一下笑的。"}]},

{l:"N5",c:"動詞",t:"〜ながら",f:"動詞ます形（去ます）＋ ながら",d:"同一個人同時做兩個動作，「一邊…一邊…」。主要的動作放在後面。",ex:[
{j:"音楽を聞きながら勉強します。",k:"おんがくをききながらべんきょうします。",z:"一邊聽音樂一邊唸書。"},
{j:"歩きながら話しましょう。",k:"あるきながらはなしましょう。",z:"邊走邊聊吧。"},
{j:"テレビを見ながらご飯を食べます。",k:"テレビをみながらごはんをたべます。",z:"邊看電視邊吃飯。"}]},

{l:"N5",c:"動詞",t:"〜前に",f:"動詞辭書形／名詞 ＋ の ＋ 前に",d:"「在…之前」。前面的動詞一律用辭書形，不會因為整句是過去式而改變。",ex:[
{j:"寝る前に歯を磨きます。",k:"ねるまえにはをみがきます。",z:"睡前刷牙。"},
{j:"食事の前に手を洗います。",k:"しょくじのまえにてをあらいます。",z:"吃飯前洗手。"},
{j:"三年前に日本へ来ました。",k:"さんねんまえににほんへきました。",z:"三年前來到日本。"}]},

{l:"N5",c:"動詞",t:"〜た後で",f:"動詞た形／名詞 ＋ の ＋ 後で",d:"「在…之後」。動詞一律用た形。與「〜てから」意思相近，後で更強調時間的前後。",ex:[
{j:"ご飯を食べた後で、散歩します。",k:"ごはんをたべたあとで、さんぽします。",z:"吃完飯後去散步。"},
{j:"仕事の後で飲みに行きませんか。",k:"しごとのあとでのみにいきませんか。",z:"下班後要不要去喝一杯？"},
{j:"授業の後で図書館へ行きます。",k:"じゅぎょうのあとでとしょかんへいきます。",z:"下課後去圖書館。"}]},

{l:"N5",c:"動詞",t:"〜ましょう／〜ましょうか",f:"動詞ます形（去ます）＋ ましょう",d:"提議一起做某事「…吧」。ましょうか除了提議，也可表示「要不要我幫你…？」。",ex:[
{j:"一緒に行きましょう。",k:"いっしょにいきましょう。",z:"一起去吧。"},
{j:"そろそろ帰りましょう。",k:"そろそろかえりましょう。",z:"差不多該回去了吧。"},
{j:"荷物を持ちましょうか。",k:"にもつをもちましょうか。",z:"要我幫你拿行李嗎？"}]},

{l:"N5",c:"動詞",t:"〜ませんか",f:"動詞ます形（去ます）＋ ませんか",d:"客氣地邀約「要不要…？」。比ましょう更尊重對方的意願，是最常用的邀請說法。",ex:[
{j:"一緒に映画を見ませんか。",k:"いっしょにえいがをみませんか。",z:"要不要一起看電影？"},
{j:"お茶を飲みませんか。",k:"おちゃをのみませんか。",z:"要不要喝杯茶？"},
{j:"明日、うちに来ませんか。",k:"あした、うちにきませんか。",z:"明天要不要來我家？"}]},

{l:"N5",c:"動詞",t:"〜つもりです",f:"動詞辭書形／ない形 ＋ つもりです",d:"表示事先決定好的打算、意志。否定有兩種：「行かないつもりです」（打算不去）與「行くつもりはありません」（沒有要去的打算，語氣更強）。",ex:[
{j:"来年、日本へ行くつもりです。",k:"らいねん、にほんへいくつもりです。",z:"打算明年去日本。"},
{j:"今日は早く寝るつもりです。",k:"きょうははやくねるつもりです。",z:"今天打算早點睡。"},
{j:"留学するつもりはありません。",k:"りゅうがくするつもりはありません。",z:"沒有要留學的打算。"}]},

{l:"N5",c:"動詞",t:"〜ことができます",f:"動詞辭書形 ＋ ことができます",d:"表示能力或許可「會…、能夠…」。比可能形（話せます）更正式、書面。",ex:[
{j:"日本語を話すことができます。",k:"にほんごをはなすことができます。",z:"我會說日文。"},
{j:"ここで写真を撮ることができますか。",k:"ここでしゃしんをとることができますか。",z:"這裡可以拍照嗎？"},
{j:"私は泳ぐことができません。",k:"わたしはおよぐことができません。",z:"我不會游泳。"}]},

{l:"N5",c:"動詞",t:"〜がほしいです",f:"名詞 ＋ が ＋ ほしいです",d:"表示想要某個東西（名詞）。想做某事用「〜たいです」。ほしい是い形容詞，否定為ほしくないです。",ex:[
{j:"新しいパソコンがほしいです。",k:"あたらしいパソコンがほしいです。",z:"想要新的電腦。"},
{j:"今は何もほしくないです。",k:"いまはなにもほしくないです。",z:"現在什麼都不想要。"},
{j:"子供のとき、犬がほしかったです。",k:"こどものとき、いぬがほしかったです。",z:"小時候很想要一隻狗。"}]},

/* ── 存在 ── */
{l:"N5",c:"存在",t:"あります／います",f:"場所 ＋ に ＋ 物 ＋ が ＋ あります／います",d:"あります用於無生命的東西、植物、事件；います用於人和動物。也可用「物は場所にあります」的語序來強調物品。",ex:[
{j:"机の上に本があります。",k:"つくえのうえにほんがあります。",z:"桌上有書。"},
{j:"公園に子供がいます。",k:"こうえんにこどもがいます。",z:"公園裡有小孩。"},
{j:"今日は時間がありません。",k:"きょうはじかんがありません。",z:"今天沒有時間。"}]},

/* ── 比較 ── */
{l:"N5",c:"比較",t:"〜より〜のほうが",f:"A より B のほうが ＋ 形容詞",d:"兩者比較，「比起A，B更…」。答句常用「Bのほうが好きです」。問句：「AとB、どちらのほうが〜ですか」。",ex:[
{j:"電車のほうがバスより速いです。",k:"でんしゃのほうがバスよりはやいです。",z:"電車比公車快。"},
{j:"夏より冬のほうが好きです。",k:"なつよりふゆのほうがすきです。",z:"比起夏天更喜歡冬天。"},
{j:"こちらのほうが安いですよ。",k:"こちらのほうがやすいですよ。",z:"這邊比較便宜喔。"}]},

{l:"N5",c:"比較",t:"〜の中で一番",f:"範圍 ＋ の中で ＋ 名詞 ＋ が ＋ 一番 ＋ 形容詞",d:"三者以上的比較，「在…之中最…」。範圍是場所或時間時，中で可省略（クラスで一番）。",ex:[
{j:"スポーツの中でサッカーが一番好きです。",k:"スポーツのなかでサッカーがいちばんすきです。",z:"運動之中最喜歡足球。"},
{j:"クラスで彼が一番背が高いです。",k:"クラスでかれがいちばんせがたかいです。",z:"班上他最高。"},
{j:"日本で一番高い山は富士山です。",k:"にほんでいちばんたかいやまはふじさんです。",z:"日本最高的山是富士山。"}]},

{l:"N5",c:"比較",t:"あまり／全然 ＋ 否定",f:"あまり／全然 ＋ 〜ません・〜くないです",d:"程度副詞，後面一定要接否定。あまり＝不太…；全然＝完全不…（語氣更強）。",ex:[
{j:"この店はあまり高くないです。",k:"このみせはあまりたかくないです。",z:"這家店不太貴。"},
{j:"肉はあまり食べません。",k:"にくはあまりたべません。",z:"我不太吃肉。"},
{j:"意味が全然分かりません。",k:"いみがぜんぜんわかりません。",z:"完全看不懂意思。"}]},

/* ── 授受 ── */
{l:"N5",c:"授受",t:"〜をあげます",f:"（我／他人）は ＋ 對方 ＋ に ＋ 物 ＋ を ＋ あげます",d:"「給出去」，站在給予者的立場。對方是上位者時要用「差し上げます」，不可用在「給我」。",ex:[

{l:"N5",c:"授受",t:"〜をくれます",f:"他人 ＋ が ＋ （我）に ＋ 物 ＋ を ＋ くれます",d:"別人「給我（或我方的人）」。主語一定是他人，接受者是自己這一方。接て形則表示「為我做…」。",ex:[

{l:"N5",c:"授受",t:"〜をもらいます",f:"（我）は ＋ 對方 ＋ に／から ＋ 物 ＋ を ＋ もらいます",d:"「從別人那裡得到」，站在接受者的立場。給予者用に或から（機構、公司只能用から）。",ex:[

/* ── 接續 ── */
{l:"N5",c:"接續",t:"〜から（原因）",f:"普通形／です・ます形 ＋ から",d:"表示主觀的原因、理由，「因為…所以…」。理由在前，結果在後；也可倒過來回答「どうして」的問句。",ex:[
{j:"寒いから、窓を閉めます。",k:"さむいから、まどをしめます。",z:"因為冷，所以關窗。"},
{j:"時間がないから、急ぎましょう。",k:"じかんがないから、いそぎましょう。",z:"因為沒時間了，快一點吧。"},
{j:"危ないですから、触らないでください。",k:"あぶないですから、さわらないでください。",z:"因為很危險，請不要碰。"}]},

{l:"N5",c:"接續",t:"〜が（逆接）",f:"句子 ＋ が、＋ 句子",d:"連接語意相反的兩句，「雖然…但是…」。也可當開場白緩衝（すみませんが…）。口語常用「〜けど」。",ex:[
{j:"日本語は難しいですが、面白いです。",k:"にほんごはむずかしいですが、おもしろいです。",z:"日文雖然難，但很有趣。"},
{j:"行きましたが、閉まっていました。",k:"いきましたが、しまっていました。",z:"雖然去了，但沒開門。"},
{j:"すみませんが、もう一度お願いします。",k:"すみませんが、もういちどおねがいします。",z:"不好意思，麻煩再一次。"}]},

{l:"N5",c:"接續",t:"〜とき",f:"動詞辭書形／た形・い形・な形 ＋ な・名詞 ＋ の ＋ とき",d:"「…的時候」。辭書形＝動作前或同時，た形＝動作完成後。「日本へ行くとき」＝出發前；「行ったとき」＝到了之後。",ex:[
{j:"子供のとき、よく遊びました。",k:"こどものとき、よくあそびました。",z:"小時候常常玩。"},
{j:"日本へ行くとき、カメラを買いました。",k:"にほんへいくとき、カメラをかいました。",z:"要去日本前買了相機。"},
{j:"暇なとき、本を読みます。",k:"ひまなとき、ほんをよみます。",z:"有空的時候看書。"}]},

{l:"N5",c:"接續",t:"疑問詞 ＋ か／も",f:"何か・誰か・どこか／何も・誰も ＋ 否定",d:"疑問詞＋か＝不特定的某個（某人、某處）；疑問詞＋も＋否定＝全面否定。此時を、が常省略。",ex:[
{j:"何か食べましたか。",k:"なにかたべましたか。",z:"你吃了什麼嗎？"},
{j:"週末どこかへ行きましたか。",k:"しゅうまつどこかへいきましたか。",z:"週末有去哪裡嗎？"},
{j:"教室には誰もいません。",k:"きょうしつにはだれもいません。",z:"教室裡一個人也沒有。"}]},

{l:"N5",c:"接續",t:"そして／それから／でも",f:"句子。＋ 接續詞 ＋ 句子。",d:"そして＝並列、然後；それから＝接著（強調順序）；でも＝但是（放句首，比が更口語）。",ex:[
{j:"部屋は広いです。そして明るいです。",k:"へやはひろいです。そしてあかるいです。",z:"房間很寬敞，而且很明亮。"},
{j:"買い物をして、それから帰りました。",k:"かいものをして、それからかえりました。",z:"買了東西，然後就回家了。"},
{j:"高いです。でも、買います。",k:"たかいです。でも、かいます。",z:"很貴。不過我還是要買。"}]}
,

/* ── 助詞 ── */
{l:"N4",c:"助詞",t:"〜しか〜ない",f:"名詞 ＋ しか ＋ 否定形",d:"「只有…」，帶有「不夠、只剩這些」的語感，後面一定接否定。だけ是中性的，しか帶感情。",ex:[
{j:"財布に千円しかありません。",k:"さいふにせんえんしかありません。",z:"錢包裡只有一千日圓。"},
{j:"日本語が少ししか話せません。",k:"にほんごがすこししかはなせません。",z:"日文只會說一點點。"},
{j:"一度しか行ったことがありません。",k:"いちどしかいったことがありません。",z:"只去過一次。"}]},

{l:"N4",c:"助詞",t:"〜だけ",f:"名詞／動詞普通形 ＋ だけ",d:"「只、僅」，單純陳述數量或範圍，不帶不滿的語氣。",ex:[
{j:"ちょっと見るだけです。",k:"ちょっとみるだけです。",z:"只是看一下而已。"},
{j:"私だけ知っています。",k:"わたしだけしっています。",z:"只有我知道。"},
{j:"少しだけください。",k:"すこしだけください。",z:"請給我一點點就好。"}]},

{l:"N4",c:"助詞",t:"〜ばかり",f:"名詞 ＋ ばかり／動詞た形 ＋ ばかり",d:"①淨是、光是（帶負面評價）②〜たばかり＝剛剛才做完，強調心理上的「才剛」。",ex:[
{j:"弟はゲームばかりしています。",k:"おとうとはゲームばかりしています。",z:"弟弟老是在打電動。"},
{j:"甘いものばかり食べないでください。",k:"あまいものばかりたべないでください。",z:"不要老是吃甜食。"},
{j:"さっき来たばかりです。",k:"さっききたばかりです。",z:"我剛剛才到。"}]},

{l:"N4",c:"助詞",t:"〜でも",f:"名詞 ＋ でも／疑問詞 ＋ でも",d:"①舉例提議「…之類的」，語氣輕鬆②疑問詞＋でも＝無論什麼／誰都③極端例子「連…都」。",ex:[

{j:"この漢字は子供でも読めます。",k:"このかんじはこどもでもよめます。",z:"這個漢字連小孩都會讀。"}]},

/* ── 形容詞 ── */
{l:"N4",c:"形容詞",t:"〜すぎます",f:"ます形（去ます）／い形（去い）／な形 ＋ すぎます",d:"表示「過度、太過」，帶負面評價。いい→よすぎる、ない→なさすぎる。",ex:[

{l:"N4",c:"形容詞",t:"〜やすい／〜にくい",f:"ます形（去ます）＋ やすい／にくい",d:"容易做／不容易做。變化如い形容詞（〜やすかった・〜にくくない）。",ex:[

{l:"N4",c:"形容詞",t:"〜がっています",f:"い形／な形（去い・な）＋ がる・がっています",d:"描述第三人稱的感情或願望。ほしい→ほしがる、〜たい→〜たがる。因為別人的心情看不見，所以不能直接說「弟はほしいです」。",ex:[

/* ── 動詞 ── */
{l:"N4",c:"動詞",t:"普通形（常體）",f:"辭書形／ない形／た形／なかった形",d:"對朋友、家人使用的形態，也是接續「〜と思う・〜だろう・〜ので・〜そうだ」等句型的基礎。名詞與な形容詞的現在肯定是「だ」。",ex:[
{j:"明日は学校へ行かない。",k:"あしたはがっこうへいかない。",z:"明天不去學校。"},

{j:"この店は静かだ。",k:"このみせはしずかだ。",z:"這家店很安靜。"}]},

{l:"N4",c:"動詞",t:"可能形",f:"I類 う段→え段＋る／II類 る→られる／III類 来られる・できる",d:"表示能力或狀況上的可能。原本的「を」通常改成「が」。比「〜ことができます」口語。",ex:[
{j:"私は日本語が話せます。",k:"わたしはにほんごがはなせます。",z:"我會說日文。"},
{j:"明日は早く来られますか。",k:"あしたははやくこられますか。",z:"明天能早點來嗎？"},
{j:"この漢字が読めません。",k:"このかんじがよめません。",z:"這個漢字我不會唸。"}]},

{l:"N4",c:"動詞",t:"意向形／〜（よ）うと思います",f:"I類 う段→お段＋う／II類 る→よう／III類 来よう・しよう",d:"表示說話者的意志「…吧」。＋と思います＝現在決定要做；＋と思っています＝已經想一段時間了。",ex:[
{j:"週末は映画を見ようと思います。",k:"しゅうまつはえいがをみようとおもいます。",z:"週末打算去看電影。"},
{j:"そろそろ帰ろう。",k:"そろそろかえろう。",z:"差不多該回去了吧。"},
{j:"来年、留学しようと思っています。",k:"らいねん、りゅうがくしようとおもっています。",z:"明年打算去留學。"}]},

{l:"N4",c:"動詞",t:"命令形・禁止形",f:"I類 う段→え段／II類 る→ろ／III類 来い・しろ／辭書形 ＋ な",d:"語氣強硬，用於標語、體育加油、緊急狀況或男性間的粗俗口語。日常請託務必用「〜てください」。",ex:[
{j:"早く起きろ。",k:"はやくおきろ。",z:"快點起床！"},
{j:"ここに入るな。",k:"ここにはいるな。",z:"不准進入。"},
{j:"頑張れ！",k:"がんばれ！",z:"加油！"}]},

{l:"N4",c:"動詞",t:"受身形（被動）",f:"I類 う段→あ段＋れる／II類 る→られる／III類 来られる・される",d:"「被…」。動作者用「に」。也可表示自己受到困擾的「受害被動」（雨に降られた）。",ex:[

{l:"N4",c:"動詞",t:"使役形",f:"I類 う段→あ段＋せる／II類 る→させる／III類 来させる・させる",d:"「讓／叫某人做」。自動詞的對象用「を」，他動詞的對象用「に」。",ex:[

{l:"N4",c:"動詞",t:"使役受身形",f:"使役形 ＋ られる（I類 〜せられる → 〜される）",d:"「被迫做…」，表達不情願。是 N4 最容易混淆的變化，練習時先寫使役形再改被動。",ex:[

{l:"N4",c:"動詞",t:"〜てしまいます",f:"動詞て形 ＋ しまいます",d:"①徹底完成②表示後悔、遺憾的失誤。口語縮約成「〜ちゃう／〜じゃう」。",ex:[

{l:"N4",c:"動詞",t:"〜ていきます／〜てきます",f:"動詞て形 ＋ いきます／きます",d:"表示空間或時間上的方向。ていく＝從現在往未來、離開說話者；てくる＝從過去到現在、朝說話者靠近。",ex:[

{j:"タバコを吸わないことにします。",k:"タバコをすわないことにします。",z:"我決定不抽菸了。"},
{j:"来月、東京へ転勤することになりました。",k:"らいげつ、とうきょうへてんきんすることになりました。",z:"下個月要調職到東京了。"}]},

{l:"N4",c:"動詞",t:"〜はじめます／〜おわります／〜つづけます",f:"ます形（去ます）＋ 始めます・終わります・続けます",d:"表示動作的開始、結束、持續。複合動詞，接續一律用ます形。",ex:[
{j:"桜が咲き始めました。",k:"さくらがさきはじめました。",z:"櫻花開始開了。"},
{j:"やっと本を読み終わりました。",k:"やっとほんをよみおわりました。",z:"終於把書讀完了。"},
{j:"三時間走り続けました。",k:"さんじかんはしりつづけました。",z:"持續跑了三個小時。"}]},

{l:"N4",c:"動詞",t:"〜方（かた）",f:"ます形（去ます）＋ 方",d:"表示做法、方式，整體變成名詞。原本的受詞助詞「を」要改成「の」。",ex:[
{j:"漢字の書き方を教えてください。",k:"かんじのかきかたをおしえてください。",z:"請教我漢字的寫法。"},
{j:"この機械の使い方が分かりません。",k:"このきかいのつかいかたがわかりません。",z:"我不懂這台機器的用法。"},
{j:"駅までの行き方を聞きました。",k:"えきまでのいきかたをききました。",z:"問了到車站的走法。"}]},

{l:"N4",c:"動詞",t:"〜のが／〜のは／〜のを（名詞化）",f:"動詞辭書形 ＋ の ＋ が／は／を",d:"把動詞句變成名詞。「の」可換成「こと」，但接見る・聞く・待つ等感官動詞時只能用の。",ex:[
{j:"音楽を聞くのが好きです。",k:"おんがくをきくのがすきです。",z:"喜歡聽音樂。"},
{j:"日本語を勉強するのは楽しいです。",k:"にほんごをべんきょうするのはたのしいです。",z:"學日文很快樂。"},
{j:"鍵を閉めるのを忘れました。",k:"かぎをしめるのをわすれました。",z:"忘了鎖門。"}]},

{l:"N4",c:"動詞",t:"〜ことがあります（偶爾）",f:"動詞辭書形／ない形 ＋ ことがあります",d:"「有時候會…」。與 N5 的「た形＋ことがあります」（經驗）形式相近但意思完全不同，注意動詞形態。",ex:[
{j:"たまに遅刻することがあります。",k:"たまにちこくすることがあります。",z:"偶爾會遲到。"},
{j:"夜、眠れないことがあります。",k:"よる、ねむれないことがあります。",z:"晚上有時會睡不著。"},
{j:"大雪で電車が止まることがあります。",k:"おおゆきででんしゃがとまることがあります。",z:"下大雪時電車有時會停駛。"}]},

/* ── 條件 ── */
{l:"N4",c:"條件",t:"〜ば（假定形）",f:"I類 う段→え段＋ば／II類 る→れば／い形 い→ければ／名詞・な形 ＋ なら",d:"表示成立的條件，重點在前半句「只要…就…」。後句若是意志、命令，前句通常不能是動作動詞。",ex:[
{j:"お金があれば、旅行に行きます。",k:"おかねがあれば、りょこうにいきます。",z:"有錢的話就去旅行。"},
{j:"安ければ買います。",k:"やすければかいます。",z:"便宜的話就買。"},
{j:"このボタンを押せばドアが開きます。",k:"このボタンをおせばドアがひらきます。",z:"按這個鈕門就會開。"}]},

{l:"N4",c:"條件",t:"〜たら",f:"動詞た形 ＋ ら／い形〜かったら／名詞・な形 ＋ だったら",d:"最萬用的條件句，四種條件裡限制最少。也可表示「做完A之後」或發現意外的結果。",ex:[
{j:"雨が降ったら、行きません。",k:"あめがふったら、いきません。",z:"如果下雨就不去。"},
{j:"家に着いたら、電話してください。",k:"いえについたら、でんわしてください。",z:"到家後請打電話給我。"},
{j:"私だったら、そうしません。",k:"わたしだったら、そうしません。",z:"如果是我就不會那樣做。"}]},

{l:"N4",c:"條件",t:"〜と（必然）",f:"動詞辭書形／ない形 ＋ と",d:"表示必然的結果：自然現象、機械操作、路線指引。後面不能接意志、命令、請求、許可。",ex:[
{j:"春になると、桜が咲きます。",k:"はるになると、さくらがさきます。",z:"一到春天櫻花就開。"},
{j:"右へ曲がると、駅があります。",k:"みぎへまがると、えきがあります。",z:"往右轉就會看到車站。"},
{j:"ボタンを押すと、切符が出ます。",k:"ボタンをおすと、きっぷがでます。",z:"一按鈕票就會出來。"}]},

{l:"N4",c:"條件",t:"〜なら",f:"名詞／普通形 ＋ なら",d:"承接對方剛說的話題，「如果是那樣的話…」，常用來給建議或提供資訊。",ex:[
{j:"日本へ行くなら、京都がいいですよ。",k:"にほんへいくなら、きょうとがいいですよ。",z:"要去日本的話，京都不錯喔。"},
{j:"パソコンなら、あの店が安いです。",k:"パソコンなら、あのみせがやすいです。",z:"電腦的話，那家店比較便宜。"},
{j:"疲れているなら、休んでください。",k:"つかれているなら、やすんでください。",z:"如果累了就請休息。"}]},

{l:"N4",c:"條件",t:"〜ても",f:"動詞て形 ＋ も／い形〜くても／名詞・な形 ＋ でも",d:"逆接條件「即使…也…」。疑問詞＋ても＝無論…都。",ex:[
{j:"雨が降っても、行きます。",k:"あめがふっても、いきます。",z:"即使下雨也要去。"},
{j:"高くても買います。",k:"たかくてもかいます。",z:"就算貴也要買。"},
{j:"何度説明しても分かりません。",k:"なんどせつめいしてもわかりません。",z:"無論說明幾次都不懂。"}]},

/* ── 建議 ── */
{l:"N4",c:"建議",t:"〜たほうがいいです",f:"動詞た形／ない形 ＋ ほうがいいです",d:"給對方建議。肯定用た形（過去形），否定用ない形，這是常錯的地方。語氣較強，對上位者宜改用「〜たらいかがでしょうか」。",ex:[
{j:"今日は早く寝たほうがいいですよ。",k:"きょうははやくねたほうがいいですよ。",z:"今天最好早點睡喔。"},
{j:"この薬を飲んだほうがいいです。",k:"このくすりをのんだほうがいいです。",z:"最好吃這個藥。"},
{j:"無理しないほうがいいです。",k:"むりしないほうがいいです。",z:"最好不要勉強。"}]},

{l:"N4",c:"建議",t:"〜たらどうですか",f:"動詞た形 ＋ らどうですか",d:"委婉地提出建議「要不要…看看？」。口語可說「〜たら？」。",ex:[
{j:"医者に相談したらどうですか。",k:"いしゃにそうだんしたらどうですか。",z:"要不要找醫生商量看看？"},
{j:"少し休んだらどうですか。",k:"すこしやすんだらどうですか。",z:"要不要休息一下？"},
{j:"先生に聞いてみたらどうですか。",k:"せんせいにきいてみたらどうですか。",z:"要不要問問老師看看？"}]},

{l:"N4",c:"建議",t:"〜たら／〜ばいいですか",f:"た形 ＋ らいいですか／假定形 ＋ ばいいですか",d:"向對方請教做法「該怎麼做才好？」。常與疑問詞（どこ・何・誰）一起使用。",ex:[
{j:"どこで切符を買ったらいいですか。",k:"どこできっぷをかったらいいですか。",z:"該在哪裡買票才好？"},
{j:"何を持って行けばいいですか。",k:"なにをもっていけばいいですか。",z:"該帶什麼去才好？"},
{j:"誰に聞いたらいいですか。",k:"だれにきいたらいいですか。",z:"該問誰才好？"}]},

/* ── 授受 ── */
{l:"N4",c:"授受",t:"〜てあげます／〜てくれます／〜てもらいます",f:"動詞て形 ＋ あげます／くれます／もらいます",d:"行為的授受。てあげる＝我為別人做（對上位者用容易失禮，改用お〜します）；てくれる＝別人為我做；てもらう＝我請別人為我做。",ex:[
{j:"友達に本を貸してあげました。",k:"ともだちにほんをかしてあげました。",z:"借了書給朋友。"},
{j:"兄が駅まで送ってくれました。",k:"あにがえきまでおくってくれました。",z:"哥哥送我到車站。"},
{j:"先生に日本語を教えてもらいました。",k:"せんせいににほんごをおしえてもらいました。",z:"請老師教了我日文。"}]},

{l:"N4",c:"授受",t:"〜ていただけませんか",f:"動詞て形 ＋ いただけませんか",d:"非常客氣的請求。禮貌度：〜てください ＜ 〜てくれませんか ＜ 〜ていただけませんか。",ex:[
{j:"ちょっと手伝っていただけませんか。",k:"ちょっとてつだっていただけませんか。",z:"能否請您幫個忙？"},
{j:"もう一度説明していただけませんか。",k:"もういちどせつめいしていただけませんか。",z:"能否請您再說明一次？"},
{j:"写真を撮っていただけませんか。",k:"しゃしんをとっていただけませんか。",z:"能否請您幫忙拍張照？"}]},

/* ── 接續 ── */
{l:"N4",c:"接續",t:"〜ので",f:"普通形 ＋ ので（な形・名詞 ＋ なので）",d:"客觀、委婉的原因，適合正式場合與說明理由。から較主觀，用於強調自己的判斷或藉口。",ex:[
{j:"熱があるので、休みます。",k:"ねつがあるので、やすみます。",z:"因為發燒所以請假。"},
{j:"日曜日なので、店は混んでいます。",k:"にちようびなので、みせはこんでいます。",z:"因為是星期天，店裡很擠。"},
{j:"危ないので、下がってください。",k:"あぶないので、さがってください。",z:"因為危險，請往後退。"}]},

{l:"N4",c:"接續",t:"〜のに",f:"普通形 ＋ のに（な形・名詞 ＋ なのに）",d:"「明明…卻…」，帶有意外、不滿或遺憾的情緒，比「〜が」語氣強。後面不能接意志、命令。",ex:[
{j:"薬を飲んだのに、まだ痛いです。",k:"くすりをのんだのに、まだいたいです。",z:"明明吃了藥卻還在痛。"},
{j:"約束したのに、来ませんでした。",k:"やくそくしたのに、きませんでした。",z:"明明約好了卻沒來。"},
{j:"日曜日なのに、働いています。",k:"にちようびなのに、はたらいています。",z:"明明是星期天卻在工作。"}]},

{l:"N4",c:"接續",t:"〜ために",f:"動詞辭書形／名詞 ＋ の ＋ ために",d:"①目的「為了…」（前後主語相同、須為意志動詞）②原因「由於…」（多用於書面、負面事態）。",ex:[
{j:"車を買うために、貯金しています。",k:"くるまをかうために、ちょきんしています。",z:"為了買車在存錢。"},
{j:"家族のために働きます。",k:"かぞくのためにはたらきます。",z:"為了家人而工作。"},
{j:"事故のために、電車が遅れました。",k:"じこのために、でんしゃがおくれました。",z:"由於事故，電車誤點了。"}]},

{l:"N4",c:"接續",t:"〜ように／〜ようにします",f:"可能形／ない形／無意志動詞 ＋ ように",d:"目的「為了能夠…」，用於非自己能控制的結果；ために則接意志動詞。〜ようにします＝努力養成習慣。",ex:[
{j:"忘れないようにメモします。",k:"わすれないようにメモします。",z:"為了不忘記而做筆記。"},
{j:"日本語が話せるように毎日練習します。",k:"にほんごがはなせるようにまいにちれんしゅうします。",z:"為了能說日文每天練習。"},
{j:"毎日野菜を食べるようにしています。",k:"まいにちやさいをたべるようにしています。",z:"我盡量每天吃蔬菜。"}]},

{l:"N4",c:"接續",t:"〜し、〜し",f:"普通形 ＋ し、普通形 ＋ し",d:"並列兩個以上的理由或性質，「又…又…而且…」，暗示還有其他原因。",ex:[
{j:"この店は安いし、おいしいです。",k:"このみせはやすいし、おいしいです。",z:"這家店又便宜又好吃。"},
{j:"雨だし、寒いし、家にいましょう。",k:"あめだし、さむいし、いえにいましょう。",z:"又下雨又冷，待在家吧。"},
{j:"彼は親切だし、頭もいいです。",k:"かれはしんせつだし、あたまもいいです。",z:"他既親切頭腦又好。"}]},

{l:"N4",c:"接續",t:"〜間に",f:"動詞ている／名詞 ＋ の ＋ 間に",d:"在某段期間之內完成某個動作。若是整段期間持續的狀態，就用「〜間」（不加に）。",ex:[
{j:"母が寝ている間に、掃除しました。",k:"ははがねているあいだに、そうじしました。",z:"趁媽媽睡覺時打掃了。"},
{j:"夏休みの間に、日本へ行きます。",k:"なつやすみのあいだに、にほんへいきます。",z:"暑假期間要去日本。"},
{j:"留守の間に、荷物が届きました。",k:"るすのあいだに、にもつがとどきました。",z:"不在家的時候包裹送到了。"}]},

{l:"N4",c:"接續",t:"〜うちに",f:"動詞ている／ない形／い形・な形 ＋ うちに",d:"「趁著還…的時候」，強調狀態改變前要把握機會。",ex:[
{j:"熱いうちに食べてください。",k:"あついうちにたべてください。",z:"請趁熱吃。"},
{j:"若いうちに、いろいろ経験したいです。",k:"わかいうちに、いろいろけいけんしたいです。",z:"想趁年輕多累積經驗。"},
{j:"明るいうちに帰りましょう。",k:"あかるいうちにかえりましょう。",z:"趁天還亮著回去吧。"}]},

{l:"N4",c:"接續",t:"〜かどうか",f:"普通形 ＋ かどうか ＋ 分かる・確認する等",d:"「是否…」，把疑問句放進句子裡。若句中已有疑問詞（誰・何），則只用「〜か」。",ex:[
{j:"彼が来るかどうか分かりません。",k:"かれがくるかどうかわかりません。",z:"不知道他會不會來。"},
{j:"正しいかどうか確認してください。",k:"ただしいかどうかかくにんしてください。",z:"請確認是否正確。"},
{j:"誰が来るか知っていますか。",k:"だれがくるかしっていますか。",z:"你知道誰會來嗎？"}]},

/* ── 推量 ── */
{l:"N4",c:"推量",t:"〜でしょう／〜だろう",f:"普通形 ＋ でしょう（な形・名詞不加だ）",d:"表示推測，確信度約 60〜80%。氣象預報最常見。用升調則是向對方確認。",ex:[
{j:"明日は晴れるでしょう。",k:"あしたははれるでしょう。",z:"明天應該會放晴吧。"},
{j:"彼はもう帰ったでしょう。",k:"かれはもうかえったでしょう。",z:"他應該已經回去了吧。"},
{j:"試験は難しいだろう。",k:"しけんはむずかしいだろう。",z:"考試大概很難吧。"}]},

{l:"N4",c:"推量",t:"〜かもしれません",f:"普通形 ＋ かもしれません",d:"「也許…」，可能性最低（約 50% 以下）。確信度：かもしれない ＜ でしょう ＜ はずだ。",ex:[
{j:"明日は雨が降るかもしれません。",k:"あしたはあめがふるかもしれません。",z:"明天也許會下雨。"},
{j:"彼は来ないかもしれません。",k:"かれはこないかもしれません。",z:"他可能不會來。"},
{j:"道が混んでいるかもしれない。",k:"みちがこんでいるかもしれない。",z:"路上說不定很塞。"}]},

{l:"N4",c:"推量",t:"〜はずです",f:"普通形 ＋ はずです（な形 ＋ な・名詞 ＋ の）",d:"根據明確的理由推論「照理說應該…」。否定有「〜ないはずです」與更強的「〜はずがありません」。",ex:[
{j:"田中さんは今日来るはずです。",k:"たなかさんはきょうくるはずです。",z:"田中先生今天照理說會來。"},
{j:"手紙はもう着いているはずです。",k:"てがみはもうついているはずです。",z:"信應該已經寄到了。"},
{j:"そんなはずはありません。",k:"そんなはずはありません。",z:"不可能會那樣。"}]},

{l:"N4",c:"推量",t:"〜そうです（樣態）",f:"ます形（去ます）／い形（去い）／な形 ＋ そうです",d:"根據眼前所見判斷「看起來像…」。いい→よさそう、ない→なさそう。不能用於一眼就看得出的外觀（×きれいそう）。",ex:[
{j:"このケーキはおいしそうです。",k:"このケーキはおいしそうです。",z:"這個蛋糕看起來很好吃。"},
{j:"今にも雨が降りそうです。",k:"いまにもあめがふりそうです。",z:"看起來就快下雨了。"},
{j:"お元気そうですね。",k:"おげんきそうですね。",z:"您看起來很有精神呢。"}]},

{l:"N4",c:"推量",t:"〜そうです（傳聞）",f:"普通形 ＋ そうです",d:"「聽說…」，轉述聽來的消息。接續與樣態用法不同（普通形），且不能變成そうでした，也不能加否定。",ex:[
{j:"天気予報によると、明日は雪だそうです。",k:"てんきよほうによると、あしたはゆきだそうです。",z:"根據氣象預報，聽說明天下雪。"},
{j:"田中さんは結婚するそうです。",k:"たなかさんはけっこんするそうです。",z:"聽說田中先生要結婚了。"},
{j:"あの店はおいしいそうです。",k:"あのみせはおいしいそうです。",z:"聽說那家店很好吃。"}]},

{l:"N4",c:"推量",t:"〜ようです／〜みたいです",f:"普通形 ＋ ようです（な形 ＋ な・名詞 ＋ の）／普通形 ＋ みたいです",d:"根據自己的觀察或感覺做的推測，也用於比喻。みたい是口語形，接名詞時直接接（子供みたい）。",ex:[
{j:"誰かいるようです。",k:"だれかいるようです。",z:"好像有人在。"},
{j:"風邪をひいたようです。",k:"かぜをひいたようです。",z:"我好像感冒了。"},
{j:"彼は忙しいみたいです。",k:"かれはいそがしいみたいです。",z:"他好像很忙。"}]},

{l:"N4",c:"推量",t:"〜らしいです",f:"普通形 ＋ らしいです（な形・名詞去だ）",d:"①根據外部消息的推測，責任感較輕「好像…」②名詞＋らしい＝很有…的樣子、典型的。",ex:[
{j:"彼は会社をやめたらしいです。",k:"かれはかいしゃをやめたらしいです。",z:"他好像辭職了。"},
{j:"明日は寒くなるらしいですよ。",k:"あしたはさむくなるらしいですよ。",z:"聽說明天會變冷喔。"},
{j:"今日は春らしい天気です。",k:"きょうははるらしいてんきです。",z:"今天是很有春天感覺的天氣。"}]},

{l:"N4",c:"推量",t:"〜と思います",f:"普通形 ＋ と思います",d:"陳述自己的意見或推測。否定要放在と之前（来ないと思います），這是中文母語者常錯的地方。",ex:[

/* ===== 發音引擎 ===== */
const synth = window.speechSynthesis;
let jaVoice = null, keepAlive = null, curBtn = null;

function pickVoice(){
  if(!synth) return;
  const vs = synth.getVoices().filter(v => /^ja/i.test(v.lang));
  if(!vs.length) return;
  jaVoice = vs.find(v => /Kyoko|O-ren|Google|Otoya|Nanami|Haruka/i.test(v.name)) || vs[0];
}
if(synth){
  pickVoice();
  synth.onvoiceschanged = pickVoice;
  setTimeout(pickVoice, 800);
}

function stopAll(){
  stopSeq();
  if(keepAlive){clearInterval(keepAlive); keepAlive = null;}
  if(curBtn){curBtn.classList.remove('on'); curBtn.textContent = '音'; curBtn = null;}
  try{ synth && synth.cancel(); }catch(e){}
}

function speak(text, btn){
  if(!synth){ showTip('這個瀏覽器不支援語音朗讀，建議改用 Chrome 或 Safari。'); return; }
  const same = (curBtn === btn);
  stopAll();
  if(same) return;                       // 再按一次＝停止
  const go = () => {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP';
    if(jaVoice) u.voice = jaVoice;
    u.rate = parseFloat(document.getElementById('rate').value);
    u.pitch = 1;
    u.onstart = () => {
      btn.classList.add('on'); btn.textContent = '停'; curBtn = btn;
      // Chrome 長句會自動中斷，定時 resume 維持播放
      keepAlive = setInterval(() => {
        if(!synth.speaking){ stopAll(); return; }
        synth.pause(); synth.resume();
      }, 5000);
    };
    u.onend = stopAll;
    u.onerror = stopAll;
    synth.speak(u);
    if(!jaVoice) showTip('找不到日文語音，正使用預設語音。安裝系統日文語音包後發音會正確許多。');
  };
  // cancel 之後需要一點時間，否則部分 Android Chrome 不會發聲
  setTimeout(go, 90);
}
/* ===== 連續播放（整個句型的例句） ===== */
let seqBtn = null, seqTimer = null;
function stopSeq(){
  if(seqTimer){ clearTimeout(seqTimer); seqTimer = null; }
  if(seqBtn){ seqBtn.classList.remove("on"); seqBtn.textContent = seqBtn.dataset.label; seqBtn = null; }
}
function playAll(texts, btn){
  if(!synth){ showTip("這個瀏覽器不支援語音朗讀，建議改用 Chrome 或 Safari。"); return; }
  const same = (seqBtn === btn);
  stopAll();                              // 內含 stopSeq，也會停掉單句播放
  if(same) return;                        // 再按一次＝停止
  seqBtn = btn;
  btn.classList.add("on");
  btn.textContent = "■ 停止播放";
  let i = 0;
  const next = () => {
    if(seqBtn !== btn) return;            // 已被其他操作中斷
    if(i >= texts.length){ stopSeq(); return; }
    const u = new SpeechSynthesisUtterance(texts[i++]);
    u.lang = "ja-JP";
    if(jaVoice) u.voice = jaVoice;
    u.rate = parseFloat(document.getElementById("rate").value);
    u.pitch = 1;
    u.onend = u.onerror = () => { if(seqBtn === btn) seqTimer = setTimeout(next, 320); };
    synth.speak(u);
  };
  setTimeout(next, 90);                   // cancel 後需留一點時間，否則部分 Android 不發聲
}

function showTip(msg){
  const t = document.getElementById('tip');
  t.textContent = msg; t.style.display = 'block';
}
// 首次觸控解鎖語音（iOS 需要使用者手勢）
document.addEventListener('touchstart', function unlock(){
  if(synth && !synth.speaking){ try{ synth.resume(); }catch(e){} }
  document.removeEventListener('touchstart', unlock);
}, {passive:true});

/* ===== 畫面 ===== */
const CATORDER = ['助詞','名詞句','形容詞','動詞','條件','存在','比較','建議','授受','接續','推量','敬語'];
const ordered = [...PATTERNS].sort((a, b) => {
  const d = CATORDER.indexOf(a.c) - CATORDER.indexOf(b.c);
  return d !== 0 ? d : (a.l === b.l ? 0 : a.l === 'N5' ? -1 : 1);
});
const cats = CATORDER.filter(c => ordered.some(p => p.c === c));
let active = '全部', level = '全部', keyword = '';
const listEl = document.getElementById('list');
const emptyEl = document.getElementById('empty');

document.getElementById('cP').textContent = PATTERNS.length;
document.getElementById('cE').textContent = PATTERNS.reduce((n,p) => n + p.ex.length, 0);
document.getElementById('c5').textContent = PATTERNS.filter(p => p.l === 'N5').length;
document.getElementById('c4').textContent = PATTERNS.filter(p => p.l === 'N4').length;

const lvBox = document.getElementById('levels');
[...lvBox.children].forEach(b => {
  b.onclick = () => {
    level = b.dataset.lv;
    [...lvBox.children].forEach(x => x.setAttribute('aria-pressed', x === b));
    render();
  };
});

const chipBox = document.getElementById('chips');
['全部', ...cats].forEach(c => {
  const b = document.createElement('button');
  b.className = 'chip'; b.textContent = c; b.setAttribute('aria-pressed', c === '全部');
  b.onclick = () => {
    active = c;
    [...chipBox.children].forEach(x => x.setAttribute('aria-pressed', x === b));
    render();
  };
  chipBox.appendChild(b);
});

const esc = s => s.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));

function render(){
  stopAll();
  const kw = keyword.trim().toLowerCase();
  const hits = ordered.filter(p => {
    if(level !== '全部' && p.l !== level) return false;
    if(active !== '全部' && p.c !== active) return false;
    if(!kw) return true;
    const hay = (p.t + p.f + p.d + p.c + p.ex.map(e => e.j + e.k + e.z).join('')).toLowerCase();
    return hay.includes(kw);
  });
  emptyEl.style.display = hits.length ? 'none' : 'block';
  let html = '', last = '';
  hits.forEach((p, i) => {
    if(p.c !== last){
      const n = hits.filter(x => x.c === p.c).length;
      html += `<div class="group-label">${esc(p.c)} <span style="font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--muted)">${n}</span></div>`;
      last = p.c;
    }
    html += `<article class="card">
      <div class="card-head">
        <div class="eyebrow">${esc(p.c)}</div>
        <h2 class="pat">${esc(p.t)}<span class="tag ${p.l === 'N4' ? 'n4' : 'n5'}">${p.l}</span></h2>
        <div class="form">接續　${esc(p.f)}</div>
        <p class="note">${esc(p.d)}</p>
        <button class="allbtn" data-i="${i}" data-label="▶ 播放全部 ${p.ex.length} 句" title="連續播放「${esc(p.t)}」的全部例句">▶ 播放全部 ${p.ex.length} 句</button>
      </div>
      <div class="ex-list">
        ${p.ex.map((e, j) => `<div class="ex">
          <button class="play" data-i="${i}" data-j="${j}" aria-label="朗讀：${esc(e.j)}">音</button>
          <div class="ex-body">
            <div class="kana">${esc(e.k)}</div>
            <div class="jp">${esc(e.j)}</div>
            <div class="zh">${esc(e.z)}</div>
          </div>
        </div>`).join('')}
      </div>
    </article>`;
  });
  listEl.innerHTML = html;
  listEl.querySelectorAll('.play').forEach(b => {
    b.onclick = () => speak(hits[+b.dataset.i].ex[+b.dataset.j].j, b);
  });
  listEl.querySelectorAll('.allbtn').forEach(b => {
    b.onclick = () => playAll(hits[+b.dataset.i].ex.map(e => e.j), b);
  });
}

let timer;
document.getElementById('q').addEventListener('input', e => {
  clearTimeout(timer);
  keyword = e.target.value;
  timer = setTimeout(render, 160);
});
document.getElementById('tKana').onchange = e => document.body.classList.toggle('hide-kana', !e.target.checked);
document.getElementById('tZh').onchange = e => document.body.classList.toggle('hide-zh', !e.target.checked);
window.addEventListener('beforeunload', stopAll);
render();
</script>

<button class="fab" id="toTop" aria-label="回到最上面" title="回到最上面">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4l-8 8h5v8h6v-8h5z"/></svg>
</button>
<script>
(function(){
  var b=document.getElementById('toTop');
  function sync(){
    var y=window.scrollY||document.documentElement.scrollTop||0;
    b.classList.toggle('show', y>320);
  }
  window.addEventListener('scroll',sync,{passive:true});
  sync();
  b.addEventListener('click',function(){
    var smooth=!window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    window.scrollTo(smooth?{top:0,behavior:'smooth'}:{top:0});
  });
})();
</script>
