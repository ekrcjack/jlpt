<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JLPT N5〜N4 会話 50 篇</title>
<style>
:root{--bg:#f7f5f1;--panel:#fff;--ink:#22201d;--sub:#6f6862;--line:#e4dcd0;--accent:#2f6fb4;--accent2:#b4472f;
--soft1:#eef4fb;--soft2:#fdf0ea;--n4:#8a5a2e;--n4bg:#f7ecdd;--n5:#3f7d58;--n5bg:#e9f5ee;
--shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.05)}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);line-height:1.85;-webkit-text-size-adjust:100%;
font-family:"Hiragino Sans","Noto Sans TC","Noto Sans JP","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
.wrap{max-width:880px;margin:0 auto;padding:0 16px 96px}
header.top{padding:26px 0 14px;border-bottom:1px solid var(--line)}
h1{font-size:21px;margin:0 0 6px}.sub{color:var(--sub);font-size:13px;margin:0}
.controls{position:sticky;top:0;z-index:20;background:rgba(247,245,241,.94);backdrop-filter:blur(8px);
border-bottom:1px solid var(--line);margin:0 -16px 20px;padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-size:13px;line-height:1;padding:8px 12px;border:1px solid var(--line);background:var(--panel);
color:var(--ink);border-radius:999px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#cbbdaa}.btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
select,input[type=search]{font:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);max-width:100%}
input[type=search]{flex:1;min-width:110px}
/* flex-basis 而非內容寬度,否則最長的選項文字會撐寬整頁 */
#jump{flex:1 1 180px;min-width:0;text-overflow:ellipsis}
#lvl{min-width:0}
.rate{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub)}.rate input{width:78px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:18px;box-shadow:var(--shadow)}
.card h2{font-size:17px;margin:0 0 2px;font-weight:600;display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.no{color:var(--accent2);font-variant-numeric:tabular-nums}
.zh-title{color:var(--sub);font-size:13px;font-weight:400}
.lvl{font-size:11px;padding:2px 8px;border-radius:999px;font-weight:600;letter-spacing:.02em}
.lvl.N5{color:var(--n5);background:var(--n5bg)}
.lvl.N4{color:var(--n4);background:var(--n4bg)}
.meta{color:var(--sub);font-size:12px;margin:2px 0 16px}
.turn{display:flex;gap:10px;margin-bottom:10px;align-items:flex-start}
.sp{flex:0 0 auto;min-width:74px;font-size:12px;color:#fff;background:var(--accent);padding:3px 9px;border-radius:999px;
margin-top:9px;text-align:center;line-height:1.5}
.turn.b .sp{background:var(--accent2)}
.turn.narr .sp{display:none}
.line{flex:1;font-size:18px;line-height:2.45;background:var(--soft1);border-radius:12px;padding:6px 12px}
.turn.b .line{background:var(--soft2)}
.turn.narr .line{background:transparent;color:var(--sub);font-size:15px;font-style:italic}
.s{cursor:pointer;border-radius:4px;transition:background .15s}
.s:hover{background:rgba(0,0,0,.06)}
.s.playing{background:#ffe9a8;box-shadow:0 0 0 2px #ffe9a8}
ruby rt{font-size:.5em;color:var(--sub);font-weight:400}
body.nofuri ruby rt{visibility:hidden}
.zh-line{display:none;color:var(--sub);font-size:13px;line-height:1.7;margin-top:2px}
body.showzh .zh-line{display:block}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
.panel{display:none;margin-top:14px;padding:14px;background:#fbf9f6;border:1px solid var(--line);border-radius:10px;font-size:14px}
.panel.show{display:block}
.panel h3{margin:0 0 8px;font-size:13px;color:var(--sub);font-weight:500}
.panel ul{margin:0;padding-left:18px}.panel li{margin-bottom:6px;line-height:1.8}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
th{color:var(--sub);font-weight:500;font-size:12px}td:nth-child(2){color:var(--sub)}
footer{color:var(--sub);font-size:12px;text-align:center;padding:24px 0}
.hidden{display:none}
@media(max-width:600px){.line{font-size:17px;line-height:2.55}.card{padding:14px}
.sp{min-width:0;font-size:11px;padding:2px 7px}h1{font-size:18px}}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
<h1>JLPT N5〜N4 会話 50 篇</h1>
<p class="sub">每篇約 300 字・漢字附假名・附文法與單字・點句子可朗讀</p>
</header>

<div class="controls">
<button class="btn on" id="furiBtn">假名 ON</button>
<button class="btn" id="zhBtn">逐句中譯</button>
<button class="btn" id="gramBtn">文法</button>
<button class="btn" id="vocabBtn">單字</button>
<select id="lvl"><option value="">全部程度</option><option value="N5">N5</option><option value="N4">N4</option></select>
<select id="jump"></select>
<input type="search" id="q" placeholder="搜尋">
<label class="rate">速度 <input type="range" id="rate" min="0.5" max="1.2" step="0.05" value="0.85"><span id="rateVal">0.85</span></label>
<button class="btn" id="stopBtn">■ 停止</button>
</div>

<div id="list"></div>
<footer id="foot"></footer>
</div>

/* ---------- TTS ---------- */
let jaVoice=null, current=null;
/* 優先選本機語音：Chrome 的「Google 日本語」是網路語音，常在念一兩句後卡住、不發 onend */
function pickVoice(){
  const vs=speechSynthesis.getVoices().filter(v=>(v.lang||'').toLowerCase().startsWith('ja'));
  if(!vs.length) return;
  const local=vs.filter(v=>v.localService);
  const pool=local.length?local:vs;
  jaVoice=pool.find(v=>/kyoko|o-ren|haruka|ayumi|nanami/i.test(v.name))||pool[0];
}
pickVoice();
if(typeof speechSynthesis!=='undefined') speechSynthesis.onvoiceschanged=pickVoice;

/* 句子都很短，不需要 Chrome 的 pause/resume keepAlive；
   而且 pause/resume 在 Safari／Android 上會讓 onend 不觸發，造成連續朗讀中斷 */
let utters=[], watchdog=null;   // 保留 utterance 參照，避免被 GC 後 onend 不觸發
function clearWatchdog(){ if(watchdog){clearTimeout(watchdog);watchdog=null;} }
function clearHL(){ document.querySelectorAll('.s.playing').forEach(e=>e.classList.remove('playing')); }
let playVoice=null;   // 一次播放固定用同一個聲音，避免中途 voiceschanged 換聲音而卡住
function stopAll(){ current=null; clearWatchdog(); utters=[];
  if(speechSynthesis.speaking||speechSynthesis.pending) speechSynthesis.cancel();
  clearHL(); }
/* 先停掉舊的播放再開始；第一次按時沒有東西在播，直接在點擊事件內同步 speak（iOS 需要） */
function begin(fn){
  const busy=speechSynthesis.speaking||speechSynthesis.pending;
  stopAll(); pickVoice(); playVoice=jaVoice;
  if(busy) setTimeout(fn,150); else fn();   // Chrome：cancel() 後立刻 speak() 可能被吃掉
}

function speak(text, el, pitch, onend){
  const u=new SpeechSynthesisUtterance(text);
  u.lang='ja-JP'; if(playVoice) u.voice=playVoice;
  const rate=parseFloat(document.getElementById('rate').value);
  u.rate=rate; u.pitch=pitch;
  let done=false;
  const finish=()=>{ if(done)return; done=true; clearWatchdog();
    if(el) el.classList.remove('playing');
    utters=utters.filter(x=>x!==u);
    if(onend) setTimeout(onend,60); };   // 不在 onend 內同步呼叫 speak()
  u.onstart=()=>{ if(el){ clearHL(); el.classList.add('playing'); el.scrollIntoView({block:'center',behavior:'smooth'}); } };
  u.onend=finish; u.onerror=finish;
  utters.push(u);
  // 保險：若瀏覽器漏發 onend，依句長估算時間後自動接下一句
  clearWatchdog();
  watchdog=setTimeout(()=>{ speechSynthesis.cancel(); finish(); }, (text.length*400/rate)+4000);
  speechSynthesis.speak(u);
  if(speechSynthesis.paused) speechSynthesis.resume();
}
function playOne(el){
  begin(()=>speak(el.dataset.t, el, parseFloat(el.dataset.p)));
}
function playAll(card){
  const els=[...card.querySelectorAll('.s')];
  begin(()=>{
    const token={}; current=token;
    (function next(i){
      if(current!==token||i>=els.length) return;
      speak(els[i].dataset.t, els[i], parseFloat(els[i].dataset.p), ()=>next(i+1));
    })(0);
  });
}

/* ---------- render ---------- */
const list=document.getElementById('list'), jump=document.getElementById('jump');
const PITCH=[1.0,0.78,1.15];
const JUMPS=[];

DATA.forEach(d=>{
  const card=document.createElement('section');
  card.className='card'; card.id='k'+d.n; card.dataset.search=d.search; card.dataset.level=d.level;

  const turns=d.turns.map((t,ti)=>{
    const pitch=PITCH[t.i%PITCH.length];
    const cls='turn'+(t.i===1?' b':'')+(t.sp?'':' narr');
    const sents=t.sents.map(s=>'<span class="s" data-p="'+pitch+'" data-t="'+s.plain.replace(/"/g,'&quot;')+'">'+s.ruby+'</span>').join('');
    const zh=d.zh_lines[ti]?'<div class="zh-line">'+d.zh_lines[ti]+'</div>':'';
    return '<div class="'+cls+'"><span class="sp">'+t.sp+'</span><div class="line">'+sents+zh+'</div></div>';
  }).join('');

  card.innerHTML=
    '<h2><span class="no">'+String(d.n).padStart(2,'0')+'</span><span class="lvl '+d.level+'">'+d.level+'</span>'+d.ja+' <span class="zh-title">'+d.zh+'</span></h2>'+
    '<p class="meta">'+d.len+' 字・'+d.turns.length+' 句對話・登場人物：'+d.speakers.join('／')+'</p>'+
    '<div class="dlg">'+turns+'</div>'+
    '<div class="tools">'+
      '<button class="btn play">▶ 全文朗讀</button>'+
      '<button class="btn tg">文法</button>'+
      '<button class="btn tv">單字</button>'+
    '</div>'+
    '<div class="panel pg"><h3>重點文法</h3><ul>'+d.gram.map(g=>'<li>'+g+'</li>').join('')+'</ul></div>'+
    '<div class="panel pv"><h3>重點單字</h3><table><thead><tr><th>單字</th><th>讀音</th><th>中文</th></tr></thead><tbody>'+
      d.vocab.map(v=>'<tr><td>'+v[0]+'</td><td>'+v[1]+'</td><td>'+v[2]+'</td></tr>').join('')+
    '</tbody></table></div>';

  card.querySelectorAll('.s').forEach(el=>el.addEventListener('click',()=>playOne(el)));
  card.querySelector('.play').addEventListener('click',()=>playAll(card));
  card.querySelector('.tg').addEventListener('click',e=>{card.querySelector('.pg').classList.toggle('show');e.target.classList.toggle('on');});
  card.querySelector('.tv').addEventListener('click',e=>{card.querySelector('.pv').classList.toggle('show');e.target.classList.toggle('on');});
  list.appendChild(card);

  JUMPS.push({id:'k'+d.n, level:d.level, search:d.search,
    text:String(d.n).padStart(2,'0')+'. '+d.zh});
});

document.getElementById('foot').textContent='共 '+DATA.length+' 篇・'+DATA.reduce((a,d)=>a+d.len,0)+' 字・朗讀使用瀏覽器內建語音（建議 Chrome / Safari）';

furiBtn.addEventListener('click',()=>{
  document.body.classList.toggle('nofuri');
  const on=!document.body.classList.contains('nofuri');
  furiBtn.classList.toggle('on',on); furiBtn.textContent=on?'假名 ON':'假名 OFF';
});
const zhBtn=document.getElementById('zhBtn');
zhBtn.addEventListener('click',()=>{
  document.body.classList.toggle('showzh');
  zhBtn.classList.toggle('on',document.body.classList.contains('showzh'));

function bulk(btn,sel,tsel){
  btn.addEventListener('click',()=>{
    const on=!btn.classList.contains('on');
    btn.classList.toggle('on',on);
    document.querySelectorAll(sel).forEach(p=>p.classList.toggle('show',on));
    document.querySelectorAll(tsel).forEach(b=>b.classList.toggle('on',on));
  });
}
bulk(document.getElementById('gramBtn'),'.pg','.tg');
bulk(document.getElementById('vocabBtn'),'.pv','.tv');
jump.addEventListener('change',e=>{
  const el=e.target.value && document.getElementById(e.target.value);
  if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
});
const rate=document.getElementById('rate'),rateVal=document.getElementById('rateVal');
rate.addEventListener('input',()=>rateVal.textContent=parseFloat(rate.value).toFixed(2));
document.getElementById('stopBtn').addEventListener('click',stopAll);

function rebuildJump(q,lvl){
  const keep=jump.value;
  jump.innerHTML='';
  const ph=document.createElement('option');
  ph.value=''; ph.textContent='跳至篇章…'; jump.appendChild(ph);
  JUMPS.forEach(j=>{
    if(q && !j.search.includes(q)) return;
    if(lvl && j.level!==lvl) return;
    const o=document.createElement('option');
    o.value=j.id; o.textContent=j.text; jump.appendChild(o);
  });
  jump.value=[...jump.options].some(o=>o.value===keep)?keep:'';
}
function applyFilter(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const lvl=document.getElementById('lvl').value;
  document.querySelectorAll('.card').forEach(c=>{
    const matchQ = !q || c.dataset.search.includes(q);
    const matchLvl = !lvl || c.dataset.level===lvl;
    c.classList.toggle('hidden', !(matchQ&&matchLvl));
  });
  rebuildJump(q,lvl);
}
document.getElementById('q').addEventListener('input',applyFilter);
document.getElementById('lvl').addEventListener('change',applyFilter);
applyFilter();

window.addEventListener('beforeunload',stopAll);
document.addEventListener('visibilitychange',()=>{ if(document.hidden) stopAll(); });
</script>
