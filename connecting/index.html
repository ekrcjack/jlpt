<div class="container">

<p>羅馬拼音例句 ・ 🔊 發音 ・ 中文文法解析（JLPT N5〜N4）</p>

<script>
/* 語音朗讀。Chrome 有兩個坑會讓長句唸到一半斷掉：
   1) 沒有任何 JS 引用的 utterance 會在朗讀途中被 GC 回收 → 用 _cur 保住它。
   2) 長 utterance 本身沒有時長保證 → splitJa() 先切成短段依序播。 */
let _cur=null;      // 保住當前 utterance 的引用，這行是防斷句的關鍵，別拿掉
let _timer=null;    // 待發的播放（cancel 後的延遲、例句之間的間隔）
let _seq=0;         // 播放序號：一遞增就讓所有舊的回呼失效

/* 長句分段：先按句末標點切，還太長再按読点切，最後才硬切。
   max 是打包目標長度；hardMax 是絕對上限，刻意訂得比 max 寬，
   因為硬切會切在詞中間造成唸錯（本檔最長的不可分割段落 18 字，實際不會觸發）。 */
function splitJa(text, max, hardMax){
  max = max || 24;
  hardMax = hardMax || 40;
  const HARD = '。！？!?', SOFT = '、，,';
  const out = [];
  const push = s=>{
    if(s.length <= hardMax){ out.push(s); return; }
    while(s.length > hardMax){ out.push(s.slice(0, hardMax)); s = s.slice(hardMax); }
    if(s) out.push(s);
  };
  const cut = (str, marks)=>{                // 依標點切塊，標點留在塊尾
    const r = []; let b = '';
    for(const ch of str){ b += ch; if(marks.indexOf(ch) >= 0){ r.push(b); b = ''; } }
    if(b) r.push(b);
    return r;
  };
  cut(text, HARD).forEach(sent=>{
    sent = sent.trim();
    if(!sent) return;
    if(sent.length <= max){ out.push(sent); return; }
    let acc = '';
    cut(sent, SOFT).forEach(part=>{
      if(acc && (acc + part).length > max){ push(acc); acc = part; }
      else acc += part;
    });
    if(acc) push(acc);
  });
  return out.length ? out : [text];
}

function _cancelAll(){
  _seq++;
  if(_timer){clearTimeout(_timer);_timer=null}
  if('speechSynthesis' in window)speechSynthesis.cancel();
  _cur=null;
}

/* 依序唸完 texts（每個元素會再自動分段），元素之間空 gap 毫秒 */
function _speakItems(texts, my, gap, done){
  let ti=0;
  const nextItem=()=>{
    if(my!==_seq)return;                            // 已被新的播放或停止取代
    if(ti>=texts.length){if(done)done();return}
    const segs=splitJa(texts[ti++]);
    let si=0;
    const step=()=>{
      if(my!==_seq)return;
      if(si>=segs.length){
        if(gap>0){_timer=setTimeout(()=>{_timer=null;nextItem()},gap)}else nextItem();
        return;
      }
      const u=new SpeechSynthesisUtterance(segs[si++]);
      u.lang='ja-JP';u.rate=0.85;
      u.onend=()=>{if(my===_seq)step()};
      u.onerror=e=>{
        const err=e&&e.error;
        if(err&&err!=='interrupted'&&err!=='canceled')
          console.warn('[speak] 中斷:',err,segs[si-1]);
        if(my===_seq)step();                        // 單段出錯就跳過，不要整串卡死
      };
      _cur=u;
      speechSynthesis.speak(u);
    };
    step();
  };
  nextItem();
}

function speak(t,btn){
  if(!('speechSynthesis' in window))return;
  stopSeq();
  _cancelAll();
  const my=_seq;
  document.querySelectorAll('.spk.playing').forEach(b=>b.classList.remove('playing'));
  btn.classList.add('playing');
  // cancel 後留一點時間，否則部分瀏覽器會吞掉第一句
  _timer=setTimeout(()=>{
    _timer=null;
    _speakItems([t],my,0,()=>{if(my===_seq)btn.classList.remove('playing')});
  },80);
}

/* 連續播放：連結詞本身 → 該詞的全部例句 */
let seqBtn=null;
function stopSeq(){
  _cancelAll();
  if(seqBtn){seqBtn.classList.remove('playing');seqBtn.textContent='▶ 全部播放';seqBtn=null}
}
function playCard(btn){
  if(!('speechSynthesis' in window))return;
  const same=(seqBtn===btn);
  stopSeq();
  document.querySelectorAll('.spk.playing').forEach(b=>b.classList.remove('playing'));
  if(same)return;                                   // 再按一次＝停止
  const card=btn.closest('.card');
  const texts=[btn.dataset.word,...[...card.querySelectorAll('.exjp')].map(el=>el.innerText)];
  seqBtn=btn;btn.classList.add('playing');btn.textContent='■ 停止播放';
  const my=_seq;
  _timer=setTimeout(()=>{
    _timer=null;
    _speakItems(texts,my,320,()=>{if(my===_seq)stopSeq()});
  },80);
}

const CATS={contrast:'逆接・選擇',cause:'因果',sequence:'順接・追加',condition:'條件',adverb:'語氣副詞'};

const W=[
{n:1,jp:'でも',rm:'demo',en:'但是／可是',cat:'contrast',
 core:'<b>接續詞</b>，放在<b>後句句首</b>，前面要斷句（。）。語體中性，會話與書面皆可。<br><span class="pat">A。＋でも、＋B。</span><br>與「けど」的差別：<b>でも</b>開新句子，<b>けど</b>黏在前句尾巴。',
 ex:[
  {jp:'今日は雨です。<span class="hl">でも</span>、学校に行きます。',rm:'Kyō wa ame desu. Demo, gakkō ni ikimasu.',zh:'今天下雨。但是我還是要去學校。',
   g:'前句<code>雨です</code>（名詞＋です）與後句<code>行きます</code>（動詞ます形）語氣相反，用でも連接。でも後面通常加逗號。',},
  {jp:'あの映画は長いです。<span class="hl">でも</span>、とても面白いです。',rm:'Ano eiga wa nagai desu. Demo, totemo omoshiroi desu.',zh:'那部電影很長。但是非常有趣。',
   g:'い形容詞句（<code>長いです</code>／<code>面白いです</code>）也能用でも連接。<code>とても</code>是程度副詞，修飾後面的形容詞。'},
  {jp:'私は肉が好きです。<span class="hl">でも</span>、魚は苦手です。',rm:'Watashi wa niku ga suki desu. Demo, sakana wa nigate desu.',zh:'我喜歡肉。但是不太敢吃魚。',
   g:'<code>〜が苦手です</code>＝不擅長／不敢吃，對象用<b>が</b>。兩句都用<b>は</b>形成對比（肉／魚），でも讓這個對比更清楚。'}
 ],
 warn:'「でも」還有另一個完全不同的用法：接在疑問詞後表「無論…都」，如<code>誰でも（誰都）</code>、<code>いつでも（隨時）</code>、<code>何でも（什麼都）</code>。看到でも要先判斷是「接續詞」還是「助詞」。'},

{n:2,jp:'けど',rm:'kedo',en:'雖然…但是',cat:'contrast',
 core:'<b>接續助詞</b>，接在<b>前句句尾</b>，把兩句併成一句。口語色彩重。<br><span class="pat">普通形／です・ます形＋けど、＋B。</span><br>丁寧度排序：<b>けれども ＞ けれど ＞ けど</b>（正式書面用「が」）。',
 ex:[
  {jp:'私は日本語が好きです<span class="hl">けど</span>、難しいです。',rm:'Watashi wa nihongo ga suki desu kedo, muzukashii desu.',zh:'我雖然喜歡日文，但是很難。',
   g:'けど直接接在<code>好きです</code>後面，<b>不斷句</b>——這是與でも最大的不同。<code>〜が好きです</code>的對象用助詞<b>が</b>不用を。'},
  {jp:'仕事は忙しい<span class="hl">けど</span>、やりがいがあります。',rm:'Shigoto wa isogashii kedo, yarigai ga arimasu.',zh:'工作雖然忙，但很有成就感。',
   g:'い形容詞可直接＋けど（<code>忙しい＋けど</code>，不用加です）。名詞・な形容詞則要加<b>だ</b>：<code>学生だけど</code>、<code>便利だけど</code>。'},
  {jp:'彼は学生<span class="hl">だけど</span>、会社を作りました。',rm:'Kare wa gakusei da kedo, kaisha o tsukurimashita.',zh:'他雖然是學生，但開了公司。',
   g:'名詞接けど<b>要先加だ</b>：<code>学生＋だ＋けど</code>。な形容詞同理（<code>元気だけど</code>）。丁寧體則說<code>学生ですけど</code>。'}
 ],
 warn:'對長輩、上司、正式報告避免用「けど」，改用<code>〜ですが</code>或<code>〜けれども</code>。'},

{n:3,jp:'だから',rm:'dakara',en:'所以／因此',cat:'cause',
 core:'<b>接續詞</b>，<b>前句＝原因，後句＝結果</b>（順序與「〜から」相同但斷句）。<br><span class="pat">［原因］。＋だから、＋［結果］。</span><br>丁寧體用<b>ですから</b>；書面正式用<b>したがって・そのため</b>。',
 ex:[
  {jp:'昨日は寝ていません。<span class="hl">だから</span>、今日は疲れています。',rm:'Kinō wa nete imasen. Dakara, kyō wa tsukarete imasu.',zh:'昨天沒睡。所以今天很累。',
   g:'兩句都用<code>〜ています</code>（狀態持續）。<code>寝ていません</code>＝ています的否定，表「一直沒睡的狀態」。'},
  {jp:'明日試験があります。<span class="hl">だから</span>、勉強しなければなりません。',rm:'Ashita shiken ga arimasu. Dakara, benkyō shinakereba narimasen.',zh:'明天有考試。所以我必須讀書。',
   g:'<code>〜なければなりません</code>＝「必須…」（N4義務句型）。動詞ない形去い＋<code>ければなりません</code>：勉強しない → 勉強しなければなりません。'},
  {jp:'ここは駅から近いです。<span class="hl">だから</span>、家賃が高いです。',rm:'Koko wa eki kara chikai desu. Dakara, yachin ga takai desu.',zh:'這裡離車站近。所以房租很貴。',
   g:'<code>〜から近い</code>＝離…近，起點用<b>から</b>。前句客觀原因、後句必然結果，是だから最典型的形狀。'}
 ],
 warn:'「だから」帶有強調自己主張的語感，用在反駁對方時（<code>だから言ったでしょう</code>＝我就說吧）會顯得不耐煩。對上司說明理由請用<b>ですから</b>。'},

{n:4,jp:'だって',rm:'datte',en:'因為啊…（辯解）',cat:'cause',
 core:'<b>口語接續詞</b>，放句首，用來<b>替自己辯解或反駁</b>，語氣像撒嬌／不服氣。<br><span class="pat">（對方的話）→ だって、＋［理由］＋もん／から。</span>',
 ex:[
  {jp:'私は日本に行きたいです。<span class="hl">だって</span>、友達がいますから。',rm:'Watashi wa Nihon ni ikitai desu. Datte, tomodachi ga imasu kara.',zh:'我想去日本。因為（我）有朋友在那裡啊。',
   g:'<code>〜たいです</code>＝想做…（ます形去ます＋たい）。だって常與句尾的<code>から</code>／<code>もん</code>搭配，加強「這是理由啊」的語氣。'},
  {jp:'どうして食べないの。<span class="hl">だって</span>、お腹がいっぱいなんだもん。',rm:'Dōshite tabenai no. Datte, onaka ga ippai nan da mon.',zh:'為什麼不吃？因為我肚子很飽啊。',
   g:'<code>〜もん</code>（＝もの）是撒嬌式的理由句尾，與だって成對出現。<code>お腹がいっぱい</code>＝吃飽了。'},
  {jp:'早く寝なさい。<span class="hl">だって</span>、まだ宿題が終わらないから。',rm:'Hayaku nenasai. Datte, mada shukudai ga owaranai kara.',zh:'快去睡。因為作業還沒寫完啊。',
   g:'<code>〜なさい</code>＝溫和的命令。<code>まだ〜ない</code>＝還沒…。句尾的<code>から</code>與だって呼應，說明辯解的理由。'}
 ],
 warn:'非常口語且略帶孩子氣，<b>絕對不要對上司、客戶使用</b>。正式場合用<code>なぜなら〜からです</code>。另外「だって」也有「即使…也」「聽說」的用法，需看語境。'},

{n:5,jp:'それで',rm:'sorede',en:'於是／然後（結果）',cat:'sequence',
 core:'<b>接續詞</b>。前句是<b>狀況／原因</b>，後句是<b>自然發生的結果或後續</b>，用於敘述事情經過。<br><span class="pat">［狀況］。＋それで、＋［結果］。</span>',
 ex:[
  {jp:'朝ご飯を食べました。<span class="hl">それで</span>、学校に行きました。',rm:'Asagohan o tabemashita. Sorede, gakkō ni ikimashita.',zh:'我吃了早餐。然後就去學校了。',
   g:'兩句都用<b>ました形</b>（過去式），描述時間先後。移動動詞<code>行きます</code>的目的地用助詞<b>に</b>。'},
  {jp:'電車が止まりました。<span class="hl">それで</span>、会社に遅れました。',rm:'Densha ga tomarimashita. Sorede, kaisha ni okuremashita.',zh:'電車停駛了。於是上班遲到了。',
   g:'<code>〜に遅れます</code>＝遲到、趕不上，對象用<b>に</b>。前句是自己無法控制的狀況，後句是自然的結果，這正是それで的核心。'},
  {jp:'道が分かりませんでした。<span class="hl">それで</span>、駅員に聞きました。',rm:'Michi ga wakarimasen deshita. Sorede, ekiin ni kikimashita.',zh:'我不知道路。於是就問了站務員。',
   g:'<code>〜が分かります</code>的對象用<b>が</b>；<code>〜に聞きます</code>的詢問對象用<b>に</b>。兩句都是過去式，敘述事情經過。'}
 ],
 warn:'後句<b>不能</b>是命令、請求、意志（×<code>それで、行きなさい</code>）。要接請求時改用<b>ですから</b>。「だから」重「我的判斷」，「それで」重「客觀經過」。'},

{n:6,jp:'そして',rm:'soshite',en:'而且／然後',cat:'sequence',
 core:'<b>接續詞</b>，<b>單純累加或時間先後</b>，沒有因果關係。書面語色彩較強。<br><span class="pat">A。＋そして、＋B。</span>',
 ex:[
  {jp:'公園に行きました。<span class="hl">そして</span>、友達に会いました。',rm:'Kōen ni ikimashita. Soshite, tomodachi ni aimashita.',zh:'我去了公園。然後見到了朋友。',
   g:'<code>〜に会います</code>＝見到某人，對象用助詞<b>に</b>（不是を）。そして只是把兩個動作依序排列。'},
  {jp:'朝起きて、顔を洗いました。<span class="hl">そして</span>、朝ご飯を食べました。',rm:'Asa okite, kao o araimashita. Soshite, asagohan o tabemashita.',zh:'早上起床洗了臉。然後吃了早餐。',
   g:'句中的<code>起きて</code>是<b>て形</b>（同一句內連接），そして用於<b>句與句之間</b>——兩種連接方式可以並用。'},
  {jp:'この部屋は広いです。<span class="hl">そして</span>、とても静かです。',rm:'Kono heya wa hiroi desu. Soshite, totemo shizuka desu.',zh:'這個房間很寬敞。而且非常安靜。',

 ],
 warn:'比較：<b>そして</b>＝單純加上（A，然後B）／<b>それで</b>＝因為A所以接著B／<b>それから</b>＝強調時間順序（接下來）。'},

{n:7,jp:'あと',rm:'ato',en:'還有（追加）',cat:'sequence',

  {jp:'牛乳を買ってきて。<span class="hl">あと</span>、パンもお願い。',rm:'Gyūnyū o katte kite. Ato, pan mo onegai.',zh:'幫我買牛奶回來。還有，也麻煩買麵包。',

{n:8,jp:'じゃあ',rm:'jā',en:'那麼／那樣的話',cat:'condition',

{n:9,jp:'もし',rm:'moshi',en:'如果',cat:'condition',

   g:'い形容詞的たら形＝去<b>い</b>＋<b>かったら</b>：良い→良かったら、寒い→寒かったら。動詞則是た形＋ら：降る→降ったら。'},

{n:10,jp:'なら',rm:'nara',en:'如果是…的話',cat:'condition',

{n:11,jp:'やっぱり',rm:'yappari',en:'果然／還是',cat:'adverb',

{n:14,jp:'たぶん',rm:'tabun',en:'大概／應該',cat:'adverb',

function render(){
  document.getElementById('cards').innerHTML=W.map(w=>`
    <div class="card" data-cat="${w.cat}">
      <div class="top">
        <div class="num">${w.n}</div>
        <div>
          <div class="jp">${w.jp}</div>
          <div class="rm">${w.rm}</div>
        </div>
        <div class="mean"><b>${w.en}</b><br><span class="tag">${CATS[w.cat]}</span></div>
      </div>
      <div class="core"><div class="t">🔑 核心用法・接續規則</div>${w.core}</div>
      <button class="spkall" data-word="${w.jp}" onclick="playCard(this)" title="依序播放「${w.jp}」與 ${w.ex.length} 個例句">▶ 全部播放</button>
      ${w.ex.map(e=>`
        <div class="ex">
          <div class="exhead">
            <div class="exjp">${e.jp}</div>
            <button class="spk" onclick="speak(this.parentNode.querySelector('.exjp').innerText,this)">🔊</button>
          </div>
          <div class="exrm">${e.rm}</div>
          <div class="exzh">${e.zh}</div>
          <div class="gram"><div class="gt">📖 文法解析</div>${e.g}</div>
        </div>`).join('')}
      ${w.warn?`<div class="warn"><div class="wt">⚠️ 易錯・辨異</div>${w.warn}</div>`:''}
    </div>`).join('');
}

function buildCtrl(){
  const counts={};W.forEach(w=>counts[w.cat]=(counts[w.cat]||0)+1);
  let html=`<button class="f active" data-c="all">全部 ${W.length}</button>`;
  for(const k in CATS)html+=`<button class="f" data-c="${k}">${CATS[k]} ${counts[k]||0}</button>`;
  const c=document.getElementById('ctrl');c.innerHTML=html;
  c.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    c.querySelectorAll('button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    stopSeq();
    if('speechSynthesis' in window)speechSynthesis.cancel();
    document.querySelectorAll('.spk.playing').forEach(x=>x.classList.remove('playing'));
    const t=b.dataset.c;
    document.querySelectorAll('.card').forEach(card=>{
      card.classList.toggle('hidden',t!=='all'&&card.dataset.cat!==t);
    });
    stats();
  });
}
function stats(){
  const v=document.querySelectorAll('.card:not(.hidden)').length;
  document.getElementById('stats').textContent=`顯示 ${v} / ${W.length} 個連結詞`;
}
render();buildCtrl();stats();
if('speechSynthesis' in window)speechSynthesis.getVoices();
</script>

<button class="fab" id="toTop" aria-label="回到最上面" title="回到最上面">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4l-8 8h5v8h6v-8h5z"/></svg>
</button>
<script>
(function(){
  var b=document.getElementById('toTop');
  var boxes=[];
  function top(){
    var y=window.scrollY||document.documentElement.scrollTop||0;
    boxes.forEach(function(el){ if(el.scrollTop>y) y=el.scrollTop; });
    return y;
  }
  function sync(){ b.classList.toggle('show', top()>320); }
  window.addEventListener('scroll',sync,{passive:true});
  boxes.forEach(function(el){ el.addEventListener('scroll',sync,{passive:true}); });
  sync();
  b.addEventListener('click',function(){
    var smooth=!window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var opt=smooth?{top:0,behavior:'smooth'}:{top:0};
    window.scrollTo(opt);
    boxes.forEach(function(el){ el.scrollTo ? el.scrollTo(opt) : el.scrollTop=0; });
  });
})();
</script>
</body>
</html>
