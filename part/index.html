<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>日本語 助詞大全</title>
<style>
:root{
  --ink:#14202e;
  --paper:#f6f6f2;
  --paper2:#fdfdfb;
  --grid:#b9c7d6;
  --shu:#bf3b2f;
  --ai:#2f5f8f;
  --sumi:#5c6773;
  --line:#dfe2dc;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  font-size:16px;line-height:1.75;
  padding-bottom:64px;
}
.jp{font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP","Songti TC",serif}

/* ── top bar ── */
header{
  position:sticky;top:0;z-index:20;
  background:rgba(246,246,242,.94);
  backdrop-filter:saturate(1.4) blur(8px);
  border-bottom:1px solid var(--line);
}
.hwrap{max-width:860px;margin:0 auto;padding:12px 16px 10px}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{
  font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  font-size:21px;margin:0;letter-spacing:.06em;font-weight:600;
}
.brand span{font-size:11px;letter-spacing:.22em;color:var(--sumi);text-transform:uppercase}
.tools{display:flex;gap:8px;margin-top:10px;align-items:center}
input[type=search]{
  flex:1;min-width:0;font:inherit;font-size:14px;
  padding:8px 12px;border:1px solid var(--line);border-radius:2px;
  background:var(--paper2);color:var(--ink);
}
input[type=search]:focus{outline:2px solid var(--ai);outline-offset:1px}
.rate{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--sumi);white-space:nowrap}
.rate input{width:70px;accent-color:var(--shu)}
.chips{display:flex;gap:6px;margin-top:9px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{
  font:inherit;font-size:12px;letter-spacing:.05em;white-space:nowrap;
  padding:5px 11px;border:1px solid var(--line);background:transparent;
  color:var(--sumi);border-radius:999px;cursor:pointer;
}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--paper2)}
.warn{max-width:860px;margin:10px auto 0;padding:8px 14px;font-size:12.5px;
  border-left:3px solid var(--shu);background:#fbeeec;color:#7a2a22;display:none}

main{max-width:860px;margin:0 auto;padding:0 16px}

/* ── group heading ── */
.group{margin:36px 0 14px;display:flex;align-items:center;gap:12px}
.group b{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:15px;letter-spacing:.14em;font-weight:600}
.group i{font-style:normal;font-size:11px;color:var(--sumi);letter-spacing:.08em}
.group hr{flex:1;border:0;border-top:1px solid var(--line);margin:0}

/* ── card ── */
.card{
  background:var(--paper2);border:1px solid var(--line);
  display:grid;grid-template-columns:112px 1fr;gap:0;margin-bottom:14px;
}
.cell{
  border-right:1px solid var(--line);
  padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;
  background:
    linear-gradient(var(--grid),var(--grid)) center/100% 1px no-repeat,
    linear-gradient(var(--grid),var(--grid)) center/1px 100% no-repeat,
    var(--paper2);
  background-size:56px 1px,1px 56px;
  position:relative;
}
.glyph{
  font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  font-size:40px;line-height:1;color:var(--ink);
  width:72px;height:72px;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--grid);background:rgba(255,255,255,.75);
}
.glyph.sm{font-size:24px}
.romaji{font-size:10.5px;letter-spacing:.18em;color:var(--sumi);text-transform:uppercase}
.body{padding:15px 16px 16px}
.gist{font-size:15px;font-weight:600;margin:0 0 6px;letter-spacing:.01em}
.rule{
  font-size:12.5px;color:var(--sumi);line-height:1.7;
  border-left:2px solid var(--grid);padding-left:10px;margin:0 0 12px;
}
.rule code{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;color:var(--ai);font-size:13px}

/* ── examples ── */
ol{list-style:none;margin:0;padding:0;counter-reset:ex}
li{padding:9px 0;border-top:1px dashed var(--line);display:flex;gap:10px;align-items:flex-start}
li:first-child{border-top:1px solid var(--line)}
.num{
  counter-increment:ex;font-size:10px;color:var(--sumi);
  padding-top:5px;min-width:14px;font-variant-numeric:tabular-nums;
}
.num::before{content:counter(ex)}
.ex{flex:1;min-width:0}
.sent{font-size:18px;line-height:1.9;letter-spacing:.02em}
.mk{color:var(--shu);font-weight:600;border-bottom:2px solid rgba(191,59,47,.35);padding:0 1px}
.kana{font-size:12.5px;color:var(--sumi);letter-spacing:.03em;margin-top:2px}
.zh{font-size:13.5px;margin-top:3px}
.note{font-size:12px;color:var(--ai);margin-top:3px}
.play{
  flex:0 0 auto;margin-top:4px;width:34px;height:34px;border-radius:50%;
  border:1px solid var(--line);background:var(--paper2);color:var(--ink);
  cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;
}
.play:hover{border-color:var(--shu);color:var(--shu)}
.play:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
.play svg{width:13px;height:13px;fill:currentColor}
li.speaking{background:rgba(191,59,47,.05)}
li.speaking .play{border-color:var(--shu);background:var(--shu);color:#fff}
.allbtn{
  margin-top:12px;font:inherit;font-size:12px;letter-spacing:.06em;
  padding:6px 13px;border:1px solid var(--line);background:transparent;
  color:var(--sumi);cursor:pointer;border-radius:2px;
}
.allbtn:hover{border-color:var(--ink);color:var(--ink)}
.allbtn.playing{border-color:var(--shu);background:var(--shu);color:#fff}
.cellall{margin-top:2px;font-size:11px;padding:4px 9px;letter-spacing:.04em;white-space:nowrap}
.empty{padding:40px 0;text-align:center;color:var(--sumi);font-size:14px}
footer{max-width:860px;margin:44px auto 0;padding:16px;border-top:1px solid var(--line);
  font-size:11.5px;color:var(--sumi);line-height:1.9}
@media (max-width:560px){
  .card{grid-template-columns:1fr}
  .cell{border-right:0;border-bottom:1px solid var(--line);flex-direction:row;justify-content:flex-start;gap:12px;padding:12px 14px;background-size:0,0}
  .glyph{width:52px;height:52px;font-size:28px}
  .glyph.sm{font-size:17px}
  .sent{font-size:17px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* 回到最上面 */
.fab{
  position:fixed;right:22px;bottom:24px;z-index:60;
  width:46px;height:46px;border:none;border-radius:50%;cursor:pointer;
  background:var(--shu);color:#fff;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 18px rgba(0,0,0,.22);
  opacity:0;visibility:hidden;transform:translateY(10px);
  transition:opacity .25s,transform .25s,visibility .25s,box-shadow .15s;
}
.fab.show{opacity:1;visibility:visible;transform:translateY(0);}
.fab:hover{box-shadow:0 8px 22px rgba(0,0,0,.3);}
.fab:active{transform:scale(.92);}
.fab:focus-visible{outline:2px solid #fff;outline-offset:2px;}
.fab svg{width:20px;height:20px;fill:currentColor;}
@media(max-width:640px){.fab{right:14px;bottom:16px;width:42px;height:42px;}}
</style>
</head>
<body>

<header>
  <div class="hwrap">
    <div class="brand">
      <h1 class="jp">日本語　助詞大全</h1>
      <span>Particles · N5–N4</span>
    </div>
    <div class="tools">
      <input type="search" id="q" placeholder="搜尋助詞、用法或中文（例：から、原因、只有）">
      <label class="rate">語速<input type="range" id="rate" min="0.5" max="1.2" step="0.05" value="0.85"></label>
    </div>
    <div class="chips" id="chips"></div>
  </div>
</header>
<div class="warn" id="warn">此瀏覽器尚未載入日文語音。iOS／Android 請用系統瀏覽器並開啟音量；Android 可於「設定 → 語言與輸入 → 文字轉語音」下載日文語音包。</div>

<main id="list"></main>

<footer>
  發音採用瀏覽器內建語音合成（Web Speech API），語速可於上方調整。<br>
  例句中的<span class="mk">朱色</span>標記即為該助詞出現位置。
</footer>

const ICON='<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 5V4L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 1.5v2a8.5 8.5 0 0 1 0 17v2a10.5 10.5 0 0 0 0-21z"/></svg>';
const clean=s=>s.replace(/[【】]/g,'');
const mark=s=>s.replace(/【(.+?)】/g,'<span class="mk">$1</span>');

let filter='all';
function render(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  list.innerHTML='';let count=0;
  DATA.forEach(gp=>{
    if(filter!=='all'&&filter!==gp.g)return;
    const hit=gp.items.filter(it=>{
      if(!q)return true;
      const hay=(it.p+it.r+it.gist+it.rule+it.ex.map(e=>e.j+e.k+e.z+(e.n||'')).join('')).toLowerCase();
      return hay.includes(q);
    });
    if(!hit.length)return;count+=hit.length;
    const h=document.createElement('div');h.className='group';
    h.innerHTML=`<b class="jp">${gp.g}</b><i>${gp.gn}</i><hr>`;list.appendChild(h);
    hit.forEach(it=>{
      const c=document.createElement('section');c.className='card';
      c.innerHTML=`
      <div class="cell">
        <div class="glyph jp${it.p.length>1?' sm':''}">${it.p}</div>
        <div class="romaji">${it.r}</div>
        <button class="allbtn cellall" data-all="1" title="連續播放「${it.p}」的全部例句">▶ 全部 ${it.ex.length}</button>
      </div>
      <div class="body">
        <p class="gist">${it.gist}</p>
        <p class="rule">${it.rule}</p>
        <ol>${it.ex.map(e=>`
          <li>
            <span class="num"></span>
            <div class="ex">
              <div class="sent jp">${mark(e.j)}</div>
              <div class="kana jp">${e.k}</div>
              <div class="zh">${e.z}</div>
              ${e.n?`<div class="note">▸ ${e.n}</div>`:''}
            </div>
            <button class="play" data-say="${clean(e.j)}" aria-label="播放發音">${ICON}</button>
          </li>`).join('')}
        </ol>
        <button class="allbtn" data-all="1">▶ 連續播放 ${it.ex.length} 個例句</button>
      </div>`;
      list.appendChild(c);
    });
  });
  if(!count)list.innerHTML='<p class="empty">找不到符合的助詞，換個關鍵字試試。</p>';
}
['all',...DATA.map(g=>g.g)].forEach(k=>{
  const b=document.createElement('button');b.className='chip';b.textContent=k==='all'?'全部':k;
  b.setAttribute('aria-pressed',k==='all');
  b.onclick=()=>{filter=k;[...chips.children].forEach(x=>x.setAttribute('aria-pressed','false'));
    b.setAttribute('aria-pressed','true');stop();render();};
  chips.appendChild(b);
});
document.getElementById('q').addEventListener('input',render);
render();

/* ── speech ── */
const synth=window.speechSynthesis;
let jaVoice=null,keep=null,current=null,queue=[],allCard=null;
function setAllBtn(card){
  document.querySelectorAll(".allbtn.playing").forEach(b=>b.classList.remove("playing"));
  if(card)card.querySelectorAll(".allbtn").forEach(b=>b.classList.add("playing"));
  allCard=card||null;
}
function pick(){
  if(!synth)return;
  const v=synth.getVoices();
  if(!v.length)return;
  jaVoice=v.find(x=>/^ja/i.test(x.lang)&&/Google|Kyoko|Otoya|O-ren|Hattori|Ayumi/i.test(x.name))
        ||v.find(x=>/^ja/i.test(x.lang))||null;
  document.getElementById('warn').style.display=jaVoice?'none':'block';
}
if(synth){pick();synth.onvoiceschanged=pick;let t=0;const iv=setInterval(()=>{pick();if(jaVoice||++t>10)clearInterval(iv);},400);}
else document.getElementById('warn').style.display='block';

function stop(){
  queue=[];if(keep){clearInterval(keep);keep=null;}
  if(synth)synth.cancel();
  if(current){current.classList.remove('speaking');current=null;}
  setAllBtn(null);
}
function say(text,li,after){
  if(!synth)return;
  synth.cancel();
  setTimeout(()=>{
    const u=new SpeechSynthesisUtterance(text);
    u.lang='ja-JP';if(jaVoice)u.voice=jaVoice;
    u.rate=parseFloat(document.getElementById('rate').value);u.pitch=1;
    if(current)current.classList.remove('speaking');
    current=li;li&&li.classList.add('speaking');
    u.onend=u.onerror=()=>{
      if(keep){clearInterval(keep);keep=null;}
      li&&li.classList.remove('speaking');if(current===li)current=null;
      if(after)setTimeout(after,320);
    };
    if(keep)clearInterval(keep);
    keep=setInterval(()=>{if(synth.speaking){synth.pause();synth.resume();}else{clearInterval(keep);keep=null;}},8000);
    if(synth.paused)synth.resume();
    synth.speak(u);
  },80);
}
function runQueue(){
  const next=queue.shift();
  if(!next){setAllBtn(null);return;}
  say(next.t,next.li,runQueue);
}
document.addEventListener('click',e=>{
  const p=e.target.closest('.play');
  if(p){queue=[];setAllBtn(null);say(p.dataset.say,p.closest('li'));return;}
  const a=e.target.closest('.allbtn');
  if(a){
    const card=a.closest('.card');
    if(card===allCard){stop();return;}
    stop();
    setAllBtn(card);
    queue=[...card.querySelectorAll('.play')].map(b=>({t:b.dataset.say,li:b.closest('li')}));
    runQueue();
  }
});
document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();});
</script>

<button class="fab" id="toTop" aria-label="回到最上面" title="回到最上面">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4l-8 8h5v8h6v-8h5z"/></svg>
</button>
<script>
(function(){
  var b=document.getElementById('toTop');
  function sync(){
    var y=window.scrollY||document.documentElement.scrollTop||0;
    b.classList.toggle('show', y>320);
  }
  window.addEventListener('scroll',sync,{passive:true});
  sync();
  b.addEventListener('click',function(){
    var smooth=!window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    window.scrollTo(smooth?{top:0,behavior:'smooth'}:{top:0});
  });
})();
</script>
