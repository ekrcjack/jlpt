<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生活日語會話</title>
<style>
:root{
  --bg:#0f172a; --panel:#1e293b; --panel2:#334155;
  --accent:#38bdf8; --accent2:#818cf8; --pink:#f472b6;
  --text:#e2e8f0; --muted:#94a3b8; --line:#334155;
  --a:#38bdf8; --b:#a78bfa; --c:#fb7185;
  --card:#1e293b; --hover:#2d3b52;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{
  font-family:'Hiragino Sans','Noto Sans TC','Segoe UI',sans-serif;
  background:linear-gradient(135deg,#0f172a 0%,#1e1b4b 100%);
  color:var(--text);height:100%;
}
.wrap{max-width:1180px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;}
.layout{display:flex;flex-direction:column;flex:1;min-height:0;}
/* 單元 tab（置頂，橫向捲動） */
.sidebar{
  width:100%;flex-shrink:0;position:sticky;top:0;z-index:45;
  background:rgba(15,23,42,.75);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
  display:flex;gap:6px;padding:10px 14px;
  overflow-x:auto;overflow-y:hidden;
}
.sidebar::-webkit-scrollbar{height:0;}
.side-title{display:none;}
.unit-btn{
  flex:0 0 auto;display:flex;align-items:center;gap:7px;white-space:nowrap;
  padding:7px 14px;border-radius:999px;cursor:pointer;
  border:1px solid var(--line);background:var(--panel);color:var(--muted);
  font-size:.82em;font-weight:700;transition:all .18s;
}
.unit-btn:hover{background:var(--hover);border-color:var(--accent);color:var(--text);}
.unit-btn.active{background:linear-gradient(120deg,var(--accent),var(--accent2));color:#0f172a;border-color:transparent;box-shadow:0 3px 12px rgba(56,189,248,.35);}
.unit-num{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:20px;height:20px;border-radius:6px;background:rgba(148,163,184,.22);
  font-weight:800;font-size:.8em;flex-shrink:0;
}
.unit-btn.active .unit-num{background:rgba(15,23,42,.25);}
/* 主內容 */
.main{flex:1;overflow-y:auto;padding:26px 30px 60px;}
.unit-head{margin-bottom:24px;padding-bottom:18px;border-bottom:2px solid var(--line);}
.unit-head h2{font-size:1.9em;font-weight:800;background:linear-gradient(120deg,var(--accent),var(--pink));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.unit-head .jp{font-size:1em;color:var(--accent2);margin-top:4px;font-weight:600;}
.unit-head .theme{font-size:.9em;color:var(--muted);margin-top:8px;}
.scene{
  background:var(--card);border-radius:16px;padding:20px 22px;margin-bottom:20px;
  border:1px solid var(--line);box-shadow:0 4px 16px rgba(0,0,0,.2);
}
.scene-head{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
.scene-badge{
  display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;
  border-radius:9px;background:linear-gradient(120deg,var(--accent2),var(--pink));
  color:#0f172a;font-weight:800;font-size:.9em;flex-shrink:0;
}
.scene-title{font-size:1.05em;font-weight:700;color:var(--text);}
.line{
  display:flex;gap:12px;padding:12px 0;border-top:1px solid rgba(51,65,85,.5);
}
.line:first-of-type{border-top:none;}
.spk{
  display:inline-flex;align-items:center;justify-content:center;
  width:30px;height:30px;border-radius:50%;font-weight:800;font-size:.85em;flex-shrink:0;
  color:#0f172a;
}
.spk.A{background:var(--a);}
.spk.B{background:var(--b);}
.spk.C,.spk.E,.spk.R,.spk.S,.spk.K,.spk.Y,.spk.W{background:var(--c);}
.line-body{flex:1;min-width:0;}
.jp-row{display:flex;align-items:flex-start;gap:10px;margin-bottom:4px;}
.jp-text{font-size:1.15em;font-weight:600;line-height:1.5;color:#f1f5f9;flex:1;}
.romaji{font-size:.88em;color:var(--accent);font-style:italic;margin-bottom:3px;line-height:1.4;}
.zh{font-size:.92em;color:var(--muted);line-height:1.4;}
.gram{
  margin-top:8px;padding:8px 10px 8px 12px;border-left:2px solid var(--accent2);
  background:rgba(129,140,248,.05);border-radius:0 4px 4px 0;
  font-size:.85em;color:#a5b4fc;line-height:1.75;
}
.gram b{color:#c7d2fe;font-weight:700;}
.gram .n4{display:inline-block;margin-top:3px;padding:1px 7px;border-radius:4px;
  background:rgba(129,140,248,.2);color:#c7d2fe;font-size:.92em;letter-spacing:.04em;}
.play{
  flex-shrink:0;width:34px;height:34px;border-radius:50%;border:none;cursor:pointer;
  background:linear-gradient(120deg,var(--accent),var(--accent2));color:#0f172a;
  display:inline-flex;align-items:center;justify-content:center;font-size:.9em;
  transition:transform .15s,box-shadow .15s;
}
.play:hover{transform:scale(1.12);box-shadow:0 3px 12px rgba(56,189,248,.5);}
.play:active{transform:scale(.95);}
.play.playing{background:linear-gradient(120deg,var(--pink),#ef4444);animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.6;}}
/* 播放整個場景 */
.scene-play{
  margin-left:auto;padding:6px 14px;border-radius:20px;border:none;cursor:pointer;
  background:rgba(56,189,248,.15);color:var(--accent);font-weight:700;font-size:.8em;
  display:inline-flex;align-items:center;gap:5px;transition:all .15s;
}
.scene-play:hover{background:rgba(56,189,248,.3);}
/* 控制列 */
.controls{
  position:sticky;bottom:0;background:rgba(15,23,42,.92);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;
  justify-content:center;gap:18px;flex-wrap:wrap;z-index:40;
}
.speed{display:flex;align-items:center;gap:10px;font-size:.85em;color:var(--muted);font-weight:600;}
.speed input{width:120px;accent-color:var(--accent);}
.speed .val{color:var(--accent);font-weight:800;min-width:36px;}
.cbtn{
  padding:8px 18px;border-radius:10px;border:none;cursor:pointer;font-weight:700;font-size:.85em;
  background:var(--panel2);color:var(--text);transition:all .15s;
}
.cbtn:hover{background:var(--hover);}
.cbtn.stop{background:rgba(251,113,133,.2);color:var(--pink);}
/* 回到最上面 */
.fab{
  position:fixed;right:22px;bottom:78px;z-index:35;
  width:46px;height:46px;border:none;border-radius:50%;cursor:pointer;
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:#0f172a;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 18px rgba(15,23,42,.45);
  opacity:0;visibility:hidden;transform:translateY(10px);
  transition:opacity .25s,transform .25s,visibility .25s,box-shadow .15s;
}
.fab.show{opacity:1;visibility:visible;transform:translateY(0);}
.fab:hover{box-shadow:0 8px 22px rgba(56,189,248,.5);}
.fab:active{transform:scale(.92);}
.fab svg{width:20px;height:20px;fill:currentColor;}
/* 進度 */
.progress-hint{font-size:.8em;color:var(--muted);text-align:center;padding:4px;}
/* 手機 */
@media(max-width:820px){
  .sidebar{padding:8px 10px;gap:5px;}
  .unit-btn{padding:6px 11px;font-size:.75em;gap:6px;}
  .main{padding:18px 16px 40px;}
  .unit-head h2{font-size:1.4em;}
  .jp-text{font-size:1.05em;}
  .controls{gap:10px;padding:10px;}
  .fab{right:14px;bottom:70px;width:42px;height:42px;}
  .speed input{width:90px;}
}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--panel2);border-radius:4px;}
::-webkit-scrollbar-thumb:hover{background:var(--accent2);}
</style>
</head>
<body>
<div class="wrap">
  <div class="layout">
    <nav class="sidebar" id="sidebar"><div class="side-title">單元目錄</div></nav>
    <main class="main" id="main"></main>
  </div>
  <div class="controls">
    <div class="speed">
      <span>語速</span>
      <input type="range" id="speed" min="0.5" max="1.2" step="0.05" value="0.8">
      <span class="val" id="speedVal">0.8x</span>
    </div>
    <button class="cbtn stop" id="stopBtn">⏹ 停止</button>
  </div>
</div>

<button class="fab" id="toTop" aria-label="回到最上面" title="回到最上面">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4l-8 8h5v8h6v-8h5z"/></svg>
</button>

<script>
const DATA = {"1":{"title":"問候","jp_title":"あいさつ","theme":"日常問候與禮儀用語","scenes":[{"name":"互相碰面時","lines":[["A","やあ、陽子。元気？","Yaa, Yōko. Genki?","嗨！陽子，你好嗎？","▸ <b>句型</b>：【名詞＋の省略疑問】「元気（げんき）？」是「元気ですか」刪掉「です・か」的常體疑問。<br>▸ <b>變化</b>：元気（げんき）です（丁寧）→ 元気だ（常體斷定）→ 元気？（口語，斷定「だ」也省略）。<br>▸ <b>用法</b>：日語常體疑問句<b>不用か</b>，靠句尾升調表示問句；「やあ」是男性間的隨性招呼。<br>▸ <b>比較</b>：元気（げんき）ですか（對長輩・初識）／元気？（同輩・熟人）／お元気ですか（久違重逢的禮貌問法）。<br><span class=\"n4\">N4 常體與丁寧體的轉換是必考</span>"],["B","元気よ。あなたは？","Genki yo. Anata wa?","我很好，你呢？","▸ <b>句型</b>：【終助詞よ】告知對方新資訊；【〜は？】省略述語的反問。<br>▸ <b>變化</b>：元気（げんき）です → 元気だ → 元気（＋よ）。女性常體斷定時多省略「だ」直接加「よ」。<br>▸ <b>用法</b>：「あなたは？」後面的「元気（げんき）ですか」被省略，靠助詞<b>は</b>提示話題就能成句。<br>▸ <b>比較</b>：よ（告知對方不知道的事）／ね（尋求同意）／よね（自己認為是這樣，再確認）。<br><span class=\"n4\">N4 聽解常考終助詞辨義</span>"],["A","絶好調さ。","Zekkōchō sa.","再好不過了！","▸ <b>句型</b>：【名詞＋さ】男性用的隨性斷定。<br>▸ <b>變化</b>：絶好調（ぜっこうちょう）です → 絶好調だ → 絶好調さ。<br>▸ <b>用法</b>：「絶好調（ぜっこうちょう）」＝狀況好到極點，比「元気（げんき）」更強。「さ」語氣輕鬆、略帶自得。<br>▸ <b>比較</b>：さ（男性・隨性）／よ（男女皆可・告知）／ぜ・ぞ（男性・更粗獷）。<br><span class=\"n4\">N4 讀解會用終助詞判斷說話者性別與關係</span>"]]},{"name":"早上問候","lines":[["A","おはよう、紀之。","Ohayō, Noriyuki.","早啊，紀之。","▸ <b>句型</b>：【招呼語的常體化】おはようございます → おはよう。<br>▸ <b>變化</b>：「ございます」是「ある」的丁寧語，刪掉後就成為常體。<br>▸ <b>用法</b>：只對平輩、晚輩、家人使用；對上司、客戶必須保留「ございます」。<br>▸ <b>比較</b>：おはようございます（正式）／おはよう（親近）／おっす（男性學生間的極隨性用法）。<br><span class=\"n4\">N4 會考敬語與常體的適用對象</span>"],["B","やあ、いい日だね。","Yaa, ii hi da ne.","哈囉，天氣真好啊！不是嗎？","▸ <b>句型</b>：【名詞句＋ね】い形容詞修飾名詞後直接當述語。<br>▸ <b>變化</b>：いい日（ひ）です → いい日だ → いい日だね。名詞句的常體斷定<b>要保留だ</b>，不可說「×いい日ね」（女性用語除外）。<br>▸ <b>用法</b>：<b>ね</b>邀請對方共鳴，用於雙方都能觀察到的事（天氣、氣氛）。<br>▸ <b>比較</b>：いい日（ひ）だね（常體）／いい日ですね（丁寧）／天気（てんき）がいいですね（把「天氣」當主語的說法）。<br><span class=\"n4\">N4 必考：名詞＋だ＋ね／な形容詞＋だ＋ね</span>"],["A","本当だね。","Hontō da ne.","是啊！","▸ <b>句型</b>：【名詞＋だね】附和對方的固定說法。<br>▸ <b>變化</b>：本当（ほんとう）です → 本当だ → 本当だね。<br>▸ <b>用法</b>：「本当（ほんとう）」是名詞，也可當な形容詞（本当の話（はなし））。附和時常單說「本当だね／確（たし）かに」。<br>▸ <b>比較</b>：本当（ほんとう）だね（我也這麼覺得）／本当？（真的嗎，表懷疑）／本当に？（更強的驚訝）。<br><span class=\"n4\">同一個詞靠語調與句尾改變功能，是聽解陷阱</span>"]]},{"name":"詢問近況","lines":[["A","元気？","Genki?","過得如何？","▸ <b>句型</b>：【省略疑問】「元気（げんき）ですか」→「元気？」。<br>▸ <b>變化</b>：丁寧形去掉「ですか」，只剩な形容詞語幹＋升調。<br>▸ <b>用法</b>：這是日常最短的問候形式，僅限熟人；商務場合必須說「お元気（げんき）ですか」。<br>▸ <b>比較</b>：元気（げんき）？（現在的狀態）／元気だった？（過去到現在的狀況）／どう？（更廣泛地問近況）。<br><span class=\"n4\">N4 會考な形容詞的活用（元気だ／元気な／元気に）</span>"],["B","うん、ありがとう。君は？","Un, arigatō. Kimi wa?","很好，謝謝。你呢？","▸ <b>句型</b>：【うん＝はい的常體】＋【〜は？】反問。<br>▸ <b>變化</b>：はい → うん（肯定）；いいえ → いや・ううん（否定）。<br>▸ <b>用法</b>：「君（きみ）」是男性對平輩、晚輩的稱呼，比「あなた」親近但不宜對上位者使用。<br>▸ <b>比較</b>：あなた（正式但帶距離，夫妻間也用）／君（きみ）（男性對下・對平輩）／お前（まえ）（極親近或粗魯）。日語其實最常<b>直接叫名字</b>。<br><span class=\"n4\">N4 需掌握人稱代名詞的使用限制</span>"],["A","元気だよ。","Genki da yo.","我很好。","▸ <b>句型</b>：【な形容詞＋だよ】常體斷定＋告知。<br>▸ <b>變化</b>：元気（げんき）です → 元気だ → 元気だよ。な形容詞常體<b>必須有だ</b>。<br>▸ <b>用法</b>：「よ」表示「這是我要告訴你的資訊」，回答對方的關心。<br>▸ <b>比較</b>：元気（げんき）だよ（男女皆可）／元気よ（女性，省略だ）／元気です（丁寧）。<br><span class=\"n4\">N4 必考：な形容詞常體「だ」的有無</span>"]]},{"name":"詢問近況（普通）","lines":[["A","調子はどうだい？","Chōshi wa dō dai?","過得如何？","▸ <b>句型</b>：【名詞＋は＋どう】＋【〜だい】男性用常體疑問。<br>▸ <b>變化</b>：どうですか → どうだ → どうだい。接名詞・な形容詞時用<b>だい</b>，接動詞・い形容詞時用<b>かい</b>（例：行（い）くかい）。<br>▸ <b>用法</b>：「調子（ちょうし）」＝狀況、身體或事情的進展；「調子はどう？」是萬用的問近況句。<br>▸ <b>比較</b>：どうだい（男性・略帶年長感）／どう？（男女皆可）／いかがですか（敬語）。<br><span class=\"n4\">N4 讀解常見「かい／だい」的男性語體</span>"],["B","まあまあだよ。君は？","Maa maa da yo. Kimi wa?","普普通通啦！你呢？","▸ <b>句型</b>：【副詞的名詞化＋だよ】。<br>▸ <b>變化</b>：まあまあです → まあまあだ → まあまあだよ。<br>▸ <b>用法</b>：「まあまあ」原為副詞（還算…），這裡當名詞用作述語，是回答近況的模糊表達。<br>▸ <b>比較</b>：まあまあ（普普通通）／なんとか（勉強過得去）／ぼちぼち（關西腔的「還可以」）。<br><span class=\"n4\">N4 會考副詞當述語使用時是否加だ</span>"],["A","まあまあさ。","Maa maa sa.","還可以啦。","▸ <b>句型</b>：【名詞＋さ】男性隨性斷定。<br>▸ <b>變化</b>：まあまあだ → まあまあさ（「だ」被「さ」取代）。<br>▸ <b>用法</b>：「さ」帶有「就這樣、無所謂」的語感，與前句的「だい」呼應，形成男性間的對話節奏。<br>▸ <b>比較</b>：〜さ（斷定・隨性）／〜さあ（拉長音，帶不耐煩）。<br><span class=\"n4\">終助詞的語感差異是 N4 聽解重點</span>"]]},{"name":"晚上問候","lines":[["A","こんばんは、久美子。","Konbanwa, Kumiko.","晚安！久美子。","▸ <b>句型</b>：【時段招呼語】こんばんは。<br>▸ <b>變化</b>：原句是「今晩（こんばん）は良（よ）い晩（ばん）ですね」，只留下主題部分，所以句尾的<b>は讀作 wa</b>（不是 ha）。<br>▸ <b>用法</b>：日落後使用；白天用「こんにちは」，早上用「おはよう」。<br>▸ <b>比較</b>：こんばんは（見面時）／おやすみなさい（睡前或夜晚道別）——中文都是「晚安」，日語<b>絕不可混用</b>。<br><span class=\"n4\">N4 必考：こんばんは／おやすみなさい 的區別</span>"],["B","こんばんは、莉莉。きれいなドレスね。","Konbanwa, Riri. Kirei na doresu ne.","晚安，莉莉。你的晚禮服好漂亮。","▸ <b>句型</b>：【な形容詞＋な＋名詞】連體修飾。<br>▸ <b>變化</b>：きれいだ（述語）→ きれい<b>な</b>ドレス（修飾名詞）。注意「きれい」雖以「い」結尾，卻是<b>な形容詞</b>。<br>▸ <b>用法</b>：句尾「ね」表感嘆與徵求同意，讚美對方時使用比單說「きれいです」更自然。<br>▸ <b>比較</b>：きれいなドレス（な形容詞）／新（あたら）しいドレス（い形容詞直接接名詞，不加な）。<br><span class=\"n4\">N4 必考陷阱：きれい・嫌（きら）い・有名（ゆうめい）都是な形容詞</span>"],["A","ありがとう。","Arigatō.","謝謝。","▸ <b>句型</b>：【道謝語的常體】ありがとうございます → ありがとう。<br>▸ <b>變化</b>：「ありがとう」原是形容詞「有（あ）り難（がた）い（難得的）」的連用形。<br>▸ <b>用法</b>：對平輩以下使用；接受讚美時回一句「ありがとう」即可，日語不需否認式的謙虛。<br>▸ <b>比較</b>：ありがとうございます（現在・一般）／ありがとうございました（事情已結束）／どうも（極隨性）。<br><span class=\"n4\">N4 會考「ございます／ございました」的時態差異</span>"]]},{"name":"久別重逢","lines":[["A","会えてうれしいよ、健一郎。","Aete ureshii yo, Kenichirō.","健一郎，見到你真高興。","▸ <b>句型</b>：【可能形＋て＋感情形容詞】表原因。<br>▸ <b>變化</b>：会（あ）う → 可能形<b>会（あ）える</b>（う段→え段＋る）→ て形<b>会えて</b>。<br>▸ <b>用法</b>：て形在此表<b>原因</b>（因為能見到你），後接うれしい・悲（かな）しい・残念（ざんねん）等情緒形容詞是固定搭配。<br>▸ <b>比較</b>：会（あ）えてうれしい（能見到你，很高興）／会いたい（想見你）／会えなくて残念（ざんねん）（見不到，很遺憾）。<br><span class=\"n4\">N4 必考：可能形變化與「〜て＋感情」的因果用法</span>"],["B","久しぶりだね。","Hisashiburi da ne.","好久不見了。","▸ <b>句型</b>：【名詞＋だね】久違寒暄。<br>▸ <b>變化</b>：久（ひさ）しぶりです → 久しぶりだ → 久しぶりだね。禮貌形加お：<b>お</b>久しぶりです。<br>▸ <b>用法</b>：「久（ひさ）しぶり」是名詞，指「隔了很久」；也可說「久しぶりに会（あ）った（隔了很久才見面）」，此時用<b>に</b>當副詞。<br>▸ <b>比較</b>：久（ひさ）しぶりだね（熟人）／お久しぶりです（禮貌）／ご無沙汰（ぶさた）しております（商務最正式）。<br><span class=\"n4\">N4 會考「久しぶりに＋動詞」的副詞用法</span>"],["A","どうしてた？","Dō shiteta?","過得如何？","▸ <b>句型</b>：【〜ていた（過去進行・持續）】的口語縮約。<br>▸ <b>變化</b>：どうしていましたか → どうしていた → <b>どうしてた</b>（「い」脫落）→ ？（升調）。<br>▸ <b>用法</b>：問對方「這段時間過得如何」，focus 在<b>從過去到現在的一段時間</b>，所以不用「どうする？」。<br>▸ <b>比較</b>：〜ていた → 〜てた／〜ている → 〜てる。這種<b>い脫落</b>是口語與聽解的關鍵。<br><span class=\"n4\">N4 聽解必考：てる・てた 的縮約還原</span>"],["B","元気だったよ。","Genki datta yo.","我很好。","▸ <b>句型</b>：【な形容詞的常體過去】。<br>▸ <b>變化</b>：元気（げんき）です → 元気でした（丁寧過去）→ 元気だった（常體過去）→ ＋よ。<br>▸ <b>用法</b>：回答「どうしてた？」時要用<b>過去式</b>對應，因為問的是這段時間的狀況。<br>▸ <b>比較</b>：元気（げんき）だった（過去一直很好）／元気だよ（現在很好）。名詞・な形容詞過去＝<b>だった</b>；い形容詞過去＝<b>かった</b>。<br><span class=\"n4\">N4 必考：三類詞的過去式變化</span>"]]},{"name":"道別（1）","lines":[["A","さようなら。","Sayōnara.","再見。","▸ <b>句型</b>：【道別的固定語】さようなら。<br>▸ <b>變化</b>：原為「左様（さよう）ならば（若是那樣的話）」，是接續詞演變成的招呼語。<br>▸ <b>用法</b>：帶有<b>較長時間不會再見</b>的語感，日本人日常反而少用；學校裡學生對老師則常用。<br>▸ <b>比較</b>：さようなら（正式・長別）／じゃあね・またね（日常）／失礼（しつれい）します（離開職場、上位者面前）。<br><span class=\"n4\">N4 會考商務場合該用「失礼します」而非「さようなら」</span>"],["B","またね。","Mata ne.","改天見。","▸ <b>句型</b>：【意向形句的省略】。<br>▸ <b>變化</b>：また会（あ）おうね（下次再見面吧）→ 省略動詞 → <b>またね</b>。<br>▸ <b>用法</b>：「また」＝再次，後面的動詞省略是口語常態；「ね」讓語氣柔和。<br>▸ <b>比較</b>：またね（不指定時間）／また明日（あした）（明天見）／また来週（らいしゅう）（下週見）——後面都省略了「会（あ）いましょう」。<br><span class=\"n4\">N4 讀解需能補回省略的述語</span>"]]},{"name":"道別（2）","lines":[["A","じゃあね。火曜日にまた。","Jā ne. Kayōbi ni mata.","拜拜！星期二見。","▸ <b>句型</b>：【では的口語縮約】＋【時間點＋に】。<br>▸ <b>變化</b>：では → <b>じゃ</b> → じゃあ（拉長更隨性）；ではありません → じゃありません 同理。<br>▸ <b>用法</b>：「火曜日（かようび）<b>に</b>また」——星期、日期、時刻等<b>時間點</b>用に；「今日（きょう）・明日（あした）・毎日（まいにち）」等則<b>不加に</b>。<br>▸ <b>比較</b>：火曜日（かようび）に（○）／明日（あした）に（×，應說「明日」）／来週（らいしゅう）に（×，應說「来週」）。<br><span class=\"n4\">N4 必考：時間名詞何時加に</span>"],["B","うん。元気でね。","Un. Genki de ne.","好，要保重喔。","▸ <b>句型</b>：【な形容詞的て形】表狀態。<br>▸ <b>變化</b>：元気（げんき）だ → 元気<b>で</b>（な形容詞て形）＋ね。い形容詞則是「〜くて」（例：早（はや）くて）。<br>▸ <b>用法</b>：「元気（げんき）でね」＝請保持健康的狀態，後面省略了「いてね（請保持著）」。<br>▸ <b>比較</b>：元気（げんき）で（な形容詞て形）／楽（たの）しくて（い形容詞て形）／学生（がくせい）で（名詞て形）。<br><span class=\"n4\">N4 必考：三類詞的て形變化</span>"]]},{"name":"道別（3）","lines":[["A","ええと、もう行かなくては。","Ēto, mō ikanakute wa.","呃，我該走了。","▸ <b>句型</b>：【〜なくてはいけない】表義務「非做不可」，此處省略後半。<br>▸ <b>變化</b>：行（い）く → ない形<b>行かない</b> → 去「い」＋くては → <b>行かなくては</b>（いけない省略）。<br>▸ <b>用法</b>：「ええと」是想事情時的填補詞；「もう」＝差不多該。省略「いけない」讓語氣較軟，也是口語常態。<br>▸ <b>比較</b>：なくてはいけない（一般規範）／なければならない（書面・正式）／なくちゃ（口語縮約）／ないといけない（口語）。<br><span class=\"n4\">N4 必考：義務句型四種說法的互換</span>"],["B","ああそう。じゃあね。","Ā sō. Jā ne.","啊這樣。那再見。","▸ <b>句型</b>：【感嘆詞＋そう】表理解。<br>▸ <b>變化</b>：ああ、そうですか → ああそう（常體）。<br>▸ <b>用法</b>：「そう」代替對方剛說的內容，避免重複；降調表接受，升調則變成半信半疑。<br>▸ <b>比較</b>：ああそう（略顯冷淡）／そうなんだ（感興趣）／そうですか（丁寧）。語調不同給對方的感受差很多。<br><span class=\"n4\">N4 聽解常考應答詞的語氣</span>"],["A","さようなら。元気でね。","Sayōnara. Genki de ne.","再見。要保重。","▸ <b>句型</b>：【道別＋な形容詞て形的叮嚀】。<br>▸ <b>變化</b>：元気（げんき）でいてください → 元気でね（省略「いてください」）。<br>▸ <b>用法</b>：兩句連用是完整的道別組合：先說再見，再叮嚀對方保重。<br>▸ <b>比較</b>：元気（げんき）でね（保重）／気（き）をつけて（路上小心）／お大事（だいじ）に（對病人說的保重）。<br><span class=\"n4\">N4 必考：お大事に 只用於身體不適的人</span>"]]},{"name":"道別（4）","lines":[["A","ああ、もうこんな時間だ！もう行かなくては。","Ā, mō konna jikan da! Mō ikanakute wa.","哎呀！這麼晚了。我該走了。","▸ <b>句型</b>：【こんな＋名詞】＋【感嘆的だ】＋【義務句型】。<br>▸ <b>變化</b>：こんな（這樣的）→ そんな（那樣的）→ あんな（那種）；「こんな時間（じかん）だ」的<b>だ</b>是常體斷定，不可省略。<br>▸ <b>用法</b>：「もうこんな時間（じかん）」＝已經這麼晚了，是發現時間超過預期的固定講法。<br>▸ <b>比較</b>：こんな（＋名詞）／こう（＋動詞・形容詞）／こんなに（＋程度）。三者接續對象不同。<br><span class=\"n4\">N4 必考：こんな／こう／こんなに 的接續</span>"],["B","お話できてたのしかったです。元気でね。","Ohanashi dekite tanoshikatta desu. Genki de ne.","跟你聊天真是愉快。要保重啊。","▸ <b>句型</b>：【お＋動詞ます形＋できる】謙讓可能形＋【い形容詞過去式】。<br>▸ <b>變化</b>：話（はな）す → お話（はなし）しする（謙讓）→ <b>お話しできる</b>（謙讓可能）→ お話しできて（て形表原因）；楽（たの）しい → <b>楽しかった</b>です。<br>▸ <b>用法</b>：「お〜する」是<b>自己</b>的動作降格的謙讓語，用於對上位者；聊天結束時的固定客套。<br>▸ <b>比較</b>：お話（はなし）しできて（謙讓）／話（はな）せて（一般可能形）／お話しになる（尊敬語，指對方說話）。<br><span class=\"n4\">N4 必考：謙讓語「お〜する」與尊敬語「お〜になる」不可混用</span>"],["A","おやすみなさい。また会いましょう。","Oyasuminasai. Mata aimashō.","晚安。改天再見囉！","▸ <b>句型</b>：【ます形＋ましょう】意向・提議。<br>▸ <b>變化</b>：会（あ）う → 会います → 会い<b>ましょう</b>（我們一起…吧）；常體則是意向形「会おう」。<br>▸ <b>用法</b>：「おやすみなさい」用於睡前或夜晚道別，不可用於見面時。<br>▸ <b>比較</b>：会（あ）いましょう（提議一起做）／会いましょうか（詢問對方意願）／会いませんか（更客氣的邀約）。<br><span class=\"n4\">N4 必考：ましょう／ましょうか／ませんか 的差別</span>"]]},{"name":"道別（5）","lines":[["A","よい週末を。","Yoi shūmatsu wo.","週末愉快！","▸ <b>句型</b>：【〜を（＋動詞省略）】的祝福語。<br>▸ <b>變化</b>：よい週末（しゅうまつ）をお過（す）ごしください → 省略動詞 → <b>よい週末を</b>。助詞を後直接結束是祝福語的固定形式。<br>▸ <b>用法</b>：週五道別時使用；「よい」是「いい」的書面・正式形。<br>▸ <b>比較</b>：よい週末（しゅうまつ）を（週末愉快）／よい一日（いちにち）を（祝你有美好的一天）／お気（き）をつけて（路上小心）。<br><span class=\"n4\">N4 讀解需辨識助詞結尾的省略句</span>"],["B","ありがとう。君もね。","Arigatō. Kimi mo ne.","謝謝。你也一樣。","▸ <b>句型</b>：【も】表同樣＋省略述語。<br>▸ <b>變化</b>：君（きみ）もよい週末（しゅうまつ）を → 省略 → <b>君もね</b>。<br>▸ <b>用法</b>：助詞<b>も</b>會取代が・を（例：私（わたし）が→私も、パンを→パンも），但に・で等則是疊加（にも・でも）。<br>▸ <b>比較</b>：君（きみ）も（你也）／君は？（你呢，反問）。前者回敬同樣的話，後者是拋回問題。<br><span class=\"n4\">N4 必考：も 取代が・を 的規則</span>"],["A","紀之によろしく。","Noriyuki ni yoroshiku.","代我向紀之問好。","▸ <b>句型</b>：【〜によろしく】轉達問候，省略動詞。<br>▸ <b>變化</b>：紀之（のりゆき）によろしく伝（つた）えてください → 省略後半 → <b>紀之によろしく</b>。<br>▸ <b>用法</b>：轉達的<b>對象用に</b>；完整說法是「〜によろしくお伝（つた）えください」（敬語）。<br>▸ <b>比較</b>：〜によろしく（熟人）／〜によろしくお伝（つた）えください（禮貌）／よろしくお願（ねが）いします（初次見面或請託時，語意完全不同）。<br><span class=\"n4\">N4 必考：對象助詞に 與 よろしく 的多種用法</span>"],["B","オーケー。わかった。","Ōkē. Wakatta.","好，沒問題。","▸ <b>句型</b>：【動詞過去式表理解成立】。<br>▸ <b>變化</b>：わかる → <b>わかった</b>（常體過去）／わかりました（丁寧過去）。<br>▸ <b>用法</b>：日語用<b>過去式</b>表達「（現在）我明白了」，因為理解在說話的瞬間已完成。說「×わかります」會顯得不自然。<br>▸ <b>比較</b>：わかった（熟人）／わかりました（一般）／承知（しょうち）しました・かしこまりました（商務・服務業）。<br><span class=\"n4\">N4 必考：わかりました 的時態邏輯</span>"]]},{"name":"初次見面（1）","lines":[["A","こんにちは。私の名前は渡辺春男です。","Konnichiwa. Watashi no namae wa Watanabe Haruo desu.","你好，我叫渡邊春男。","▸ <b>句型</b>：【AのB】所屬＋【AはBです】名詞句。<br>▸ <b>變化</b>：私（わたし）＋の＋名前（なまえ）（我的名字）；「です」是斷定助動詞的丁寧形，常體為「だ」。<br>▸ <b>用法</b>：<b>は</b>提示主題（至於我的名字…），<b>が</b>則用於提供新資訊；自我介紹用は。<br>▸ <b>比較</b>：私（わたし）の名前（なまえ）は〜です（較正式・完整）／私は〜です（日常最常用）／〜と申（もう）します（謙讓語，商務場合）。<br><span class=\"n4\">N4 必考：は 與 が 的基本分工</span>"],["B","こんにちは。私は陳淑恵です。","Konnichiwa. Watashi wa Chin Shukukei desu.","你好，我叫陳淑惠。","▸ <b>句型</b>：【AはBです】最基本的名詞句。<br>▸ <b>變化</b>：肯定 〜です／否定 〜ではありません（口語 じゃありません）／過去 〜でした。<br>▸ <b>用法</b>：「私（わたし）は陳淑恵（ちんしゅくけい）です」比「私の名前（なまえ）は…」簡潔，日常自我介紹的首選。<br>▸ <b>比較</b>：〜です（丁寧）／〜だ（常體）／〜でございます（最鄭重，服務業使用）。<br><span class=\"n4\">N4 必考：名詞句的四種活用（肯定・否定・過去・過去否定）</span>"],["A","はじめまして。","Hajimemashite.","初次見面。","▸ <b>句型</b>：【初次見面的固定招呼】。<br>▸ <b>變化</b>：由「初（はじ）めてお目（め）にかかります」演變而來，現已固定為一個詞，正式場合寫作<b>初めまして</b>。<br>▸ <b>用法</b>：只在<b>第一次見面</b>使用，第二次見面說「こんにちは」。後面通常接姓名與「よろしくお願（ねが）いします」。<br>▸ <b>比較</b>：はじめまして（初次）／お久（ひさ）しぶりです（久違）／いつもお世話（せわ）になっております（商務常用的開場）。<br><span class=\"n4\">N4 會考初次見面的完整流程</span>"],["B","お会いできてうれしいです。","Oai dekite ureshii desu.","很高興認識你。","▸ <b>句型</b>：【お＋ます形＋できる】謙讓可能形＋【て形表原因】。<br>▸ <b>變化</b>：会（あ）う → お会いする（謙讓）→ <b>お会いできる</b> → お会いできて＋うれしいです。<br>▸ <b>用法</b>：把自己的動作降格以抬高對方，是商務初次見面的標準句。也可說「お目（め）にかかれて光栄（こうえい）です」（更鄭重）。<br>▸ <b>比較</b>：お会（あ）いできてうれしいです（禮貌）／会えてうれしいです（一般）／会えて嬉（うれ）しい（常體）。<br><span class=\"n4\">N4 必考：お〜できる 的謙讓可能形</span>"]]},{"name":"初次見面（2）","lines":[["A","私の名前は小林君枝です。","Watashi no namae wa Kobayashi Kimie desu.","我叫小林君枝。","▸ <b>句型</b>：【私の名前は〜です】。<br>▸ <b>變化</b>：私（わたし）→ 私の（の表所屬）→ 私の名前（なまえ）（名詞組）→ ＋は＋です。<br>▸ <b>用法</b>：正式場合或需要清楚交代姓名時使用；商務更常說「〜と申（もう）します」。<br>▸ <b>比較</b>：私（わたし）の名前（なまえ）は小林君枝（こばやしきみえ）です（完整）／小林（こばやし）です（只說姓，日本人日常最常用）／小林君枝と申（もう）します（謙讓）。<br><span class=\"n4\">日本人自我介紹通常只說姓氏，這是文化題常考點</span>"],["B","お会いできてうれしいです。私は王莉莉です。","Oai dekite ureshii desu. Watashi wa Ō Riri desu.","很高興認識你。我叫王莉莉。","▸ <b>句型</b>：【客套語＋自我介紹】的語序。<br>▸ <b>變化</b>：お会（あ）いできて（謙讓可能形て形）＋うれしいです（い形容詞述語）。<br>▸ <b>用法</b>：日語習慣<b>先回應對方、再說自己</b>，所以「お会（あ）いできてうれしいです」放在報姓名之前。<br>▸ <b>比較</b>：うれしいです（自己的情緒，不可用於描述他人）／彼（かれ）はうれしそうです（描述他人要加「そう」）。<br><span class=\"n4\">N4 必考：感情形容詞不可直接用於第三人稱</span>"],["A","お会いできてうれしいです。","Oai dekite ureshii desu.","很高興認識你。","▸ <b>句型</b>：【對等回應】重複同一句表示同樣的敬意。<br>▸ <b>變化</b>：お会（あ）いできて（謙讓）＋うれしいです。<br>▸ <b>用法</b>：對方說了這句，回以相同句子即可；也可用「こちらこそ」（我才是）加強。<br>▸ <b>比較</b>：お会（あ）いできてうれしいです（重複回應）／こちらこそ（我才該這麼說）／光栄（こうえい）です（對地位更高者）。<br><span class=\"n4\">N4 會考「こちらこそ」的使用場合</span>"]]},{"name":"初次見面（3）","lines":[["A","こんにちは、ぼくの名前は張建邦です。","Konnichiwa, boku no namae wa Chō Kenpō desu.","你好，我叫張建邦。","▸ <b>句型</b>：【第一人稱的選擇】＋【AのBは〜です】。<br>▸ <b>變化</b>：私（わたし）（正式・男女）→ <b>ぼく</b>（男性・隨性）→ おれ（男性・更隨性）。<br>▸ <b>用法</b>：「ぼく」用於平輩或非正式場合，商務面談仍應用「私（わたし）」。<br>▸ <b>比較</b>：わたし（正式）／わたくし（最正式）／ぼく（男性・輕鬆）／おれ（男性・親密或粗獷）。<br><span class=\"n4\">N4 必考：人稱代名詞的正式度階梯</span>"],["B","こんにちは。私は木村春子です。","Konnichiwa. Watashi wa Kimura Haruko desu.","你好，我叫木村春子。","▸ <b>句型</b>：【招呼＋私は〜です】。<br>▸ <b>變化</b>：「こんにちは」的句尾<b>は讀作 wa</b>，因為原本是主題助詞。<br>▸ <b>用法</b>：「私（わたし）」男女皆可、任何場合都安全，是最保險的選擇。<br>▸ <b>比較</b>：こんにちは（白天）／おはよう（早上）／こんばんは（晚上）。三者依時段固定，不可混用。<br><span class=\"n4\">N4 會考招呼語的時段對應</span>"],["A","会えてうれしいです。","Aete ureshii desu.","很高興認識你。","▸ <b>句型</b>：【可能形＋て＋うれしい】。<br>▸ <b>變化</b>：会（あ）う → 会える（可能形）→ 会えて（て形）。<br>▸ <b>用法</b>：比「お会（あ）いできて」隨意，適合平輩之間；語氣仍然禮貌（因為句尾是です）。<br>▸ <b>比較</b>：会（あ）えてうれしいです（平輩・禮貌）／お会いできてうれしいです（上位者）／会えて嬉（うれ）しい（常體・熟人）。<br><span class=\"n4\">N4 必考：可能形（会える／読（よ）める／来（こ）られる）的三類變化</span>"]]},{"name":"初次見面（4）","lines":[["A","井上が姓です。井上俊成です。","Inoue ga sei desu. Inoue Toshinari desu.","我姓井上。井上俊成。","▸ <b>句型</b>：【AがBです】用が提示新資訊。<br>▸ <b>變化</b>：井上（いのうえ）<b>が</b>姓（せい）です（強調哪個才是姓）；若用は則變成「至於井上，他是姓」，語意不同。<br>▸ <b>用法</b>：對方可能搞不清哪個是姓、哪個是名時，用<b>が</b>特別指定。<br>▸ <b>比較</b>：井上（いのうえ）が姓（せい）です（強調・回答「哪個是姓」）／私（わたし）の姓は井上です（單純陳述）。<br><span class=\"n4\">N4 必考：が 用於回答疑問詞、提供新資訊</span>"],["B","初めまして。李大成です。","Hajimemashite. Ri Taisei desu.","初次見面。我叫李大成。","▸ <b>句型</b>：【初めまして＋名詞句】。<br>▸ <b>變化</b>：初（はじ）めまして（固定語）＋李大成（りたいせい）です（AはBです的A省略）。<br>▸ <b>用法</b>：日語在主語明確時<b>大量省略「私（わたし）は」</b>，只說「李大成です」完全自然。<br>▸ <b>比較</b>：私（わたし）は李大成（りたいせい）です（完整）／李大成です（自然）／李と申（もう）します（謙讓・商務）。<br><span class=\"n4\">N4 讀解需習慣主語省略</span>"],["A","李さん、お会いできてうれしいです。","Ri-san, oai dekite ureshii desu.","李先生，很高興認識你。","▸ <b>句型</b>：【姓＋さん的呼稱】＋【謙讓可能形】。<br>▸ <b>變化</b>：李（り）→ 李<b>さん</b>（對他人）；自己絕不加さん。<br>▸ <b>用法</b>：先叫對方名字再表達感想，比直接說客套話更顯誠意；商務可用「李様（りさま）」。<br>▸ <b>比較</b>：さん（一般）／様（さま）（書信・客戶）／君（くん）（對下屬・男性晚輩）／ちゃん（小孩・親密）。<br><span class=\"n4\">N4 必考：稱謂不可用於自己</span>"]]},{"name":"初次見面（5）","lines":[["A","莉莉、お会いできてよかったわ。","Riri, oai dekite yokatta wa.","莉莉，能認識你真好。","▸ <b>句型</b>：【て形＋よかった】表慶幸＋【女性終助詞わ】。<br>▸ <b>變化</b>：いい → <b>よかった</b>（不規則：いい的過去式不是「×いかった」）；お会（あ）いできて＋よかった＝很慶幸能認識你。<br>▸ <b>用法</b>：「〜てよかった」表對已發生的事感到慶幸，是很實用的句型；「わ」為女性語氣。<br>▸ <b>比較</b>：〜てよかった（慶幸做了）／〜ばよかった（後悔沒做）。兩者<b>意思相反</b>，是常見陷阱。<br><span class=\"n4\">N4 必考：〜てよかった／〜ばよかった</span>"],["B","きみえ、たのしかったわ。","Kimie, tanoshikatta wa.","君枝，很愉快。","▸ <b>句型</b>：【い形容詞過去式＋わ】。<br>▸ <b>變化</b>：楽（たの）しい → 去い＋かった → <b>楽しかった</b>（＋です為丁寧形）。<br>▸ <b>用法</b>：回顧剛結束的活動用過去式；「わ」是女性用終助詞，柔和地表達感想。<br>▸ <b>比較</b>：楽（たの）しかった（過去的體驗）／楽しい（現在正開心）／楽しみ（名詞，期待）。三者常被混用。<br><span class=\"n4\">N4 必考：い形容詞過去式（〜かった）</span>"],["A","また会いましょう。","Mata aimashō.","改天再見。","▸ <b>句型</b>：【ます形＋ましょう】提議。<br>▸ <b>變化</b>：会（あ）う → 会います → 会いましょう；常體為「会おう」（う段→お段＋う）。<br>▸ <b>用法</b>：「また会（あ）いましょう」是道別時的固定祝願，不一定真的約定時間。<br>▸ <b>比較</b>：また会（あ）いましょう（提議）／また会いたいです（表達自己的願望）／また会えるといいですね（希望能再見）。<br><span class=\"n4\">N4 必考：ましょう 與意向形「〜（よ）う」的對應</span>"]]}]},"2":{"title":"紹介","jp_title":"しょうかい","theme":"自我介紹和介紹他人","scenes":[{"name":"向朋友介紹他人","lines":[["A","莉莉、こちらは斎藤恵美さんです。私の東京の友達です。","Riri, kochira wa Saitō Emi-san desu. Watashi no Tōkyō no tomodachi desu.","莉莉，這位是齊藤惠美小姐，她是我在東京的朋友。","▸ <b>句型</b>：【こちらは〜です】介紹他人的固定句型。<br>▸ <b>變化</b>：この人（ひと）（一般）→ <b>こちら</b>（禮貌）；「私（わたし）の東京（とうきょう）の友達（ともだち）」是<b>の的連續使用</b>（私の＋東京の＋友達）。<br>▸ <b>用法</b>：介紹時先叫聽者的名字，再用「こちらは」指出被介紹者，最後補充其身分。<br>▸ <b>比較</b>：こちら（禮貌・指人或方向）／この人（ひと）（略顯不敬）／この方（かた）（更禮貌）。<br><span class=\"n4\">N4 必考：の 的連續修飾與 こちら 的敬語用法</span>"],["A","恵美、こちらは王莉莉さん、私の親友です。","Emi, kochira wa Ō Riri-san, watashi no shin'yū desu.","惠美，這位是王莉莉小姐，是我的好友。","▸ <b>句型</b>：【こちらは〜さん、〜です】同位語並列。<br>▸ <b>變化</b>：「王莉莉（おうりり）さん」與「私（わたし）の親友（しんゆう）」指同一人，中間用<b>逗號</b>並列（也可說「〜さんで、私の親友です」用て形連接）。<br>▸ <b>用法</b>：介紹雙方時各說一次「こちらは〜」，是標準的引見流程。<br>▸ <b>比較</b>：親友（しんゆう）（摯友）／友達（ともだち）（朋友）／知（し）り合（あ）い（認識的人）。親疏程度依序遞減。<br><span class=\"n4\">N4 會考名詞句的中止形「〜で、」</span>"],["E","まあ、お会いできてうれしいです。","Maa, oai dekite ureshii desu.","哦！真高興見到你。","▸ <b>句型</b>：【感嘆詞＋謙讓可能形＋感情形容詞】。<br>▸ <b>變化</b>：会（あ）う → お会いする → お会いできる → お会いできて（て形表原因）。<br>▸ <b>用法</b>：「まあ」是<b>女性用</b>的感嘆詞，表驚喜；男性則用「おお」或不加。<br>▸ <b>比較</b>：まあ（女性・驚喜）／あら（女性・輕微意外）／へえ（男女・表意外）。<br><span class=\"n4\">N4 聽解會用感嘆詞判斷說話者</span>"],["R","こちらこそ、恵美さん。","Kochira koso, Emi-san.","我也是，惠美。","▸ <b>句型</b>：【こちらこそ】＋【こそ】強調助詞。<br>▸ <b>變化</b>：こちら（我這邊）＋<b>こそ</b>（才是）＝我才是該這麼說的一方。後面省略了「うれしいです」。<br>▸ <b>用法</b>：對方先說了客套話時使用，表示「我也一樣，而且該由我先說」。<br>▸ <b>比較</b>：こちらこそ（回敬客套）／私（わたし）こそ（強調是我）／今度（こんど）こそ（這次一定要…）。<b>こそ</b>都表「正是」。<br><span class=\"n4\">N4 必考：こそ 的強調用法</span>"]]},{"name":"介紹（正式）","lines":[["A","淑恵、島田靖子さんを紹介します。靖子、こちらは陳淑恵さんです。","Shukukei, Shimada Yasuko-san wo shōkai shimasu. Yasuko, kochira wa Chin Shukukei-san desu.","淑惠，我來介紹島田靖子小姐。靖子，這位是陳淑惠小姐。","▸ <b>句型</b>：【〜を紹介します】＋【こちらは〜です】。<br>▸ <b>變化</b>：紹介（しょうかい）する（漢語＋する動詞）→ 紹介します；謙讓形為<b>ご紹介します</b>（漢語動詞用ご不用お）。<br>▸ <b>用法</b>：被介紹的人用<b>を</b>標示；正式場合說「ご紹介（しょうかい）します」或「ご紹介いたします」。<br>▸ <b>比較</b>：お＋和語動詞（お会（あ）いする・お待（ま）ちする）／ご＋漢語動詞（ご紹介（しょうかい）する・ご説明（せつめい）する）。<br><span class=\"n4\">N4 必考：お／ご 的區分規則</span>"],["S","初めまして。","Hajimemashite.","你好。","▸ <b>句型</b>：【初めまして】的漢字寫法。<br>▸ <b>變化</b>：「初（はじ）めまして」與「はじめまして」相同，正式書面多用漢字。<br>▸ <b>用法</b>：正式場合完整說法是「初（はじ）めまして。〜と申（もう）します。どうぞよろしくお願（ねが）いいたします」三段式。<br>▸ <b>比較</b>：初（はじ）めまして（初次見面）／始（はじ）める（開始，他動詞）。同音<b>不同漢字</b>：初＝第一次，始＝開始。<br><span class=\"n4\">N4 漢字題常考「初／始」的區別</span>"],["K","お会いできてうれしいです。","Oai dekite ureshii desu.","很高興認識你。","▸ <b>句型</b>：【お＋ます形＋できる＋て＋うれしいです】。<br>▸ <b>變化</b>：うれしい（い形容詞）→ うれしいです（丁寧）→ うれしかったです（過去）。<br>▸ <b>用法</b>：商務初次見面的標準回應；「うれしい」只能描述<b>自己</b>的情緒。<br>▸ <b>比較</b>：うれしい（高興・情緒）／楽（たの）しい（愉快・體驗過程）。前者瞬間、後者持續，N4 常考。<br><span class=\"n4\">N4 必考：うれしい／楽しい 的區別</span>"]]},{"name":"介紹（3）","lines":[["A","陽子、蔡美鈴さんを紹介します。美鈴、こちらは村上陽子さんです。","Yōko, Sai Birei-san wo shōkai shimasu. Birei, kochira wa Murakami Yōko-san desu.","陽子，我來跟你介紹蔡美鈴小姐。美鈴，這是村上陽子小姐。","▸ <b>句型</b>：【〜を紹介します】＋【こちらは〜です】的雙向引見。<br>▸ <b>變化</b>：紹介（しょうかい）する → 紹介します（丁寧）→ ご紹介いたします（最鄭重，いたす是する的謙讓語）。<br>▸ <b>用法</b>：順序固定：先對 A 介紹 B（用を），再對 B 介紹 A（用こちらは）。<br>▸ <b>比較</b>：紹介（しょうかい）します（一般）／ご紹介します（禮貌）／ご紹介いたします（商務最正式）。<br><span class=\"n4\">N4 必考：いたします 是 します 的謙讓語</span>"],["Y","お会いできてうれしいです。","Oai dekite ureshii desu.","很高興認識你。","▸ <b>句型</b>：【謙讓可能形＋感情形容詞】。<br>▸ <b>變化</b>：お会（あ）いできて（原因）＋うれしいです（結果）。<br>▸ <b>用法</b>：日語表達「因為A所以情緒B」時，最常用的就是<b>て形</b>，不需要「〜から」。<br>▸ <b>比較</b>：会（あ）えてうれしい（て形表原因，自然）／会えたからうれしい（強調理由，語氣較生硬）。<br><span class=\"n4\">N4 必考：て形表原因的用法</span>"],["S","光栄です。","Kōei desu.","這是我的榮幸。","▸ <b>句型</b>：【名詞＋です】表心情的鄭重說法。<br>▸ <b>變化</b>：光栄（こうえい）だ（常體）→ 光栄です（丁寧）→ 光栄に存（ぞん）じます（最鄭重）。<br>▸ <b>用法</b>：「光栄（こうえい）」是な形容詞，用於<b>對方地位較高</b>時，比「うれしいです」正式得多。<br>▸ <b>比較</b>：光栄（こうえい）です（對上位者）／うれしいです（一般）／ありがたいです（感謝對方的好意）。<br><span class=\"n4\">N4 會考敬語的層級選擇</span>"]]},{"name":"職場（1）","lines":[["A","お名前をうかがえますか？","Onamae wo ukagaemasu ka?","請問貴姓大名？","▸ <b>句型</b>：【謙讓語的可能形＋ますか】最客氣的詢問。<br>▸ <b>變化</b>：聞（き）く → <b>伺（うかが）う</b>（謙讓語）→ 可能形<b>伺える</b>（う段→え段＋る）→ 伺えますか。<br>▸ <b>用法</b>：詢問對方姓名時說「お名前（なまえ）を伺（うかが）えますか」，比「お名前は何（なん）ですか」禮貌許多。<br>▸ <b>比較</b>：伺（うかが）う（謙讓・自己聽或問）／お聞（き）きになる（尊敬・對方聽）／聞く（一般）。<br><span class=\"n4\">N4 必考：伺う 是「聞く・訪ねる」的謙讓語</span>"],["B","李と申します。10時に鈴木さんと約束があります。","Ri to mōshimasu. Jū-ji ni Suzuki-san to yakusoku ga arimasu.","敝姓李。我和鈴木先生在10點有約。","▸ <b>句型</b>：【〜と申します】謙讓自我介紹＋【〜と約束があります】。<br>▸ <b>變化</b>：言（い）う → <b>申（もう）す</b>（謙讓語）→ 申します；「李（り）と申します」的<b>と</b>是引用助詞。<br>▸ <b>用法</b>：約定（約束（やくそく））的對象用<b>と</b>（互相的動作）；時間點用<b>に</b>（10時（じ）に）。<br>▸ <b>比較</b>：申（もう）します（謙讓・自己）／おっしゃいます（尊敬・對方）／言（い）います（一般）。<br><span class=\"n4\">N4 必考：申す／おっしゃる 的方向不可搞錯</span>"]]},{"name":"職場（2）","lines":[["A","東販会社の張建邦と申します。山本さんと10時に約束してあります。","Tōhan-gaisha no Chō Kenpō to mōshimasu. Yamamoto-san to jū-ji ni yakusoku shite arimasu.","我是東販公司的張建邦。和山本先生約10點碰面。","▸ <b>句型</b>：【〜てある】表事先完成並保持該狀態。<br>▸ <b>變化</b>：約束（やくそく）する → 約束して → <b>約束してあります</b>（他動詞て形＋ある）。<br>▸ <b>用法</b>：「〜てある」強調<b>有人刻意做好、狀態還在</b>，比「約束（やくそく）しました」更能表達「已安排妥當」。<br>▸ <b>比較</b>：〜てある（他動詞＋ある，強調人為安排）／〜ている（狀態持續）。例：窓（まど）が開（あ）けてある（有人開的）／窓が開（あ）いている（開著）。<br><span class=\"n4\">N4 必考：てある／ている 的差別</span>"],["B","どうぞおかけください。ご来社の旨、山本さんに伝えます。","Dōzo okake kudasai. Goraisha no mune, Yamamoto-san ni tsutaemasu.","請坐一下，我去通知山本先生。","▸ <b>句型</b>：【お＋ます形＋ください】尊敬語請求 ＋【〜の旨（むね）を伝（つた）える】商務日語「傳達某事」的固定句型。<br>▸ <b>逐詞拆解</b>：<b>ご来社</b>（ごらいしゃ）＝来社（らいしゃ・來公司）＋接頭辭<b>ご</b>（漢語名詞用ご、和語用お）→「您來公司」；<b>旨</b>（むね）＝內容、意思、事情；<b>山本（やまもと）さんに</b>＝傳達的對象用<b>に</b>；<b>伝（つた）えます</b>＝轉達、告知。<br>▸ <b>句型公式</b>：<b>Aの旨（むね）を伝（つた）えます</b>＝我會傳達「A這件事」。本句省略了助詞を（商務口語常省略）。例：<b>明日（あした）休（やす）む旨を伝えます</b>（我會告知明天休假的事）／<b>会議（かいぎ）が延期（えんき）になった旨をお伝えします</b>（我會轉達會議延期一事）。<br>▸ <b>用法</b>：「旨（むね）」接在<b>名詞＋の</b>或<b>動詞普通形</b>之後，只用於商務與書面；「おかけください」是お＋ます形＋ください，比「座（すわ）ってください」文雅。整段意思是「請坐，我去告知山本先生您已到訪」。<br>▸ <b>比較</b>：〜の旨（むね）を伝（つた）える（商務・書面）／〜ということを伝える（一般）／〜と伝える（口語）——三者語意相同，正式度依序遞減。<br><span class=\"n4\">N4 必考：傳達對象的助詞に、ご／お 的接續規則（「〜の旨」本身屬 N3 以上的商務用法）</span>"]]},{"name":"職場（3）","lines":[["A","山本さん、こちらは台湾の東販会社の林明徳さんです。林さん、こちらは敝社の部長の、山本秀樹です。","Yamamoto-san, kochira wa Taiwan no Tōhan-gaisha no Rin Meitoku-san desu. Rin-san, kochira wa heisha no buchō no, Yamamoto Hideki desu.","山本先生，這位是臺灣東販公司的林明德先生。林先生，這位是敝公司的部長山本秀樹。","▸ <b>句型</b>：【こちらは〜です】介紹他人 ＋【職稱＋の＋姓名】同位語 ＋【內外有別（ウチ／ソト）】。<br>▸ <b>逐詞拆解</b>：<b>台湾（たいわん）の東販会社（とうはんがいしゃ）の林明徳（りんめいとく）さん</b>＝の由大到小層層修飾（國家→公司→人）；<b>敝社</b>（へいしゃ）＝敝公司（謙稱，也寫作弊社）；<b>部長（ぶちょう）の山本秀樹（やまもとひでき）</b>＝「擔任部長的山本秀樹」，<b>の</b>連接職稱與姓名（同位語）。<br>▸ <b>句型公式</b>：<b>こちらは＋［所屬］の＋［姓名］です</b>。介紹外部人士要加さん，介紹自家人<b>一律不加</b>。例：<b>こちらは営業部（えいぎょうぶ）の田中（たなか）です</b>（介紹自家同事）／<b>こちらはA社（しゃ）の田中さんです</b>（介紹外部人士）。<br>▸ <b>用法</b>：本句最大的考點是<b>山本秀樹です（不加さん）</b>——即使山本是自己的上司，對外部客人也要直呼姓名。這叫<b>ウチ／ソト（內外）原則</b>：對外時，自己公司的人全部歸為「內」，一律降格。<br>▸ <b>比較</b>：（對外）弊社（へいしゃ）の部長（ぶちょう）の山本（やまもと）です／（對內）山本部長。同一人依聽者改變稱法。另：<b>部長の山本</b>（○）／<b>山本部長さん</b>（× 職稱後不可再加さん）。<br><span class=\"n4\">N4 必考：ウチ／ソト 的敬語原則、の 的層層修飾</span>"],["Y","初めまして、林さん。東京にようこそ。","Hajimemashite, Rin-san. Tōkyō ni yōkoso.","林先生，幸會，歡迎蒞臨東京。","▸ <b>句型</b>：【ようこそ】歡迎詞＋【場所＋に】。<br>▸ <b>變化</b>：完整說法是「東京（とうきょう）へようこそ」或「ようこそ東京へ」，<b>へ／に</b>皆可。<br>▸ <b>用法</b>：「ようこそ」後面省略了「いらっしゃいました」；也常說「ようこそお越（こ）しくださいました」（最鄭重）。<br>▸ <b>比較</b>：ようこそ（歡迎來訪）／いらっしゃいませ（店家迎客）／お邪魔（じゃま）します（自己進門時說）。<br><span class=\"n4\">N4 會考各場合的招呼語搭配</span>"],["R","山本さん、お会いできて光栄です。","Yamamoto-san, oai dekite kōei desu.","山本先生，能夠認識你，榮幸之至。","▸ <b>句型</b>：【姓＋さん】＋【謙讓可能形＋光栄です】。<br>▸ <b>變化</b>：お会（あ）いできて（謙讓可能て形）＋光栄（こうえい）です（な形容詞述語）。<br>▸ <b>用法</b>：對職位高的人使用「光栄（こうえい）です」；也可加強為「大変（たいへん）光栄です」「光栄に存（ぞん）じます」。<br>▸ <b>比較</b>：光栄（こうえい）です（榮幸）／恐縮（きょうしゅく）です（不敢當、承受不起）／恐（おそ）れ入（い）ります（客氣的感謝或道歉）。<br><span class=\"n4\">N4 會考商務場合的固定客套語</span>"]]},{"name":"職場（4）","lines":[["A","紀之、こちらは大阪のABCエンジニアリングの若林禎彦さんです。若林さん、こちらは人事部長の神田紀之です。","Noriyuki, kochira wa Ōsaka no ABC enjiniaringu no Wakabayashi Yoshihiko-san desu. Wakabayashi-san, kochira wa jinji-buchō no Kanda Noriyuki desu.","紀之，這位是大阪ABC工程公司的若林禎彥先生。若林先生，這位是人事經理神田紀之先生。","▸ <b>句型</b>：【こちらは〜です】雙向引見 ＋【の的層層修飾】 ＋【內外有別】。<br>▸ <b>逐詞拆解</b>：<b>大阪（おおさか）のABCエンジニアリングの若林禎彦（わかばやしさだひこ）さん</b>＝地名の＋公司名の＋姓名（三層修飾）；<b>人事部長（じんじぶちょう）の神田紀之（かんだのりゆき）</b>＝職稱＋の＋姓名，<b>不加さん</b>（自家人）。<br>▸ <b>句型公式</b>：引見雙方時<b>各說一次</b>「こちらは〜です」，順序是<b>先介紹外部人士給自家人</b>，再把自家人介紹給外部人士。例：<b>部長（ぶちょう）、こちらはA社（しゃ）の田中（たなか）さんです。田中さん、こちらは弊社（へいしゃ）の部長の佐藤（さとう）です。</b><br>▸ <b>用法</b>：外部人士附上公司名並加さん（若林（わかばやし）さん）；自家人只說職稱＋姓名（人事部長（じんじぶちょう）の神田紀之（かんだのりゆき））。「エンジニアリング」＝engineering，公司名的片假名照原音轉寫。<br>▸ <b>比較</b>：若林（わかばやし）さん（外部・加さん）／神田紀之（かんだのりゆき）（自家・不加）。加不加さん就是判斷內外的<b>唯一線索</b>，聽解常靠這點判斷人物關係。<br><span class=\"n4\">N4 必考：敬稱的有無反映內外關係</span>"],["K","若林さん、お会いできてうれしいです。","Wakabayashi-san, oai dekite ureshii desu.","若林先生，很高興認識你。","▸ <b>句型</b>：【姓＋さん】＋【謙讓可能形】。<br>▸ <b>變化</b>：若林（わかばやし）→ 若林さん（對外部人士必加）。<br>▸ <b>用法</b>：對外部人士使用「さん」是基本原則，即使對方職位較低也一樣。<br>▸ <b>比較</b>：若林（わかばやし）さん（一般敬稱）／若林様（さま）（書信・客戶）／若林部長（ぶちょう）（職稱可代替さん，不可疊用「×若林部長さん」）。<br><span class=\"n4\">N4 必考：職稱後不可再加さん</span>"],["W","神田さん、お会いできて光栄です。","Kanda-san, oai dekite kōei desu.","神田先生，能夠認識你是我的榮幸。","▸ <b>句型</b>：【謙讓可能形＋光栄です】。<br>▸ <b>變化</b>：お会（あ）いできて＋光栄（こうえい）です；程度更高可說「お目（め）にかかれて光栄です」（お目にかかる＝会う的最高謙讓語）。<br>▸ <b>用法</b>：對方是人事部長（じんじぶちょう）（職位高），所以用「光栄（こうえい）です」而非「うれしいです」。<br>▸ <b>比較</b>：お会（あ）いできて（謙讓）／お目（め）にかかれて（最謙讓）／会えて（一般）。<br><span class=\"n4\">N4 讀解會出現「お目にかかる」這類特殊謙讓語</span>"]]},{"name":"自我介紹（1）","lines":[["A","私は遠藤文子です。京都出身で、京都大学で経済を勉強しています。好きなスポーツはボーリングとテニスです。","Watashi wa Endō Fumiko desu. Kyōto shusshin de, Kyōto daigaku de keizai wo benkyō shite imasu. Suki na supōtsu wa bōringu to tenisu desu.","我是遠藤文子。京都人，在京都大學唸經濟。喜歡的運動是保齡球和網球。","▸ <b>句型</b>：【名詞＋で】中止形 ＋【場所＋で＋〜を＋ています】 ＋【な形容詞＋な＋名詞】。<br>▸ <b>逐詞拆解</b>：<b>京都出身（きょうとしゅっしん）で</b>＝京都出身<b>です</b>的中止形（で用來連接下一句，等於「，」）；<b>京都大学（きょうとだいがく）で</b>＝動作場所用<b>で</b>；<b>経済（けいざい）を勉強（べんきょう）しています</b>＝ています表<b>持續的狀態</b>（在學中，不是正在唸）；<b>好（す）きなスポーツ</b>＝好きだ→好き<b>な</b>（な形容詞修飾名詞）。<br>▸ <b>句型公式</b>：<b>名詞＋で、〜</b>＝「是…，而且…」的中止用法。例：<b>私（わたし）は学生（がくせい）で、東京（とうきょう）に住（す）んでいます</b>（我是學生，住在東京）／<b>彼（かれ）は台湾人（たいわんじん）で、日本語（にほんご）が上手（じょうず）です</b>。<br>▸ <b>用法</b>：自我介紹的標準三段結構＝<b>姓名 → 出身（しゅっしん）・所屬 → 興趣嗜好</b>。並列名詞用<b>と</b>（ボーリングとテニス）表全部列舉；若用「や」則暗示還有其他。<br>▸ <b>比較</b>：京都出身（きょうとしゅっしん）<b>で</b>（名詞中止）／忙（いそが）しく<b>て</b>（い形容詞中止）／勉強（べんきょう）し<b>て</b>（動詞中止）。三類詞的中止形各不相同，是 N4 高頻考點。<br><span class=\"n4\">N4 必考：三類詞的中止形（で／くて／て）</span>"]]},{"name":"自我介紹（2）","lines":[["A","私は渡辺春男です。こんなにたくさんのすてきな新入社員のみなさんにお会いできてうれしいです。ようこそ！私は3年前に北海道大学を卒業し、現在はABC社の販売部に属しています。趣味はスキーと釣りです。","Watashi wa Watanabe Haruo desu. Konna ni takusan no suteki na shinnyū shain no minasan ni oai dekite ureshii desu. Yōkoso! Watashi wa san-nen mae ni Hokkaidō daigaku wo sotsugyō shi, genzai wa ABC-sha no hanbai-bu ni zoku shite imasu. Shumi wa sukī to tsuri desu.","我是渡邊春男。能認識這麼多優秀的新進員工真高興。歡迎！我三年前從北海道大學畢業，現在在ABC公司的銷售部。興趣是滑雪和釣魚。","▸ <b>句型</b>：【こんなに＋數量】 ＋【〜に＋お会いできて】謙讓可能 ＋【ます形中止】 ＋【〜に属している】。<br>▸ <b>逐詞拆解</b>：<b>こんなにたくさんの</b>＝這麼多的（こんなに修飾數量）；<b>みなさんに</b>＝見面的對象用<b>に</b>；<b>お会（あ）いできて</b>＝お＋ます形＋できる（謙讓可能）＋て（表原因）；<b>3年前（ねんまえ）に</b>＝時間點用に；<b>卒業（そつぎょう）し</b>＝卒業します去掉ます的<b>中止形</b>（正式書面）；<b>販売部（はんばいぶ）に属（ぞく）しています</b>＝所屬單位用に。<br>▸ <b>句型公式</b>：<b>［學校］を卒業（そつぎょう）する</b>＝畢業（離開的場所用<b>を</b>）／<b>［單位］に属（ぞく）している</b>＝隸屬於（用<b>に</b>）。例：<b>大学（だいがく）を卒業して、A社（しゃ）に入（はい）りました</b>。<br>▸ <b>用法</b>：<b>卒業（そつぎょう）し</b>（中止形）比「卒業して」正式，適合演講、書面；口語則用て形。「ようこそ！」＝歡迎（後面省略「いらっしゃいました」）。<br>▸ <b>比較</b>：大学（だいがく）<b>を</b>卒業（そつぎょう）する（○ 離開的起點用を）／大学<b>から</b>卒業する（× 不自然）。同類：家（いえ）を出（で）る・電車（でんしゃ）を降（お）りる、都用を。<br><span class=\"n4\">N4 必考：〜を卒業する 的助詞、ます形中止的正式文體</span>"]]},{"name":"自我介紹（3）","lines":[["A","自己紹介をさせていただきます。田中尚美です。東京の明治大学の2年生です。経済学部で勉強しています。会計学科でいい先生が大勢いるので満足です。私は公認会計士になりたいのです。","Jiko shōkai wo sasete itadakimasu. Tanaka Naomi desu. Tōkyō no Meiji daigaku no ni-nensei desu. Keizai gakubu de benkyō shite imasu. Kaikei gakka de ii sensei ga ōzei iru node manzoku desu. Watashi wa kōnin kaikeishi ni naritai no desu.","請容我自我介紹。我是田中尚美。東京明治大學二年級。在經濟學部唸書。會計學科有很多好老師，我很滿意。我想成為公認會計師。","▸ <b>句型</b>：【〜させていただきます】最謙遜的請求許可 ＋【〜ので】客觀原因 ＋【〜たいのです】說明願望。<br>▸ <b>逐詞拆解</b>：<b>させて</b>＝する的<b>使役形させる</b>的て形（讓我做）；<b>いただきます</b>＝もらう的謙讓語（承受對方的允許）→ 合起來＝「請容我…」；<b>大勢（おおぜい）いるので</b>＝ので表客觀原因；<b>なりたいのです</b>＝なる＋たい＋のです（說明自己的意願）。<br>▸ <b>句型公式</b>：<b>動詞使役形＋ていただきます</b>＝請容我做…（把「我要做」講成「承蒙您允許我做」）。例：<b>説明（せつめい）させていただきます</b>（請容我說明）／<b>お先（さき）に帰（かえ）らせていただきます</b>（請容我先離開）／<b>写真（しゃしん）を撮（と）らせていただけますか</b>（能否讓我拍照）。<br>▸ <b>用法</b>：這是商務日語<b>最謙遜</b>的表達，把自己的行為說成「得到對方許可才做」。變化：一類動詞う段→あ段＋せて（話（はな）す→話させて），二類る→させて（見（み）る→見させて），三類する→させて・来（く）る→来（こ）させて。<br>▸ <b>比較</b>：させていただきます（最謙遜・請求許可）／いたします（單純謙讓）／します（一般）。三者敬意依序遞減。<br><span class=\"n4\">N4 必考：使役形的變化＋〜ていただく 的組合</span>"]]}]},"3":{"title":"和陌生人的談話","jp_title":"見知らぬ人に話しかける","theme":"與陌生人的基本交流","scenes":[{"name":"問路（1）","lines":[["A","ちょっと失礼します。新宿通りはどこか教えていただけますか？","Chotto shitsurei shimasu. Shinjuku-dōri wa doko ka oshiete itadakemasu ka?","對不起，請問一下新宿街怎麼走？","▸ <b>句型</b>：【疑問詞＋か＋動詞】名詞子句＋【〜ていただけますか】謙讓請求。<br>▸ <b>變化</b>：教（おし）えてもらう → 教えて<b>いただく</b>（謙讓）→ 可能形 いただける → 教えていただけますか。<br>▸ <b>用法</b>：「どこか」把疑問句嵌入成名詞子句當「教（おし）える」的內容；「ちょっと失礼（しつれい）します」是向陌生人搭話的緩衝。<br>▸ <b>比較</b>：教（おし）えてください（請求）／教えてもらえますか（客氣）／教えていただけますか（很客氣）／教えていただけませんか（最客氣）。<br><span class=\"n4\">N4 必考：請求句型的四段禮貌階梯</span>"],["B","すみません。このあたりはあまり詳しくありません。","Sumimasen. Kono atari wa amari kuwashiku arimasen.","抱歉，我對這附近也不熟。","▸ <b>句型</b>：【あまり＋否定】＋【い形容詞否定】。<br>▸ <b>變化</b>：詳（くわ）しい → 詳しく<b>ない</b>（常體）→ 詳しく<b>ありません</b>（丁寧）。い形容詞否定＝去い＋くない。<br>▸ <b>用法</b>：<b>あまり必須與否定呼應</b>，表「不太…」；肯定句要用「とても」。<br>▸ <b>比較</b>：あまり〜ない（不太）／全然（ぜんぜん）〜ない（完全不）／少（すこ）し〜（有點，接肯定）。<br><span class=\"n4\">N4 必考：呼應副詞（あまり・全然）</span>"],["A","ああ、そうですか。","Ā, sō desu ka.","哦，這樣子啊！","▸ <b>句型</b>：【そうですか】的語調差異。<br>▸ <b>變化</b>：そうです（是這樣）＋か（疑問）。<br>▸ <b>用法</b>：<b>降調</b>＝「原來如此」（接受資訊）；<b>升調</b>＝「是這樣嗎？」（半信半疑）。這裡是降調。<br>▸ <b>比較</b>：そうですか（理解）／そうですね（同意或思考中）／そうなんですか（更感興趣）。<br><span class=\"n4\">N4 聽解必考：そうですか／そうですね 的功能差異</span>"]]},{"name":"問路（2）","lines":[["A","失礼ですが、アメリカ大使館はどこかご存じですか？","Shitsurei desu ga, Amerika taishikan wa doko ka gozonji desu ka?","對不起，請問美國大使館在哪裡？","▸ <b>句型</b>：【失礼ですが】搭話緩衝 ＋【疑問詞＋か】間接疑問 ＋【ご存じですか】尊敬語。<br>▸ <b>逐詞拆解</b>：<b>失礼（しつれい）ですが</b>＝失礼です＋<b>が</b>（此處的が<b>不是逆接</b>，只是緩衝，讓後面的提問不失禮）；<b>どこか</b>＝疑問詞＋か，把疑問句變成名詞子句；<b>ご存（ぞん）じ</b>＝知（し）っている的<b>尊敬語</b>（動詞「存じる」的敬語名詞形）。<br>▸ <b>句型公式</b>：<b>［疑問詞］＋か＋ご存（ぞん）じですか</b>＝您知道…嗎。例：<b>いつ始（はじ）まるかご存じですか</b>（您知道何時開始嗎）／<b>どなたかご存じですか</b>（您知道是哪位嗎）。<br>▸ <b>用法</b>：「ご存（ぞん）じ」<b>只能用於他人</b>；自己知道要說「存じております」（謙讓）。所以「×私（わたし）はご存じです」是錯的。「失礼（しつれい）ですが」常用於詢問私人資訊（姓名、年齡、住處）之前。<br>▸ <b>比較</b>：ご存（ぞん）じですか（尊敬・對方知道）／存じております（謙讓・我知道）／知（し）っていますか（一般）／知りません（不知道，語氣略冷淡，宜說「わかりません」）。<br><span class=\"n4\">N4 必考：ご存じ／存じる 的方向不可對錯</span>"],["B","ええ、まっすぐ行ってください。ほんの2ブロック先です。","Ē, massugu itte kudasai. Honno ni-burokku saki desu.","嗯，請直走，就在隔兩條街的地方。","▸ <b>句型</b>：【て形＋ください】指示＋【ほんの＋數量】。<br>▸ <b>變化</b>：行（い）く → 行っ<b>て</b>（て形，く結尾的一類動詞→いて，但「行く」是例外→行って）。<br>▸ <b>用法</b>：「ほんの」＝只不過，強調數量少；「2ブロック先（さき）」的<b>先</b>表更前方的位置。<br>▸ <b>比較</b>：行（い）って（行く的例外變化）／書（か）いて（書く→書いて）／泳（およ）いで（泳ぐ→泳いで）。<br><span class=\"n4\">N4 必考：行く 的て形是不規則的「行って」</span>"],["A","ありがとうございました。","Arigatō gozaimashita.","謝謝！","▸ <b>句型</b>：【ありがとうございました】過去式的道謝。<br>▸ <b>變化</b>：ありがとうございます（現在）→ ありがとうございました（過去）。<br>▸ <b>用法</b>：對方的幫助<b>已經完成</b>時用過去式；若對方正在幫忙或持續受惠，用現在式。<br>▸ <b>比較</b>：ありがとうございました（事情結束）／ありがとうございます（當下或持續）／ありがとう（常體）。<br><span class=\"n4\">N4 必考：道謝的時態選擇</span>"]]},{"name":"提醒","lines":[["A","あのー、ハンカチを落としましたよ。","Anō, hankachi wo otoshimashita yo.","那個，你的手帕掉了。","▸ <b>句型</b>：【他動詞過去式＋よ】告知。<br>▸ <b>變化</b>：落（お）とす（他動詞・弄掉）→ 落としました；自動詞則是「落（お）ちる」（落ちました＝掉了）。<br>▸ <b>用法</b>：「あのー」是搭話用的填補詞；<b>よ</b>用於告知對方還不知道的事，此處不可省略。<br>▸ <b>比較</b>：ハンカチを落（お）としました（他動詞・你弄掉的）／ハンカチが落ちました（自動詞・掉了）。<br><span class=\"n4\">N4 必考：自動詞／他動詞的配對（落ちる／落とす）</span>"],["B","あら、どうもすみません。","Ara, dōmo sumimasen.","真是謝謝你。","▸ <b>句型</b>：【感嘆詞＋どうもすみません】。<br>▸ <b>變化</b>：すみません 可表①道歉 ②道謝 ③搭話，此處是<b>道謝</b>。<br>▸ <b>用法</b>：「あら」是女性用的輕微驚訝；「どうも」加強語氣，也可單獨當「謝了」用。<br>▸ <b>比較</b>：すみません（萬用）／ありがとうございます（純道謝）／恐（おそ）れ入（い）ります（更鄭重的客氣）。<br><span class=\"n4\">N4 必考：すみません 的三種功能</span>"]]},{"name":"座位（1）","lines":[["A","この席はどなたかいらっしゃいますか。","Kono seki wa donata ka irasshaimasu ka.","這個位子有人坐嗎？","▸ <b>句型</b>：【どなたか】敬語疑問詞＋【いらっしゃる】尊敬語。<br>▸ <b>變化</b>：誰（だれ）か → <b>どなたか</b>（敬語）；いる → <b>いらっしゃる</b>（尊敬語）→ いらっしゃいますか。<br>▸ <b>用法</b>：問位子有沒有人時，主語是他人所以用尊敬語；自己則用「おります」（謙讓）。<br>▸ <b>比較</b>：いらっしゃる（尊敬・いる・行（い）く・来（く）る三者共用）／おる（謙讓）／いる（一般）。<br><span class=\"n4\">N4 必考：いらっしゃる 一詞對應三個動詞</span>"],["B","いいえ。どうぞ。","Iie. Dōzo.","沒有，請坐。","▸ <b>句型</b>：【いいえ】否定＋【どうぞ】勸讓。<br>▸ <b>變化</b>：「どうぞ」後面省略了「お座（すわ）りください」等動詞。<br>▸ <b>用法</b>：「どうぞ」單用即表示「請（用／坐／拿）」，靠情境判斷省略的動詞。<br>▸ <b>比較</b>：どうぞ（請・讓與）／どうも（謝謝・或加強語氣）。兩者僅一字之差但功能完全不同。<br><span class=\"n4\">N4 必考：どうぞ／どうも 的區別</span>"],["A","ありがとう。","Arigatō.","謝謝！","▸ <b>句型</b>：【ありがとう】常體道謝。<br>▸ <b>變化</b>：ありがとうございます → ありがとう（去掉ございます）。<br>▸ <b>用法</b>：對陌生人原則上用「ありがとうございます」；此處是輕微的謝意，語氣隨性。<br>▸ <b>比較</b>：ありがとう（平輩以下）／ありがとうございます（一般・安全）／どうも（極隨性，對長輩失禮）。<br><span class=\"n4\">N4 會考敬語程度與對象的搭配</span>"]]},{"name":"座位（2）","lines":[["A","すみませんが、ここは私の席です。","Sumimasen ga, koko wa watashi no seki desu.","對不起，這是我的位子。","▸ <b>句型</b>：【すみませんが】緩衝＋【AはBです】主張。<br>▸ <b>變化</b>：「が」在此是<b>緩衝用的接續助詞</b>，並非逆接；直接說「ここは私（わたし）の席（せき）です」會顯得強硬。<br>▸ <b>用法</b>：日語主張自己權益時，前面幾乎必加緩衝語（すみませんが／失礼（しつれい）ですが／恐（おそ）れ入（い）りますが）。<br>▸ <b>比較</b>：すみませんが（一般）／恐（おそ）れ入（い）りますが（更鄭重）／申（もう）し訳（わけ）ありませんが（最鄭重）。<br><span class=\"n4\">N4 必考：が 的緩衝用法</span>"],["B","ああ、すみません。","Ā, sumimasen.","啊，對不起！","▸ <b>句型</b>：【感嘆詞＋すみません】道歉。<br>▸ <b>變化</b>：すみません（一般）→ 申（もう）し訳（わけ）ありません（鄭重）→ 大変（たいへん）申し訳ございません（最鄭重）。<br>▸ <b>用法</b>：「ああ」表恍然大悟，發現自己弄錯時的自然反應。<br>▸ <b>比較</b>：すみません（輕微失誤）／ごめんなさい（熟人間，較私人）／失礼（しつれい）しました（禮儀上的失禮）。<br><span class=\"n4\">N4 必考：道歉語的輕重與場合</span>"]]},{"name":"餐廳（1）","lines":[["A","ウェーターさん。","Wētā-san.","服務生。","▸ <b>句型</b>：【職業名＋さん】呼喚服務人員。<br>▸ <b>變化</b>：ウェーター（waiter）＋<b>さん</b>；日語習慣在職業名後加さん來稱呼對方。<br>▸ <b>用法</b>：不可用「あなた」叫人；現代日本更常說「すみません」來叫服務生。<br>▸ <b>比較</b>：ウェーターさん（服務生）／店員（てんいん）さん（店員）／運転手（うんてんしゅ）さん（司機）／お巡（まわ）りさん（警察）。<br><span class=\"n4\">N4 必考：職業名＋さん 的稱呼方式</span>"],["B","はい、お客さま。","Hai, okyakusama.","您好，客人。","▸ <b>句型</b>：【お＋名詞＋さま】最高敬稱。<br>▸ <b>變化</b>：客（きゃく）→ <b>お</b>客 → お客<b>さま</b>（＝様（さま），比さん更敬）。<br>▸ <b>用法</b>：服務業對顧客的固定稱法；書面寫作「お客様（きゃくさま）」。<br>▸ <b>比較</b>：お客（きゃく）さま（服務業對顧客）／お客さん（略隨性）／皆様（みなさま）（各位，最鄭重）。<br><span class=\"n4\">N4 必考：様／さん 的敬意差異</span>"],["A","メニューを見せていただけませんか？","Menyū wo misete itadakemasen ka?","可以給我看菜單嗎？","▸ <b>句型</b>：【使役形＋てもらう的謙讓可能否定疑問】。<br>▸ <b>變化</b>：見（み）る → 見せる（使役性他動詞・讓人看）→ 見せていただく → 見せていただけ<b>ません</b>か。<br>▸ <b>用法</b>：<b>否定疑問形（〜ませんか）比肯定疑問更客氣</b>，因為留給對方拒絕的空間。<br>▸ <b>比較</b>：見（み）せてください（請求）／見せていただけますか（客氣）／見せていただけませんか（最客氣）。<br><span class=\"n4\">N4 必考：否定疑問形的禮貌功能</span>"]]},{"name":"餐廳（2）","lines":[["A","ウェーターさん。","Wētā-san.","服務生！","▸ <b>句型</b>：【職業名＋さん】呼喚。<br>▸ <b>變化</b>：ウェーターさん（片假名外來語＋さん）。<br>▸ <b>用法</b>：日式餐廳實際上更常喊「すみません」或按桌邊的呼叫鈴。<br>▸ <b>比較</b>：ウェーター（waiter）／ウェートレス（waitress）／店員（てんいん）（一般店員）。<br><span class=\"n4\">N4 會考外來語的片假名寫法</span>"],["B","いらっしゃいませ。","Irasshaimase.","歡迎光臨！","▸ <b>句型</b>：【尊敬語的命令形】固定化的迎客語。<br>▸ <b>變化</b>：いらっしゃる（尊敬語）→ 命令形<b>いらっしゃい</b> → ＋ませ（鄭重）＝いらっしゃいませ。<br>▸ <b>用法</b>：店家對顧客說，顧客<b>不需回應</b>；家中歡迎客人則說「いらっしゃい」（不加ませ）。<br>▸ <b>比較</b>：いらっしゃいませ（商店）／いらっしゃい（家中歡迎）／ようこそ（歡迎來訪）。<br><span class=\"n4\">N4 必考：〜ませ 是最鄭重的命令形</span>"],["A","注文をとっていただけますか？","Chūmon wo totte itadakemasu ka?","可以幫我點菜嗎？","▸ <b>句型</b>：【〜ていただけますか】謙讓請求。<br>▸ <b>變化</b>：とる → とって（て形）→ とっていただく → とっていただけますか。<br>▸ <b>用法</b>：「注文（ちゅうもん）をとる」＝受理點單（店家的動作）；顧客說這句是請店員來點菜。<br>▸ <b>比較</b>：注文（ちゅうもん）をとる（店家受理）／注文をする（顧客點餐）／注文をお願（ねが）いします（顧客最常用的說法）。<br><span class=\"n4\">N4 會考同一名詞搭配不同動詞的立場差異</span>"]]},{"name":"購物（1）","lines":[["A","すみませんが。","Sumimasen ga.","對不起。","▸ <b>句型</b>：【すみませんが】只說一半，靠が留白。<br>▸ <b>變化</b>：完整句可能是「すみませんが、ちょっと見（み）せてください」，但省略後半。<br>▸ <b>用法</b>：日語常<b>刻意把句子說一半</b>，讓對方主動接話，是很典型的溝通方式。<br>▸ <b>比較</b>：すみませんが（留白等對方）／すみません（單純叫人）。加「が」就有「我有事要說」的暗示。<br><span class=\"n4\">N4 讀解需理解留白句的功能</span>"],["B","はい。何がよろしいでしょうか？","Hai. Nani ga yoroshii deshō ka?","您好，需要什麼嗎？","▸ <b>句型</b>：【疑問詞＋が】＋【よろしい】＋【でしょうか】。<br>▸ <b>變化</b>：いい → <b>よろしい</b>（鄭重）；ですか → <b>でしょうか</b>（更委婉，降低斷定）。<br>▸ <b>用法</b>：疑問詞當主語時<b>必須用が</b>（×何（なに）はよろしいでしょうか）。<br>▸ <b>比較</b>：何（なに）がいいですか（一般）／何がよろしいですか（禮貌）／何がよろしいでしょうか（最禮貌）。<br><span class=\"n4\">N4 必考：疑問詞主語用が；でしょうか 的委婉功能</span>"],["A","シルクのブラウスを見たいのですが。","Shiruku no burausu wo mitai no desu ga.","我想看看絲質的罩衫。","▸ <b>句型</b>：【〜たい】希望＋【のですが】留白。<br>▸ <b>變化</b>：見（み）る → 見ます → 見<b>たい</b>（ます形去ます＋たい）→ 見たいのですが。<br>▸ <b>用法</b>：「〜のですが」說出願望後留白，等待對方回應——比直接說「見（み）せてください」委婉。「シルクの」用の修飾材質。<br>▸ <b>比較</b>：見（み）たいです（直說）／見たいのですが（留白・委婉）／見せていただけますか（直接請求）。<br><span class=\"n4\">N4 必考：〜たい 的活用（たかった／たくない）</span>"]]},{"name":"購物（2）","lines":[["A","すみません。","Sumimasen.","對不起。","▸ <b>句型</b>：【すみません】搭話功能。<br>▸ <b>變化</b>：すみません（丁寧）／すいません（口語發音）／ごめん（常體）。<br>▸ <b>用法</b>：這裡是<b>搭話</b>（不是道歉），相當於中文的「不好意思、請問一下」。<br>▸ <b>比較</b>：すみません（道歉／道謝／搭話）。三種功能靠情境與語調判斷，是日語最萬用的詞。<br><span class=\"n4\">N4 聽解必考：判斷 すみません 的功能</span>"],["B","はい。何かご用でしょうか？","Hai. Nani ka goyō deshō ka?","您好，需要什麼嗎？","▸ <b>句型</b>：【ご＋名詞】尊敬語＋【でしょうか】委婉。<br>▸ <b>變化</b>：用事（ようじ）→ <b>ご</b>用（よう）（尊敬語，漢語名詞加ご）；ですか → でしょうか。<br>▸ <b>用法</b>：「何（なに）かご用（よう）でしょうか」是店員、接待人員的固定問法；「何か」表不特定的事物。<br>▸ <b>比較</b>：ご用（よう）（漢語＋ご）／お名前（なまえ）（和語＋お）。原則：<b>漢語加ご、和語加お</b>（例外：お電話（でんわ）・お時間（じかん））。<br><span class=\"n4\">N4 必考：お／ご 的接續原則與例外</span>"],["A","黒のカーディガンはありますか？","Kuro no kādigan wa arimasu ka?","有黑色的毛線衣嗎？","▸ <b>句型</b>：【〜はありますか】詢問有無＋【名詞＋の＋名詞】。<br>▸ <b>變化</b>：ある → あります → ありますか；否定為「ありません」。<br>▸ <b>用法</b>：「黒（くろ）<b>の</b>カーディガン」用の連接顏色與物品（也可說「黒（くろ）いカーディガン」用い形容詞）。<br>▸ <b>比較</b>：黒（くろ）の（名詞＋の，指定種類）／黒（くろ）い（い形容詞，描述外觀）。「赤（あか）・青（あお）・黒・白（しろ）」都有兩種用法。<br><span class=\"n4\">N4 必考：顏色詞的名詞形與形容詞形</span>"]]},{"name":"購物（3）","lines":[["A","すみませんが。","Sumimasen ga.","對不起。","▸ <b>句型</b>：【すみませんが】留白式搭話。<br>▸ <b>變化</b>：すみません＋が（緩衝）。<br>▸ <b>用法</b>：向店員開口的標準開場，後面的請求可省略不說。<br>▸ <b>比較</b>：すみませんが（有事相求）／失礼（しつれい）ですが（更正式，常用於詢問私人資訊）。<br><span class=\"n4\">N4 會考搭話用語的正式度</span>"],["B","はい。何かご用でしょうか？","Hai. Nani ka goyō deshō ka?","您好，需要什麼嗎？","▸ <b>句型</b>：【はい＋何かご用でしょうか】。<br>▸ <b>變化</b>：ご用（よう）＋ でしょうか（委婉推測形）。<br>▸ <b>用法</b>：店員回應顧客招呼的固定說法，比「何（なん）ですか」禮貌得多。<br>▸ <b>比較</b>：何（なに）かご用（よう）でしょうか（禮貌）／どうしましたか（關心對方狀況）／何ですか（略顯生硬）。<br><span class=\"n4\">N4 會考服務業用語（接客用語）</span>"],["A","このセーターでLサイズはありますか？","Kono sētā de L saizu wa arimasu ka?","這件毛衣有沒有L size的？","▸ <b>句型</b>：【〜で】表範圍＋【〜はありますか】。<br>▸ <b>變化</b>：「このセーター<b>で</b>」＝就這件毛衣而言，<b>で</b>限定討論的範圍。<br>▸ <b>用法</b>：詢問尺寸、顏色是否有其他選項時的實用句；也可說「このセーターのLサイズはありますか」。<br>▸ <b>比較</b>：で（範圍・手段・場所・原因）——這是 N4 最容易混淆的助詞，需靠前後文判斷。<br><span class=\"n4\">N4 必考：助詞 で 的多義性</span>"]]}]},"4":{"title":"再次確認","jp_title":"聞き返す","theme":"信息確認與澄清","scenes":[{"name":"再問一次（1）","lines":[["A","すみませんが、もう一度お願いします。","Sumimasen ga, mō ichido onegai shimasu.","對不起，請再說一遍。","▸ <b>句型</b>：【お＋名詞＋します】謙讓語＋【もう一度】。<br>▸ <b>變化</b>：願（ねが）う → <b>お願いします</b>（お＋ます形＋する的謙讓形，已固定為慣用語）。<br>▸ <b>用法</b>：「お願（ねが）いします」是萬用請求句，後面的動詞可省略；「もう一度（いちど）」＝再一次。<br>▸ <b>比較</b>：もう一度（いちど）（再一次）／もう少（すこ）し（再一點）／もっと（更加）。三者<b>もう</b>的用法不同。<br><span class=\"n4\">N4 必考：もう＋數量／もう＋少し 的區別</span>"],["B","上野公園はどちらか教えていただけますか。","Ueno kōen wa dochira ka oshiete itadakemasu ka.","能告訴我上野公園在哪裡嗎？","▸ <b>句型</b>：【疑問詞＋か】名詞子句＋【〜ていただけますか】。<br>▸ <b>變化</b>：どこ → <b>どちら</b>（禮貌形）；「どちらか」把疑問句名詞化後當「教（おし）える」的受詞。<br>▸ <b>用法</b>：嵌入疑問句時句尾用<b>か</b>，不可保留「ですか」（×どちらですか教（おし）えて）。<br>▸ <b>比較</b>：どこ／どちら（何處）、誰（だれ）／どなた（誰）、どう／いかが（如何）。右者皆為禮貌形。<br><span class=\"n4\">N4 必考：間接疑問句（〜か＋動詞）</span>"],["A","ああ、いいですよ。まっすぐ行ってください。","Ā, ii desu yo. Massugu itte kudasai.","啊，好的，請直走。","▸ <b>句型</b>：【いいですよ】答應＋【て形＋ください】。<br>▸ <b>變化</b>：行（い）く → 行って（例外變化）→ 行ってください。<br>▸ <b>用法</b>：「いいですよ」的<b>よ</b>表示積極告知對方「沒問題」；「まっすぐ」是副詞，直接修飾動詞。<br>▸ <b>比較</b>：いいですよ（答應）／いいです（可能是婉拒！）／けっこうです（婉拒）。<b>語調決定意思</b>。<br><span class=\"n4\">N4 聽解陷阱：いいです 可能是拒絕</span>"]]},{"name":"再問一次（2）","lines":[["A","すみませんが、何とおっしゃいましたか？","Sumimasen ga, nan to osshaimashita ka?","對不起，你說什麼？","▸ <b>句型</b>：【引用助詞と】＋【おっしゃる】尊敬語過去式。<br>▸ <b>變化</b>：言（い）う → <b>おっしゃる</b>（尊敬語）→ おっしゃいました（過去）。注意是「おっしゃい<b>ました</b>」不是「×おっしゃりました」。<br>▸ <b>用法</b>：引用的內容用<b>と</b>標示；「何（なん）と」＝說了什麼。<br>▸ <b>比較</b>：おっしゃる（尊敬・對方說）／申（もう）す（謙讓・自己說）／言（い）う（一般）。<br><span class=\"n4\">N4 必考：おっしゃる 的ます形是不規則的「おっしゃいます」</span>"],["B","お母さんはいかがですか。","Okāsan wa ikaga desu ka.","你母親好嗎？","▸ <b>句型</b>：【いかがですか】＝どうですか的敬語。<br>▸ <b>變化</b>：どう → <b>いかが</b>（禮貌）；ですか → でしょうか（更委婉）。<br>▸ <b>用法</b>：問對方家人的近況時，家人前要加<b>お</b>（お母（かあ）さん）；提到自己的母親則說「母（はは）」。<br>▸ <b>比較</b>：（他人的）お母（かあ）さん・お父（とう）さん・ご両親（りょうしん）／（自己的）母（はは）・父（ちち）・両親（りょうしん）。<br><span class=\"n4\">N4 必考：親屬稱謂的內外有別</span>"],["A","ああ、母は先週退院いたしまして、元気です。","Ā, haha wa senshū taiin itashimashite, genki desu.","啊，我母親上個禮拜出院了，她很好。","▸ <b>句型</b>：【謙讓語的中止形】＋【な形容詞述語】。<br>▸ <b>變化</b>：する → <b>いたす</b>（謙讓語）→ いたします → <b>いたしまして</b>（て形，連接下一句）。<br>▸ <b>用法</b>：談自己的母親用「母（はは）」<b>不加お</b>；母親的動作用謙讓語（自家人視為自己一方）。<br>▸ <b>比較</b>：退院（たいいん）いたしまして（謙讓・自家人）／退院なさいまして（尊敬・他人）。<br><span class=\"n4\">N4 必考：自家人的動作要用謙讓語</span>"]]},{"name":"再問一次（3）","lines":[["A","圭子、もう一度言ってくれる？","Keiko, mō ichido itte kureru?","圭子，再說一遍好嗎？","▸ <b>句型</b>：【〜てくれる】對方為我做＋常體疑問。<br>▸ <b>變化</b>：言（い）う → 言って（て形）＋<b>くれる</b>（對方為我做）→ 言ってくれる？（升調＝請求）。<br>▸ <b>用法</b>：「〜てくれる？」是對熟人的請求；丁寧形為「言（い）ってくれますか」，更客氣為「言ってくれませんか」。<br>▸ <b>比較</b>：〜てくれる（對方為我）／〜てあげる（我為對方）／〜てもらう（我請對方為我）。方向<b>絕不可搞錯</b>。<br><span class=\"n4\">N4 必考：授受動詞三兄弟（くれる／あげる／もらう）</span>"],["B","次の週末の予定を聞いてたのよ。","Tsugi no shūmatsu no yotei wo kiiteta no yo.","我是問你下週末有什麼計畫。","▸ <b>句型</b>：【〜ていた的縮約】＋【のよ】說明語氣。<br>▸ <b>變化</b>：聞（き）いていました → 聞いていた → <b>聞いてた</b>（い脫落）＋のよ。<br>▸ <b>用法</b>：過去進行式表「我剛剛正在問的是…」；「のよ」是女性用的說明語氣（男性用「んだよ」）。<br>▸ <b>比較</b>：聞（き）いてた（過去進行）／聞いた（單純過去）／聞いている（現在進行）。<br><span class=\"n4\">N4 聽解必考：〜てた ＝〜ていた</span>"],["A","ああ、別に決まっていないけど。何か考えがあるの？","Ā, betsu ni kimatte inai kedo. Nani ka kangae ga aru no?","啊，還沒決定，你有什麼想法嗎？","▸ <b>句型</b>：【別に〜ない】＋【〜ている】狀態＋【〜の？】常體疑問。<br>▸ <b>變化</b>：決（き）まる（自動詞）→ 決まって<b>いない</b>（尚未決定的狀態）；「決（き）めていない」則是「我還沒決定」（他動詞，強調意志）。<br>▸ <b>用法</b>：<b>別（べつ）に</b>必與否定呼應，表「並沒有特別…」；「〜の？」是常體的關心式疑問。<br>▸ <b>比較</b>：決（き）まっていない（自動詞・狀態未定）／決（き）めていない（他動詞・我沒決定）。<br><span class=\"n4\">N4 必考：自動詞＋ている／他動詞＋ている 的語意差</span>"]]},{"name":"再問一次（4）","lines":[["A","あなたのおっしゃったことが聞き取れなかったのですが。もう少しゆっくり話してくださいませんか？","Anata no osshatta koto ga kikitorenakatta no desu ga. Mō sukoshi yukkuri hanashite kudasaimasen ka?","我聽不清楚你說的話，能不能再說慢一點呢？","▸ <b>句型</b>：【尊敬語過去＋こと】連體修飾 ＋【複合動詞可能形否定過去】 ＋【〜てくださいませんか】最客氣請求。<br>▸ <b>逐詞拆解</b>：<b>おっしゃった</b>＝言（い）う的尊敬語おっしゃる的過去式；<b>おっしゃったこと</b>＝您說過的話（動詞過去式<b>直接</b>修飾名詞こと）；<b>聞（き）き取（と）れなかった</b>＝聞き取る（複合動詞・聽懂）→可能形聞き取れる→否定過去；<b>もう少（すこ）しゆっくり</b>＝再稍微慢一點；<b>話（はな）してくださいませんか</b>＝て形＋くださいませんか（否定疑問的敬語請求）。<br>▸ <b>句型公式</b>：<b>〜てくださいませんか</b>＝能不能請您…（否定疑問＝最客氣，因為預留了拒絕空間）。例：<b>もう一度（いちど）説明（せつめい）してくださいませんか</b>／<b>少（すこ）し待（ま）ってくださいませんか</b>。<br>▸ <b>用法</b>：整句的策略是<b>先說明自己的困難（聽不清楚），再提出請求</b>——不說「你講太快了」而說「我沒聽清楚」，把責任歸於自己，這是日語的體貼。<br>▸ <b>比較</b>：請求的四段禮貌階梯：話（はな）してください ＜ 話してくださいますか ＜ 話していただけますか ＜ <b>話してくださいませんか／いただけませんか</b>。<br><span class=\"n4\">N4 必考：可能形的否定過去、否定疑問的禮貌功能</span>"],["B","いいですよ。いいながめですね、と言いました。","Ii desu yo. Ii nagame desu ne, to iimashita.","好的，我說『視野真好啊』。","▸ <b>句型</b>：【引用と＋言いました】直接引述。<br>▸ <b>變化</b>：「いいながめですね」原句照搬 ＋<b>と</b>＋言（い）いました。<br>▸ <b>用法</b>：日語引用<b>不需引號</b>也能靠と辨識；直接引用保留原句語氣，間接引用則改成普通形。<br>▸ <b>比較</b>：「〜」と言（い）いました（直接引用）／〜と言っていました（間接・轉述他人）。<br><span class=\"n4\">N4 必考：直接引用與間接引用的形式差異</span>"]]},{"name":"確認姓名（1）","lines":[["A","あなたの姓をもう一度おっしゃってくださいませんか？","Anata no sei wo mō ichido osshatte kudasaimasen ka?","請再一次告訴我你的姓好嗎？","▸ <b>句型</b>：【尊敬語て形＋くださいませんか】。<br>▸ <b>變化</b>：言（い）う → おっしゃる（尊敬）→ <b>おっしゃって</b>（て形）＋くださいませんか。<br>▸ <b>用法</b>：這是請求句型中<b>最客氣</b>的一種，適用於初次見面或商務場合。<br>▸ <b>比較</b>：おっしゃってください（尊敬語請求）／言（い）ってください（一般）。前者把對方的動作抬高。<br><span class=\"n4\">N4 必考：尊敬語＋てください 的組合</span>"],["B","はい、古川と申します。","Hai, Furukawa to mōshimasu.","好的，我姓古川。","▸ <b>句型</b>：【〜と申します】謙讓自我介紹。<br>▸ <b>變化</b>：言（い）う → 申（もう）す（謙讓）→ 申します；名字用<b>と</b>引用。<br>▸ <b>用法</b>：商務場合報姓名的標準說法，比「〜です」更謙遜。<br>▸ <b>比較</b>：古川（ふるかわ）です（一般）／古川と申（もう）します（謙讓）／古川と言（い）います（中間，略隨性）。<br><span class=\"n4\">N4 必考：申します 只能用於自己</span>"],["A","古川さんですね。どうもありがとうございます。","Furukawa-san desu ne. Dōmo arigatō gozaimasu.","古川先生，謝謝你。","▸ <b>句型</b>：【〜ですね】確認＋【どうも＋ありがとうございます】。<br>▸ <b>變化</b>：古川（ふるかわ）さん＋ですね（<b>ね</b>用於確認自己聽到的內容）。<br>▸ <b>用法</b>：複誦對方姓名並加「ね」，是確認沒聽錯的禮貌做法；「どうも」加強謝意。<br>▸ <b>比較</b>：〜ですね（向對方確認）／〜ですよ（告知對方）／〜ですか（單純疑問）。<br><span class=\"n4\">N4 必考：ね／よ 的功能對比</span>"]]},{"name":"確認姓名（2）","lines":[["A","私の名前は若林禎彦です。","Watashi no namae wa Wakabayashi Yoshihiko desu.","我的名字叫若林禎彥。","▸ <b>句型</b>：【私の名前は〜です】。<br>▸ <b>變化</b>：私（わたし）＋の（所屬）＋名前（なまえ）＋は（主題）＋です（斷定）。<br>▸ <b>用法</b>：需要清楚交代全名時使用；日常只說姓氏即可。<br>▸ <b>比較</b>：名前（なまえ）（名字，可指全名或名）／姓（せい）・名字（みょうじ）（姓氏）／下（した）の名前（名）。<br><span class=\"n4\">N4 會考「名前／名字」的語意範圍</span>"],["B","ええと……禎彦、何さんですか？","Ēto…… Yoshihiko, nan-san desu ka?","嗯，是……禎彥先生嗎？那姓什麼？","▸ <b>句型</b>：【疑問詞何＋さん】詢問姓氏。<br>▸ <b>變化</b>：「何（なに）さん」＝姓什麼；「何」在此當<b>疑問詞</b>接尾。<br>▸ <b>用法</b>：「ええと」是思考時的填補詞。日本人聽到全名時常搞不清哪個是姓，因此有此問法。<br>▸ <b>比較</b>：何（なに）さんですか（姓什麼）／お名前（なまえ）は？（大名是）／どちら様（さま）ですか（哪位・最禮貌）。<br><span class=\"n4\">N4 會考疑問詞的組合用法</span>"],["A","若林。若林禎彦です。","Wakabayashi. Wakabayashi Yoshihiko desu.","若林，是若林禎彥。","▸ <b>句型</b>：【名詞單獨＋全名複述】。<br>▸ <b>變化</b>：只說「若林（わかばやし）」（姓）→ 再說「若林禎彦（わかばやしさだひこ）です」（全名）。<br>▸ <b>用法</b>：先單獨說姓、再說全名，是澄清姓名時的自然做法。<br>▸ <b>比較</b>：若林（わかばやし）（只有姓）／若林禎彦（わかばやしさだひこ）（姓＋名，中間<b>不加空格或の</b>）。<br><span class=\"n4\">N4 會考日本人姓名的結構</span>"]]},{"name":"確認地點","lines":[["A","私は東京の高田馬場駅の近くに住んでいます。","Watashi wa Tōkyō no Takadanobaba-eki no chikaku ni sunde imasu.","我住在東京的高田馬場車站附近。","▸ <b>句型</b>：【場所＋に＋住んでいます】＋【の的層層修飾】。<br>▸ <b>變化</b>：住（す）む → 住んで（む結尾→んで）＋います＝<b>持續居住的狀態</b>（不是正在進行）。<br>▸ <b>用法</b>：居住地用<b>に</b>；「東京（とうきょう）の高田馬場駅（たかだのばばえき）の近（ちか）く」由大到小用の串接。<br>▸ <b>比較</b>：住（す）んでいます（狀態・現在住）／住みます（未來・要住）。「住む」<b>幾乎總是用ています形</b>。<br><span class=\"n4\">N4 必考：ている 表狀態而非進行的動詞（住む・結婚する・知る）</span>"],["B","どちらに住んでいるんですか？","Dochira ni sunde iru n desu ka?","你剛說你住在哪裡？","▸ <b>句型</b>：【どちら】禮貌疑問詞＋【〜んですか】關心語氣。<br>▸ <b>變化</b>：住（す）んでいる ＋ <b>のですか</b> → 口語縮約 <b>んですか</b>。<br>▸ <b>用法</b>：「〜んですか」帶有「我很在意、想確認」的語氣；單說「住（す）んでいますか」則平淡無情緒。<br>▸ <b>比較</b>：〜んですか（關心・確認）／〜ますか（單純提問）／〜んですね（確認自己的理解）。<br><span class=\"n4\">N4 必考：のだ／んだ 的說明・確認功能</span>"],["A","高田馬場駅の近くです。東京にあります。","Takadanobaba-eki no chikaku desu. Tōkyō ni arimasu.","高田馬場車站的附近。在東京。","▸ <b>句型</b>：【場所＋にあります】存在句。<br>▸ <b>變化</b>：ある → あります；無生命物體、地點用<b>ある</b>，人與動物用<b>いる</b>。<br>▸ <b>用法</b>：地名、建築物的存在用「〜にあります」；也可說「〜です」（高田馬場駅（たかだのばばえき）の近（ちか）くです）。<br>▸ <b>比較</b>：東京（とうきょう）にあります（物・地點）／東京にいます（人在東京）。搞錯會很不自然。<br><span class=\"n4\">N4 必考：ある／いる 的使用對象</span>"],["B","ああ、そうですか！","Ā, sō desu ka!","啊，是這樣啊！","▸ <b>句型</b>：【そうですか】＋感嘆語調。<br>▸ <b>變化</b>：そうです ＋ か；加上「！」表恍然大悟。<br>▸ <b>用法</b>：得知新資訊時的自然反應；語調上揚並拉長則表驚訝。<br>▸ <b>比較</b>：そうですか（理解）／そうなんですか（更驚訝）／そうですね（同意或思考）。<br><span class=\"n4\">N4 聽解必考：應答詞的語調功能</span>"]]},{"name":"確認詞義（1）","lines":[["A","「スト」とはどういう意味ですか？","'Suto' to wa dō iu imi desu ka?","「スト」是什麼意思？","▸ <b>句型</b>：【〜とはどういう意味ですか】詢問字義的固定句型。<br>▸ <b>變化</b>：と（引用）＋は（主題）＝<b>とは</b>，用來提示被定義的詞語。<br>▸ <b>用法</b>：「スト」是「ストライキ」的縮略，日語外來語常縮成2〜4音節。<br>▸ <b>比較</b>：〜とはどういう意味（いみ）ですか（問字義・最標準）／〜って何（なん）ですか（口語）／〜の意味を教（おし）えてください（也可）。<br><span class=\"n4\">N4 必考：とは 的定義提示用法</span>"],["B","英語で「ストライキ」のことです。","Eigo de 'sutoraiki' no koto desu.","是英文『strike（罷工）』的意思。","▸ <b>句型</b>：【〜で】表手段・語言＋【〜のことです】說明。<br>▸ <b>變化</b>：「英語（えいご）<b>で</b>」＝用英語（手段）；「〜のことです」＝指的就是…。<br>▸ <b>用法</b>：解釋詞義的三種說法：〜のことです（指某事物）／〜という意味（いみ）です（意思是）／〜ということです（換句話說）。<br>▸ <b>比較</b>：英語（えいご）で（用英語）／英語を（把英語當受詞）／英語が（英語當主語）。<br><span class=\"n4\">N4 必考：で 表手段的用法</span>"],["A","ああ、わかりました。","Ā, wakarimashita.","啊，我明白了。","▸ <b>句型</b>：【動詞過去式表理解成立】。<br>▸ <b>變化</b>：わかる → わかりました（丁寧過去）／わかった（常體過去）。<br>▸ <b>用法</b>：日語用過去式表達「此刻理解了」；「ああ」表恍然大悟。<br>▸ <b>比較</b>：わかりました（我懂了）／わかっています（我早就知道，語氣可能不耐煩）／知（し）りません（我不知道，略冷淡）。<br><span class=\"n4\">N4 必考：わかる／知る 的語意差異</span>"]]},{"name":"確認詞義（2）","lines":[["A","もし質問がありましたら、紀之に聞いてください。彼は我々のプロです。","Moshi shitsumon ga arimashitara, Noriyuki ni kiite kudasai. Kare wa wareware no puro desu.","如果有問題的話，請教紀之，他是我們的專家（puro）。","▸ <b>句型</b>：【もし〜ましたら】假設＋【〜に聞いてください】。<br>▸ <b>變化</b>：あります → <b>ありましたら</b>（ます形的たら形，鄭重）；普通說法為「あったら」。<br>▸ <b>用法</b>：<b>もし</b>與條件形呼應，強調這是假設；「我々（われわれ）」是「私（わたし）たち」的鄭重說法。詢問對象用<b>に</b>。<br>▸ <b>比較</b>：ありましたら（鄭重）／あったら（一般）／あれば（書面・條件強調）。<br><span class=\"n4\">N4 必考：たら形的三種鄭重度</span>"],["B","すみません、「プロ」とはどういう意味ですか？","Sumimasen, 'puro' to wa dō iu imi desu ka?","對不起，puro是什麼意思？","▸ <b>句型</b>：【〜とはどういう意味ですか】。<br>▸ <b>變化</b>：プロ ＝ プロフェッショナル（professional）的縮略。<br>▸ <b>用法</b>：聽到不懂的外來語縮略詞時，用這句詢問最自然、也最不失禮。<br>▸ <b>比較</b>：プロ（專業人士）／アマ（業餘）／リハ（リハーサル・排練）。日語大量使用這種縮略。<br><span class=\"n4\">N4 必考：外來語縮略詞（コンビニ・スマホ・バイト）</span>"],["A","「専門家」ということです。","'Senmonka' to iu koto desu.","就是「專家」的意思。","▸ <b>句型</b>：【〜ということです】換句話說。<br>▸ <b>變化</b>：という（＝と言（い）う）＋こと（形式名詞）＋です＝「就是…的意思」。<br>▸ <b>用法</b>：用來解釋、換句話說；也可表傳聞（〜だそうです的書面版）。<br>▸ <b>比較</b>：〜ということです（解釋或傳聞）／〜のことです（指某具體事物）／〜という意味（いみ）です（明確指字義）。<br><span class=\"n4\">N4 必考：ということ 的名詞化功能</span>"]]}]},"5":{"title":"致謝","jp_title":"お礼を言う","theme":"感謝與答謝的表達","scenes":[{"name":"感謝幫忙（1）","lines":[["A","お手伝っていただき、ありがとうございました。","Otetsudatte itadaki, arigatō gozaimashita.","謝謝您的幫忙。","▸ <b>句型</b>：【〜ていただく】謙讓＋【鄭重中止形】＋【過去式道謝】。<br>▸ <b>變化</b>：手伝（てつだ）う → 手伝って ＋ <b>いただく</b>（もらう的謙讓語）→ いただ<b>き</b>（ます形去ます的中止形，正式）。<br>▸ <b>用法</b>：「〜ていただき、ありがとうございました」是最標準的正式道謝結構——先說感謝的內容，再道謝。<br>▸ <b>比較</b>：〜ていただき（正式中止）／〜ていただいて（一般て形）／〜ていただきまして（更鄭重）。<br><span class=\"n4\">N4 必考：〜ていただく 的謙讓授受</span>"],["B","どういたしまして。","Dō itashimashite.","不客氣。","▸ <b>句型</b>：【どういたしまして】回應道謝的固定語。<br>▸ <b>變化</b>：どう（如何）＋いたす（する的謙讓語）＋まして＝「我做了什麼呢（其實沒什麼）」。<br>▸ <b>用法</b>：現代日語中略顯生硬，更常說「いいえ」「とんでもないです」「こちらこそ」。<br>▸ <b>比較</b>：どういたしまして（標準）／とんでもないです（哪裡的話）／お役（やく）に立（た）ててよかったです（能幫上忙真好）。<br><span class=\"n4\">N4 會考回應道謝的各種說法</span>"]]},{"name":"感謝幫忙（2）","lines":[["A","きのうは手伝っていただいて、ありがとうございました。","Kinō wa tetsudatte itadaite, arigatō gozaimashita.","多謝你昨天的幫忙。","▸ <b>句型</b>：【時間＋は】對比主題＋【〜ていただいて】＋【過去式道謝】。<br>▸ <b>變化</b>：手伝（てつだ）う → 手伝って ＋ いただいて（て形，表原因）。<br>▸ <b>用法</b>：「きのう<b>は</b>」用は提示話題並帶對比（相對於今天）；具體說明感謝的事由比單說謝謝更有誠意。<br>▸ <b>比較</b>：きのうは（提示・對比）／きのう（單純時間）。加は就有「特別針對昨天那件事」的意味。<br><span class=\"n4\">N4 必考：は 的對比功能</span>"],["B","どういたしまして。お手伝いができてうれしいです。","Dō itashimashite. Otetsudai ga dekite ureshii desu.","不客氣，很高興能夠幫得上忙。","▸ <b>句型</b>：【お＋名詞＋ができる】謙讓可能＋【て形表原因】。<br>▸ <b>變化</b>：手伝（てつだ）う → <b>お手伝（てつだ）い</b>（名詞化）→ お手伝いができる → お手伝いができて＋うれしいです。<br>▸ <b>用法</b>：把自己的幫忙謙遜地表達；也常說「お役（やく）に立（た）てて（能派上用場）」。<br>▸ <b>比較</b>：お手伝（てつだ）いができて（能幫忙）／手伝えて（一般可能形）／お役（やく）に立（た）てて（能有幫助・更文雅）。<br><span class=\"n4\">N4 必考：名詞＋ができる 表能力・可能</span>"]]},{"name":"感謝支持","lines":[["A","慈善バザーでお手伝いしていただきまして、本当にありがとうございました。","Jizen bazā de otetsudai shite itadakimashite, hontō ni arigatō gozaimashita.","慈善義賣的事真的很謝謝你的幫忙。","▸ <b>句型</b>：【場所＋で】＋【お＋ます形＋する＋ていただく】＋【鄭重て形】。<br>▸ <b>變化</b>：いただいて → <b>いただきまして</b>（ます形＋て，最鄭重的中止形）。<br>▸ <b>用法</b>：「〜でお手伝（てつだ）いしていただきまして」——活動場所用<b>で</b>；層層敬語顯示高度謝意。<br>▸ <b>比較</b>：いただいて（一般）／いただき（正式中止）／いただきまして（最鄭重）。<br><span class=\"n4\">N4 讀解會出現多層敬語的正式文體</span>"],["B","たいしたことないですよ。私も楽しかったです。","Taishita koto nai desu yo. Watashi mo tanoshikatta desu.","沒什麼啦，我也很開心。","▸ <b>句型</b>：【たいしたことない】謙虛＋【も】表同樣。<br>▸ <b>變化</b>：たいした（連體詞，只接名詞）＋こと＋ない ＝ 沒什麼大不了；丁寧形加です。<br>▸ <b>用法</b>：日語接受感謝時<b>習慣先謙虛</b>，再補上自己也很開心，比直接說「不客氣」更自然。<br>▸ <b>比較</b>：たいしたことないです（沒什麼）／とんでもないです（哪裡的話）／いえいえ（不不）。<br><span class=\"n4\">N4 會考「たいした＋名詞＋ない」的呼應</span>"],["A","本当にありがとうございました。","Hontō ni arigatō gozaimashita.","真的很謝謝你。","▸ <b>句型</b>：【副詞本当に＋過去式道謝】。<br>▸ <b>變化</b>：本当（ほんとう）だ（な形容詞）→ <b>本当に</b>（副詞形，な形容詞的副詞形是に）。<br>▸ <b>用法</b>：重複道謝加強誠意，是日語禮儀常見的做法。<br>▸ <b>比較</b>：本当（ほんとう）に（真的・な形容詞副詞形）／楽（たの）しく（い形容詞副詞形是く）／静（しず）かに（な形容詞→に）。<br><span class=\"n4\">N4 必考：形容詞的副詞形（〜く／〜に）</span>"]]},{"name":"感謝送車","lines":[["A","健一郎、乗せてくれてありがとう。","Kenichirō, nosete kurete arigatō.","健一郎，謝謝你載我一程。","▸ <b>句型</b>：【〜てくれて＋ありがとう】說明感謝內容。<br>▸ <b>變化</b>：乗（の）せる（他動詞・讓人搭乘）→ 乗せて ＋ <b>くれて</b>（對方為我做，て形表原因）。<br>▸ <b>用法</b>：對熟人道謝時用「〜てくれてありがとう」；對上位者則用「〜ていただきありがとうございました」。<br>▸ <b>比較</b>：乗（の）せる（他動詞・載人）／乗る（自動詞・搭乘）。「車（くるま）に乗る」vs「人（ひと）を乗せる」。<br><span class=\"n4\">N4 必考：自他動詞配對（乗る／乗せる）</span>"],["B","たいしたことないさ。役に立ててうれしいよ。","Taishita koto nai sa. Yaku ni tatete ureshii yo.","那沒什麼，很高興能幫得上忙。","▸ <b>句型</b>：【慣用句的可能形＋て】＋【男性終助詞】。<br>▸ <b>變化</b>：役（やく）に立（た）つ（慣用語・有用）→ 可能形<b>役に立てる</b> → 役に立てて（て形表原因）。<br>▸ <b>用法</b>：「役（やく）に立（た）つ」的主語是「東西或人有用」；句尾「さ・よ」是男性的隨性語氣。<br>▸ <b>比較</b>：役（やく）に立（た）つ（有用）／役に立てる（能有用・可能形）／役に立てる（他動詞「立（た）てる」則是另一個詞）。<br><span class=\"n4\">N4 必考：慣用句的可能形變化</span>"]]}]},"6":{"title":"表現好惡","jp_title":"好き嫌いを言う","theme":"表達喜歡和討厭","scenes":[{"name":"詢問喜好（運動）","lines":[["A","スポーツは好きですか？","Supōtsu wa suki desu ka?","你喜歡運動嗎？","▸ <b>句型</b>：【〜は〜が好きですか】好惡句型。<br>▸ <b>變化</b>：好（す）きだ（<b>な形容詞</b>，不是動詞）→ 好きです → 好きですか。<br>▸ <b>用法</b>：喜歡的<b>對象用が</b>（不是を）；這裡用「スポーツは」提示話題，形成「〜は〜が好（す）き」的雙助詞結構。<br>▸ <b>比較</b>：好（す）き・嫌（きら）い・上手（じょうず）・下手（へた）・得意（とくい）・苦手（にがて）— <b>全部用が</b>標示對象，是 N4 高頻考點。<br><span class=\"n4\">N4 必考：〜が好きです（不可用を）</span>"],["B","ええ。とくに団体競技が好きです。野球やバスケットボールが一番好きです。","Ē. Toku ni dantai kyōgi ga suki desu. Yakyū ya basukettobōru ga ichiban suki desu.","喜歡，尤其是團體運動。我最喜歡棒球和籃球。","▸ <b>句型</b>：【とくに】強調＋【や】部分列舉＋【一番＋形容詞】最高級。<br>▸ <b>變化</b>：好（す）き → <b>一番（いちばん）</b>好き（最喜歡）；比較兩者則用「〜より〜のほうが好き」。<br>▸ <b>用法</b>：<b>や</b>只列舉代表例（還有其他），<b>と</b>則是全部列舉；「団体競技（だんたいきょうぎ）」＝團體運動。<br>▸ <b>比較</b>：AやB（A、B之類的）／AとB（就A和B）／AとかBとか（口語的や）。<br><span class=\"n4\">N4 必考：や／と 的列舉差異</span>"]]},{"name":"詢問喜好（足球）","lines":[["A","どんなスポーツが好きですか？","Donna supōtsu ga suki desu ka?","你喜歡什麼運動？","▸ <b>句型</b>：【どんな＋名詞＋が好きですか】。<br>▸ <b>變化</b>：どんな（連體詞）<b>必接名詞</b>；問方法則用「どうやって」，問樣子用「どう」。<br>▸ <b>用法</b>：詢問偏好的種類、性質時用どんな。<br>▸ <b>比較</b>：どんな音楽（おんがく）（什麼樣的音樂）／どの音楽（哪一首・限定範圍內）／何（なん）の音楽（什麼類別的音樂）。<br><span class=\"n4\">N4 必考：どんな／どの／何の 的區別</span>"],["B","フットボールを見るのが好きですが、他のスポーツには興味がありません。","Futtobōru wo miru no ga suki desu ga, hoka no supōtsu ni wa kyōmi ga arimasen.","我喜歡看足球，其他運動就沒什麼興趣。","▸ <b>句型</b>：【動詞＋の】名詞化＋【〜には】對比＋【興味がある】。<br>▸ <b>變化</b>：見（み）る → 見る<b>の</b>（名詞化）→ 見るのが好（す）きです。動詞不能直接接「が好き」，<b>必須先用の或こと名詞化</b>。<br>▸ <b>用法</b>：「他（ほか）のスポーツ<b>には</b>」＝に＋は，用は表對比；「興味（きょうみ）がある」的對象也用が。<br>▸ <b>比較</b>：見（み）るのが好（す）き（口語常用）／見ることが好き（略書面）。兩者皆可，の更自然。<br><span class=\"n4\">N4 必考：動詞名詞化（の／こと）</span>"]]},{"name":"詢問喜好（音樂）","lines":[["A","どんな音楽が好きですか？","Donna ongaku ga suki desu ka?","你喜歡什麼音樂？","▸ <b>句型</b>：【どんな＋名詞＋が好きですか】。<br>▸ <b>變化</b>：どんな＋音楽（おんがく）（連體詞修飾名詞）。<br>▸ <b>用法</b>：這是詢問喜好最常用的句型，回答時用「〜が好（す）きです」對應。<br>▸ <b>比較</b>：どんな音楽（おんがく）が好（す）きですか（問類型）／音楽が好きですか（問是否喜歡）。有無どんな差別很大。<br><span class=\"n4\">N4 必考：疑問詞的位置與對應助詞</span>"],["B","ジャズが大好きです。","Jazu ga daisuki desu.","我最喜歡爵士樂。","▸ <b>句型</b>：【大＋な形容詞】程度加強。<br>▸ <b>變化</b>：好（す）き → <b>大（だい）</b>好き（非常喜歡）；嫌（きら）い → 大嫌（だいきら）い（非常討厭）。<br>▸ <b>用法</b>：「大好（だいす）き」比「とても好き」更口語、更強烈；不可說「×とても大好き」（重複）。<br>▸ <b>比較</b>：好（す）き＜すごく好き＜大好（だいす）き。否定則是：嫌（きら）い＞あまり好きじゃない（委婉）。<br><span class=\"n4\">N4 會考程度表現的強弱排序</span>"],["A","私もです。高校時代からジャズのCDを集めています。","Watashi mo desu. Kōkō jidai kara jazu no CD wo atsumete imasu.","我也是。從高中開始我就一直在收集爵士樂的CD。","▸ <b>句型</b>：【私もです】省略＋【〜から〜ています】持續。<br>▸ <b>變化</b>：集（あつ）める → 集めて＋<b>います</b> ＝ 從過去持續到現在的動作。<br>▸ <b>用法</b>：起點用<b>から</b>（高校時代（こうこうじだい）から）；「私（わたし）もです」省略了述語，用も表相同。<br>▸ <b>比較</b>：集（あつ）めています（持續至今）／集めました（過去完成）／集めていました（過去某段時間持續，現已停止）。<br><span class=\"n4\">N4 必考：〜から〜ている 的持續用法</span>"]]},{"name":"食物喜好","lines":[["A","イタリア料理は好きですか？","Itaria ryōri wa suki desu ka?","你喜歡義大利菜嗎？","▸ <b>句型</b>：【〜は好きですか】用は提示話題。<br>▸ <b>變化</b>：好（す）きだ（な形容詞）→ 好きです → 好きですか。<br>▸ <b>用法</b>：把特定事物用<b>は</b>提出來問，比「イタリア料理（りょうり）が好（す）きですか」更自然（が用於強調或回答疑問詞）。<br>▸ <b>比較</b>：イタリア料理（りょうり）は好（す）きですか（話題提示）／何（なに）が好きですか（疑問詞用が）。<br><span class=\"n4\">N4 必考：は 提示話題／が 提供新資訊</span>"],["B","大好きです。","Daisuki desu.","很喜歡啊！","▸ <b>句型</b>：【省略主語與對象的回答】。<br>▸ <b>變化</b>：（イタリア料理（りょうり）が）大好（だいす）きです — 主語與對象都省略。<br>▸ <b>用法</b>：日語回答時只留下核心述語是最自然的，補齊反而累贅。<br>▸ <b>比較</b>：大好（だいす）きです（很喜歡）／好（す）きです（喜歡）／まあまあです（還可以）／あまり…（委婉的不喜歡）。<br><span class=\"n4\">N4 聽解必考：省略句的還原</span>"],["A","じゃあ夕食は「ナポリ」に行きましょう。","Jā yūshoku wa 'Napori' ni ikimashō.","那麼晚餐就去「拿波里」吃吧！","▸ <b>句型</b>：【じゃあ】承接＋【〜に行きましょう】提議。<br>▸ <b>變化</b>：では → じゃあ（口語）；行（い）く → 行きます → 行き<b>ましょう</b>。<br>▸ <b>用法</b>：目的地用<b>に</b>（也可用へ）；「夕食（ゆうしょく）は」用は提示話題。<br>▸ <b>比較</b>：〜に行（い）きましょう（提議一起去）／〜に行きませんか（客氣地邀約）／〜に行こう（常體提議）。<br><span class=\"n4\">N4 必考：ましょう／ませんか 的邀約差異</span>"]]},{"name":"電影喜好","lines":[["A","私は映画が大好きです。毎週映画館に見に行きます。","Watashi wa eiga ga daisuki desu. Maishū eigakan ni mi ni ikimasu.","我最喜歡看電影。每個禮拜都會去電影院看。","▸ <b>句型</b>：【〜が大好きです】＋【ます形＋に＋行きます】表目的。<br>▸ <b>變化</b>：見（み）る → 見ます → 見<b>に</b>行（い）きます（去做某事）。動詞ます形去ます＋に＋移動動詞。<br>▸ <b>用法</b>：「映画館（えいがかん）に見（み）に行（い）きます」——前面的に是目的地，後面的<b>に是目的</b>，同一句兩個に功能不同。<br>▸ <b>比較</b>：見（み）に行（い）く（去看）／買（か）いに行く（去買）／食（た）べに行く（去吃）。<b>する動詞</b>則是「買（か）い物（もの）に行く」。<br><span class=\"n4\">N4 必考：ます形＋に＋行く／来る（目的）</span>"],["B","まあ！私も映画が好きです。でも、私は家でビデオを見るんです。","Maa! Watashi mo eiga ga suki desu. Demo, watashi wa ie de bideo wo miru n desu.","嗯！我也喜歡看電影。但是我都在家裡看錄影帶。","▸ <b>句型</b>：【でも】逆接＋【場所＋で】＋【〜んです】說明。<br>▸ <b>變化</b>：見（み）る → 見る＋<b>んです</b>（＝のです，說明自己的情況）。<br>▸ <b>用法</b>：「家（いえ）<b>で</b>」動作場所用で（存在場所用に）；「〜んです」帶有補充說明、對比的語氣。<br>▸ <b>比較</b>：家（いえ）で見（み）ます（單純陳述）／家で見るんです（說明・強調我是這樣的）。<br><span class=\"n4\">N4 必考：で（動作場所）vs に（存在場所）</span>"],["A","そう、私は映画館で見る方が好きですね。","Sō, watashi wa eigakan de miru hō ga suki desu ne.","喔，我比較喜歡到電影院看。","▸ <b>句型</b>：【〜方が好き】比較偏好＋【動詞修飾方】。<br>▸ <b>變化</b>：見（み）る → 見る<b>方（ほう）</b>（這一邊）→ 見る方が好（す）き。動詞普通形<b>直接</b>修飾「方」。<br>▸ <b>用法</b>：兩者比較時用「AよりBの方（ほう）が〜」；此處省略了「家（いえ）で見（み）るより」。<br>▸ <b>比較</b>：〜方（ほう）がいい（比較好・建議）／〜方が好（す）き（比較喜歡）／〜より〜（比起…）。<br><span class=\"n4\">N4 必考：〜より〜の方が 比較句型</span>"]]}]},"7":{"title":"表達需求及希望","jp_title":"欲求・希望の言い方","theme":"表達欲求、願望和需要","scenes":[{"name":"想喝東西","lines":[["A","ああ、のどがかわいた。何か冷たい物がほしいな。","Ā, nodo ga kawaita. Nani ka tsumetai mono ga hoshii na.","啊，口好渴，真想喝個涼的啊！","▸ <b>句型</b>：【慣用句のどがかわく】＋【〜がほしい】＋【な】自語。<br>▸ <b>變化</b>：かわく → <b>かわいた</b>（過去式）；日語用過去式表<b>現在已成立的狀態</b>（口渴了）。<br>▸ <b>用法</b>：「〜がほしい」想要之物用<b>が</b>；「何（なに）か冷（つめ）たい物（もの）」＝某種冰涼的東西，何か表不特定。<br>▸ <b>比較</b>：〜がほしい（想要東西）／〜たい（想做動作）／〜てほしい（希望對方做）。三者<b>不可混用</b>。<br><span class=\"n4\">N4 必考：ほしい／たい／てほしい 的區別</span>"],["B","オレンジジュースはどう？","Orenji jūsu wa dō?","來杯柳橙汁怎麼樣？","▸ <b>句型</b>：【〜はどう？】提議＋省略。<br>▸ <b>變化</b>：どうですか → どう？（常體，省略ですか）。<br>▸ <b>用法</b>：用<b>は</b>提示提案的對象；後面省略了「どうですか（如何）」的丁寧部分。<br>▸ <b>比較</b>：〜はどう？（提議）／〜はいかがですか（敬語提議）／〜にしませんか（更客氣的邀約）。<br><span class=\"n4\">N4 必考：いかが 是 どう 的敬語</span>"],["A","はい、いただきます。","Hai, itadakimasu.","好，謝謝。","▸ <b>句型</b>：【いただきます】謙讓語。<br>▸ <b>變化</b>：もらう・食（た）べる・飲（の）む → <b>いただく</b>（一個詞對應三個動詞）→ いただきます。<br>▸ <b>用法</b>：接受他人給予的東西時說；用餐前的「いただきます」也是同一個詞。<br>▸ <b>比較</b>：いただきます（謙讓・我接受／吃）／くださる（尊敬・對方給我）／差（さ）し上（あ）げる（謙讓・我給對方）。<br><span class=\"n4\">N4 必考：いただく 對應 もらう・食べる・飲む</span>"]]},{"name":"想吃東西","lines":[["A","夕食、何がいいですか？","Yūshoku, nani ga ii desu ka?","晚餐吃什麼好呢？","▸ <b>句型</b>：【疑問詞＋が＋いいですか】徵詢意見。<br>▸ <b>變化</b>：いい → いいですか；疑問詞當主語時<b>必須用が</b>。<br>▸ <b>用法</b>：「夕食（ゆうしょく）、」後面省略了助詞は；口語常省略助詞。<br>▸ <b>比較</b>：何（なに）がいいですか（哪個好・徵詢）／何にしますか（要選哪個・決定）／何が食（た）べたいですか（想吃什麼）。<br><span class=\"n4\">N4 必考：疑問詞＋が（不可用は）</span>"],["B","ピザが食べたい気分です。","Piza ga tabetai kibun desu.","我想吃披薩。","▸ <b>句型</b>：【〜たい】希望＋【気分です】委婉。<br>▸ <b>變化</b>：食（た）べる → 食べます → 食べ<b>たい</b> → 食べたい気分（きぶん）（たい形<b>像い形容詞</b>，可直接修飾名詞）。<br>▸ <b>用法</b>：加上「気分（きぶん）です」比直接說「食（た）べたいです」委婉，語氣像「有點想吃」。<br>▸ <b>比較</b>：食（た）べたいです（直說）／食べたい気分（きぶん）です（委婉）／食べたくないです（たい的否定＝たくない）。<br><span class=\"n4\">N4 必考：たい形當い形容詞活用（たかった／たくない）</span>"],["A","じゃあ、イタリア料理の店に行きましょう。","Jā, Itaria ryōri no mise ni ikimashō.","那我們去吃義大利料理！","▸ <b>句型</b>：【じゃあ】承接＋【の修飾】＋【〜に行きましょう】。<br>▸ <b>變化</b>：イタリア料理（りょうり）<b>の</b>店（みせ）＝義大利菜的店（名詞修飾名詞用の）。<br>▸ <b>用法</b>：目的地用に；「ましょう」表提議一起行動。<br>▸ <b>比較</b>：イタリア料理（りょうり）の店（みせ）（名詞＋の＋名詞）／イタリアンレストラン（外來語）。日語兩種說法都常見。<br><span class=\"n4\">N4 必考：の 連接名詞的功能</span>"]]},{"name":"點餐","lines":[["A","ご注文はお決まりですか。","Gochūmon wa okimari desu ka.","決定好要點什麼了嗎？","▸ <b>句型</b>：【ご＋名詞】尊敬＋【お＋ます形＋です】尊敬語狀態。<br>▸ <b>變化</b>：決（き）まる → <b>お決まり</b>（お＋ます形）＋です＝尊敬語的狀態表現，等於「決まりましたか」。<br>▸ <b>用法</b>：服務業常用「お＋ます形＋です」形式（お帰（かえ）りですか／お出（で）かけですか）。「ご注文（ちゅうもん）」漢語名詞加ご。<br>▸ <b>比較</b>：お決（き）まりですか（尊敬・店員問）／決めましたか（一般）／お決めになりましたか（也是尊敬語）。<br><span class=\"n4\">N4 必考：お＋ます形＋です 的尊敬用法</span>"],["B","はい。オニオンスープとステーキディナーをお願いします。","Hai. Onion sūpu to sutēki dinā wo onegai shimasu.","是的，我要洋蔥湯和牛排。","▸ <b>句型</b>：【AとB】全部列舉＋【〜をお願いします】。<br>▸ <b>變化</b>：願（ねが）う → お願いします（謙讓語，已慣用化）。<br>▸ <b>用法</b>：點餐時「〜をお願（ねが）いします」或「〜をください」皆可，前者更禮貌；並列品項用<b>と</b>。<br>▸ <b>比較</b>：〜をお願（ねが）いします（禮貌）／〜をください（一般）／〜にします（決定選…）。<br><span class=\"n4\">N4 必考：點餐三種說法的差異</span>"],["A","オニオンスープとステーキディナーですね。かしこまりました。","Onion sūpu to sutēki dinā desu ne. Kashikomarimashita.","洋蔥湯和牛排。好的。","▸ <b>句型</b>：【〜ですね】複誦確認 ＋【かしこまりました】服務業最高敬語。<br>▸ <b>逐詞拆解</b>：<b>オニオンスープとステーキディナーですね</b>＝複誦點單內容＋<b>ね</b>（向對方確認「是這樣沒錯吧」）；<b>かしこまりました</b>＝動詞「かしこまる」（恭敬地接受）的過去式，已固定為服務業用語。<br>▸ <b>句型公式</b>：<b>［複誦內容］ですね。かしこまりました。</b>＝這是日本服務業<b>接單的標準兩段式</b>：先複誦確認、再表示接受。例：<b>コーヒーを2つ（ふたつ）ですね。かしこまりました。</b><br>▸ <b>用法</b>：「かしこまりました」只用於<b>服務業對顧客</b>，一般職場對上司說「承知（しょうち）しました」，對同事、下屬說「了解（りょうかい）しました」。用錯層級會顯得奇怪。<br>▸ <b>比較</b>：敬意階梯：わかりました ＜ 了解（りょうかい）しました（對平輩・下屬）＜ 承知（しょうち）しました（對上司・客戶）＜ <b>かしこまりました</b>（服務業對顧客）。注意<b>「了解しました」對上司略失禮</b>，是職場常見錯誤。<br><span class=\"n4\">N4 必考：了解／承知／かしこまる 的使用對象</span>"]]},{"name":"加點","lines":[["A","他に何かいりますか。","Hoka ni nani ka irimasu ka.","其他還需要些什麼嗎？","▸ <b>句型</b>：【他に】＋【何か】不特定＋【いる】需要。<br>▸ <b>變化</b>：いる（需要，<b>一類動詞</b>）→ いります／いりません。注意與「いる（在，二類）」同音<b>但活用不同</b>。<br>▸ <b>用法</b>：需要的東西用<b>が</b>（何（なに）かいりますか）；「他（ほか）に」＝其他還有。<br>▸ <b>比較</b>：要（い）る（需要・一類：いります）／居（い）る（在・二類：います）。這是 N4 著名的同音陷阱。<br><span class=\"n4\">N4 必考：要る／居る 的活用差異</span>"],["B","はい、デザートをお願いします。","Hai, dezāto wo onegai shimasu.","是的，我要點心。","▸ <b>句型</b>：【〜をお願いします】追加點單。<br>▸ <b>變化</b>：デザート（dessert）＋を＋お願（ねが）いします。<br>▸ <b>用法</b>：回答「他（ほか）に何（なに）かいりますか」時，用「はい」後接具體項目。<br>▸ <b>比較</b>：〜をお願（ねが）いします（要）／けっこうです（不用了・婉拒）／以上（いじょう）です（就這些）。<br><span class=\"n4\">N4 會考點餐對話的完整流程</span>"],["A","こちらがメニューです。","Kochira ga menyū desu.","請看菜單。","▸ <b>句型</b>：【こちらが〜です】用が提示新出現的事物。<br>▸ <b>變化</b>：こちら（這邊・這個，禮貌）＋<b>が</b>（提示新資訊）。<br>▸ <b>用法</b>：服務業遞東西時的固定說法；用<b>が</b>而非は，因為菜單是剛出現的新資訊。<br>▸ <b>比較</b>：こちらがメニューです（遞出時）／メニューはこちらです（指示位置）。助詞位置改變焦點。<br><span class=\"n4\">N4 必考：が／は 對焦點的影響</span>"]]},{"name":"訂位","lines":[["A","いらっしゃいませ。","Irasshaimase.","歡迎光臨。","▸ <b>句型</b>：【いらっしゃいませ】迎客語。<br>▸ <b>變化</b>：いらっしゃる → 命令形いらっしゃい ＋ ませ（最鄭重）。<br>▸ <b>用法</b>：顧客<b>不需回應</b>，直接說出自己的需求即可。<br>▸ <b>比較</b>：いらっしゃいませ（店家）／お待（ま）たせしました（讓您久等了）／ただいま参（まい）ります（馬上來）。<br><span class=\"n4\">N4 會考接客用語的固定搭配</span>"],["B","予約をしたはずなのですが。","Yoyaku wo shita hazu na no desu ga.","我應該有訂位。","▸ <b>句型</b>：【〜はずです】有根據的推斷 ＋【な】＋【のですが】留白。<br>▸ <b>逐詞拆解</b>：<b>予約（よやく）をした</b>＝動詞普通形過去；<b>はず</b>＝形式名詞，「理應、應該」（有依據的判斷）；<b>な</b>＝はず是<b>名詞性質</b>，後接のです要加な（はず<b>な</b>のです）；<b>のですが</b>＝說明＋が留白。<br>▸ <b>句型公式</b>：<b>［普通形］＋はずです</b>＝按理應該…。名詞・な形容詞要加<b>な</b>：<b>学生（がくせい）のはず／便利（べんり）なはず</b>。例：<b>彼（かれ）は来（く）るはずです</b>（他應該會來）／<b>もう届（とど）いているはずです</b>（應該已經送到了）。<br>▸ <b>用法</b>：本句的精髓在<b>句尾的が</b>——說「我應該有訂位<b>，可是</b>…」，把「但你們好像沒找到」留給對方去理解，避免直接指責店家。這是日語溝通的典型策略。<br>▸ <b>比較</b>：<b>はず</b>（有客觀依據・我訂了所以應該有）／<b>でしょう</b>（單純推測）／<b>かもしれない</b>（可能性低）／<b>にちがいない</b>（幾乎確定）。另：<b>〜はずがない</b>＝不可能（強烈否定）。<br><span class=\"n4\">N4 必考：〜はずだ／〜はずがない 的接續與語意</span>"],["A","はい、こちらへどうぞ。","Hai, kochira e dōzo.","好的，這邊請。","▸ <b>句型</b>：【方向＋へ】＋【どうぞ】省略。<br>▸ <b>變化</b>：こちら＋<b>へ</b>（方向）；後面省略了「お越（こ）しください」或「どうぞ」的動詞部分。<br>▸ <b>用法</b>：帶路時的固定說法；<b>へ</b>強調朝向，比に更適合引導。<br>▸ <b>比較</b>：こちらへどうぞ（請往這邊）／こちらです（在這邊）／こちらになります（服務業慣用，語法上被視為冗贅）。<br><span class=\"n4\">N4 必考：へ 表方向、に 表到達點</span>"]]},{"name":"願望（未來志向）","lines":[["A","大きくなったら何になりたいの？","Ōkiku nattara nani ni naritai no?","你長大了想做什麼？","▸ <b>句型</b>：【い形容詞副詞形＋なる】＋【たら】條件＋【〜になりたい】。<br>▸ <b>變化</b>：大（おお）きい → <b>大きく</b>（副詞形）＋なる（變化）→ 大きくなった → <b>大きくなったら</b>（た形＋ら）。<br>▸ <b>用法</b>：變化的結果用<b>に</b>（何（なに）になりたい）；「〜の？」是常體的關心式疑問。<br>▸ <b>比較</b>：大（おお）きくなる（い形容詞→く＋なる）／静（しず）かになる（な形容詞→に＋なる）／先生（せんせい）になる（名詞→に＋なる）。<br><span class=\"n4\">N4 必考：〜くなる／〜になる 的變化表現</span>"],["B","レーサーになりたいです。","Rēsā ni naritai desu.","想當一名賽車手。","▸ <b>句型</b>：【名詞＋になりたいです】。<br>▸ <b>變化</b>：なる → なります → なり<b>たい</b>（希望）；變化結果用に。<br>▸ <b>用法</b>：說職業志願的標準句型；也可說「〜を目指（めざ）しています（以…為目標）」。<br>▸ <b>比較</b>：レーサーになりたい（想成為）／レーサーがほしい（×，ほしい只用於物品）。<br><span class=\"n4\">N4 必考：〜になる 的助詞に不可換</span>"]]},{"name":"願望（今天）","lines":[["A","今日は何をしたいの？","Kyō wa nani wo shitai no?","今天想做什麼？","▸ <b>句型</b>：【〜たい】＋【〜の？】常體疑問。<br>▸ <b>變化</b>：する → します → し<b>たい</b> → したいの？（常體疑問，語氣柔和）。<br>▸ <b>用法</b>：「の？」比「か？」柔和親近，多用於家人、熟人之間，女性與對小孩說話時特別常用。<br>▸ <b>比較</b>：したいの？（柔和）／したい？（直接）／したいですか（丁寧）。注意<b>たいですか對長輩不禮貌</b>。<br><span class=\"n4\">N4 必考：〜たいですか 不可對上位者使用</span>"],["B","釣りに行こうかと思っていたんだ。一緒に行かない。","Tsuri ni ikō ka to omotte ita n da. Issho ni ikanai.","想去釣魚。要一起去嗎？","▸ <b>句型</b>：【意向形＋かと思っていた】＋【否定疑問邀約】。<br>▸ <b>變化</b>：行（い）く → 意向形<b>行こう</b> ＋ かと思（おも）っていた（原本打算）；「行かない？」＝否定疑問的邀約。<br>▸ <b>用法</b>：「〜（よ）うかと思（おも）っていた」表原本的模糊打算，語氣比「行（い）くつもりだった」柔軟。釣（つ）り<b>に</b>行く的に表目的。<br>▸ <b>比較</b>：行（い）こうと思（おも）う（打算去）／行こうかと思う（在想要不要去，更猶豫）／行くつもり（明確打算）。<br><span class=\"n4\">N4 必考：意向形＋と思う 的意志表現</span>"],["A","おもしろそうだね。","Omoshirosō da ne.","好像很有趣呢！","▸ <b>句型</b>：【い形容詞＋そう】樣態推測。<br>▸ <b>變化</b>：おもしろい → 去い＋<b>そう</b> → おもしろそう（看起來有趣）；な形容詞去だ＋そう（元気（げんき）そう）。<br>▸ <b>用法</b>：<b>そう</b>表根據外觀、感覺的推測；此處是「聽起來很有趣」。<br>▸ <b>比較</b>：おもしろそう（樣態・看起來）／おもしろいそう（傳聞・聽說很有趣）。<b>只差一個い，意思完全不同</b>。<br><span class=\"n4\">N4 必考陷阱：〜そうだ 的樣態 vs 傳聞</span>"]]},{"name":"願望（考試）","lines":[["A","東京大学の入学試験に受かればいいなあ。","Tōkyō daigaku no nyūgaku shiken ni ukareba ii nā.","希望能通過東京大學的入學考試。","▸ <b>句型</b>：【ば形＋いいなあ】願望。<br>▸ <b>變化</b>：受（う）かる → <b>受かれば</b>（う段→え段＋ば）＋いい＋なあ＝「要是能考上就好了」。<br>▸ <b>用法</b>：「〜に受（う）かる」考試合格的對象用<b>に</b>；「なあ」拉長表感嘆、自語。<br>▸ <b>比較</b>：〜ばいいなあ（希望・還沒實現）／〜ばよかった（後悔・已錯過）。時態差一個字，語意相反。<br><span class=\"n4\">N4 必考：ば形變化與〜ばいい／〜ばよかった</span>"],["B","僕もさ。","Boku mo sa.","我也是。","▸ <b>句型</b>：【も】表同樣＋【男性終助詞さ】。<br>▸ <b>變化</b>：僕（ぼく）も（同樣）＋さ；後面省略了「受（う）かればいいなあ」。<br>▸ <b>用法</b>：附和對方的願望時只說「僕（ぼく）も」即可，加さ是男性的隨性語氣。<br>▸ <b>比較</b>：僕（ぼく）もさ（男性・隨性）／私（わたし）もです（丁寧）／同感（どうかん）です（正式的贊同）。<br><span class=\"n4\">N4 聽解會用終助詞判斷說話者性別</span>"]]},{"name":"願望（旅行）","lines":[["A","この夏、外国旅行ができたらなあ。","Kono natsu, gaikoku ryokō ga dekitara nā.","今年夏天，如果能去國外旅行就好了。","▸ <b>句型</b>：【名詞＋ができる】可能＋【たら】＋【なあ】願望。<br>▸ <b>變化</b>：旅行（りょこう）する → 旅行が<b>できる</b> → できた → <b>できたらなあ</b>（後面的「いい」省略）。<br>▸ <b>用法</b>：「〜たらなあ」表<b>難以實現的願望</b>，語氣帶有遺憾；「この夏（なつ）」不加に。<br>▸ <b>比較</b>：〜たらなあ（可惜辦不到）／〜たらいいなあ（單純希望）／〜たいなあ（想做）。<br><span class=\"n4\">N4 必考：名詞＋ができる 表能力・可能</span>"],["B","どうかしたの？行けないわけでもあるの？","Dō ka shita no? Ikenai wake demo aru no?","怎麼了？有什麼原因不能去嗎？","▸ <b>句型</b>：【どうかしたの？】關心固定句 ＋【〜わけでもあるの？】追問內情。<br>▸ <b>逐詞拆解</b>：<b>どうかしたの</b>＝どうか（某種狀況）＋した（過去）＋の（常體疑問）＝「發生什麼事了嗎」；<b>行（い）けない</b>＝行く的可能形否定；<b>わけ</b>＝形式名詞「理由、內情」；<b>でもある</b>＝也有（で＋も＋ある）；<b>の？</b>＝常體疑問。<br>▸ <b>句型公式</b>：<b>［普通形］＋わけ</b>＝…的理由／內情。例：<b>行（い）けないわけがある</b>（有不能去的理由）／<b>そういうわけで遅（おく）れました</b>（因為那樣的緣故遲到了）／<b>どういうわけか分（わ）からない</b>（不知道是什麼原因）。<br>▸ <b>用法</b>：「〜わけでもあるの？」用<b>も</b>使追問變得婉轉——不是質問「為什麼不去」，而是「難道有什麼不得已的原因嗎」，帶關心而非逼迫。<br>▸ <b>比較</b>：<b>わけ</b>的三個常用形：〜わけだ（難怪・所以說）／〜わけではない（並不是…・部分否定）／〜わけがない（不可能）。三者語意差異大，是 N3 重點但 N4 讀解也會出現。<br><span class=\"n4\">N4〜N3：わけ 的形式名詞用法（N4 需認得，N3 需會用）</span>"],["A","祖父が病気で、母の手伝いをしなくちゃならないんだ。","Sofu ga byōki de, haha no tetsudai wo shinakucha naranai n da.","祖父生病了，必須要幫母親的忙。","▸ <b>句型</b>：【名詞＋で】表原因＋【〜なくちゃならない】口語義務。<br>▸ <b>變化</b>：しなくてはならない → <b>しなくちゃならない</b>（口語縮約：なくては→なくちゃ）；更短可說「しなくちゃ」。<br>▸ <b>用法</b>：「病気（びょうき）<b>で</b>」的で表原因；「母（はは）の手伝（てつだ）いをする」＝幫母親的忙。<br>▸ <b>比較</b>：なくてはならない（一般）／なくちゃならない（口語）／なければならない（書面）／ないといけない（口語）。<br><span class=\"n4\">N4 必考：義務句型的口語縮約形</span>"]]},{"name":"願望（天氣）","lines":[["A","長雨だね。","Nagaame da ne.","一直下雨呢！","▸ <b>句型</b>：【名詞＋だね】。<br>▸ <b>變化</b>：長雨（ながあめ）です → 長雨だ → 長雨だね。<br>▸ <b>用法</b>：「長雨（ながあめ）」＝連續多日的雨；用<b>ね</b>向對方確認共同的感受，是天氣寒暄的典型。<br>▸ <b>比較</b>：長雨（ながあめ）（連續的雨）／大雨（おおあめ）（大雨）／小雨（こさめ）（小雨）／にわか雨（あめ）（驟雨）。<br><span class=\"n4\">N4 會考天氣相關詞彙</span>"],["B","あした晴れるといいな。","Ashita hareru to ii na.","希望明天能放晴。","▸ <b>句型</b>：【辭書形＋と＋いい】表期望。<br>▸ <b>變化</b>：晴（は）れる（辭書形）＋<b>と</b>＋いい＋な＝「要是放晴就好了」。<br>▸ <b>用法</b>：「〜といい」用於<b>自己無法控制</b>的事（天氣、他人行為）；若是自己能做的事則用「〜ばいい」。<br>▸ <b>比較</b>：晴（は）れるといい（希望天氣好・不可控）／行（い）けばいい（去就好了・建議）。<br><span class=\"n4\">N4 必考：〜といい／〜ばいい／〜たらいい 的差別</span>"]]},{"name":"願望（請求載送）","lines":[["A","ビーチまで乗せていってもらえたらいいなあ。","Bīchi made nosete itte moraetara ii nā.","能不能載我去海邊？","▸ <b>句型</b>：【て形＋いく】＋【〜てもらう可能形】＋【たら＋いいなあ】。<br>▸ <b>變化</b>：乗（の）せる → 乗せて<b>いく</b>（載著去）→ 乗せていって＋<b>もらえる</b>（もらう的可能形）→ もらえたらいいなあ。<br>▸ <b>用法</b>：三層堆疊（授受＋可能＋條件＋願望）＝最委婉的請求，實際上是在拜託對方。<br>▸ <b>比較</b>：乗（の）せてください（直接請求）／乗せてもらえますか（客氣）／乗せてもらえたらいいなあ（暗示・最委婉）。<br><span class=\"n4\">N4 必考：授受動詞＋可能形的複合表現</span>"],["B","一緒においでよ。","Issho ni oide yo.","一起去吧！","▸ <b>句型</b>：【おいで】親暱命令形。<br>▸ <b>變化</b>：来（く）る・行（い）く・いる → <b>おいで</b>（＝おいでなさい的省略），是溫和的命令形。<br>▸ <b>用法</b>：長輩對晚輩、熟人之間使用；「よ」加強邀請的語氣。<br>▸ <b>比較</b>：おいで（親暱命令）／来（き）て（一般請求）／いらっしゃい（歡迎・也可當命令）／来（こ）い（粗魯命令）。<br><span class=\"n4\">N4 會考命令形的語氣強弱</span>"],["A","わあ、ありがとう。ちょっと持ち物を取ってくるね。","Wā, arigatō. Chotto mochimono wo totte kuru ne.","哇啊，謝謝。等一下，我拿個東西。","▸ <b>句型</b>：【て形＋くる】去了再回來＋【ね】。<br>▸ <b>變化</b>：取（と）る → 取って＋<b>くる</b>＝去拿了再回來（往返動作）。<br>▸ <b>用法</b>：「〜てくる」表<b>去做某事並返回</b>；句尾ね柔化語氣，告知對方自己的動向。<br>▸ <b>比較</b>：取（と）ってくる（去拿了回來）／取っていく（拿走）／取っておく（事先拿好備用）。<br><span class=\"n4\">N4 必考：てくる／ていく／ておく 的方向性</span>"]]},{"name":"願望（安慰）","lines":[["A","どうしてそんなにがっかりしているの？","Dō shite sonna ni gakkari shite iru no?","你看起來很沒精神，怎麼了嗎？","▸ <b>句型</b>：【そんなに】程度＋【〜ている＋の？】關心。<br>▸ <b>變化</b>：がっかりする → がっかりして<b>いる</b>（狀態持續）→ ＋の？（關心式疑問）。<br>▸ <b>用法</b>：「そんなに」指對方的狀態程度；「がっかり」是擬態語＋する。<br>▸ <b>比較</b>：こんなに（我這邊的程度）／そんなに（你那邊的程度）／あんなに（那種程度・雙方都遠）。<br><span class=\"n4\">N4 必考：こんなに／そんなに／あんなに 的視點</span>"],["B","陽子が土曜日のテニスの試合を断ってきたばかりなの。本当に試合をしたかったのよ。","Yōko ga doyōbi no tenisu no shiai wo kotowatte kita bakari na no. Hontō ni shiai wo shitakatta no yo.","陽子剛拒絕了星期六的網球比賽。我真的很想比賽的。","▸ <b>句型</b>：【て形＋くる】＋【〜たばかり】剛剛＋【〜たかった】希望的過去。<br>▸ <b>變化</b>：断（ことわ）る → 断って＋くる（對我做出的動作）→ 断ってきた ＋ <b>ばかり</b>（剛…）；したい → <b>したかった</b>（たい形的過去）。<br>▸ <b>用法</b>：「〜たばかり」表動作剛完成；「のよ・のなの」是女性的說明語氣。<br>▸ <b>比較</b>：〜たばかり（剛剛才・時間極短）／〜たところ（剛好…的時候）／もう〜た（已經）。<br><span class=\"n4\">N4 必考：〜たばかり／〜たところ 的差異</span>"],["A","私が相手ではどう？","Watashi ga aite de wa dō?","我當你的對手如何？","▸ <b>句型</b>：【〜では】假設條件＋【どう】徵詢。<br>▸ <b>變化</b>：私（わたし）が相手（あいて）だ → 私が相手<b>では</b>（＝であれば，若以我為對手的話）＋どう？<br>▸ <b>用法</b>：主語用<b>が</b>強調「由我來當」；「〜ではどう？」提出替代方案。<br>▸ <b>比較</b>：私（わたし）では（若是我的話）／私が（強調是我）／私は（至於我）。三個助詞語氣層層不同。<br><span class=\"n4\">N4 必考：では 的條件用法</span>"],["B","そうしてくれる？ほんとう？","Sō shite kureru? Hontō?","你願意嗎？真的？","▸ <b>句型</b>：【〜てくれる？】請求確認。<br>▸ <b>變化</b>：そうする → そうして＋<b>くれる</b>（對方為我做）→ ＋？（升調＝請求或確認）。<br>▸ <b>用法</b>：「そう」代替前面提到的內容，避免重複；「ほんとう？」表驚喜與再確認。<br>▸ <b>比較</b>：してくれる？（你願意為我做嗎）／してもらえる？（同義，更客氣）／してくれない？（更委婉的請求）。<br><span class=\"n4\">N4 必考：〜てくれる／〜てもらう 的視點差異</span>"],["A","喜んで。何時にそこへ行ったらいい？","Yorokonde. Nanji ni soko e ittara ii?","樂意之至。幾點到那裡好？","▸ <b>句型</b>：【喜んで】省略＋【〜たらいい】徵詢做法。<br>▸ <b>變化</b>：喜（よろこ）ぶ → <b>喜んで</b>（て形，後面省略「します」）；行（い）く → 行った → <b>行ったらいい</b>（該怎麼做才好）。<br>▸ <b>用法</b>：「喜（よろこ）んで」是爽快答應的固定語；「何時（なんじ）に」時刻用に，「そこへ」方向用へ。<br>▸ <b>比較</b>：〜たらいい（該…才好・徵詢）／〜たらいいのに（可惜沒這麼做）／〜ばいい（同義）。<br><span class=\"n4\">N4 必考：疑問詞＋たらいいですか 的徵詢句型</span>"]]}]},"8":{"title":"要求許可","jp_title":"許可を求める","theme":"徵求許可和詢問是否可以","scenes":[{"name":"請求許可（1）","lines":[["A","部屋から出てもよろしいですか？気分が悪いのです。","Heya kara dete mo yoroshii desu ka? Kibun ga warui no desu.","我可以到外面去嗎？我覺得有點不舒服。","▸ <b>句型</b>：【〜てもよろしいですか】敬語許可＋【〜のです】說明理由。<br>▸ <b>變化</b>：いい → <b>よろしい</b>（鄭重）；出（で）る → 出て＋も＋よろしいですか。起點用<b>から</b>（部屋（へや）から出る）。<br>▸ <b>用法</b>：請求許可的最禮貌形式；後面補上理由（気分（きぶん）が悪（わる）いのです）更容易被接受。<br>▸ <b>比較</b>：〜てもいい？（常體）／〜てもいいですか（一般）／〜てもよろしいですか（敬語）／〜てもよろしいでしょうか（最客氣）。<br><span class=\"n4\">N4 必考：許可句型的四段禮貌階梯</span>"],["B","もちろんです。","Mochiron desu.","當然可以。","▸ <b>句型</b>：【もちろんです】爽快許可。<br>▸ <b>變化</b>：もちろん（副詞）＋です（讓語氣更禮貌）。<br>▸ <b>用法</b>：對上位者只說「もちろん」略顯隨便，加です較妥。<br>▸ <b>比較</b>：もちろんです（當然可以）／どうぞ（請）／かまいません（不介意）／ええ、いいですよ（可以啊）。<br><span class=\"n4\">N4 會考許可的各種回應方式</span>"]]},{"name":"請求許可（2）","lines":[["A","お母さん、今晩車を借りてもいい？","Okāsan, konban kuruma wo karite mo ii?","媽媽，今天晚上車子借我開好嗎？","▸ <b>句型</b>：【〜てもいい？】常體許可請求。<br>▸ <b>變化</b>：借（か）りる → 借りて＋も＋いい？（省略ですか）。<br>▸ <b>用法</b>：「借（か）りる」是<b>借入</b>（我借別人的）；「貸（か）す」是借出（我給別人）。方向不可搞錯。<br>▸ <b>比較</b>：借（か）りる（借入・車（くるま）を借りる）／貸（か）す（借出・車を貸す）／返（かえ）す（歸還）。<br><span class=\"n4\">N4 必考：借りる／貸す 的方向</span>"],["B","いいわよ。","Ii wa yo.","好啊。","▸ <b>句型</b>：【いい＋わ＋よ】女性語氣的許可。<br>▸ <b>變化</b>：いいです → いいわ（女性常體）→ いいわよ（加よ告知）。<br>▸ <b>用法</b>：「わ」是女性用終助詞，柔和地表達自己的判斷或許可。<br>▸ <b>比較</b>：いいわよ（女性）／いいよ（男女皆可）／いいですよ（丁寧）／だめ（不行）。<br><span class=\"n4\">N4 聽解常考性別語體</span>"]]},{"name":"請求許可（3）","lines":[["A","あなたの写真を撮らせてもらえますか？","Anata no shashin wo torasete moraemasu ka?","我可以幫你照張相嗎？","▸ <b>句型</b>：【使役形＋てもらう的可能形】請求許可。<br>▸ <b>變化</b>：撮（と）る → 使役形<b>撮らせる</b>（一類動詞：う段→あ段＋せる）→ 撮らせて＋もらう → もらえますか（可能形）。<br>▸ <b>用法</b>：「〜させてもらえますか」＝請讓我做…，比「〜てもいいですか」更謙遜，強調需要對方允許。<br>▸ <b>比較</b>：撮（と）ってもいいですか（可以拍嗎）／撮らせてもらえますか（能讓我拍嗎・更謙遜）／撮らせていただけますか（最謙遜）。<br><span class=\"n4\">N4 必考：使役形變化與〜させてもらう</span>"],["B","どうぞ。","Dōzo.","請便。","▸ <b>句型</b>：【どうぞ】單獨許可。<br>▸ <b>變化</b>：後面省略了「撮（と）ってください」等動詞。<br>▸ <b>用法</b>：「どうぞ」單用即表許可、讓與，是最簡潔的答應方式。<br>▸ <b>比較</b>：どうぞ（請・許可）／どうぞどうぞ（更熱情）／ご自由（じゆう）に（請自便）。<br><span class=\"n4\">N4 必考：どうぞ 的省略功能</span>"]]},{"name":"請求許可（4）","lines":[["A","たばこを吸ってもかまいませんか？","Tabako wo sutte mo kamaimasen ka?","請問我可以抽煙嗎？","▸ <b>句型</b>：【〜てもかまいませんか】許可請求。<br>▸ <b>變化</b>：かまう（介意）→ <b>かまいません</b>（不介意）→ かまいませんか（您不介意嗎）。<br>▸ <b>用法</b>：比「〜てもいいですか」更客氣，因為是問「對方是否會介意」而非「我可不可以」。<br>▸ <b>比較</b>：〜てもかまいませんか（很客氣）／〜てもいいですか（一般）／〜てもよろしいですか（敬語）。<br><span class=\"n4\">N4 必考：かまいません 的許可用法</span>"],["B","ええ、いいですよ。","Ē, ii desu yo.","可以的。","▸ <b>句型</b>：【ええ】＋【いいですよ】許可。<br>▸ <b>變化</b>：はい → ええ（略柔和的口語肯定）。<br>▸ <b>用法</b>：「いいですよ」的<b>よ</b>表示明確告知許可，省略よ則語氣較冷淡（甚至可能是婉拒）。<br>▸ <
