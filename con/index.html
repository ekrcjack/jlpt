b>比較</b>：ええ（柔和）／はい（標準）／うん（常體）。正式場合宜用「はい」。<br><span class=\"n4\">N4 聽解必考：はい／ええ／うん 的正式度</span>"]]},{"name":"請求許可（5）","lines":[["A","今夜美穂と映画に行ってもいい？","Kon'ya Miho to eiga ni itte mo ii?","今天晚上我可以跟美穗一起去看電影嗎？","▸ <b>句型</b>：【〜と】共同動作＋【〜に行く】＋【〜てもいい？】。<br>▸ <b>變化</b>：行（い）く → 行って＋も＋いい？；「映画（えいが）に行く」＝去看電影（に表目的地兼目的）。<br>▸ <b>用法</b>：共同行動的對象用<b>と</b>（美穂（みほ）と）；向家長請求許可用常體。<br>▸ <b>比較</b>：美穂（みほ）と行（い）く（和美穗一起去）／美穂に行く（×）／美穂を（×）。共同動作只能用と。<br><span class=\"n4\">N4 必考：と 表共同動作的對象</span>"],["B","宿題はすませたの？","Shukudai wa sumaseta no?","你功課寫好了嗎？","▸ <b>句型</b>：【他動詞＋の？】確認完成。<br>▸ <b>變化</b>：済（す）む（自動詞・結束）→ <b>済ませる</b>（他動詞・把事情做完）→ 済ませた（過去）＋の？<br>▸ <b>用法</b>：「宿題（しゅくだい）<b>は</b>」用は提示話題並帶對比；問對方是否完成該做的事。<br>▸ <b>比較</b>：済（す）ませた（他動詞・我做完了）／済んだ（自動詞・事情結束了）／終（お）わった（結束・自動詞）。<br><span class=\"n4\">N4 必考：自他動詞配對（済む／済ませる）</span>"],["A","うん。","Un.","寫好了。","▸ <b>句型</b>：【うん】常體肯定。<br>▸ <b>變化</b>：はい → うん；否定則是「ううん・いや」。<br>▸ <b>用法</b>：只用於熟人、家人之間；對長輩或正式場合必須說「はい」。<br>▸ <b>比較</b>：うん（是）／ううん（不是，注意<b>只差一個う</b>）／うーん（嗯…思考中）。三者靠長度與語調區分。<br><span class=\"n4\">N4 聽解陷阱：うん／ううん 的辨別</span>"],["B","じゃあ、いいわ。","Jā, ii wa.","那就去吧。","▸ <b>句型</b>：【じゃあ】承接＋【いい＋わ】女性許可。<br>▸ <b>變化</b>：いいです → いいわ（女性常體斷定）。<br>▸ <b>用法</b>：確認條件（功課寫完了）後給予許可；「じゃあ」表「既然這樣的話」。<br>▸ <b>比較</b>：いいわ（女性許可）／いいよ（男女皆可）／だめよ（女性禁止）／だめだ（男性禁止）。<br><span class=\"n4\">N4 會考條件成立後的許可表現</span>"]]},{"name":"拒絕（1）","lines":[["A","先生、あした学校にもどってもいいでしょうか？","Sensei, ashita gakkō ni modotte mo ii deshō ka?","醫師，明天我可以回學校上課嗎？","▸ <b>句型</b>：【〜てもいいでしょうか】最委婉的許可請求。<br>▸ <b>變化</b>：ですか → <b>でしょうか</b>（降低斷定，語氣更軟）；戻（もど）る → 戻って＋も＋いい。<br>▸ <b>用法</b>：對醫生、老師等專業人士請求許可時，用「でしょうか」最得體。目的地用<b>に</b>。<br>▸ <b>比較</b>：いいですか（一般）／いいでしょうか（委婉）／よろしいでしょうか（最正式）。<br><span class=\"n4\">N4 必考：でしょうか 的委婉功能</span>"],["B","いいえ、もう1日寝ていなさい。","Iie, mō ichinichi nete inasai.","不行，你得在床上多休息一天。","▸ <b>句型</b>：【〜ている＋なさい】溫和命令。<br>▸ <b>變化</b>：寝（ね）る → 寝て＋いる（持續狀態）→ 寝てい<b>なさい</b>（維持躺著的狀態）。<br>▸ <b>用法</b>：「なさい」是長輩、專業人士對他人的溫和命令；「もう1日（いちにち）」＝再一天。<br>▸ <b>比較</b>：寝（ね）ていなさい（保持躺著）／寝なさい（去睡）。加ている強調<b>維持狀態</b>而非開始動作。<br><span class=\"n4\">N4 必考：〜ていなさい 表狀態的維持</span>"]]},{"name":"拒絕（2）","lines":[["A","先生、テストを受けてもよろしいですか？","Sensei, tesuto wo ukete mo yoroshii desu ka?","教授，我可以參加考試嗎？","▸ <b>句型</b>：【〜てもよろしいですか】敬語許可。<br>▸ <b>變化</b>：受（う）ける → 受けて＋も＋よろしいですか。「テストを受ける」＝參加考試。<br>▸ <b>用法</b>：對老師使用敬語形；「先生（せんせい）」是稱謂也是敬稱，<b>不加さん</b>。<br>▸ <b>比較</b>：テストを受（う）ける（參加考試）／テストがある（有考試）／テストに合格（ごうかく）する（通過考試）。<br><span class=\"n4\">N4 必考：受ける 的搭配用法</span>"],["B","いいや、健一郎。あなたはテストをうけられません。授業のサボりすぎです。","Iiya, Kenichirō. Anata wa tesuto wo ukeraremasen. Jugyō no sabori sugi desu.","不行，健一郎。你沒有辦法參加考試。你曠課太多了。","▸ <b>句型</b>：【可能形否定】＋【ます形＋すぎ】過度。<br>▸ <b>變化</b>：受（う）ける → 可能形<b>受けられる</b> → 否定 受けられません（無法・不被允許）；サボる → サボり＋<b>すぎ</b>（過度）。<br>▸ <b>用法</b>：「いいや」是男性的常體否定；「すぎ」接ます形表過度（食（た）べすぎ・飲（の）みすぎ）。<br>▸ <b>比較</b>：受（う）けられません（不能參加・可能形否定）／受けてはいけません（禁止）／受けません（不參加・意志）。<br><span class=\"n4\">N4 必考：〜すぎる 與可能形否定</span>"]]},{"name":"拒絕（3）","lines":[["A","先生、薬を飲んでから運転してもだいじょうぶでしょうか？","Sensei, kusuri wo nonde kara unten shite mo daijōbu deshō ka?","醫師，吃藥之後可以開車嗎？","▸ <b>句型</b>：【て形＋から】先後＋【〜てもだいじょうぶでしょうか】。<br>▸ <b>變化</b>：飲（の）む → 飲ん<b>で</b>（む→んで）＋から＝喝完之後；運転（うんてん）する → 運転して＋も＋だいじょうぶ。<br>▸ <b>用法</b>：「〜てから」強調<b>動作完成後</b>才做下一件事，順序不可顛倒。<br>▸ <b>比較</b>：飲（の）んでから（喝完後）／飲む前（まえ）に（喝之前，用<b>辭書形</b>）／飲みながら（一邊喝，用ます形）。<br><span class=\"n4\">N4 必考：てから／前に／ながら 的接續形式</span>"],["B","だめです。その薬を飲むと少し眠くなりますから、運転しないでください。","Dame desu. Sono kusuri wo nomu to sukoshi nemuku narimasu kara, unten shinaide kudasai.","不行，吃藥之後會有點想睡覺，所以請不要開車。","▸ <b>句型</b>：【辭書形＋と】必然結果＋【〜から】理由＋【〜ないでください】禁止。<br>▸ <b>變化</b>：飲（の）む＋<b>と</b>＝一喝就…（必然）；眠（ねむ）い → <b>眠くなります</b>（い形容詞→く＋なる）；運転（うんてん）する → 運転し<b>ないで</b>ください。<br>▸ <b>用法</b>：<b>と</b>表必然、恆常的因果（不可用於意志句）；「〜ないでください」是禁止的請求。<br>▸ <b>比較</b>：飲（の）むと（必然結果）／飲んだら（假設條件）／飲めば（條件強調）。と<b>後面不可接命令</b>。<br><span class=\"n4\">N4 必考：と／たら／ば／なら 四種條件形的區別</span>"]]},{"name":"拒絕（4）","lines":[["A","たばこを吸ってもよろしいですか？","Tabako wo sutte mo yoroshii desu ka?","我可以抽煙嗎？","▸ <b>句型</b>：【〜てもよろしいですか】。<br>▸ <b>變化</b>：吸（す）う → 吸って＋も＋よろしいですか。「たばこを吸う」＝抽菸（固定搭配）。<br>▸ <b>用法</b>：在公共場合請求許可時的禮貌問法。<br>▸ <b>比較</b>：たばこを吸（す）う（抽菸）／たばこを飲（の）む（×）。日語抽菸<b>只能用「吸う」</b>。<br><span class=\"n4\">N4 必考：名詞與動詞的固定搭配</span>"],["B","吸わないでください。あそこに「禁煙」の表示があります。","Suwanaide kudasai. Asoko ni 'kin'en' no hyōji ga arimasu.","不行，那裡有「禁煙」的標示。","▸ <b>句型</b>：【〜ないでください】禁止＋【場所＋に＋があります】。<br>▸ <b>變化</b>：吸（す）う → ない形<b>吸わない</b>（う結尾→わない）→ 吸わないでください。<br>▸ <b>用法</b>：直接禁止略顯強硬，補上理由（有禁菸標示）較不失禮；存在句用<b>に＋があります</b>。<br>▸ <b>比較</b>：吸（す）わないでください（請不要抽）／吸ってはいけません（不可以抽・規定）／禁煙（きんえん）です（禁菸）。<br><span class=\"n4\">N4 必考：う結尾動詞的ない形是「わない」</span>"]]}]},"9":{"title":"委託","jp_title":"依頼する","theme":"依賴、請求幫助和委託事項","scenes":[{"name":"請求幫忙（1）","lines":[["A","お願いがあるのですが。","Onegai ga aru no desu ga.","我有事想拜託你。","▸ <b>句型</b>：【〜があります】＋【のですが】留白式鋪陳。<br>▸ <b>變化</b>：お願（ねが）いがある ＋ <b>のですが</b>（＝んですが，說明後留白）。<br>▸ <b>用法</b>：開口拜託前先鋪陳，讓對方有心理準備；<b>が</b>結尾表「還有下文」，等對方接話。<br>▸ <b>比較</b>：お願（ねが）いがあるのですが（最常用的鋪陳）／お願いしたいことがあります（也可）／頼（たの）みがある（常體・熟人）。<br><span class=\"n4\">N4 必考：〜のですが 的留白功能</span>"],["B","はい、何でしょうか？","Hai, nan deshō ka?","好啊，什麼事呢？","▸ <b>句型</b>：【何でしょうか】委婉疑問。<br>▸ <b>變化</b>：何（なん）ですか → <b>何でしょうか</b>（でしょう降低斷定，更客氣）。<br>▸ <b>用法</b>：回應對方的鋪陳，表示「請說」；比「何（なん）ですか」柔和許多。<br>▸ <b>比較</b>：何（なん）でしょうか（客氣）／何ですか（一般，語氣可能顯得不耐）／どうしました？（關心對方狀況）。<br><span class=\"n4\">N4 必考：でしょうか 的委婉功能</span>"],["A","日本語のレポートを見てもらいたいのです。","Nihongo no repōto wo mite moraitai no desu.","可以請你幫我看一下日文報告嗎？","▸ <b>句型</b>：【〜てもらう】授受＋【たい】希望＋【のです】說明。<br>▸ <b>變化</b>：見（み）る → 見て＋<b>もらう</b>（請對方為我做）→ もらい<b>たい</b> → もらいたいのです。<br>▸ <b>用法</b>：「〜てもらいたい」＝希望對方為我做…，比「〜てください」更委婉間接。<br>▸ <b>比較</b>：見（み）てもらいたいです（希望你看）／見てほしいです（同義，更口語）／見ていただきたいです（謙讓・最禮貌）。<br><span class=\"n4\">N4 必考：〜てもらいたい／〜てほしい 的同義關係</span>"]]},{"name":"請求載送","lines":[["A","空港まで乗せていただけますか？","Kūkō made nosete itadakemasu ka?","您可以送我到機場嗎？","▸ <b>句型</b>：【まで】終點＋【〜ていただけますか】謙讓請求。<br>▸ <b>變化</b>：乗（の）せる → 乗せて＋いただく（謙讓）→ 可能形 いただける → いただけますか。<br>▸ <b>用法</b>：移動的終點用<b>まで</b>；「〜ていただけますか」是商務、對長輩最常用的請求形式。<br>▸ <b>比較</b>：〜てもらえますか（客氣）／〜ていただけますか（更客氣）／〜ていただけないでしょうか（最客氣）。<br><span class=\"n4\">N4 必考：もらう→いただく 的謙讓轉換</span>"],["B","喜んで。","Yorokonde.","我很樂意。","▸ <b>句型</b>：【喜んで】省略動詞的爽快答應。<br>▸ <b>變化</b>：喜（よろこ）ぶ → 喜んで（て形）；後面省略了「お手伝（てつだ）いします」等動詞。<br>▸ <b>用法</b>：答應請求時的固定語，語氣積極；也可說「喜（よろこ）んで！」加強。<br>▸ <b>比較</b>：喜（よろこ）んで（樂意之至）／もちろんです（當然）／いいですよ（可以啊）／お任（まか）せください（交給我）。<br><span class=\"n4\">N4 會考答應請求的各種說法</span>"]]},{"name":"順路請求","lines":[["A","私を駅まで連れて行く前に、ちょっと家へ寄ってもいいですか。","Watashi wo eki made tsurete iku mae ni, chotto ie e yotte mo ii desu ka.","在載我去車站前，可以先回我家一下嗎？","▸ <b>句型</b>：【辭書形＋前に】＋【〜てもいいですか】。<br>▸ <b>變化</b>：連（つ）れて行（い）く → 連れて行く<b>前（まえ）に</b>（前に前面<b>必用辭書形</b>，不可用過去式）。<br>▸ <b>用法</b>：「連（つ）れて行（い）く」＝帶（人）去；「寄（よ）る」＝順道前往。方向用<b>へ</b>（家（いえ）へ寄る）。<br>▸ <b>比較</b>：行（い）く前（まえ）に（去之前・辭書形）／行った後（あと）で（去之後・<b>た形</b>）。前後的接續形式<b>不同</b>，是常考陷阱。<br><span class=\"n4\">N4 必考：〜前に（辭書形）／〜後で（た形）</span>"],["B","はい、分かりました。","Hai, wakarimashita.","好的，我知道了。","▸ <b>句型</b>：【分かりました】接受請求。<br>▸ <b>變化</b>：分（わ）かる → 分かりました（過去式表理解成立）。<br>▸ <b>用法</b>：接受對方請求或指示的標準回應；商務場合可用「承知（しょうち）しました」。<br>▸ <b>比較</b>：分（わ）かりました（一般）／承知（しょうち）しました（商務）／了解（りょうかい）しました（對平輩・下屬，對上司略失禮）。<br><span class=\"n4\">N4 必考：了解／承知 的使用對象差異</span>"]]},{"name":"請求做菜","lines":[["A","チャリティーバザーのために何か料理をしてくださいませんか？","Charitī bazā no tame ni nani ka ryōri wo shite kudasaimasen ka?","可以請你幫慈善義賣做一些餐點嗎？","▸ <b>句型</b>：【〜のために】目的＋【何か】＋【〜てくださいませんか】。<br>▸ <b>變化</b>：する → して＋<b>くださいませんか</b>（否定疑問的敬語請求，最客氣）。<br>▸ <b>用法</b>：「〜のために」表目的或受益對象；「何（なに）か料理（りょうり）を」＝做些什麼菜（不指定）。<br>▸ <b>比較</b>：〜のために（為了・目的）／〜ために（也可表原因）／〜ように（為了達成某狀態）。<br><span class=\"n4\">N4 必考：ために／ように 的區別</span>"],["B","喜んで。ストローベリーショートケーキを作りましょう。","Yorokonde. Sutorōberī shōto kēki wo tsukurimashō.","我很樂意。那我就來作草莓蛋糕吧！","▸ <b>句型</b>：【喜んで】＋【〜ましょう】主動提出。<br>▸ <b>變化</b>：作（つく）る → 作ります → 作り<b>ましょう</b>。<br>▸ <b>用法</b>：<b>ましょう</b>在此不是邀約，而是「我來做吧」的主動表態——這是ましょう的第二種用法。<br>▸ <b>比較</b>：作（つく）りましょう（我來做吧／我們一起做吧）／作りましょうか（我來做好嗎・詢問對方）／作ります（單純陳述）。<br><span class=\"n4\">N4 必考：ましょう／ましょうか 的兩種功能</span>"]]},{"name":"搬東西","lines":[["A","ちょっとこのテーブルに手を貸していただけますか？動かしたいのです。","Chotto kono tēburu ni te wo kashite itadakemasu ka? Ugokashitai no desu.","您可以幫我搬這張桌子嗎？我想把它換個位置。","▸ <b>句型</b>：【慣用句手を貸す】＋【〜ていただけますか】＋【〜たいのです】。<br>▸ <b>變化</b>：貸（か）す → 貸して＋いただけますか；動（うご）かす（他動詞・移動某物）→ 動かし<b>たい</b>。<br>▸ <b>用法</b>：「〜に手（て）を貸（か）す」＝幫忙（慣用語），對象用に；後面補上理由更清楚。<br>▸ <b>比較</b>：動（うご）かす（他動詞・我移動它）／動く（自動詞・它自己動）。テーブルを動かす／テーブルが動く。<br><span class=\"n4\">N4 必考：自他動詞配對（動く／動かす）</span>"],["B","いいですよ。じゃあ、どこへ運びますか。","Ii desu yo. Jā, doko e hakobimasu ka.","當然。您要搬到哪裡呢？","▸ <b>句型</b>：【いいですよ】答應＋【疑問詞＋へ】＋【運びますか】。<br>▸ <b>變化</b>：運（はこ）ぶ → 運びます → 運びますか。<br>▸ <b>用法</b>：搬運的目的地用<b>へ</b>（強調方向）或に（強調到達點）；答應後主動確認細節。<br>▸ <b>比較</b>：運（はこ）ぶ（搬運・物）／連（つ）れて行（い）く（帶・人）／持（も）って行く（拿去・物）。三者對象不同。<br><span class=\"n4\">N4 必考：運ぶ／持って行く／連れて行く 的區別</span>"]]},{"name":"再次幫忙","lines":[["A","美穂、悪いんだけど、また手を貸してくれる？","Miho, warui n dakedo, mata te wo kashite kureru?","美穗，不好意思，可以再請你幫個忙嗎？","▸ <b>句型</b>：【悪いんだけど】緩衝＋【また】＋【〜てくれる？】常體請求。<br>▸ <b>變化</b>：悪（わる）い ＋ <b>んだ</b>（＝のだ，說明）＋けど（逆接緩衝）＝「不好意思，不過…」。<br>▸ <b>用法</b>：向熟人請求時的固定緩衝語；「〜てくれる？」是常體請求。<br>▸ <b>比較</b>：悪（わる）いんだけど（熟人）／すみませんが（一般）／恐（おそ）れ入（い）りますが（商務）。三種緩衝語的正式度。<br><span class=\"n4\">N4 必考：けど／が 的緩衝用法</span>"],["B","いいわよ。どうすればいいの？","Ii wa yo. Dō sureba ii no?","好啊！要如何幫你呢？","▸ <b>句型</b>：【いいわよ】女性許可＋【ば形＋いい】徵詢做法。<br>▸ <b>變化</b>：する → <b>すれば</b>（三類動詞的ば形，不規則）＋いい＋の？<br>▸ <b>用法</b>：「どうすればいいの？」＝我該怎麼做才好，是詢問具體做法最常用的句型。<br>▸ <b>比較</b>：どうすればいい（該怎麼做）／どうしたらいい（同義，更口語）／どうしましょうか（我該怎麼辦・丁寧）。<br><span class=\"n4\">N4 必考：する 的ば形是「すれば」</span>"]]},{"name":"問路請求","lines":[["A","すみませんが、道をたずねたいのですが。","Sumimasen ga, michi wo tazunetai no desu ga.","對不起，可以跟你問個路嗎？","▸ <b>句型</b>：【すみませんが】＋【〜たい】＋【のですが】雙重留白。<br>▸ <b>變化</b>：たずねる → たずねます → たずね<b>たい</b> → たずねたいのですが。<br>▸ <b>用法</b>：說出自己的希望後用が留白，讓對方主動說「いいですよ」——非常日式的請求方式。「道（みち）をたずねる」＝問路。<br>▸ <b>比較</b>：たずねる（詢問・訪問）／聞（き）く（聽・問，較口語）／伺（うかが）う（謙讓語）。<br><span class=\"n4\">N4 必考：たずねる 的兩種漢字（尋ねる／訪ねる）</span>"],["B","いいですよ。どちらへ行きたいのですか？","Ii desu yo. Dochira e ikitai no desu ka?","好啊！你要去哪裡？","▸ <b>句型</b>：【どちら＋へ】禮貌疑問＋【〜たいのですか】。<br>▸ <b>變化</b>：どこ → どちら（禮貌）；行（い）きたい ＋ のですか（確認對方的希望）。<br>▸ <b>用法</b>：問對方目的地時用「どちらへ」比「どこへ」禮貌；のですか帶關心語氣。<br>▸ <b>比較</b>：どちらへ行（い）きたいのですか（禮貌關心）／どこへ行きますか（一般）／どこ行くの？（常體）。<br><span class=\"n4\">N4 必考：〜たいのですか 用於詢問他人意願時較禮貌</span>"],["A","新宿駅をさがしているのです。","Shinjuku-eki wo sagashite iru no desu.","我在找新宿車站。","▸ <b>句型</b>：【〜ている】進行＋【のです】說明。<br>▸ <b>變化</b>：さがす → さがして＋いる（正在找）→ ＋のです（說明自己的狀況）。<br>▸ <b>用法</b>：「〜ているのです」用來說明自己目前的處境，讓對方理解為何提問。<br>▸ <b>比較</b>：さがしている（正在找・他動詞）／見（み）つからない（找不到・自動詞否定）／見つけた（找到了・他動詞）。<br><span class=\"n4\">N4 必考：さがす／見つける／見つかる 的區別</span>"]]},{"name":"請求寫信","lines":[["A","お願いしてもいいですか？","Onegai shite mo ii desu ka?","可以請你幫個忙嗎？","▸ <b>句型</b>：【お願いする＋てもいいですか】把請求本身當動作。<br>▸ <b>變化</b>：お願（ねが）いする → お願いして＋も＋いいですか。<br>▸ <b>用法</b>：先徵求「我可以拜託你嗎」，再說具體內容——是很禮貌的兩段式請求。<br>▸ <b>比較</b>：お願（ねが）いしてもいいですか（可以拜託你嗎）／お願いがあるのですが（我有事相求）／お願いします（直接請求）。<br><span class=\"n4\">N4 會考兩段式請求的流程</span>"],["B","どうぞどうぞ。お手伝いできれば嬉しいですよ。","Dōzo dōzo. Otetsudai dekireba ureshii desu yo.","好啊！我很樂意能夠幫得上忙。","▸ <b>句型</b>：【どうぞどうぞ】＋【可能形的ば形＋嬉しい】。<br>▸ <b>變化</b>：お手伝（てつだ）いする → <b>お手伝いできる</b>（謙讓可能）→ <b>できれば</b>（ば形）＋嬉（うれ）しいです。<br>▸ <b>用法</b>：「〜ば嬉（うれ）しいです」＝要是能…就太好了；重複「どうぞ」表示欣然接受。<br>▸ <b>比較</b>：できれば嬉（うれ）しい（能做到就開心）／できて嬉しい（已經做到而開心）。ば＝未實現，て＝已實現。<br><span class=\"n4\">N4 必考：ば形（未實現）與て形（已實現）的差異</span>"],["A","じゃあ。この手紙を書くのを手伝ってくれますか？","Jā. Kono tegami wo kaku no wo tetsudatte kuremasu ka?","那麼可以幫我寫這封信嗎？","▸ <b>句型</b>：【動詞＋の】名詞化＋【〜を手伝う】＋【〜てくれますか】。<br>▸ <b>變化</b>：書（か）く → 書く<b>の</b>（名詞化）→ 書くのを手伝（てつだ）う。動詞要接助詞<b>を</b>時，必須先用の或こと名詞化。<br>▸ <b>用法</b>：「〜を手伝（てつだ）う」幫忙的內容用を；也可說「手紙（てがみ）を書（か）くのを手伝ってください」。<br>▸ <b>比較</b>：書（か）くのを手伝（てつだ）う（幫忙寫）／書いてもらう（請對方寫）。前者一起做，後者對方做。<br><span class=\"n4\">N4 必考：動詞名詞化後才能接助詞</span>"]]},{"name":"請求建議","lines":[["A","陽子、ちょっとアドバイスがほしいんだけど。","Yōko, chotto adobaisu ga hoshii n dakedo.","陽子，您可以給我一些建議嗎？","▸ <b>句型</b>：【〜がほしい】＋【んだけど】留白。<br>▸ <b>變化</b>：ほしい（い形容詞）＋<b>んだ</b>（＝のだ）＋けど＝說出願望後留白。<br>▸ <b>用法</b>：「アドバイスがほしい」想要的東西用<b>が</b>；「けど」讓語氣不強硬，等對方回應。<br>▸ <b>比較</b>：〜がほしいんだけど（暗示・委婉）／〜をください（直接）／〜をいただけますか（禮貌請求）。<br><span class=\"n4\">N4 必考：ほしい 的對象用が</span>"],["B","私でよければね。何か知りたいの？","Watashi de yokereba ne. Nani ka shiritai no?","我很樂意。您想知道哪方面的事情呢？","▸ <b>句型</b>：【〜でよければ】謙虛條件＋【〜たい＋の？】。<br>▸ <b>變化</b>：いい → <b>よければ</b>（ば形，不規則）；「私（わたし）<b>で</b>」的で表資格、身分（以我這種人來說）。<br>▸ <b>用法</b>：「私（わたし）でよければ」＝如果我可以的話，是答應時的謙虛表達，非常實用。<br>▸ <b>比較</b>：私（わたし）でよければ（若我夠格的話）／私がよければ（×，語意不通）。這裡<b>只能用で</b>。<br><span class=\"n4\">N4 必考：で 表資格・立場的用法</span>"],["A","北海道を旅行するにはどんな方法が一番いいかな？","Hokkaidō wo ryokō suru ni wa donna hōhō ga ichiban ii ka na?","到北海道旅行用什麼方式最好呢？","▸ <b>句型</b>：【辭書形＋には】目的＋【疑問詞＋が＋一番】＋【かな】自問。<br>▸ <b>變化</b>：旅行（りょこう）する → 旅行する<b>には</b>（＝為了旅行，辭書形＋には）。<br>▸ <b>用法</b>：「〜には」表目的（為了做…的話）；「かな」是自問自語的語氣，比直接問柔和。<br>▸ <b>比較</b>：〜には（為了・目的）／〜ために（為了・目的，較正式）／〜のに（用於…卻，逆接）。<br><span class=\"n4\">N4 必考：〜には 表目的的用法</span>"]]},{"name":"拒絕（1）","lines":[["A","お父さん、学校の劇には来てくれる？","Otōsan, gakkō no geki ni wa kite kureru?","爸爸，你會來看學校的話劇嗎？","▸ <b>句型</b>：【〜には】對比強調＋【〜てくれる？】請求。<br>▸ <b>變化</b>：来（く）る → 来（き）て＋<b>くれる</b>（對方為我做）→ 来てくれる？（升調＝請求）。<br>▸ <b>用法</b>：「劇（げき）<b>には</b>」＝に＋は，強調「至少這場話劇」的對比意味。<br>▸ <b>比較</b>：来（き）てくれる？（你會來（為我）嗎）／来る？（你會來嗎，無恩惠意味）。加くれる才有「為我」的心意。<br><span class=\"n4\">N4 必考：授受動詞表達恩惠的功能</span>"],["B","行きたいけど、その日は大事な会議があるんだ。","Ikitai kedo, sono hi wa daiji na kaigi ga aru n da.","我想去，可是那天有重要的會議。","▸ <b>句型</b>：【〜たい＋けど】逆接＋【〜んだ】說明。<br>▸ <b>變化</b>：行（い）く → 行き<b>たい</b>＋けど（先表達意願）→ ある＋んだ（說明理由）。<br>▸ <b>用法</b>：<b>先說想去、再用けど轉折</b>，是日語拒絕的標準結構（不直接說「行（い）けない」）。<br>▸ <b>比較</b>：行（い）きたいけど（想去但…）／行けない（不能去，較直接）／ちょっと難（むずか）しい（有點困難・最委婉）。<br><span class=\"n4\">N4 必考：委婉拒絕的表達結構</span>"]]},{"name":"拒絕（2）","lines":[["A","駅まで車で送りましょう。","Eki made kuruma de okurimashō.","我開車送你到車站吧。","▸ <b>句型</b>：【まで】終點＋【で】手段＋【〜ましょう】主動提出。<br>▸ <b>變化</b>：送（おく）る → 送ります → 送り<b>ましょう</b>（我來送你吧）。<br>▸ <b>用法</b>：「車（くるま）<b>で</b>」交通工具用で；ましょう在此是主動提供幫助。<br>▸ <b>比較</b>：送（おく）りましょう（我送你吧）／送りましょうか（我送你好嗎・更客氣）／送ります（我會送）。<br><span class=\"n4\">N4 必考：で 表交通工具・手段</span>"],["B","いいです。友達に頼んでますから。","Ii desu. Tomodachi ni tanonde masu kara.","不用了，我已經拜託朋友了。","▸ <b>句型</b>：【いいです】婉拒＋【〜ている的縮約】＋【から】理由。<br>▸ <b>變化</b>：頼（たの）む → 頼んで＋いる → <b>頼んでます</b>（い脫落的口語）＋から。<br>▸ <b>用法</b>：「いいです」在此是<b>婉拒</b>（不用了），要靠語調與後續理由判斷；「〜に頼（たの）む」對象用に。<br>▸ <b>比較</b>：いいです（不用了・婉拒）／いいですよ（可以啊・接受）／けっこうです（明確婉拒）。<br><span class=\"n4\">N4 聽解陷阱：いいです 的婉拒功能</span>"]]},{"name":"拒絕（3）","lines":[["A","私の日本語の小論文に何かアドバイスをいただけますか？","Watashi no Nihongo no shōronbun ni nani ka adobaisu wo itadakemasu ka?","可以給我的日文小論文一些建議嗎？","▸ <b>句型</b>：【〜に】對象＋【〜をいただけますか】謙讓請求。<br>▸ <b>變化</b>：もらう → <b>いただく</b>（謙讓）→ 可能形 いただける → いただけますか。<br>▸ <b>用法</b>：「小論文（しょうろんぶん）<b>に</b>アドバイスをいただく」——給予建議的對象用に；「私（わたし）の日本語（にほんご）の小論文」是の的連續修飾。<br>▸ <b>比較</b>：いただけますか（請對方給我・謙讓）／くださいますか（尊敬・對方給我）／もらえますか（一般）。<br><span class=\"n4\">N4 必考：いただく／くださる 的視點差異</span>"],["B","喜んでお手伝いしたいんですが。でも次の月曜日までには時間がありません。","Yorokonde otetsudai shitai n desu ga. Demo tsugi no getsuyōbi made ni wa jikan ga arimasen.","我很樂意幫忙。但是下星期一之前我沒時間。","▸ <b>句型</b>：【喜んで＋たい＋んですが】＋【までには】期限。<br>▸ <b>變化</b>：お手伝（てつだ）いする → お手伝いし<b>たい</b>＋んですが（想幫忙但…）。<br>▸ <b>用法</b>：<b>までに</b>表期限（在某時間之前完成），加は強調對比；「まで」則表持續到某時。<br>▸ <b>比較</b>：月曜日（げつようび）までに（在週一前完成・期限）／月曜日まで（持續到週一）。<b>一字之差，語意完全不同</b>。<br><span class=\"n4\">N4 必考：まで／までに 的區別</span>"]]}]},"10":{"title":"提議、邀請","jp_title":"提案・誘う","theme":"提案、邀請和建議","scenes":[{"name":"邀請打網球","lines":[["A","あしたテニスをしないか？","Ashita tenisu wo shinai ka?","明天要不要打網球？","▸ <b>句型</b>：【否定疑問形的邀約】＋【か】男性常體。<br>▸ <b>變化</b>：する → ない形<b>しない</b> → しないか？（男性常體邀約）。<br>▸ <b>用法</b>：日語用<b>否定形邀約</b>，留給對方拒絕的空間，比肯定形有禮貌；「あした」不加に。<br>▸ <b>比較</b>：しないか（男性・常體）／しない？（男女皆可）／しませんか（丁寧）／しましょう（較強勢的提議）。<br><span class=\"n4\">N4 必考：〜ませんか 表邀約的否定疑問用法</span>"],["B","いいね。1時でいいかい？","Ii ne. Ichi-ji de ii kai?","好啊！1點可以嗎？","▸ <b>句型</b>：【〜でいい】條件足夠＋【かい】男性常體疑問。<br>▸ <b>變化</b>：1時（じ）<b>で</b>＝以1點這個條件；かい接名詞・い形容詞（接名詞・な形容詞則用だい）。<br>▸ <b>用法</b>：「〜でいい？」＝這樣就可以嗎（確認條件是否可接受）。<br>▸ <b>比較</b>：1時（じ）でいい（1點就行）／1時がいい（1點比較好・偏好）。<b>で＝條件，が＝選擇</b>。<br><span class=\"n4\">N4 必考：〜でいい／〜がいい 的差異</span>"],["A","いいよ。","Ii yo.","好的。","▸ <b>句型</b>：【いい＋よ】常體答應。<br>▸ <b>變化</b>：いいです → いいよ（常體＋告知）。<br>▸ <b>用法</b>：答應邀約的最短說法；沒有よ的「いい」語氣較冷淡。<br>▸ <b>比較</b>：いいよ（好啊・答應）／いいね（不錯耶・表贊同）／いいけど（可以，但…有保留）。<br><span class=\"n4\">N4 聽解必考：終助詞改變答覆的積極度</span>"]]},{"name":"邀請晚餐","lines":[["A","土曜日の晩、夕食に来ませんか？","Doyōbi no ban, yūshoku ni kimasen ka?","週末晚上要不要來吃晚餐？","▸ <b>句型</b>：【〜に来ませんか】邀約＋【時間名詞】。<br>▸ <b>變化</b>：来（く）る → 来（き）ます → 来<b>ません</b>か（否定疑問邀約）。<br>▸ <b>用法</b>：「夕食（ゆうしょく）<b>に</b>来（く）る」＝來吃晚餐（に表目的）；「土曜日（どようび）の晩（ばん）」是複合時間名詞。<br>▸ <b>比較</b>：夕食（ゆうしょく）に来（き）ませんか（來吃晚餐嗎）／夕食を食（た）べに来ませんか（更明確）。前者較自然簡潔。<br><span class=\"n4\">N4 必考：に 表目的（名詞＋に＋移動動詞）</span>"],["B","いいですよ。何時にいけばいいですか？","Ii desu yo. Nanji ni ikeba ii desu ka?","好啊！什麼時候？","▸ <b>句型</b>：【ば形＋いいですか】徵詢＋【時刻＋に】。<br>▸ <b>變化</b>：行（い）く → <b>行けば</b>（う段→え段＋ば）＋いいですか＝我該幾點去才好。<br>▸ <b>用法</b>：接受邀約後主動確認細節；「何時（なんじ）に」時刻用に。<br>▸ <b>比較</b>：行（い）けばいいですか（該去才好）／行ったらいいですか（同義）／何時（なんじ）に行きますか（幾點去，較平淡）。<br><span class=\"n4\">N4 必考：疑問詞＋ば／たら＋いいですか</span>"],["A","6時ごろ来てください。","Roku-ji goro kite kudasai.","那就約六點吧。","▸ <b>句型</b>：【時間＋ごろ】大約＋【て形＋ください】。<br>▸ <b>變化</b>：来（く）る → 来（き）て（不規則）＋ください。<br>▸ <b>用法</b>：<b>ごろ</b>接時間點（6時（ろくじ）ごろ＝六點左右）；<b>ぐらい</b>接數量、期間（1時間（いちじかん）ぐらい＝約一小時）。<br>▸ <b>比較</b>：6時（ろくじ）ごろ（六點左右・時間點）／6時間（ろくじかん）ぐらい（約六小時・期間）。<b>混用是常見錯誤</b>。<br><span class=\"n4\">N4 必考：ごろ／ぐらい 的區別</span>"]]},{"name":"邀請午餐","lines":[["A","一緒にお昼を食べに行きませんか。","Issho ni ohiru wo tabe ni ikimasen ka.","中午要不要一起去吃飯？","▸ <b>句型</b>：【一緒に】＋【ます形＋に＋行きませんか】。<br>▸ <b>變化</b>：食（た）べる → 食べ<b>に</b>行（い）く（去吃）→ 行きませんか（邀約）。<br>▸ <b>用法</b>：「お昼（ひる）」＝午餐（お是美化語）；「食（た）べに行（い）く」的に表目的。<br>▸ <b>比較</b>：お昼（ひる）（午餐・口語）／昼食（ちゅうしょく）（午餐・正式）／ランチ（外來語）。三者皆常用。<br><span class=\"n4\">N4 必考：ます形＋に＋行く 表目的</span>"],["B","もちろん。何時？","Mochiron. Nanji?","當然，什麼時候？","▸ <b>句型</b>：【もちろん】＋【省略助詞的疑問】。<br>▸ <b>變化</b>：何時（なんじ）ですか → <b>何時？</b>（省略ですか）。<br>▸ <b>用法</b>：口語中大量省略助詞與述語；「もちろん」單用表爽快答應。<br>▸ <b>比較</b>：何時（なんじ）？（幾點・常體）／何時ですか（丁寧）／何時にしますか（要定幾點）。<br><span class=\"n4\">N4 聽解必考：省略句的理解</span>"],["A","11時45分。ロビーで会おう。","Jūichi-ji yonjūgo-fun. Robī de aō.","11點45分。大廳見。","▸ <b>句型</b>：【場所＋で】＋【意向形】常體提議。<br>▸ <b>變化</b>：会（あ）う → 意向形<b>会おう</b>（う段→お段＋う）＝ましょう的常體。<br>▸ <b>用法</b>：見面地點用<b>で</b>（動作場所）；意向形用於對平輩、晚輩的提議。<br>▸ <b>比較</b>：会（あ）おう（常體提議）／会いましょう（丁寧提議）／会います（單純陳述）。<br><span class=\"n4\">N4 必考：意向形變化（一類う段→お段＋う／二類る→よう／三類しよう・来よう）</span>"]]},{"name":"邀請購物","lines":[["A","きょうの午後、私と買い物に行きませんか？","Kyō no gogo, watashi to kaimono ni ikimasen ka?","今天下午要不要跟我一起去購物？","▸ <b>句型</b>：【〜と】共同對象＋【〜に行きませんか】。<br>▸ <b>變化</b>：行（い）く → 行きませんか（否定疑問邀約）。<br>▸ <b>用法</b>：共同行動的對象用<b>と</b>（私（わたし）と）；「買（か）い物（もの）に行（い）く」的に表目的。<br>▸ <b>比較</b>：私（わたし）と行（い）きませんか（要不要跟我去）／一緒（いっしょ）に行きませんか（要不要一起去）。兩者可併用。<br><span class=\"n4\">N4 必考：と 表共同動作</span>"],["B","いいわよ。何時に出ますか？","Ii wa yo. Nanji ni demasu ka?","好啊！什麼時候？","▸ <b>句型</b>：【いいわよ】女性答應＋【時刻＋に】。<br>▸ <b>變化</b>：出（で）る → 出ます → 出ますか（出發）。<br>▸ <b>用法</b>：「出（で）る」在此指出發、離開；「何時（なんじ）に出ますか」＝幾點出發。<br>▸ <b>比較</b>：出（で）る（出去・出發・自動詞）／出（だ）す（拿出・提出・他動詞）。家（いえ）を出る／手紙（てがみ）を出す。<br><span class=\"n4\">N4 必考：自他動詞配對（出る／出す）</span>"],["A","昼食後、すぐに行きましょう。","Chūshoku go, sugu ni ikimashō.","吃完午飯後馬上去。","▸ <b>句型</b>：【名詞＋後】＋【副詞すぐに】＋【ましょう】。<br>▸ <b>變化</b>：昼食（ちゅうしょく）＋<b>後（ご）</b>（漢語名詞後綴）＝午餐之後。<br>▸ <b>用法</b>：「〜後（ご）」接漢語名詞；動詞則用「〜た後（あと）で」。「すぐに」＝立刻。<br>▸ <b>比較</b>：昼食後（ちゅうしょくご）（名詞＋後）／食（た）べた後（あと）で（動詞た形＋後で）／食べてから（動詞て形＋から）。<br><span class=\"n4\">N4 必考：後（ご／あと）的兩種讀法與接續</span>"]]},{"name":"提議導覽","lines":[["A","あした町をご案内しましょうか。","Ashita machi wo goannai shimashō ka.","明天帶你參觀一下這個都市吧！","▸ <b>句型</b>：【ご＋漢語動詞＋する】謙讓語＋【ましょうか】提供服務。<br>▸ <b>變化</b>：案内（あんない）する → <b>ご案内する</b>（謙讓）→ ご案内し<b>ましょうか</b>（我來為您導覽好嗎）。<br>▸ <b>用法</b>：「ましょうか」是<b>主動提供服務</b>並詢問對方意願，比「ましょう」客氣；「町（まち）を案内（あんない）する」經過的範圍用を。<br>▸ <b>比較</b>：ご案内（あんない）しましょうか（我來導覽好嗎）／案内します（我會導覽）／案内してあげます（帶有施恩語氣，宜避免）。<br><span class=\"n4\">N4 必考：ご〜する 的謙讓語與 ましょうか 的服務提供</span>"],["B","ではお願いします。","De wa onegai shimasu.","那真是太好了。","▸ <b>句型</b>：【では】＋【お願いします】接受好意。<br>▸ <b>變化</b>：では（正式）／じゃあ（口語）；お願（ねが）いします是謙讓語的固定形。<br>▸ <b>用法</b>：接受對方提議時說「ではお願（ねが）いします」，比「はい」更有禮貌。<br>▸ <b>比較</b>：お願（ねが）いします（接受並拜託）／けっこうです（婉拒）／大丈夫（だいじょうぶ）です（現代口語的婉拒，語意模糊）。<br><span class=\"n4\">N4 會考接受與婉拒的表達</span>"],["A","10時ごろ出かけましょう。","Jū-ji goro dekakemashō.","那我們10點左右出發吧。","▸ <b>句型</b>：【時間＋ごろ】＋【ましょう】共同行動。<br>▸ <b>變化</b>：出（で）かける → 出かけます → 出かけ<b>ましょう</b>。<br>▸ <b>用法</b>：「出（で）かける」＝出門、外出（二類動詞）；ましょう表提議一起行動。<br>▸ <b>比較</b>：出（で）かける（外出）／出る（出去・離開）／行（い）く（去）。出かける含「離家一段時間」的意味。<br><span class=\"n4\">N4 必考：出かける／出る 的語意差異</span>"]]},{"name":"提議載送","lines":[["A","駅までお乗りになりませんか？","Eki made onori ni narimasen ka?","要不要我載你到車站啊？","▸ <b>句型</b>：【お＋ます形＋になる】尊敬語＋【ませんか】邀約。<br>▸ <b>變化</b>：乗（の）る → <b>お乗りになる</b>（尊敬語：お＋ます形＋になる）→ お乗りになりませんか。<br>▸ <b>用法</b>：把<b>對方</b>的動作抬高用「お〜になる」；自己的動作降低用「お〜する」。兩者<b>絕不可搞錯</b>。<br>▸ <b>比較</b>：お乗（の）りになりませんか（尊敬・對方搭乘）／お乗りしませんか（×，錯誤用法）／乗りませんか（一般）。<br><span class=\"n4\">N4 必考：お〜になる（尊敬）vs お〜する（謙讓）</span>"],["B","ありがとうございます。ちょうどバスに乗り遅れるところだったのです。","Arigatō gozaimasu. Chōdo basu ni noriokureru tokoro datta no desu.","太謝謝你了。差點就搭不上公車了。","▸ <b>句型</b>：【〜るところだった】差一點就… ＋【ちょうど】＋【のです】說明。<br>▸ <b>逐詞拆解</b>：<b>ちょうど</b>＝正好、剛好；<b>バスに乗（の）り遅（おく）れる</b>＝乗り遅れる（複合動詞・沒趕上），對象用<b>に</b>；<b>ところだった</b>＝ところ（形式名詞・場面）＋だった（過去）＝「本來就要…了」；<b>のです</b>＝說明狀況。<br>▸ <b>句型公式</b>：<b>［辭書形］＋ところだった</b>＝差一點就…（但實際上沒發生）。例：<b>忘（わす）れるところだった</b>（差點忘了）／<b>ぶつかるところだった</b>（差點撞上）／<b>遅刻（ちこく）するところでした</b>（差點遲到）。<br>▸ <b>用法</b>：本句是<b>道謝的理由</b>——「幸好你載我，我差點就趕不上公車了」。「ところだった」帶有<b>慶幸或驚險</b>的語感，常與「ちょうど」「危（あぶ）なく」「もう少（すこ）しで」搭配。<br>▸ <b>比較</b>：<b>ところ</b>的三種時態：<b>〜るところだ</b>（正要做）／<b>〜ているところだ</b>（正在做）／<b>〜たところだ</b>（剛做完）。再加上<b>〜るところだった</b>（差點就要）。四者靠時態區分，是 N4 必考組。<br><span class=\"n4\">N4 必考：ところ 的四種時態用法</span>"],["A","それはよかったです。","Sore wa yokatta desu.","很高興能幫你。","▸ <b>句型</b>：【それは＋よかった】表欣慰。<br>▸ <b>變化</b>：いい → <b>よかった</b>（不規則過去式）＋です。<br>▸ <b>用法</b>：對對方的好結果表示欣慰；「それは」指對方剛說的事。<br>▸ <b>比較</b>：それはよかったです（那真好）／それは残念（ざんねん）でしたね（那真遺憾）／それは大変（たいへん）でしたね（那真辛苦了）。<br><span class=\"n4\">N4 必考：いい 的過去式是「よかった」</span>"]]},{"name":"邀請晚餐（正式）","lines":[["A","こんどの日曜日に家族とあなたを夕食にお招きしたいのですが。おひまですか。","Kondo no nichiyōbi ni kazoku to anata wo yūshoku ni omaneki shitai no desu ga. Ohima desu ka.","這星期天我們家想請你吃晚飯。你有空嗎？","▸ <b>句型</b>：【お＋ます形＋する】謙讓＋【たい】＋【のですが】＋【お＋名詞】尊敬。<br>▸ <b>變化</b>：招（まね）く → <b>お招きする</b>（謙讓）→ お招きし<b>たい</b>＋のですが（留白）；ひま → <b>お</b>ひま（加お表尊敬）。<br>▸ <b>用法</b>：最鄭重的邀請形式；「〜たいのですが」說出願望後留白，等對方回應。<br>▸ <b>比較</b>：お招（まね）きしたいのですが（最鄭重）／招待（しょうたい）したいのですが（一般）／来（き）ませんか（口語邀約）。<br><span class=\"n4\">N4 必考：お〜したい 的謙讓願望表現</span>"],["B","はい、ぜひうかがいます。","Hai, zehi ukagaimasu.","有啊，我一定到。","▸ <b>句型</b>：【ぜひ】＋【うかがう】謙讓語。<br>▸ <b>變化</b>：行（い）く・訪（たず）ねる → <b>伺（うかが）う</b>（謙讓語）→ 伺います。<br>▸ <b>用法</b>：<b>ぜひ</b>必與意志、願望表現呼應（ぜひ行（い）きたい／ぜひ伺（うかが）います），不可接否定。<br>▸ <b>比較</b>：伺（うかが）う（謙讓・拜訪或詢問）／参（まい）る（謙讓・去・來）／いらっしゃる（尊敬・去・來・在）。<br><span class=\"n4\">N4 必考：伺う 的兩種意思（拜訪／請教）</span>"],["A","それはよかった。6時30分にお待ちしております。","Sore wa yokatta. Roku-ji sanjuppun ni omachi shite orimasu.","那真是太好了。那就跟你約六點三十分。","▸ <b>句型</b>：【お＋ます形＋する】謙讓 ＋【〜ておる】いる的謙讓語 → 雙重謙讓。<br>▸ <b>逐詞拆解</b>：<b>お待（ま）ち</b>＝お＋待つ的ます形（謙讓語的前半）；<b>して</b>＝する的て形 → <b>お待ちする</b>＝謙讓地「等待」；<b>おります</b>＝いる的<b>謙讓語おる</b>＋ます → 合起來＝<b>お待ちしております</b>（最鄭重的「等您」）。<br>▸ <b>句型公式</b>：<b>お＋ます形＋しております</b>＝最鄭重的持續狀態。例：<b>お待（ま）ちしております</b>（等候您）／<b>お待ちしています</b>（鄭重）／<b>待っています</b>（一般）。同類：<b>存（ぞん）じております</b>（我知道）、<b>伺（うかが）っております</b>（我聽說了）。<br>▸ <b>用法</b>：商務信件、電話結尾的固定語。「6時30分（ろくじさんじゅっぷん）<b>に</b>」時刻用に。「それはよかった」＝那真是太好了（回應對方接受邀約）。<br>▸ <b>比較</b>：<b>おる</b>（いる的謙讓，只用於自己或自家人）／<b>いらっしゃる</b>（いる的尊敬，用於他人）。說「×お客様（きゃくさま）がおります」是重大錯誤，要說「いらっしゃいます」。<br><span class=\"n4\">N4 必考：おる／いらっしゃる 的內外對應</span>"]]},{"name":"邀請看展","lines":[["A","美術館でエジプト美術展があるんだけど。あした行かない。","Bijutsukan de Ejiputo bijutsuten ga aru n dakedo. Ashita ikanai.","美術館有個埃及藝術展。明天要不要去？","▸ <b>句型</b>：【場所＋で＋がある】＋【んだけど】留白＋【否定疑問邀約】。<br>▸ <b>變化</b>：ある ＋ <b>んだ</b>（＝のだ）＋けど（留白）；行（い）く → 行かない？（邀約）。<br>▸ <b>用法</b>：活動舉行的場所用<b>で</b>（美術館（びじゅつかん）で展覧会（てんらんかい）がある）；先提供資訊再邀約是自然的順序。<br>▸ <b>比較</b>：美術館（びじゅつかん）で（活動場所・で）／美術館に（存在場所・に）。<b>あるが存在句時用に，活動時用で</b>。<br><span class=\"n4\">N4 必考：〜で〜がある（活動）vs 〜に〜がある（存在）</span>"],["B","あしたは都合が悪いな。あさってはどう？","Ashita wa tsugō ga warui na. Asatte wa dō?","明天不行。後天怎樣？","▸ <b>句型</b>：【慣用句都合が悪い】＋【〜はどう？】提替代方案。<br>▸ <b>變化</b>：都合（つごう）が悪（わる）い（い形容詞句）＋な（男性的自語語氣）。<br>▸ <b>用法</b>：「都合（つごう）が悪（わる）い」是<b>不說明具體理由</b>的委婉拒絕，日語常用；再提替代日期表示仍有意願。<br>▸ <b>比較</b>：都合（つごう）が悪（わる）い（不方便・委婉）／忙（いそが）しい（忙・具體）／行（い）けない（不能去・直接）。<br><span class=\"n4\">N4 必考：委婉拒絕的慣用表現</span>"],["A","ぼくはいいよ。","Boku wa ii yo.","沒問題。","▸ <b>句型</b>：【〜は】對比＋【いいよ】答應。<br>▸ <b>變化</b>：ぼく＋<b>は</b>（表對比：至少我這邊沒問題）。<br>▸ <b>用法</b>：用<b>は</b>把自己與別人區隔，暗示「其他人我不知道」。<br>▸ <b>比較</b>：ぼくはいいよ（我可以）／ぼくがいいよ（我比較好・語意不同）。助詞改變語意。<br><span class=\"n4\">N4 必考：は 的對比功能</span>"]]},{"name":"提供腳踏車","lines":[["A","よければ、僕の自転車を使ってもいいよ。","Yokereba, boku no jitensha wo tsukatte mo ii yo.","如果可以的話，你用我的腳踏車也行。","▸ <b>句型</b>：【ば形】條件＋【〜てもいい】許可・提供。<br>▸ <b>變化</b>：いい → <b>よければ</b>（不規則ば形）；使（つか）う → 使って＋も＋いいよ。<br>▸ <b>用法</b>：「よければ」＝如果你願意的話；「〜てもいいよ」在此是<b>主動提供</b>而非請求許可。<br>▸ <b>比較</b>：使（つか）ってもいいよ（你可以用・提供）／使ってもいい？（我可以用嗎・請求）。<b>同一句型兩種方向</b>。<br><span class=\"n4\">N4 必考：〜てもいい 的提供與請求兩用</span>"],["B","ほんとう？ありがとう。","Hontō? Arigatō.","真的？謝謝。","▸ <b>句型</b>：【ほんとう？】確認＋【ありがとう】。<br>▸ <b>變化</b>：本当（ほんとう）ですか → ほんとう？（升調＝驚訝與確認）。<br>▸ <b>用法</b>：對意外的好意表示驚喜；語調上揚是關鍵。<br>▸ <b>比較</b>：ほんとう？（真的嗎・驚喜）／ほんとに？（口語縮短）／まさか（不會吧・難以置信）。<br><span class=\"n4\">N4 聽解必考：靠語調判斷句子功能</span>"],["A","どういたしまして。","Dō itashimashite.","不客氣。","▸ <b>句型</b>：【どういたしまして】。<br>▸ <b>變化</b>：どう＋いたす（する的謙讓語）＋まして。<br>▸ <b>用法</b>：回應道謝的標準說法；口語中也常說「いえいえ」「とんでもない」。<br>▸ <b>比較</b>：どういたしまして（標準）／いえいえ（口語）／とんでもないです（哪裡的話・更謙虛）。<br><span class=\"n4\">N4 會考回應道謝的多種說法</span>"]]},{"name":"拒絕邀請（1）","lines":[["A","今週末に映画に行こうよ。","Konshūmatsu ni eiga ni ikō yo.","這週末去看電影吧。","▸ <b>句型</b>：【時間＋に】＋【意向形＋よ】積極邀約。<br>▸ <b>變化</b>：行（い）く → 意向形<b>行こう</b>＋よ＝一起去吧。<br>▸ <b>用法</b>：「今週末（こんしゅうまつ）<b>に</b>」——「週末（しゅうまつ）」可加に也可不加；意向形＋よ的邀約語氣比「行（い）かない？」積極。<br>▸ <b>比較</b>：行（い）こうよ（積極邀約）／行かない？（留餘地）／行きましょう（丁寧提議）。<br><span class=\"n4\">N4 必考：意向形的邀約用法</span>"],["B","悪いだけど、行けないよ。試験勉強をしなくちゃ。","Warui dakedo, ikenai yo. Shiken benkyō wo shinakucha.","不好意思，我不能去。得準備考試。","▸ <b>句型</b>：【悪いけど】緩衝＋【可能形否定】＋【〜なくちゃ】口語義務。<br>▸ <b>變化</b>：行（い）ける → 行けない（可能形否定）；しなくてはならない → <b>しなくちゃ</b>（口語縮約，後半全省略）。<br>▸ <b>用法</b>：「〜なくちゃ」是「なくてはならない」的極簡口語形，年輕人常用。<br>▸ <b>比較</b>：しなくちゃ（口語）／しないと（口語，同義）／しなければならない（正式）。<br><span class=\"n4\">N4 聽解必考：なくちゃ・ないと 的還原</span>"]]},{"name":"拒絕邀請（2）","lines":[["A","今晩ボーリングに行きませんか？","Konban bōringu ni ikimasen ka?","今晚要不要去打保齡球？","▸ <b>句型</b>：【〜に行きませんか】邀約。<br>▸ <b>變化</b>：行（い）く → 行きませんか（否定疑問）。<br>▸ <b>用法</b>：「ボーリングに行（い）く」——活動名詞＋に＋行く表目的；「今晩（こんばん）」不加に。<br>▸ <b>比較</b>：ボーリングに行（い）く（去打保齡球）／ボーリングをする（打保齡球）。前者含移動。<br><span class=\"n4\">N4 必考：名詞＋に＋行く 的目的用法</span>"],["B","誘ってくれてありがとう。でも今夜は遅くまで仕事です。","Sasotte kurete arigatō. Demo kon'ya wa osoku made shigoto desu.","謝謝你邀請。但是今晚要工作到很晚。","▸ <b>句型</b>：【〜てくれて＋ありがとう】＋【でも】轉折＋【まで】時間終點。<br>▸ <b>變化</b>：誘（さそ）う → 誘って＋<b>くれて</b>（對方為我做，て形表原因）。<br>▸ <b>用法</b>：<b>先謝再拒</b>是日語拒絕邀約的標準結構；「遅（おそ）くまで」＝到很晚（まで表持續終點）。<br>▸ <b>比較</b>：遅（おそ）くまで仕事（しごと）です（工作到很晚）／遅くまでに（×，までに用於期限）。<br><span class=\"n4\">N4 必考：拒絕邀約的「先謝後拒」結構</span>"]]},{"name":"拒絕邀請（3）","lines":[["A","仕事のあと、一杯どう？","Shigoto no ato, ippai dō?","下班後去喝一杯如何？","▸ <b>句型</b>：【名詞＋のあと】＋【省略動詞的邀約】。<br>▸ <b>變化</b>：仕事（しごと）＋<b>のあと</b>（名詞＋の＋あと）；「一杯（いっぱい）どう？」省略了「飲（の）みませんか」。<br>▸ <b>用法</b>：「一杯（いっぱい）」特指<b>喝一杯酒</b>，是日本職場文化的固定說法。<br>▸ <b>比較</b>：仕事（しごと）のあと（下班後）／仕事した後（あと）で（動詞た形＋後で）／仕事後（しごとご）（漢語＋後）。<br><span class=\"n4\">N4 必考：あと 的三種接續形式</span>"],["B","悪いんだけど、きょうはだめなんです。","Warui n dakedo, kyō wa dame na n desu.","不好意思，今天不行。","▸ <b>句型</b>：【悪いんだけど】緩衝＋【だめ＋なんです】說明。<br>▸ <b>變化</b>：だめだ → だめ<b>なんです</b>（な形容詞＋なのです的口語）。<br>▸ <b>用法</b>：「〜なんです」比單說「だめです」柔和，因為帶有「情況是這樣」的說明語氣。<br>▸ <b>比較</b>：だめなんです（說明・柔和）／だめです（直接）／ちょっと難（むずか）しいです（最委婉）。<br><span class=\"n4\">N4 必考：な形容詞＋なんです（＝なのです）</span>"]]},{"name":"拒絕邀請（4）","lines":[["A","もう少しスープはどう？","Mō sukoshi sūpu wa dō?","再來點湯如何？","▸ <b>句型</b>：【もう少し】＋【〜はどう？】勸食。<br>▸ <b>變化</b>：もう＋少（すこ）し＝再一點；「どう？」省略了「いかがですか」。<br>▸ <b>用法</b>：勸食的固定說法；也常說「もう少（すこ）しいかがですか」（更禮貌）。<br>▸ <b>比較</b>：もう少（すこ）し（再一點・數量）／もう一度（いちど）（再一次・次數）／もっと（更多・程度）。<br><span class=\"n4\">N4 必考：もう＋少し／一度 的區別</span>"],["B","けっこうです。ありがとう。もう十分です。","Kekkō desu. Arigatō. Mō jūbun desu.","不用了，謝謝。已經夠了。","▸ <b>句型</b>：【けっこうです】婉拒＋【もう＋十分】。<br>▸ <b>變化</b>：けっこう（副詞・相當）→ けっこうです（在此＝夠了，不用了）。<br>▸ <b>用法</b>：「けっこうです」是<b>婉拒</b>；但「けっこうおいしい」則是「相當好吃」——同一詞兩種功能。<br>▸ <b>比較</b>：けっこうです（不用了・婉拒）／けっこういい（相當不錯）／もう十分（じゅうぶん）です（已經夠了）。<br><span class=\"n4\">N4 聽解陷阱：けっこうです 的婉拒功能</span>"]]}]},"11":{"title":"詢問預定事情及意圖","jp_title":"予定や意図をたずねる・言う","theme":"詢問計畫、日程和意圖","scenes":[{"name":"詢問休假計畫","lines":[["A","休みの計画はありますか？","Yasumi no keikaku wa arimasu ka?","你有休假的計畫嗎？","▸ <b>句型</b>：【AのB】＋【〜はありますか】。<br>▸ <b>變化</b>：ある → あります → ありますか；計画（けいかく）（無生命）用<b>ある</b>。<br>▸ <b>用法</b>：「休（やす）みの計画（けいかく）」＝假期的計畫（の連接）；詢問是否有計畫的標準句。<br>▸ <b>比較</b>：計画（けいかく）がある（有計畫）／予定（よてい）がある（有預定・更具體已排定）／つもりだ（打算・主觀意志）。<br><span class=\"n4\">N4 必考：計画／予定／つもり 的差異</span>"],["B","いいえ。忙しすぎて考える時間もないのです。","Iie. Isogashi sugite kangaeru jikan mo nai no desu.","沒有。我忙得連想的時間都沒有。","▸ <b>句型</b>：【い形容詞＋すぎる】過度＋【て形表原因】＋【も】強調＋【のです】。<br>▸ <b>變化</b>：忙（いそが）しい → 去い＋<b>すぎる</b> → 忙しすぎ<b>て</b>（て形表原因）；考（かんが）える → 考える時間（じかん）（動詞修飾名詞）。<br>▸ <b>用法</b>：「時間（じかん）<b>も</b>ない」的も表「連…都沒有」，加強語氣。<br>▸ <b>比較</b>：忙（いそが）しすぎて（太忙以致於）／忙しいので（因為忙）／忙しいから（因為忙・口語）。<br><span class=\"n4\">N4 必考：〜すぎる 的接續（い形去い／な形去だ／動詞ます形）</span>"]]},{"name":"詢問去處","lines":[["A","休み中にどこかへお出かけですか？","Yasumi-chū ni doko ka e odekake desu ka?","休假有想要去哪裡嗎？","▸ <b>句型</b>：【〜中に】期間＋【どこか】不特定＋【お＋ます形＋です】尊敬語。<br>▸ <b>變化</b>：出（で）かける → <b>お出かけ</b>（お＋ます形）＋ですか＝尊敬語的狀態問法。<br>▸ <b>用法</b>：「休（やす）み中（ちゅう）に」＝假期期間（中＝ちゅう／じゅう，此處讀ちゅう）；「どこかへ」不特定場所＋方向。<br>▸ <b>比較</b>：お出（で）かけですか（尊敬・簡潔）／出かけますか（一般）／お出かけになりますか（更完整的尊敬語）。<br><span class=\"n4\">N4 必考：お＋ます形＋です 的尊敬用法</span>"],["B","ええ。友達2、3人と北海道をサイクリングでまわるつもりです。","Ē. Tomodachi ni-san-nin to Hokkaidō wo saikuringu de mawaru tsumori desu.","是的。我要和二、三個朋友到北海道自行車旅遊。","▸ <b>句型</b>：【〜と】共同＋【を】經過範圍＋【で】手段＋【つもりです】打算。<br>▸ <b>變化</b>：まわる → まわる<b>つもりです</b>（辭書形＋つもり）＝打算…。<br>▸ <b>用法</b>：「北海道（ほっかいどう）<b>を</b>まわる」經過的範圍用を；「サイクリング<b>で</b>」手段用で；「2、3人（さんにん）」＝兩三人。<br>▸ <b>比較</b>：つもりです（主觀打算）／予定（よてい）です（客觀已排定）／〜（よ）うと思（おも）う（正在考慮）。<br><span class=\"n4\">N4 必考：つもり／予定 的差異</span>"]]},{"name":"詢問暑假","lines":[["A","夏休み中に何をする予定ですか？","Natsuyasumi-chū ni nani wo suru yotei desu ka?","暑假你要作什麼？","▸ <b>句型</b>：【〜中に】＋【辭書形＋予定です】。<br>▸ <b>變化</b>：する → する<b>予定（よてい）です</b>（辭書形＋予定）。<br>▸ <b>用法</b>：「予定（よてい）」表<b>已安排好的行程</b>，比「つもり」客觀；「夏休（なつやす）み中（ちゅう）に」＝暑假期間。<br>▸ <b>比較</b>：する予定（よてい）です（已排定）／するつもりです（我打算）／するかもしれません（可能會）。<br><span class=\"n4\">N4 必考：〜予定です 的接續（辭書形／名詞＋の）</span>"],["B","アルバイトをする予定です。","Arubaito wo suru yotei desu.","我準備要去打工。","▸ <b>句型</b>：【〜をする＋予定です】。<br>▸ <b>變化</b>：アルバイトをする ＋ 予定（よてい）です。<br>▸ <b>用法</b>：「アルバイト」（德語 Arbeit）＝打工，口語縮短為「バイト」。<br>▸ <b>比較</b>：アルバイト（打工）／パート（兼職・多指主婦）／就職（しゅうしょく）（正式就業）。<br><span class=\"n4\">N4 必考：外來語的縮略（アルバイト→バイト）</span>"]]},{"name":"詢問黃金週","lines":[["A","ゴールデンウィークの計画は何ですか？","Gōruden wīku no keikaku wa nan desu ka?","黃金週你有什麼計劃？","▸ <b>句型</b>：【AのB＋は＋何ですか】。<br>▸ <b>變化</b>：計画（けいかく）は何（なん）ですか＝直接詢問內容。<br>▸ <b>用法</b>：「ゴールデンウィーク」＝黃金週（日本四月底到五月初的連假），口語說「GW」。<br>▸ <b>比較</b>：計画（けいかく）は何（なん）ですか（計畫是什麼）／計画がありますか（有沒有計畫）。前者<b>預設對方有計畫</b>。<br><span class=\"n4\">N4 會考日本文化相關詞彙</span>"],["B","家族でハワイへ行きます。","Kazoku de Hawai e ikimasu.","我們全家要去夏威夷。","▸ <b>句型</b>：【〜で】表群體單位＋【〜へ行きます】。<br>▸ <b>變化</b>：家族（かぞく）＋<b>で</b>＝以家族為單位（全家一起）。<br>▸ <b>用法</b>：<b>で</b>表以某群體、人數為單位行動（一人（ひとり）で／二人（ふたり）で／家族（かぞく）で／みんなで）。<br>▸ <b>比較</b>：家族（かぞく）で行（い）く（全家一起去）／家族と行く（和家人一起去）。<b>で＝整體單位，と＝同行對象</b>。<br><span class=\"n4\">N4 必考：で 表人數・單位</span>"]]},{"name":"詢問出發","lines":[["A","いつハワイへ行くのですか？","Itsu Hawai e iku no desu ka?","你們什麼時候要去夏威夷？","▸ <b>句型</b>：【いつ】＋【〜のですか】關心式詢問。<br>▸ <b>變化</b>：行（い）く ＋ <b>のですか</b>（＝んですか，帶關心、想了解的語氣）。<br>▸ <b>用法</b>：加のです比「いつ行（い）きますか」更自然、更有交談感。<br>▸ <b>比較</b>：行（い）くのですか（關心）／行きますか（單純提問）／行くんですか（口語形）。<br><span class=\"n4\">N4 必考：のだ 的關心・確認功能</span>"],["B","あしたの午後3時30分の飛行機です。","Ashita no gogo san-ji sanjuppun no hikōki desu.","明天下午3:30的飛機。","▸ <b>句型</b>：【名詞句回答】＋【の的層層修飾】。<br>▸ <b>變化</b>：あしたの午後（ごご）3時30分（さんじさんじゅっぷん）の飛行機（ひこうき）です——用<b>の</b>層層修飾，最後以名詞句結束。<br>▸ <b>用法</b>：日語回答時間常直接用名詞句，不必說「〜に乗（の）ります」。<br>▸ <b>比較</b>：3時30分の飛行機（ひこうき）です（名詞句）／3時30分に出発（しゅっぱつ）します（動詞句）。前者簡潔自然。<br><span class=\"n4\">N4 必考：の 的連續修飾</span>"],["A","では、朝のうちに家を出なくてはなりませんね。","De wa, asa no uchi ni ie wo denakute wa narimasen ne.","那你們不就早上就要出門？","▸ <b>句型</b>：【〜のうちに】期間＋【〜なくてはなりません】義務＋【ね】。<br>▸ <b>變化</b>：出（で）る → ない形 出ない → <b>出なくては</b>＋なりません（義務）。<br>▸ <b>用法</b>：「朝（あさ）のうちに」＝趁著早上（表在某狀態持續期間內完成）；「家（いえ）を出（で）る」離開的場所用を。<br>▸ <b>比較</b>：〜うちに（趁著…期間）／〜間（あいだ）に（在…期間內）／〜までに（在…之前）。三者微妙不同。<br><span class=\"n4\">N4 必考：〜うちに／〜間に 的區別</span>"],["B","そうです。10時に出ようと思っています。","Sō desu. Jū-ji ni deyō to omotte imasu.","對啊，我們計劃10點就要出門。","▸ <b>句型</b>：【意向形＋と思っています】持續的打算。<br>▸ <b>變化</b>：出（で）る → 意向形<b>出よう</b>（二類：る→よう）＋と思（おも）っています。<br>▸ <b>用法</b>：「〜（よ）うと思（おも）っています」表<b>已持續一段時間的打算</b>，比「〜と思います」（剛決定）更確定。<br>▸ <b>比較</b>：出（で）ようと思（おも）っています（一直這麼打算）／出ようと思います（現在這麼想）／出るつもりです（打算，最明確）。<br><span class=\"n4\">N4 必考：〜（よ）うと思う 與 つもり 的差異</span>"]]},{"name":"詢問夏天計畫","lines":[["A","今年の夏はどこにも行く予定はないよ。働くつもり。","Kotoshi no natsu wa doko ni mo iku yotei wa nai yo. Hataraku tsumori.","這個夏天我什麼地方也不去。我要工作。","▸ <b>句型</b>：【疑問詞＋にも＋否定】全面否定＋【つもり】。<br>▸ <b>變化</b>：どこ＋<b>にも</b>＋ない＝哪裡都不…；「行（い）く予定（よてい）はない」＋「働（はたら）くつもり」（省略です）。<br>▸ <b>用法</b>：疑問詞＋<b>も</b>＋否定表全面否定（誰（だれ）も／何（なに）も／どこにも／いつも）。<br>▸ <b>比較</b>：どこにも行（い）かない（哪都不去）／どこかへ行く（去某處）／どこでも行く（哪都能去）。<b>も／か／でも</b>三者功能不同。<br><span class=\"n4\">N4 必考：疑問詞＋も／か／でも 的三種組合</span>"],["B","どうして？","Dō shite?","為什麼？","▸ <b>句型</b>：【どうして？】原因疑問。<br>▸ <b>變化</b>：どうしてですか → どうして？（常體）。<br>▸ <b>用法</b>：最簡短的追問；「なぜ」較書面，「なんで」較口語隨性。<br>▸ <b>比較</b>：どうして（一般・可帶情緒）／なぜ（書面・客觀）／なんで（口語・隨性）。<br><span class=\"n4\">N4 必考：どうして／なぜ／なんで 的語體差異</span>"],["A","冬休みにスキーに行きたいんだ。たくさんお金がかかるからね。","Fuyuyasumi ni sukī ni ikitai n da. Takusan okane ga kakaru kara ne.","我想在寒假時去滑雪，必須花很多錢。","▸ <b>句型</b>：【〜たい＋んだ】說明＋【から】理由＋【ね】。<br>▸ <b>變化</b>：行（い）く → 行き<b>たい</b>＋んだ（＝のだ，說明）；かかる → かかる＋から（理由）。<br>▸ <b>用法</b>：「お金（かね）がかかる」＝花錢（自動詞，主語是お金）；「〜からね」補述理由並尋求理解。<br>▸ <b>比較</b>：お金（かね）がかかる（花錢・自動詞）／お金を使（つか）う（用錢・他動詞）／お金を払（はら）う（付錢）。<br><span class=\"n4\">N4 必考：かかる（時間・金錢）的自動詞用法</span>"]]},{"name":"詢問將來計畫","lines":[["A","将来の計画はどうですか？","Shōrai no keikaku wa dō desu ka?","對於未來你有什麼計劃？","▸ <b>句型</b>：【AのB＋はどうですか】徵詢。<br>▸ <b>變化</b>：どうですか（＝いかがですか的一般形）。<br>▸ <b>用法</b>：「将来（しょうらい）の計画（けいかく）」＝將來的計畫；用「どうですか」廣泛詢問對方的想法。<br>▸ <b>比較</b>：将来（しょうらい）（將來・遙遠）／今後（こんご）（今後・較近）／これから（從現在起）。<br><span class=\"n4\">N4 會考時間副詞的範圍差異</span>"],["B","良い会社に就職して、自分の才能を発揮したいです。","Yoi kaisha ni shūshoku shite, jibun no sainō wo hakki shitai desu.","我想進一家能夠發揮自己才能的好公司。","▸ <b>句型</b>：【て形連接】＋【〜に就職する】＋【〜たいです】。<br>▸ <b>變化</b>：就職（しゅうしょく）する → 就職し<b>て</b>（て形連接兩個動作）；発揮（はっき）する → 発揮し<b>たい</b>。<br>▸ <b>用法</b>：「会社（かいしゃ）<b>に</b>就職（しゅうしょく）する」就職的對象用に；て形連接兩個先後或並列的動作。<br>▸ <b>比較</b>：会社（かいしゃ）に就職（しゅうしょく）する（進公司工作）／会社で働（はたら）く（在公司工作）。<b>に＝加入，で＝場所</b>。<br><span class=\"n4\">N4 必考：に／で 搭配不同動詞</span>"]]},{"name":"詢問週末","lines":[["A","週末は勉強をしなくちゃならないんだ。君は？","Shūmatsu wa benkyō wo shinakucha naranai n da. Kimi wa?","這個週末我要唸書，你呢？","▸ <b>句型</b>：【〜なくちゃならない】口語義務＋【〜は？】反問。<br>▸ <b>變化</b>：しなくてはならない → <b>しなくちゃならない</b>（口語）＋んだ（說明）。<br>▸ <b>用法</b>：「週末（しゅうまつ）は」用は提示話題兼對比；「君（きみ）は？」把話題丟回對方。<br>▸ <b>比較</b>：なくちゃならない（口語）／なくてはならない（一般）／なければならない（正式書面）。<br><span class=\"n4\">N4 必考：義務句型的三種語體</span>"],["B","僕は京都へ行くよ。","Boku wa Kyōto e iku yo.","我要去京都。","▸ <b>句型</b>：【〜は】對比＋【〜へ行きます＋よ】。<br>▸ <b>變化</b>：僕（ぼく）＋<b>は</b>（對比：相對於你）；「京都（きょうと）へ」方向用へ。<br>▸ <b>用法</b>：<b>よ</b>告知對方自己的預定；は表與對方情況的對比。<br>▸ <b>比較</b>：京都（きょうと）へ行（い）く（往京都・強調方向）／京都に行く（到京都・強調目的地）。兩者多可互換。<br><span class=\"n4\">N4 必考：へ／に 的細微差異</span>"]]}]},"12":{"title":"詢問理由及目的","jp_title":"理由や目的をたずねる・答える","theme":"詢問原因、目的和為什麼","scenes":[{"name":"詢問開快車","lines":[["A","どうしてそんなにスピードを出していたのですか？","Dō shite sonna ni supīdo wo dashite ita no desu ka?","你為什麼開車開那麼快？","▸ <b>句型</b>：【どうして】＋【〜ていた】過去進行＋【のですか】。<br>▸ <b>變化</b>：出（だ）す → 出して＋いた（過去持續）→ 出していた＋<b>のですか</b>。<br>▸ <b>用法</b>：問理由時<b>加のです</b>語氣才不會太生硬（單說「どうして出（だ）していましたか」像在質問）；「スピードを出す」＝加速。<br>▸ <b>比較</b>：〜のですか（帶關心・自然）／〜ますか（直接・可能顯得咄咄逼人）。<br><span class=\"n4\">N4 必考：疑問句＋のです 的語氣緩和功能</span>"],["B","2時20分に空港で上司を出迎えなくてはならないのです。","Ni-ji nijuppun ni kūkō de jōshi wo demukaenakute wa naranai no desu.","我必須在2點20到機場去接我老闆。","▸ <b>句型</b>：【時刻＋に】【場所＋で】＋【〜なくてはならない】義務＋【のです】。<br>▸ <b>變化</b>：出迎（でむか）える → ない形 出迎えない → <b>出迎えなくては</b>＋ならない＋のです。<br>▸ <b>用法</b>：用「のです」說明理由，回應對方的「どうして」；<b>で</b>表動作場所。<br>▸ <b>比較</b>：なくてはならない（客觀規範）／なければならない（書面）／ないといけない（口語）／なくちゃ（極口語）。<br><span class=\"n4\">N4 必考：義務句型的四種形式</span>"]]},{"name":"詢問缺席","lines":[["A","14日のスピーチコンテストには来られますか？","Jūyokka no supīchi kontesuto ni wa koraremasu ka?","十四號你能來看演講比賽嗎？","▸ <b>句型</b>：【〜には】強調＋【可能形疑問】。<br>▸ <b>變化</b>：来（く）る → 可能形<b>来（こ）られる</b>（三類動詞不規則）→ 来られますか。<br>▸ <b>用法</b>：「コンテスト<b>には</b>」＝に＋は，強調該場合；問對方能不能來用可能形較客氣。<br>▸ <b>比較</b>：来（こ）られますか（能來嗎・可能形）／来（き）ますか（會來嗎・意志）。前者<b>不追問意願</b>，較有禮貌。<br><span class=\"n4\">N4 必考：来る 的可能形是「来られる」</span>"],["B","悪いけど、用事があります。","Warui kedo, yōji ga arimasu.","抱歉，我另外有事。","▸ <b>句型</b>：【悪いけど】緩衝＋【〜があります】婉拒。<br>▸ <b>變化</b>：ある → あります；「用事（ようじ）」＝要辦的事（不說明內容）。<br>▸ <b>用法</b>：日語拒絕時<b>刻意不說明具體理由</b>，用「用事（ようじ）があります」即可，對方也不會追問。<br>▸ <b>比較</b>：用事（ようじ）があります（有事・委婉）／忙（いそが）しいです（忙）／都合（つごう）が悪（わる）いです（不方便・最委婉）。<br><span class=\"n4\">N4 必考：婉拒的固定表達</span>"]]},{"name":"詢問反對","lines":[["A","紀之、どうして僕の提案に賛成してくれなかったの？","Noriyuki, dō shite boku no teian ni sansei shite kurenakatta no?","紀之，你為什麼不贊成我的提議？","▸ <b>句型</b>：【〜に賛成する】＋【〜てくれる的否定過去】＋【の？】。<br>▸ <b>變化</b>：賛成（さんせい）する → 賛成して＋くれる → <b>くれなかった</b>（否定過去）＋の？<br>▸ <b>用法</b>：「〜てくれなかった」帶有<b>埋怨</b>（你竟然沒為我做）；賛成（さんせい）的對象用<b>に</b>。<br>▸ <b>比較</b>：賛成（さんせい）してくれなかった（埋怨・沒為我做）／賛成しなかった（單純陳述沒贊成）。<b>くれる帶情緒</b>。<br><span class=\"n4\">N4 必考：授受動詞否定形的情緒色彩</span>"],["B","お金がかかりすぎると思うから。","Okane ga kakari sugiru to omou kara.","我認為那太花錢了。","▸ <b>句型</b>：【〜すぎる】過度＋【〜と思う】＋【から】理由。<br>▸ <b>變化</b>：かかる → かかり<b>すぎる</b>（ます形＋すぎる）；「と思（おも）う」的<b>と</b>引用想法。<br>▸ <b>用法</b>：句子以「から」結尾是口語常態（後面的主句省略），表「因為…（所以才那樣）」。<br>▸ <b>比較</b>：〜と思（おも）うから（因為我認為）／〜と思って（因為想著）／〜と思います（我認為）。<br><span class=\"n4\">N4 必考：〜すぎる 的接續與 と 的引用</span>"]]},{"name":"詢問遲到","lines":[["A","遅れるとわかった時、どうして電話してくれなかったのよ？","Okureru to wakatta toki, dō shite denwa shite kurenakatta no yo?","你知道你會遲到時為什麼不打個電話給我？","▸ <b>句型</b>：【〜と】引用＋【〜た時】時間點＋【〜てくれない的過去】＋【のよ】。<br>▸ <b>變化</b>：わかる → わかった＋<b>時（とき）</b>（た形＋時＝已完成的時點）；電話（でんわ）する → 電話して＋くれなかった。<br>▸ <b>用法</b>：「遅（おく）れる<b>と</b>わかった」的と引用內容；「のよ」是女性的責問語氣。<br>▸ <b>比較</b>：わかった時（とき）（知道之後的時點）／わかる時（知道的時候・未完成）。<b>時前面的時態決定先後</b>。<br><span class=\"n4\">N4 必考：〜た時／〜る時 的時態差異</span>"],["B","ごめん。公衆電話が見つからなかったんだ。","Gomen. Kōshū denwa ga mitsukaranakatta n da.","抱歉，我找不到公共電話。","▸ <b>句型</b>：【ごめん】道歉＋【自動詞否定過去】＋【んだ】說明。<br>▸ <b>變化</b>：見（み）つかる（自動詞・被找到）→ <b>見つからなかった</b>（否定過去）；他動詞則是「見つけられなかった」（沒能找到）。<br>▸ <b>用法</b>：用<b>自動詞</b>表「怎麼找都沒有」，把責任歸於狀況而非自己，是很自然的辯解方式。<br>▸ <b>比較</b>：見（み）つからなかった（沒找到・自動詞）／見つけられなかった（我沒能找到・可能形否定）／探（さが）さなかった（我沒找）。<br><span class=\"n4\">N4 必考：見つかる／見つける 的自他配對</span>"]]},{"name":"詢問未穿西裝","lines":[["A","ダークブルーのスーツを着てほしかったのに。","Dāku burū no sūtsu wo kite hoshikatta no ni.","我希望你穿那件深藍色的西裝。","▸ <b>句型</b>：【〜てほしい】希望對方做＋【過去式】＋【のに】埋怨。<br>▸ <b>變化</b>：着（き）る → 着て＋<b>ほしい</b>（希望對方穿）→ ほし<b>かった</b>（過去）＋のに（事與願違）。<br>▸ <b>用法</b>：<b>のに</b>放句尾表「明明…卻…」的不滿、遺憾；「〜てほしい」的對象是<b>他人</b>。<br>▸ <b>比較</b>：着（き）てほしかった（希望你穿・對他人）／着たかった（我想穿・對自己）。<b>てほしい vs たい</b> 主體不同。<br><span class=\"n4\">N4 必考：〜てほしい／〜たい 的主體差異</span>"],["B","持ってないんだよ。","Motte nai n da yo.","我沒有啊。","▸ <b>句型</b>：【〜ている的縮約否定】＋【んだ＋よ】。<br>▸ <b>變化</b>：持（も）っている → 持っていない → <b>持ってない</b>（い脫落）＋んだよ。<br>▸ <b>用法</b>：「持（も）っている」表<b>擁有的狀態</b>（不是正在拿）；否定即「沒有」。<br>▸ <b>比較</b>：持（も）ってない（沒有・擁有狀態）／ない（沒有・存在）／持たない（不拿・意志）。<br><span class=\"n4\">N4 必考：持っている 表所有的狀態</span>"],["A","どうして？","Dō shite?","為什麼？","▸ <b>句型</b>：【どうして？】追問。<br>▸ <b>變化</b>：どうしてですか → どうして？（常體）。<br>▸ <b>用法</b>：一個詞就能追問理由，是對話中最經濟的問法。<br>▸ <b>比較</b>：どうして？（為什麼）／なんで？（口語）／どうしてですか（丁寧）。<br><span class=\"n4\">N4 聽解常考極短問句</span>"],["B","まだクリーニング屋さんにあるのさ。","Mada kurīningu-ya-san ni aru no sa.","還在送洗。","▸ <b>句型</b>：【まだ】＋【場所＋にある】＋【のさ】男性語氣。<br>▸ <b>變化</b>：ある ＋ <b>のさ</b>（＝のだ＋さ，男性的說明語氣）。<br>▸ <b>用法</b>：「まだ〜にある」＝還在某處；「クリーニング屋（や）さん」＝乾洗店（店家加さん表親切）。<br>▸ <b>比較</b>：まだある（還有）／もうない（已經沒了）。<b>まだ／もう</b>是成對的時間副詞。<br><span class=\"n4\">N4 必考：まだ／もう 的肯否搭配</span>"]]},{"name":"詢問遲到（藉口）","lines":[["A","健一郎、どうして授業に遅刻したのですか？","Kenichirō, dō shite jugyō ni chikoku shita no desu ka?","健一郎，為什麼上課遲到？","▸ <b>句型</b>：【どうして】＋【〜に遅刻する】＋【たのですか】。<br>▸ <b>變化</b>：遅刻（ちこく）する → 遅刻し<b>た</b>＋のですか（過去＋說明）。<br>▸ <b>用法</b>：「授業（じゅぎょう）<b>に</b>遅刻（ちこく）する」遲到的對象用に；加のです讓詢問語氣較緩和。<br>▸ <b>比較</b>：遅刻（ちこく）する（遲到・對某事）／遅（おく）れる（晚了・較廣泛）。授業（じゅぎょう）に遅刻／電車（でんしゃ）が遅れる。<br><span class=\"n4\">N4 必考：遅刻する／遅れる 的搭配</span>"],["B","中村先生、うちのネコを動物病院に連れて行かなくてはならなかったのです。","Nakamura sensei, uchi no neko wo dōbutsu byōin ni tsurete ikanakute wa naranakatta no desu.","中村老師，因為我得帶我家的貓去獸醫院。","▸ <b>句型</b>：【〜に連れて行く】＋【義務句型的過去】＋【のです】。<br>▸ <b>變化</b>：連（つ）れて行（い）く → ない形 連れて行かない → 連れて行かなくては＋<b>ならなかった</b>（義務的過去式）。<br>▸ <b>用法</b>：「連（つ）れて行（い）く」＝帶（人或動物）去；「うちのネコ」＝我家的貓。<br>▸ <b>比較</b>：連（つ）れて行（い）く（帶人／動物去）／持（も）って行く（帶物品去）。<b>對象是生物還是物品</b>決定用哪個。<br><span class=\"n4\">N4 必考：連れて行く／持って行く 的區別</span>"],["A","ばかな！あなたの家にネコがいないってこと、私たちは知っているじゃない。本当の理由は何ですか？","Baka na! Anata no ie ni neko ga inai tte koto, watashitachi wa shitte iru ja nai. Hontō no riyū wa nan desu ka?","胡說，大家都知道你家沒養貓。真正的理由是什麼？","▸ <b>句型</b>：【〜ってこと】名詞化的口語形 ＋【〜じゃない】反問 ＋【疑問句】。<br>▸ <b>逐詞拆解</b>：<b>ばかな！</b>＝ばかだ（な形容詞）的語幹感嘆用法＝「胡說！」；<b>ネコがいない</b>＝存在句的否定（動物用いる）；<b>ってこと</b>＝<b>ということ</b>的口語縮約，把整句名詞化；<b>知（し）っているじゃない</b>＝知っている＋<b>じゃない</b>（＝ではないか，反問）＝「不是都知道嗎」。<br>▸ <b>句型公式</b>：<b>［普通形］＋ということ</b>＝「…這件事」（把句子變成名詞）。口語縮成<b>ってこと</b>。例：<b>彼（かれ）が来（こ）ないってこと、知（し）ってた？</b>（你知道他不來這件事嗎）／<b>つまりこういうことです</b>（也就是說是這樣）。<br>▸ <b>用法</b>：「〜じゃない（か）」是<b>反問式的提醒</b>，語氣較強，帶有「你明明知道」的責備。此處老師用它指出學生說謊。名詞化後省略了助詞を（〜ってこと<b>を</b>知（し）っている）。<br>▸ <b>比較</b>：<b>ということ</b>（正式）／<b>ってこと</b>（口語）／<b>〜の</b>（最簡短的名詞化）。另：<b>〜じゃない</b>（反問・提醒）／<b>〜じゃないか</b>（男性・更強）／<b>〜でしょう</b>（較柔和的提醒）。<br><span class=\"n4\">N4 必考：ということ 的名詞化與口語縮約</span>"],["B","うーん、ねぼうしました。","Ūn, nebō shimashita.","嗯…我睡過頭了。","▸ <b>句型</b>：【うーん】填補＋【漢語＋する的過去】。<br>▸ <b>變化</b>：ねぼうする → ねぼうしました（丁寧過去）。<br>▸ <b>用法</b>：「ねぼう（寝坊（ねぼう））」＝睡過頭；語塞時用「うーん」爭取時間，也暗示要說出真話了。<br>▸ <b>比較</b>：うーん（思考・語塞）／うん（肯定）／ううん（否定）。三者<b>只差長度</b>。<br><span class=\"n4\">N4 聽解陷阱：うん／ううん／うーん</span>"]]},{"name":"詢問主修","lines":[["A","広伸、経済学を専攻している目的は何？","Hironobu, keizaigaku wo senkō shite iru mokuteki wa nani?","廣伸，你為什麼想要主修經濟學？","▸ <b>句型</b>：【〜ている＋名詞】連體修飾＋【目的は何？】。<br>▸ <b>變化</b>：専攻（せんこう）する → 専攻して＋いる → 専攻している<b>目的（もくてき）</b>（動詞ている形<b>直接修飾</b>名詞，不加の）。<br>▸ <b>用法</b>：詢問目的的直接問法；「〜を専攻（せんこう）する」主修的科目用を。<br>▸ <b>比較</b>：専攻（せんこう）している目的（もくてき）（○ 動詞直接修飾）／専攻しているの目的（× 不可加の）。<br><span class=\"n4\">N4 必考：動詞連體修飾不加の</span>"],["B","うん、有能なビジネスマンになりたいからさ。","Un, yūnō na bijinesuman ni naritai kara sa.","嗯，我想當一名成功的商人。","▸ <b>句型</b>：【な形容詞＋名詞】＋【〜になりたい】＋【から＋さ】。<br>▸ <b>變化</b>：有能（ゆうのう）だ → <b>有能な</b>ビジネスマン（な形容詞修飾名詞）；なる → なり<b>たい</b>＋から（理由）＋さ（男性語氣）。<br>▸ <b>用法</b>：回答目的時用「〜たいから」；句尾さ表隨性斷定。<br>▸ <b>比較</b>：有能（ゆうのう）な（な形容詞）／有能さ（名詞化・能力）。同一詞根的不同詞性。<br><span class=\"n4\">N4 必考：な形容詞修飾名詞加な</span>"]]}]},"13":{"title":"表達意見或感想","jp_title":"意見や感想を述べる","theme":"表達想法、觀點和感受","scenes":[{"name":"意見（勸阻）","lines":[["A","じゃあ、このことをお父さんには言わないことにしよう。","Jā, kono koto wo otōsan ni wa iwanai koto ni shiyō.","那麼，這件事就別跟爸爸說吧。","▸ <b>句型</b>：【〜ないことにする】決定不做＋【意向形】。<br>▸ <b>變化</b>：言（い）う → ない形 言わない → 言わない<b>ことにする</b>（決定）→ ことに<b>しよう</b>（意向形＝提議）。<br>▸ <b>用法</b>：「〜ことにする」表<b>自己主動的決定</b>；「お父（とう）さん<b>には</b>」＝に＋は，強調對象的對比。<br>▸ <b>比較</b>：〜ことにする（自己決定）／〜ことになる（自然演變成・非自己決定）。<b>する vs なる</b>是關鍵。<br><span class=\"n4\">N4 必考：〜ことにする／〜ことになる</span>"],["B","お父さんに叱られると思うよ。","Otōsan ni shikarareru to omou yo.","我覺得會被爸爸罵。","▸ <b>句型</b>：【被動形】＋【〜と思う】。<br>▸ <b>變化</b>：叱（しか）る → 被動形<b>叱られる</b>（一類：う段→あ段＋れる）；動作者用<b>に</b>（お父（とう）さんに叱（しか）られる）。<br>▸ <b>用法</b>：日語的被動常用於<b>自己受到不利影響</b>時；「〜と思（おも）うよ」表達自己的推測並提醒對方。<br>▸ <b>比較</b>：叱（しか）られる（被罵・被動）／叱る（罵・主動）／怒（おこ）られる（被生氣・更口語）。<br><span class=\"n4\">N4 必考：被動形變化（一類あ段＋れる／二類られる／三類される・来られる）</span>"]]},{"name":"意見（度假地）","lines":[["A","この連休に例の海辺へ行くのはどう？","Kono renkyū ni rei no umibe e iku no wa dō?","這次連續假期照慣例到海邊去，怎麼樣？","▸ <b>句型</b>：【動詞＋の】名詞化＋【〜はどう？】徵詢。<br>▸ <b>變化</b>：行（い）く → 行く<b>の</b>（名詞化）→ 行くのはどう？<br>▸ <b>用法</b>：「例（れい）の」＝慣例的那個（雙方都知道的）；動詞名詞化後才能用は提示。<br>▸ <b>比較</b>：行（い）くのはどう？（去…如何・提議）／行きませんか（要不要去・邀約）／行こう（走吧・較強勢）。<br><span class=\"n4\">N4 必考：動詞＋の 的名詞化</span>"],["B","いいと思うわ。でも私たちいつもあそこに行くわね。今年はほかの所に行きたいの。","Ii to omou wa. Demo watashitachi itsumo asoko ni iku wa ne. Kotoshi wa hoka no tokoro ni ikitai no.","好啊，可是我們一直都去那裡，今年我想去別的地方。","▸ <b>句型</b>：【〜と思う】＋【でも】轉折＋【〜たい＋の】女性語氣。<br>▸ <b>變化</b>：いい ＋ と思（おも）う ＋ わ（女性）；行（い）きたい ＋ <b>の</b>（女性的說明語氣）。<br>▸ <b>用法</b>：<b>先肯定再用でも轉折</b>是日語表達異見的典型結構；「いつも」＋「今年（ことし）は」形成時間對比。<br>▸ <b>比較</b>：いいと思（おも）うわ、でも…（先肯定後轉折）／よくないと思う（直接否定・較衝）。<br><span class=\"n4\">N4 必考：委婉表達不同意見的結構</span>"]]},{"name":"意見（提醒）","lines":[["A","では全て解決しました。","De wa subete kaiketsu shimashita.","那麼全部都解決了。","▸ <b>句型</b>：【では】＋【副詞全て】＋【漢語＋する的過去】。<br>▸ <b>變化</b>：解決（かいけつ）する → 解決しました。<br>▸ <b>用法</b>：「全（すべ）て」＝全部（書面語，口語用「全部（ぜんぶ）」）；「では」是「じゃあ」的正式形。<br>▸ <b>比較</b>：全（すべ）て（書面）／全部（ぜんぶ）（口語）／みんな（大家・全部）。三者正式度不同。<br><span class=\"n4\">N4 會考書面語與口語的對應</span>"],["B","ちょっと待ってください。あなたは一番大切なことを忘れているようですが。","Chotto matte kudasai. Anata wa ichiban taisetsu na koto wo wasurete iru yō desu ga.","請等一下，我想你好像忘了最重要的事。","▸ <b>句型</b>：【て形＋ください】＋【〜ている】＋【〜ようですが】委婉推測。<br>▸ <b>變化</b>：忘（わす）れる → 忘れて＋いる（狀態）→ 忘れている<b>ようです</b>（推測）＋が（留白）。<br>▸ <b>用法</b>：<b>よう</b>表委婉推測，用來避免直接指責對方；句尾が留白讓語氣更軟。<br>▸ <b>比較</b>：〜ようです（有根據的推測・客觀）／〜みたいです（口語）／〜らしいです（傳聞性推測）。<br><span class=\"n4\">N4 必考：よう／みたい／らしい 的推測差異</span>"]]},{"name":"意見（提出方案）","lines":[["A","僕の考えは、早めに、6時30分ごろに出発して、通勤時間をさけるといいと思う。","Boku no kangae wa, hayame ni, roku-ji sanjuppun goro ni shuppatsu shite, tsūkin jikan wo sakeru to ii to omou.","我的想法是早一點，在六點半左右出發，就可以避開通勤時間。","▸ <b>句型</b>：【て形連接】＋【辭書形＋と＋いい】＋【と思う】。<br>▸ <b>變化</b>：出発（しゅっぱつ）する → 出発し<b>て</b>（て形）；さける → さける＋<b>と</b>＋いい（這樣做就好）＋と思（おも）う。<br>▸ <b>用法</b>：「早（はや）めに」＝提早一點（〜めに表傾向）；「〜といいと思（おも）う」提出建議。<br>▸ <b>比較</b>：早（はや）めに（提早）／早く（快・早）／早くも（竟然這麼早）。<br><span class=\"n4\">N4 必考：〜と＋いい 的建議用法</span>"],["B","朝食はどうする。","Chōshoku wa dō suru.","那早餐怎麼辦？","▸ <b>句型</b>：【〜はどうする】詢問處理方式。<br>▸ <b>變化</b>：どうしますか → どうする（常體）。<br>▸ <b>用法</b>：「〜はどうする」＝那…怎麼辦（詢問對某事的處理）；用は提示話題。<br>▸ <b>比較</b>：どうする（怎麼做・詢問行動）／どうなる（會變怎樣・詢問結果）。<b>する vs なる</b>。<br><span class=\"n4\">N4 必考：どうする／どうなる 的區別</span>"],["A","町の外に出てから、どこかで食べましょう。","Machi no soto ni dete kara, doko ka de tabemashō.","等出了城，在找個地方吃吧！","▸ <b>句型</b>：【て形＋から】先後＋【どこか＋で】＋【ましょう】。<br>▸ <b>變化</b>：出（で）る → 出て＋<b>から</b>（之後）；食（た）べる → 食べましょう。<br>▸ <b>用法</b>：「〜てから」強調動作完成後；「どこかで」不特定場所＋動作場所的で。<br>▸ <b>比較</b>：出（で）てから（出去之後）／出た後（あと）で（同義）／出る前（まえ）に（出去之前）。<br><span class=\"n4\">N4 必考：てから／た後で／る前に</span>"]]},{"name":"意見（安全考量）","lines":[["A","金曜日の夕方、仕事の後に出発しましょう。","Kin'yōbi no yūgata, shigoto no ato ni shuppatsu shimashō.","星期五晚上下班後就出發吧。","▸ <b>句型</b>：【名詞＋の後に】＋【ましょう】。<br>▸ <b>變化</b>：仕事（しごと）＋の＋<b>後（あと）に</b>（名詞＋の＋後）。<br>▸ <b>用法</b>：「金曜日（きんようび）の夕方（ゆうがた）」是複合時間名詞；ましょう提議共同行動。<br>▸ <b>比較</b>：仕事（しごと）の後（あと）に（名詞）／仕事した後で（動詞た形）／仕事してから（動詞て形）。三種接續。<br><span class=\"n4\">N4 必考：後 的接續形式</span>"],["B","それはちょっと、疲れている時に運転することは危険じゃないですか。","Sore wa chotto, tsukarete iru toki ni unten suru koto wa kiken ja nai desu ka.","不太好吧！在累的時候開車不是很危險嗎？","▸ <b>句型</b>：【それはちょっと】委婉否決＋【動詞＋こと】名詞化＋【〜じゃないですか】反問。<br>▸ <b>變化</b>：運転（うんてん）する → 運転する<b>こと</b>（名詞化）；危険（きけん）だ → 危険<b>じゃないですか</b>（反問）。<br>▸ <b>用法</b>：「それはちょっと」<b>說一半即表不贊成</b>，是日語最典型的婉拒；用反問提醒對方風險。<br>▸ <b>比較</b>：それはちょっと…（委婉否決）／それはだめです（直接否決）／どうでしょうか（更軟的質疑）。<br><span class=\"n4\">N4 聽解必考：說一半的婉拒</span>"],["A","そうですね、オーケー、土曜日の朝に出発しましょう。","Sō desu ne, ōkē, doyōbi no asa ni shuppatsu shimashō.","也是。那就，星期六早上出發吧！","▸ <b>句型</b>：【そうですね】緩衝＋【ましょう】修正方案。<br>▸ <b>變化</b>：そうです ＋ ね（表接受對方意見）。<br>▸ <b>用法</b>：「そうですね」先接受對方的指正，再提出修正案，是圓滑的協商方式。<br>▸ <b>比較</b>：そうですね（同意・或思考中）／そうですか（原來如此）／そうですよ（我就說吧）。<br><span class=\"n4\">N4 必考：そうですね 的兩種功能（同意／緩衝）</span>"]]},{"name":"意見（結合方案）","lines":[["A","あなたの計画は、不可能ということはないでしょう。でも、私の計画の方が実際的だと思います。","Anata no keikaku wa, fukanō to iu koto wa nai deshō. Demo, watashi no keikaku no hō ga jissaiteki da to omoimasu.","你的計劃並不是不可行，不過我覺得我的計劃比較實際。","▸ <b>句型</b>：【〜ということはない】雙重否定的委婉 ＋【〜の方が】比較 ＋【〜だと思います】。<br>▸ <b>逐詞拆解</b>：<b>不可能（ふかのう）</b>（な形容詞語幹）＋<b>ということはない</b>＝「並非…這樣的事」＝並不是不可行（<b>雙重否定＝委婉的肯定</b>）；<b>私（わたし）の計画（けいかく）の方（ほう）が</b>＝の方が表比較後的偏好；<b>実際的（じっさいてき）だ</b>＋と思（おも）います（引用判斷，名詞・な形容詞要加<b>だ</b>）。<br>▸ <b>句型公式</b>：<b>［普通形］＋ということはない</b>＝並不是…、不至於…。例：<b>難（むずか）しいということはない</b>（並不難）／<b>行（い）けないということはない</b>（不是不能去）。<br>▸ <b>用法</b>：這句是<b>職場批評的教科書範例</b>——先用雙重否定肯定對方（你的計畫並非不可行），再用「でも」轉折提出自己的主張，最後用「と思（おも）います」緩和斷定。三重緩衝，讓反對不傷人。<br>▸ <b>比較</b>：<b>〜ということはない</b>（並非…）／<b>〜わけではない</b>（並不是…・語意相近）／<b>〜とは限（かぎ）らない</b>（未必…）。三者都是委婉的部分否定，正式度依序：ということはない ≒ わけではない ＜ とは限らない（較書面）。<br><span class=\"n4\">N4 必考：と思う 前的普通形轉換（名詞＋だ）、雙重否定的委婉功能</span>"],["B","じゃあ、我々の計画を結びつけたらどうですか？","Jā, wareware no keikaku wo musubitsuketara dō desu ka?","那如果把我們的計畫結合呢？","▸ <b>句型</b>：【たら＋どうですか】提出建議。<br>▸ <b>變化</b>：結（むす）びつける → 結びつけ<b>たら</b>（た形＋ら）＋どうですか。<br>▸ <b>用法</b>：「〜たらどうですか」＝要不要…呢（提出建議，比「〜てください」柔和）。<br>▸ <b>比較</b>：〜たらどうですか（建議）／〜方（ほう）がいいです（勸告）／〜てください（請求）。禮貌與強度不同。<br><span class=\"n4\">N4 必考：〜たらどうですか 的建議用法</span>"],["A","ご意見をお聞かせていただきます？","Goiken wo okikasete itadakimasu?","我洗耳恭聽。","▸ <b>句型</b>：【使役形＋ていただく】最謙遜的請求 ＋【ご＋漢語名詞】尊敬。<br>▸ <b>逐詞拆解</b>：<b>ご意見（いけん）</b>＝意見＋接頭辭ご（漢語名詞用ご）＝您的意見；<b>お聞（き）かせ</b>＝聞く的使役形<b>聞かせる</b>（讓…聽）＋お（謙讓前綴）；<b>いただきます</b>＝もらう的謙讓語 → 合起來＝「請讓我聽您的意見」。<br>▸ <b>句型公式</b>：<b>お＋使役形ます形＋いただけますか</b>＝能否請您讓我…。例：<b>お聞（き）かせいただけますか</b>（能否請您說給我聽）／<b>ご説明（せつめい）いただけますか</b>（能否請您說明）／<b>お名前（なまえ）をお聞かせください</b>（請告訴我您的大名）。<br>▸ <b>用法</b>：注意<b>觀念的轉換</b>——中文說「請你告訴我」，日語卻說成「請讓我聽」，把主動權交給對方。這是敬語的核心思維。標準說法為<b>「ご意見（いけん）をお聞（き）かせいただけますか」</b>或<b>「お聞かせください」</b>。<br>▸ <b>比較</b>：お聞（き）かせいただけますか（最謙遜）／教（おし）えていただけますか（客氣）／聞かせてください（一般）／教えて（常體）。<br><span class=\"n4\">N4 必考：使役形＋いただく 的謙讓組合、ご／お 的接續</span>"]]},{"name":"意見（音樂劇）","lines":[["A","先週の金曜日にミュージカルの「ミスサイゴン」を見ました。","Senshū no kin'yōbi ni myūjikaru no 'Misu Saigon' wo mimashita.","上星期五，我看了「西貢小姐」的音樂劇。","▸ <b>句型</b>：【時間點＋に】＋【AのB】＋【〜を見ました】。<br>▸ <b>變化</b>：見（み）る → 見ました（過去）。<br>▸ <b>用法</b>：具體日期用<b>に</b>（先週（せんしゅう）の金曜日（きんようび）に）；「ミュージカルの『ミスサイゴン』」用の連接類別與名稱。<br>▸ <b>比較</b>：先週（せんしゅう）の金曜日（きんようび）に（具體日期・加に）／先週（不加に）／毎週（まいしゅう）（不加に）。<br><span class=\"n4\">N4 必考：時間名詞加に的規則</span>"],["B","それはすごい！どう思いました？","Sore wa sugoi! Dō omoimashita?","哇，真是太棒了，你覺得怎麼樣？","▸ <b>句型</b>：【それは＋形容詞】感嘆＋【どう思いましたか】。<br>▸ <b>變化</b>：思（おも）う → 思いました（過去）。<br>▸ <b>用法</b>：問感想<b>必用「どう」</b>不可用「何（なに）」（×何を思（おも）いましたか）；「それはすごい」表對對方的事表示佩服。<br>▸ <b>比較</b>：どう思（おも）いましたか（覺得如何・問評價）／何（なに）を思いましたか（不自然）／いかがでしたか（敬語）。<br><span class=\"n4\">N4 必考：どう思う 的固定搭配</span>"],["A","とてもいいミュージカルだと思いました。非常に感動しました。","Totemo ii myūjikaru da to omoimashita. Hijō ni kandō shimashita.","我覺得是很精采的音樂劇，讓人非常感動。","▸ <b>句型</b>：【〜だと思いました】＋【副詞非常に】。<br>▸ <b>變化</b>：いいミュージカル<b>だ</b>＋と思（おも）いました（名詞句引用<b>要加だ</b>）。<br>▸ <b>用法</b>：「非常（ひじょう）に」比「とても」更書面正式；「感動（かんどう）する」＝感動（漢語動詞）。<br>▸ <b>比較</b>：とても（口語・一般）／非常（ひじょう）に（書面）／すごく（口語・隨性）／大変（たいへん）（正式）。<br><span class=\"n4\">N4 必考：名詞・な形容詞＋だ＋と思う</span>"]]}]},"14":{"title":"再次確認／確定","jp_title":"改めて確認する・確定する","theme":"深層確認和反覆確認","scenes":[{"name":"確認出身","lines":[["A","あなたは台湾出身でしょう？","Anata wa Taiwan shusshin deshō?","你是臺灣出生的吧！","▸ <b>句型</b>：【〜でしょう？】向對方求證。<br>▸ <b>變化</b>：台湾出身（たいわんしゅっしん）です → 台湾出身<b>でしょう</b>（推測形）＋升調＝確認。<br>▸ <b>用法</b>：<b>升調</b>的でしょう＝「…對吧？」（向對方求證）；<b>降調</b>則是單純推測。<br>▸ <b>比較</b>：でしょう？（求證）／ですね？（確認自己的認知）／ですか（單純提問）。<br><span class=\"n4\">N4 必考：でしょう 的推測與確認兩用</span>"],["B","はい、そうです。","Hai, sō desu.","是的。","▸ <b>句型</b>：【そうです】肯定對方所說。<br>▸ <b>變化</b>：そう（那樣）＋です；否定為「違（ちが）います」或「そうではありません」。<br>▸ <b>用法</b>：用「そう」代替對方剛說的內容，避免重複整句。<br>▸ <b>比較</b>：そうです（是的・肯定內容）／はい（是・回應呼喚或同意）／違（ちが）います（不對・糾正）。<br><span class=\"n4\">N4 必考：そうです 的代稱功能</span>"]]},{"name":"確認身份","lines":[["A","あなたは本当にスカイダイバーですか？","Anata wa hontō ni sukai daibā desu ka?","你真的是跳傘員嗎？","▸ <b>句型</b>：【副詞本当に】＋【名詞句疑問】。<br>▸ <b>變化</b>：本当（ほんとう）だ → <b>本当に</b>（副詞形，な形容詞→に）。<br>▸ <b>用法</b>：「本当（ほんとう）に」修飾整句，加強確認的語氣；「スカイダイバー」是外來語職業名。<br>▸ <b>比較</b>：本当（ほんとう）に（副詞・真的）／本当の（連體・真正的）／本当です（述語・是真的）。<br><span class=\"n4\">N4 必考：本当 的三種詞形變化</span>"],["B","はい、本当です。習いたいですか？","Hai, hontō desu. Naraitai desu ka?","是的，是真的。想學嗎？","▸ <b>句型</b>：【名詞句肯定】＋【〜たいですか】疑問。<br>▸ <b>變化</b>：習（なら）う → 習います → 習い<b>たい</b>＋ですか。<br>▸ <b>用法</b>：「〜たいですか」<b>不可對長輩、上位者使用</b>（等於直接探問對方欲望），改用「〜ませんか」較妥。<br>▸ <b>比較</b>：習（なら）いたいですか（想學嗎・對平輩）／習いませんか（要不要學・較禮貌）／習ってみませんか（最委婉）。<br><span class=\"n4\">N4 必考：〜たいですか 的使用限制</span>"]]},{"name":"確認出身（京都）","lines":[["A","紀之の話だと、あなたは京都出身だそうですね。","Noriyuki no hanashi da to, anata wa Kyōto shusshin da sō desu ne.","紀之告訴我，你是京都出生的。","▸ <b>句型</b>：【〜の話だと】根據＋【〜だそうです】傳聞。<br>▸ <b>變化</b>：京都出身（きょうとしゅっしん）だ ＋ <b>そうです</b>（傳聞）；名詞・な形容詞後<b>必須加だ</b>（京都出身<b>だ</b>そうです）。<br>▸ <b>用法</b>：「〜だと」表根據、依據（照…的說法）；傳聞的そうです<b>不可加ね以外的變化</b>（×だそうでしょう）。<br>▸ <b>比較</b>：〜だそうです（傳聞・聽說）／〜そうです（樣態・看起來）。名詞後只能是傳聞。<br><span class=\"n4\">N4 必考：傳聞〜そうだ 的接續（普通形＋そうだ）</span>"],["B","そうです。行ったことはありますか？","Sō desu. Itta koto wa arimasu ka?","是的。你去過嗎？","▸ <b>句型</b>：【〜たことがあります】經驗＋【は】對比。<br>▸ <b>變化</b>：行（い）く → 行っ<b>た</b>＋ことがある（有過…的經驗）→ ことは ありますか（用は帶對比、確認語氣）。<br>▸ <b>用法</b>：「〜たことがある」表<b>過去的經驗</b>，不指特定時間；此處把が換成は，語氣更像「有沒有過呢」。<br>▸ <b>比較</b>：行（い）ったことがある（有去過・經驗）／行った（去了・具體事實）／行っている（正在去／已在那）。<br><span class=\"n4\">N4 必考：〜たことがある 的經驗用法</span>"]]},{"name":"確認技能","lines":[["A","あなたは模型飛行機を作れそうですね。","Anata wa mokei hikōki wo tsukuresō desu ne.","聽說你會做模型飛機。","▸ <b>句型</b>：【可能形＋そう】樣態推測。<br>▸ <b>變化</b>：作（つく）る → 可能形<b>作れる</b> → 去る＋<b>そう</b> → 作れそう（看起來會做）。<br>▸ <b>用法</b>：<b>そう</b>接動詞ます形表樣態（快要／看起來會）；可能形＋そう＝看來有能力做到。<br>▸ <b>比較</b>：作（つく）れそう（看來會做・樣態）／作れるそう（聽說會做・傳聞）。<b>差一個る，意思不同</b>。<br><span class=\"n4\">N4 必考陷阱：ます形＋そう（樣態）vs 普通形＋そう（傳聞）</span>"],["B","もちろんです。子供の時からやっています。","Mochiron desu. Kodomo no toki kara yatte imasu.","當然，小時候就開始做了。","▸ <b>句型</b>：【〜の時から】起點＋【〜ている】持續。<br>▸ <b>變化</b>：やる → やって＋<b>います</b>（從過去持續到現在）。<br>▸ <b>用法</b>：「子供（こども）の時（とき）から」＝從小時候起（名詞＋の＋時）；ています表習慣性的持續。<br>▸ <b>比較</b>：子供（こども）の時（とき）から（從小時候起）／子供の時に（在小時候・某時點）。<b>から＝起點，に＝時點</b>。<br><span class=\"n4\">N4 必考：〜から〜ている 的持續表現</span>"]]},{"name":"確認想法","lines":[["A","この投資はいい考えだと思いますか？","Kono tōshi wa ii kangae da to omoimasu ka?","你覺得這個投資是很好的想法嗎？","▸ <b>句型</b>：【名詞＋だ＋と思いますか】徵詢判斷。<br>▸ <b>變化</b>：いい考（かんが）え<b>だ</b>＋と思（おも）いますか（名詞句引用<b>必加だ</b>）。<br>▸ <b>用法</b>：「〜と思（おも）いますか」詢問對方的判斷；「投資（とうし）」是漢語名詞，也可當する動詞（投資する）。<br>▸ <b>比較</b>：いい考（かんが）えだと思（おも）う（○）／いい考えと思う（× 缺だ）／いい考えですと思う（×）。<br><span class=\"n4\">N4 必考：と思う 前的普通形轉換</span>"],["B","ええ、そう思ってます。","Ē, sō omottemasu.","是的，我是這樣想的。","▸ <b>句型</b>：【そう＋思っている的縮約】。<br>▸ <b>變化</b>：思（おも）っています → <b>思ってます</b>（い脫落的口語形）。<br>▸ <b>用法</b>：「そう思（おも）っています」比「そう思います」表達<b>一直這麼認為</b>；口語常省略い。<br>▸ <b>比較</b>：思（おも）っています（持續的想法）／思います（當下的判斷）／思いました（當時的感想）。<br><span class=\"n4\">N4 聽解必考：〜てます ＝〜ています</span>"]]},{"name":"確認考試","lines":[["A","試験はパスできると思いますか。","Shiken wa pasu dekiru to omoimasu ka.","你覺得你能通過考試嗎？","▸ <b>句型</b>：【外來語＋できる】可能＋【〜と思いますか】。<br>▸ <b>變化</b>：パスする → パス<b>できる</b>（外來語＋する的可能形）；する → できる（不規則）。<br>▸ <b>用法</b>：「試験（しけん）<b>は</b>」用は提示話題；「〜できると思（おも）いますか」問對方的預測。<br>▸ <b>比較</b>：パスできる（能通過）／合格（ごうかく）できる（能及格）／受（う）かる（考上・自動詞，本身即含結果）。<br><span class=\"n4\">N4 必考：する 的可能形是「できる」</span>"],["B","はい、もちろんです。","Hai, mochiron desu.","是的，當然。","▸ <b>句型</b>：【はい＋もちろんです】強肯定。<br>▸ <b>變化</b>：もちろん（副詞）＋です。<br>▸ <b>用法</b>：表達充分自信；加です比單說「もちろん」正式。<br>▸ <b>比較</b>：もちろんです（當然）／きっと大丈夫（だいじょうぶ）です（一定沒問題）／たぶん（大概・信心較低）。<br><span class=\"n4\">N4 必考：確信程度的副詞階梯</span>"]]},{"name":"確認地點（圖書館）","lines":[["A","すみませんが、図書館へ行く道を教えてください。","Sumimasen ga, toshokan e iku michi wo oshiete kudasai.","對不起，請告訴我怎麼去圖書館。","▸ <b>句型</b>：【動詞連體修飾】＋【〜を教えてください】。<br>▸ <b>變化</b>：行（い）く → 図書館（としょかん）へ行く<b>道（みち）</b>（動詞普通形<b>直接</b>修飾名詞，不加の）。<br>▸ <b>用法</b>：「〜へ行（い）く道（みち）」＝去…的路；問路的標準句型。<br>▸ <b>比較</b>：行（い）く道（みち）（○ 動詞直接修飾）／行くの道（× 不可加の）／行き方（かた）（去的方法，另一種說法）。<br><span class=\"n4\">N4 必考：動詞連體修飾（不加の）</span>"],["B","図書館の本館ですか？","Toshokan no honkan desu ka?","是圖書館的本館嗎？","▸ <b>句型</b>：【AのB＋ですか】反問確認。<br>▸ <b>變化</b>：図書館（としょかん）の本館（ほんかん）（の連接）＋ですか。<br>▸ <b>用法</b>：對方的問題不夠具體時，用名詞句反問確認，是很自然的溝通策略。<br>▸ <b>比較</b>：本館（ほんかん）（總館）／分館（ぶんかん）（分館）／別館（べっかん）（別館）。日語建築物的區分用語。<br><span class=\"n4\">N4 會考名詞句反問的用法</span>"],["A","はい、そうです。","Hai, sō desu.","是的。","▸ <b>句型</b>：【はい、そうです】。<br>▸ <b>變化</b>：そう＋です（肯定對方的推測）。<br>▸ <b>用法</b>：確認無誤時的標準回應；若要否定則說「いいえ、〜です」。<br>▸ <b>比較</b>：はい、そうです（是的）／いいえ、違（ちが）います（不，不是）／どちらでもいいです（都可以）。<br><span class=\"n4\">N4 必考：肯定與否定的對答結構</span>"]]},{"name":"否定（國籍）","lines":[["A","あなたはカナダ人ではありませんか。","Anata wa Kanada-jin de wa arimasen ka.","你不是加拿大人嗎？","▸ <b>句型</b>：【〜ではありませんか】否定疑問確認。<br>▸ <b>變化</b>：カナダ人（じん）です → カナダ人<b>ではありません</b> → ＋か（難道不是嗎）。<br>▸ <b>用法</b>：否定疑問句表「我以為是這樣，難道不對嗎」，帶有預設。口語可說「じゃありませんか」。<br>▸ <b>比較</b>：ではありませんか（正式）／じゃありませんか（口語）／じゃないですか（更口語）。<br><span class=\"n4\">N4 必考：ではありません 的口語縮約</span>"],["B","ええ。カナダに住んでいますが、アメリカ人です。","Ē. Kanada ni sunde imasu ga, Amerika-jin desu.","是的，我住在加拿大，但我是美國人。","▸ <b>句型</b>：【ええ】＋【〜が】逆接＋【名詞句】。<br>▸ <b>變化</b>：住（す）んでいます ＋ <b>が</b>（逆接）＋ アメリカ人（じん）です。<br>▸ <b>用法</b>：日語的「ええ／はい」是針對<b>對方的話是否正確</b>，而非事實本身——這與中文的「是／不是」思路不同，是學習者最易錯的地方。<br>▸ <b>比較</b>：（對否定疑問）ええ（是，你說的沒錯）／いいえ（不，你說錯了）。<b>與中文相反</b>。<br><span class=\"n4\">N4 聽解陷阱：否定疑問句的肯否回答</span>"]]},{"name":"否定（游泳）","lines":[["A","あなたのお兄さんは水泳のチャンピョンでしょう。","Anata no oniisan wa suiei no chanpion deshō.","你哥哥是游泳冠軍嘛！","▸ <b>句型</b>：【〜でしょう】降調推測＋【親屬敬稱】。<br>▸ <b>變化</b>：チャンピョンです → チャンピョン<b>でしょう</b>（推測・求證）。<br>▸ <b>用法</b>：他人的哥哥用<b>お兄（にい）さん</b>；自己的哥哥說「兄（あに）」。<br>▸ <b>比較</b>：（他人）お兄（にい）さん・お姉（ねえ）さん・弟（おとうと）さん・妹（いもうと）さん／（自己）兄（あに）・姉（あね）・弟・妹。<br><span class=\"n4\">N4 必考：兄弟姊妹稱謂的內外有別</span>"],["B","違います。弟です。","Chigaimasu. Otōto desu.","不是，是我弟弟。","▸ <b>句型</b>：【違います】糾正＋【名詞句補正】。<br>▸ <b>變化</b>：違（ちが）う → 違います（一類動詞）。<br>▸ <b>用法</b>：「違（ちが）います」比「いいえ」更明確地指出<b>事實不是這樣</b>；後面補上正確資訊。<br>▸ <b>比較</b>：違（ちが）います（不對・糾正事實）／いいえ（不・單純否定）／そうではありません（不是那樣的・較軟）。<br><span class=\"n4\">N4 必考：違う 是動詞不是形容詞（×違いです）</span>"]]},{"name":"否定（學校）","lines":[["A","あなたは東京大学の学生さんですね？","Anata wa Tōkyō daigaku no gakusei-san desu ne?","你是東京大學的學生嗎？","▸ <b>句型</b>：【〜ですね？】升調確認＋【さん的附加】。<br>▸ <b>變化</b>：学生（がくせい）→ 学生<b>さん</b>（加さん表客氣，指他人時常用）。<br>▸ <b>用法</b>：<b>ね</b>用於確認自己的認知是否正確；升調發問。<br>▸ <b>比較</b>：学生（がくせい）さん（客氣・指他人）／学生（一般）。日語常在職業名後加さん（お医者（いしゃ）さん・店員（てんいん）さん）。<br><span class=\"n4\">N4 必考：ね 的確認功能</span>"],["B","いいえ。早稲田の学生です。","Iie. Waseda no gakusei desu.","不是，我是早稻田的學生。","▸ <b>句型</b>：【いいえ】否定＋【名詞句糾正】。<br>▸ <b>變化</b>：早稲田（わせだ）（大学（だいがく））の学生（がくせい）です——口語常省略「大学」。<br>▸ <b>用法</b>：否定後<b>立刻提供正確資訊</b>，避免只說「いいえ」讓對話中斷。<br>▸ <b>比較</b>：早稲田（わせだ）（早稻田大學的簡稱）／東大（とうだい）（東京大學）／京大（きょうだい）（京都大學）。日語大學名常簡稱。<br><span class=\"n4\">N4 會考常見大學簡稱</span>"]]},{"name":"否定（父母）","lines":[["A","あなたのご両親は日本でお生まれになったのでしょう？","Anata no goryōshin wa Nihon de oumare ni natta no deshō?","你的父母是在日本出生的吧？","▸ <b>句型</b>：【ご＋親屬】尊敬＋【お＋ます形＋になる】尊敬語＋【のでしょう？】。<br>▸ <b>變化</b>：生（う）まれる → <b>お生まれになる</b>（尊敬語）→ お生まれになった（過去）＋のでしょう（推測求證）。<br>▸ <b>用法</b>：他人的父母說「ご両親（りょうしん）」；「日本（にほん）<b>で</b>生（う）まれる」出生地用で（動作發生的場所）。<br>▸ <b>比較</b>：お生（う）まれになった（尊敬）／生まれた（一般）／お生まれです（也是尊敬語，較簡潔）。<br><span class=\"n4\">N4 必考：お〜になる 的尊敬語形</span>"],["B","いいえ、でも祖父母はそうです。","Iie, demo sofubo wa sō desu.","不是，不過祖父母是在日本生的。","▸ <b>句型</b>：【いいえ】＋【でも】＋【〜は＋そうです】對比。<br>▸ <b>變化</b>：「そうです」代替「日本（にほん）で生（う）まれました」，避免重複。<br>▸ <b>用法</b>：「祖父母（そふぼ）<b>は</b>」用は表對比（父母不是，但祖父母是）。<br>▸ <b>比較</b>：（自己的）祖父母（そふぼ）・祖父（そふ）・祖母（そぼ）／（他人的）おじいさん・おばあさん。<br><span class=\"n4\">N4 必考：は 的對比用法</span>"]]},{"name":"否定（票券）","lines":[["A","本当に「キャッツ」の券が手に入るの？","Hontō ni 'Kyattsu' no ken ga te ni hairu no?","真的能拿到「Cats」的票嗎？","▸ <b>句型</b>：【副詞本当に】＋【慣用句手に入る】＋【の？】。<br>▸ <b>變化</b>：手（て）に入（はい）る（自動詞・弄到手）→ 手に入る＋の？（常體確認）。<br>▸ <b>用法</b>：「手（て）に入（はい）る」是<b>自動詞</b>（東西到手），他動詞是「手に入（い）れる」（把東西弄到手）。<br>▸ <b>比較</b>：券（けん）が手（て）に入（はい）る（票到手・自動詞）／券を手に入（い）れる（弄到票・他動詞）。<b>助詞隨自他而變</b>。<br><span class=\"n4\">N4 必考：慣用句的自他動詞配對</span>"],["B","確実ではないけど、手に入られると思うよ。","Kakujitsu de wa nai kedo, te ni irareru to omou yo.","不是很確定，不過應該可以。","▸ <b>句型</b>：【〜ではないけど】保留＋【〜と思うよ】推測。<br>▸ <b>變化</b>：確実（かくじつ）だ → 確実<b>ではない</b>（な形容詞否定）＋けど（逆接）。<br>▸ <b>用法</b>：先保留（不確定）再表達判斷，是日語表達推測時的謹慎習慣。<br>▸ <b>比較</b>：確実（かくじつ）ではない（不確定）／確実だ（確定）／たぶん（大概）。な形容詞否定＝<b>ではない／じゃない</b>。<br><span class=\"n4\">N4 必考：な形容詞的否定形</span>"]]},{"name":"否定（報告）","lines":[["A","この報告書はきょうの午後までに完成できるとおしゃっているのですか？","Kono hōkokusho wa kyō no gogo made ni kansei dekiru to osshatte iru no desu ka?","你是說這個報告今天下午可以完成嗎？","▸ <b>句型</b>：【までに】期限＋【可能形】＋【と＋尊敬語＋のですか】覆述確認。<br>▸ <b>變化</b>：完成（かんせい）する → 完成<b>できる</b>（可能）；言（い）う → おっしゃる（尊敬）→ おっしゃっている＋のですか。<br>▸ <b>用法</b>：用尊敬語覆述對方的話並確認理解是否正確；<b>までに</b>表期限（在…之前完成）。<br>▸ <b>比較</b>：午後（ごご）までに（下午之前完成・期限）／午後まで（持續到下午）。<br><span class=\"n4\">N4 必考：まで／までに 的區別</span>"],["B","いいや。あしたまで待ってください。","Iiya. Ashita made matte kudasai.","不是的，明天才會完成。","▸ <b>句型</b>：【いいや】否定＋【まで】＋【て形＋ください】。<br>▸ <b>變化</b>：待（ま）つ → 待っ<b>て</b>（つ結尾→って）＋ください。<br>▸ <b>用法</b>：「あしたまで待（ま）って」＝等到明天（まで表持續的終點）；「いいや」是男性的常體否定。<br>▸ <b>比較</b>：いいや（男性・常體）／いいえ（一般）／いや（口語）／ううん（極隨性）。<br><span class=\"n4\">N4 必考：つ結尾動詞的て形是「って」</span>"]]}]},"15":{"title":"同意或反對對方的意見","jp_title":"相手の意見に同意する・反対する","theme":"表示同意、反對和意見異同","scenes":[{"name":"同意（1）","lines":[["A","彼女はいい人だけど、少し恥ずかしがり屋だね。","Kanojo wa ii hito dakedo, sukoshi hazukashigari-ya da ne.","她人不錯，只是有點害羞。","▸ <b>句型</b>：【名詞＋だけど】逆接＋【〜がり屋】性格接尾。<br>▸ <b>變化</b>：いい人（ひと）<b>だ</b>＋けど（名詞接けど<b>要加だ</b>）；恥（は）ずかしい → 恥ずかし<b>がり屋（や）</b>（容易…的人）。<br>▸ <b>用法</b>：「〜がり屋（や）」表性格傾向（恥（は）ずかしがり屋・寒（さむ）がり屋・面倒（めんどう）がり屋）。<br>▸ <b>比較</b>：〜がり屋（や）（容易…的人）／〜屋（職業或性格・本屋（ほんや）・照（て）れ屋）。<br><span class=\"n4\">N4 必考：名詞＋だ＋けど 的接續</span>"],["B","うん、本当だね。","Un, hontō da ne.","嗯！對啊！","▸ <b>句型</b>：【うん】＋【名詞＋だね】附和。<br>▸ <b>變化</b>：本当（ほんとう）です → 本当だ → 本当だね。<br>▸ <b>用法</b>：附和對方的判斷；「ね」表共感，是日語對話維持流暢的關鍵。<br>▸ <b>比較</b>：本当（ほんとう）だね（我也這麼覺得）／そうだね（是啊）／確（たし）かに（確實）。三者都可附和。<br><span class=\"n4\">N4 聽解必考：附和語（あいづち）</span>"]]},{"name":"同意（2）","lines":[["A","8時30分に集まって、早めに出よう。","Hachi-ji sanjuppun ni atsumatte, hayame ni deyō.","我們在8:30集合，早點出發吧！","▸ <b>句型</b>：【時刻＋に】＋【て形連接】＋【意向形】。<br>▸ <b>變化</b>：集（あつ）まる → 集まっ<b>て</b>（る結尾→って）；出（で）る → 意向形<b>出よう</b>（二類：る→よう）。<br>▸ <b>用法</b>：て形連接兩個動作（集合→出發）；意向形表對平輩的提議。<br>▸ <b>比較</b>：集（あつ）まる（自動詞・聚集）／集める（他動詞・收集）。人（ひと）が集まる／切手（きって）を集める。<br><span class=\"n4\">N4 必考：自他動詞配對（集まる／集める）</span>"],["B","そうだね。それではその時に。","Sō da ne. Sore de wa sono toki ni.","好主意！到時候見。","▸ <b>句型</b>：【そうだね】贊同＋【省略動詞的約定】。<br>▸ <b>變化</b>：「それではその時（とき）に」後面省略了「会（あ）いましょう」。<br>▸ <b>用法</b>：「それでは」是「じゃあ」的正式形；約定時間後省略動詞是口語常態。<br>▸ <b>比較</b>：それでは（正式）／では（正式・略簡）／じゃあ（口語）／じゃ（最短）。<br><span class=\"n4\">N4 必考：では／じゃあ 的語體對應</span>"]]},{"name":"同意（3）","lines":[["A","夜運転すれば、道路もすいているでしょう。","Yoru unten sureba, dōro mo suite iru deshō.","假如我們晚上開車，車流量會比較少吧！","▸ <b>句型</b>：【ば形】條件＋【〜ている】狀態＋【でしょう】推測。<br>▸ <b>變化</b>：運転（うんてん）する → <b>運転すれば</b>（三類ば形）；空（す）く → 空いて＋いる（空著的狀態）。<br>▸ <b>用法</b>：<b>ば形</b>表條件（如果…的話）；「道路（どうろ）<b>も</b>」的も表「連道路也」。<br>▸ <b>比較</b>：すいている（空著・自動詞ている）／混（こ）んでいる（擁擠）。兩者都是<b>ている表狀態</b>。<br><span class=\"n4\">N4 必考：ば形變化與 ている 表狀態</span>"],["B","そうだね。","Sō da ne.","是啊！","▸ <b>句型</b>：【そうだね】附和。<br>▸ <b>變化</b>：そうです → そうだ → そうだね（常體＋共感）。<br>▸ <b>用法</b>：最常用的附和語，表示同意對方的推測或看法。<br>▸ <b>比較</b>：そうだね（同意）／そうかな（我倒不覺得・懷疑）／そうかも（也許吧）。<br><span class=\"n4\">N4 聽解必考：そうだね／そうかな 的態度差異</span>"]]},{"name":"同意（4）","lines":[["A","私たちは負けられません。あしたのストを貫徹しましょう。","Watashitachi wa makeraremasen. Ashita no suto wo kantetsu shimashō.","我們不能讓步。明天繼續罷工吧！","▸ <b>句型</b>：【可能形否定】＋【〜を貫徹しましょう】。<br>▸ <b>變化</b>：負（ま）ける → 可能形<b>負けられる</b> → 負けられません（不能輸・不容許讓步）。<br>▸ <b>用法</b>：可能形否定除了「辦不到」，也可表<b>不容許、不應該</b>；「スト」是ストライキ的縮略。「貫徹（かんてつ）する」＝貫徹到底。<br>▸ <b>比較</b>：負（ま）けられません（不能輸・不容許）／負けません（不會輸・意志）／負けたくない（不想輸・願望）。<br><span class=\"n4\">N4 必考：可能形否定的兩種語意</span>"],["B","そうだ！","Sō da!","好！","▸ <b>句型</b>：【そうだ！】強烈贊同。<br>▸ <b>變化</b>：そうです → そうだ（常體，不加ね則語氣更強）。<br>▸ <b>用法</b>：省略「ね」使語氣激昂，適合群眾、口號的場合。<br>▸ <b>比較</b>：そうだ！（激昂贊同）／そうだね（溫和同意）／そうそう（對對・附和）。<br><span class=\"n4\">N4 聽解必考：終助詞有無改變語氣強度</span>"]]},{"name":"同意（5）","lines":[["A","なんてつまらない話なんだろう。ぼくは行くよ。","Nante tsumaranai hanashi nan darō. Boku wa iku yo.","多無聊的座談！我要走了。","▸ <b>句型</b>：【なんて〜なんだろう】感嘆句型＋【よ】。<br>▸ <b>變化</b>：つまらない話（はなし）だ → <b>なんて</b>つまらない話<b>なんだろう</b>（＝なのだろう，感嘆）。<br>▸ <b>用法</b>：「なんて〜だろう」＝多麼…啊（感嘆）；中間放形容詞＋名詞。<br>▸ <b>比較</b>：なんて〜だろう（感嘆）／なんという〜だろう（更書面）／すごく〜（單純程度）。<br><span class=\"n4\">N4 必考：なんて 的感嘆用法</span>"],["B","僕も。さあ、行こう。","Boku mo. Sā, ikō.","我也是，我們走吧！","▸ <b>句型</b>：【僕も】省略＋【さあ】催促＋【意向形】。<br>▸ <b>變化</b>：行（い）く → 意向形<b>行こう</b>。<br>▸ <b>用法</b>：「さあ」用於催促行動或轉換場面；「僕（ぼく）も」後面省略了「行（い）くよ」。<br>▸ <b>比較</b>：さあ（催促・或表不知道）／じゃあ（那麼・承接）／さて（那麼・轉換話題，較書面）。<br><span class=\"n4\">N4 必考：さあ 的多重功能</span>"]]},{"name":"同意（6）","lines":[["A","あんな映画は最低だ。","Anna eiga wa saitei da.","那是我看過最爛的電影了。","▸ <b>句型</b>：【あんな＋名詞】＋【名詞＋だ】斷定。<br>▸ <b>變化</b>：あんな（那種）＋映画（えいが）；最低（さいてい）だ（な形容詞常體）。<br>▸ <b>用法</b>：<b>あんな</b>指離雙方都遠、或彼此都知道的事物；「最低（さいてい）」＝最差（口語罵人也用）。<br>▸ <b>比較</b>：こんな（我這邊的）／そんな（你那邊或剛提到的）／あんな（雙方都知道的、遠的）。<br><span class=\"n4\">N4 必考：こんな／そんな／あんな 的指示範圍</span>"],["B","同感！","Dōkan!","我也有同感。","▸ <b>句型</b>：【名詞單獨感嘆】。<br>▸ <b>變化</b>：同感（どうかん）です → <b>同感！</b>（省略です，語氣更強）。<br>▸ <b>用法</b>：名詞單獨使用表強烈贊同；正式場合說「同感（どうかん）です」。<br>▸ <b>比較</b>：同感（どうかん）（有同感）／賛成（さんせい）（贊成・對提案）／その通（とお）り（正是如此）。<br><span class=\"n4\">N4 必考：漢語名詞的感嘆用法</span>"]]},{"name":"反對（1）","lines":[["A","紀之に賛成だな。君はどう？","Noriyuki ni sansei da na. Kimi wa dō?","我贊成紀之。你覺得呢？","▸ <b>句型</b>：【〜に賛成だ】＋【な】自語＋【〜はどう？】反問。<br>▸ <b>變化</b>：賛成（さんせい）する（動詞）／賛成だ（名詞＋だ）——兩種形式皆可。<br>▸ <b>用法</b>：贊成的對象用<b>に</b>（紀之（のりゆき）に賛成（さんせい））；「君（きみ）はどう？」把話題丟給對方。<br>▸ <b>比較</b>：〜に賛成（さんせい）（贊成）／〜に反対（はんたい）（反對）。兩者<b>都用に</b>，不用を。<br><span class=\"n4\">N4 必考：賛成／反対 的助詞に</span>"],["B","いや、僕は違うよ。陽子の意見の方が良いと思う。","Iya, boku wa chigau yo. Yōko no iken no hō ga yoi to omou.","嗯，我持不同的意見。我覺得陽子的意見比較好。","▸ <b>句型</b>：【いや】否定＋【〜は違う】＋【〜の方が】比較＋【と思う】。<br>▸ <b>變化</b>：違（ちが）う → 違うよ（動詞，不是形容詞）。<br>▸ <b>用法</b>：「僕（ぼく）は違（ちが）う」＝我不一樣（我有不同看法）；「〜の方（ほう）が良（よ）いと思（おも）う」用比較句表明立場。<br>▸ <b>比較</b>：僕（ぼく）は違（ちが）う（我不同意）／それは違う（那是錯的・更直接）／どうかな（我倒不確定・最委婉）。<br><span class=\"n4\">N4 必考：AよりBの方が 的比較句型</span>"]]},{"name":"反對（2）","lines":[["A","このネクタイはそのグリーンのスーツに合いそうだね。","Kono nekutai wa sono gurīn no sūtsu ni aisō da ne.","我覺得這條領帶和那套綠色西裝很配。","▸ <b>句型</b>：【〜に合う】＋【ます形＋そう】樣態＋【ね】。<br>▸ <b>變化</b>：合（あ）う → 合い＋<b>そう</b>（ます形＋そう＝看起來會…）。<br>▸ <b>用法</b>：相配的對象用<b>に</b>（スーツに合（あ）う）；そう表根據外觀的推測。<br>▸ <b>比較</b>：合（あ）いそう（看起來會配）／合うそう（聽說會配・傳聞）／合っている（很搭・狀態）。<br><span class=\"n4\">N4 必考：ます形＋そうだ 的樣態推測</span>"],["B","合わないと思うわ。こちらの方がもっといいわよ。","Awanai to omou wa. Kochira no hō ga motto ii wa yo.","我覺得不配，這條比較適合。","▸ <b>句型</b>：【否定＋と思う】＋【〜の方が＋もっと】比較。<br>▸ <b>變化</b>：合（あ）う → 合わ<b>ない</b>（う結尾→わない）＋と思（おも）うわ。<br>▸ <b>用法</b>：用「と思（おも）う」<b>緩和否定</b>（我覺得不配，而非斷言不配）；「もっと」加強比較。<br>▸ <b>比較</b>：合（あ）わないと思（おも）う（我覺得不配・委婉）／合わない（不配・斷定）。加と思う就柔和許多。<br><span class=\"n4\">N4 必考：と思う 的語氣緩和功能</span>"]]},{"name":"反對（3）","lines":[["A","これは良い色だわ。そう思わない？","Kore wa yoi iro da wa. Sō omowanai?","這個顏色不錯，你覺得呢？","▸ <b>句型</b>：【名詞＋だわ】女性斷定＋【〜と思わない？】徵求同意。<br>▸ <b>變化</b>：良（よ）い色（いろ）だ ＋ わ（女性）；思（おも）う → 思わ<b>ない</b>？（否定疑問＝徵求同意）。<br>▸ <b>用法</b>：否定疑問「〜と思（おも）わない？」＝你不覺得…嗎，比肯定疑問更能拉近距離。<br>▸ <b>比較</b>：そう思（おも）わない？（你不覺得嗎）／そう思う？（你覺得嗎）。前者<b>預設對方會同意</b>。<br><span class=\"n4\">N4 必考：否定疑問的徵求同意功能</span>"],["B","うん、いいけど、君には合わないと思う。","Un, ii kedo, kimi ni wa awanai to omou.","是不錯，但我認為它不適合你。","▸ <b>句型</b>：【局部同意＋けど】＋【〜には】＋【否定＋と思う】。<br>▸ <b>變化</b>：いい＋けど（先同意再轉折）；合（あ）わない ＋ と思（おも）う。<br>▸ <b>用法</b>：<b>先局部同意再用けど轉折</b>，是日語表達反對的標準節奏；「君（きみ）には」＝に＋は，強調對象。<br>▸ <b>比較</b>：いいけど…（是不錯，但…）／よくない（不好・直接否定）。日語幾乎總是選前者。<br><span class=\"n4\">N4 必考：委婉反對的表達結構</span>"]]},{"name":"反對（4）","lines":[["A","僕のアイディアは良いでしょう？","Boku no aidia wa yoi deshō?","你覺得我的主意不錯吧？","▸ <b>句型</b>：【〜でしょう？】徵求認同。<br>▸ <b>變化</b>：良（よ）いです → 良い<b>でしょう</b>＋升調（你覺得不錯吧）。<br>▸ <b>用法</b>：「〜でしょう？」用來期待對方的認同；「アイディア」是外來語（idea）。<br>▸ <b>比較</b>：良（よ）いでしょう？（不錯吧・期待認同）／良いですか（好嗎・單純提問）／良いですね（真好・稱讚）。<br><span class=\"n4\">N4 必考：でしょう 的求同功能</span>"],["B","悪くはないけど、健一郎の方が良さそうだな。","Waruku wa nai kedo, Kenichirō no hō ga yosasō da na.","是不錯，不過健一郎的似乎更好。","▸ <b>句型</b>：【〜くはない】＋【〜の方が】＋【いい的樣態形】。<br>▸ <b>變化</b>：悪（わる）い → 悪く<b>は</b>ない（在否定中插入は表保留）；いい → <b>良（よ）さそう</b>（不規則：いい的樣態形是よさそう）。<br>▸ <b>用法</b>：「悪（わる）くはない」比「悪くない」更有保留意味；良（よ）さそう＝看起來不錯。<br>▸ <b>比較</b>：良（よ）さそう（○ 不規則）／いいそう（× 錯誤）／良いそう（傳聞・聽說很好）。<br><span class=\"n4\">N4 必考陷阱：いい 的樣態形是「よさそう」</span>"]]},{"name":"反對（5）","lines":[["A","彼の計画は最高だと思わない？","Kare no keikaku wa saikō da to omowanai?","你不覺得他的計劃很棒嗎？","▸ <b>句型</b>：【名詞＋だ＋と思わない？】否定疑問。<br>▸ <b>變化</b>：最高（さいこう）だ ＋ と思（おも）わない？（引用名詞句<b>要加だ</b>）。<br>▸ <b>用法</b>：強烈徵求對方同意；「最高（さいこう）」＝最棒（與「最低（さいてい）」相對）。<br>▸ <b>比較</b>：最高（さいこう）（最好）／最低（さいてい）（最差）／最悪（さいあく）（最糟）。三者都常用於口語評價。<br><span class=\"n4\">N4 必考：と思う 前的名詞＋だ</span>"],["B","別に。くわしく調べた方がいいよ。","Betsu ni. Kuwashiku shirabeta hō ga ii yo.","還不知道。我們最好還是仔細研究一下。","▸ <b>句型</b>：【別に】＋【〜た方がいい】勸告。<br>▸ <b>變化</b>：調（しら）べる → 調べ<b>た</b>＋方（ほう）がいい（た形＋方がいい＝最好…）。<br>▸ <b>用法</b>：「別（べつ）に」單獨使用表<b>沒特別感覺</b>（委婉的不贊同）；「〜た方（ほう）がいい」提出建議。<br>▸ <b>比較</b>：〜た方（ほう）がいい（最好做・建議）／〜ない方がいい（最好不要做）。<b>接た形不是辭書形</b>。<br><span class=\"n4\">N4 必考：〜た方がいい 的接續形式</span>"]]}]},"16":{"title":"道歉","jp_title":"謝る","theme":"認錯、道歉和表示歉意","scenes":[{"name":"道歉（1）","lines":[["A","あっ、すみません。","A', sumimasen.","啊！對不起。","▸ <b>句型</b>：【感嘆詞＋すみません】。<br>▸ <b>變化</b>：すみません（一般）→ すみませんでした（過去，對已造成的困擾）。<br>▸ <b>用法</b>：「あっ」是突發狀況的驚呼；輕微碰撞時說「すみません」即可。<br>▸ <b>比較</b>：すみません（一般道歉）／ごめんなさい（熟人・較私人）／失礼（しつれい）しました（禮儀上的失禮）／申（もう）し訳（わけ）ありません（鄭重）。<br><span class=\"n4\">N4 必考：道歉語的輕重與適用對象</span>"],["B","だいじょうぶです。","Daijōbu desu.","沒關係。","▸ <b>句型</b>：【な形容詞＋です】接受道歉。<br>▸ <b>變化</b>：だいじょうぶだ → だいじょうぶです（な形容詞）。<br>▸ <b>用法</b>：「大丈夫（だいじょうぶ）です」是接受道歉、表示自己沒事的固定回應。<br>▸ <b>比較</b>：大丈夫（だいじょうぶ）です（沒關係）／気（き）にしないでください（別在意）／いいえ（不會）。<br><span class=\"n4\">N4 必考：大丈夫 是な形容詞</span>"]]},{"name":"道歉（2）","lines":[["A","すみません。痛かったですか？","Sumimasen. Itakatta desu ka?","對不起，痛嗎？","▸ <b>句型</b>：【すみません】＋【い形容詞過去疑問】。<br>▸ <b>變化</b>：痛（いた）い → <b>痛かった</b>（去い＋かった）＋ですか。<br>▸ <b>用法</b>：道歉後關心對方是否受傷，用<b>過去式</b>因為問的是剛才那一瞬間。<br>▸ <b>比較</b>：痛（いた）かったですか（剛才痛嗎）／痛いですか（現在痛嗎）／大丈夫（だいじょうぶ）ですか（你沒事吧）。<br><span class=\"n4\">N4 必考：い形容詞的過去式（〜かった）</span>"],["B","だいじょうぶです。","Daijōbu desu.","沒關係。","▸ <b>句型</b>：【だいじょうぶです】免除對方歉疚。<br>▸ <b>變化</b>：だいじょうぶ（な形容詞）＋です。<br>▸ <b>用法</b>：表示自己沒事，讓對方安心；日語習慣<b>主動免除對方的歉疚</b>。<br>▸ <b>比較</b>：大丈夫（だいじょうぶ）です（我沒事）／平気（へいき）です（我不在意，較隨性）／問題（もんだい）ありません（沒問題，較正式）。<br><span class=\"n4\">N4 會考回應道歉的各種說法</span>"]]},{"name":"道歉（3）","lines":[["A","ああ、すみません。へまをしてしまって。","Ā, sumimasen. Hema wo shite shimatte.","對不起，不小心出了錯。","▸ <b>句型</b>：【〜てしまう】懊悔＋【て形留白】。<br>▸ <b>變化</b>：する → して＋<b>しまう</b>（表無法挽回、懊悔）→ してしまっ<b>て</b>（て形留白，後面省略「すみません」）。<br>▸ <b>用法</b>：「へまをする」＝出錯、失誤；<b>てしまう</b>強調不該發生卻發生了。口語縮約為「しちゃって」。<br>▸ <b>比較</b>：してしまって（懊悔）／しちゃって（口語）／しました（單純陳述）。<br><span class=\"n4\">N4 必考：〜てしまう 的懊悔語感與口語縮約</span>"],["B","ご心配なく。だいじょうぶです。","Goshinpai naku. Daijōbu desu.","不要介意，沒事的。","▸ <b>句型</b>：【ご＋漢語名詞＋なく】簡潔敬語。<br>▸ <b>變化</b>：心配（しんぱい）する → ご心配 ＋ <b>なく</b>（＝なさらないでください的省略）。<br>▸ <b>用法</b>：「ご心配（しんぱい）なく」是簡潔有力的敬語，等於「心配しないでください」。<br>▸ <b>比較</b>：ご心配（しんぱい）なく（別擔心・簡潔）／ご心配なさらないでください（完整敬語）／心配しないで（常體）。<br><span class=\"n4\">N4 讀解會出現「ご〜なく」的省略敬語</span>"]]},{"name":"道歉（4）","lines":[["A","遅れてすみません。道路が渋滞していて。","Okurete sumimasen. Dōro ga jūtai shite ite.","抱歉，遲到了，因為道路擁擠。","▸ <b>句型</b>：【て形表原因＋すみません】＋【〜ていて】理由留白。<br>▸ <b>變化</b>：遅（おく）れる → 遅れ<b>て</b>（て形表原因）＋すみません；渋滞（じゅうたい）する → 渋滞して＋いて（ている的て形）。<br>▸ <b>用法</b>：「〜てすみません」說明道歉的原因；句尾用ていて留白，把理由說一半（後面省略「遅（おく）れました」）。<br>▸ <b>比較</b>：遅（おく）れてすみません（遲到了抱歉）／遅（おそ）くなってすみません（變晚了抱歉，更常用）。<br><span class=\"n4\">N4 必考：て形表原因的用法</span>"],["B","大丈夫です。私も着いたばかりです。","Daijōbu desu. Watashi mo tsuita bakari desu.","沒關係的，我也才剛到。","▸ <b>句型</b>：【〜たばかりです】剛剛＋【も】表同樣。<br>▸ <b>變化</b>：着（つ）く → 着い<b>た</b>＋ばかり（剛…）。<br>▸ <b>用法</b>：「私（わたし）も着（つ）いたばかり」＝我也才剛到，用來<b>化解對方的歉意</b>，是很體貼的說法。<br>▸ <b>比較</b>：〜たばかり（剛剛才・強調時間短）／〜たところ（剛好…的時候）／もう〜た（已經）。<br><span class=\"n4\">N4 必考：〜たばかり／〜たところ 的差異</span>"]]},{"name":"道歉（5）","lines":[["A","先生、すいません。昨日は授業に出られませんでした。風邪がひどくて、ずっと寝ていました。","Sensei, suimasen. Kinō wa jugyō ni deraremasen deshita. Kaze ga hidokute, zutto nete imashita.","老師，不好意思，昨天沒辦法來上課，感冒很嚴重，一直在休息。","▸ <b>句型</b>：【可能形過去否定】＋【い形容詞て形表原因】＋【ずっと〜ていた】。<br>▸ <b>變化</b>：出（で）る → 可能形 出られる → <b>出られませんでした</b>（可能形的過去否定）；ひどい → ひどく<b>て</b>（い形容詞て形＝去い＋くて）。<br>▸ <b>用法</b>：「授業（じゅぎょう）に出（で）る」＝上課、出席（に表對象）；「ずっと」＝一直，配合ていた表持續。<br>▸ <b>比較</b>：出（で）られませんでした（不能去・能力・狀況）／出ませんでした（沒去・意志）。<b>可能形表非自願</b>。<br><span class=\"n4\">N4 必考：可能形否定表達「非我所願」</span>"],["B","だいじょうぶ。今、体の調子はどう。","Daijōbu. Ima, karada no chōshi wa dō.","沒關係的。那你現在身體狀況如何？","▸ <b>句型</b>：【だいじょうぶ】常體＋【AのB＋はどう】關心。<br>▸ <b>變化</b>：だいじょうぶです → だいじょうぶ（常體，老師對學生）。<br>▸ <b>用法</b>：「体（からだ）の調子（ちょうし）はどう」＝身體狀況如何（固定問法）；「今（いま）」表現在。<br>▸ <b>比較</b>：体（からだ）の調子（ちょうし）はどう（身體狀況）／気分（きぶん）はどう（心情或身體感受）／具合（ぐあい）はどう（狀況・多指身體）。<br><span class=\"n4\">N4 必考：調子／気分／具合 的區別</span>"]]},{"name":"道歉（6）","lines":[["A","由貴、本当に申し訳ないけど、あなたのパーティに出られないんだ。週末に出かけるんだよ。","Yuki, hontō ni mōshiwake nai kedo, anata no pātī ni derarenai n da. Shūmatsu ni dekakeru n da yo.","由貴，真的很抱歉，沒辦法去參加你的舞會。我這個週末要出去。","▸ <b>句型</b>：【申し訳ない＋けど】＋【可能形否定＋んだ】＋【〜んだよ】。<br>▸ <b>變化</b>：申（もう）し訳（わけ）ない（い形容詞）＋けど；出（で）る → 出られない ＋ <b>んだ</b>（＝のだ，說明）。<br>▸ <b>用法</b>：「申（もう）し訳（わけ）ない」比「すみません」鄭重（丁寧形為「申し訳ありません」）；「パーティに出（で）る」＝參加派對。<br>▸ <b>比較</b>：申（もう）し訳（わけ）ない（常體・鄭重）／申し訳ありません（丁寧）／申し訳ございません（最鄭重）。<br><span class=\"n4\">N4 必考：申し訳ない 的三種形式</span>"],["B","それは本当に残念ね。あなたが来るのを楽しみにしていたのだけど。","Sore wa hontō ni zannen ne. Anata ga kuru no wo tanoshimi ni shite ita no dakedo.","那真是太可惜了！我一直很期望你能來。","▸ <b>句型</b>：【な形容詞＋ね】＋【〜のを楽しみにしていた】＋【のだけど】。<br>▸ <b>變化</b>：来（く）る → 来る<b>の</b>（名詞化）＋を楽（たの）しみにする → <b>楽しみにしていた</b>（過去進行＝一直期待著）。<br>▸ <b>用法</b>：「〜を楽（たの）しみにしている」＝期待…（固定搭配）；句尾「のだけど」留白，暗示遺憾。「残念（ざんねん）」＝可惜。<br>▸ <b>比較</b>：楽（たの）しみにしていた（一直期待著・已落空）／楽しみです（很期待・現在）／楽しみにしています（期待中）。<br><span class=\"n4\">N4 必考：〜のを楽しみにする 的名詞化</span>"]]}]},"17":{"title":"各種情感的表現","jp_title":"さまざまな感情を表す","theme":"喜怒哀樂和情感表達","scenes":[{"name":"喜悅（考試）","lines":[["A","おかあさん、やったよ！試験に合格したよ。","Okāsan, yatta yo! Shiken ni gōkaku shita yo.","媽媽，我做到了！我通過考試了！","▸ <b>句型</b>：【やった】成功歡呼＋【〜に合格する】。<br>▸ <b>變化</b>：やる → <b>やった</b>（過去式當感嘆詞用＝我成功了）；合格（ごうかく）する → 合格した＋よ。<br>▸ <b>用法</b>：「試験（しけん）<b>に</b>合格（ごうかく）する」合格的對象用に（不用を）；「やった！」是成功時的固定歡呼。<br>▸ <b>比較</b>：試験（しけん）に合格（ごうかく）する（考試合格）／試験を受（う）ける（參加考試）／試験に落（お）ちる（考試落榜）。<br><span class=\"n4\">N4 必考：合格する／受かる 的助詞に</span>"],["B","すばらしいわ、紀之。とても嬉しいわ。","Subarashii wa, Noriyuki. Totemo ureshii wa.","太好了！紀之，我好高興。","▸ <b>句型</b>：【い形容詞＋わ】女性語氣＋【とても＋感情形容詞】。<br>▸ <b>變化</b>：すばらしい ＋ わ（女性）；嬉（うれ）しい ＋ わ。<br>▸ <b>用法</b>：「嬉（うれ）しい」是<b>描述自己</b>的情緒，不可直接用於他人（他人要說「嬉しそう」）。<br>▸ <b>比較</b>：（自己）嬉（うれ）しい／（他人）嬉しそう・嬉しがっている。這是日語感情形容詞的鐵則。<br><span class=\"n4\">N4 必考：感情形容詞的人稱限制</span>"]]},{"name":"喜悅（工作）","lines":[["A","新しい仕事を見つけたんだって？","Atarashii shigoto wo mitsuketa n datte?","聽說你找到新工作？","▸ <b>句型</b>：【〜んだって？】傳聞確認。<br>▸ <b>變化</b>：見（み）つけた ＋ <b>んだって</b>（＝のだそうだ的口語）＋？＝聽說你…是嗎。<br>▸ <b>用法</b>：「〜んだって？」用來確認聽到的傳聞，語氣親近；「仕事（しごと）を見（み）つける」＝找到工作（他動詞）。<br>▸ <b>比較</b>：〜んだって？（聽說…是嗎・口語）／〜そうですね（聽說…呢・丁寧）／〜らしいですね（似乎…呢）。<br><span class=\"n4\">N4 必考：傳聞的口語形 〜んだって</span>"],["B","そうだよ。見つけたよ。","Sō da yo. Mitsuketa yo.","對，找到了。","▸ <b>句型</b>：【そうだよ】肯定＋【動詞過去＋よ】。<br>▸ <b>變化</b>：見（み）つける → 見つけた（他動詞過去）。<br>▸ <b>用法</b>：先用「そうだよ」肯定傳聞，再重複動詞加以確認。<br>▸ <b>比較</b>：見（み）つけた（找到了・他動詞・我找的）／見つかった（找到了・自動詞・被發現）。<br><span class=\"n4\">N4 必考：見つける／見つかる 的自他配對</span>"],["A","それはすばらしい。おめでとう！","Sore wa subarashii. Omedetō!","那真是太好了。恭喜你！","▸ <b>句型</b>：【それは＋形容詞】評論＋【おめでとう】道賀。<br>▸ <b>變化</b>：おめでとうございます → <b>おめでとう</b>（常體）。<br>▸ <b>用法</b>：「それはすばらしい」＝那真是太好了（それは指對方的事）；道賀用「おめでとう」。<br>▸ <b>比較</b>：おめでとう（常體）／おめでとうございます（丁寧）／お誕生日（たんじょうび）おめでとう（生日快樂）。<br><span class=\"n4\">N4 必考：おめでとう 的敬體轉換</span>"]]},{"name":"驚訝（得獎）","lines":[["A","クイズ番組で一等賞を取ったよ！","Kuizu bangumi de ittōshō wo totta yo!","我得到猜謎節目的頭獎耶！","▸ <b>句型</b>：【場所・範圍＋で】＋【〜を取る】＋【よ】告知。<br>▸ <b>變化</b>：取（と）る → 取った（過去）＋よ。<br>▸ <b>用法</b>：「クイズ番組（ばんぐみ）<b>で</b>」表範圍、場合；「一等賞（いっとうしょう）を取（と）る」＝得到頭獎（固定搭配）。<br>▸ <b>比較</b>：賞（しょう）を取（と）る（得獎）／賞をもらう（獲得獎項・被給予）／賞に入（はい）る（入選）。<br><span class=\"n4\">N4 必考：で 表範圍・場合</span>"],["B","驚きだ！うちでは今まで誰も賞なんて取ったことがないよ。","Odoroki da! Uchi de wa ima made dare mo shō nante totta koto ga nai yo.","真的嗎？家裡到現在還沒有人拿過什麼獎之類的。","▸ <b>句型</b>：【〜なんて】舉例輕視＋【疑問詞＋も＋否定】＋【〜たことがない】。<br>▸ <b>變化</b>：取（と）る → 取っ<b>た</b>＋ことがない（沒有…的經驗）；誰（だれ）<b>も</b>＋否定＝沒有任何人。<br>▸ <b>用法</b>：<b>なんて</b>表「…之類的」並帶輕視或意外；「うちでは」＝在我家（で＋は表範圍對比）。<br>▸ <b>比較</b>：〜なんて（…之類的・帶感情）／〜など（…等・中性）／〜とか（…之類・口語）。<br><span class=\"n4\">N4 必考：〜たことがない 與疑問詞＋も＋否定</span>"],["A","必ず「最初」というものがあるさ。","Kanarazu 'saisho' to iu mono ga aru sa.","凡事總有第一次嘛！","▸ <b>句型</b>：【〜というもの】把詞語概念化 ＋【必ず】＋【さ】男性語氣。<br>▸ <b>逐詞拆解</b>：<b>必（かなら）ず</b>＝必定（與肯定呼應）；<b>「最初（さいしょ）」</b>＝加引號表示<b>把這個詞當概念提出</b>；<b>という</b>＝と（引用）＋いう（說）＝所謂的；<b>もの</b>＝形式名詞（東西、事物）；<b>がある</b>＝存在句；<b>さ</b>＝男性隨性的斷定語氣。<br>▸ <b>句型公式</b>：<b>［名詞］＋というもの</b>＝所謂的…這種東西。例：<b>時間（じかん）というものは大切（たいせつ）だ</b>（時間這種東西很寶貴）／<b>人生（じんせい）というものは分（わ）からない</b>（人生這種事說不準）。<br>▸ <b>用法</b>：「〜というもの」把抽象概念<b>提出來當話題</b>，語氣像在講道理、下結論。整句意思是「凡事總有第一次嘛」，用來安慰對方不必因為是首例而驚訝。<br>▸ <b>比較</b>：<b>〜というもの</b>（概念化・帶感慨）／<b>〜ということ</b>（把句子名詞化）／<b>〜というの</b>（口語）。另：<b>〜というものだ</b>＝本來就是這樣（下定論）。<br><span class=\"n4\">N4 必考：という 的引用・定義功能</span>"]]},{"name":"驚訝（機票）","lines":[["A","あのね。ハワイへのチケットが2枚あたったよ。","Ano ne. Hawai e no chiketto ga ni-mai atatta yo.","喂！我贏得二張到夏威夷的機票。","▸ <b>句型</b>：【あのね】呼喚＋【〜への】＋【量詞枚】＋【あたる】。<br>▸ <b>變化</b>：あたる（中獎，自動詞）→ あたった（過去）。<br>▸ <b>用法</b>：「ハワイ<b>への</b>チケット」——<b>へ＋の</b>可以修飾名詞（に的話不可說「×にのチケット」）；票券的量詞用<b>枚（まい）</b>。<br>▸ <b>比較</b>：〜への（○ へ可加の）／〜にの（× 不可）。這是へ獨有的功能。<br><span class=\"n4\">N4 必考：へ＋の 修飾名詞</span>"],["B","信じられないわ？うそでしょう。","Shinjirarenai wa? Uso deshō.","我不信！你在開玩笑吧！","▸ <b>句型</b>：【可能形否定】＋【〜でしょう】質疑。<br>▸ <b>變化</b>：信（しん）じる → 可能形 信じられる → <b>信じられない</b>（無法相信）＋わ（女性）。<br>▸ <b>用法</b>：「信（しん）じられない」是表達驚訝的固定說法；「うそでしょう」＝你在騙人吧（半開玩笑）。<br>▸ <b>比較</b>：信（しん）じられない（難以置信）／まさか（不會吧）／本当（ほんとう）？（真的嗎）。<br><span class=\"n4\">N4 必考：二類動詞的可能形（信じる→信じられる）</span>"],["A","ほんとうさ。ここにあるよ。ほら。","Hontō sa. Koko ni aru yo. Hora.","真的，你看在這裡。","▸ <b>句型</b>：【名詞＋さ】男性斷定＋【場所＋にある】＋【ほら】。<br>▸ <b>變化</b>：ほんとうだ → ほんとうさ（男性語氣）。<br>▸ <b>用法</b>：「ほら」用來要對方看過來（提示證據）；「ここにあるよ」存在句用に。<br>▸ <b>比較</b>：ほら（你看・提示）／ね（你看・徵求同意）／さあ（來吧・催促）。<br><span class=\"n4\">N4 聽解必考：感嘆詞的功能區分</span>"],["B","わあーい。いつ発つの？","Wā-i. Itsu tatsu no?","哇…！何時出發？","▸ <b>句型</b>：【感嘆詞】＋【いつ＋動詞＋の？】。<br>▸ <b>變化</b>：発（た）つ → 発つ＋の？（常體疑問）。<br>▸ <b>用法</b>：「発（た）つ」＝出發（比「出（で）る」正式，多用於旅行、遠行）。<br>▸ <b>比較</b>：発（た）つ（啟程）／出発（しゅっぱつ）する（出發・正式）／出（で）る（出去・一般）／行（い）く（去）。<br><span class=\"n4\">N4 必考：発つ／出る 的語意差異</span>"]]},{"name":"同情（受傷）","lines":[["A","健一郎は行けないと思うよ。きのう足を折ったんだ。","Kenichirō wa ikenai to omou yo. Kinō ashi wo otta n da.","我想健一郎不能去了，昨天他腿骨折了。","▸ <b>句型</b>：【可能形否定＋と思う】＋【〜を折る】＋【んだ】。<br>▸ <b>變化</b>：行（い）ける → 行けない（可能形否定）；折（お）る（他動詞）→ 折った。<br>▸ <b>用法</b>：日語骨折習慣用<b>他動詞</b>「足（あし）を折（お）る」（自己弄斷的），也可說「足の骨（ほね）を折った」。<br>▸ <b>比較</b>：足（あし）を折（お）る（他動詞・骨折）／足が折（お）れる（自動詞・斷了）／けがをする（受傷）。<br><span class=\"n4\">N4 必考：折る／折れる 的自他配對</span>"],["B","それは大変だ。気の毒だね。","Sore wa taihen da. Kinodoku da ne.","真糟糕。真可憐喲！","▸ <b>句型</b>：【それは＋な形容詞】＋【気の毒＋だね】同情。<br>▸ <b>變化</b>：大変（たいへん）だ（な形容詞）；気（き）の毒（どく）だ → 気の毒だね。<br>▸ <b>用法</b>：「気（き）の毒（どく）」表<b>對他人的不幸感到同情</b>，不可用於自己（×私（わたし）は気の毒です）。<br>▸ <b>比較</b>：気（き）の毒（どく）（同情他人的不幸）／かわいそう（可憐・略帶居高臨下）／残念（ざんねん）（遺憾・可用於自己）。<br><span class=\"n4\">N4 必考：気の毒／かわいそう／残念 的使用對象</span>"],["A","そうだね。","Sō da ne.","是啊！","▸ <b>句型</b>：【そうだね】附和感慨。<br>▸ <b>變化</b>：そうです → そうだ → そうだね。<br>▸ <b>用法</b>：對壞消息附和時使用，表示共感。<br>▸ <b>比較</b>：そうだね（附和）／本当（ほんとう）だね（確實如此）／困（こま）ったね（真麻煩啊）。<br><span class=\"n4\">N4 聽解必考：附和語的選擇</span>"]]},{"name":"同情（心情低落）","lines":[["A","陽子、きょうは調子がよくなさそうだね。だいじょうぶ？","Yōko, kyō wa chōshi ga yokunasasō da ne. Daijōbu?","陽子，你今天身體好像不太舒服，還好嗎？","▸ <b>句型</b>：【いい的否定＋そう】樣態＋【だいじょうぶ？】。<br>▸ <b>變化</b>：いい → よくない（否定）→ <b>よくなさそう</b>（否定的樣態形，不規則變化）。<br>▸ <b>用法</b>：「調子（ちょうし）がよくなさそう」＝看起來狀況不太好；否定＋そう的變化較特殊，要整組記。<br>▸ <b>比較</b>：よさそう（看起來不錯）／よくなさそう（看起來不太好）／悪（わる）そう（看起來很糟）。<br><span class=\"n4\">N4 必考陷阱：いい 的樣態形（よさそう／よくなさそう）</span>"],["B","だいじょうぶよ。ちょっと気分がふさいでいるの。","Daijōbu yo. Chotto kibun ga fusaide iru no.","沒關係啦！只是心情有點鬱悶。","▸ <b>句型</b>：【だいじょうぶよ】＋【〜ている＋の】女性說明。<br>▸ <b>變化</b>：ふさぐ → ふさいで＋いる（狀態持續）＋の（女性語氣）。<br>▸ <b>用法</b>：「気分（きぶん）がふさぐ」＝心情鬱悶（慣用語）；「ちょっと」緩和語氣。<br>▸ <b>比較</b>：気分（きぶん）がふさぐ（鬱悶）／落（お）ち込（こ）む（低落）／元気（げんき）がない（沒精神）。<br><span class=\"n4\">N4 會考心情相關的慣用表現</span>"],["A","それはかわいそうに。何か僕にできるかい？","Sore wa kawaisō ni. Nani ka boku ni dekiru kai?","那太可憐了，有沒有什麼我可以幫忙的？","▸ <b>句型</b>：【な形容詞副詞形】＋【疑問詞＋が＋可能形＋かい】。<br>▸ <b>變化</b>：かわいそうだ → <b>かわいそうに</b>（な形容詞副詞形，此處單獨使用表同情）；できる ＋ かい（男性疑問）。<br>▸ <b>用法</b>：「何（なに）か僕（ぼく）にできる（こと）」＝有什麼我能做的；能力的主體用<b>に</b>（僕にできる）。<br>▸ <b>比較</b>：僕（ぼく）にできる（我能做到・能力）／僕がする（我來做・意志）。<b>に vs が</b>視點不同。<br><span class=\"n4\">N4 必考：〜にできる 表能力的主體</span>"]]},{"name":"同情（吵架）","lines":[["A","今気分はどうですか。","Ima kibun wa dō desu ka.","現在心情還好吧？","▸ <b>句型</b>：【〜はどうですか】關心。<br>▸ <b>變化</b>：どうですか（＝いかがですか的一般形）。<br>▸ <b>用法</b>：「気分（きぶん）はどう」可問心情也可問身體感受；「今（いま）」放句首表現在。<br>▸ <b>比較</b>：気分（きぶん）（心情・身體感受）／機嫌（きげん）（情緒・心情好壞）／調子（ちょうし）（狀況・進展）。<br><span class=\"n4\">N4 必考：気分／機嫌／調子 的區別</span>"],["B","うん。きょうはちょっと落ち込んでるんだ。家族と喧嘩しちゃって。","Un. Kyō wa chotto ochikonderu n da. Kazoku to kenka shichatte.","嗯。今天心情有點差，跟家裡的人吵了一架。","▸ <b>句型</b>：【〜ている的縮約】＋【〜ちゃって】口語懊悔。<br>▸ <b>變化</b>：落（お）ち込（こ）んでいる → <b>落ち込んでる</b>（い脫落）；喧嘩（けんか）してしまって → <b>喧嘩しちゃって</b>（てしまう→ちゃう的口語縮約）。<br>▸ <b>用法</b>：「〜と喧嘩（けんか）する」吵架的對象用<b>と</b>（互相的動作）；ちゃって表懊惱、後悔。<br>▸ <b>比較</b>：てしまう → ちゃう／でしまう → じゃう（例：飲（の）んじゃった・読（よ）んじゃった）。<br><span class=\"n4\">N4 聽解必考：ちゃう／じゃう 的還原</span>"],["A","なるほどね。","Naruhodo ne.","原來如此。","▸ <b>句型</b>：【なるほど＋ね】理解。<br>▸ <b>變化</b>：なるほど（副詞・原來如此）＋ね（共感）。<br>▸ <b>用法</b>：表示聽懂對方的說明並接受；對上位者頻繁使用可能顯得像在評價對方，宜留意。<br>▸ <b>比較</b>：なるほど（原來如此）／そうですか（是這樣嗎）／確（たし）かに（確實）。<br><span class=\"n4\">N4 聽解必考：なるほど 的使用場合</span>"]]},{"name":"同情（無法同行）","lines":[["A","圭子はおかあさんが病気になったから一緒に行けないよ。","Keiko wa okāsan ga byōki ni natta kara issho ni ikenai yo.","圭子因為母親生病不能一起去了。","▸ <b>句型</b>：【〜になる】變化＋【から】原因＋【可能形否定】。<br>▸ <b>變化</b>：病気（びょうき）になる（狀態變化用に）→ 病気になった＋<b>から</b>（原因）；行（い）ける → 行けない。<br>▸ <b>用法</b>：「圭子（けいこ）は…行（い）けない」——主題是圭子，但原因句的主語是「おかあさんが」，日語一句中可有兩個主語層次。<br>▸ <b>比較</b>：病気（びょうき）になる（生病・變化）／病気だ（是病・狀態）／具合（ぐあい）が悪（わる）い（身體不適）。<br><span class=\"n4\">N4 必考：〜になる 的變化表現與から表原因</span>"],["B","ああ、それは気の毒ですね。","Ā, sore wa kinodoku desu ne.","唉！那好可惜哦！","▸ <b>句型</b>
