：【それは＋気の毒ですね】同情。<br>▸ <b>變化</b>：気（き）の毒（どく）だ → 気の毒です → 気の毒ですね。<br>▸ <b>用法</b>：對<b>第三者</b>的不幸表示同情的固定說法；「ああ」表感嘆。<br>▸ <b>比較</b>：気（き）の毒（どく）ですね（同情第三者）／お気の毒に（直接對當事人說，較鄭重）／残念（ざんねん）ですね（遺憾）。<br><span class=\"n4\">N4 必考：気の毒 的使用對象</span>"],["A","うん。圭子は旅行をとても楽しみにしていたからね。","Un. Keiko wa ryokō wo totemo tanoshimi ni shite ita kara ne.","嗯！圭子非常期待這次的旅行。","▸ <b>句型</b>：【〜を楽しみにしていた】＋【からね】補述。<br>▸ <b>變化</b>：楽（たの）しみにする → 楽しみにして＋<b>いた</b>（過去持續＝一直期待著）。<br>▸ <b>用法</b>：過去進行式表「原本一直期待」，暗示現在落空；「からね」補述理由並尋求理解。<br>▸ <b>比較</b>：楽（たの）しみにしていた（一直期待・已落空）／楽しみにしている（期待中）／楽しみだ（很期待）。<br><span class=\"n4\">N4 必考：〜ていた 表過去的持續狀態</span>"],["B","じゃあ、今回またチャンスがあったら、もう一度誘いましょう。","Jā, konkai mata chansu ga attara, mō ichido sasoimashō.","那下次如果有機會，再邀她一起去吧！","▸ <b>句型</b>：【〜たら】條件＋【もう一度】＋【ましょう】。<br>▸ <b>變化</b>：ある → あっ<b>たら</b>（た形＋ら）；誘（さそ）う → 誘いましょう。<br>▸ <b>用法</b>：「チャンスがあったら」＝如果有機會的話；たら表假設條件。<br>▸ <b>比較</b>：あったら（如果有・假設）／あれば（如果有・條件強調）／あると（一有就…・必然）。<br><span class=\"n4\">N4 必考：たら／ば／と 的條件差異</span>"]]},{"name":"哀悼","lines":[["A","お母さんがお亡くなりになったそうで、お気の毒に思います。つらいことでしょう。","Okāsan ga onakunari ni natta sō de, okinodoku ni omoimasu. Tsurai koto deshō.","聽說令堂過世了，我很難過。一定很難受吧。","▸ <b>句型</b>：【お＋ます形＋になる】最高敬語 ＋【〜そうで】傳聞＋原因 ＋【〜でしょう】推測對方心情。<br>▸ <b>逐詞拆解</b>：<b>お亡（な）くなりになった</b>＝亡くなる（死（し）ぬ的委婉語）→お亡くなりになる（<b>再加一層敬語</b>）→過去式；<b>そうで</b>＝そうだ（傳聞）的中止形＋で（表原因）＝「聽說…所以」；<b>お気（き）の毒（どく）に思（おも）います</b>＝お＋気の毒（同情）＋に思う＝深感遺憾；<b>つらいことでしょう</b>＝推測對方的心情。<br>▸ <b>句型公式</b>：<b>［普通形］＋そうで、〜</b>＝聽說…所以…。例：<b>お忙（いそが）しいそうで、大変（たいへん）ですね</b>（聽說您很忙，真是辛苦）。<br>▸ <b>用法</b>：談論他人的死亡<b>必須用敬語</b>，直接說「死（し）にました」極為失禮。哀悼的完整套語是<b>「お悔（く）やみ申（もう）し上（あ）げます」</b>（謹表哀悼）；本句的「お気（き）の毒（どく）に思います」較口語。<br>▸ <b>比較</b>：敬意階梯：死（し）ぬ（直接・不用於他人）＜ 亡（な）くなる（委婉）＜ お亡くなりになる（尊敬）＜ ご逝去（せいきょ）（最正式・書面）。另：<b>つらいことでしょう</b>＝推測他人的感受要加<b>でしょう</b>，不可直接說「つらいです」（那是自己的感受）。<br><span class=\"n4\">N4 必考：死ぬ 的委婉與敬語階梯、感情形容詞的人稱限制</span>"],["B","ええ。とても急だったものですから。","Ē. Totemo kyū datta mono desu kara.","是的。事情很突然。","▸ <b>句型</b>：【な形容詞過去】 ＋【〜ものですから】鄭重的理由說明。<br>▸ <b>逐詞拆解</b>：<b>とても急（きゅう）だった</b>＝急だ（な形容詞・突然）→過去式<b>急だった</b>；<b>もの</b>＝形式名詞；<b>ですから</b>＝因為 → 合起來＝「因為是很突然的事」。<br>▸ <b>句型公式</b>：<b>［普通形］＋ものですから</b>＝因為…（帶有解釋、請對方體諒的語氣）。例：<b>電車（でんしゃ）が遅（おく）れたものですから、遅刻（ちこく）しました</b>（因為電車誤點，所以遲到了）／<b>初（はじ）めてなものですから、よく分（わ）かりません</b>（因為是第一次，所以不太清楚）。<br>▸ <b>用法</b>：「〜ものですから」比「〜から」更鄭重、也更帶<b>辯解與請求理解</b>的意味，常用於道歉或解釋自己的處境。名詞・な形容詞接續時要加<b>な</b>：<b>急（きゅう）なものですから</b>（現在式）／<b>急だったものですから</b>（過去式）。<br>▸ <b>比較</b>：<b>ものですから</b>（鄭重解釋・求體諒）／<b>ので</b>（客觀原因・禮貌）／<b>から</b>（主觀原因・一般）／<b>もので</b>（略簡的ものですから）。<br><span class=\"n4\">N4 必考：から／ので／ものですから 的語體與語氣差異</span>"]]},{"name":"安慰（手術）","lines":[["A","手術は成功だったわ。母はきっと元気になるわ。","Shujutsu wa seikō datta wa. Haha wa kitto genki ni naru wa.","手術成功了。母親一定會康復的。","▸ <b>句型</b>：【名詞過去＋わ】＋【きっと】＋【〜になる】。<br>▸ <b>變化</b>：成功（せいこう）だ → <b>成功だった</b>（名詞句過去）；元気（げんき）になる（な形容詞＋に＋なる）。<br>▸ <b>用法</b>：<b>きっと</b>表主觀的強烈確信，常與「〜だろう・〜と思（おも）う・〜はず」呼應。「手術（しゅじゅつ）」＝手術。<br>▸ <b>比較</b>：きっと（一定・主觀確信90%）／必（かなら）ず（必定・客觀100%）／たぶん（大概70%）。<br><span class=\"n4\">N4 必考：きっと／必ず／たぶん 的確信度</span>"],["B","ほっとしたよ。とても心配してたんだ。","Hotto shita yo. Totemo shinpai shiteta n da.","放心了。我很擔心。","▸ <b>句型</b>：【擬態語＋する】＋【〜ていた的縮約】。<br>▸ <b>變化</b>：ほっとする → <b>ほっとした</b>（過去＝鬆了一口氣）；心配（しんぱい）していた → <b>心配してた</b>（い脫落）。<br>▸ <b>用法</b>：「ほっとする」是擬態語＋する的複合動詞；用過去式表「此刻放心了」。<br>▸ <b>比較</b>：ほっとする（鬆一口氣）／安心（あんしん）する（安心）／ドキドキする（緊張・心跳）。<br><span class=\"n4\">N4 必考：擬態語＋する 的複合動詞</span>"]]},{"name":"安慰（自責）","lines":[["A","ねえ、君はよく頑張りました。今はお医者さんにまかせるんだ。","Nē, kimi wa yoku ganbarimashita. Ima wa oisha-san ni makaseru n da.","嘿，你已經很努力了。現在就交給醫生吧。","▸ <b>句型</b>：【ねえ】呼喚＋【副詞よく】＋【〜にまかせる】＋【んだ】。<br>▸ <b>變化</b>：まかせる → まかせる＋<b>んだ</b>（＝のだ，此處表叮嚀、勸告）。<br>▸ <b>用法</b>：委託的對象用<b>に</b>（お医者（いしゃ）さんにまかせる）；「よく頑張（がんば）りました」＝你很努力了（稱讚）。<br>▸ <b>比較</b>：〜にまかせる（交給某人）／〜を任（まか）せる（把某事託付）。<b>人用に，事用を</b>。<br><span class=\"n4\">N4 必考：まかせる 的助詞搭配</span>"],["B","わかってるわ。でも、何もできなくてとてもはがゆいのよ。","Wakatteru wa. Demo, nani mo dekinakute totemo hagayui no yo.","我知道。可是什麼都做不了，好著急啊。","▸ <b>句型</b>：【〜ている縮約】＋【疑問詞＋も＋否定】＋【て形表原因】。<br>▸ <b>變化</b>：わかっている → <b>わかってる</b>（い脫落）；できる → でき<b>なくて</b>（否定的て形＝表原因）。<br>▸ <b>用法</b>：「何（なに）もできなくて」＝什麼都做不到（所以…）；「はがゆい」＝焦急難耐。<br>▸ <b>比較</b>：できなくて（因為做不到・て形表原因）／できないで（沒做就…・附帶狀況）。<br><span class=\"n4\">N4 必考：〜なくて／〜ないで 的區別</span>"],["A","君の気持ちはよくわかるよ。","Kimi no kimochi wa yoku wakaru yo.","我很明白你的心情。","▸ <b>句型</b>：【AのB＋は＋よくわかる】。<br>▸ <b>變化</b>：わかる → わかるよ（現在式表「我理解」）。<br>▸ <b>用法</b>：「気持（きも）ちはよくわかる」是安慰他人的固定說法；用<b>は</b>提示主題。<br>▸ <b>比較</b>：わかる（理解・能懂）／知（し）っている（知道・有資訊）。<b>感情用わかる，事實用知る</b>。<br><span class=\"n4\">N4 必考：わかる／知る 的區別</span>"]]},{"name":"安慰（不是你的錯）","lines":[["A","ああ、泥棒が入ったのは僕のせいだ。窓を調べるべきだった。","Ā, dorobō ga haitta no wa boku no sei da. Mado wo shiraberu beki datta.","唉，遭小偷是我的錯。我應該檢查窗戶的。","▸ <b>句型</b>：【動詞＋の】名詞化 ＋【〜のせいだ】歸責 ＋【〜べきだった】對過去的悔恨。<br>▸ <b>逐詞拆解</b>：<b>泥棒（どろぼう）が入（はい）った</b>＝小偷進來了（自動詞・入る）；<b>入ったの</b>＝<b>の</b>把整句名詞化（遭小偷這件事）；<b>は僕（ぼく）のせいだ</b>＝せい（原因・責任）＋だ＝是我的錯；<b>調（しら）べるべきだった</b>＝調べる（辭書形）＋べき（應該）＋だった（過去）＝本該檢查卻沒檢查。<br>▸ <b>句型公式</b>：<b>［辭書形］＋べきだった</b>＝本來應該…（卻沒做，表後悔）。例：<b>もっと早（はや）く言（い）うべきだった</b>（早該說了）／<b>行（い）くべきではなかった</b>（本來就不該去）。<br>▸ <b>用法</b>：<b>〜べき</b>接<b>辭書形</b>（不是た形）；「する」例外可用<b>すべき</b>（＝するべき）。「〜のせいだ」用於歸咎負面結果；正面結果則說「〜のおかげだ」（多虧）。<br>▸ <b>比較</b>：<b>〜べきだった</b>（本該做・帶責任感）／<b>〜ばよかった</b>（要是做了就好・單純後悔）／<b>〜たらよかった</b>（同義）。另：<b>せい</b>（怪罪・負面）／<b>おかげ</b>（感謝・正面）。<br><span class=\"n4\">N4 必考：〜べきだ 的接續、せい／おかげ 的褒貶</span>"],["B","ねえ、君自身を責める必要はないよ。君のせいではないよ。","Nē, kimi jishin wo semeru hitsuyō wa nai yo. Kimi no sei de wa nai yo.","嘿，你不必自責。這不是你的錯。","▸ <b>句型</b>：【〜を責める】＋【〜必要はない】＋【〜ではない】。<br>▸ <b>變化</b>：責（せ）める → 責める<b>必要（ひつよう）はない</b>（辭書形＋必要はない＝沒必要）。<br>▸ <b>用法</b>：「君自身（きみじしん）」＝你自己（自身表強調）；「〜のせいではない」否定歸責。<br>▸ <b>比較</b>：〜必要（ひつよう）はない（沒必要）／〜ことはない（不必・也用於安慰）／〜なくてもいい（不做也可以）。<br><span class=\"n4\">N4 必考：〜必要はない／〜ことはない</span>"],["A","いや、そうだよ。僕のせいさ。","Iya, sō da yo. Boku no sei sa.","不，就是。是我的錯。","▸ <b>句型</b>：【いや】否定對方＋【そうだよ】＋【〜さ】男性語氣。<br>▸ <b>變化</b>：そうだ（就是那樣）；僕（ぼく）のせい＋さ（男性斷定）。<br>▸ <b>用法</b>：否定對方的安慰、堅持自己的看法；「そうだよ」在此＝「就是（我的錯）」。<br>▸ <b>比較</b>：いや（否定・男性常用）／ううん（否定・柔和）／でも（但是・轉折）。<br><span class=\"n4\">N4 聽解必考：否定應答詞的語體</span>"]]}]},"18":{"title":"聊天（天氣）","jp_title":"天気について話す","theme":"閒聊、閒談、天氣話題","scenes":[{"name":"變冷","lines":[["A","きょうは冷えてきたね。","Kyō wa hiete kita ne.","今天變得好冷喔。","▸ <b>句型</b>：【て形＋くる】變化的推移＋【ね】。<br>▸ <b>變化</b>：冷（ひ）える → 冷えて＋<b>きた</b>（て形＋くる的過去）＝變得越來越冷（朝現在推移）。<br>▸ <b>用法</b>：<b>〜てくる</b>表變化從過去持續到現在；<b>〜ていく</b>則是從現在往未來。<br>▸ <b>比較</b>：冷（ひ）えてきた（越來越冷・到現在）／冷えていく（會越來越冷・往未來）／冷えた（變冷了）。<br><span class=\"n4\">N4 必考：〜てくる／〜ていく 的時間方向</span>"],["B","うん。午後は雨かもしれないね。","Un. Gogo wa ame kamoshirenai ne.","嗯，下午可能會下雨。","▸ <b>句型</b>：【名詞＋かもしれない】低度推測。<br>▸ <b>變化</b>：雨（あめ）だ → 雨<b>かもしれない</b>（名詞後<b>不加だ</b>直接接かもしれない）。<br>▸ <b>用法</b>：「かもしれない」表可能性約50%以下；「午後（ごご）は」用は提示時間話題。<br>▸ <b>比較</b>：かもしれない（也許・30〜50%）／でしょう（大概・70%）／にちがいない（一定・90%以上）。<br><span class=\"n4\">N4 必考：かもしれない 的接續（名詞・な形容詞直接接）</span>"],["A","そうでないといいだけど。","Sō de nai to ii dakedo.","希望不要。","▸ <b>句型</b>：【そうでない】否定＋【と＋いい】期望。<br>▸ <b>變化</b>：そうだ → そう<b>でない</b>（否定）＋と＋いい＝要是不那樣就好了。<br>▸ <b>用法</b>：「〜といい」用於自己無法控制的事（天氣）；句尾「だけど」留白，語氣含蓄。<br>▸ <b>比較</b>：そうでないといい（希望不會那樣）／そうならないといい（希望不要變成那樣）。兩者皆可。<br><span class=\"n4\">N4 必考：〜といい 的期望用法</span>"]]},{"name":"很冷","lines":[["A","いやー、きょうは寒いね。","Iyā, kyō wa samui ne.","真討厭，今天好冷。","▸ <b>句型</b>：【感嘆詞】＋【い形容詞＋ね】。<br>▸ <b>變化</b>：寒（さむ）い（い形容詞）＋ね（共感）。<br>▸ <b>用法</b>：「いやー」表厭煩、感慨（拉長音）；天氣寒暄<b>必加ね</b>來邀請共鳴。<br>▸ <b>比較</b>：寒（さむ）い（氣溫冷）／冷（つめ）たい（物體冰涼・觸感）。<b>天氣只能用寒い</b>，這是常考陷阱。<br><span class=\"n4\">N4 必考：寒い／冷たい 的區別</span>"],["B","うん、それに風も強いよ。","Un, sore ni kaze mo tsuyoi yo.","是啊，而且風好大。","▸ <b>句型</b>：【それに】追加＋【も】＋【い形容詞＋よ】。<br>▸ <b>變化</b>：強（つよ）い ＋ よ（告知）。<br>▸ <b>用法</b>：「それに」追加<b>同方向</b>的資訊（而且）；「風（かぜ）も」的も表「也」。<br>▸ <b>比較</b>：それに（而且・追加）／それで（於是・結果）／それから（然後・時間順序）。<br><span class=\"n4\">N4 必考：それに／それで／それから 的區別</span>"],["A","今晩は雪かもしれない。","Konban wa yuki kamoshirenai.","今天晚上可能會下雪。","▸ <b>句型</b>：【名詞＋かもしれない】。<br>▸ <b>變化</b>：雪（ゆき）だ → 雪かもしれない（名詞直接接，<b>不加だ</b>）。<br>▸ <b>用法</b>：「今晩（こんばん）は」用は提示時間；名詞句的推測不需動詞。<br>▸ <b>比較</b>：雪（ゆき）かもしれない（可能會下雪）／雪が降（ふ）るかもしれない（同義，較完整）。日語常省略動詞。<br><span class=\"n4\">N4 必考：名詞＋かもしれない（無だ）</span>"]]},{"name":"變暖","lines":[["A","やあ。きょうは暖かいね。","Yaa. Kyō wa atatakai ne.","嗨，今天還蠻暖和的嘛！","▸ <b>句型</b>：【い形容詞＋ね】天氣寒暄。<br>▸ <b>變化</b>：暖（あたた）かい（い形容詞）＋ね。<br>▸ <b>用法</b>：天氣是日語寒暄的核心話題，句尾ね不可省略（否則像自言自語）。<br>▸ <b>比較</b>：暖（あたた）かい（天氣暖・舒適）／熱（あつ）い（物體燙）／暑（あつ）い（天氣熱・不適）。<b>暖／熱／暑</b>三者對象不同。<br><span class=\"n4\">N4 必考：暖かい／暑い／熱い 的區別</span>"],["B","そうだね。冬が終わったみたいだ。","Sō da ne. Fuyu ga owatta mitai da.","是啊，看來冬天已經過去了。","▸ <b>句型</b>：【そうだね】＋【〜みたいだ】口語推測。<br>▸ <b>變化</b>：終（お）わる → 終わった＋<b>みたいだ</b>（普通形＋みたい＝看樣子）。<br>▸ <b>用法</b>：<b>みたい</b>是「よう」的口語形，根據眼前狀況判斷；接名詞時用「〜みたいな」。<br>▸ <b>比較</b>：みたいだ（口語推測）／ようだ（書面・客觀推測）／らしい（傳聞性推測）。<br><span class=\"n4\">N4 必考：みたい／よう／らしい 的語體與根據</span>"],["A","よかったね。","Yokatta ne.","太好了。","▸ <b>句型</b>：【いい的過去＋ね】表欣慰。<br>▸ <b>變化</b>：いい → <b>よかった</b>（不規則過去式）＋ね。<br>▸ <b>用法</b>：對好事表示欣慰；也可對他人的好消息說「よかったですね」。<br>▸ <b>比較</b>：よかった（真好・過去式）／いいね（不錯耶・現在）／よさそう（看起來不錯）。<br><span class=\"n4\">N4 必考：いい 的活用（よかった／よくない／よさそう）</span>"]]},{"name":"天氣預報","lines":[["A","このすばらしい天気を見て！テレビでは雨が降るって言ってたのに。","Kono subarashii tenki wo mite! Terebi de wa ame ga furu tte itteta no ni.","你看，今天天氣真好！電視卻說會下雨。","▸ <b>句型</b>：【て形命令】＋【〜って】口語引用＋【〜ていた】＋【のに】埋怨。<br>▸ <b>變化</b>：言（い）っていた → <b>言ってた</b>（い脫落）；と → <b>って</b>（口語引用助詞）。<br>▸ <b>用法</b>：「見（み）て！」是て形當命令（口語）；<b>のに</b>放句尾表與預期相反的不滿。<br>▸ <b>比較</b>：〜って言（い）ってた（口語引用）／〜と言っていた（一般）／〜とのことです（正式・轉述）。<br><span class=\"n4\">N4 必考：って ＝ と（口語引用）</span>"],["B","天気予報が信じられないんでしょう？","Tenki yohō ga shinjirarenai n deshō?","氣象報導能相信嗎？","▸ <b>句型</b>：【可能形否定】＋【んでしょう？】反問。<br>▸ <b>變化</b>：信（しん）じる → 信じられる → 信じられ<b>ない</b> ＋ んでしょう（＝のでしょう，反問）。<br>▸ <b>用法</b>：「〜んでしょう？」用來反問、確認對方是否同意自己的判斷。「天気予報（てんきよほう）」＝氣象預報。<br>▸ <b>比較</b>：信（しん）じられない（無法相信・可能形否定）／信じない（不相信・意志）。<b>可能形表能力，不是意志</b>。<br><span class=\"n4\">N4 必考：可能形否定 vs 意志否定</span>"],["A","うん、よくはずれるんだ。","Un, yoku hazureru n da.","嗯，它們經常預測錯誤。","▸ <b>句型</b>：【副詞よく】＋【自動詞】＋【んだ】說明。<br>▸ <b>變化</b>：はずれる（自動詞・落空）→ はずれる＋んだ。<br>▸ <b>用法</b>：「よく」＝經常（也可表「好好地」，靠語境判斷）；「はずれる」的主語是預報。<br>▸ <b>比較</b>：はずれる（落空・自動詞）／はずす（取下・弄錯・他動詞）／当（あ）たる（命中・猜中）。<br><span class=\"n4\">N4 必考：当たる／はずれる 的對應</span>"]]},{"name":"好天氣","lines":[["A","すばらしい日だね。","Subarashii hi da ne.","今天天氣真不錯！","▸ <b>句型</b>：【い形容詞＋名詞＋だね】。<br>▸ <b>變化</b>：すばらしい日（ひ）<b>だ</b>＋ね（名詞句常體<b>要加だ</b>）。<br>▸ <b>用法</b>：い形容詞直接修飾名詞（不加の）；天氣寒暄的定型句。<br>▸ <b>比較</b>：すばらしい日（ひ）だね（○）／すばらしい日ね（女性語體可）／すばらしいの日（× 不可加の）。<br><span class=\"n4\">N4 必考：い形容詞修飾名詞不加の</span>"],["B","うん、よく晴れてる。","Un, yoku hareteru.","嗯，天氣相當晴朗。","▸ <b>句型</b>：【副詞よく】＋【〜ている的縮約】。<br>▸ <b>變化</b>：晴（は）れる → 晴れて＋いる → <b>晴れてる</b>（い脫落）。<br>▸ <b>用法</b>：「晴（は）れている」表<b>目前的狀態</b>（自動詞＋ている）；「よく」在此＝相當、充分。<br>▸ <b>比較</b>：晴（は）れている（晴朗・狀態）／晴れた（放晴了・變化完成）／晴れる（會放晴・未來）。<br><span class=\"n4\">N4 必考：自動詞＋ている 表狀態</span>"],["A","こんないい日がしばらく続いてほしいな。","Konna ii hi ga shibaraku tsuzuite hoshii na.","真希望這種好天氣能持續久一點。","▸ <b>句型</b>：【こんな＋名詞】＋【〜てほしい】希望＋【な】。<br>▸ <b>變化</b>：続（つづ）く → 続いて＋<b>ほしい</b>（希望某事持續）。<br>▸ <b>用法</b>：「〜てほしい」原則上用於希望他人做，但也可用於<b>希望非人為的事態</b>發生；「しばらく」＝一段時間。<br>▸ <b>比較</b>：続（つづ）いてほしい（希望持續）／続くといい（要是持續就好・更委婉）／続（つづ）けたい（我想繼續・自己做）。<br><span class=\"n4\">N4 必考：〜てほしい 的適用範圍</span>"]]},{"name":"炎熱","lines":[["A","やあ、なんて暑い日なんだろう。","Yaa, nante atsui hi nan darō.","哇！熱死了！","▸ <b>句型</b>：【なんて＋形容詞＋名詞＋なんだろう】感嘆。<br>▸ <b>變化</b>：暑（あつ）い日（ひ）だ → なんて暑い日<b>なんだろう</b>（＝なのだろう）。<br>▸ <b>用法</b>：感嘆句型「なんて〜なんだろう」＝多麼…啊；中間放<b>形容詞＋名詞</b>。<br>▸ <b>比較</b>：なんて暑（あつ）いんだろう（多熱啊・形容詞）／なんて暑い日（ひ）なんだろう（多熱的一天・名詞）。<br><span class=\"n4\">N4 必考：なんて〜だろう 的感嘆句型</span>"],["B","うん、たえられないよ。","Un, taerarenai yo.","是啊，真受不了。","▸ <b>句型</b>：【可能形否定＋よ】。<br>▸ <b>變化</b>：たえる → 可能形 たえられる → <b>たえられない</b>（受不了）。<br>▸ <b>用法</b>：「たえられない」＝無法忍受；可能形否定常用來表達「受不了」的抱怨。<br>▸ <b>比較</b>：たえられない（受不了）／がまんできない（忍不住）／もうだめだ（不行了）。<br><span class=\"n4\">N4 必考：二類動詞可能形（たえる→たえられる）</span>"],["A","異常だね。","Ijō da ne.","好奇怪啊！","▸ <b>句型</b>：【な形容詞＋だね】。<br>▸ <b>變化</b>：異常（いじょう）だ（な形容詞）＋ね。<br>▸ <b>用法</b>：「異常（いじょう）」是な形容詞也是名詞（異常な天気（てんき）／異常が見（み）つかる）。<br>▸ <b>比較</b>：異常（いじょう）だ（異常・な形容詞）／おかしい（奇怪・い形容詞）／変（へん）だ（怪・な形容詞）。<br><span class=\"n4\">N4 必考：形容詞的詞類判別</span>"]]},{"name":"梅雨","lines":[["A","なんて長い梅雨なんだろう。","Nante nagai tsuyu nan darō.","好長的梅雨季啊！","▸ <b>句型</b>：【なんて＋い形容詞＋名詞＋なんだろう】感嘆。<br>▸ <b>變化</b>：長（なが）い梅雨（つゆ）だ → なんて長い梅雨なんだろう。<br>▸ <b>用法</b>：用感嘆句表抱怨；「梅雨（つゆ）」是日本六月的雨季，屬文化詞彙。<br>▸ <b>比較</b>：梅雨（つゆ）（雨季）／長雨（ながあめ）（連續的雨）／大雨（おおあめ）（大雨）。<br><span class=\"n4\">N4 必考：梅雨 的特殊讀音（つゆ）</span>"],["B","まったくだね。新記録にちがいないよ。","Mattaku da ne. Shinkiroku ni chigainai yo.","不是嗎？一定會創下新記錄。","▸ <b>句型</b>：【まったくだ】強烈同意 ＋【〜にちがいない】高度確信的推測。<br>▸ <b>逐詞拆解</b>：<b>まったくだね</b>＝まったく（完全）＋だ＋ね＝「說得太對了」；<b>新記録（しんきろく）</b>（名詞）＋<b>に</b>＋<b>ちがいない</b>（違（ちが）いない＝沒有錯）→ 合起來＝「一定是新紀錄」。<br>▸ <b>句型公式</b>：<b>［普通形］＋にちがいない</b>＝一定是…。名詞・な形容詞<b>直接接</b>（不加だ）：<b>新記録（しんきろく）にちがいない／便利（べんり）にちがいない</b>。例：<b>彼（かれ）は知（し）っているにちがいない</b>（他一定知道）／<b>忘（わす）れたにちがいない</b>（一定是忘了）。<br>▸ <b>用法</b>：「にちがいない」表<b>說話者根據某依據做出的強烈斷定</b>（約90%以上），語氣比「でしょう」肯定得多，但仍是主觀推測（不是客觀事實）。<br>▸ <b>比較</b>：確信度階梯：<b>かもしれない</b>（30%）＜ <b>でしょう／だろう</b>（70%）＜ <b>はずだ</b>（有根據・80%）＜ <b>にちがいない</b>（90%）＜ 斷定形。書面則用<b>に相違（そうい）ない</b>。<br><span class=\"n4\">N4 必考：推測表現的確信度階梯與接續</span>"],["A","うん、天気予報によると20年ぶりだって。","Un, tenki yohō ni yoru to nijū-nen buri datte.","是啊！氣象預報說，這是二十年來最長的一次。","▸ <b>句型</b>：【〜によると】資訊來源＋【〜ぶり】＋【だって】傳聞。<br>▸ <b>變化</b>：20年（ねん）＋<b>ぶり</b>（相隔20年）；だそうだ → <b>だって</b>（口語傳聞）。<br>▸ <b>用法</b>：「〜によると」必與傳聞表現（そうだ・らしい・だって）呼應；「〜ぶり」表相隔的時間。<br>▸ <b>比較</b>：20年（ねん）ぶり（相隔20年）／20年間（ねんかん）（20年之間）／20年前（ねんまえ）（20年前）。<br><span class=\"n4\">N4 必考：〜によると〜そうだ 的呼應</span>"]]},{"name":"帶傘","lines":[["A","きょう雨が降るってテレビで聞いたよ。","Kyō ame ga furu tte terebi de kiita yo.","電視上說今天可能會下雨。","▸ <b>句型</b>：【〜って】口語引用＋【〜で聞いた】。<br>▸ <b>變化</b>：と聞（き）いた → <b>って聞いた</b>（口語）。<br>▸ <b>用法</b>：「テレビ<b>で</b>」表資訊來源的媒介（で＝透過）；引用內容用って（＝と）。<br>▸ <b>比較</b>：テレビで（透過電視・媒介）／テレビを見（み）る（看電視・對象）／テレビに出（で）る（上電視）。<br><span class=\"n4\">N4 必考：で 表媒介・手段</span>"],["B","ほんとう？雨が降るようにまったく思えないね。","Hontō? Ame ga furu yō ni mattaku omoenai ne.","真的？看起來不像會下雨啊。","▸ <b>句型</b>：【〜ように思える】＋【まったく＋否定】。<br>▸ <b>變化</b>：思（おも）える（思う的可能形）→ <b>思えない</b>（否定）；「降（ふ）るように思えない」＝不覺得會下。<br>▸ <b>用法</b>：<b>まったく</b>必與否定呼應，表完全否定；「〜ように思（おも）える」＝覺得好像…。<br>▸ <b>比較</b>：まったく〜ない（完全不）／ぜんぜん〜ない（一點也不）／あまり〜ない（不太）。<br><span class=\"n4\">N4 必考：呼應副詞與否定</span>"],["A","でも、カサを持って行きなさい。転ばぬ先の杖だよ。","Demo, kasa wo motte ikinasai. Korobanu saki no tsue da yo.","不過，還是帶著雨傘吧！未雨綢繆。","▸ <b>句型</b>：【て形＋行く】＋【なさい】溫和命令＋【諺語】。<br>▸ <b>變化</b>：持（も）つ → 持って＋<b>行（い）きなさい</b>（帶去＋なさい命令）。<br>▸ <b>用法</b>：「持（も）って行（い）く」＝帶（物品）去；「転（ころ）ばぬ先（さき）の杖（つえ）」是諺語＝未雨綢繆（跌倒前先備好拐杖）。<br>▸ <b>比較</b>：持（も）って行（い）く（帶去）／持って来（く）る（帶來）／連（つ）れて行く（帶人去）。<br><span class=\"n4\">N4 必考：持って行く／連れて行く 的對象區別</span>"]]}]},"19":{"title":"關於時間及日期的談話","jp_title":"時間や日時について話す","theme":"時間、日期、時刻相關對話","scenes":[{"name":"問時間（1）","lines":[["A","すみませんが。今何時でしょうか？","Sumimasen ga. Ima nanji deshō ka?","對不起，請問現在幾點？","▸ <b>句型</b>：【すみませんが】＋【何時＋でしょうか】委婉疑問。<br>▸ <b>變化</b>：何時（なんじ）ですか → 何時<b>でしょうか</b>（更客氣）。<br>▸ <b>用法</b>：向陌生人問時間用「でしょうか」最得體；「今（いま）」放句首。<br>▸ <b>比較</b>：今（いま）何時（なんじ）でしょうか（最禮貌）／今何時ですか（一般）／今何時？（常體）。<br><span class=\"n4\">N4 必考：でしょうか 的禮貌功能</span>"],["B","2時30分です。","Ni-ji sanjuppun desu.","現在2點半。","▸ <b>句型</b>：【時刻的名詞句】。<br>▸ <b>變化</b>：2時30分＝<b>にじさんじゅっぷん</b>（也可說「2時半（にじはん）」）。<br>▸ <b>用法</b>：時刻的「分（ふん）」有音變：1分（いっぷん）・3分（さんぷん）・10分（じゅっぷん）。<br>▸ <b>比較</b>：2時30分（正式）／2時半（にじはん）（口語・半點）。<b>半（はん）</b>只能用於30分。<br><span class=\"n4\">N4 必考：時刻的讀音與音變</span>"]]},{"name":"問時間（2）","lines":[["A","すみませんが、時間を教えていただけますでしょうか。","Sumimasen ga, jikan wo oshiete itadakemasu deshō ka.","對不起，可以告訴我時間嗎？","▸ <b>句型</b>：【〜ていただけますでしょうか】疊加敬語。<br>▸ <b>變化</b>：教（おし）えてもらう → 教えていただく → いただけます → ＋<b>でしょうか</b>（雙重客氣）。<br>▸ <b>用法</b>：這是敬語的<b>最高疊加形式</b>，商務場合常見；語法上略嫌冗長但廣泛使用。<br>▸ <b>比較</b>：いただけますか（客氣）／いただけますでしょうか（最客氣）／いただけませんか（也很客氣）。<br><span class=\"n4\">N4 讀解會出現疊加敬語</span>"],["B","1時20分です。","Ichi-ji nijuppun desu.","1點20分。","▸ <b>句型</b>：【時刻的名詞句】。<br>▸ <b>變化</b>：1時20分＝<b>いちじにじゅっぷん</b>。<br>▸ <b>用法</b>：回答時間只說時刻即可，不需完整句子。<br>▸ <b>比較</b>：1時（いちじ）／4時（<b>よじ</b>，不是しじ）／7時（<b>しちじ</b>）／9時（<b>くじ</b>）。這些是特殊讀音。<br><span class=\"n4\">N4 必考：4時・7時・9時 的特殊讀音</span>"]]},{"name":"問時間（3）","lines":[["A","おじゃまして申しわけありませんが、何時だか教えていただきますか？","Ojama shite mōshiwake arimasen ga, nanji da ka oshiete itadakimasu ka?","抱歉打擾您一下，您能告訴我現在幾點嗎？","▸ <b>句型</b>：【て形＋申しわけありません】＋【疑問詞＋だか】間接疑問。<br>▸ <b>變化</b>：おじゃまする → おじゃまし<b>て</b>（て形表原因）；何時（なんじ）<b>だか</b>＝何時であるか（嵌入的疑問子句）。<br>▸ <b>用法</b>：「おじゃまして申（もう）しわけありませんが」是打擾別人前的鄭重致歉。<br>▸ <b>比較</b>：〜だか（間接疑問・略口語）／〜かどうか（是否）／〜か（疑問詞＋か）。<br><span class=\"n4\">N4 必考：間接疑問句的形式</span>"],["B","いいですよ。11時50分です。","Ii desu yo. Jūichi-ji gojuppun desu.","沒問題，現在11點50分。","▸ <b>句型</b>：【いいですよ】答應＋【時刻】。<br>▸ <b>變化</b>：11時50分＝<b>じゅういちじごじゅっぷん</b>。<br>▸ <b>用法</b>：先爽快答應再提供資訊，比直接說時間更有禮貌。<br>▸ <b>比較</b>：いいですよ（可以啊）／はい（是）／どうぞ（請）。<br><span class=\"n4\">N4 必考：時刻的完整讀法</span>"]]},{"name":"對錶（1）","lines":[["A","時計を合わせたいのですが。正確な時間は何時でしょうか？","Tokei wo awasetai no desu ga. Seikaku na jikan wa nanji deshō ka?","我想調整我的手錶，現在應該是幾點幾分？","▸ <b>句型</b>：【〜たいのですが】留白＋【な形容詞＋名詞】＋【でしょうか】。<br>▸ <b>變化</b>：合（あ）わせる → 合わせ<b>たい</b>＋のですが；正確（せいかく）だ → <b>正確な</b>時間（じかん）（な形容詞修飾名詞）。<br>▸ <b>用法</b>：先說明目的（想對錶）再提問，讓對方理解問題背景。<br>▸ <b>比較</b>：合（あ）わせる（他動詞・對準）／合う（自動詞・相合）。時計（とけい）を合わせる／サイズが合う。<br><span class=\"n4\">N4 必考：合う／合わせる 的自他配對</span>"],["B","ちょうど4時25分です。","Chōdo yo-ji nijūgo-fun desu.","剛好4點25分。","▸ <b>句型</b>：【副詞ちょうど】＋【時刻】。<br>▸ <b>變化</b>：ちょうど（副詞・正好）＋4時25分（<b>よじにじゅうごふん</b>）。<br>▸ <b>用法</b>：「ちょうど」表正好、剛好；也可說「ちょうど今（いま）」（正好現在）。<br>▸ <b>比較</b>：ちょうど（正好）／だいたい（大約）／〜ごろ（左右・接時間點）。<br><span class=\"n4\">N4 必考：25分 讀作「にじゅうごふん」（不是ぷん）</span>"]]},{"name":"對錶（2）","lines":[["A","あなたの腕時計は2時30分ですか？","Anata no udedokei wa ni-ji sanjuppun desu ka?","你的手錶是2點30分嗎？","▸ <b>句型</b>：【AのB＋は＋時刻＋ですか】。<br>▸ <b>變化</b>：腕時計（うでどけい）（名詞）＋は＋2時30分＋ですか。<br>▸ <b>用法</b>：以名詞句直接確認錶上的時間，不需說「〜を指（さ）しています」。<br>▸ <b>比較</b>：腕時計（うでどけい）（手錶）／時計（とけい）（鐘・錶）／目覚（めざ）まし時計（鬧鐘）。<br><span class=\"n4\">N4 會考複合名詞的構成</span>"],["B","いいえ、2時27分です。","Iie, ni-ji nijūnana-fun desu.","不是，我的是2點27分。","▸ <b>句型</b>：【いいえ】否定＋【時刻】。<br>▸ <b>變化</b>：2時27分＝<b>にじにじゅうななふん</b>。<br>▸ <b>用法</b>：否定後立刻提供正確資訊；口語常省略主語（私（わたし）の腕時計（うでどけい）は）。<br>▸ <b>比較</b>：27分（にじゅうななふん）／7分（<b>ななふん</b>）／8分（<b>はっぷん</b>）。<br><span class=\"n4\">N4 必考：分 的音變規則</span>"],["A","あの時計によると、あなたのは正しいですね。私のは進んでいるに違いありません。","Ano tokei ni yoru to, anata no wa tadashii desu ne. Watashi no wa susunde iru ni chigai arimasen.","根據那個時鐘的時間，你的錶才是對的，我的太快了。","▸ <b>句型</b>：【〜によると】根據＋【の代稱】＋【〜ている＋にちがいない】。<br>▸ <b>變化</b>：進（すす）む → 進んで＋いる（狀態）＋<b>にちがいありません</b>（＝にちがいない的丁寧形）。<br>▸ <b>用法</b>：「あなた<b>の</b>」的の<b>代替已知名詞</b>（＝你的錶）；「進（すす）んでいる」＝走得快。「正（ただ）しい」＝正確的。<br>▸ <b>比較</b>：進（すす）んでいる（快・錶）／遅（おく）れている（慢・錶）／止（と）まっている（停了）。<br><span class=\"n4\">N4 必考：の 的代稱功能（＝もの）</span>"]]},{"name":"手錶變慢","lines":[["A","この2、3日で私の腕時計は遅れています。","Kono ni-san-nichi de watashi no udedokei wa okurete imasu.","這2、3天我的手錶變慢了。","▸ <b>句型</b>：【期間＋で】範圍＋【〜ている】狀態。<br>▸ <b>變化</b>：遅（おく）れる → 遅れて＋います（持續的狀態）。<br>▸ <b>用法</b>：「この2、3日（にさんにち）<b>で</b>」＝在這兩三天內（で表期間範圍）；錶慢用「遅（おく）れている」。<br>▸ <b>比較</b>：2、3日（にさんにち）で（在兩三天內・範圍）／2、3日前（まえ）（兩三天前）／2、3日間（かん）（兩三天期間）。<br><span class=\"n4\">N4 必考：で 表期間範圍</span>"],["B","たぶん電池を替えた方がいいでしょう。","Tabun denchi wo kaeta hō ga ii deshō.","也許該換電池了。","▸ <b>句型</b>：【たぶん】＋【〜た方がいい】建議＋【でしょう】。<br>▸ <b>變化</b>：替（か）える → 替え<b>た</b>＋方（ほう）がいい（た形＋方がいい）。<br>▸ <b>用法</b>：<b>たぶん</b>與<b>でしょう</b>呼應；「〜た方（ほう）がいいでしょう」是最委婉的建議形式。「電池（でんち）」＝電池。<br>▸ <b>比較</b>：替（か）える（更換・他動詞）／変（か）わる（改變・自動詞）／取（と）り替（か）える（替換掉）。<br><span class=\"n4\">N4 必考：〜た方がいい 的接續（た形）</span>"],["A","そうですね。","Sō desu ne.","好主意。","▸ <b>句型</b>：【そうですね】接受建議。<br>▸ <b>變化</b>：そうです＋ね。<br>▸ <b>用法</b>：接受對方建議時的緩衝回應，也可表「我想想」（拉長音時）。<br>▸ <b>比較</b>：そうですね（同意・或思考）／そうします（我就這麼做）／考（かんが）えてみます（我考慮看看）。<br><span class=\"n4\">N4 聽解必考：そうですね 的雙重功能</span>"]]},{"name":"約兜風","lines":[["A","日曜日にドライブに行かない？","Nichiyōbi ni doraibu ni ikanai?","禮拜天要不要去兜風？","▸ <b>句型</b>：【日期＋に】＋【〜に行かない？】否定疑問邀約。<br>▸ <b>變化</b>：行（い）く → 行か<b>ない</b>？（否定疑問＝邀約）。<br>▸ <b>用法</b>：星期用<b>に</b>（日曜日（にちようび）に）；「ドライブに行（い）く」＝去兜風（に表目的）。<br>▸ <b>比較</b>：行（い）かない？（邀約・留餘地）／行こう（走吧・較強勢）／行きませんか（丁寧邀約）。<br><span class=\"n4\">N4 必考：星期・日期加に</span>"],["B","それはいいね。何時に出ようか？","Sore wa ii ne. Nanji ni deyō ka?","好主意，什麼時候出發？","▸ <b>句型</b>：【それはいいね】贊同＋【意向形＋か】商量。<br>▸ <b>變化</b>：出（で）る → 意向形<b>出よう</b>＋か＝我們幾點出發好呢。<br>▸ <b>用法</b>：「〜（よ）うか」用來<b>與對方商量</b>，比直接說「出（で）よう」更有商量意味。<br>▸ <b>比較</b>：出（で）ようか（商量）／出よう（決定）／出ましょうか（丁寧商量）。<br><span class=\"n4\">N4 必考：意向形＋か 的商量用法</span>"],["A","9時30分に行こう。","Ku-ji sanjuppun ni ikō.","那就約9點30分。","▸ <b>句型</b>：【時刻＋に】＋【意向形】決定。<br>▸ <b>變化</b>：行（い）く → 意向形<b>行こう</b>（一類動詞：く→こう）。<br>▸ <b>用法</b>：定下結論用意向形；時刻用に。<br>▸ <b>比較</b>：行（い）こう（走吧・常體）／行きましょう（丁寧）／行きます（我會去・陳述）。<br><span class=\"n4\">N4 必考：一類動詞的意向形（う段→お段＋う）</span>"]]},{"name":"約載機場","lines":[["A","空港まで乗せて行ってもらえますか？","Kūkō made nosete itte moraemasu ka?","你能載我去機場嗎？","▸ <b>句型</b>：【まで】終點＋【て形＋行く】＋【〜てもらえますか】。<br>▸ <b>變化</b>：乗（の）せる → 乗せて＋行（い）く → 乗せて行って＋<b>もらえますか</b>（もらう的可能形）。<br>▸ <b>用法</b>：「〜てもらえますか」是客氣的請求；乗（の）せて行（い）く＝載著去。<br>▸ <b>比較</b>：乗（の）せて行（い）く（載去）／乗せて来（く）る（載來）／送（おく）る（送・也可指開車送）。<br><span class=\"n4\">N4 必考：〜てもらえますか 的請求用法</span>"],["B","いいですよ。飛行機は何時に出ますか？","Ii desu yo. Hikōki wa nanji ni demasu ka?","可以啊，飛機什麼時候起飛？","▸ <b>句型</b>：【いいですよ】＋【何時に＋出ますか】。<br>▸ <b>變化</b>：出（で）る → 出ます → 出ますか。<br>▸ <b>用法</b>：「飛行機（ひこうき）が出（で）る」＝飛機起飛（出る也用於交通工具的發車）；時刻用に。<br>▸ <b>比較</b>：飛行機（ひこうき）が出（で）る（起飛）／飛行機に乗（の）る（搭飛機）／飛行機が着（つ）く（抵達）。<br><span class=\"n4\">N4 必考：出る 用於交通工具的發車</span>"],["A","10時45分です。","Jū-ji yonjūgo-fun desu.","10點45分。","▸ <b>句型</b>：【時刻的名詞句】。<br>▸ <b>變化</b>：10時45分＝<b>じゅうじよんじゅうごふん</b>。<br>▸ <b>用法</b>：回答時刻的簡潔形式。<br>▸ <b>比較</b>：45分（よんじゅうごふん）／15分（じゅうごふん）／30分（さんじゅっぷん）。<br><span class=\"n4\">N4 必考：分的讀音（ふん／ぷん 的分辨）</span>"]]},{"name":"問出發日","lines":[["A","東京へはいつ発つの？","Tōkyō e wa itsu tatsu no?","你什麼時候去東京？","▸ <b>句型</b>：【〜へは】對比＋【いつ＋動詞＋の？】。<br>▸ <b>變化</b>：東京（とうきょう）<b>へは</b>（へ＋は，強調對比）；発（た）つ ＋ の？（常體疑問）。<br>▸ <b>用法</b>：助詞へ・に・で 可與は疊加表對比（へは・には・では）。<br>▸ <b>比較</b>：東京（とうきょう）へは（至於東京・對比）／東京へ（往東京）。加は就有「其他地方不論」的意味。<br><span class=\"n4\">N4 必考：助詞＋は 的疊加</span>"],["B","8月2日に発つ予定です。","Hachi-gatsu futsuka ni tatsu yotei desu.","我打算8月2日走。","▸ <b>句型</b>：【日期＋に】＋【辭書形＋予定です】。<br>▸ <b>變化</b>：発（た）つ → 発つ<b>予定（よてい）です</b>（辭書形＋予定）。<br>▸ <b>用法</b>：具體日期用<b>に</b>（8月2日（はちがつふつか）に）；「予定（よてい）」表已安排的計畫。<br>▸ <b>比較</b>：発（た）つ予定（よてい）です（預定出發）／発つつもりです（打算出發）／発ちます（會出發）。<br><span class=\"n4\">N4 必考：予定／つもり 的客觀與主觀</span>"]]},{"name":"問生日","lines":[["A","春男、生年月日はいつなの？","Haruo, seinengappi wa itsu na no?","春男，你生日是什麼時候？","▸ <b>句型</b>：【疑問詞＋な＋の？】名詞句常體疑問。<br>▸ <b>變化</b>：いつですか → いつ<b>なの</b>？（名詞句的常體疑問要加<b>な</b>）。<br>▸ <b>用法</b>：名詞・な形容詞的常體疑問句是「〜なの？」（動詞・い形容詞則是「〜の？」）。「生年月日（せいねんげっぴ）」＝出生年月日。<br>▸ <b>比較</b>：いつなの？（名詞句）／行（い）くの？（動詞句）／高（たか）いの？（い形容詞句）。<b>只有名詞・な形容詞加な</b>。<br><span class=\"n4\">N4 必考：〜なの？ 的接續規則</span>"],["B","1965年2月10日だよ。","Sen-kyūhyaku-rokujūgo-nen ni-gatsu tōka da yo.","1965年2月10日。","▸ <b>句型</b>：【日期的名詞句＋だよ】。<br>▸ <b>變化</b>：1965年＝<b>せんきゅうひゃくろくじゅうごねん</b>；2月10日＝<b>にがつとおか</b>。<br>▸ <b>用法</b>：年月日的順序與中文相同（年→月→日）；<b>10日讀作とおか</b>（特殊讀音）。<br>▸ <b>比較</b>：1日（ついたち）／2日（ふつか）／10日（とおか）／14日（じゅうよっか）／20日（はつか）。<br><span class=\"n4\">N4 必考：日期的特殊讀音</span>"]]}]},"20":{"title":"問路","jp_title":"道をたずねる","theme":"詢問方向、路線、地點","scenes":[{"name":"問路（公園）","lines":[["A","すみません。上野公園への道を教えてくださいますか？","Sumimasen. Ueno kōen e no michi wo oshiete kudasaimasu ka?","對不起。能不能告訴我怎麼去上野公園？","▸ <b>句型</b>：【〜への】修飾名詞＋【〜てくださいますか】尊敬語請求。<br>▸ <b>變化</b>：教（おし）える → 教えて＋<b>くださいます</b>（尊敬語）＋か。<br>▸ <b>用法</b>：「上野公園（うえのこうえん）<b>への</b>道（みち）」——<b>へ＋の</b>可以修飾名詞（に不行：×にの道）。<br>▸ <b>比較</b>：〜てくださいますか（尊敬・對方為我做）／〜ていただけますか（謙讓・我請對方做）。兩者皆客氣，<b>視點不同</b>。<br><span class=\"n4\">N4 必考：くださる（尊敬）／いただく（謙讓）的視點</span>"],["B","もちろんです。あと3ブロックまっすぐ行ってください。","Mochiron desu. Ato san-burokku massugu itte kudasai.","當然可以。再繼續一直走三條街就到了。","▸ <b>句型</b>：【あと＋數量】＋【て形＋ください】。<br>▸ <b>變化</b>：行（い）く → 行って（例外變化）＋ください。<br>▸ <b>用法</b>：「あと3ブロック」＝還要3個街區（あと＋數量＝還剩）；「まっすぐ」是副詞。<br>▸ <b>比較</b>：あと3ブロック（還有3個街區）／3ブロック先（さき）（3個街區前方）／3ブロック目（め）（第3個街區）。<br><span class=\"n4\">N4 必考：あと／〜先／〜目 的區別</span>"]]},{"name":"問洗手間","lines":[["A","お手洗いはどちらか教えていただけますか？","Otearai wa dochira ka oshiete itadakemasu ka?","能不能告訴我洗手間在哪裡？","▸ <b>句型</b>：【美化語お】＋【疑問詞＋か】＋【〜ていただけますか】。<br>▸ <b>變化</b>：手洗（てあら）い → <b>お</b>手洗い（美化語）；どこ → どちら（禮貌）。<br>▸ <b>用法</b>：「お手洗（てあら）い」是廁所最有禮貌的說法；「どちらか」是嵌入的疑問子句。<br>▸ <b>比較</b>：お手洗（てあら）い（最禮貌）／トイレ（一般）／便所（べんじょ）（粗俗，不宜用）。<br><span class=\"n4\">N4 必考：美化語「お」的用法</span>"],["B","はい。この廊下をまっすぐ行って。エスカレーターのすぐ手前の左手にあります。","Hai. Kono rōka wo massugu itte. Esukarētā no sugu temae no hidarite ni arimasu.","好。從這走廊直走，就在電扶梯前面的左邊。","▸ <b>句型</b>：【〜を】通過路徑＋【て形指示】＋【位置名詞＋にあります】。<br>▸ <b>變化</b>：行（い）く → 行って（て形，此處當簡略指示用）。<br>▸ <b>用法</b>：「この廊下（ろうか）<b>を</b>行（い）く」——<b>を</b>表通過的路徑（不是受詞）；「手前（てまえ）」＝靠自己這側，「左手（ひだりて）」＝左邊。<br>▸ <b>比較</b>：廊下（ろうか）を行（い）く（沿走廊走・路徑）／廊下で待（ま）つ（在走廊等・場所）。<b>を vs で</b>。<br><span class=\"n4\">N4 必考：を 表通過的場所（歩く・渡る・曲がる）</span>"]]},{"name":"問公車站","lines":[["A","バス停を探しているのですが。","Basu-tei wo sagashite iru no desu ga.","我在找公車站牌。","▸ <b>句型</b>：【〜ている】進行＋【のですが】留白。<br>▸ <b>變化</b>：探（さが）す → 探して＋いる ＋ のですが（說明後留白）。<br>▸ <b>用法</b>：只陳述自己的狀況，<b>不直接提出請求</b>，讓對方主動幫忙——非常日式的溝通方式。「バス停（てい）」＝公車站。<br>▸ <b>比較</b>：探（さが）しているのですが（留白・委婉）／教（おし）えてください（直接請求）。前者更禮貌。<br><span class=\"n4\">N4 必考：〜のですが 的留白功能</span>"],["B","ああ、それは簡単です。通りの向こう側です。西口から出なさい。あそこの出口です。","Ā, sore wa kantan desu. Tōri no mukōgawa desu. Nishiguchi kara denasai. Asoko no deguchi desu.","喔！那很簡單。就在街的對面。從西側出口出去吧！就在出口的地方。","▸ <b>句型</b>：【位置名詞】＋【〜から】起點＋【なさい】溫和命令。<br>▸ <b>變化</b>：出（で）る → 出<b>なさい</b>（ます形去ます＋なさい）。<br>▸ <b>用法</b>：「向（む）こう側（がわ）」＝對面；「西口（にしぐち）<b>から</b>出（で）る」離開的起點用から（也可用を）。<br>▸ <b>比較</b>：西口（にしぐち）から出（で）る（從西口出去）／西口を出る（出西口）。兩者皆可，<b>から強調起點</b>。<br><span class=\"n4\">N4 必考：なさい 的命令形（略帶上位者語氣）</span>"]]},{"name":"問計程車","lines":[["A","どこでタクシーに乗れるか知っていますか？","Doko de takushī ni noreru ka shitte imasu ka?","你知道在哪裡可以搭得到計程車嗎？","▸ <b>句型</b>：【疑問詞＋で】＋【可能形＋か】間接疑問＋【知っていますか】。<br>▸ <b>變化</b>：乗（の）る → 可能形<b>乗れる</b>（一類：う段→え段＋る）→ 乗れる<b>か</b>（嵌入疑問）。<br>▸ <b>用法</b>：「どこで乗（の）れるか」把疑問句名詞化當「知（し）っている」的內容；搭乘的對象用<b>に</b>（タクシーに乗る）。<br>▸ <b>比較</b>：タクシーに乗（の）る（搭計程車・に）／タクシーを降（お）りる（下計程車・を）。<b>上車用に，下車用を</b>。<br><span class=\"n4\">N4 必考：乗る（に）／降りる（を）的助詞</span>"],["B","ここを横切り、次の信号まで歩くんです。そこにタクシーの乗り場があります。","Koko wo yokogiri, tsugi no shingō made aruku n desu. Soko ni takushī no noriba ga arimasu.","從這裡穿過去，走到下一個紅綠燈。計程車站就在那裡。","▸ <b>句型</b>：【ます形中止】＋【まで】終點＋【〜んです】說明。<br>▸ <b>變化</b>：横切（よこぎ）る → <b>横切り</b>（ます形去ます的中止形，連接下一動作）；歩（ある）く → 歩く＋んです。<br>▸ <b>用法</b>：「ここを横切（よこぎ）る」＝穿過這裡（を表通過）；「次（つぎ）の信号（しんごう）まで」終點用まで。「乗（の）り場（ば）」＝乘車處。<br>▸ <b>比較</b>：横切（よこぎ）り（中止形・書面）／横切って（て形・口語）。指路時兩者皆可。<br><span class=\"n4\">N4 讀解常見「ます形中止」的連接</span>"],["A","地下鉄の入り口の近くですか？","Chikatetsu no iriguchi no chikaku desu ka?","在靠近地下鐵入口的附近嗎？","▸ <b>句型</b>：【AのB＋の近く＋ですか】。<br>▸ <b>變化</b>：地下鉄（ちかてつ）の入（い）り口（ぐち）の近（ちか）く（の的連續修飾）＋ですか。<br>▸ <b>用法</b>：用名詞句確認位置關係；「近（ちか）く」是名詞（近い是形容詞）。<br>▸ <b>比較</b>：近（ちか）く（名詞・附近）／近い（い形容詞・近的）／そば（旁邊・更近）。<br><span class=\"n4\">N4 必考：近く／近い 的詞性差異</span>"],["B","そうです。そのすぐうしろです。","Sō desu. Sono sugu ushiro desu.","是的。就在那後面。","▸ <b>句型</b>：【そうです】＋【指示詞＋位置名詞】。<br>▸ <b>變化</b>：その＋すぐ＋うしろ（指示詞＋副詞＋位置名詞）。<br>▸ <b>用法</b>：「すぐ」＝就在（強調距離很近）；日語位置關係用「〜の＋位置名詞」。<br>▸ <b>比較</b>：うしろ（後面）／まえ（前面）／となり（旁邊・同類並列）／よこ（側面）。<br><span class=\"n4\">N4 必考：位置名詞（となり／よこ／そば）的差異</span>"]]},{"name":"問圖書館","lines":[["A","市立図書館への道を教えてもらえますか？","Shiritsu toshokan e no michi wo oshiete moraemasu ka?","能不能告訴我怎麼去市立圖書館？","▸ <b>句型</b>：【〜への道】＋【〜てもらえますか】。<br>▸ <b>變化</b>：教（おし）える → 教えて＋<b>もらえますか</b>（もらう的可能形）。<br>▸ <b>用法</b>：比「〜ていただけますか」略隨性，但仍客氣；へ＋の修飾名詞。「市立（しりつ）」＝市立。<br>▸ <b>比較</b>：教（おし）えてもらえますか（客氣）／教えていただけますか（更客氣）／教えてください（一般請求）。<br><span class=\"n4\">N4 必考：もらう／いただく 的敬語階梯</span>"],["B","ええ。ここからちょっと遠いですよ。10ブロックか12ブロックでしょう。","Ē. Koko kara chotto tōi desu yo. Ju-burokku ka jūni-burokku deshō.","喔！離這裡蠻遠的喲。大約隔10或12個街。","▸ <b>句型</b>：【〜から】起點＋【〜か〜】不確定＋【でしょう】推測。<br>▸ <b>變化</b>：10ブロック<b>か</b>12ブロック＝10或12個街區（か表選擇、不確定）。<br>▸ <b>用法</b>：「ここから遠（とお）い」起點用から；「ちょっと」緩和語氣（其實是很遠）。<br>▸ <b>比較</b>：AかB（A或B・不確定）／AとB（A和B）／AやB（A、B之類）。<br><span class=\"n4\">N4 必考：か 表選擇・不確定</span>"],["A","どうしたらいいですか？","Dō shitara ii desu ka?","你有什麼建議嗎？","▸ <b>句型</b>：【疑問詞＋たら＋いいですか】徵詢建議。<br>▸ <b>變化</b>：する → し<b>たら</b>（た形＋ら）＋いいですか。<br>▸ <b>用法</b>：「どうしたらいいですか」是徵詢建議的萬用句型，比「どうすればいいですか」略口語。<br>▸ <b>比較</b>：どうしたらいい（口語）／どうすればいい（一般）／どうしましょうか（我該怎麼辦・徵詢對方）。<br><span class=\"n4\">N4 必考：疑問詞＋たら／ば＋いいですか</span>"],["B","2番のバスに乗ってください。ちょうどここにバス停がありますから。そして3番目の停留所で降りると、図書館のすぐ前です。","Ni-ban no basu ni notte kudasai. Chōdo koko ni basu-tei ga arimasu kara. Soshite san-banme no teiryūjo de oriru to, toshokan no sugu mae desu.","坐2路公車。剛好在這裡有站牌。第三站下車就是圖書館前面了。","▸ <b>句型</b>：【〜に乗る】 ＋【〜から】理由後置 ＋【〜番目】序數 ＋【〜と】必然結果。<br>▸ <b>逐詞拆解</b>：<b>2番（ばん）のバスに乗（の）る</b>＝搭2路公車（<b>に</b>＝搭乘的對象）；<b>ありますから</b>＝から表理由，<b>放在句尾</b>（口語常見的理由後置）；<b>3番目（ばんめ）の停留所（ていりゅうじょ）で</b>＝第3站（<b>番目</b>＝序數）＋<b>で</b>（動作場所）；<b>降（お）りると</b>＝辭書形＋<b>と</b>（一…就…，必然結果）；<b>すぐ前（まえ）です</b>＝就在正前方。<br>▸ <b>句型公式</b>：<b>［辭書形］＋と、［必然結果］</b>＝一…就…。例：<b>右（みぎ）に曲（ま）がると、駅（えき）があります</b>（右轉就有車站）／<b>春（はる）になると、花（はな）が咲（さ）きます</b>（一到春天花就開）。<br>▸ <b>用法</b>：指路時<b>と</b>是最常用的條件形，因為它表達的是「客觀必然」的結果。注意<b>と的後面不可接命令、請求、意志</b>（×降りると、行（い）ってください）。<br>▸ <b>比較</b>：數字系統：<b>2番（ばん）</b>（第2號・編號）／<b>3番目（ばんめ）</b>（第3個・順序）／<b>2番線（ばんせん）</b>（第2月台）／<b>2号車（ごうしゃ）</b>（第2車廂）。條件形：<b>と</b>（必然）／<b>たら</b>（假設）／<b>ば</b>（條件）／<b>なら</b>（承接話題）。<br><span class=\"n4\">N4 必考：〜と 表必然結果（後不接命令）、番目 的序數</span>"]]},{"name":"問電車","lines":[["A","四ツ谷行きの電車はどう乗るのですか？","Yotsuya-yuki no densha wa dō noru no desu ka?","要去四谷的電車怎麼坐？","▸ <b>句型</b>：【地名＋行き】＋【どう＋動詞＋のですか】。<br>▸ <b>變化</b>：行（い）く → <b>行き</b>（名詞化，接在地名後表開往該地）。<br>▸ <b>用法</b>：「四ツ谷行（よつやい）き」＝開往四谷（車站廣播常用）；「どう乗（の）るのですか」問方法。<br>▸ <b>比較</b>：〜行（い）き（開往・ゆき／いき皆可）／〜発（はつ）（從…出發）／〜経由（けいゆ）（經由）。<br><span class=\"n4\">N4 必考：動詞ます形的名詞化（行き・帰り・始まり）</span>"],["B","ここにはとまりません。この電車で次の駅まで行き、降りて、2番線の電車に乗ってください。","Koko ni wa tomarimasen. Kono densha de tsugi no eki made iki, orite, ni-bansen no densha ni notte kudasai.","這裡不會停。要坐這班電車到下一個車站下車，然後轉坐2號線的電車。","▸ <b>句型</b>：【〜には】＋【ます形中止】＋【て形】＋【に乗ってください】。<br>▸ <b>變化</b>：行（い）く → <b>行き</b>（中止形）；降（お）りる → 降り<b>て</b>（て形）——連續三個動作用不同連接法。<br>▸ <b>用法</b>：「この電車（でんしゃ）<b>で</b>」交通工具用で；「ここ<b>には</b>とまりません」用には強調此站。「2番線（にばんせん）」＝2號月台。<br>▸ <b>比較</b>：行（い）き（中止・書面）／行って（て形・口語）。指路時混用很自然。<br><span class=\"n4\">N4 必考：動作的連續連接（中止形／て形）</span>"],["A","次の駅で乗りかえて、2番線の電車に乗りますね？","Tsugi no eki de norikaete, ni-bansen no densha ni norimasu ne?","在下一個車站坐2號線的電車，對不對？","▸ <b>句型</b>：【場所＋で】＋【て形】＋【〜ね？】覆述確認。<br>▸ <b>變化</b>：乗（の）りかえる → 乗りかえ<b>て</b>（て形連接）。<br>▸ <b>用法</b>：「次（つぎ）の駅（えき）<b>で</b>乗（の）りかえる」轉乘的場所用で；句尾<b>ね？</b>覆述以確認自己理解正確。<br>▸ <b>比較</b>：乗（の）りかえる（轉乘）／乗る（搭乘）／降（お）りる（下車）。「〜で乗りかえる」是固定搭配。<br><span class=\"n4\">N4 必考：ね 的確認功能（覆述）</span>"],["B","そのとおりです。","Sono tōri desu.","沒錯。","▸ <b>句型</b>：【そのとおりです】完全正確。<br>▸ <b>變化</b>：その＋とおり（如同）＋です。<br>▸ <b>用法</b>：確認對方理解完全正確；也可說「はい、そうです」。<br>▸ <b>比較</b>：そのとおりです（完全正確）／そうです（是的）／だいたいそうです（大致正確）。<br><span class=\"n4\">N4 必考：〜とおり 的用法（言うとおり・思ったとおり）</span>"]]},{"name":"問銀行","lines":[["A","国立銀行へどのように行くのか教えてくださいますか？","Kokuritsu ginkō e dono yō ni iku no ka oshiete kudasaimasu ka?","能不能告訴我到國立銀行怎麼去？","▸ <b>句型</b>：【どのように】＋【〜のか】間接疑問＋【〜てくださいますか】。<br>▸ <b>變化</b>：どう → <b>どのように</b>（鄭重形）；行（い）く ＋ <b>のか</b>（嵌入疑問時常加の）。<br>▸ <b>用法</b>：「どのように」比「どう」正式；嵌入疑問句用「〜のか」使結構更清楚。「国立（こくりつ）銀行（ぎんこう）」＝國立銀行。<br>▸ <b>比較</b>：どのように（鄭重）／どう（一般）／どうやって（用什麼方法・口語）。<br><span class=\"n4\">N4 必考：どのように／どうやって 的語體</span>"],["B","はい。ここから3ブロック北です。左側のおおきなガラスの建物です。見失うことはありませんよ。","Hai. Koko kara san-burokku kita desu. Hidarigawa no ōki na garasu no tatemono desu. Miushinau koto wa arimasen yo.","好。從這裡向北走3條街。就在左邊的玻璃帷幕大樓裡，一定看得到。","▸ <b>句型</b>：【方位表現】 ＋【連體詞おおきな】 ＋【〜ことはありません】絕不會。<br>▸ <b>逐詞拆解</b>：<b>ここから3ブロック北（きた）</b>＝從這裡往北3個街區（<b>から</b>＝起點）；<b>左側（ひだりがわ）の</b>＝左邊的；<b>おおきな</b>＝<b>連體詞</b>（只能修飾名詞，沒有活用）；<b>ガラスの建物（たてもの）</b>＝玻璃的建築（の連接材質）；<b>見失（みうしな）うことはありません</b>＝見失う（看漏、跟丟）＋ことはない＝絕不會。<br>▸ <b>句型公式</b>：<b>［辭書形］＋ことはありません</b>＝絕不會…／不必…。例：<b>心配（しんぱい）することはありません</b>（不必擔心）／<b>迷（まよ）うことはありません</b>（絕不會迷路）。<br>▸ <b>用法</b>：指路的結尾常用這句<b>讓對方安心</b>。「おおきな」是連體詞，與い形容詞「大（おお）きい」意思相同但<b>不能當述語</b>（×建物はおおきなです）。同類連體詞：<b>小（ちい）さな・おかしな・いろんな</b>。<br>▸ <b>比較</b>：<b>大（おお）きい建物（たてもの）</b>（い形容詞・可當述語）／<b>大きな建物</b>（連體詞・只能修飾）。另：<b>〜ことはない</b>（不必・絕不會）／<b>〜ことがある</b>（有時會）／<b>〜たことがある</b>（有經驗）。<br><span class=\"n4\">N4 必考：連體詞（大きな／小さな）、〜ことはない</span>"]]},{"name":"不知道（1）","lines":[["A","すみません、国立西洋美術館はどこか知っていますか？","Sumimasen, kokuritsu seiyō bijutsukan wa doko ka shitte imasu ka?","對不起，你知道國立西洋美術館在哪裡嗎？","▸ <b>句型</b>：【疑問詞＋か】＋【知っていますか】。<br>▸ <b>變化</b>：知（し）る → 知って＋います（狀態）＋か。<br>▸ <b>用法</b>：<b>先問對方是否知道</b>再問路，比直接問更客氣；「知（し）っていますか」不可說「×知りますか」。「国立西洋美術館（こくりつせいようびじゅつかん）」。<br>▸ <b>比較</b>：知（し）っていますか（知道嗎・狀態）／知りますか（× 不自然）／ご存（ぞん）じですか（敬語）。<br><span class=\"n4\">N4 必考：知る 必須用ている形</span>"],["B","すみません。私もこの辺はわからないのです。誰か他の人に聞いたほうがいいですね。","Sumimasen. Watashi mo kono hen wa wakaranai no desu. Dare ka hoka no hito ni kiita hō ga ii desu ne.","對不起。我對這附近也不清楚。你問別人比較好。","▸ <b>句型</b>：【も】同樣＋【〜のです】說明＋【誰か】＋【〜たほうがいい】建議。<br>▸ <b>變化</b>：わかる → わからない ＋ のです（說明）；聞（き）く → 聞い<b>た</b>ほうがいい（た形＋ほうがいい）。<br>▸ <b>用法</b>：「私（わたし）も」表「我跟你一樣不清楚」；「この辺（へん）は」用は提示範圍。<br>▸ <b>比較</b>：〜たほうがいい（最好做）／〜ないほうがいい（最好不要做）／〜べきだ（應該・較強）。<br><span class=\"n4\">N4 必考：〜たほうがいい 的接續（た形）</span>"],["A","はい、ありがとうございます。","Hai, arigatō gozaimasu.","好，謝謝你。","▸ <b>句型</b>：【はい＋ありがとうございます】。<br>▸ <b>變化</b>：ありがとうございます（現在式）。<br>▸ <b>用法</b>：即使對方幫不上忙<b>也要道謝</b>，是日語會話的基本禮節。<br>▸ <b>比較</b>：ありがとうございます（現在・對方的好意仍持續）／ありがとうございました（事情已完結）。<br><span class=\"n4\">N4 必考：道謝的時態選擇</span>"]]},{"name":"不知道（2）","lines":[["A","失礼ですが。中正紀念堂へ行くバスはどれか教えてくださいますか？","Shitsurei desu ga. Chūsei kinendō e iku basu wa dore ka oshiete kudasaimasu ka?","對不起，能告訴我去中正紀念堂搭哪班公車嗎？","▸ <b>句型</b>：【失礼ですが】＋【動詞連體修飾】＋【どれ＋か】。<br>▸ <b>變化</b>：行（い）く → 中正紀念堂（ちゅうせいきねんどう）へ行く<b>バス</b>（動詞直接修飾名詞）。<br>▸ <b>用法</b>：<b>どれ</b>用於三者以上選一個（どちら是二選一）；「〜へ行（い）くバス」＝開往…的公車。<br>▸ <b>比較</b>：どれ（三者以上）／どちら（二選一・或禮貌形的どこ）／どの＋名詞（哪一個…）。<br><span class=\"n4\">N4 必考：どれ／どちら／どの 的區別</span>"],["B","すみません、ここに住んでいないのです。あそこの警官にたずねたらどうですか？","Sumimasen, koko ni sunde inai no desu. Asoko no keikan ni tazunetara dō desu ka?","對不起，我不住這裡。你問那邊的警察如何？","▸ <b>句型</b>：【〜ている否定＋のです】＋【〜たらどうですか】建議。<br>▸ <b>變化</b>：住（す）む → 住んで＋いない ＋ のです；たずねる → たずね<b>たら</b>＋どうですか。<br>▸ <b>用法</b>：「〜たらどうですか」委婉建議；詢問的對象用<b>に</b>（警官（けいかん）にたずねる）。<br>▸ <b>比較</b>：〜たらどうですか（要不要…呢・建議）／〜てください（請…・指示）／〜べきです（應該・較強硬）。<br><span class=\"n4\">N4 必考：〜たらどうですか 的建議用法</span>"],["A","ありがとうございます。","Arigatō gozaimasu.","謝謝你。","▸ <b>句型</b>：【ありがとうございます】。<br>▸ <b>變化</b>：ありがとう → ありがとうございます（丁寧）。<br>▸ <b>用法</b>：對陌生人一律用「ございます」形，這是基本禮儀。<br>▸ <b>比較</b>：ありがとうございます（對陌生人・長輩）／ありがとう（熟人）／どうも（極隨性）。<br><span class=\"n4\">N4 必考：敬語程度與對象的搭配</span>"]]},{"name":"不知道（3）","lines":[["A","すみません、植物園はどこか知っていますか？","Sumimasen, shokubutsuen wa doko ka shitte imasu ka?","對不起，你知道植物園在哪裡嗎？","▸ <b>句型</b>：【疑問詞＋か】＋【知っていますか】。<br>▸ <b>變化</b>：どこ ＋ <b>か</b>（嵌入疑問）＋知（し）っていますか。<br>▸ <b>用法</b>：問路的標準開場；「植物園（しょくぶつえん）」是漢語名詞。<br>▸ <b>比較</b>：どこか知（し）っていますか（知道在哪嗎）／どこですか（在哪裡・直接問）。前者較客氣。<br><span class=\"n4\">N4 必考：間接疑問（疑問詞＋か＋動詞）</span>"],["B","すみません、全くわかりません。あそこのガソリンスタンドの店員に聞いてください。","Sumimasen, mattaku wakarimasen. Asoko no gasorin sutando no ten'in ni kiite kudasai.","對不起，我完全不知道。請問那邊加油站的店員。","▸ <b>句型</b>：【全く＋否定】＋【〜に聞いてください】。<br>▸ <b>變化</b>：わかる → わかり<b>ません</b>；聞（き）く → 聞いて＋ください。<br>▸ <b>用法</b>：<b>全（まった）く</b>必與否定呼應，表完全否定；詢問對象用に。「ガソリンスタンド」＝加油站，「店員（てんいん）」＝店員。<br>▸ <b>比較</b>：全（まった）くわかりません（完全不知道）／よくわかりません（不太清楚・較委婉）／知（し）りません（不知道・略冷淡）。<br><span class=\"n4\">N4 必考：全く／ぜんぜん 與否定的呼應</span>"],["A","ああ。分かりました。","Ā. Wakarimashita.","啊，我知道了。","▸ <b>句型</b>：【分かりました】接受指引。<br>▸ <b>變化</b>：分（わ）かる → 分かりました（過去式表理解成立）。<br>▸ <b>用法</b>：表示接受對方的建議；「ああ」表恍然。<br>▸ <b>比較</b>：分（わ）かりました（我明白了）／そうします（我就這麼做）／ありがとうございます（謝謝）。<br><span class=\"n4\">N4 必考：わかりました 的時態邏輯</span>"]]}]},"21":{"title":"打電話","jp_title":"電話で話す","theme":"電話禮儀、通話用語","scenes":[{"name":"通話（1）","lines":[["A","もしもし、春子をお願いします。","Moshimoshi, Haruko wo onegai shimasu.","喂，請問春子在嗎？","▸ <b>句型</b>：【もしもし】＋【〜をお願いします】。<br>▸ <b>變化</b>：願（ねが）う → お願いします（謙讓語，已慣用化）。<br>▸ <b>用法</b>：電話中請人接電話的固定說法，<b>對象用を</b>；「もしもし」只用於電話（或叫喚遠處的人）。<br>▸ <b>比較</b>：〜をお願（ねが）いします（請找…・最常用）／〜さんはいらっしゃいますか（更禮貌）／〜さんいますか（隨性）。<br><span class=\"n4\">N4 必考：電話用語的固定句型</span>"],["B","私です。","Watashi desu.","我就是。","▸ <b>句型</b>：【私です】表明本人。<br>▸ <b>變化</b>：私（わたし）＋です（名詞句）。<br>▸ <b>用法</b>：電話中表示「我就是本人」；商務可說「はい、〇〇でございます」。<br>▸ <b>比較</b>：私（わたし）です（我就是）／はい、私ですが（我就是，有事嗎）／〇〇です（直接說自己的名字）。<br><span class=\"n4\">N4 會考電話對答的固定回應</span>"],["A","あら、こんにちは。莉莉です。","Ara, konnichiwa. Riri desu.","哦！你好。我是莉莉。","▸ <b>句型</b>：【感嘆詞】＋【招呼】＋【名詞句自我介紹】。<br>▸ <b>變化</b>：莉莉（りり）＋です（電話中報名字不需說「私（わたし）は」）。<br>▸ <b>用法</b>：「あら」是女性用的輕微驚訝；確認是本人後立刻報上自己的名字。<br>▸ <b>比較</b>：あら（女性・輕微驚訝）／まあ（女性・驚喜）／おや（男性・意外）。<br><span class=\"n4\">N4 聽解必考：感嘆詞判斷說話者</span>"]]},{"name":"通話（2）","lines":[["A","もしもし、秀樹ですか？","Moshimoshi, Hideki desu ka?","喂，請問是秀樹嗎？","▸ <b>句型</b>：【もしもし】＋【名詞＋ですか】確認身分。<br>▸ <b>變化</b>：秀樹（ひでき）＋ですか（不加さん表關係親近）。<br>▸ <b>用法</b>：直接叫名字不加「さん」表示是熟人；對不熟的人要加さん。<br>▸ <b>比較</b>：秀樹（ひでき）ですか（熟人）／秀樹さんですか（一般）／秀樹様（さま）でいらっしゃいますか（商務最敬）。<br><span class=\"n4\">N4 必考：稱謂有無反映人際距離</span>"],["B","はい、私です。どなたですか？","Hai, watashi desu. Donata desu ka?","對，我就是。請問是哪位？","▸ <b>句型</b>：【私です】＋【どなた＋ですか】敬語疑問詞。<br>▸ <b>變化</b>：誰（だれ）→ <b>どなた</b>（敬語）→ どちら様（さま）（最敬）。<br>▸ <b>用法</b>：問對方身分時<b>不可用「誰（だれ）ですか」</b>（失禮），要用「どなたですか」或「どちら様（さま）でしょうか」。<br>▸ <b>比較</b>：誰（だれ）ですか（失禮）／どなたですか（禮貌）／どちら様（さま）でしょうか（最禮貌・商務）。<br><span class=\"n4\">N4 必考：誰／どなた／どちら様 的敬語階梯</span>"],["A","紀之です。","Noriyuki desu.","我是紀之。","▸ <b>句型</b>：【名詞＋です】報名字。<br>▸ <b>變化</b>：紀之（のりゆき）＋です。<br>▸ <b>用法</b>：熟人間只報名字；商務場合要說「〇〇社（しゃ）の〇〇と申（もう）します」（公司＋姓名）。<br>▸ <b>比較</b>：紀之（のりゆき）です（熟人）／神田（かんだ）です（只說姓・一般）／神田と申（もう）します（謙讓・商務）。<br><span class=\"n4\">N4 必考：自我介紹的三種形式</span>"]]},{"name":"打錯電話","lines":[["A","もしもし。山本さんいらっしゃいますか。","Moshimoshi. Yamamoto-san irasshaimasu ka.","喂，請問山本先生在嗎？","▸ <b>句型</b>：【いらっしゃいますか】尊敬語詢問存在。<br>▸ <b>變化</b>：いる → <b>いらっしゃる</b>（尊敬語）→ いらっしゃいますか。<br>▸ <b>用法</b>：詢問對方是否在時用尊敬語；口語常省略助詞（山本（やまもと）さん<b>は</b>いらっしゃいますか）。<br>▸ <b>比較</b>：いらっしゃいますか（尊敬・問他人）／おりますか（× 不可用於他人）／いますか（一般・略隨性）。<br><span class=\"n4\">N4 必考：いらっしゃる（尊敬）／おる（謙讓）</span>"],["B","失礼ですが、間違い電話のようです。","Shitsurei desu ga, machigai denwa no yō desu.","對不起，你打錯電話號碼了。","▸ <b>句型</b>：【失礼ですが】＋【名詞＋のようです】委婉推測。<br>▸ <b>變化</b>：間違（まちが）い電話（でんわ）だ → 間違い電話<b>のようです</b>（名詞＋の＋よう）。<br>▸ <b>用法</b>：用「〜のようです」<b>避免直接說「你打錯了」</b>，是日語體貼的表現；名詞接よう要加の。<br>▸ <b>比較</b>：名詞＋<b>の</b>ようです／な形容詞＋<b>な</b>ようです／動詞・い形容詞<b>直接</b>接ようです。<br><span class=\"n4\">N4 必考：〜ようだ 的接續規則</span>"],["A","ああ、すみません。","Ā, sumimasen.","哦！對不起。","▸ <b>句型</b>：【感嘆詞＋すみません】。<br>▸ <b>變化</b>：すみません（一般道歉）。<br>▸ <b>用法</b>：發現自己打錯電話時的道歉；商務場合可說「失礼（しつれい）いたしました」。<br>▸ <b>比較</b>：すみません（一般）／失礼（しつれい）しました（禮儀失誤）／申（もう）し訳（わけ）ありません（鄭重）。<br><span class=\"n4\">N4 必考：道歉語的場合選擇</span>"]]},{"name":"留言（1）","lines":[["A","もしもし。こちらは中村真一郎です。鉄平と話をしたいのですが。","Moshimoshi. Kochira wa Nakamura Shinichirō desu. Teppei to hanashi wo shitai no desu ga.","喂，我是中村真一郎，我想找鐵平講話。","▸ <b>句型</b>：【こちらは〜です】＋【〜と話をしたい】＋【のですが】。<br>▸ <b>變化</b>：話（はなし）をする → 話をし<b>たい</b>＋のですが（留白）。<br>▸ <b>用法</b>：電話中自報身分用「こちらは〜です」；交談的對象用<b>と</b>（互相的動作）。<br>▸ <b>比較</b>：〜と話（はな）す（和…談・雙向）／〜に話す（跟…說・單向）。<b>と vs に</b>方向性不同。<br><span class=\"n4\">N4 必考：と／に 表對象的差異</span>"],["B","すみませんね、真一郎。鉄平はここにいないんです。ことづけはありますか？","Sumimasen ne, Shinichirō. Teppei wa koko ni inai n desu. Kotozuke wa arimasu ka?","真不好意思！真一郎。鐵平現在不在這裡，你有什麼話要轉告嗎？","▸ <b>句型</b>：【〜ている否定＋んです】＋【〜はありますか】。<br>▸ <b>變化</b>：いる → いない ＋ <b>んです</b>（＝のです，說明狀況）。<br>▸ <b>用法</b>：「ことづけ」＝留言（也可說「伝言（でんごん）」）；「すみませんね」的ね柔化語氣。<br>▸ <b>比較</b>：ことづけ（口語・留言）／伝言（でんごん）（一般・留言）／メッセージ（外來語）。<br><span class=\"n4\">N4 會考電話留言的相關詞彙</span>"],["A","ええ。私に電話をくれるように彼に伝えてください。","Ē. Watashi ni denwa wo kureru yō ni kare ni tsutaete kudasai.","好的，請轉告他，請他打電話給我。","▸ <b>句型</b>：【〜てくれる】＋【〜ように＋伝えてください】間接引述。<br>▸ <b>變化</b>：電話（でんわ）をくれる（對方為我做）→ くれる<b>ように</b>＋伝（つた）えてください。<br>▸ <b>用法</b>：<b>〜ように</b>用於間接引述<b>請求、命令</b>的內容（請他…）；引述陳述則用「〜と」。<br>▸ <b>比較</b>：〜ように伝（つた）えてください（請轉告他要…・請求）／〜と伝えてください（請轉告說…・陳述）。<br><span class=\"n4\">N4 必考：〜ように 的間接引述用法</span>"]]},{"name":"轉接（1）","lines":[["A","もしもし。木村さんですか？","Moshimoshi. Kimura-san desu ka?","喂，請問是木村先生嗎？","▸ <b>句型</b>：【名詞＋ですか】確認。<br>▸ <b>變化</b>：木村（きむら）さん＋ですか。<br>▸ <b>用法</b>：確認接電話者身分的簡短問法。<br>▸ <b>比較</b>：木村（きむら）さんですか（是木村先生嗎）／木村さんでいらっしゃいますか（最敬・商務）。<br><span class=\"n4\">N4 必考：でいらっしゃる 是です的尊敬語</span>"],["B","いいえ。少々お待ちください。","Iie. Shōshō omachi kudasai.","不是的，請稍待一下。","▸ <b>句型</b>：【少々】＋【お＋ます形＋ください】尊敬語請求。<br>▸ <b>變化</b>：待（ま）つ → <b>お待ちください</b>（お＋ます形＋ください）。<br>▸ <b>用法</b>：「少々（しょうしょう）」是「ちょっと」的正式形，商務電話的標準用語。<br>▸ <b>比較</b>：少々（しょうしょう）お待（ま）ちください（商務標準）／ちょっと待ってください（一般）／ちょっと待って（常體）。<br><span class=\"n4\">N4 必考：お〜ください 的敬語請求形</span>"]]},{"name":"留言（2）","lines":[["A","もしもし。こちらは鈴木純です。中井さんと話をしたいのですが。","Moshimoshi. Kochira wa Suzuki Jun desu. Nakai-san to hanashi wo shitai no desu ga.","喂，我是鈴木純。我想和中井先生講話。","▸ <b>句型</b>：【こちらは〜です】＋【〜と話をしたいのですが】。<br>▸ <b>變化</b>：話（はなし）をしたい ＋ のですが（留白等對方接話）。<br>▸ <b>用法</b>：商務電話的標準開場組合：報身分→說來意→留白。<br>▸ <b>比較</b>：こちらは〜です（電話專用）／私（わたし）は〜です（一般場合）。電話中<b>用こちら較自然</b>。<br><span class=\"n4\">N4 必考：電話中的自稱表現</span>"],["B","ちょっとお待ちください。もしもし。すみませんが、中井は会議中です。こちらから電話を差し上げいただきますでしょうか。","Chotto omachi kudasai. Moshimoshi. Sumimasen ga, Nakai wa kaigi-chū desu. Kochira kara denwa wo sashiage itadakimasu deshō ka.","請等一下。喂，對不起，中井正在開會，等一下請他打電話給你好嗎？","▸ <b>句型</b>：【名詞＋中】進行 ＋【差し上げる】謙讓語 ＋【內外有別】。<br>▸ <b>逐詞拆解</b>：<b>少々（しょうしょう）お待（ま）ちください</b>＝お＋ます形＋ください（尊敬語請求）；<b>中井（なかい）は</b>＝<b>對外提到自家人不加さん</b>；<b>会議中（かいぎちゅう）</b>＝名詞＋中（正在…中）；<b>こちらから</b>＝由我方（<b>から</b>＝起點）；<b>電話（でんわ）を差（さ）し上（あ）げる</b>＝あげる的<b>謙讓語</b>（我方給對方打電話）。<br>▸ <b>句型公式</b>：<b>［名詞］＋中（ちゅう）</b>＝正在…中。例：<b>会議中（かいぎちゅう）・電話中（でんわちゅう）・食事中（しょくじちゅう）・使用中（しようちゅう）・外出中（がいしゅつちゅう）</b>。另：<b>お電話を差し上げます</b>＝我會打電話給您（商務標準說法）。<br>▸ <b>用法</b>：本句的敬語重點有兩個：①<b>中井（なかい）は</b>（自家同事不加さん，即使是上司）②<b>差（さ）し上（あ）げる</b>（我方的動作要降格）。正確說法應為<b>「こちらからお電話（でんわ）を差し上げてもよろしいでしょうか」</b>。<br>▸ <b>比較</b>：<b>差（さ）し上（あ）げる</b>（謙讓・我給對方）／<b>くださる</b>（尊敬・對方給我）／<b>あげる</b>（一般・我給）／<b>いただく</b>（謙讓・我從對方得到）。四者的<b>方向與立場</b>絕不可搞錯。<br><span class=\"n4\">N4 必考：授受動詞的敬語形（差し上げる／くださる／いただく）</span>"],["A","はい。私の電話番号は483-2265です。","Hai. Watashi no denwa bangō wa yon-hachi-san no ni-ni-roku-go desu.","好的，我的電話號碼是483-2265。","▸ <b>句型</b>：【AのB＋は〜です】＋【電話號碼的讀法】。<br>▸ <b>變化</b>：483-2265＝<b>よんはちさんの にいにいろくご</b>（「-」讀作<b>の</b>）。<br>▸ <b>用法</b>：電話號碼（電話番号（でんわばんごう））中<b>2讀にい、5讀ごう、0讀ゼロ或れい</b>，為避免聽錯會刻意拉長音。<br>▸ <b>比較</b>：「-」讀の／4讀よん（不用し）／7讀なな（不用しち）。這是避免誤聽的慣例。<br><span class=\"n4\">N4 必考：電話號碼的讀法慣例</span>"]]},{"name":"外出","lines":[["A","もしもし。こちらは俊彦です。祐二と話をしたいのですが。","Moshimoshi. Kochira wa Toshihiko desu. Yūji to hanashi wo shitai no desu ga.","喂，我是俊彥。請問裕二在嗎？","▸ <b>句型</b>：【こちらは〜です】＋【〜と話をしたいのですが】。<br>▸ <b>變化</b>：俊彦（としひこ）＋です（只報名字，表示是熟人）。<br>▸ <b>用法</b>：熟人間打電話也常用「こちらは〜です」，因為電話中無法看到臉。<br>▸ <b>比較</b>：こちらは俊彦（としひこ）です（電話・自報）／俊彦だけど（常體・熟人）。<br><span class=\"n4\">N4 會考電話開場的語體</span>"],["B","すみません。彼は今出かけています。あとでまた電話してくださいますか？","Sumimasen. Kare wa ima dekakete imasu. Ato de mata denwa shite kudasaimasu ka?","對不起，他現在外出不在家，晚點請再打來好嗎？","▸ <b>句型</b>：【〜ている】狀態＋【あとで】＋【〜てくださいますか】。<br>▸ <b>變化</b>：出（で）かける → 出かけて＋<b>います</b>（外出中的狀態，不是正在出門）。<br>▸ <b>用法</b>：「出（で）かけています」表<b>目前不在</b>的狀態；「あとで」＝之後（あと＋で）。<br>▸ <b>比較</b>：出（で）かけています（外出中・狀態）／出かけました（出去了・動作完成）／出かけます（要出去）。<br><span class=\"n4\">N4 必考：〜ている 表結果的狀態</span>"],["A","わかりました。","Wakarimashita.","好的。","▸ <b>句型</b>：【わかりました】接受。<br>▸ <b>變化</b>：わかる → わかりました。<br>▸ <b>用法</b>：接受對方的說明與要求；商務可用「承知（しょうち）しました」。<br>▸ <b>比較</b>：わかりました（一般）／承知（しょうち）しました（商務・對上）／了解（りょうかい）しました（對平輩・下屬）。<br><span class=\"n4\">N4 必考：了解／承知 的使用對象</span>"]]},{"name":"通話中","lines":[["A","もしもし。加藤さんをお願いします。","Moshimoshi. Katō-san wo onegai shimasu.","喂，請問加藤在嗎？","▸ <b>句型</b>：【〜をお願いします】。<br>▸ <b>變化</b>：加藤（かとう）さん＋を＋お願（ねが）いします。<br>▸ <b>用法</b>：請對方轉接的最簡潔說法，<b>對象用を</b>。<br>▸ <b>比較</b>：〜をお願（ねが）いします（請找…）／〜につないでください（請幫我轉接）／〜はいらっしゃいますか（…在嗎）。<br><span class=\"n4\">N4 必考：電話轉接的請求說法</span>"],["B","すみません、彼は今電話中です。どちら様でしょうか？","Sumimasen, kare wa ima denwa-chū desu. Dochira-sama deshō ka?","對不起，他現在講電話中。請問是哪位？","▸ <b>句型</b>：【名詞＋中】＋【どちら様＋でしょうか】最敬疑問。<br>▸ <b>變化</b>：電話（でんわ）＋<b>中（ちゅう）</b>（正在通話中）；誰（だれ）→ どなた → <b>どちら様（さま）</b>（最敬）。<br>▸ <b>用法</b>：「〜中（ちゅう）」表正在進行（会議中（かいぎちゅう）・食事中（しょくじちゅう）・使用中（しようちゅう））；問身分用「どちら様（さま）でしょうか」最禮貌。<br>▸ <b>比較</b>：電話中（でんわちゅう）（通話中）／会議中（かいぎちゅう）（會議中）／外出中（がいしゅつちゅう）（外出中）。皆為「名詞＋中」。<br><span class=\"n4\">N4 必考：〜中（ちゅう／じゅう）的讀音與用法</span>"],["A","斎藤圭子です。電話は長くなりそうですか？","Saitō Keiko desu. Denwa wa nagaku narisō desu ka?","我是齊藤圭子。電話會很久嗎？","▸ <b>句型</b>：【い形容詞副詞形＋なる＋そう】樣態推測。<br>▸ <b>變化</b>：長（なが）い → <b>長く</b>（副詞形）＋なる → なり＋<b>そう</b>（ます形＋そう＝看起來會…）。<br>▸ <b>用法</b>：「長（なが）くなりそうですか」＝會變很久嗎（推測未來）；三段變化要熟記。<br>▸ <b>比較</b>：長（なが）くなりそう（看起來會變長）／長そう（看起來很長）／長くなる（會變長）。<br><span class=\"n4\">N4 必考：〜くなる＋そう 的複合變化</span>"],["B","圭子さん、すぐ終わると思います。ちょっとそのままお待ちいただけますか？","Keiko-san, sugu owaru to omoimasu. Chotto sono mama omachi itadakemasu ka?","圭子小姐，應該快講完了。可以稍等一下嗎？","▸ <b>句型</b>：【〜と思います】＋【そのまま】＋【お＋ます形＋いただけますか】。<br>▸ <b>變化</b>：待（ま）つ → <b>お待ちいただけますか</b>（お＋ます形＋いただく的可能形＝最客氣的等待請求）。<br>▸ <b>用法</b>：「そのまま」＝保持原狀（不掛斷）；「すぐ終（お）わると思（おも）います」用と思う緩和斷定。<br>▸ <b>比較</b>：お待（ま）ちいただけますか（最客氣）／お待ちください（尊敬語指示）／待ってください（一般）。<br><span class=\"n4\">N4 必考：お〜いただく 的謙讓請求形</span>"],["A","はい。ありがとうございます。","Hai. Arigatō gozaimasu.","好的，謝謝你。","▸ <b>句型</b>：【はい＋ありがとうございます】。<br>▸ <b>變化</b>：ありがとうございます（現在式，因為對方的好意正在進行）。<br>▸ <b>用法</b>：接受對方的安排並道謝。<br>▸ <b>比較</b>：ありがとうございます（當下）／お願（ねが）いします（麻煩你了）／恐（おそ）れ入（い）ります（不好意思・更客氣）。<br><span class=\"n4\">N4 會考商務電話的應對用語</span>"]]},{"name":"初次通話（1）","lines":[["A","もしもし。","Moshimoshi.","喂。","▸ <b>句型</b>：【もしもし】接電話。<br>▸ <b>變化</b>：由「申（もう）す・申す」演變而來的電話專用招呼。<br>▸ <b>用法</b>：日本家庭接電話<b>通常不先報姓名</b>（防詐考量），只說「もしもし」。<br>▸ <b>比較</b>：もしもし（一般家庭）／はい、〇〇です（公司）／はい（略隨性）。<br><span class=\"n4\">N4 會考電話禮儀的文化差異</span>"],["B","もしもし。前田さんのお宅ですか？","Moshimoshi. Maeda-san no otaku desu ka?","喂，請問是前田先生家嗎？","▸ <b>句型</b>：【AのB＋ですか】＋【お宅】尊敬語。<br>▸ <b>變化</b>：家（いえ）→ <b>お宅（たく）</b>（尊敬語，指對方的家）。<br>▸ <b>用法</b>：問是否為某人家用「〜さんのお宅（たく）ですか」；自己的家說「うち」。<br>▸ <b>比較</b>：お宅（たく）（對方的家・尊敬）／うち（自己的家）／お住（す）まい（住處・更文雅）。<br><span class=\"n4\">N4 必考：お宅／うち 的內外有別</span>"],["A","はい。前田です。","Hai. Maeda desu.","是的，我是前田。","▸ <b>句型</b>：【はい＋姓＋です】。<br>▸ <b>變化</b>：前田（まえだ）＋です（只說姓）。<br>▸ <b>用法</b>：家庭電話回應時只說姓氏即可，這是標準做法。<br>▸ <b>比較</b>：前田（まえだ）です（我是前田）／前田でございます（最鄭重）／はい、そうです（是的）。<br><span class=\"n4\">N4 必考：でございます 是です的鄭重形</span>"]]},{"name":"初次通話（2）","lines":[["A","木村ですが。","Kimura desu ga.","我姓木村。","▸ <b>句型</b>：【名詞＋ですが】留白。<br>▸ <b>變化</b>：木村（きむら）＋です＋<b>が</b>（留白，等對方接話）。<br>▸ <b>用法</b>：報上姓氏後用<b>が</b>暗示「有什麼事嗎」，是接電話者常用的簡潔說法。<br>▸ <b>比較</b>：木村（きむら）ですが（我是木村，有事嗎）／木村です（我是木村）。加が就有等待的意味。<br><span class=\"n4\">N4 必考：が 的留白功能</span>"],["B","木村さんはいらっしゃいますか？伊藤健一です。","Kimura-san wa irasshaimasu ka? Itō Kenichi desu.","木村先生在嗎？我是伊藤健一。","▸ <b>句型</b>：【〜はいらっしゃいますか】尊敬語＋【名詞句自我介紹】。<br>▸ <b>變化</b>：いる → いらっしゃる（尊敬）→ いらっしゃいますか。<br>▸ <b>用法</b>：先問人再報自己名字，在口語中很常見（商務上應先報自己的名字）。<br>▸ <b>比較</b>：（口語）先問人再自報／（商務）先自報再問人。順序反映禮儀程度。<br><span class=\"n4\">N4 會考電話對答的標準流程</span>"],["A","はい、おります。ちょっとお待ちください。","Hai, orimasu. Chotto omachi kudasai.","在，請稍等一下。","▸ <b>句型</b>：【おります】いる的謙讓語 ＋【お＋ます形＋ください】尊敬語請求。<br>▸ <b>逐詞拆解</b>：<b>おります</b>＝いる的<b>謙讓語おる</b>＋ます（用於自己或自家人的存在）；<b>ちょっと</b>＝稍微；<b>お待（ま）ちください</b>＝お＋待つ的ます形＋ください（尊敬語的請求）。<br>▸ <b>句型公式</b>：<b>お＋ます形＋ください</b>＝請您…（尊敬語請求）。例：<b>お待（ま）ちください／お座（すわ）りください／お召（め）し上（あ）がりください／ご覧（らん）ください</b>（漢語動詞用ご）。<br>▸ <b>用法</b>：本句是接電話的標準回應——被問「木村（きむら）さんはいらっしゃいますか」（尊敬語）時，回答自家人在場要用<b>謙讓語「おります」</b>。若回答「いらっしゃいます」就變成<b>尊敬自家人</b>，是嚴重的敬語錯誤。<br>▸ <b>比較</b>：（問他人）いらっしゃいますか → （答自家人）<b>おります</b>／（答一般）います。同類對應：<b>存（ぞん）じております</b>（我知道）vs <b>ご存じです</b>（您知道）；<b>伺（うかが）います</b>（我拜訪）vs <b>いらっしゃいます</b>（您來）。<br><span class=\"n4\">N4 必考：おる／いらっしゃる 的內外對應、お〜ください</span>"]]},{"name":"預約","lines":[["A","安藤病院です。おはようございます。","Andō byōin desu. Ohayō gozaimasu.","安藤醫院。早安。","▸ <b>句型</b>：【單位名＋です】＋【時段招呼】。<br>▸ <b>變化</b>：安藤病院（あんどうびょういん）＋です（機關接電話先報名稱）。<br>▸ <b>用法</b>：日本商務、機關接電話<b>先報單位名稱</b>再問候，這是基本禮儀。<br>▸ <b>比較</b>：（機關）〇〇です＋おはようございます／（家庭）もしもし。兩者做法不同。<br><span class=\"n4\">N4 會考商務電話的開場</span>"],["B","もしもし。菊池忍と申します。きょう予約ができますか？","Moshimoshi. Kikuchi Shinobu to mōshimasu. Kyō yoyaku ga dekimasu ka?","喂，我叫菊池忍。今天可以預約嗎？","▸ <b>句型</b>：【〜と申します】謙讓＋【名詞＋ができますか】可能。<br>▸ <b>變化</b>：言（い）う → 申（もう）す（謙讓）→ 申します；予約（よやく）する → 予約<b>ができる</b>（名詞＋ができる）。<br>▸ <b>用法</b>：「予約（よやく）ができますか」＝可以預約嗎；也可說「予約したいのですが」（留白式）。<br>▸ <b>比較</b>：予約（よやく）ができますか（能預約嗎）／予約できますか（同義，較簡潔）／予約をお願（ねが）いします（我要預約）。<br><span class=\"n4\">N4 必考：名詞＋ができる 表可能</span>"],["A","そうですね。今日の午後2時15分でいかがでしょうか？","Sō desu ne. Kyō no gogo ni-ji jūgo-fun de ikaga deshō ka?","嗯，今天下午2點15分如何？","▸ <b>句型</b>：【そうですね】思考＋【〜でいかがでしょうか】提案。<br>▸ <b>變化</b>：どう → <b>いかが</b>（敬語）→ いかがでしょうか（最客氣）。<br>▸ <b>用法</b>：「2時15分（にじじゅうごふん）<b>で</b>」的で表<b>提案的條件</b>（以這個時間如何）；「そうですね」在此是思考中的緩衝。<br>▸ <b>比較</b>：〜でいかがでしょうか（最客氣的提案）／〜はどうですか（一般）／〜でいいですか（確認條件）。<br><span class=\"n4\">N4 必考：で 表條件＋いかが 的提案句型</span>"],["B","はい。ありがとうございます。","Hai. Arigatō gozaimasu.","好的，謝謝你。","▸ <b>句型</b>：【はい＋ありがとうございます】。<br>▸ <b>變化</b>：ありがとうございます。<br>▸ <b>用法</b>：接受對方提議的時間並道謝，結束通話。<br>▸ <b>比較</b>：ありがとうございます（謝謝）／お願（ねが）いします（那就麻煩了）／では、失礼（しつれい）します（那我先掛了）。<br><span class=\"n4\">N4 會考結束通話的用語</span>"]]}]},"22":{"title":"改變話題時","jp_title":"話題を変える時","theme":"轉換話題、改變討論方向","scenes":[{"name":"轉話題（烤肉）","lines":[["A","先週末は手伝ってくれてどうもありがとう。","Senshūmatsu wa tetsudatte kurete dōmo arigatō.","上週末多謝你幫忙。","▸ <b>句型</b>：【〜てくれて＋ありがとう】＋【は】對比。<br>▸ <b>變化</b>：手伝（てつだ）う → 手伝って＋<b>くれて</b>（對方為我做，て形表原因）＋ありがとう。<br>▸ <b>用法</b>：「先週末（せんしゅうまつ）<b>は</b>」用は提示話題並帶對比；「どうも」加強謝意。<br>▸ <b>比較</b>：〜てくれてありがとう（熟人）／〜ていただきありがとうございました（對上位者）。<br><span class=\"n4\">N4 必考：〜てくれる 表受惠</span>"],["B","どういたしまして。できて嬉しかったです。","Dō itashimashite. Dekite ureshikatta desu.","不客氣。能夠幫上忙我也很高興。","▸ <b>句型</b>：【どういたしまして】＋【可能形て形＋い形容詞過去】。<br>▸ <b>變化</b>：できる → でき<b>て</b>（て形表原因）＋嬉（うれ）し<b>かった</b>（い形容詞過去）。<br>▸ <b>用法</b>：「できて嬉（うれ）しかった」＝能幫上忙我很高興（回顧過去的事）。<br>▸ <b>比較</b>：できて嬉（うれ）しかった（過去・已完成）／できて嬉しい（現在）／できれば嬉しい（未實現的假設）。<br><span class=\"n4\">N4 必考：て形（已實現）／ば形（未實現）</span>"],["A","ところで、8日にバーベキューをするのですが。あなたと圭子は一緒に来ない？","Tokoro de, yōka ni bābekyū wo suru no desu ga. Anata to Keiko wa issho ni konai?","對了！我們8號要烤肉，你和圭子要不要一起來？","▸ <b>句型</b>：【ところで】轉換話題＋【のですが】留白＋【否定疑問邀約】。<br>▸ <b>變化</b>：する ＋ のですが（鋪陳）；来（く）る → 来<b>ない</b>？（邀約）。<br>▸ <b>用法</b>：<b>ところで</b>是轉換話題最標準的接續詞；日期用に（8日（ようか）に）。<br>▸ <b>比較</b>：ところで（轉換話題・中性）／そういえば（說到這個・想起）／話（はなし）は変（か）わりますが（明示換話題・正式）。<br><span class=\"n4\">N4 必考：ところで／そういえば 的轉換功能</span>"],["B","いいね。行きます。","Ii ne. Ikimasu.","好啊，我們會去。","▸ <b>句型</b>：【いいね】贊同＋【動詞＋ます】答應。<br>▸ <b>變化</b>：行（い）く → 行きます（丁寧形答應）。<br>▸ <b>用法</b>：常體的「いいね」與丁寧的「行（い）きます」混用，在口語中很自然。<br>▸ <b>比較</b>：いいね（不錯耶・贊同）／いいよ（好啊・答應）／もちろん（當然）。<br><span class=\"n4\">N4 聽解必考：語體混用的現象</span>"]]},{"name":"轉話題（正經事）","lines":[["A","冗談をやめて、どうしても手伝ってほしいことがあります。土曜日の朝に2時間をあけてもらえませんか？","Jōdan wo yamete, dō shite mo tetsudatte hoshii koto ga arimasu. Doyōbi no asa ni ni-jikan wo akete moraemasen ka?","嗯…玩笑說到此。我需要幫忙。可否撥給我禮拜六早上兩個鐘頭的時間？","▸ <b>句型</b>：【て形轉場】 ＋【〜てほしい＋こと】連體修飾 ＋【〜てもらえませんか】客氣請求。<br>▸ <b>逐詞拆解</b>：<b>冗談（じょうだん）をやめて</b>＝停止玩笑（て形連接，此處作<b>轉入正題</b>用）；<b>どうしても</b>＝無論如何（與希望、否定呼應）；<b>手伝（てつだ）ってほしいこと</b>＝〜てほしい（希望對方做）<b>直接修飾名詞こと</b>；<b>2時間（にじかん）をあける</b>＝空出兩小時（あける＝他動詞・騰出）；<b>もらえませんか</b>＝もらう的可能形否定疑問（最客氣）。<br>▸ <b>句型公式</b>：<b>［て形］＋ほしいことがあります</b>＝有想請你做的事。例：<b>お願（ねが）いしたいことがあります</b>（有事想拜託）／<b>聞（き）きたいことがあります</b>（有事想問）。<br>▸ <b>用法</b>：「冗談（じょうだん）をやめて」是<b>從閒聊轉入正事</b>的信號，類似中文「說正經的」。「どうしても」強調事情的迫切；「時間（じかん）をあける」是騰出時間的固定搭配。<br>▸ <b>比較</b>：<b>あける</b>（他動詞・我騰出）／<b>あく</b>（自動詞・空著）：<b>時間（じかん）をあける</b>／<b>時間があく</b>。另：<b>〜てもらえませんか</b>（客氣）／<b>〜ていただけませんか</b>（更客氣）／<b>〜てくれない？</b>（常體）。<br><span class=\"n4\">N4 必考：〜てほしい 的連體修飾、自他動詞（あく／あける）</span>"],["B","今週の土曜日？いいですよ。","Konshū no doyōbi? Ii desu yo.","這禮拜六？可以。","▸ <b>句型</b>：【名詞＋？】覆述確認＋【いいですよ】。<br>▸ <b>變化</b>：今週（こんしゅう）の土曜日（どようび）＋？（升調＝確認）。<br>▸ <b>用法</b>：<b>只重複關鍵詞加升調</b>即可表達確認，是很經濟的口語策略。<br>▸ <b>比較</b>：今週（こんしゅう）の土曜日（どようび）？（確認）／今週の土曜日ですか（丁寧確認）／今週の土曜日ですね（確認自己的理解）。<br><span class=\"n4\">N4 聽解必考：重複關鍵詞的確認方式</span>"]]},{"name":"轉話題（提案通過）","lines":[["A","ねえ、主任が僕の提案を認めてくれました。","Nē, shunin ga boku no teian wo mitomete kuremashita.","喂，老闆認同我的提案了。","▸ <b>句型</b>：【ねえ】呼喚＋【が】主語＋【〜てくれる】受惠。<br>▸ <b>變化</b>：認（みと）める → 認めて＋<b>くれました</b>（對方的行為使我受益）。<br>▸ <b>用法</b>：「主任（しゅにん）<b>が</b>」動作者用が；用「〜てくれる」表達感謝的心情（單說「認（みと）めました」則無情緒）。「提案（ていあん）」＝提案。<br>▸ <b>比較</b>：認（みと）めてくれました（他認同了・我很感謝）／認めました（他認同了・客觀）。<br><span class=\"n4\">N4 必考：〜てくれる 的情緒色彩</span>"],["B","おめでとう！そうだ、話が変わるけど、きょう片岡太郎に会った？","Omedetō! Sō da, hanashi ga kawaru kedo, kyō Kataoka Tarō ni atta?","恭喜你！對了，換個話題。今天和片岡太郎見了面沒有？","▸ <b>句型</b>：【おめでとう】＋【そうだ】想起＋【話が変わるけど】明示換題。<br>▸ <b>變化</b>：会（あ）う → 会った（過去）＋？（常體疑問）。<br>▸ <b>用法</b>：「そうだ」表突然想起；「話（はなし）が変（か）わるけど」明白告知要換話題，比ところで更直接；見面對象用<b>に</b>。<br>▸ <b>比較</b>：〜に会（あ）う（見到某人・に）／〜と会う（與某人會面・と，較有約定意味）。<br><span class=\"n4\">N4 必考：会う 的助詞に／と</span>"]]},{"name":"轉話題（正經談話）","lines":[["A","その問題は春男が専門ですが、彼は今日外出しています。","Sono mondai wa Haruo ga senmon desu ga, kare wa kyō gaishutsu shite imasu.","那些問題是春男的專長，但他今天外出不在。","▸ <b>句型</b>：【AはBが〜です】雙主語＋【が】逆接＋【〜ている】。<br>▸ <b>變化</b>：外出（がいしゅつ）する → 外出して＋います（目前不在的狀態）。<br>▸ <b>用法</b>：「その問題（もんだい）は春男（はるお）が専門（せんもん）です」——<b>は提示大主題、が提示小主語</b>，是日語特有的雙層結構。<br>▸ <b>比較</b>：〜は〜が…（大主題＋小主語）例：象（ぞう）は鼻（はな）が長（なが）い。這是 N4 讀解的重要結構。<br><span class=\"n4\">N4 必考：〜は〜が 的雙主語句</span>"],["B","あの、正直に言いますと、あなたと話をしたかったのです。ちょっと時間をいただけますか？","Ano, shōjiki ni iimasu to, anata to hanashi wo shitakatta no desu. Chotto jikan wo itadakemasu ka?","嗯，老實說，希望能跟你談一談。可以打擾你一下嗎？","▸ <b>句型</b>：【〜と】前提＋【〜たかった＋のです】＋【〜をいただけますか】。<br>▸ <b>變化</b>：言（い）う → 言います＋<b>と</b>（＝如果這麼說的話）；話（はなし）をしたい → 話をし<b>たかった</b>（たい的過去）。<br>▸ <b>用法</b>：「正直（しょうじき）に言（い）いますと」＝老實說（と表前提）；「時間（じかん）をいただけますか」＝可以給我一點時間嗎。<br>▸ <b>比較</b>：正直（しょうじき）に言（い）うと（老實說）／実（じつ）は（其實）／申（もう）し上（あ）げにくいのですが（難以開口，但…）。<br><span class=\"n4\">N4 必考：〜と 表前提的用法</span>"],["A","いいですよ。","Ii desu yo.","當然可以。","▸ <b>句型</b>：【いいですよ】爽快答應。<br>▸ <b>變化</b>：いいです＋よ（明確告知許可）。<br>▸ <b>用法</b>：加<b>よ</b>才有積極答應的感覺；不加よ的「いいです」可能被誤解為婉拒。<br>▸ <b>比較</b>：いいですよ（可以啊）／いいです（可能是婉拒！）／もちろんです（當然）。<br><span class=\"n4\">N4 聽解陷阱：いいです／いいですよ 的差異</span>"]]},{"name":"轉話題（演唱會）","lines":[["A","高校の劇公演のときに会えますね？","Kōkō no geki kōen no toki ni aemasu ne?","高中話劇公演時你會來吧？","▸ <b>句型</b>：【〜のときに】時間＋【可能形＋ね？】確認。<br>▸ <b>變化</b>：会（あ）う → 可能形<b>会える</b>（う段→え段＋る）＋ますね？<br>▸ <b>用法</b>：「〜のときに」＝在…的時候（名詞＋の＋とき）；用可能形問「你能來吧」比「来（き）ますね」客氣。「劇公演（げきこうえん）」＝話劇公演。<br>▸ <b>比較</b>：会（あ）えますね（能見到吧・可能形）／会いますね（會見面吧・意志）。可能形<b>不逼問意願</b>。<br><span class=\"n4\">N4 必考：〜のとき／〜たとき／〜るとき 的接續</span>"],["B","必ず行きます。そうだ、チャリティーコンサートに興味ある。","Kanarazu ikimasu. Sō da, charitī konsāto ni kyōmi aru.","我一定不會錯過的，那倒提醒我，你是否對慈善演唱會有興趣？","▸ <b>句型</b>：【必ず】＋【そうだ】想起＋【〜に興味がある】。<br>▸ <b>變化</b>：ある → ある（口語省略了「ますか」）。<br>▸ <b>用法</b>：<b>必（かなら）ず</b>與意志表現呼應；「〜に興味（きょうみ）がある」的對象用に（不是を）。<br>▸ <b>比較</b>：〜に興味（きょうみ）がある（對…有興趣・に）／〜が好（す）きだ（喜歡…・が）／〜を好（この）む（偏好・を，較書面）。<br><span class=\"n4\">N4 必考：興味 的助詞に</span>"],["A","うん、行きます。","Un, ikimasu.","好啊！我要去。","▸ <b>句型</b>：【うん】常體肯定＋【動詞＋ます】。<br>▸ <b>變化</b>：行（い）く → 行きます。<br>▸ <b>用法</b>：常體應答＋丁寧述語的混用，在朋友間很常見。<br>▸ <b>比較</b>：うん（常體肯定）／はい（丁寧）／もちろん（當然）。<br><span class=\"n4\">N4 聽解必考：應答詞的語體</span>"]]},{"name":"轉話題（鞋子）","lines":[["A","素晴らしい旅行でしたね。家族を連れて行くといいわね。","Subarashii ryokō deshita ne. Kazoku wo tsurete iku to ii wa ne.","真的是很棒的旅行耶！你該帶家人去的。","▸ <b>句型</b>：【名詞過去＋ね】＋【辭書形＋と＋いい】建議＋【わね】。<br>▸ <b>變化</b>：素晴（すば）らしい旅行（りょこう）<b>でした</b>（名詞句過去）；連（つ）れて行（い）く ＋ <b>と</b>＋いい（這麼做就好）。<br>▸ <b>用法</b>：「〜といい」在此是<b>柔和的建議</b>（你該帶家人去）；「連（つ）れて行（い）く」＝帶（人）去。<br>▸ <b>比較</b>：〜といい（建議・柔和）／〜たらいい（同義）／〜べきだ（應該・強硬）。<br><span class=\"n4\">N4 必考：〜といい 的建議用法</span>"],["B","ええ、そうだね。で、この前の日曜日にはいていたきれいな靴はどこで買ったの？","Ē, sō da ne. De, kono mae no nichiyōbi ni haite ita kirei na kutsu wa doko de katta no?","嗯！我也這樣想。對了！上禮拜天你穿的鞋子很漂亮，在哪裡買的？","▸ <b>句型</b>：【で】轉換話題＋【〜ていた＋名詞】連體修飾＋【疑問詞＋で】。<br>▸ <b>變化</b>：はく → はいて＋いた（過去的狀態）→ はいていた<b>靴（くつ）</b>（修飾名詞）。<br>▸ <b>用法</b>：「で」是「それで」的省略，用來轉換話題；「どこで買（か）った<b>の</b>？」的の是常體疑問。<br>▸ <b>比較</b>：はいていた靴（くつ）（當時穿著的鞋・狀態）／はいた靴（穿過的鞋・動作）。<b>ていた強調當時的狀態</b>。<br><span class=\"n4\">N4 必考：〜ていた 的連體修飾</span>"],["A","いい靴でしょう。デパートで見つけたの。","Ii kutsu deshō. Depāto de mitsuketa no.","很好看吧？在百貨公司找到的。","▸ <b>句型</b>：【〜でしょう？】徵求同意＋【場所＋で】＋【の】女性語氣。<br>▸ <b>變化</b>：見（み）つける → 見つけた ＋ <b>の</b>（女性的說明語氣）。<br>▸ <b>用法</b>：「いい靴（くつ）でしょう？」升調徵求同意；「デパート<b>で</b>」動作場所用で。<br>▸ <b>比較</b>：見（み）つけた（他動詞・我找到的）／見つかった（自動詞・被我發現）。前者<b>強調自己的努力</b>。<br><span class=\"n4\">N4 必考：見つける／見つかる 的自他配對</span>"]]}]},"23":{"title":"方便接話","jp_title":"会話を進んでいく時の言い方","theme":"自然接話、銜接對話","scenes":[{"name":"想一想（1）","lines":[["A","どのようにして奨学金をもらったらいいのかわかる？","Dono yō ni shite shōgakukin wo morattara ii no ka wakaru?","你知不知道要怎樣才能拿到獎學金？","▸ <b>句型</b>：【どのようにして】方法＋【〜たらいい＋のか】＋【わかる？】。<br>▸ <b>變化</b>：もらう → もらっ<b>たら</b>＋いい ＋ <b>のか</b>（嵌入疑問）＋わかる？<br>▸ <b>用法</b>：「どのようにして」＝以什麼方式（比「どうやって」正式）；「〜たらいいのか」是嵌入的徵詢句。「奨学金（しょうがくきん）」＝獎學金。<br>▸ <b>比較</b>：どのようにして（正式）／どうやって（口語）／どうすれば（一般）。<br><span class=\"n4\">N4 必考：疑問詞＋たらいいか 的嵌入結構</span>"],["B","うーん、そうね。","Ūn, sō ne.","嗯……我想想看。","▸ <b>句型</b>：【うーん】思考＋【そうね】爭取時間。<br>▸ <b>變化</b>：そうですね → そうね（女性常體）。<br>▸ <b>用法</b>：「うーん、そうね」是<b>思考中的填補語</b>，用來爭取時間、避免沉默——日語會話很重視填補沉默。<br>▸ <b>比較</b>：そうね（女性）／そうだね（男女）／そうですね（丁寧）／ええと（想不出來時）。<br><span class=\"n4\">N4 聽解必考：填補語（つなぎ言葉（ことば））</span>"]]},{"name":"想一想（2）","lines":[["A","パーティーには何人参加したの？","Pātī ni wa nannin sanka shita no?","有多少人參加舞會？","▸ <b>句型</b>：【〜には】強調＋【疑問詞＋量詞】＋【の？】。<br>▸ <b>變化</b>：何（なん）＋<b>人（にん）</b>（人數的量詞）；参加（さんか）する → 参加した＋の？<br>▸ <b>用法</b>：「パーティー<b>には</b>」＝に＋は，強調該場合；人數的疑問詞是「何人（なんにん）」。<br>▸ <b>比較</b>：何人（なんにん）（幾人）／いくつ（幾個）／何枚（なんまい）（幾張）／何本（なんぼん）（幾支）。<b>量詞隨物品形狀而變</b>。<br><span class=\"n4\">N4 必考：量詞（助数詞（じょすうし））的使用</span>"],["B","ええと。15人ぐらいだと思うよ。","Ēto. Jūgo-nin gurai da to omou yo.","嗯……我想想看，大概有15個人。","▸ <b>句型</b>：【ええと】填補＋【數量＋ぐらい】＋【だ＋と思う】。<br>▸ <b>變化</b>：15人（じゅうごにん）ぐらい<b>だ</b>＋と思（おも）うよ（名詞句引用要加だ）。<br>▸ <b>用法</b>：<b>ぐらい</b>接數量表大約（ごろ接時間點）；不確定時加「と思（おも）う」較保險。<br>▸ <b>比較</b>：15人ぐらい（約15人・數量）／3時（さんじ）ごろ（3點左右・時間點）。<b>不可互換</b>。<br><span class=\"n4\">N4 必考：ぐらい／ごろ 的區別</span>"]]},{"name":"接話（1）","lines":[["A","箱根には1回行ったことがあります。","Hakone ni wa ikkai itta koto ga arimasu.","我去過箱根一次。","▸ <b>句型</b>：【〜には】＋【次數】＋【〜たことがあります】經驗。<br>▸ <b>變化</b>：行（い）く → 行っ<b>た</b>＋ことがあります（表經驗）。<br>▸ <b>用法</b>：「1回（いっかい）」＝一次（回是次數的量詞）；「箱根（はこね）<b>には</b>」用には強調該地點。<br>▸ <b>比較</b>：〜たことがある（有…的經驗）／〜たことがない（沒有…的經驗）／〜ている（現在的狀態）。<br><span class=\"n4\">N4 必考：〜たことがある 的經驗表現</span>"],["B","ああ、そうですか。それは知りませんでした。いつそこに行きましたか？","Ā, sō desu ka. Sore wa shirimasen deshita. Itsu soko ni ikimashita ka?","喔！真的。我不知道耶，你什麼時候去的？","▸ <b>句型</b>：【そうですか】＋【〜ませんでした】過去否定＋【いつ＋動詞】。<br>▸ <b>變化</b>：知（し）る → 知り<b>ませんでした</b>（過去否定＝原本不知道）。<br>▸ <b>用法</b>：「それは知（し）りませんでした」＝我原本不知道（得知新資訊時的自然反應，<b>用過去式</b>）。<br>▸ <b>比較</b>：知（し）りませんでした（原來不知道・得知後）／知りません（不知道・現在）。<b>時態改變語意</b>。<br><span class=\"n4\">N4 必考：知りませんでした 的時態邏輯</span>"]]},{"name":"接話（2）","lines":[["A","きのう軽井沢に行きました。","Kinō Karuizawa ni ikimashita.","我昨天去了輕井澤。","▸ <b>句型</b>：【時間＋に行きました】。<br>▸ <b>變化</b>：行（い）く → 行きました（過去）。<br>▸ <b>用法</b>：「きのう」<b>不加に</b>（具體日期才加）；目的地用に。「軽井沢（かるいざわ）」是地名。<br>▸ <b>比較</b>：きのう（不加に）／2月10日（にがつとおか）に（加に）／先週（せんしゅう）（不加に）。<b>相對時間不加に</b>。<br><span class=\"n4\">N4 必考：時間名詞加に的規則</span>"],["B","へえ、そうですか。いかがでしたか？","Hē, sō desu ka. Ikaga deshita ka?","喔，是這樣啊？你覺得怎樣？","▸ <b>句型</b>：【へえ】意外＋【いかがでしたか】敬語問感想。<br>▸ <b>變化</b>：どうでしたか → <b>いかがでしたか</b>（敬語形）。<br>▸ <b>用法</b>：「へえ」表意外、感興趣；「いかがでしたか」是問感想的禮貌形。<br>▸ <b>比較</b>：いかがでしたか（敬語）／どうでしたか（一般）／どうだった？（常體）。<br><span class=\"n4\">N4 必考：いかが 是 どう 的敬語</span>"]]},{"name":"接話（名人）","lines":[["A","宮澤首相は、私が話をしたことのあるただ1人の有名人です。","Miyazawa shushō wa, watashi ga hanashi wo shita koto no aru tada hitori no yūmeijin desu.","宮澤首相是我唯一交談過的名人。","▸ <b>句型</b>：【連體修飾句中が→の】 ＋【〜たことがある】經驗 ＋【ただ1人の】限定。<br>▸ <b>逐詞拆解</b>：<b>私（わたし）が話（はなし）をした</b>＝我曾交談過（主句用が）；<b>ことのある</b>＝原為「ことが<b>ある</b>」，在<b>連體修飾句中が可改成の</b> → 話をしたこと<b>の</b>ある；<b>ただ1人（ひとり）の</b>＝唯一一位；<b>有名人（ゆうめいじん）です</b>＝名詞句述語。「首相（しゅしょう）」＝首相。<br>▸ <b>句型公式</b>：<b>［た形］＋ことのある＋名詞</b>＝有過…經驗的（人／事物）。例：<b>日本（にほん）へ行（い）ったことのある人（ひと）</b>（去過日本的人）／<b>読（よ）んだことのある本（ほん）</b>（讀過的書）。<br>▸ <b>用法</b>：這是本課<b>最難的語法點</b>——日語<b>連體修飾句（修飾名詞的句子）裡的主格が可以換成の</b>，這是古典文法的殘留。例：<b>私（わたし）が作（つく）った料理（りょうり）</b>＝<b>私の作った料理</b>（兩者皆可，の較文雅）。<br>▸ <b>比較</b>：<b>〜たことがある</b>（獨立句・我有過經驗）／<b>〜たことのある＋名詞</b>（修飾名詞・有過經驗的…）。前者當述語，後者當修飾語，<b>が／の 的切換是關鍵</b>。<br><span class=\"n4\">N4〜N3：連體修飾中「が→の」的轉換（讀解必備）</span>"],["B","まさか！本当の話なの？彼はどんな人ですか？","Masaka! Hontō no hanashi na no? Kare wa donna hito desu ka?","不是開玩笑吧？你真的和他講過話？他人怎麼樣？","▸ <b>句型</b>：【まさか】難以置信＋【〜なの？】名詞句常體疑問＋【どんな＋名詞】。<br>▸ <b>變化</b>：本当（ほんとう）の話（はなし）です → 本当の話<b>なの</b>？（名詞句常體疑問加な）。<br>▸ <b>用法</b>：「まさか！」表強烈的難以置信；「どんな人（ひと）ですか」＝他是怎樣的人（問性格、特質）。<br>▸ <b>比較</b>：どんな人（ひと）（性格如何）／どの人（哪一個人）／何（なん）の人（× 不自然）。<br><span class=\"n4\">N4 必考：〜なの？ 的名詞句疑問形</span>"]]},{"name":"接話（過夜）","lines":[["A","当日往復なら、ちょっと疲れるでしょう。","Tōjitsu ōfuku nara, chotto tsukareru deshō.","當天往返的話，會很累吧！","▸ <b>句型</b>：【名詞＋なら】條件＋【〜でしょう】推測。<br>▸ <b>變化</b>：当日往復（とうじつおうふく）＋<b>なら</b>（名詞直接接なら，<b>不加だ</b>）；疲（つか）れる ＋ でしょう。<br>▸ <b>用法</b>：<b>なら</b>用於承接對方剛提到的話題當前提；「当日往復（とうじつおうふく）」＝當天來回。<br>▸ <b>比較</b>：〜なら（承接話題・後可接建議）／〜たら（時間先後）／〜ば（條件成立）。<br><span class=\"n4\">N4 必考：なら 的接續（名詞不加だ）</span>"],["B","そうだね。じゃあ、夜はどこに泊ったらいいかな？","Sō da ne. Jā, yoru wa doko ni tomattara ii ka na?","也對，那你想我們應該在哪裡過夜？","▸ <b>句型</b>：【そうだね】＋【疑問詞＋に】＋【〜たらいい＋かな】自問。<br>▸ <b>變化</b>：泊（とま）る → 泊っ<b>たら</b>＋いい＋<b>かな</b>（自問自語）。<br>▸ <b>用法</b>：「どこに泊（とま）る」住宿地點用に；<b>かな</b>是半自問的語氣，比直接問柔和。<br>▸ <b>比較</b>：〜かな（自問・男女皆可）／〜かしら（自問・女性用）／〜だろうか（自問・較書面）。<br><span class=\"n4\">N4 必考：〜かな／〜かしら 的自問語氣</span>"]]},{"name":"接話（申請）","lines":[["A","申請すれば許可がもらえるんじゃないかな。","Shinsei sureba kyoka ga moraeru n ja nai ka na.","假如我們提出申請的話，應該可以獲得許可吧！","▸ <b>句型</b>：【ば形】條件＋【可能形】＋【〜んじゃないかな】委婉推測。<br>▸ <b>變化</b>：申請（しんせい）する → <b>申請すれば</b>（三類ば形）；もらう → 可能形<b>もらえる</b> ＋ <b>んじゃないかな</b>（＝のではないか，委婉推測）。<br>▸ <b>用法</b>：「〜んじゃないかな」是<b>最委婉的推測</b>，把自己的判斷用反問形式提出。「許可（きょか）」＝許可。<br>▸ <b>比較</b>：〜んじゃないかな（委婉推測）／〜と思（おも）う（我認為）／〜だろう（大概）。<br><span class=\"n4\">N4 必考：〜のではないか 的委婉功能</span>"],["B","でも問題は誰か申請しますか。","Demo mondai wa dare ka shinsei shimasu ka.","可是那要誰去申請呢？","▸ <b>句型</b>：【でも】轉折＋【〜は】提示癥結＋【疑問詞＋か】。<br>▸ <b>變化</b>：申請（しんせい）する → 申請します＋か。<br>▸ <b>用法</b>：「問題（もんだい）は〜」用<b>は</b>提示話題，帶出癥結所在；「誰（だれ）か」＝有誰（不特定）。<br>▸ <b>比較</b>：誰（だれ）が（誰・疑問）／誰か（有人・不特定）／誰も（誰都・接否定）。<b>三者功能完全不同</b>。<br><span class=\"n4\">N4 必考：誰が／誰か／誰も 的區別</span>"]]},{"name":"接話（休假）","lines":[["A","有給休暇をとりたいですが。","Yūkyū kyūka wo toritai desu ga.","我想要請年假。","▸ <b>句型</b>：【〜たい】＋【ですが】留白。<br>▸ <b>變化</b>：とる → とり<b>たい</b>（ます形去ます＋たい）＋ですが（留白）。<br>▸ <b>用法</b>：說出希望後用<b>が</b>留白，等待對方回應（不直接說「請准假」）；「有給休暇（ゆうきゅうきゅうか）」＝有薪假。<br>▸ <b>比較</b>：とりたいですが（留白・委婉）／とりたいです（直說）／とらせていただけますか（最謙遜的請求）。<br><span class=\"n4\">N4 必考：〜たいですが 的留白功能</span>"],["B","まぁ、いつも仕事頑張っていますから、取れるでしょう。","Mā, itsumo shigoto ganbatte imasu kara, toreru deshō.","平常你很認真工作，應該請得到吧！","▸ <b>句型</b>：【〜ている縮約】＋【から】理由＋【可能形＋でしょう】推測。<br>▸ <b>變化</b>：頑張（がんば）っている → <b>頑張っています</b>（此處省略助詞を）；とる → 可能形<b>取（と）れる</b> ＋ でしょう。<br>▸ <b>用法</b>：「まぁ」表緩和、安慰；「から」說明理由，「でしょう」表推測。「仕事（しごと）」＝工作。<br>▸ <b>比較</b>：取（と）れるでしょう（應該請得到・推測）／取れます（能請到・斷定）／取れるはずです（理應能・有根據）。<br><span class=\"n4\">N4 必考：可能形＋でしょう 的推測</span>"]]},{"name":"接話（棒球）","lines":[["A","僕の友達はみんなジャイアンツを応援してるけど、僕は阪神タイガースのファンなんだ。","Boku no tomodachi wa minna Jaiantsu wo ōen shiteru kedo, boku wa Hanshin Taigāsu no fan nan da.","我所有的朋友都是巨人隊的球迷，只有我是阪神老虎隊的球迷。","▸ <b>句型</b>：【〜ている縮約】＋【けど】對比＋【〜なんだ】強調。<br>▸ <b>變化</b>：応援（おうえん）している → <b>応援してる</b>（い脫落）；ファンだ → ファン<b>なんだ</b>（＝なのだ，強調說明）。<br>▸ <b>用法</b>：「みんな〜けど、僕（ぼく）は〜」是典型的對比結構；「〜なんだ」強調自己的特殊情況。「阪神（はんしん）タイガース」＝阪神虎隊。<br>▸ <b>比較</b>：〜なんだ（名詞・な形容詞＋なのだ）／〜んだ（動詞・い形容詞＋のだ）。<b>接續不同</b>。<br><span class=\"n4\">N4 必考：〜なんだ／〜んだ 的接續規則</span>"],["B","それは驚きだ！僕もそうだよ。今年、優勝すると思う？","Sore wa odoroki da! Boku mo sō da yo. Kotoshi, yūshō suru to omou?","真的！我也是。你覺得他們今年會得冠軍嗎？","▸ <b>句型</b>：【それは＋名詞＋だ】感嘆＋【も＋そう】＋【〜と思う？】。<br>▸ <b>變化</b>：驚（おどろ）きだ（名詞＋だ）；優勝（ゆうしょう）する ＋ と思（おも）う？<br>▸ <b>用法</b>：「僕（ぼく）もそうだよ」用<b>そう</b>代替重複的內容；「〜と思（おも）う？」問對方的預測。<br>▸ <b>比較</b>：驚（おどろ）きだ（名詞句・驚訝）／驚いた（動詞過去・嚇到了）／びっくりした（口語・嚇一跳）。<br><span class=\"n4\">N4 必考：名詞句的感嘆用法</span>"]]},{"name":"接話（休學）","lines":[["A","学校をやめるつもり？","Gakkō wo yameru tsumori?","你打算休學？","▸ <b>句型</b>：【〜つもり＋？】省略疑問。<br>▸ <b>變化</b>：やめるつもりですか → やめるつもり？（省略ですか，升調）。<br>▸ <b>用法</b>：「学校（がっこう）をやめる」＝休學、退學（離開的對象用<b>を</b>）；名詞句升調即成疑問。<br>▸ <b>比較</b>：学校（がっこう）をやめる（休學）／学校を出（で）る（畢業或離校）／学校を休（やす）む（請假）。<br><span class=\"n4\">N4 必考：〜を＋離脫動詞（やめる・出る・降りる）</span>"],["B","いや、そういうわけではありません。私の言いたかったのは、学校を続けながら働きたいと考えてるの。","Iya, sō iu wake de wa arimasen. Watashi no iitakatta no wa, gakkō wo tsuzukenagara hatarakitai to kangaeteru no.","不，我不是這個意思。我是想要一面唸書一面工作。","▸ <b>句型</b>：【そういうわけではありません】部分否定 ＋【〜のは】名詞化主題 ＋【〜ながら】同時進行。<br>▸ <b>逐詞拆解</b>：<b>そういうわけではありません</b>＝並不是那樣的意思（<b>部分否定</b>，修正對方的誤解）；<b>私（わたし）の言（い）いたかったのは</b>＝言いたい（想說）→過去<b>言いたかった</b>＋<b>の</b>（名詞化）＋は（主題）＝我想說的是；<b>学校（がっこう）を続（つづ）けながら</b>＝ます形＋<b>ながら</b>（一邊…一邊）；<b>働（はたら）きたいと考（かんが）えてる</b>＝と引用想法＋考えている的縮約。<br>▸ <b>句型公式</b>：<b>［ます形］＋ながら</b>＝一邊…一邊…（<b>兩個動作同時進行，主語必須相同</b>）。例：<b>音楽（おんがく）を聞（き）きながら勉強（べんきょう）する</b>（邊聽音樂邊唸書）／<b>働（はたら）きながら大学（だいがく）に通（かよ）う</b>（邊工作邊上大學）。<b>後面的動作才是主要動作</b>。<br>▸ <b>用法</b>：「そういうわけではありません」是<b>澄清誤解的萬用句</b>，語氣比「違（ちが）います」柔和，因為它只否定對方的理解、不否定整件事。<br>▸ <b>比較</b>：<b>〜わけではない</b>（並不是…・部分否定，留有空間）／<b>〜ではない</b>（不是・全面否定）。另：<b>ながら</b>（同時・主語相同）／<b>〜間（あいだ）に</b>（在…期間・主語可不同）。<br><span class=\"n4\">N4 必考：〜ながら 的同時動作（主語須一致）、〜わけではない</span>"],["A","ああ、アルバイトをするということですか。","Ā, arubaito wo suru to iu koto desu ka.","喔，你是說打工啊！","▸ <b>句型</b>：【〜ということですか】換句話說確認。<br>▸ <b>變化</b>：する → する<b>ということですか</b>（＝也就是說…嗎）。<br>▸ <b>用法</b>：把對方的話<b>換句話說再確認</b>，是很成熟的溝通技巧，商務場合尤其重要。<br>▸ <b>比較</b>：〜ということですか（也就是說…嗎）／〜という意味（いみ）ですか（是…的意思嗎）／つまり〜ですか（總之是…嗎）。<br><span class=\"n4\">N4 必考：〜ということだ 的換句話說功能</span>"]]}]}};
const synth = window.speechSynthesis;
let jpVoice = null;
function pickVoice(){
  const vs = synth.getVoices();
  jpVoice = vs.find(v=>v.lang==='ja-JP') || vs.find(v=>v.lang && v.lang.startsWith('ja')) || null;
}
pickVoice();
if(synth.onvoiceschanged !== undefined) synth.onvoiceschanged = pickVoice;

let curBtn = null;
let playingScene = false;
let _speakTimer = null;   // 待發的 speak（cancel 後的 80ms 延遲）
let _cur = null;          // 保住當前 utterance 的引用：Chrome 會把沒人引用的 utterance
                          // 在朗讀途中 GC 掉，造成長句莫名斷掉
let _seq = 0;             // 播放序號：一遞增就讓所有舊的回呼失效

/* 長句分段朗讀。
   Web Speech API 對長 utterance 沒有任何時長保證（Chrome 的 GC 中斷、
   網路語音的十幾秒上限都會砍句子），唯一穩的做法是切成短段依序播。
   先按句末標點切，還太長就按読点切，最後才硬切。 */
function splitJa(text, max, hardMax){
  max = max || 24;          // 打包目標：多個読点小塊合併到這個長度為止
  hardMax = hardMax || 40;  // 絕對上限：只有「單一段落連個読点都沒有」且超過此長度才硬切
                            // （硬切會切在詞中間造成唸錯，所以門檻刻意訂得比 max 寬）
  const HARD = '。！？!?', SOFT = '、，,';
  const out = [];
  const push = s=>{
    if(s.length <= hardMax){ out.push(s); return; }
    while(s.length > hardMax){ out.push(s.slice(0, hardMax)); s = s.slice(hardMax); }
    if(s) out.push(s);
  };
  const cut = (str, marks)=>{                // 依標點切塊，標點留在塊尾
    const r = []; let b = '';
    for(const ch of str){ b += ch; if(marks.indexOf(ch) >= 0){ r.push(b); b = ''; } }
    if(b) r.push(b);
    return r;
  };
  cut(text, HARD).forEach(sent=>{
    sent = sent.trim();
    if(!sent) return;
    if(sent.length <= max){ out.push(sent); return; }
    let acc = '';
    cut(sent, SOFT).forEach(part=>{
      if(acc && (acc + part).length > max){ push(acc); acc = part; }
      else acc += part;
    });
    if(acc) push(acc);
  });
  return out.length ? out : [text];
}

function stopAll(){
  _seq++;
  if(_speakTimer){ clearTimeout(_speakTimer); _speakTimer=null; }
  synth.cancel();
  _cur = null;
  playingScene=false;
  if(curBtn){curBtn.classList.remove('playing');curBtn.textContent='🔊';curBtn=null;}
  document.querySelectorAll('.play').forEach(b=>{b.classList.remove('playing');b.textContent='🔊';});
}

function speak(text, btn, onend){
  const my = ++_seq;   // 先佔號，讓 cancel() 引發的舊回呼立刻失效
  if(_speakTimer){ clearTimeout(_speakTimer); _speakTimer=null; }
  synth.cancel();
  _cur = null;
  if(curBtn && curBtn!==btn){curBtn.classList.remove('playing');curBtn.textContent='🔊';}

  const segs = splitJa(text);
  if(btn){btn.classList.add('playing');btn.textContent='⏸';curBtn=btn;}

  const done = ()=>{
    if(my !== _seq) return;                  // 已被新的播放或停止取代
    _cur = null;
    if(btn){btn.classList.remove('playing');btn.textContent='🔊';}
    if(curBtn===btn) curBtn=null;
    if(onend) onend();
  };

  const step = i=>{
    if(my !== _seq) return;
    if(i >= segs.length){ done(); return; }
    const u = new SpeechSynthesisUtterance(segs[i]);
    u.lang = 'ja-JP';
    u.rate = parseFloat(document.getElementById('speed').value);   // 0.5 ~ 1.2
    u.pitch = 1;
    u.volume = 1;
    if(jpVoice) u.voice = jpVoice;
    u.onend = ()=>{ if(my===_seq) step(i+1); };
    u.onerror = e=>{
      const err = e && e.error;
      if(err && err!=='interrupted' && err!=='canceled')
        console.warn('[speak] 第'+(i+1)+'/'+segs.length+'段中斷:', err, segs[i]);
      if(my===_seq) done();
    };
    _cur = u;            // 這行是防 GC 斷句的關鍵，別拿掉
    synth.speak(u);
  };

  // cancel()需要一點時間才真正生效，延遲80ms再播
  _speakTimer = setTimeout(()=>{ _speakTimer=null; step(0); }, 80);
}

function playScene(lines, btns, i){
  if(i>=lines.length){playingScene=false;return;}
  playingScene=true;
  speak(lines[i], btns[i], ()=>{ if(playingScene) setTimeout(()=>playScene(lines,btns,i+1),350); });
}

function renderSidebar(){
  const sb=document.getElementById('sidebar');
  Object.keys(DATA).forEach(k=>{
    const u=DATA[k];
    const b=document.createElement('button');
    b.className='unit-btn';
    b.innerHTML='<span class="unit-num">'+k+'</span><span class="unit-label">'+u.title+'</span>';
    b.onclick=()=>selectUnit(k,b);
    sb.appendChild(b);
  });
}

function selectUnit(k,btn){
  document.querySelectorAll('.unit-btn').forEach(x=>x.classList.remove('active'));
  btn.classList.add('active');
  stopAll();
  const u=DATA[k];
  const m=document.getElementById('main');
  let h='<div class="unit-head"><h2>單元 '+k+'　'+u.title+'</h2>'
        +'<div class="jp">'+u.jp_title+'</div>'
        +'<div class="theme">📌 '+u.theme+'</div></div>';
  u.scenes.forEach((sc,si)=>{
    h+='<div class="scene"><div class="scene-head">'
      +'<span class="scene-badge">'+(si+1)+'</span>'
      +'<span class="scene-title">'+sc.name+'</span>'
      +'<button class="scene-play" data-u="'+k+'" data-s="'+si+'">▶ 連續播放</button></div>';
    sc.lines.forEach((ln,li)=>{
      const sp=ln[0], jp=ln[1], ro=ln[2], zh=ln[3], gr=ln[4];
      h+='<div class="line">'
        +'<span class="spk '+sp+'">'+sp+'</span>'
        +'<div class="line-body">'
        +'<div class="jp-row"><span class="jp-text">'+jp+'</span>'
        +'<button class="play" data-jp="'+encodeURIComponent(jp)+'" data-u="'+k+'" data-s="'+si+'" data-l="'+li+'">🔊</button></div>'
        +'<div class="romaji">'+ro+'</div>'
        +'<div class="zh">'+zh+'</div>'
        +(gr?'<div class="gram">'+gr+'</div>':'')
        +'</div></div>';
    });
    h+='</div>';
  });
  m.innerHTML=h;
  m.scrollTop=0;
  // 綁定單句
  m.querySelectorAll('.play').forEach(btn=>{
    btn.onclick=e=>{e.stopPropagation();playingScene=false;speak(decodeURIComponent(btn.dataset.jp),btn);};
  });
  // 綁定場景連播
  m.querySelectorAll('.scene-play').forEach(btn=>{
    btn.onclick=e=>{
      e.stopPropagation();
      const ui=btn.dataset.u, si=+btn.dataset.s;
      const sc=DATA[ui].scenes[si];
      const lines=sc.lines.map(l=>l[1]);
      const sceneEl=btn.closest('.scene');
      const btns=[...sceneEl.querySelectorAll('.play')];
      stopAll();
      playingScene=true;
      setTimeout(()=>playScene(lines,btns,0), 150);
    };
  });
}

document.getElementById('speed').oninput=e=>{
  document.getElementById('speedVal').textContent=parseFloat(e.target.value).toFixed(1)+'x';
};
document.getElementById('stopBtn').onclick=()=>{ stopAll(); };

renderSidebar();
selectUnit('1',document.querySelector('.unit-btn'));

/* 回到最上面（#main 才是捲動容器） */
const mainEl=document.getElementById('main');
const toTop=document.getElementById('toTop');
function syncFab(){
  const y=mainEl.scrollTop||window.scrollY||0;
  toTop.classList.toggle('show', y>320);
}
mainEl.addEventListener('scroll',syncFab,{passive:true});
window.addEventListener('scroll',syncFab,{passive:true});
toTop.addEventListener('click',()=>{
  const smooth=!window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const opt=smooth?{top:0,behavior:'smooth'}:{top:0};
  mainEl.scrollTo(opt);
  window.scrollTo(opt);
});
</script>
