<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JLPT N1 單字・文法</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#c0392b; --accent2:#8e44ad;
  --paper:#fbf7f0; --card:#ffffff; --ink:#2b2320; --sub:#6f635b;
  --line:#e7ddcf; --chip:#f1e9dc; --ok:#1e8449; --shadow:0 2px 8px rgba(80,50,30,.08);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  line-height:1.6; -webkit-text-size-adjust:100%;
}
.jp{font-family:"Noto Serif JP","Hiragino Mincho ProN",serif;}
header.top{
  position:sticky; top:0; z-index:30; background:rgba(251,247,240,.96);
  backdrop-filter:blur(6px); border-bottom:1px solid var(--line);
}
.top-in{max-width:1080px;margin:0 auto;padding:12px 16px 0}
.top h1{font-size:1.15rem;margin:0 0 2px;font-weight:700}
.top p{margin:0;color:var(--sub);font-size:.82rem}
.head-row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.head-title{min-width:0}
.head-tools{display:flex;gap:8px;align-items:center;flex:0 0 auto}
.tabs{display:flex;gap:6px;margin-top:10px;flex-wrap:nowrap}
.tab{
  appearance:none;border:1px solid var(--line);background:var(--card);color:var(--sub);
  padding:7px 12px;border-radius:10px 10px 0 0;font-size:1.02rem;font-weight:600;cursor:pointer;
  border-bottom:none;transition:.15s;white-space:nowrap;flex:0 0 auto;
}
.tab.active{color:#fff;background:var(--accent);border-color:var(--accent)}
.toolbar{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search{width:auto;max-width:70vw;display:inline-flex;align-items:center;gap:8px;background:var(--card);
  border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.search input{border:none;outline:none;background:none;font-size:.95rem;color:var(--ink);
  field-sizing:content;width:auto;min-width:2em;max-width:60vw}
.btn-stop{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--sub);
  padding:8px 14px;border-radius:10px;font-weight:600;cursor:pointer}
.btn-stop:hover{border-color:var(--accent);color:var(--accent)}
.chipnav{max-width:1080px;margin:0 auto;padding:0 16px 6px;display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.chipnav a{white-space:nowrap;text-decoration:none;font-size:.8rem;color:var(--sub);
  background:var(--chip);border:1px solid var(--line);padding:5px 11px;border-radius:999px}
.chipnav a:hover{color:var(--accent);border-color:var(--accent)}
main{max-width:1080px;margin:0 auto;padding:8px 16px 80px}
.cat{margin:26px 0 8px;scroll-margin-top:150px}
.cat-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  border-bottom:2px solid var(--accent);padding-bottom:8px;margin-bottom:14px}
.cat-h h2{font-size:1.15rem;margin:0;font-weight:700}
.cat-h .cnt{color:var(--sub);font-size:.8rem;font-weight:500}
.play-all{appearance:none;cursor:pointer;margin-left:auto;border:1px solid var(--accent);
  color:var(--accent);background:transparent;border-radius:999px;padding:6px 14px;font-weight:600;font-size:.85rem;
  display:inline-flex;align-items:center;gap:6px;transition:.15s}
.play-all:hover{background:var(--accent);color:#fff}
.play-all.playing{background:var(--accent);color:#fff}
.play-all.playing .ico::before{content:"■"}
.play-all .ico::before{content:"▶"}
.play-zhja{border-color:var(--accent2);color:var(--accent2)}
.play-zhja:hover{background:var(--accent2);color:#fff}
.play-zhja.playing{background:var(--accent2);color:#fff}
.subhead{font-size:.9rem;font-weight:700;color:var(--accent2);margin:16px 0 8px;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;scroll-margin-top:150px}
.subhead::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;
  box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.card-top{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.word{font-size:1.5rem;font-weight:700;line-height:1.2;cursor:pointer;border:none;background:none;
  color:var(--ink);padding:0;font-family:"Noto Serif JP",serif;text-align:left}
.word:hover{color:var(--accent)}
.idx-badge{color:var(--sub);font-size:.85rem;font-weight:600;margin-right:4px}
.word::after{content:"🔊";font-size:.7rem;margin-left:5px;opacity:.4;vertical-align:middle}
.word:hover::after{opacity:.9}
.word.playing{color:var(--accent);text-decoration:underline}
.kana{color:var(--sub);font-size:.9rem}
.romaji{color:#b7a99a;font-size:.76rem;font-style:italic}
.mean{color:var(--ink);font-size:.92rem}
.mean b{color:var(--accent);font-weight:600}
.ex{margin-top:2px;padding:9px 11px;background:var(--paper);border-radius:10px;border:1px solid var(--line)}
.ex-line{display:flex;align-items:flex-start;gap:8px}
.ex-ja{flex:1;font-family:"Noto Serif JP",serif;font-size:1.02rem;font-weight:600}
.ex-kana{color:var(--sub);font-size:.82rem;margin-top:2px}
.ex-zh{color:var(--sub);font-size:.85rem;margin-top:1px}
.say{appearance:none;flex:none;cursor:pointer;width:30px;height:30px;border-radius:50%;
  border:1px solid var(--accent);color:var(--accent);background:#fff;font-size:.8rem;line-height:1;
  display:inline-flex;align-items:center;justify-content:center;transition:.15s}
.say:hover{background:var(--accent);color:#fff}
.say.playing{background:var(--accent);color:#fff;animation:pulse 1s infinite}
.say::before{content:"▶"}
.say.playing::before{content:"■"}
@keyframes pulse{50%{opacity:.55}}
/* ch3 */
.k-onkun{display:flex;gap:14px;flex-wrap:wrap;font-size:.86rem;color:var(--sub)}
.k-onkun b{color:var(--ink);font-weight:600;margin-right:3px}
.k-rei{font-family:"Noto Serif JP",serif;font-size:.95rem;color:var(--ink)}
.k-rei-line{font-size:.84rem;color:var(--sub);font-family:"Noto Serif JP",serif}
.rei-lbl{display:inline-block;font-family:"Noto Sans TC",sans-serif;font-size:.7rem;
  color:var(--accent2);border:1px solid var(--accent2);border-radius:5px;padding:0 5px;margin-right:6px;vertical-align:middle}
/* 形容詞反義配對 */
.ant{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:6px;padding-top:8px;border-top:1px dashed var(--line)}
.ant-mark{font-size:.7rem;color:var(--accent2);border:1px solid var(--accent2);border-radius:5px;padding:0 6px;font-family:"Noto Sans TC",sans-serif}
.ant .word{font-size:1.2rem}
.ex-ant .ex-ja{font-weight:600}
.ex-ant{border-style:dashed}
/* 五十音卡 */
.kana-card .word{font-size:2.3rem}
.kana-card .card-top{align-items:center}
/* 五十音例句卡（50 tab） */
.k50-row2{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.k50-zh{color:var(--ink);font-size:.92rem}
.hidden{display:none !important}
.empty-note{color:var(--sub);text-align:center;padding:30px}
footer{max-width:1080px;margin:0 auto;padding:16px;color:var(--sub);font-size:.78rem;border-top:1px solid var(--line)}
@media (max-width:640px){
  /* 標題與搜尋維持同一列，搜尋靠右、不換行 */
  .head-row{align-items:center;gap:10px}
  .search input{min-width:0;max-width:52vw}
}
@media (max-width:520px){
  .word{font-size:1.35rem}
  .grid{grid-template-columns:1fr}
  .top h1{font-size:1.02rem}
  .tabs{gap:5px}
  .tab{padding:6px 9px;font-size:.95rem}
}
@media (prefers-reduced-motion:reduce){.say.playing{animation:none}}

/* N1 文法卡 */
.gram-card .word{font-size:1.25rem}
.g-conn{display:flex;gap:8px;flex-wrap:wrap;font-size:.84rem;color:var(--sub);align-items:baseline}
.g-conn b{color:var(--ink);font-weight:600}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="head-row">
      <div class="head-title">
        <h1>JLPT N1 單字・文法</h1>
      </div>
      <div class="head-tools">
        <label class="search">
          <span aria-hidden="true">🔍</span>
          <input id="q" type="search" placeholder="搜尋…" autocomplete="off">
        </label>
      </div>
    </div>
    <div class="tabs">
      <button class="tab active" data-ch="vocab">單字</button>
      <button class="tab" data-ch="grammar">文法</button>
    </div>
  </div>
  <nav class="chipnav" id="chipnav"></nav>
</header>

<main id="main"></main>

<footer>
  <p id="voiceNote"></p>
  <p>發音使用瀏覽器語音合成（Web Speech API，ja-JP）。若無日文語音，請於作業系統或瀏覽器安裝日語語音包；行動裝置需點擊後才會發聲。</p>
</footer>

<script>

 "じけんのてがかりをつかむ。", "exm": "掌握案件的線索。"}, {"w": "糸口", "k": "いとぐち", "r": "itoguchi", "m": "頭緒、線索", "ex": "解決の糸口を探す。", "exk": "かいけつのいとぐちをさがす。", "exm": "尋找解決的頭緒。"}, {"w": "隔たり", "k": "へだたり", "r": "hedatari", "m": "差距、隔閡", "ex": "両者の意見に隔たりがある。", "exk": "りょうしゃのいけんにへだたりがある。", "exm": "雙方意見有隔閡。"}, {"w": "見通し", "k": "みとおし", "r": "mitooshi", "m": "展望、預測", "ex": "今後の見通しは明るい。", "exk": "こんごのみとおしはあかるい。", "exm": "今後的展望樂觀。"}, {"w": "携わる", "k": "たずさわる", "r": "tazusawaru", "m": "從事、參與", "ex": "長年教育に携わる。", "exk": "ながねんきょういくにたずさわる。", "exm": "長年從事教育。"}, {"w": "見据える", "k": "みすえる", "r": "misueru", "m": "正視、盯住", "ex": "将来を見据えて計画する。", "exk": "しょうらいをみすえてけいかくする。", "exm": "著眼未來來規劃。"}, {"w": "兼ねる", "k": "かねる", "r": "kaneru", "m": "兼任、兼具", "ex": "社長は会長を兼ねている。", "exk": "しゃちょうはかいちょうをかねている。", "exm": "社長兼任會長。"}, {"w": "費やす", "k": "ついやす", "r": "tsuiyasu", "m": "花費、耗費", "ex": "多くの時間を費やす。", "exk": "おおくのじかんをついやす。", "exm": "耗費許多時間。"}, {"w": "過密", "k": "かみつ", "r": "kamitsu", "m": "過密", "ex": "過密なスケジュールをこなす。", "exk": "かみつなすけじゅーるをこなす。", "exm": "應付過於緊湊的行程。"}, {"w": "円満", "k": "えんまん", "r": "enman", "m": "圓滿、和睦", "ex": "問題を円満に解決する。", "exk": "もんだいをえんまんにかいけつする。", "exm": "圓滿地解決問題。"}, {"w": "不審", "k": "ふしん", "r": "fushin", "m": "可疑", "ex": "不審な人物を見かける。", "exk": "ふしんなじんぶつをみかける。", "exm": "看到可疑人物。"}, {"w": "大幅", "k": "おおはば", "r": "oohaba", "m": "大幅", "ex": "価格が大幅に上がる。", "exk": "かかくがおおはばにあがる。", "exm": "價格大幅上漲。"}, {"w": "巧み", "k": "たくみ", "r": "takumi", "m": "巧妙、高明", "ex": "言葉巧みに人を誘う。", "exk": "ことばたくみにひとをさそう。", "exm": "花言巧語地誘惑人。"}, {"w": "精巧", "k": "せいこう", "r": "seikou", "m": "精巧", "ex": "精巧な細工が施される。", "exk": "せいこうなさいくがほどこされる。", "exm": "施以精巧的工藝。"}, {"w": "拍子", "k": "ひょうし", "r": "hyoushi", "m": "當…的一瞬；拍子", "ex": "転んだ拍子に手をついた。", "exk": "ころんだひょうしにてをついた。", "exm": "跌倒的瞬間用手撐地。"}, {"w": "弾み", "k": "はずみ", "r": "hazumi", "m": "勢頭；一時衝動", "ex": "話の弾みで約束してしまった。", "exk": "はなしのはずみでやくそくしてしまった。", "exm": "話趕話之下答應了。"}]}]}], "grammar": [{"title": "N1文法 1 ｜ 時間・同時・契機", "groups": [{"sub": "", "items": [{"p": "〜が早いか", "c": "動詞辞書形＋が早いか", "m": "一…就立刻…", "ex": "彼はベルが鳴るが早いか、教室を飛び出した。", "exk": "かれはべるがなるがはやいか、きょうしつをとびだした。", "exm": "鈴聲一響，他就衝出了教室。"}, {"p": "〜や否や", "c": "動詞辞書形＋や否や", "m": "剛一…馬上就…", "ex": "到着するや否や、雨が降り出した。", "exk": "とうちゃくするやいなや、あめがふりだした。", "exm": "一到達就下起雨來。"}, {"p": "〜なり", "c": "動詞辞書形＋なり", "m": "一…就（立即，同一人）", "ex": "彼女は私の顔を見るなり、泣き出した。", "exk": "かのじょはわたしのかおをみるなり、なきだした。", "exm": "她一看到我的臉就哭了出來。"}, {"p": "〜そばから", "c": "動詞辞書形／た形＋そばから", "m": "才剛…就（立刻又）…", "ex": "習ったそばから忘れてしまう。", "exk": "ならったそばからわすれてしまう。", "exm": "才剛學就忘。"}, {"p": "〜てからというもの", "c": "動詞て形＋からというもの", "m": "自從…之後（一直）", "ex": "禁煙してからというもの、体調がよくなった。", "exk": "きんえんしてからというもの、たいちょうがよくなった。", "exm": "自從戒菸以後身體變好了。"}, {"p": "〜を皮切りに", "c": "名詞＋を皮切りに(して)", "m": "以…為開端（陸續）", "ex": "東京公演を皮切りに、全国ツアーが始まった。", "exk": "とうきょうこうえんをかわきりに、ぜんこくつあーがはじまった。", "exm": "以東京公演為開端，展開了全國巡演。"}, {"p": "〜に先立って", "c": "名詞＋に先立って／に先立ち", "m": "在…之前（事先）", "ex": "開会に先立って、注意事項を説明します。", "exk": "かいかいにさきだって、ちゅういじこうをせつめいします。", "exm": "開會之前先說明注意事項。"}, {"p": "〜を機に", "c": "名詞＋を機に／を契機に", "m": "以…為契機", "ex": "入院を機に、生活習慣を見直した。", "exk": "にゅういんをきに、せいかつしゅうかんをみなおした。", "exm": "以住院為契機重新檢視了生活習慣。"}, {"p": "〜折に", "c": "名詞の／動詞＋折に", "m": "在…之際（鄭重）", "ex": "上京の折には、ぜひお立ち寄りください。", "exk": "じょうきょうのおりには、ぜひおたちよりください。", "exm": "來東京時請務必順道來訪。"}, {"p": "〜間際に", "c": "名詞の／動詞辞書形＋間際に", "m": "正要…的時候", "ex": "出発間際に忘れ物に気づいた。", "exk": "しゅっぱつまぎわにわすれものにきづいた。", "exm": "正要出發時發現忘了東西。"}, {"p": "〜が最後", "c": "動詞た形＋が最後", "m": "一旦…就（無法挽回）", "ex": "彼は寝たが最後、朝まで起きない。", "exk": "かれはねたがさいご、あさまでおきない。", "exm": "他一旦睡著就到早上都不會醒。"}, {"p": "〜っぱなし", "c": "動詞ます形＋っぱなし", "m": "一直…著（放任不管）", "ex": "水を出しっぱなしにしないで。", "exk": "みずをだしっぱなしにしないで。", "exm": "別讓水一直開著。"}, {"p": "〜ところを", "c": "名詞の／動詞＋ところを", "m": "正當…的時候（打擾、致歉）", "ex": "お忙しいところを、恐れ入ります。", "exk": "おいそがしいところを、おそれいります。", "exm": "百忙之中打擾您，實在抱歉。"}, {"p": "〜きり", "c": "動詞た形＋きり(だ)", "m": "…之後就再也（沒）…", "ex": "彼とは去年会ったきりだ。", "exk": "かれとはきょねんあったきりだ。", "exm": "跟他去年見過之後就再沒見面。"}, {"p": "〜こととて", "c": "名詞の／動詞＋こととて", "m": "由於…（緣故，鄭重致歉）", "ex": "慣れぬこととて、失礼いたしました。", "exk": "なれぬこととて、しつれいいたしました。", "exm": "因為還不習慣，失禮了。"}, {"p": "〜をもって", "c": "名詞＋をもって", "m": "以…（時間、手段）；於…（結束）", "ex": "本日をもって閉店いたします。", "exk": "ほんじつをもってへいてんいたします。", "exm": "自今日起結束營業。"}]}]}, {"title": "N1文法 2 ｜ 原因・理由・根據", "groups": [{"sub": "", "items": [{"p": "〜ばこそ", "c": "動詞ば形＋こそ", "m": "正因為…才", "ex": "あなたのためを思えばこそ、厳しく言うのだ。", "exk": "あなたのためをおもえばこそ、きびしくいうのだ。", "exm": "正因為為你著想才嚴厲地說。"}, {"p": "〜ゆえに", "c": "名詞（の）／動詞＋ゆえに", "m": "因為…（書面）", "ex": "若さゆえに、無茶をしてしまった。", "exk": "わかさゆえに、むちゃをしてしまった。", "exm": "因為年輕而做了魯莽的事。"}, {"p": "〜とあって", "c": "名詞／動詞＋とあって", "m": "由於…（特殊情況，理所當然）", "ex": "連休とあって、どこも混んでいる。", "exk": "れんきゅうとあって、どこもこんでいる。", "exm": "由於是連假，到處都很擁擠。"}, {"p": "〜手前", "c": "名詞の／動詞＋手前", "m": "因為…（顧及面子、立場）", "ex": "約束した手前、行かないわけにはいかない。", "exk": "やくそくしたてまえ、いかないわけにはいかない。", "exm": "既然答應了，不去也不行。"}, {"p": "〜だけに", "c": "名詞／動詞＋だけに", "m": "正因為…（所以更）", "ex": "期待していただけに、失望も大きい。", "exk": "きたいしていただけに、しつぼうもおおきい。", "exm": "正因為期待，所以失望也大。"}, {"p": "〜だけあって", "c": "名詞／動詞＋だけあって／だけのことはある", "m": "不愧是…；正因…而", "ex": "さすがプロだけあって、仕事が早い。", "exk": "さすがぷろだけあって、しごとがはやい。", "exm": "不愧是專業的，做事很快。"}, {"p": "〜ことだから", "c": "名詞の＋ことだから", "m": "因為是…（所以想必）", "ex": "まじめな彼のことだから、きっと来るだろう。", "exk": "まじめなかれのことだから、きっとくるだろう。", "exm": "因為是認真的他，想必一定會來。"}, {"p": "〜あっての", "c": "名詞＋あっての＋名詞", "m": "有了…才有…（沒有就不成立）", "ex": "読者あっての作家だ。", "exk": "どくしゃあってのさっかだ。", "exm": "有讀者才有作家。"}, {"p": "〜ではあるまいし", "c": "名詞／動詞＋ではあるまいし", "m": "又不是…（所以…）", "ex": "子供じゃあるまいし、自分でやりなさい。", "exk": "こどもじゃあるまいし、じぶんでやりなさい。", "exm": "又不是小孩，自己做。"}, {"p": "〜こそすれ", "c": "名詞／動詞ます形＋こそすれ", "m": "只會…（絕不會相反）", "ex": "感謝こそすれ、恨むはずがない。", "exk": "かんしゃこそすれ、うらむはずがない。", "exm": "只會感謝，絕不會怨恨。"}, {"p": "〜とあれば", "c": "名詞／動詞＋とあれば", "m": "如果是…的話（就）", "ex": "子供のためとあれば、何でもする。", "exk": "こどものためとあれば、なんでもする。", "exm": "若是為了孩子，什麼都願意做。"}, {"p": "〜上は", "c": "動詞辞書形／た形＋上は", "m": "既然…就", "ex": "引き受けた上は、最後までやる。", "exk": "ひきうけたうえは、さいごまでやる。", "exm": "既然接下了，就會做到最後。"}, {"p": "〜ことだし", "c": "動詞／い形／な形＋ことだし", "m": "既然…（理由之一，那就）", "ex": "天気もいいことだし、散歩に行こう。", "exk": "てんきもいいことだし、さんぽにいこう。", "exm": "天氣也不錯，去散步吧。"}, {"p": "〜とあっては", "c": "名詞／動詞＋とあっては", "m": "如果是…這種情況的話", "ex": "恩師の頼みとあっては、断れない。", "exk": "おんしのたのみとあっては、ことわれない。", "exm": "若是恩師的請託，就無法拒絕。"}]}]}, {"title": "N1文法 3 ｜ 逆接・讓步・對比", "groups": [{"sub": "", "items": [{"p": "〜ものの", "c": "動詞／い形／な形（な）／名詞（である）＋ものの", "m": "雖然…但是", "ex": "免許は取ったものの、車がない。", "exk": "めんきょはとったものの、くるまがない。", "exm": "雖然拿到駕照，但沒有車。"}, {"p": "〜ながら(も)", "c": "動詞ます形／い形／な形／名詞＋ながら(も)", "m": "雖然…卻", "ex": "狭いながらも、楽しい我が家だ。", "exk": "せまいながらも、たのしいわがやだ。", "exm": "雖然狹小卻是快樂的家。"}, {"p": "〜つつ(も)", "c": "動詞ます形＋つつ(も)", "m": "儘管…卻（明知故犯）", "ex": "悪いと知りつつ、嘘をついた。", "exk": "わるいとしりつつ、うそをついた。", "exm": "明知不對，卻還是說了謊。"}, {"p": "〜とはいえ", "c": "名詞／動詞／い形／な形＋とはいえ", "m": "雖說…但", "ex": "春とはいえ、まだ寒い。", "exk": "はるとはいえ、まださむい。", "exm": "雖說是春天卻還很冷。"}, {"p": "〜といっても", "c": "名詞／動詞＋といっても", "m": "雖說…（其實沒那麼）", "ex": "料理といっても、卵を焼くだけだ。", "exk": "りょうりといっても、たまごをやくだけだ。", "exm": "雖說是做菜，其實只是煎個蛋。"}, {"p": "〜たところで", "c": "動詞た形＋ところで", "m": "即使…也（沒用）", "ex": "今さら謝ったところで、許してもらえない。", "exk": "いまさらあやまったところで、ゆるしてもらえない。", "exm": "事到如今就算道歉也不會被原諒。"}, {"p": "〜(よ)うと(も)", "c": "動詞意向形＋と(も)", "m": "無論…也", "ex": "何を言われようと、気にしない。", "exk": "なにをいわれようと、きにしない。", "exm": "無論被說什麼都不在意。"}, {"p": "〜(よ)うが〜まいが", "c": "動詞意向形＋が＋辞書形＋まいが", "m": "不管…還是不…", "ex": "行こうが行くまいが、君の自由だ。", "exk": "いこうがいくまいが、きみのじゆうだ。", "exm": "去不去是你的自由。"}, {"p": "〜であれ", "c": "名詞＋であれ／であろうと", "m": "無論是…也", "ex": "どんな理由であれ、暴力は許されない。", "exk": "どんなりゆうであれ、ぼうりょくはゆるされない。", "exm": "無論什麼理由，暴力都不被允許。"}, {"p": "〜であれ〜であれ", "c": "名詞＋であれ＋名詞＋であれ", "m": "無論是…還是…", "ex": "男であれ女であれ、条件は同じだ。", "exk": "おとこであれおんなであれ、じょうけんはおなじだ。", "exm": "無論男女，條件都一樣。"}, {"p": "〜にしても〜にしても", "c": "名詞／動詞＋にしても（重複）", "m": "無論…還是…", "ex": "行くにしても行かないにしても、連絡して。", "exk": "いくにしてもいかないにしても、れんらくして。", "exm": "去或不去都請聯絡我。"}, {"p": "〜にせよ", "c": "名詞／動詞＋にせよ／にしろ", "m": "即使…也；無論", "ex": "冗談にせよ、言っていいことと悪いことがある。", "exk": "じょうだんにせよ、いっていいこととわるいことがある。", "exm": "即使是玩笑，也有該說與不該說的。"}, {"p": "〜からといって", "c": "名詞／動詞／い形／な形＋からといって", "m": "不能因為…就", "ex": "安いからといって、買いすぎてはいけない。", "exk": "やすいからといって、かいすぎてはいけない。", "exm": "不能因為便宜就買太多。"}, {"p": "〜ものを", "c": "動詞／い形／な形＋ものを", "m": "明明…（卻，帶遺憾、責備）", "ex": "早く言えばいいものを、黙っていた。", "exk": "はやくいえばいいものを、だまっていた。", "exm": "早說不就好了，卻悶不吭聲。"}, {"p": "〜といえども", "c": "名詞／動詞＋といえども", "m": "即使…也；雖說是", "ex": "専門家といえども、間違うことはある。", "exk": "せんもんかといえども、まちがうことはある。", "exm": "即使是專家也會出錯。"}, {"p": "〜ならいざしらず", "c": "名詞＋ならいざしらず", "m": "若是…還說得過去，但…", "ex": "子供ならいざしらず、大人がそれではいけない。", "exk": "こどもならいざしらず、おとながそれではいけない。", "exm": "若是小孩也就罷了，大人這樣可不行。"}]}]}, {"title": "N1文法 4 ｜ 附加・並列・附帶", "groups": [{"sub": "", "items": [{"p": "〜のみならず", "c": "名詞／動詞／い形／な形＋のみならず", "m": "不僅…而且", "ex": "彼は英語のみならず、中国語も話せる。", "exk": "かれはえいごのみならず、ちゅうごくごもはなせる。", "exm": "他不僅會英語，還會中文。"}, {"p": "〜ばかりか", "c": "名詞／動詞／い形／な形＋ばかりか", "m": "不僅…甚至", "ex": "彼は挨拶ばかりか、目も合わせない。", "exk": "かれはあいさつばかりか、めもあわせない。", "exm": "他別說打招呼，連眼神都不對。"}, {"p": "〜はもとより", "c": "名詞＋はもとより", "m": "…自不待言，連…也", "ex": "子供はもとより、大人も楽しめる。", "exk": "こどもはもとより、おとなもたのしめる。", "exm": "別說小孩，連大人也能樂在其中。"}, {"p": "〜はおろか", "c": "名詞＋はおろか", "m": "別說…就連…也（多接否定）", "ex": "貯金はおろか、借金まである。", "exk": "ちょきんはおろか、しゃっきんまである。", "exm": "別說存款，甚至還有負債。"}, {"p": "〜もさることながら", "c": "名詞＋もさることながら", "m": "…固然，但更…", "ex": "味もさることながら、値段も魅力的だ。", "exk": "あじもさることながら、ねだんもみりょくてきだ。", "exm": "味道自不用說，價格也很吸引人。"}, {"p": "〜と相まって", "c": "名詞＋と相まって", "m": "與…相結合、相輔相成", "ex": "努力が才能と相まって、成功を収めた。", "exk": "どりょくがさいのうとあいまって、せいこうをおさめた。", "exm": "努力與才能相結合，取得了成功。"}, {"p": "〜かたがた", "c": "名詞＋かたがた", "m": "…順便（兼做，鄭重）", "ex": "お礼かたがた、ご挨拶に伺いました。", "exk": "おれいかたがた、ごあいさつにうかがいました。", "exm": "順便道謝，前來拜訪問候。"}, {"p": "〜がてら", "c": "名詞／動詞ます形＋がてら", "m": "順便…（一舉兩得）", "ex": "散歩がてら、買い物をしてきた。", "exk": "さんぽがてら、かいものをしてきた。", "exm": "散步順便買了東西。"}, {"p": "〜かたわら", "c": "名詞の／動詞辞書形＋かたわら", "m": "一邊…一邊（主業之餘）", "ex": "仕事のかたわら、小説を書いている。", "exk": "しごとのかたわら、しょうせつをかいている。", "exm": "工作之餘也在寫小說。"}, {"p": "〜つ〜つ", "c": "動詞ます形＋つ＋ます形＋つ", "m": "時而…時而…（交替）", "ex": "二人は追いつ追われつ、競い合った。", "exk": "ふたりはおいつおわれつ、きそいあった。", "exm": "兩人你追我趕地競爭。"}, {"p": "〜なり〜なり", "c": "名詞／動詞辞書形＋なり（重複）", "m": "或…或…（任選其一）", "ex": "電話なりメールなり、連絡してください。", "exk": "でんわなりめーるなり、れんらくしてください。", "exm": "打電話或寄信，請聯絡我。"}, {"p": "〜だの〜だの", "c": "名詞／動詞／い形／な形＋だの（重複）", "m": "…啦…啦（列舉，帶厭煩）", "ex": "暑いだの疲れただの、文句ばかりだ。", "exk": "あついだのつかれただの、もんくばかりだ。", "exm": "一下嫌熱一下喊累，滿是抱怨。"}, {"p": "〜といい〜といい", "c": "名詞＋といい＋名詞＋といい", "m": "…也好…也好（無論哪方面）", "ex": "色といいデザインといい、申し分ない。", "exk": "いろといいでざいんといい、もうしぶんない。", "exm": "無論顏色還是設計，都無可挑剔。"}]}]}, {"title": "N1文法 5 ｜ 限定・極限・非…不可", "groups": [{"sub": "", "items": [{"p": "〜をおいて", "c": "名詞＋をおいて(〜ない)", "m": "除了…之外（沒有）", "ex": "この仕事は彼をおいて、他にはできない。", "exk": "このしごとはかれをおいて、ほかにはできない。", "exm": "這工作除了他沒人能做。"}, {"p": "〜ならでは", "c": "名詞＋ならではの＋名詞", "m": "只有…才有的", "ex": "これは職人ならではの技だ。", "exk": "これはしょくにんならではのわざだ。", "exm": "這是只有職人才有的技藝。"}, {"p": "〜きっての", "c": "名詞＋きっての＋名詞", "m": "…之中首屈一指的", "ex": "彼は社内きってのやり手だ。", "exk": "かれはしゃないきってのやりてだ。", "exm": "他是公司裡首屈一指的能人。"}, {"p": "〜に至るまで", "c": "名詞＋に至るまで", "m": "甚至到…（範圍極廣）", "ex": "服装から言葉遣いに至るまで注意される。", "exk": "ふくそうからことばづかいにいたるまでちゅういされる。", "exm": "從服裝到用詞都被叮嚀。"}, {"p": "〜からある", "c": "数量詞＋からある／からの／からする", "m": "多達…（強調數量之大）", "ex": "百キロからある荷物を運んだ。", "exk": "ひゃっきろからあるにもつをはこんだ。", "exm": "搬了重達一百公斤的行李。"}, {"p": "〜たりとも", "c": "数量詞＋たりとも(〜ない)", "m": "連…也（絕不）", "ex": "一瞬たりとも油断できない。", "exk": "いっしゅんたりともゆだんできない。", "exm": "連一瞬也不能大意。"}, {"p": "〜なくして(は)", "c": "名詞＋なくして(は)(〜ない)", "m": "沒有…就（無法）", "ex": "努力なくして成功はない。", "exk": "どりょくなくしてせいこうはない。", "exm": "沒有努力就沒有成功。"}, {"p": "〜ないではすまない", "c": "動詞ない形＋ではすまない／ずにはすまない", "m": "不…是說不過去的", "ex": "壊したのだから、弁償しないではすまない。", "exk": "こわしたのだから、べんしょうしないではすまない。", "exm": "既然弄壞了，不賠是說不過去的。"}, {"p": "〜ずにはおかない", "c": "動詞ない形＋ではおかない／ずにはおかない", "m": "必定…；不…不罷休", "ex": "この映画は人を感動させずにはおかない。", "exk": "このえいがはひとをかんどうさせずにはおかない。", "exm": "這部電影必定令人感動。"}, {"p": "〜を余儀なくされる", "c": "名詞＋を余儀なくされる", "m": "不得不…（被迫）", "ex": "台風で中止を余儀なくされた。", "exk": "たいふうでちゅうしをよぎなくされた。", "exm": "因颱風被迫中止。"}, {"p": "〜を禁じ得ない", "c": "名詞＋を禁じ得ない", "m": "不禁…（湧起某種情感）", "ex": "彼の話に同情を禁じ得ない。", "exk": "かれのはなしにどうじょうをきんじえない。", "exm": "對他的遭遇不禁感到同情。"}, {"p": "〜てやまない", "c": "動詞て形＋やまない", "m": "由衷…不已", "ex": "ご成功を願ってやみません。", "exk": "ごせいこうをねがってやみません。", "exm": "由衷祝願您成功。"}, {"p": "〜に足る", "c": "動詞辞書形／名詞＋に足る／に足りない", "m": "值得…／不值得", "ex": "彼は信頼するに足る人物だ。", "exk": "かれはしんらいするにたるじんぶつだ。", "exm": "他是值得信賴的人。"}, {"p": "〜に堪えない", "c": "名詞／動詞辞書形＋に堪えない／に堪える", "m": "不堪…；不值得…", "ex": "彼の態度は見るに堪えない。", "exk": "かれのたいどはみるにたえない。", "exm": "他的態度令人不堪入目。"}, {"p": "〜といったらない", "c": "名詞／い形／な形＋といったらない／ったらありゃしない", "m": "…得不得了（極端）", "ex": "彼の自慢話はうるさいといったらない。", "exk": "かれのじまんばなしはうるさいといったらない。", "exm": "他的炫耀話煩得不得了。"}]}]}, {"title": "N1文法 6 ｜ 強調・斷定・感情", "groups": [{"sub": "", "items": [{"p": "〜ずにはいられない", "c": "動詞ない形＋ずにはいられない", "m": "忍不住…；不由得", "ex": "この歌を聞くと、泣かずにはいられない。", "exk": "このうたをきくと、なかずにはいられない。", "exm": "一聽這首歌就忍不住哭。"}, {"p": "〜てならない", "c": "動詞て形／い形くて／な形で＋ならない", "m": "…得不得了（自然湧現）", "ex": "将来のことが心配でならない。", "exk": "しょうらいのことがしんぱいでならない。", "exm": "對將來的事擔心得不得了。"}, {"p": "〜限りだ", "c": "い形／な形（な）＋限りだ", "m": "…極了（情感）", "ex": "一人で暮らすのは寂しい限りだ。", "exk": "ひとりでくらすのはさびしいかぎりだ。", "exm": "一個人生活寂寞極了。"}, {"p": "〜極まりない", "c": "な形（語幹）＋極まる／極まりない", "m": "…到極點", "ex": "彼の態度は失礼極まりない。", "exk": "かれのたいどはしつれいきわまりない。", "exm": "他的態度失禮至極。"}, {"p": "〜の至り", "c": "名詞＋の至り", "m": "…之至（鄭重）", "ex": "若気の至りで、恥ずかしい。", "exk": "わかげのいたりで、はずかしい。", "exm": "年少輕狂，很慚愧。"}, {"p": "〜の極み", "c": "名詞＋の極み", "m": "…的極致", "ex": "連日の残業で、疲労の極みだ。", "exk": "れんじつのざんぎょうで、ひろうのきわみだ。", "exm": "連日加班，疲憊到了極點。"}, {"p": "〜といったところだ", "c": "名詞／数量＋といったところだ", "m": "頂多…；大概是", "ex": "参加者はせいぜい十人といったところだ。", "exk": "さんかしゃはせいぜいじゅうにんといったところだ。", "exm": "參加者頂多十人左右。"}, {"p": "〜までだ", "c": "動詞辞書形／た形＋までだ／までのことだ", "m": "大不了就…；只不過是", "ex": "だめなら、また挑戦するまでだ。", "exk": "だめなら、またちょうせんするまでだ。", "exm": "不行的話，大不了再挑戰。"}, {"p": "〜すら", "c": "名詞＋すら／ですら", "m": "連…都", "ex": "専門家ですら答えられない問題だ。", "exk": "せんもんかですらこたえられないもんだいだ。", "exm": "這是連專家都答不出的問題。"}, {"p": "〜こそ", "c": "名詞＋こそ", "m": "正是…；才是", "ex": "今度こそ成功させたい。", "exk": "こんどこそせいこうさせたい。", "exm": "這次一定要成功。"}, {"p": "〜てこそ", "c": "動詞て形＋こそ", "m": "正因…才（能）", "ex": "努力してこそ、成果が得られる。", "exk": "どりょくしてこそ、せいかがえられる。", "exm": "唯有努力才能得到成果。"}, {"p": "〜ばそれまでだ", "c": "動詞ば形／た形＋それまでだ", "m": "一旦…就完了", "ex": "どんなに貯金しても、死ねばそれまでだ。", "exk": "どんなにちょきんしても、しねばそれまでだ。", "exm": "再怎麼存錢，人一死就沒了。"}, {"p": "〜ないまでも", "c": "動詞ない形＋までも", "m": "即使不…也（至少）", "ex": "毎日とは言わないまでも、週一で運動したい。", "exk": "まいにちとはいわないまでも、しゅういちでうんどうしたい。", "exm": "就算不是每天，至少想每週運動一次。"}, {"p": "〜なりに", "c": "名詞／動詞／い形／な形＋なりに／なりの", "m": "與…相應地；以…的方式", "ex": "私なりに精一杯やった。", "exk": "わたしなりにせいいっぱいやった。", "exm": "我以自己的方式盡了全力。"}, {"p": "〜だに", "c": "名詞／動詞辞書形＋だに", "m": "連…也（都）", "ex": "そんな事故は想像するだに恐ろしい。", "exk": "そんなじこはそうぞうするだにおそろしい。", "exm": "那種事故光是想像就令人害怕。"}]}]}, {"title": "N1文法 7 ｜ 評價・立場・觀點", "groups": [{"sub": "", "items": [{"p": "〜にしてみれば", "c": "名詞＋にしてみれば／にしたら", "m": "對…來說（站在其立場）", "ex": "親にしてみれば、子供はいつまでも心配だ。", "exk": "おやにしてみれば、こどもはいつまでもしんぱいだ。", "exm": "對父母而言，孩子永遠都令人擔心。"}, {"p": "〜からすると", "c": "名詞＋からすると／からすれば", "m": "從…來看（判斷根據）", "ex": "この様子からすると、雨になりそうだ。", "exk": "このようすからすると、あめになりそうだ。", "exm": "從這情形看來，好像要下雨了。"}, {"p": "〜からして", "c": "名詞＋からして", "m": "光從…來看（就）", "ex": "態度からして、彼はやる気がない。", "exk": "たいどからして、かれはやるきがない。", "exm": "光看態度，他就沒幹勁。"}, {"p": "〜ともなると", "c": "名詞／動詞＋ともなると／ともなれば", "m": "一旦到了…（就當然）", "ex": "社長ともなると、責任も重い。", "exk": "しゃちょうともなると、せきにんもおもい。", "exm": "一旦當上社長，責任也重。"}, {"p": "〜たる者", "c": "名詞＋たる(者)", "m": "身為…就應該", "ex": "教師たる者、模範であるべきだ。", "exk": "きょうしたるもの、もはんであるべきだ。", "exm": "身為教師就該做榜樣。"}, {"p": "〜ともあろう者が", "c": "名詞＋ともあろう(者が)", "m": "身為…竟然（不該如此）", "ex": "大臣ともあろう者が、そんな失言をするとは。", "exk": "だいじんともあろうものが、そんなしつげんをするとは。", "exm": "身為大臣竟說出那種失言。"}, {"p": "〜にあるまじき", "c": "名詞＋にあるまじき＋名詞", "m": "不該有的（不配…身分）", "ex": "それは教師にあるまじき行為だ。", "exk": "それはきょうしにあるまじきこういだ。", "exm": "那是身為教師不該有的行為。"}, {"p": "〜をもってすれば", "c": "名詞＋をもってすれば", "m": "憑藉…的話（就能）", "ex": "彼の実力をもってすれば、優勝も可能だ。", "exk": "かれのじつりょくをもってすれば、ゆうしょうもかのうだ。", "exm": "憑他的實力，奪冠也有可能。"}, {"p": "〜にかかっている", "c": "名詞／動詞＋か＋にかかっている", "m": "取決於…", "ex": "成功は君の努力にかかっている。", "exk": "せいこうはきみのどりょくにかかっている。", "exm": "成功取決於你的努力。"}, {"p": "〜いかんによっては", "c": "名詞（の）＋いかんによって(は)／いかんだ", "m": "取決於…如何", "ex": "結果いかんによっては、中止もある。", "exk": "けっかいかんによっては、ちゅうしもある。", "exm": "視結果如何，也可能中止。"}, {"p": "〜いかんにかかわらず", "c": "名詞（の）＋いかんにかかわらず／いかんによらず", "m": "無論…如何", "ex": "理由のいかんにかかわらず、遅刻は認めない。", "exk": "りゆうのいかんにかかわらず、ちこくはみとめない。", "exm": "無論理由如何，都不允許遲到。"}, {"p": "〜をよそに", "c": "名詞＋をよそに", "m": "不顧…；無視", "ex": "親の心配をよそに、彼は遊び歩く。", "exk": "おやのしんぱいをよそに、かれはあそびあるく。", "exm": "不顧父母擔心，他四處遊玩。"}, {"p": "〜をものともせず", "c": "名詞＋をものともせず(に)", "m": "不畏…；不當一回事", "ex": "彼は困難をものともせず、進んだ。", "exk": "かれはこんなんをものともせず、すすんだ。", "exm": "他不畏困難地前進。"}, {"p": "〜にかかわる", "c": "名詞＋にかかわる", "m": "關係到…（重大）", "ex": "これは命にかかわる問題だ。", "exk": "これはいのちにかかわるもんだいだ。", "exm": "這是攸關性命的問題。"}]}]}, {"title": "N1文法 8 ｜ 目的・手段・不可避", "groups": [{"sub": "", "items": [{"p": "〜べく", "c": "動詞辞書形＋べく", "m": "為了…（書面）", "ex": "真相を確かめるべく、調査を始めた。", "exk": "しんそうをたしかめるべく、ちょうさをはじめた。", "exm": "為了查明真相，開始了調查。"}, {"p": "〜べからず", "c": "動詞辞書形＋べからず／べからざる", "m": "不得…；不可…（禁止，書面）", "ex": "ここにごみを捨てるべからず。", "exk": "ここにごみをすてるべからず。", "exm": "此處禁止丟棄垃圾。"}, {"p": "〜んがために", "c": "動詞ない形（語幹）＋んがため(に)", "m": "為了…（強烈目的，書面）", "ex": "生きんがために、必死で働いた。", "exk": "いきんがために、ひっしではたらいた。", "exm": "為了活下去而拼命工作。"}, {"p": "〜んばかりに", "c": "動詞ない形（語幹）＋んばかり(に／の／だ)", "m": "幾乎要…的樣子", "ex": "彼女は泣かんばかりに訴えた。", "exk": "かのじょはなかんばかりにうったえた。", "exm": "她幾乎要哭出來地訴說。"}, {"p": "〜てはばからない", "c": "動詞て形＋はばからない", "m": "毫不顧忌地…；公然", "ex": "彼は自分が正しいと公言してはばからない。", "exk": "かれはじぶんがただしいとこうげんしてはばからない。", "exm": "他毫不顧忌地公開宣稱自己是對的。"}, {"p": "〜を余儀なくさせる", "c": "名詞＋を余儀なくさせる", "m": "迫使…（不得不）", "ex": "不況が閉店を余儀なくさせた。", "exk": "ふきょうがへいてんをよぎなくさせた。", "exm": "不景氣迫使店家關門。"}, {"p": "〜ないものでもない", "c": "動詞ない形＋ものでもない／なくもない", "m": "也並非不…；未嘗不", "ex": "事情を聞けば、許さないものでもない。", "exk": "じじょうをきけば、ゆるさないものでもない。", "exm": "若聽了原委，也未嘗不能原諒。"}, {"p": "〜には当たらない", "c": "動詞辞書形／名詞＋に(は)当たらない", "m": "用不著…；不至於", "ex": "その程度のことで驚くには当たらない。", "exk": "そのていどのことでおどろくにはあたらない。", "exm": "那點小事用不著驚訝。"}, {"p": "〜までもない", "c": "動詞辞書形＋までもない", "m": "用不著…；不必", "ex": "言うまでもなく、健康は大切だ。", "exk": "いうまでもなく、けんこうはたいせつだ。", "exm": "不用說，健康很重要。"}, {"p": "〜ばきりがない", "c": "動詞ば形／た形＋きりがない", "m": "…起來沒完沒了", "ex": "欲を言えばきりがない。", "exk": "よくをいえばきりがない。", "exm": "慾望說起來沒完沒了。"}, {"p": "〜てしかるべきだ", "c": "動詞て形＋しかるべきだ", "m": "理應…；應當", "ex": "被害者には補償があってしかるべきだ。", "exk": "ひがいしゃにはほしょうがあってしかるべきだ。", "exm": "受害者理應得到補償。"}, {"p": "〜に越したことはない", "c": "動詞辞書形／い形／な形／名詞＋に越したことはない", "m": "最好是…（沒有更好的）", "ex": "用心するに越したことはない。", "exk": "ようじんするにこしたことはない。", "exm": "小心為上。"}, {"p": "〜ずじまい", "c": "動詞ない形＋ずじまい", "m": "最終沒能…（未實現）", "ex": "忙しくて、旅行に行かずじまいだった。", "exk": "いそがしくて、りょこうにいかずじまいだった。", "exm": "太忙了，最終沒能去旅行。"}, {"p": "〜てはかなわない", "c": "動詞て形＋はかなわない", "m": "…的話受不了", "ex": "こう毎日暑くてはかなわない。", "exk": "こうまいにちあつくてはかなわない。", "exm": "每天這麼熱真受不了。"}]}]}, {"title": "N1文法 9 ｜ 話題・關聯・對應", "groups": [{"sub": "", "items": [{"p": "〜ときたら", "c": "名詞＋ときたら", "m": "說到…（帶不滿、評價）", "ex": "うちの課長ときたら、文句ばかりだ。", "exk": "うちのかちょうときたら、もんくばかりだ。", "exm": "說到我們課長，就只會抱怨。"}, {"p": "〜ともなく", "c": "動詞辞書形／疑問詞＋ともなく／ともなしに", "m": "無意間…；不知…", "ex": "見るともなくテレビを見ていた。", "exk": "みるともなくてれびをみていた。", "exm": "無意間看著電視。"}, {"p": "〜にひきかえ", "c": "名詞（な）の／動詞＋にひきかえ", "m": "與…相反；相比之下", "ex": "兄にひきかえ、弟はよく勉強する。", "exk": "あににひきかえ、おとうとはよくべんきょうする。", "exm": "與哥哥相反，弟弟很用功。"}, {"p": "〜にもまして", "c": "名詞＋にもまして", "m": "比…更；更加", "ex": "去年にもまして、今年は暑い。", "exk": "きょねんにもまして、ことしはあつい。", "exm": "今年比去年更熱。"}, {"p": "〜はさておき", "c": "名詞＋はさておき", "m": "姑且不論…；…暫且不談", "ex": "冗談はさておき、本題に入ろう。", "exk": "じょうだんはさておき、ほんだいにはいろう。", "exm": "玩笑先擱一邊，進入正題吧。"}, {"p": "〜はともかく", "c": "名詞＋はともかく(として)", "m": "姑且不論…；先不管", "ex": "結果はともかく、挑戦したことが大切だ。", "exk": "けっかはともかく、ちょうせんしたことがたいせつだ。", "exm": "結果姑且不論，挑戰過本身很重要。"}, {"p": "〜かというと", "c": "文＋かというと／かといえば", "m": "要說是否…（其實不太）", "ex": "便利かというと、そうでもない。", "exk": "べんりかというと、そうでもない。", "exm": "要說方便嗎，其實也不盡然。"}, {"p": "〜ならまだしも", "c": "名詞／動詞＋ならまだしも", "m": "若是…還好，但…", "ex": "一度ならまだしも、二度も遅刻するとは。", "exk": "いちどならまだしも、にどもちこくするとは。", "exm": "一次也就算了，竟遲到兩次。"}, {"p": "〜こそあれ", "c": "名詞／い形（く）／な形＋こそあれ", "m": "雖有…但；只有…（無其他）", "ex": "感謝の気持ちこそあれ、不満は一切ない。", "exk": "かんしゃのきもちこそあれ、ふまんはいっさいない。", "exm": "只有感謝，毫無不滿。"}, {"p": "〜たら〜で", "c": "動詞・形容詞條件形＋同語＋で", "m": "…也有…的（另一種困擾）", "ex": "金がないと困るが、あったらあったで悩みがある。", "exk": "かねがないとこまるが、あったらあったでなやみがある。", "exm": "沒錢很煩，有錢也有有錢的煩惱。"}, {"p": "〜というもの", "c": "期間を表す名詞＋というもの", "m": "整整…（強調長時間）", "ex": "この一週間というもの、雨ばかりだ。", "exk": "このいっしゅうかんというもの、あめばかりだ。", "exm": "這一整個星期都在下雨。"}, {"p": "〜ないことには", "c": "動詞ない形＋ことには(〜ない)", "m": "不…的話就（不）", "ex": "実際に見ないことには、判断できない。", "exk": "じっさいにみないことには、はんだんできない。", "exm": "不實際看看就無法判斷。"}, {"p": "〜てはいられない", "c": "動詞て形＋はいられない", "m": "不能一直…；坐不住", "ex": "のんびりしてはいられない。", "exk": "のんびりしてはいられない。", "exm": "不能再悠哉下去了。"}, {"p": "〜が関の山だ", "c": "名詞／動詞辞書形＋が関の山だ", "m": "頂多…（能力的極限）", "ex": "私の力では、入賞が関の山だ。", "exk": "わたしのちからでは、にゅうしょうがせきのやまだ。", "exm": "以我的能力，頂多入圍。"}]}]}, {"title": "N1文法 10 ｜ 樣態・傾向・推量", "groups": [{"sub": "", "items": [{"p": "〜とばかりに", "c": "名詞／文＋とばかりに", "m": "一副…的樣子；彷彿在說", "ex": "彼は帰れとばかりに、ドアを開けた。", "exk": "かれはかえれとばかりに、どあをあけた。", "exm": "他一副「快回去」的樣子打開了門。"}, {"p": "〜ながらに", "c": "名詞／動詞ます形＋ながらに(して)", "m": "保持…狀態；生來就", "ex": "彼女は生まれながらにして才能があった。", "exk": "かのじょはうまれながらにしてさいのうがあった。", "exm": "她生來就有才能。"}, {"p": "〜まみれ", "c": "名詞＋まみれ", "m": "滿是…（髒污、附著）", "ex": "子供は泥まみれになって遊んだ。", "exk": "こどもはどろまみれになってあそんだ。", "exm": "孩子玩得滿身泥巴。"}, {"p": "〜ずくめ", "c": "名詞＋ずくめ", "m": "淨是…；一色", "ex": "今年はいいことずくめだった。", "exk": "ことしはいいことずくめだった。", "exm": "今年淨是好事。"}, {"p": "〜めく", "c": "名詞＋めく", "m": "帶有…的樣子；有…氣息", "ex": "日ごとに春めいてきた。", "exk": "ひごとにはるめいてきた。", "exm": "日漸有了春意。"}, {"p": "〜きらいがある", "c": "動詞辞書形／名詞の＋きらいがある", "m": "有…的傾向（負面）", "ex": "彼は物事を悲観的に考えるきらいがある。", "exk": "かれはものごとをひかんてきにかんがえるきらいがある。", "exm": "他有把事情往壞處想的傾向。"}, {"p": "〜げだ", "c": "い形／な形（語幹）＋げ(だ)", "m": "顯得…的樣子", "ex": "子供が寂しげにこちらを見ている。", "exk": "こどもがさびしげにこちらをみている。", "exm": "孩子顯得寂寞地看著這邊。"}, {"p": "〜っこない", "c": "動詞ます形＋っこない", "m": "絕不可能…（口語）", "ex": "そんな話、信じられっこない。", "exk": "そんなはなし、しんじられっこない。", "exm": "那種事絕不可能相信。"}, {"p": "〜に難くない", "c": "名詞／動詞辞書形＋に難くない", "m": "不難…（想像、推測）", "ex": "彼の気持ちは想像に難くない。", "exk": "かれのきもちはそうぞうにかたくない。", "exm": "他的心情不難想像。"}, {"p": "〜かねる", "c": "動詞ます形＋かねる", "m": "難以…；無法", "ex": "その件については、お答えしかねます。", "exk": "そのけんについては、おこたえしかねます。", "exm": "關於那件事，恕難回答。"}, {"p": "〜かねない", "c": "動詞ます形＋かねない", "m": "有可能…（負面結果）", "ex": "そんな運転では、事故を起こしかねない。", "exk": "そんなうんてんでは、じこをおこしかねない。", "exm": "那樣開車有可能會出事。"}, {"p": "〜とみえて", "c": "文＋とみえる／とみえて", "m": "看來…（依觀察推測）", "ex": "留守とみえて、返事がない。", "exk": "るすとみえて、へんじがない。", "exm": "看來不在家， /* ---------------- render ---------------- */
const main = document.getElementById('main');
const chipnav = document.getElementById('chipnav');
const esc = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
let current = 'vocab';

function meanHTML(m){ return esc(m).replace(/（([^）]*)）/g,'<span style="color:var(--sub);font-size:.85em">（$1）</span>'); }

function cardVOCAB(it, idx){
  const romaji = it.r ? `<span class="romaji">${esc(it.r)}</span>` : '';
  const numBadge = idx ? `<span class="idx-badge">${idx}.</span>` : '';
  return `<div class="card" data-s="${esc((it.w+it.k+it.r+it.m+it.ex).toLowerCase())}" data-mean="${esc(it.m)}">
    <div class="card-top">
      ${numBadge}<button class="word jp" data-text="${esc(it.k||it.w)}" title="點擊發音">${esc(it.w)}</button>
      <span class="kana jp">${esc(it.k)}</span>${romaji}
    </div>
    <div class="mean">${meanHTML(it.m)}</div>
    <div class="ex">
      <div class="ex-line">
        <div class="ex-ja jp">${esc(it.ex)}</div>
        <button class="say ex" data-text="${esc(it.ex)}" title="播放例句"></button>
      </div>
      <div class="ex-kana jp">${esc(it.exk)}</div>
      <div class="ex-zh">${esc(it.exm)}</div>
    </div>
  </div>`;
}

function cardGRAMMAR(it, idx){
  const numBadge = idx ? `<span class="idx-badge">${idx}.</span>` : '';
  return `<div class="card gram-card" data-s="${esc((it.p+it.c+it.m+it.ex).toLowerCase())}" data-mean="${esc(it.m)}">
    <div class="card-top">
      ${numBadge}<button class="word jp" data-text="${esc(it.ex)}" title="點擊發音（例句）">${esc(it.p)}</button>
    </div>
    <div class="g-conn"><b>接続</b><span>${esc(it.c)}</span></div>
    <div class="mean">${meanHTML(it.m)}</div>
    <div class="ex">
      <div class="ex-line">
        <div class="ex-ja jp">${esc(it.ex)}</div>
        <button class="say ex" data-text="${esc(it.ex)}" title="播放例句"></button>
      </div>
      <div class="ex-kana jp">${esc(it.exk)}</div>
      <div class="ex-zh">${esc(it.exm)}</div>
    </div>
  </div>`;
}

const RENDER = { vocab:cardVOCAB, grammar:cardGRAMMAR };
function render(ch){
  current = ch;
  const cats = DATA[ch] || [];
  const cardFn = RENDER[ch] || cardVOCAB;
  const multiCat = cats.length > 1;
  let html = '', chips = '';
  cats.forEach((c,ci)=>{
    const id = ch+'-'+ci;
    const groups = c.groups || [{sub:null, items:(c.items||[])}];
    const count = groups.reduce((n,g)=>n+g.items.length,0);
    if(multiCat){
      const short = c.title.replace(/（[^）]*）/,'');
      chips += `<a href="#${id}">${esc(short)}</a>`;
    }
    const playBtns = ch === 'grammar'
      ? `<button class="play-all"><span class="ico"></span> 全部播放例句（中→日）</button>
        <button class="play-all play-ja"><span class="ico"></span> 全部播放例句（日）</button>`
      : `<button class="play-all"><span class="ico"></span> 全部播放例句（中→日）</button>
        <button class="play-all play-zhja"><span class="ico"></span> 播放中日</button>`;
    html += `<section class="cat" id="${id}">
      <div class="cat-h">
        <h2 class="jp">${esc(c.title)}</h2>
        <span class="cnt">${count} 項</span>
        ${playBtns}
      </div>`;
    let idxCounter = 0;
    groups.forEach((g,gi)=>{
      const gid = id+'-g'+gi;
      const gridId = gid+'-grid';
      if(g.sub){
        html += `<div class="subhead" id="${gid}">${esc(g.sub)}</div>`;
        if(!multiCat) chips += `<a href="#${gid}">${esc(g.sub)}</a>`;
      }
      html += `<div class="grid" id="${gridId}">` + g.items.map(it=>cardFn(it, ++idxCounter)).join('') + '</div>';
    });
    html += '</section>';
  });
  main.innerHTML = html;
  chipnav.innerHTML = chips;
  chipnav.style.display = chips ? '' : 'none';
  applyFilter(document.getElementById('q').value);
}

/* search filter */
const q = document.getElementById('q');
function applyFilter(v){
  v = (v||'').trim().toLowerCase();
  document.querySelectorAll('#main .card').forEach(card=>{
    card.classList.toggle('hidden', v && !card.dataset.s.includes(v));
  });
  document.querySelectorAll('#main .cat').forEach(sec=>{
    const any = sec.querySelector('.card:not(.hidden)');
    sec.classList.toggle('hidden', !any);
  });
}
q.addEventListener('input', e=>applyFilter(e.target.value));

/* ---------------- speech ---------------- */
const supported = 'speechSynthesis' in window;
let jaVoice = null;
let zhVoice = null;
function pickVoice(){
  const vs = speechSynthesis.getVoices();
  jaVoice = vs.find(v=>/ja(-|_)?/i.test(v.lang)) || vs.find(v=>/japanese/i.test(v.name)) || null;
  zhVoice = vs.find(v=>/zh-TW|zh_TW|Hant/i.test(v.lang+v.name)) || vs.find(v=>/zh(-|_)?/i.test(v.lang)) || null;
  const note = document.getElementById('voiceNote');
  if(!supported){ note.textContent='⚠ 此瀏覽器不支援語音合成，發音按鈕已停用。'; }
  else if(jaVoice){ note.textContent='🔊 目前日語語音：'+jaVoice.name; }
  else { note.textContent='🔊 語音已就緒（未偵測到專用日語語音，將使用預設語音）。'; }
}
if(supported){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }

let runId = 0;
function stopAll(){
  runId++;
  if(supported) speechSynthesis.cancel();
  document.querySelectorAll('.say.playing, .word.playing, .play-all.playing').forEach(b=>b.classList.remove('playing'));
}
function makeUtter(text, lang){
  lang = lang || 'ja-JP';
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang; u.rate = 0.9;
  if(lang.startsWith('ja')){
    if(!jaVoice) pickVoice();
    if(jaVoice) u.voice = jaVoice;
  } else if(lang.startsWith('zh')){
    if(zhVoice) u.voice = zhVoice;
  }
  return u;
}
function speakOne(btn){
  const text = btn.dataset.text||'';
  stopAll();
  if(!text || !supported) return;
  const my = runId;
  btn.classList.add('playing');
  const u = makeUtter(text);
  u.onend = u.onerror = ()=>{ if(my===runId) btn.classList.remove('playing'); };
  speechSynthesis.speak(u);
}
const SEQUENCE_GAP_MS = 800;
function speakSequence(btn, items){
  const was = btn.classList.contains('playing');
  stopAll();
  if(was || !supported || !items.length) return;
  const my = runId;
  btn.classList.add('playing');
  let i=0;
  (function next(){
    if(my!==runId) return;
    if(i>=items.length){ btn.classList.remove('playing'); return; }
    const {text,lang} = items[i++];
    const u = makeUtter(text, lang);
    u.onend = ()=>{ if(my===runId) setTimeout(next, SEQUENCE_GAP_MS); };
    u.onerror = ()=>{ if(my===runId) btn.classList.remove('playing'); };
    speechSynthesis.speak(u);
  })();
}
function collectExamplesZhJa(container){
  const items = [];
  container.querySelectorAll('.card:not(.hidden)').forEach(card=>{
    const zh = card.querySelector('.ex-zh')?.textContent;
    const ja = card.querySelector('.say.ex')?.dataset.text;
    if(zh) items.push({text:zh, lang:'zh-TW'});
    if(ja) items.push({text:ja, lang:'ja-JP'});
  });
  return items;
}
function collectExamplesJa(container){
  return [...container.querySelectorAll('.card:not(.hidden) .say.ex')]
    .map(b=>b.dataset.text).filter(Boolean).map(text=>({text, lang:'ja-JP'}));
}
function collectWordMeanJaZh(container){
  const items = [];
  container.querySelectorAll('.card:not(.hidden)').forEach(card=>{
    const mean = card.dataset.mean;
    const word = card.querySelector('.word')?.dataset.text;
    if(word) items.push({text:word, lang:'ja-JP'});
    if(mean) items.push({text:mean, lang:'zh-TW'});
  });
  return items;
}
function speakSection(btn){ speakSequence(btn, collectExamplesZhJa(btn.closest('.cat'))); }
function speakSectionJa(btn){ speakSequence(btn, collectExamplesJa(btn.closest('.cat'))); }
function speakZhJa(btn){ speakSequence(btn, collectWordMeanJaZh(btn.closest('.cat'))); }
document.addEventListener('click', e=>{
  const pja = e.target.closest('.play-ja');
  if(pja){ speakSectionJa(pja); return; }
  const pz = e.target.closest('.play-zhja');
  if(pz){ speakZhJa(pz); return; }
  const pa = e.target.closest('.play-all');
  if(pa){ speakSection(pa); return; }
  const s = e.target.closest('.say, .word');
  if(s){ speakOne(s); return; }
});

/* init */
render('vocab');

</script>
</body>
